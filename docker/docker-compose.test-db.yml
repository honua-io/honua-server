name: honua-test-db

services:
  # External PostGIS database for contributors who want a reusable local test DB
  postgis-test:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: honua_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --data-checksums"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRESQL_CONF_ssl: "on"
      POSTGRESQL_CONF_password_encryption: "scram-sha-256"
      POSTGRESQL_CONF_log_connections: "on"
      POSTGRESQL_CONF_log_disconnections: "on"
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d honua_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_test_data:

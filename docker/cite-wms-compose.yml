services:
  honua-server:
    image: honua-server:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - PUBLIC_BASE_URL=http://honua-server:8080
      - HostValidation__AllowedHosts__0=honua-server
      - HostValidation__AllowedHosts__1=localhost
      - HONUA_ADMIN_PASSWORD=CiteAdminPassword123!
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=honua_cite_wms;User Id=postgres;Password=cite_password;
      - ConnectionStrings__honua=Server=postgres;Port=5432;Database=honua_cite_wms;User Id=postgres;Password=cite_password;
      - ConnectionStrings__Redis=redis:6379
      - Security__ConnectionEncryption__MasterKey=test-master-key-that-is-at-least-32-characters-long-for-security
      - Security__ConnectionEncryption__Salt=dGVzdC1zYWx0LWZvci1lbmNyeXB0aW9uLXRlc3RpbmctcHVycG9zZXM=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cite-wms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_DB=honua_cite_wms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cite_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5435:5432"
    networks:
      - cite-wms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly no
    networks:
      - cite-wms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cite-engine:
    image: ogccite/ets-wms13:1.34-teamengine-6.0.0-RC2
    ports:
      - "8083:8080"
    environment:
      - JAVA_OPTS=-Xmx2g -DTE_BASE=/root/te_base
      - TEAMENGINE_BASE_URL=http://cite-engine:8080/teamengine
    volumes:
      - cite-wms-logs:/root/te_base/users/cite/logs
      - ./cite-wms-config:/cite-config:ro
    networks:
      - cite-wms-network
    depends_on:
      honua-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/teamengine"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cite-runner:
    image: ogccite/ets-wms13:1.34-teamengine-6.0.0-RC2
    environment:
      - WMS_CAPABILITIES_URL
      - WMS_UPDATESEQUENCE
      - WMS_HIGH_UPDATESEQUENCE
      - WMS_LOW_UPDATESEQUENCE
      - WMS_BASIC
      - WMS_QUERYABLE
      - WMS_RASTER_ELEVATION
      - WMS_VECTOR_ELEVATION
      - WMS_TIME
      - WMS_RECOMMENDED
    command:
      - bash
      - -lc
      - |
          set -euo pipefail
          WMS_CAPABILITIES_URL="$${WMS_CAPABILITIES_URL:-http://honua-server:8080/rest/services/cite/MapServer/WMS?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0}"
          WMS_UPDATESEQUENCE="$${WMS_UPDATESEQUENCE:-auto}"
          WMS_HIGH_UPDATESEQUENCE="$${WMS_HIGH_UPDATESEQUENCE:-}"
          WMS_LOW_UPDATESEQUENCE="$${WMS_LOW_UPDATESEQUENCE:-}"
          WMS_BASIC="$${WMS_BASIC:-false}"
          WMS_QUERYABLE="$${WMS_QUERYABLE:-false}"
          WMS_RASTER_ELEVATION="$${WMS_RASTER_ELEVATION:-false}"
          WMS_VECTOR_ELEVATION="$${WMS_VECTOR_ELEVATION:-false}"
          WMS_TIME="$${WMS_TIME:-false}"
          WMS_RECOMMENDED="$${WMS_RECOMMENDED:-false}"
          echo 'Waiting for services to be ready...'
          sleep 30
          echo 'Preparing TeamEngine console...'
          curl -sS --fail --retry 5 --retry-delay 2 --retry-all-errors -L -o /tmp/teamengine-console-6.0.0-RC2-bin.zip https://repo1.maven.org/maven2/org/opengis/cite/teamengine/teamengine-console/6.0.0-RC2/teamengine-console-6.0.0-RC2-bin.zip
          unzip -q /tmp/teamengine-console-6.0.0-RC2-bin.zip -d /tmp/te-console
          mkdir -p /root/te_base/resources/lib /root/te_base/scripts
          mkdir -p /root/te_base/users/cite/logs
          rm -rf /root/te_base/scripts/wms13
          unzip -qo -j /root/ets-wms13-*-deps.zip -d /root/te_base/resources/lib || true
          unzip -qo /root/ets-wms13-*-ctl.zip -d /root/te_base/scripts || true
          export TE_BASE=/root/te_base
          echo 'Starting WMS 1.3 CITE conformance tests...'
          /tmp/te-console/bin/unix/test.sh \
            -source=/root/te_base/scripts/wms13/1.3.0/ctl/main-auto.xml \
            -test=main:main-auto \
            "@capabilities-url=$${WMS_CAPABILITIES_URL}" \
            "@updatesequence=$${WMS_UPDATESEQUENCE}" \
            "@high-updatesequence=$${WMS_HIGH_UPDATESEQUENCE}" \
            "@low-updatesequence=$${WMS_LOW_UPDATESEQUENCE}" \
            "@basic=$${WMS_BASIC}" \
            "@queryable=$${WMS_QUERYABLE}" \
            "@raster_elevation=$${WMS_RASTER_ELEVATION}" \
            "@vector_elevation=$${WMS_VECTOR_ELEVATION}" \
            "@time=$${WMS_TIME}" \
            "@recommended=$${WMS_RECOMMENDED}" \
            -logdir=users/cite/logs \
            -session=cite-wms-session-$(date +%Y%m%d-%H%M%S)
          echo 'CITE tests completed. Check results in logdir.'
    volumes:
      - cite-wms-results:/root/te_base/users/cite/logs
      - ./cite-wms-config:/cite-config:ro
    networks:
      - cite-wms-network
    depends_on:
      cite-engine:
        condition: service_healthy
    profiles:
      - test

volumes:
  cite-wms-logs:
    driver: local
  cite-wms-results:
    driver: local

networks:
  cite-wms-network:
    driver: bridge

events {
    worker_connections 1024;
}

http {
    upstream honua_backend {
        # Load balancing method: least_conn for better distribution
        least_conn;

        # Honua instances (Docker Compose will resolve these)
        server honua-server-honua-1:8080 max_fails=3 fail_timeout=30s;
        server honua-server-honua-2:8080 max_fails=3 fail_timeout=30s;
        server honua-server-honua-3:8080 max_fails=3 fail_timeout=30s;

        # Keep connections alive
        keepalive 32;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    server {
        listen 80;
        server_name _;

        # Rate limiting for APIs
        limit_req zone=api burst=20 nodelay;

        # Health check endpoint (bypass load balancer)
        location /healthz {
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            access_log off;
        }

        # Main API endpoints with caching headers
        location /rest/ {
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;

            # Connection settings
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;

            # Keep-alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Cache configuration for metadata endpoints
            location ~* /rest/services/.*/FeatureServer$ {
                proxy_pass http://honua_backend;
                proxy_cache_valid 200 5m;
                add_header X-Cache-Status $upstream_cache_status;
                add_header X-Instance-ID $upstream_addr always;
                expires 5m;
            }
        }

        # OData endpoints
        location /odata/ {
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # OGC API endpoints
        location /ogc/ {
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Admin endpoints (sticky sessions for better UX)
        location /admin/ {
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Metrics endpoint (for Prometheus)
        location /metrics {
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default location
        location / {
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

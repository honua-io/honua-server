services:
  honua-server:
    image: honua-server:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      secrets:
        - github_actor
        - github_token
    ports:
      - "${HONUA_CNG_SERVER_PORT:-8094}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Test
      - ASPNETCORE_URLS=http://+:8080
      - PUBLIC_BASE_URL=${HONUA_CNG_PUBLIC_BASE_URL:-http://localhost:${HONUA_CNG_SERVER_PORT:-8094}}
      - HONUA_DEV_AUTH=true
      - HONUA_REGISTER_TEST_INFRASTRUCTURE=true
      - Cache__Enabled=false
      - DataSource__Provider=postgres
      - HostValidation__Enabled=false
      - HostValidation__AllowedHosts__0=honua-server
      - HostValidation__AllowedHosts__1=localhost
      - HONUA_ADMIN_PASSWORD=CngAdminPassword123!
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=honua_cng;User Id=postgres;Password=cng_password;
      - ConnectionStrings__honua=Server=postgres;Port=5432;Database=honua_cng;User Id=postgres;Password=cng_password;
      - ConnectionStrings__Redis=redis:6379
      # Real supported PMTiles proxy path through the configured S3 backend.
      # These credentials belong only to the ephemeral LocalStack fixture.
      - FileStorage__Provider=AwsS3
      - FileStorage__AwsS3__BucketName=honua-cng-fixtures
      - FileStorage__AwsS3__Region=us-east-1
      - FileStorage__AwsS3__ServiceUrl=http://localstack:4566
      - FileStorage__AwsS3__ForcePathStyle=true
      - FileStorage__AwsS3__AccessKeyId=test
      - FileStorage__AwsS3__SecretAccessKey=test
      - FileStorage__AwsS3__EnableServerSideEncryption=false
      - FileStorage__PMTilesPublish__KeyPrefix=pmtiles
      - Security__ConnectionEncryption__MasterKey=test-master-key-that-is-at-least-32-characters-long-for-security
      - Security__ConnectionEncryption__Salt=dGVzdC1zYWx0LWZvci1lbmNyeXB0aW9uLXRlc3RpbmctcHVycG9zZXM=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - cng-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "-T", "5", "-O", "/dev/null", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_DB=honua_cng
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cng_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "${HONUA_CNG_POSTGRES_PORT:-5435}:5432"
    networks:
      - cng-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly no
    networks:
      - cng-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.6.0
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    networks:
      - cng-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -Eq '\"s3\"[[:space:]]*:[[:space:]]*\"(available|running)\"'"]
      interval: 5s
      timeout: 5s
      retries: 24

networks:
  cng-network:
    driver: bridge

secrets:
  github_actor:
    file: ${HONUA_GITHUB_ACTOR_SECRET_FILE:-.empty-build-secret}
  github_token:
    file: ${HONUA_GITHUB_TOKEN_SECRET_FILE:-.empty-build-secret}

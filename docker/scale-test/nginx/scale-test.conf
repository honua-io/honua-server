events {
    worker_connections 1024;
}

http {
    upstream honua_backend {
        zone honua_backend 64k;
        least_conn;
        server honua:8080 max_fails=3 fail_timeout=30s;
        server honua:8080 max_fails=3 fail_timeout=30s;
        server honua:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

${CANARY_HTTP_BLOCK}

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    server {
        listen 80;
        server_name _;

${CANARY_SERVER_BLOCK}

        location = /nginx_status {
            stub_status;
            access_log off;
        }

        location /healthz {
${CANARY_HEALTH_DECISION_BLOCK}
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;
            add_header X-Honua-Deployment-Lane stable always;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            access_log off;
        }

        location /rest/ {
${CANARY_TRAFFIC_DECISION_BLOCK}
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;
            add_header X-Honua-Deployment-Lane stable always;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /odata/ {
${CANARY_TRAFFIC_DECISION_BLOCK}
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;
            add_header X-Honua-Deployment-Lane stable always;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /ogc/ {
${CANARY_TRAFFIC_DECISION_BLOCK}
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;
            add_header X-Honua-Deployment-Lane stable always;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /admin/ {
${CANARY_TRAFFIC_DECISION_BLOCK}
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;
            add_header X-Honua-Deployment-Lane stable always;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /metrics {
${CANARY_TRAFFIC_DECISION_BLOCK}
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;
            add_header X-Honua-Deployment-Lane stable always;
        }

        location / {
${CANARY_TRAFFIC_DECISION_BLOCK}
            proxy_pass http://honua_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Instance-ID $upstream_addr;
            add_header X-Instance-ID $upstream_addr always;
            add_header X-Honua-Deployment-Lane stable always;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

${CANARY_NAMED_LOCATION_BLOCK}
    }
}

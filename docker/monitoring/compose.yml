# Optional Grafana + Prometheus observability depth for Honua Server.
#
# One-command deploy (server already running, e.g. via the root `docker compose up -d`):
#
#     export HONUA_MONITORING_GRAFANA_PASSWORD='<a password you choose>'
#     export HONUA_METRICS_SCRAPE_KEY_FILE="$PWD/honua-scrape-key"   # see below
#     docker compose -f docker/monitoring/compose.yml up -d
#
# Both variables are required; the bundle refuses to start without them. Mint the
# scrape key as a read-only admin API key (permissions ["admin:read"]) and write it
# to the file named by HONUA_METRICS_SCRAPE_KEY_FILE — `/metrics` is served under the
# Admin policy, and a GET is a safe method, so an `admin:read` grant is the narrowest
# credential that can scrape it. Do not reuse HONUA_ADMIN_PASSWORD here.
#
# Then open Grafana at http://localhost:3000 (user `admin`, the password you exported)
# — the Prometheus datasource and the three curated dashboards (Serving, GP/Jobs,
# Ops/Alerts) are provisioned on boot. Prometheus is at http://localhost:9090.
#
# Published ports bind to loopback by default, like the repo-root compose file. Set
# HONUA_BIND_ADDRESS to widen that deliberately, behind your own network controls.
name: honua-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "${HONUA_BIND_ADDRESS:-127.0.0.1}:${HONUA_MONITORING_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts/alerts.yml:ro
      # The scrape credential is mounted, never baked into the scrape config.
      - "${HONUA_METRICS_SCRAPE_KEY_FILE:?Set HONUA_METRICS_SCRAPE_KEY_FILE to a file holding a read-only (admin:read) Honua API key for the /metrics scrape}:/etc/prometheus/secrets/honua-scrape-key:ro"
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
    extra_hosts:
      # Lets the honua scrape target reach the Docker host on Linux engines too.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${HONUA_BIND_ADDRESS:-127.0.0.1}:${HONUA_MONITORING_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${HONUA_MONITORING_GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${HONUA_MONITORING_GRAFANA_PASSWORD:?Set HONUA_MONITORING_GRAFANA_PASSWORD to the Grafana administrator password for this deployment}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

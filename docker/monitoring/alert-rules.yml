groups:
  # Application Health Alerts
  - name: honua-server-health
    rules:
      - alert: HonuaServerDown
        expr: up{job="honua-server"} == 0
        for: 30s
        labels:
          severity: critical
          service: honua-server
        annotations:
          summary: "Honua Server is down"
          description: "Honua Server has been down for more than 30 seconds."
          runbook_url: "https://docs.honua.example.com/runbooks/server-down"

      - alert: HonuaHealthCheckFailing
        expr: probe_success{job="blackbox-health"} == 0
        for: 1m
        labels:
          severity: warning
          service: honua-server
        annotations:
          summary: "Honua health check failing"
          description: "Health check for {{ $labels.instance }} has been failing for 1 minute."
          runbook_url: "https://docs.honua.example.com/runbooks/health-check-failure"

  # Performance Alerts
  - name: honua-server-performance
    rules:
      - alert: HonuaHighResponseTime
        expr: probe_duration_seconds{job="blackbox-health"} > 2
        for: 5m
        labels:
          severity: warning
          service: honua-server
        annotations:
          summary: "High response time detected"
          description: "Response time for {{ $labels.instance }} is {{ $value }}s, which is above the 2s threshold."
          runbook_url: "https://docs.honua.example.com/runbooks/high-response-time"

      - alert: HonuaHighErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[5m]) /
            rate(http_requests_total[5m])
          ) * 100 > 5
        for: 5m
        labels:
          severity: critical
          service: honua-server
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}%, which is above the 5% threshold."
          runbook_url: "https://docs.honua.example.com/runbooks/high-error-rate"

      - alert: HonuaConcurrentRequestsHigh
        expr: http_requests_currently_active > 100
        for: 5m
        labels:
          severity: warning
          service: honua-server
        annotations:
          summary: "High concurrent requests"
          description: "Currently handling {{ $value }} concurrent requests."
          runbook_url: "https://docs.honua.example.com/runbooks/high-concurrency"

  # Resource Alerts
  - name: honua-server-resources
    rules:
      - alert: HonuaHighMemoryUsage
        expr: |
          (
            container_memory_working_set_bytes{container="honua"} /
            container_spec_memory_limit_bytes{container="honua"}
          ) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: honua-server
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%, which is above the 85% threshold."
          runbook_url: "https://docs.honua.example.com/runbooks/high-memory-usage"

      - alert: HonuaHighCPUUsage
        expr: |
          rate(container_cpu_usage_seconds_total{container="honua"}[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
          service: honua-server
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%, which is above the 80% threshold."
          runbook_url: "https://docs.honua.example.com/runbooks/high-cpu-usage"

      - alert: HonuaDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"} /
            node_filesystem_size_bytes{mountpoint="/"}
          ) * 100 < 20
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Low disk space"
          description: "Available disk space is {{ $value }}%, which is below the 20% threshold."
          runbook_url: "https://docs.honua.example.com/runbooks/low-disk-space"

  # Database Alerts
  - name: honua-database
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
          service: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 30 seconds."
          runbook_url: "https://docs.honua.example.com/runbooks/postgresql-down"

      - alert: PostgreSQLConnectionsHigh
        expr: |
          (
            pg_stat_database_numbackends /
            pg_settings_max_connections
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "High PostgreSQL connections"
          description: "PostgreSQL connections are at {{ $value }}% of maximum."
          runbook_url: "https://docs.honua.example.com/runbooks/high-db-connections"

      - alert: PostgreSQLSlowQueries
        expr: pg_stat_activity_max_tx_duration > 300
        for: 2m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Slow PostgreSQL queries detected"
          description: "Longest running query is {{ $value }} seconds."
          runbook_url: "https://docs.honua.example.com/runbooks/slow-queries"

  # Security Alerts
  - name: honua-security
    rules:
      - alert: HonuaSuspiciousActivity
        expr: |
          rate(http_requests_total{status=~"4.."}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Suspicious activity detected"
          description: "High rate of 4xx errors: {{ $value }} requests/sec."
          runbook_url: "https://docs.honua.example.com/runbooks/suspicious-activity"

      - alert: HonuaUnauthorizedAccess
        expr: |
          rate(http_requests_total{status="401"}[5m]) > 5
        for: 1m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "High unauthorized access attempts"
          description: "Rate of 401 errors: {{ $value }} requests/sec."
          runbook_url: "https://docs.honua.example.com/runbooks/unauthorized-access"

  # Infrastructure Alerts
  - name: infrastructure
    rules:
      - alert: ContainerRestarting
        expr: |
          rate(container_restart_total[15m]) * 60 * 15 > 0
        for: 1m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Container restarting frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last 15 minutes."
          runbook_url: "https://docs.honua.example.com/runbooks/container-restart"

      - alert: HostHighLoad
        expr: |
          node_load1 / count(count(node_cpu_seconds_total) by (cpu)) > 2
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Host under high load"
          description: "Load average is {{ $value }}."
          runbook_url: "https://docs.honua.example.com/runbooks/high-load"

      - alert: HostOutOfMemory
        expr: |
          (
            node_memory_MemAvailable_bytes /
            node_memory_MemTotal_bytes
          ) * 100 < 10
        for: 2m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Host out of memory"
          description: "Available memory is {{ $value }}%."
          runbook_url: "https://docs.honua.example.com/runbooks/out-of-memory"
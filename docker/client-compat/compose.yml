# Real-client interop test matrix orchestrator.
#
# `honua` and `postgres` always start (depends_on healthy). Each client lane
# is a separate service tagged with both a per-lane profile and the shared
# `matrix` profile:
#   - `docker compose --profile <lane> up --abort-on-container-exit
#     --exit-code-from <lane> <lane>` runs one lane (the shape CI uses).
#   - `docker compose run --rm <lane>` works locally for an ad-hoc single
#     lane invocation.
#   - The `matrix` profile is **not** suitable for parallel execution under
#     `--abort-on-container-exit`: the first lane to exit terminates every
#     other container before it can write evidence. Use
#     scripts/client-compat/refresh-baselines.sh, which iterates the lanes
#     sequentially, when you need every envelope captured.
#
# Output `.cert.json` envelopes are written to ./output/<lane>/ on the host so
# the baseline-diff step can compare them against tests/baselines/client-compat.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: honua_compat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: compat_password
    networks:
      - compat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    # One-shot job: applies tests/seed/client-compat-v1.sql (schema +
    # test_service/layer 0 used by pyqgis) and tests/seed/browser-compat.yaml
    # (browser_compat/layers 2000-2002 used by cesium and openlayers) so the
    # lane services see the data their specs reference.
    build:
      context: ../..
      dockerfile: docker/client-compat/seed/Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: compat_password
      PGDATABASE: honua_compat
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - compat
    volumes:
      - ../../tests:/workspace/tests:ro
    restart: "no"

  honua:
    image: honua-server:client-compat
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      PUBLIC_BASE_URL: http://honua:5000
      HostValidation__AllowedHosts__0: honua
      HostValidation__AllowedHosts__1: localhost
      HONUA_ADMIN_PASSWORD: ClientCompatAdmin123!
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=honua_compat;User Id=postgres;Password=compat_password;
      ConnectionStrings__honua: Server=postgres;Port=5432;Database=honua_compat;User Id=postgres;Password=compat_password;
      Security__ConnectionEncryption__MasterKey: test-master-key-that-is-at-least-32-characters-long-for-security
      Security__ConnectionEncryption__Salt: dGVzdC1zYWx0LWZvci1lbmNyeXB0aW9uLXRlc3RpbmctcHVycG9zZXM=
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    networks:
      - compat
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5000/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  gdal:
    profiles: ["matrix", "gdal"]
    build:
      context: ../..
      dockerfile: docker/client-compat/gdal/Dockerfile
    environment:
      HONUA_BASE_URL: http://honua:5000
      HONUA_GDAL_SERVICE_ID: test_service
      HONUA_GDAL_COLLECTION_ID: "0"
    depends_on:
      honua:
        condition: service_healthy
    networks:
      - compat
    volumes:
      - ../../tests:/workspace/tests:ro
      # The lane runner invokes scripts/client-compat/convert-gdal-results.py
      # to project gdal-ogr-results.json into per-protocol .cert.json
      # envelopes. Mounting only the client-compat helpers (not the whole
      # scripts/ tree) keeps the surface area tight.
      - ../../scripts/client-compat:/workspace/scripts/client-compat:ro
      - ./output/gdal:/output

  pyqgis:
    profiles: ["matrix", "pyqgis"]
    build:
      context: ../..
      dockerfile: docker/client-compat/pyqgis/Dockerfile
    environment:
      HONUA_BASE_URL: http://honua:5000
      HONUA_PYQGIS_SERVICE_ID: test_service
      HONUA_PYQGIS_COLLECTION_ID: "0"
    depends_on:
      honua:
        condition: service_healthy
    networks:
      - compat
    volumes:
      - ../../tests:/workspace/tests:ro
      - ./output/pyqgis:/output

  openlayers:
    profiles: ["matrix", "openlayers"]
    build:
      context: ../..
      dockerfile: docker/client-compat/openlayers/Dockerfile
    environment:
      HONUA_BASE_URL: http://honua:5000
    depends_on:
      honua:
        condition: service_healthy
    networks:
      - compat
    volumes:
      - ../../tests:/workspace/tests:rw
      - ./output/openlayers:/output

  cesium:
    profiles: ["matrix", "cesium"]
    build:
      context: ../..
      dockerfile: docker/client-compat/cesium/Dockerfile
    environment:
      HONUA_BASE_URL: http://honua:5000
    depends_on:
      honua:
        condition: service_healthy
    networks:
      - compat
    volumes:
      - ../../tests:/workspace/tests:rw
      - ./output/cesium:/output

  arcgis-stub:
    profiles: ["matrix", "arcgis-stub"]
    build:
      context: ../..
      dockerfile: docker/client-compat/arcgis-stub/Dockerfile
    environment:
      HONUA_BASE_URL: http://honua:5000
      ARCGIS_STUB_SERVICE_NAME: browser_compat
      ARCGIS_STUB_LAYER_ID: "2000"
    depends_on:
      honua:
        condition: service_healthy
    networks:
      - compat
    volumes:
      - ./output/arcgis-stub:/output

networks:
  compat:
    driver: bridge

services:
  honua-server:
    image: honua-server:latest
    build:
      context: ../../..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - PUBLIC_BASE_URL=http://honua-server:8080
      - HostValidation__AllowedHosts__0=honua-server
      - HostValidation__AllowedHosts__1=localhost
      - HONUA_ADMIN_PASSWORD=CiteAdminPassword123!
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=honua_cite_tiles;User Id=postgres;Password=cite_password;
      - ConnectionStrings__honua=Server=postgres;Port=5432;Database=honua_cite_tiles;User Id=postgres;Password=cite_password;
      - ConnectionStrings__Redis=redis:6379
      - Security__ConnectionEncryption__MasterKey=test-master-key-that-is-at-least-32-characters-long-for-security
      - Security__ConnectionEncryption__Salt=dGVzdC1zYWx0LWZvci1lbmNyeXB0aW9uLXRlc3RpbmctcHVycG9zZXM=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cite-tiles-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_DB=honua_cite_tiles
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cite_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5434:5432"
    networks:
      - cite-tiles-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly no
    networks:
      - cite-tiles-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cite-engine:
    image: ogccite/ets-ogcapi-tiles10:1.2-teamengine-6.0.0-RC2
    ports:
      - "8082:8080"
    environment:
      - JAVA_OPTS=-Xmx2g -DTE_BASE=/root/te_base
      - TEAMENGINE_BASE_URL=http://cite-engine:8080/teamengine
    volumes:
      - cite-tiles-logs:/root/te_base/users/cite/logs
      - ./config:/cite-config:ro
    networks:
      - cite-tiles-network
    depends_on:
      honua-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/teamengine"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cite-runner:
    image: ogccite/ets-ogcapi-tiles10:1.2-teamengine-6.0.0-RC2
    command:
      - bash
      - -lc
      - |
          set -euo pipefail
          echo 'Waiting for services to be ready...'
          sleep 30
          for i in $(seq 1 30); do
            if getent hosts honua-server >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! getent hosts honua-server >/dev/null 2>&1; then
            echo 'honua-server DNS entry did not resolve in time'
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -sS --fail http://honua-server:8080/ogc/tiles/conformance >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl -sS --fail http://honua-server:8080/ogc/tiles/conformance >/dev/null; then
            echo 'honua-server tiles conformance endpoint not reachable from cite-runner'
            exit 1
          fi
          echo 'Preparing TeamEngine console...'
          curl -sS --fail --retry 12 --retry-delay 5 --retry-max-time 300 --retry-all-errors -L -o /tmp/teamengine-console-6.0.0-RC2-bin.zip https://repo1.maven.org/maven2/org/opengis/cite/teamengine/teamengine-console/6.0.0-RC2/teamengine-console-6.0.0-RC2-bin.zip
          unzip -q /tmp/teamengine-console-6.0.0-RC2-bin.zip -d /tmp/te-console
          mkdir -p /root/te_base/resources/lib /root/te_base/scripts
          mkdir -p /root/te_base/users/cite/logs
          rm -rf /root/te_base/scripts/ogcapi-tiles-1.0
          unzip -qo -j /root/ets-ogcapi-tiles10-*-deps.zip -d /root/te_base/resources/lib || true
          unzip -qo /root/ets-ogcapi-tiles10-*-ctl.zip -d /root/te_base/scripts || true
          export TE_BASE=/root/te_base
          echo 'Starting OGC API Tiles CITE conformance tests...'
          /tmp/te-console/bin/unix/test.sh -source=/root/te_base/scripts/ogcapi-tiles-1.0/1.0/ctl/ogcapi-tiles-1.0-suite.ctl -form=/cite-config/test-params.xml -logdir=users/cite/logs -session=cite-tiles-session-$(date +%Y%m%d-%H%M%S)
          echo 'CITE tests completed. Check results in logdir.'
    volumes:
      - cite-tiles-results:/root/te_base/users/cite/logs
      - ./config:/cite-config:ro
    networks:
      - cite-tiles-network
    depends_on:
      cite-engine:
        condition: service_healthy
    profiles:
      - test

volumes:
  cite-tiles-logs:
    driver: local
  cite-tiles-results:
    driver: local

networks:
  cite-tiles-network:
    driver: bridge

services:
  honua-server:
    image: honua-server:latest
    ports:
      - "127.0.0.1:${HONUA_CITE_OGCAPI_PROCESSES_SERVER_PORT:-8101}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ASPNETCORE_URLS: http://+:8080
      PUBLIC_BASE_URL: http://honua-server:8080
      HONUA_DEV_AUTH: "true"
      HONUA_DEV_AUTH_ALLOW_BYPASS: "true"
      HONUA_REGISTER_TEST_INFRASTRUCTURE: "true"
      # The suite-owned profile needs the durable Redis job store. Test hosts may
      # opt into Pro entitlements explicitly; Production ignores this override.
      Licensing__DevGrantEdition: Pro
      Cache__Enabled: "false"
      DataSource__Provider: postgres
      HostValidation__Enabled: "false"
      HostValidation__AllowedHosts__0: honua-server
      HostValidation__AllowedHosts__1: localhost
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=honua_cite_processes;User Id=postgres;Password=cite_password;
      ConnectionStrings__honua: Server=postgres;Port=5432;Database=honua_cite_processes;User Id=postgres;Password=cite_password;
      ConnectionStrings__Redis: redis:6379
      Security__ConnectionEncryption__MasterKey: test-master-key-that-is-at-least-32-characters-long-for-security
      Security__ConnectionEncryption__Salt: dGVzdC1zYWx0LWZvci1lbmNyeXB0aW9uLXRlc3RpbmctcHVycG9zZXM=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cite-processes-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "-T", "5", "-O", "/dev/null", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_DB: honua_cite_processes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cite_password
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    networks:
      - cite-processes-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d honua_cite_processes"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: redis-server --appendonly no
    networks:
      - cite-processes-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  cite-runner:
    image: honua-cite-ogcapi-processes10-ets:1.4-pinned
    build:
      context: .
      dockerfile: Dockerfile.ets
      args:
        ETS_COMMIT: 75abd1f37fc3aad95163fdce2e33e393b1ba5a88
    user: "${HONUA_CITE_HOST_UID:-1000}:${HONUA_CITE_HOST_GID:-1000}"
    environment:
      HOME: /tmp/cite-home
      JAVA_TOOL_OPTIONS: -Duser.home=/tmp/cite-home -Xms256m -Xmx1536m
    command:
      - -o
      - /results/raw
      - /config/test-run-props.xml
    volumes:
      - ${HONUA_CITE_OGCAPI_PROCESSES_RESULTS_PATH:?set HONUA_CITE_OGCAPI_PROCESSES_RESULTS_PATH}:/results
      - ./config:/config:ro
    networks:
      - cite-processes-network
    depends_on:
      honua-server:
        condition: service_healthy
    profiles:
      - test

networks:
  cite-processes-network:
    driver: bridge

# Hermetic stand-in for http://cite.opengeospatial.org (honua-server#3156).
#
# The ets-wms11 profiles tests (wms:profiles-basic-1/2, wms:profiles-queryable-1/2/3)
# unconditionally issue a GET to
#   http://cite.opengeospatial.org/OGCTestData/wms/1.1.1/null.xml
# before asserting anything about the server under test. The assertion only needs
# the host to answer; historical green runs received a 301 to the CITE wiki and the
# GitHub HTML body behind it. When OGC's host stopped answering GitHub-hosted
# runners (2026-08-07..), those five tests failed with java.net.ConnectException
# after ~135s each, despite honua-server serving every request addressed to it.
#
# This server is attached to the CITE compose network under the network alias
# `cite.opengeospatial.org`, so Docker's embedded DNS resolves the OGC hostname to
# this stub for every container in the stack. Any GET receives a small 200 XML
# response, which is strictly more useful than the wiki HTML the live host served.
server {
    listen 80 default_server;
    server_name cite.opengeospatial.org _;

    location / {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><OGCTestData source="honua-cite-hermetic-stub"/>';
    }
}

services:
  honua-server:
    image: honua-server:latest
    build:
      context: ../../..
      dockerfile: Dockerfile
    ports:
      - "${HONUA_CITE_KML22_SERVER_PORT:-8096}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Test
      - ASPNETCORE_URLS=http://+:8080
      - PUBLIC_BASE_URL=http://honua-server:8080
      - HONUA_DEV_AUTH=true
      - HONUA_REGISTER_TEST_INFRASTRUCTURE=true
      - Cache__Enabled=false
      - DataSource__Provider=postgres
      - HostValidation__Enabled=false
      - HostValidation__AllowedHosts__0=honua-server
      - HostValidation__AllowedHosts__1=localhost
      - HONUA_ADMIN_PASSWORD=CiteAdminPassword123!
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=honua_cite_kml;User Id=postgres;Password=cite_password;
      - ConnectionStrings__honua=Server=postgres;Port=5432;Database=honua_cite_kml;User Id=postgres;Password=cite_password;
      - ConnectionStrings__Redis=redis:6379
      - Security__ConnectionEncryption__MasterKey=test-master-key-that-is-at-least-32-characters-long-for-security
      - Security__ConnectionEncryption__Salt=dGVzdC1zYWx0LWZvci1lbmNyeXB0aW9uLXRlc3RpbmctcHVycG9zZXM=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cite-kml22-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "-T", "5", "-O", "/dev/null", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_DB=honua_cite_kml
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cite_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5437:5432"
    networks:
      - cite-kml22-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly no
    networks:
      - cite-kml22-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cite-engine:
    # :latest — no versioned TeamEngine-bundled tag is published for this suite yet.
    # Pin when one becomes available. See cite-runbook.md (KML 2.2 section) troubleshooting.
    image: ogccite/ets-kml22:latest
    ports:
      - "8085:8080"
    environment:
      - JAVA_OPTS=-Xmx2g -DTE_BASE=/root/te_base
      - TEAMENGINE_BASE_URL=http://cite-engine:8080/teamengine
    volumes:
      - cite-kml22-logs:/root/te_base/users/cite/logs
    networks:
      - cite-kml22-network
    depends_on:
      honua-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/teamengine"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cite-runner:
    image: ogccite/ets-kml22:latest
    environment:
      - HONUA_CITE_KML22_PROFILE=${HONUA_CITE_KML22_PROFILE:-applicable}
    command:
      - bash
      - -lc
      - |
          set -euo pipefail
          profile="$${HONUA_CITE_KML22_PROFILE:-applicable}"
          case "$$profile" in
            applicable|default)
              ;;
            *)
              echo "Unknown KML 2.2 CITE profile: $$profile"
              exit 1
              ;;
          esac
          KML_IUT_URL="http://honua-server:8080/rest/services/cite/MapServer/generateKml"
          echo 'Waiting for services to be ready...'
          sleep 30
          echo 'Preparing TeamEngine console...'
          curl -sS --fail --retry 5 --retry-delay 2 --retry-all-errors -L -o /tmp/teamengine-console-6.0.0-RC2-bin.zip https://repo1.maven.org/maven2/org/opengis/cite/teamengine/teamengine-console/6.0.0-RC2/teamengine-console-6.0.0-RC2-bin.zip
          unzip -q /tmp/teamengine-console-6.0.0-RC2-bin.zip -d /tmp/te-console
          mkdir -p /root/te_base/resources/lib /root/te_base/scripts
          mkdir -p /root/te_base/users/cite/logs
          rm -rf /root/te_base/scripts/kml22
          unzip -qo -j /root/ets-kml22-*-deps.zip -d /root/te_base/resources/lib || true
          unzip -qo /root/ets-kml22-*-ctl.zip -d /root/te_base/scripts || true
          rm -rf /root/te_base/users/cite/logs/*
          export TE_BASE=/root/te_base
          mkdir -p /data
          cat > /data/test-params.xml <<EOF_PARAMS
          <?xml version="1.0" encoding="UTF-8"?>
          <values xmlns:parsers="http://www.occamlab.com/te/parsers">
            <parsers:session>
              <parsers:test>ets-kml22-1.16</parsers:test>
              <parsers:profile>default</parsers:profile>
            </parsers:session>
            <value key="uri">$${KML_IUT_URL}</value>
            <value key="level">1</value>
          </values>
          EOF_PARAMS
          if [ "$$profile" = "applicable" ]; then
            session_dir="/root/te_base/users/cite/logs/cite-kml22-applicable-$(date +%Y%m%d-%H%M%S)"
            cat > /data/testng-applicable.xml <<EOF_TESTNG
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE suite SYSTEM "http://testng.org/testng-1.0.dtd">
          <suite name="kml22-1.16-applicable-level1" verbose="0" configfailurepolicy="skip">
            <parameter name="iut" value="$${KML_IUT_URL}" />
            <parameter name="ics" value="1" />

            <listeners>
              <listener class-name="org.opengis.cite.kml22.TestRunListener" />
              <listener class-name="org.opengis.cite.kml22.SuiteFixtureListener" />
            </listeners>

            <test name="Conformance Level 1">
              <classes>
                <class name="org.opengis.cite.kml22.level1.KmlDocumentTests" />
                <class name="org.opengis.cite.kml22.level1.SpatialTests" />
                <class name="org.opengis.cite.kml22.level1.StyleTests" />
                <class name="org.opengis.cite.kml22.level1.TemporalElementTests" />
                <class name="org.opengis.cite.kml22.level1.LinkTests" />
                <class name="org.opengis.cite.kml22.level1.FeatureTests" />
                <class name="org.opengis.cite.kml22.level1.UserDefinedDataTests" />
                <class name="org.opengis.cite.kml22.level1.ViewTests" />
              </classes>
            </test>
          </suite>
          EOF_TESTNG
            echo "Starting KML 2.2 applicable CITE conformance tests..."
            java -cp "/tmp/te-console/lib/*:/root/te_base/resources/lib/*" \
              org.testng.TestNG \
              -d "$$session_dir" \
              /data/testng-applicable.xml
          else
            echo 'Starting KML 2.2 default CITE conformance tests...'
            /tmp/te-console/bin/unix/test.sh \
              -source=/root/te_base/scripts/kml22/2.2/ctl/kml22-suite.ctl \
              -form=/data/test-params.xml \
              -logdir=users/cite/logs \
              -session=cite-kml22-session-$(date +%Y%m%d-%H%M%S)
          fi
          echo 'CITE tests completed. Check results in logdir.'
    volumes:
      - cite-kml22-results:/root/te_base/users/cite/logs
    networks:
      - cite-kml22-network
    depends_on:
      cite-engine:
        condition: service_healthy
    profiles:
      - test

volumes:
  cite-kml22-logs:
    driver: local
  cite-kml22-results:
    driver: local

networks:
  cite-kml22-network:
    driver: bridge

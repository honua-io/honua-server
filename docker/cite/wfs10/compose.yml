services:
  honua-server:
    image: honua-server:latest
    ports:
      - "${HONUA_CITE_WFS10_SERVER_PORT:-8096}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Test
      - ASPNETCORE_URLS=http://+:8080
      - HONUA_DEV_AUTH=true
      - HONUA_REGISTER_TEST_INFRASTRUCTURE=true
      - HONUA_SKIP_MIGRATIONS=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=honua_cite;Username=postgres;Password=postgres;Include Error Detail=true
      - HONUA_ADMIN_PASSWORD=CiteAdminPassword123!
      - Security__ConnectionEncryption__MasterKey=cite_testing_master_key_for_testing_only_not_secure
      - HostValidation__Enabled=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cite-network

  postgres:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=honua_cite
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
    ports:
      - "${HONUA_CITE_WFS10_POSTGRES_PORT:-5446}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d honua_cite"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../shared/test-data:/docker-entrypoint-initdb.d:ro
    networks:
      - cite-network

  cite-teamengine:
    image: ogccite/ets-wfs10:latest
    ports:
      - "${HONUA_CITE_WFS10_TEAMENGINE_PORT:-8088}:8080"
    environment:
      - CATALINA_OPTS=-Xms1g -Xmx2g
      - TE_BASE=/root/te_base
      - TE_HOME=/root/teamengine
    depends_on:
      - honua-server
    volumes:
      - cite_data:/root/te_base
    networks:
      - cite-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/teamengine/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cite-runner:
    image: ogccite/ets-wfs10:latest
    user: "0:0"
    depends_on:
      cite-teamengine:
        condition: service_healthy
      honua-server:
        condition: service_started
    environment:
      - WFS_VERSION=1.0.0
      - WFS_ENDPOINT=http://honua-server:8080/wfs
      - TEST_PROFILE=${CITE_PROFILE:-basic}
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      - ../../../cite-wfs10-results:/results
      - ../shared/scripts:/scripts:ro
    networks:
      - cite-network
    command: ["/scripts/execute-wfs1-tests.sh"]

volumes:
  postgres_data:
    driver: local
  cite_data:
    driver: local

networks:
  cite-network:
    driver: bridge

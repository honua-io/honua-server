name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dotnet-dependencies:
    name: Update .NET Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - name: Install dotnet-outdated
      run: dotnet tool install --global dotnet-outdated-tool

    - name: Check for outdated packages
      id: outdated
      run: |
        OUTDATED=$(dotnet outdated --output json)
        echo "outdated=$OUTDATED" >> $GITHUB_OUTPUT

        # Count outdated packages
        COUNT=$(echo "$OUTDATED" | jq '.Projects | map(.TargetFrameworks[].Dependencies | length) | add // 0')
        echo "count=$COUNT" >> $GITHUB_OUTPUT

    - name: Update NuGet packages
      if: steps.outdated.outputs.count > 0
      run: |
        # Update packages one by one for better control
        dotnet list package --outdated --format json > outdated.json

        # Update non-major versions (patch and minor updates)
        cat outdated.json | jq -r '.projects[].frameworks[].topLevelPackages[] | select(.latestVersion != .resolvedVersion and (.latestVersion | split(".")[0]) == (.resolvedVersion | split(".")[0])) | .id' | while read package; do
          echo "Updating $package"
          dotnet add package $package
        done

    - name: Build and test after updates
      if: steps.outdated.outputs.count > 0
      run: |
        dotnet restore
        dotnet build --configuration Release
        dotnet test --configuration Release --no-build

    - name: Create Pull Request
      if: steps.outdated.outputs.count > 0
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update .NET dependencies"
        title: "🔄 Update .NET Dependencies"
        body: |
          ## Automated Dependency Update

          This PR updates .NET NuGet packages to their latest compatible versions.

          ### Changes
          - Updated non-breaking dependency versions (patch/minor updates)
          - All tests pass with updated dependencies

          ### Verification
          - ✅ Build successful
          - ✅ All tests passing
          - ⚠️ Please review for any breaking changes before merging

          **Auto-generated by dependency update workflow**
        branch: chore/update-dotnet-dependencies
        base: trunk
        labels: |
          dependencies
          automated
        reviewers: |
          # Add your team members here
        assignees: |
          # Add assignees here if needed

  update-github-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update GitHub Actions
      uses: renovatebot/github-action@v40.3.2
      with:
        configurationFile: .github/renovate.json
        token: ${{ secrets.GITHUB_TOKEN }}

  update-docker-images:
    name: Update Docker Base Images
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4


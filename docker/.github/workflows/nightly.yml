name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

env:
  DOTNET_VERSION: '10.0'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: honua_benchmarks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build release
      run: dotnet build --configuration Release --no-restore

    - name: Run performance benchmarks
      run: dotnet run --project benchmarks/Honua.Benchmarks --configuration Release --no-build
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost;Port=5432;Database=honua_benchmarks;User Id=postgres;Password=postgres;"

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ github.run_id }}
        path: benchmarks/results/
        retention-days: 90

  cite-conformance-tests:
    name: CITE Conformance Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run CITE Tests
      run: |
        chmod +x scripts/run-cite-tests.sh
        scripts/run-cite-tests.sh
      timeout-minutes: 30

    - name: Upload CITE test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cite-test-results-${{ github.run_id }}
        path: docker/cite-logs/
        retention-days: 90

    - name: Upload CITE test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cite-test-report-${{ github.run_id }}
        path: docker/cite-logs/testng-results.xml
        retention-days: 90

  extended-integration-tests:
    name: Extended Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test-suite:
          - "OgcFeatures"
          - "FeatureServer"
          - "Admin"
          - "HealthCheck"

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: honua_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run extended integration tests
      run: |
        dotnet test tests/Honua.Server.Tests \
          --configuration Release \
          --no-build \
          --collect:"XPlat Code Coverage" \
          --logger trx \
          --results-directory ./test-results \
          --filter "Category=${{ matrix.test-suite }}" \
          --verbosity normal
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost;Port=5432;Database=honua_integration;User Id=postgres;Password=postgres;"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: extended-test-results-${{ matrix.test-suite }}-${{ github.run_id }}
        path: ./test-results
        retention-days: 30

  security-vulnerability-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Run security audit
      run: dotnet list package --vulnerable --include-transitive

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [performance-benchmarks, cite-conformance-tests, extended-integration-tests, security-vulnerability-scan]
    if: always()

    steps:
    - name: Prepare notification
      run: |
        echo "PERFORMANCE_STATUS=${{ needs.performance-benchmarks.result }}" >> $GITHUB_ENV
        echo "CITE_STATUS=${{ needs.cite-conformance-tests.result }}" >> $GITHUB_ENV
        echo "INTEGRATION_STATUS=${{ needs.extended-integration-tests.result }}" >> $GITHUB_ENV
        echo "SECURITY_STATUS=${{ needs.security-vulnerability-scan.result }}" >> $GITHUB_ENV

    # Add notification logic here (Slack, Teams, email, etc.)
    # Example for GitHub issue creation on failure:
    - name: Create issue on failure
      if: needs.performance-benchmarks.result == 'failure' || needs.cite-conformance-tests.result == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Nightly Test Failure - ' + new Date().toISOString().split('T')[0],
            body: `❌ Nightly tests failed on ${new Date().toISOString()}

            ## Results Summary
            - Performance Benchmarks: ${{ env.PERFORMANCE_STATUS }}
            - CITE Conformance Tests: ${{ env.CITE_STATUS }}
            - Extended Integration Tests: ${{ env.INTEGRATION_STATUS }}
            - Security Vulnerability Scan: ${{ env.SECURITY_STATUS }}

            Please check the [workflow run](${context.payload.workflow_run?.html_url || 'N/A'}) for details.`,
            labels: ['bug', 'nightly-failure', 'automated']
          })
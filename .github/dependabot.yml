version: 2
updates:
  # NuGet dependencies
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      # Group minor/patch updates to reduce PR noise
      dotnet-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; the composite actions under .github/actions
    # carry their own SHA pins and are only scanned when listed explicitly.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images: the root server Dockerfile and every image under docker/.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker"
      - "/docker/*"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "docker"

  # The custom-code .NET harness restores from its own lock files.
  - package-ecosystem: "nuget"
    directory: "/docker/worker-customcode-dotnet/harness"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "nuget"

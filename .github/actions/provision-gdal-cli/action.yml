name: Provision GDAL CLI
description: Install verified native packages from an exact runner-image cache with bounded mirror fallback.

inputs:
  python-environment:
    description: Select system to publish distro Python, or setup-python to preserve the caller's interpreter.
    default: system

runs:
  using: composite
  steps:
    - name: Identify the native dependency runner image
      id: resolve
      shell: bash
      run: bash scripts/ci/provision-gdal-cli.sh resolve

    - name: Restore native dependency packages
      id: gdal-debs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.cache-dir }}
        key: gdal-cli-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.image }}-${{ hashFiles('scripts/ci/provision-gdal-cli.sh') }}

    - name: Install and verify native dependency packages
      shell: bash
      env:
        GDAL_DEB_CACHE_HIT: ${{ steps.gdal-debs.outputs.cache-hit }}
        GDAL_PYTHON_ENVIRONMENT: ${{ inputs.python-environment }}
      run: bash scripts/ci/provision-gdal-cli.sh install

    - name: Save verified native dependency packages
      if: steps.gdal-debs.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.cache-dir }}
        key: gdal-cli-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.image }}-${{ hashFiles('scripts/ci/provision-gdal-cli.sh') }}

name: Lean Gate
description: >
  Shared LEAN gate: warnings-as-errors Release build + optional shared format
  check + the Fast/architecture/MCP-governance unit smoke. Single source of
  truth for BOTH the per-PR verification job (.github/workflows/pr-gate.yml)
  and the `Merge Queue Gate` job (.github/workflows/ci.yml).

  PR verification passes `build-scope: affected` and disables the in-action
  format step because the workflow runs that same shared format action in a
  parallel job. `Merge Queue Gate` keeps both scopes full and runs format
  inline. Every test step and timeout remains identical for both callers.

  Callers must run actions/checkout and ./.github/actions/setup-dotnet-ci first
  (and may reclaim runner disk); this action owns only the gate itself.

  NOT included, on purpose: AOT, the Server Tests shard matrix, the browser/MCP
  lanes, cross-provider Postgres coverage, and every other integration suite.
  Those are the full CI matrix (every server-test shard in `.github/ci-shards.json` plus the AOT/Docker/browser/MCP/provider lanes) whose per-PR fan-out
  caused the 2026-06-18 runner-starvation spiral. This action must stay cheap: ONE runner, no GitHub
  `services:` orchestration, no matrix.

  The Testcontainers-backed Server Governance/Drift assertions are deliberately
  outside this required gate. They run intact on the trailing trunk matrix in
  ci.yml, where a deterministic failure still fails CI Gate and sets the fleet
  brake, but no longer adds a PostgreSQL boot to every PR (#3213).

inputs:
  trx-prefix:
    description: 'Prefix for emitted .trx file names so callers do not collide.'
    required: false
    default: 'lean-gate'
  build-scope:
    description: >
      'full' (default) compiles Honua.sln. 'affected' compiles only a solution
      filter holding the diff's reverse-dependency closure UNION the leaf test
      projects the later --no-build steps execute, and silently falls back to
      the full solution whenever a trustworthy diff base is unavailable or
      shared build infrastructure changed. Requires the caller to check out with
      fetch-depth >= 2. See scripts/ci/compute-lean-gate-build-scope.sh.
    required: false
    default: 'full'
  format-scope:
    description: >
      'full' (default) runs `dotnet format Honua.sln --verify-no-changes` over
      every document in the solution. 'affected' passes the diff's surviving
      formattable files to `--include` — same workspace, per-document analysis
      restricted to the change — and falls back to the full run whenever the
      diff base is untrustworthy, the SHARED build-scope force-full decision
      fires (compute-affected-projects.sh reports ALL), the diff touches
      format-sensitive configuration (.editorconfig/.globalconfig/.csproj/
      .props/.targets/.sln/.ruleset), or the include list would exceed its
      file bound. Requires the caller to check out with fetch-depth >= 2. See
      scripts/ci/compute-lean-gate-format-scope.sh.
    required: false
    default: 'full'
  run-format:
    description: >
      Whether to run the shared format check inline. Defaults to true so every
      caller retains format coverage unless it explicitly supplies an
      equivalent required job.
    required: false
    default: 'true'
  build-timeout-minutes:
    description: 'Cap for the warnings-as-errors build step.'
    required: false
    default: '20'
  server-fast-timeout-minutes:
    description: 'Cap for the Server Fast tier unit smoke.'
    required: false
    default: '15'
  architecture-timeout-minutes:
    description: 'Cap for the architecture-enforcement tests.'
    required: false
    default: '10'
  ai-governance-timeout-minutes:
    description: >
      Cap for the focused MCP registry/taxonomy roster drift tests. The build
      step already produced this test assembly (Honua.Ai.Tests is one of the
      projects an affected-scope build is always seeded with), so the smoke adds
      no restore or compilation work.
    required: false
    default: '2'
runs:
  using: composite
  steps:
    - name: Validate lean-gate command contract
      shell: bash
      run: python3 scripts/ci/fixtures/validate-lean-gate.py

    - name: Documentation Command Policy
      shell: pwsh
      run: scripts/ci/check-markdown-command-policy.ps1

    - name: Validate merge-train timeout policy
      shell: bash
      run: |
        scripts/ci/merge-train/fixtures/validate-timeout-retry.sh
        scripts/ci/merge-train/fixtures/validate-capacity-ordering.sh
        scripts/ci/merge-train/fixtures/validate-early-failure-observe.sh

    # Cheap, service-free governance step (~1s): every OpenAPI document Honua
    # advertises must agree with EndpointRegistry, and every deliberate omission
    # from the curated admin bundle must be declared. Runs here, in the required
    # gate, so a new route cannot ship undocumented and undeclared
    # (honua-server#3051). The dedicated openapi-drift.yml workflow runs the same
    # script plus its unit tests.
    - name: OpenAPI <-> EndpointRegistry drift
      shell: bash
      run: python3 scripts/ci/openapi-drift-check.py

    - name: Restore
      shell: bash
      run: scripts/ci/dotnet-restore-retry.sh Honua.sln

    # Warnings-as-errors build scope. This used to be unconditionally
    # full-solution for BOTH callers. The reasoning split when `PR Gate` became
    # the dominant cost of landing anything (epic #3213):
    #
    #   * merge_group / `Merge Queue Gate` keeps `full`. A batched commit's diff
    #     base is the queue base rather than a single PR, so an affected-projects
    #     computation there is not trustworthy — and the batch build is the
    #     full-solution backstop that the per-PR narrowing below leans on.
    #   * pull_request / `PR Gate` passes `affected`. The gate still compiles
    #     everything the diff can reach plus every project its own --no-build
    #     test steps need; it stops compiling the ~30 solution projects (mostly
    #     sibling test assemblies) that no part of this gate consumes.
    #
    # MISS-RISK CONTRACT: if the affected closure is ever wrong, the change fails
    # the merge train's full-solution build BEFORE it lands. It is fixed forward
    # from the train, and never reaches trunk unverified.
    - name: Compute gate build scope
      id: build-scope
      shell: bash
      env:
        BUILD_SCOPE: ${{ inputs.build-scope }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: scripts/ci/compute-lean-gate-build-scope.sh

    # Composite-action steps do not support `timeout-minutes`, so each bounded
    # step wraps its command in coreutils `timeout` (exit 124 => step fails).
    - name: Build (warnings as errors)
      shell: bash
      env:
        GATE_BUILD_MODE: ${{ steps.build-scope.outputs.mode }}
        GATE_BUILD_FILTER: ${{ steps.build-scope.outputs.filter }}
      run: |
        if [[ "${GATE_BUILD_MODE}" == "affected" ]]; then
          timeout "${{ inputs.build-timeout-minutes }}m" \
            dotnet build "${GATE_BUILD_FILTER}" \
              --no-restore \
              --configuration Release \
              /p:TreatWarningsAsErrors=true
        else
          timeout "${{ inputs.build-timeout-minutes }}m" \
            dotnet build Honua.sln \
              --no-restore \
              --configuration Release \
              /p:TreatWarningsAsErrors=true
        fi

    # Format scope. Like the build scope above, this narrows for `PR Gate`
    # only; `Merge Queue Gate` and ci.yml's `Build & Format Check` stay
    # solution-wide, and that full pass before landing is the backstop.
    #
    # An earlier revision of this file asserted that most of `dotnet format`'s
    # cost is loading the workspace, so an `--include`-scoped run "would not
    # obviously pay". That was measured and is WRONG on current trunk: run
    # 33126837397 / job 98706893656 (--verbosity diagnostic) puts the full run
    # at 5.39 min p50 — 29% of the 18.7 min gate — broken down as
    #   workspace load                 7%
    #   determining formattable files  3%
    #   whitespace formatters          5%
    #   Code Style analysis           35%
    #   Analyzer Reference analysis   49%
    # i.e. 84% of the cost is code-style + analyzer analysis over all 6586
    # documents ("Formatted 0 of 6586 files"), which `--include` restricts to
    # the diff. The workspace-load share an --include run still pays is ~10%.
    #
    # MISS-RISK CONTRACT (same shape as the build scope's): a format/analyzer
    # diagnostic triggered in a file OUTSIDE the diff — a deleted type leaving
    # an unnecessary using elsewhere, and nothing subtler, because config that
    # changes analysis everywhere (.editorconfig, props, csproj, analyzers)
    # forces the full run — is caught by the merge train's full-solution
    # format BEFORE the change lands, and fixed forward from the train. It
    # never reaches trunk unverified. The scope script also refuses to narrow
    # past its include-file bound instead of truncating: a truncated include
    # list would be a silent coverage hole.
    - name: Format Check
      if: inputs.run-format == 'true'
      uses: ./.github/actions/format-check
      with:
        format-scope: ${{ inputs.format-scope }}

    - name: Create Test Results Directory
      shell: bash
      run: mkdir -p ./tests/TestResults

    # Fast unit smoke. The [UnitTest] tests in Server.Tests use NSubstitute /
    # NullLogger / in-memory caches and do NOT require the PostgreSQL service —
    # that is what keeps this step to a few minutes and this job to a single
    # service-free runner. Coverage-free on purpose (the Coverlet collector adds
    # ~20m of teardown on Honua.Server.dll and would destroy the "cheap" budget).
    - name: Run .NET Tests (Server Fast Tier)
      shell: bash
      run: |
        timeout "${{ inputs.server-fast-timeout-minutes }}m" \
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "Tier=Fast" \
            --logger "trx;LogFileName=${{ inputs.trx-prefix }}-server-fast.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

    # Architecture-enforcement tests: cheap (~75s) and high-value. This step is
    # what makes the gate catch the failure that motivated #2865 —
    # FeatureCatalogDriftTests.CommittedCatalog_EqualsFreshlyGeneratedOutput
    # fails when docs/gis/data/feature-catalog.json is stale, which previously
    # only surfaced on trunk AFTER an admin merge. It also catches the BLOCKING
    # dependency-direction / controller / encapsulation / API-surface-coverage
    # regressions.
    - name: Run .NET Tests (Architecture)
      shell: bash
      run: |
        timeout "${{ inputs.architecture-timeout-minutes }}m" \
          dotnet test tests/dotnet/Honua.Architecture.Tests/Honua.Architecture.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=${{ inputs.trx-prefix }}-architecture.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

    # Service-free MCP roster governance. The capability registry and taxonomy
    # fixture must mirror the same live DI tool surface. The assembly is already
    # available from the full solution build, so this adds only a no-build test
    # invocation to the required gate (#3198).
    - name: Run .NET Tests (MCP Registry/Taxonomy Drift)
      shell: bash
      run: |
        timeout "${{ inputs.ai-governance-timeout-minutes }}m" \
          dotnet test tests/dotnet/Honua.Ai.Tests/Honua.Ai.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~McpTaxonomyAlignmentTests|FullyQualifiedName~CapabilityRegistryConformanceTests" \
            --logger "trx;LogFileName=${{ inputs.trx-prefix }}-mcp-roster.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

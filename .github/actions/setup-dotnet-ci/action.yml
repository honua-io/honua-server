name: Setup .NET CI
description: .NET SDK setup and NuGet cache wiring

inputs:
  dotnet-version:
    description: '.NET SDK version'
    required: false
    default: '10.0.x'
  enable-build-cache:
    description: 'Restore/save per-project bin/obj across jobs (opt-in; broad binary caches can exhaust hosted runner disk)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ github.repository }}-${{ runner.os }}-nuget-

    # ADR-0043 PR #1 — Cross-job binary cache. Restores bin/ and obj/ keyed on
    # the content hash of every .cs source + every .csproj + the central
    # package version lock. A cache hit lets `dotnet build --no-restore` skip
    # compilation for unchanged projects entirely; a miss falls through to a
    # normal build, so a stale or empty cache never breaks CI.
    #
    # Opt in via `with: enable-build-cache: 'true'` on the calling job after
    # confirming the restored binary payload fits the hosted runner disk budget.
    - name: Cache .NET build outputs
      if: inputs.enable-build-cache == 'true'
      uses: actions/cache@v5
      with:
        path: |
          **/bin
          **/obj
        key: ${{ github.repository }}-${{ runner.os }}-dotnet-build-${{ hashFiles('**/*.cs', '**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
        restore-keys: |
          ${{ github.repository }}-${{ runner.os }}-dotnet-build-

    - name: Configure GitHub Packages
      shell: bash
      run: |
        if [[ -f NuGet.config ]] && grep -q 'github-honua' NuGet.config; then
          dotnet nuget update source github-honua \
            --username "${{ github.actor }}" \
            --password "${{ github.token }}" \
            --store-password-in-clear-text
        fi

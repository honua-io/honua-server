name: Setup .NET CI
description: .NET SDK setup and NuGet cache wiring

inputs:
  dotnet-version:
    description: '.NET SDK version'
    required: false
    default: '10.0.x'
  enable-build-cache:
    description: 'Restore/save per-project bin/obj across jobs (opt-in; broad binary caches can exhaust hosted runner disk)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    # The restore graph is defined centrally, not per project. Directory.Packages.props
    # sets ManagePackageVersionsCentrally=true and no .csproj carries a Version=
    # attribute on a PackageReference, so package identities and versions can only
    # change there; NuGet.config decides which feeds they come from; global.json pins
    # the SDK band that resolves them. Keying on '**/*.csproj' instead threw the whole
    # ~/.nuget/packages cache away on any csproj edit — a Compile Remove, a new
    # ProjectReference, an InternalsVisibleTo — none of which can change what gets
    # restored. ('**/packages.lock.json' matched nothing: this repo has no lock files.
    # global.json does not exist yet either; it is listed so that adding one later
    # participates in the key automatically.)
    #
    # The coarse restore-key prefix is what makes this safe: a genuinely new package
    # still warm-starts from the most recent cache and downloads only the delta.
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'NuGet.config', 'global.json') }}
        restore-keys: |
          ${{ github.repository }}-${{ runner.os }}-nuget-

    # ADR-0043 PR #1 — Cross-job binary cache. Restores bin/ and obj/ keyed on
    # the content hash of every .cs source + every .csproj + the central
    # package version lock. A cache hit lets `dotnet build --no-restore` skip
    # compilation for unchanged projects entirely; a miss falls through to a
    # normal build, so a stale or empty cache never breaks CI.
    #
    # Opt in via `with: enable-build-cache: 'true'` on the calling job after
    # confirming the restored binary payload fits the hosted runner disk budget.
    - name: Cache .NET build outputs
      if: inputs.enable-build-cache == 'true'
      uses: actions/cache@v5
      with:
        path: |
          **/bin
          **/obj
        key: ${{ github.repository }}-${{ runner.os }}-dotnet-build-${{ hashFiles('**/*.cs', '**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
        restore-keys: |
          ${{ github.repository }}-${{ runner.os }}-dotnet-build-

    - name: Configure GitHub Packages
      shell: bash
      run: |
        nuget_config=""
        for candidate in NuGet.Config NuGet.config; do
          if [[ -f "$candidate" ]] && grep -q 'github-honua' "$candidate"; then
            nuget_config="$candidate"
            break
          fi
        done
        if [[ -n "$nuget_config" ]]; then
          dotnet nuget update source github-honua \
            --configfile "$nuget_config" \
            --username "${{ github.actor }}" \
            --password "${{ github.token }}" \
            --store-password-in-clear-text
        fi

name: Setup .NET CI
description: .NET SDK setup and NuGet cache wiring

inputs:
  dotnet-version:
    description: '.NET SDK version'
    required: false
    default: '10.0.x'
  artifact-sdk-version:
    description: 'Exact SDK selected by the managed-artifact producer; isolates consumer SDK resolution'
    required: false
    default: ''
  enable-build-cache:
    description: 'Restore/save per-project bin/obj across jobs (opt-in; broad binary caches can exhaust hosted runner disk)'
    required: false
    default: 'false'
  nuget-cache-read-only:
    description: 'Restore NuGet packages without saving a cache (required when the source checkout does not match github.ref)'
    required: false
    default: 'false'

outputs:
  dotnet-sdk-version:
    description: 'Actual dotnet --version after setup and any exact producer-SDK selection'
    value: ${{ steps.sdk-identity.outputs.version }}

runs:
  using: composite
  steps:
    - name: Select exact managed producer SDK
      if: inputs.artifact-sdk-version != ''
      shell: bash
      env:
        EXPECTED_DOTNET_SDK: ${{ inputs.artifact-sdk-version }}
      run: |
        [[ "${EXPECTED_DOTNET_SDK}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
          echo '::error::Managed artifacts require an exact producer SDK version.' >&2; exit 1;
        }
        # A newer preinstalled SDK must not win dotnet's default resolution.
        # setup-dotnet installs here, adds this host to PATH and exports DOTNET_ROOT.
        # This is a job-private installation, not a repository/global SDK policy.
        printf 'DOTNET_INSTALL_DIR=%s/honua-managed-sdk/%s\n' "${RUNNER_TEMP}" "${EXPECTED_DOTNET_SDK}" >> "${GITHUB_ENV}"

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ inputs.artifact-sdk-version || inputs.dotnet-version }}

    - name: Record actual SDK identity
      id: sdk-identity
      shell: bash
      env:
        EXPECTED_DOTNET_SDK: ${{ inputs.artifact-sdk-version }}
      run: |
        actual_sdk="$(dotnet --version)"
        [[ "${actual_sdk}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
          echo '::error::Selected SDK did not report an exact version.' >&2; exit 1;
        }
        if [[ -n "${EXPECTED_DOTNET_SDK}" && "${actual_sdk}" != "${EXPECTED_DOTNET_SDK}" ]]; then
          echo "::error::Selected SDK ${actual_sdk} differs from managed producer ${EXPECTED_DOTNET_SDK}." >&2
          exit 1
        fi
        if [[ -n "${EXPECTED_DOTNET_SDK}" ]]; then
          [[ -n "${DOTNET_INSTALL_DIR:-}" && -n "${DOTNET_ROOT:-}" ]] || {
            echo '::error::Managed producer SDK requires its private host and runtime root.' >&2; exit 1;
          }
          actual_host="$(realpath "$(command -v dotnet)")"
          install_root="$(realpath "${DOTNET_INSTALL_DIR}")"
          runtime_root="$(realpath "${DOTNET_ROOT}")"
          [[ "$(dirname "${actual_host}")" == "${install_root}" && "${runtime_root}" == "${install_root}" ]] || {
            echo '::error::Managed SDK host/runtime paths differ from the private producer-SDK installation.' >&2; exit 1;
          }
        fi
        printf 'version=%s\n' "${actual_sdk}" >> "${GITHUB_OUTPUT}"

    # Two-tier key. Package VERSIONS live centrally — Directory.Packages.props sets
    # ManagePackageVersionsCentrally=true and no .csproj carries a Version= attribute
    # on a PackageReference — while package IDENTITIES still live in the .csproj files.
    # Both matter, but they matter differently:
    #
    #   exact tier   central files + '**/*.csproj'
    #                A .csproj edit misses, so the job SAVES a fresh entry. This is what
    #                keeps a newly-referenced package in the cache: Actions cache entries
    #                are immutable, so an exact hit skips the save and a package added by
    #                a csproj-only edit (one already listed in Directory.Packages.props)
    #                would otherwise be re-downloaded by every job, forever.
    #
    #   fallback     central files only
    #                Restores from the newest cache built on the same package versions,
    #                so a csproj-only edit still warm-starts and downloads only the delta
    #                instead of taking a cold restore. This is the churn fix: previously
    #                the ONLY tier was '**/*.csproj' and the fallback was the bare prefix.
    #
    # ('**/packages.lock.json' is dropped from the old key: this repo has no lock files,
    # so it hashed nothing. global.json does not exist yet; it is listed so that adding
    # one later participates in the key automatically.)
    # GitHub makes default-branch caches available to other refs. PRs therefore
    # restore this exact/fallback lineage from trunk, but must not save a second
    # branch-scoped copy of the ~1.7 GB package archive. workflow_run and manual
    # jobs that build a PR from a secondary checkout must opt into read-only mode
    # because github.ref still identifies the workflow's default-branch policy.
    - name: Cache NuGet packages (trunk read/write)
      if: github.ref == 'refs/heads/trunk' && inputs.nuget-cache-read-only != 'true'
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'NuGet.config', 'global.json') }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'NuGet.config', 'global.json') }}-
          ${{ github.repository }}-${{ runner.os }}-nuget-

    - name: Restore NuGet packages (non-trunk read-only)
      if: github.ref != 'refs/heads/trunk' || inputs.nuget-cache-read-only == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.nuget/packages
        key: ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'NuGet.config', 'global.json') }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ github.repository }}-${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'NuGet.config', 'global.json') }}-
          ${{ github.repository }}-${{ runner.os }}-nuget-

    # ADR-0043 PR #1 — Cross-job binary cache. Restores bin/ and obj/ keyed on
    # the content hash of every .cs source + every .csproj + the central
    # package version lock. A cache hit lets `dotnet build --no-restore` skip
    # compilation for unchanged projects entirely; a miss falls through to a
    # normal build, so a stale or empty cache never breaks CI.
    #
    # Opt in via `with: enable-build-cache: 'true'` on the calling job after
    # confirming the restored binary payload fits the hosted runner disk budget.
    - name: Cache .NET build outputs
      if: inputs.enable-build-cache == 'true'
      uses: actions/cache@v5
      with:
        path: |
          **/bin
          **/obj
        key: ${{ github.repository }}-${{ runner.os }}-dotnet-build-${{ hashFiles('**/*.cs', '**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
        restore-keys: |
          ${{ github.repository }}-${{ runner.os }}-dotnet-build-

    - name: Configure GitHub Packages
      shell: bash
      run: |
        nuget_config=""
        for candidate in NuGet.Config NuGet.config; do
          if [[ -f "$candidate" ]] && grep -q 'github-honua' "$candidate"; then
            nuget_config="$candidate"
            break
          fi
        done
        if [[ -n "$nuget_config" ]]; then
          dotnet nuget update source github-honua \
            --configfile "$nuget_config" \
            --username "${{ github.actor }}" \
            --password "${{ github.token }}" \
            --store-password-in-clear-text
        fi

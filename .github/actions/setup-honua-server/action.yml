name: Setup Honua Server
description: >
  Seeds the base schema and starts either a source-built Honua Server or an
  immutable candidate image against PostgreSQL on localhost:5432.

inputs:
  server-image:
    description: >
      Optional immutable image reference. When set, the action skips restore/build
      and runs this image with host networking. Release callers must pass image@sha256.
    required: false
    default: ''
  build-source-fixtures:
    description: >
      Restore and build the source server even when server-image is set. Use this
      when a compatibility fixture starts an auxiliary source-backed server.
    required: false
    default: 'false'
  dotnet-version:
    description: .NET SDK version
    required: true
  base-seed-path:
    description: >
      Path to the SQL seed script to apply after the server migrations complete.
      Defaults to the shared CI base schema used by existing integration jobs.
    required: false
    default: 'tests/seed/base-schema.sql'
  post-seed-yaml:
    description: >
      Path to a version-1 seed YAML file to apply after the base schema
      seed (via apply-yaml-seed.sh). Requires python3 and pyyaml on PATH;
      see setup-honua-mcp which installs both before calling this action.
    required: false
    default: ''
  log-path:
    description: >
      Optional path for redirecting Honua Server stdout/stderr. When omitted,
      the server runs detached without an explicit file sink.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      if: ${{ inputs.server-image == '' || inputs.build-source-fixtures == 'true' }}
      uses: ./.github/actions/setup-dotnet-ci
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore .NET packages
      if: ${{ inputs.server-image == '' || inputs.build-source-fixtures == 'true' }}
      shell: bash
      run: dotnet restore Honua.sln

    - name: Build Honua Server
      if: ${{ inputs.server-image == '' || inputs.build-source-fixtures == 'true' }}
      shell: bash
      run: dotnet build src/Honua.Server --configuration Release --no-restore

    - name: Provision PostGIS extensions
      shell: bash
      run: >-
        PGPASSWORD=honua psql -v ON_ERROR_STOP=1 -h localhost -U honua -d honua_test
        -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_raster;"

    - name: Start Honua Server
      shell: bash
      run: |
        # Always capture stdout/stderr to a log so a failed readiness wait is
        # diagnosable. When the caller supplies an explicit log-path we honour it;
        # otherwise fall back to a runner-temp log that the timeout/crash branch
        # dumps. The runner-temp path is the contract the ci.yml job-level
        # "Dump Honua Server log on failure" step reads (so a server that boots
        # then dies, or a later JS 500, is also diagnosable — not just a
        # readiness timeout). Both sides default to the same runner-temp path.
        if [ -n "$LOG_PATH" ]; then
          mkdir -p "$(dirname "$LOG_PATH")"
          SERVER_LOG="$LOG_PATH"
        else
          SERVER_LOG="${RUNNER_TEMP:-/tmp}/honua-server-setup.log"
        fi

        dump_diagnostics() {
          if [ "$SERVER_MODE" = image ]; then
            docker logs "$SERVER_CONTAINER" > "$SERVER_LOG" 2>&1 || true
          fi
          # Dump the server stdout/stderr AND the DB seed status so the actual
          # startup cause is visible regardless of whether the server crashed,
          # hung, or simply lost the bind race under heavy concurrent load.
          echo "----- Honua Server log (${SERVER_LOG}) -----" >&2
          cat "$SERVER_LOG" >&2 || true
          echo "----- DB seed status (features per layer) -----" >&2
          PGPASSWORD=honua psql -h localhost -U honua -d honua_test \
            -c "SELECT layer_id, COUNT(*) AS feature_count FROM features GROUP BY layer_id ORDER BY layer_id;" >&2 2>&1 || \
            echo "(could not query feature counts — DB unreachable?)" >&2
        }

        OWNED_SERVER="$GITHUB_WORKSPACE/scripts/ci/owned-server.py"
        SERVER_PORT="$(python3 "$OWNED_SERVER" port --variable HONUA_CI_SERVER_PORT --ci-default 5000)"
        export ASPNETCORE_URLS="http://127.0.0.1:$SERVER_PORT"
        if [[ -n "${GITHUB_ENV:-}" ]]; then
          echo "HONUA_BASE_URL=$ASPNETCORE_URLS" >> "$GITHUB_ENV"
          echo "HONUA_TEST_PORT=$SERVER_PORT" >> "$GITHUB_ENV"
        fi
        SERVER_MODE=source
        SERVER_PID=""
        SERVER_CONTAINER=""
        if [ -n "$SERVER_IMAGE" ]; then
          SERVER_MODE=image
          case "$SERVER_IMAGE" in
            *@sha256:*) ;;
            *) echo "warning: server-image is not immutable: $SERVER_IMAGE" >&2 ;;
          esac
          docker pull "$SERVER_IMAGE"
          GRPC_PORT="$(python3 "$OWNED_SERVER" port --variable HONUA_CI_GRPC_PORT --ci-default 8081)"
          SERVER_CONTAINER="$(docker create --rm --network host \
            --env ConnectionStrings__DefaultConnection \
            --env ASPNETCORE_URLS \
            --env "Kestrel__Endpoints__Http__Url=${ASPNETCORE_URLS}" \
            --env "Kestrel__Endpoints__Grpc__Url=http://127.0.0.1:$GRPC_PORT" \
            --env ASPNETCORE_ENVIRONMENT \
            --env Authentication__PortalToken__RequireHttps \
            --env HONUA_ADMIN_PASSWORD \
            --env Security__ConnectionEncryption__MasterKey \
            --env Licensing__DevGrantEdition \
            --env Security__ConnectionEncryption__Salt \
            "$SERVER_IMAGE")"
          docker start --attach "$SERVER_CONTAINER" >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
        else
          dotnet run --project src/Honua.Server --configuration Release --no-build --no-launch-profile > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
        fi

        ownership=(--pid "$SERVER_PID")
        if [[ -n "$SERVER_CONTAINER" ]]; then
          ownership+=(--container "$SERVER_CONTAINER")
        fi
        if ! python3 "$OWNED_SERVER" wait "${ownership[@]}" \
            --url "$ASPNETCORE_URLS/healthz/ready" --body Ready --timeout "${HONUA_CI_SERVER_READY_SECONDS:-180}"; then
          dump_diagnostics
          kill "$SERVER_PID" 2>/dev/null || true
          if [[ -n "$SERVER_CONTAINER" ]]; then docker rm --force "$SERVER_CONTAINER" >/dev/null 2>&1 || true; fi
          exit 1
        fi
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=honua_test;Username=honua;Password=honua"
        ASPNETCORE_URLS: "http://localhost:5000"
        ASPNETCORE_ENVIRONMENT: "Development"
        HONUA_ADMIN_PASSWORD: "ci-admin-password"
        Security__ConnectionEncryption__MasterKey: "test-master-key-that-is-at-least-32-characters-long-for-security"
        # Test/dev-only license override (honua-server#1577): grant Pro entitlements so the
        # out-of-process integration server can exercise edition-gated features (e.g. feature
        # editing, #1548). The in-process .NET fixtures grant this via TestLicenseEntitlementService.
        Licensing__DevGrantEdition: "Pro"
        Security__ConnectionEncryption__Salt: "dGVzdC1zYWx0LWZvci1lbmNyeXB0aW9uLXRlc3RpbmctcHVycG9zZXM="
        LOG_PATH: ${{ inputs.log-path }}
        SERVER_IMAGE: ${{ inputs.server-image }}

    - name: Seed base schema
      shell: bash
      run: PGPASSWORD=honua psql -v ON_ERROR_STOP=1 -h localhost -U honua -d honua_test -f "$BASE_SEED_PATH"
      env:
        BASE_SEED_PATH: ${{ inputs.base-seed-path }}

    - name: Apply additional seed data
      if: ${{ inputs.post-seed-yaml != '' }}
      shell: bash
      run: bash tests/seed/apply-yaml-seed.sh "$SEED_YAML"
      env:
        SEED_YAML: ${{ inputs.post-seed-yaml }}

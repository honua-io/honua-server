name: Build & Publish Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_GHCR: ${{ github.repository }}
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME_DOCKERHUB: honuaio/honua-server
  AWS_ECR_REGION: ${{ vars.AWS_ECR_REGION }}
  AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
  TRIVY_IMAGE: aquasec/trivy:0.68.1

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.image_name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_key: jit
            image_name: Development JIT Image
            dockerfile: Dockerfile
            tag_suffix: -jit
            cache_scope: release-jit
            sarif_output: trivy-results
            sarif_category: trivy
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image_key: jit
            image_name: Development JIT Image
            dockerfile: Dockerfile
            tag_suffix: -jit
            cache_scope: release-jit
            sarif_output: trivy-results
            sarif_category: trivy
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image_key: aot
            image_name: Production Native-AOT Image
            dockerfile: docker/Dockerfile.aot
            tag_suffix: ""
            cache_scope: release-aot
            sarif_output: trivy-results-aot
            sarif_category: trivy-aot
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image_key: aot
            image_name: Production Native-AOT Image
            dockerfile: docker/Dockerfile.aot
            tag_suffix: ""
            cache_scope: release-aot
            sarif_output: trivy-results-aot
            sarif_category: trivy-aot
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials for ECR
        if: ${{ env.AWS_ECR_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: arn:aws:iam::585192672263:role/honua-server-gha-ecr-publish
          aws-region: ${{ env.AWS_ECR_REGION }}

      - name: Resolve ECR registry
        if: ${{ env.AWS_ECR_REGION != '' }}
        id: ecr
        shell: bash
        env:
          ECR_REGION: ${{ env.AWS_ECR_REGION }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${ECR_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        if: ${{ steps.ecr.outputs.registry != '' }}
        shell: bash
        env:
          ECR_REGION: ${{ env.AWS_ECR_REGION }}
        run: |
          set -euo pipefail
          repo="${AWS_ECR_REPOSITORY:-honua-server}"
          if ! aws ecr describe-repositories --repository-names "$repo" --region "$ECR_REGION" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$repo" \
              --image-scanning-configuration scanOnPush=true \
              --region "$ECR_REGION" >/dev/null
          fi

      - name: Log in to ECR
        if: ${{ steps.ecr.outputs.registry != '' }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Validate Azure ACR publish credentials
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Azure credential for ACR publish: $name" >&2
              exit 1
            fi
          done

      - name: Log in to ACR
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          acr_name="${ACR_LOGIN_SERVER%%.*}"
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" >/dev/null
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          az acr login --name "$acr_name"

      - name: Resolve target image names
        id: targets
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ACR_LOGIN_SERVER: ${{ env.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          ecr_repo="${AWS_ECR_REPOSITORY:-honua-server}"
          acr_repo="${ACR_REPOSITORY:-honua-server}"
          {
            echo "images<<EOF"
            printf '%s\n' \
              "${REGISTRY_GHCR}/${IMAGE_NAME_GHCR}" \
              "${REGISTRY_DOCKERHUB}/${IMAGE_NAME_DOCKERHUB}"
            if [ -n "$ECR_REGISTRY" ]; then
              printf '%s\n' "${ECR_REGISTRY}/${ecr_repo}"
            fi
            if [ -n "$ACR_LOGIN_SERVER" ]; then
              printf '%s\n' "${ACR_LOGIN_SERVER}/${acr_repo}"
            fi
            echo "EOF"
            echo "staging_image=${REGISTRY_GHCR}/${IMAGE_NAME_GHCR}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }}
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}},suffix=${{ matrix.tag_suffix }}
            type=sha,prefix={{branch}}-,suffix=${{ matrix.tag_suffix }}
            type=raw,value=latest${{ matrix.tag_suffix }},enable={{is_default_branch}}

      - name: Add explicit arch suffixes to image tags
        id: arch_tags
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              printf '%s-%s\n' "$tag" "$ARCH"
            done <<< "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build native-AOT candidate by digest
        id: aot_candidate
        if: matrix.image_key == 'aot'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.targets.outputs.staging_image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          provenance: true
          sbom: true

      - name: Verify native-AOT candidate before registry publication
        if: matrix.image_key == 'aot'
        shell: bash
        env:
          CANDIDATE: ${{ steps.targets.outputs.staging_image }}@${{ steps.aot_candidate.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$CANDIDATE"
          python3 scripts/ci/verify-serving-image-boundary.py --serving-image "$CANDIDATE"

      - name: Publish verified native-AOT architecture tags
        if: matrix.image_key == 'aot'
        shell: bash
        env:
          CANDIDATE: ${{ steps.targets.outputs.staging_image }}@${{ steps.aot_candidate.outputs.digest }}
          TAGS: ${{ steps.arch_tags.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --prefer-index=false --tag "$tag" "$CANDIDATE"
          done <<< "$TAGS"

      - name: Build and push JIT image
        id: build
        if: matrix.image_key == 'jit'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          provenance: true
          sbom: true

      - name: Pull image for Trivy scan
        id: scan_prep
        shell: bash
        env:
          SCAN_SOURCE: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}@${{ matrix.image_key == 'aot' && steps.aot_candidate.outputs.digest || steps.build.outputs.digest }}
          SCAN_LOCAL: honua-scan:${{ matrix.image_key }}-${{ matrix.arch }}-${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$SCAN_SOURCE"
          docker tag "$SCAN_SOURCE" "$SCAN_LOCAL"
          echo "scan_local=$SCAN_LOCAL" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        shell: bash
        env:
          SARIF_OUTPUT: ${{ matrix.sarif_output }}-${{ matrix.arch }}.sarif
          SCAN_LOCAL: ${{ steps.scan_prep.outputs.scan_local }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --skip-version-check \
            --format sarif \
            --output "/work/$SARIF_OUTPUT" \
            "$SCAN_LOCAL"

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('{0}-{1}.sarif', matrix.sarif_output, matrix.arch)) != ''
        with:
          sarif_file: ${{ matrix.sarif_output }}-${{ matrix.arch }}.sarif
          category: ${{ matrix.sarif_category }}-${{ matrix.arch }}

  publish-manifests:
    name: Publish ${{ matrix.image_name }} Manifest
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: Development JIT Image
            tag_suffix: -jit
            compatibility_alias: ""
          - image_name: Production Native-AOT Image
            tag_suffix: ""
            compatibility_alias: -aot
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials for ECR
        if: ${{ env.AWS_ECR_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: arn:aws:iam::585192672263:role/honua-server-gha-ecr-publish
          aws-region: ${{ env.AWS_ECR_REGION }}

      - name: Resolve ECR registry
        if: ${{ env.AWS_ECR_REGION != '' }}
        id: ecr
        shell: bash
        env:
          ECR_REGION: ${{ env.AWS_ECR_REGION }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${ECR_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        if: ${{ steps.ecr.outputs.registry != '' }}
        shell: bash
        env:
          ECR_REGION: ${{ env.AWS_ECR_REGION }}
        run: |
          set -euo pipefail
          repo="${AWS_ECR_REPOSITORY:-honua-server}"
          if ! aws ecr describe-repositories --repository-names "$repo" --region "$ECR_REGION" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$repo" \
              --image-scanning-configuration scanOnPush=true \
              --region "$ECR_REGION" >/dev/null
          fi

      - name: Log in to ECR
        if: ${{ steps.ecr.outputs.registry != '' }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Validate Azure ACR publish credentials
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Azure credential for ACR publish: $name" >&2
              exit 1
            fi
          done

      - name: Log in to ACR
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          acr_name="${ACR_LOGIN_SERVER%%.*}"
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" >/dev/null
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          az acr login --name "$acr_name"

      - name: Resolve target image names
        id: targets
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ACR_LOGIN_SERVER: ${{ env.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          ecr_repo="${AWS_ECR_REPOSITORY:-honua-server}"
          acr_repo="${ACR_REPOSITORY:-honua-server}"
          {
            echo "images<<EOF"
            printf '%s\n' \
              "${REGISTRY_GHCR}/${IMAGE_NAME_GHCR}" \
              "${REGISTRY_DOCKERHUB}/${IMAGE_NAME_DOCKERHUB}"
            if [ -n "$ECR_REGISTRY" ]; then
              printf '%s\n' "${ECR_REGISTRY}/${ecr_repo}"
            fi
            if [ -n "$ACR_LOGIN_SERVER" ]; then
              printf '%s\n' "${ACR_LOGIN_SERVER}/${acr_repo}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }}
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}},suffix=${{ matrix.tag_suffix }}
            type=sha,prefix={{branch}}-,suffix=${{ matrix.tag_suffix }}
            type=raw,value=latest${{ matrix.tag_suffix }},enable={{is_default_branch}}

      - name: Create and push multi-arch manifests
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          COMPATIBILITY_ALIAS: ${{ matrix.compatibility_alias }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            targets=(-t "$tag")
            if [ -n "$COMPATIBILITY_ALIAS" ]; then
              targets+=(-t "${tag}${COMPATIBILITY_ALIAS}")
            fi
            docker buildx imagetools create "${targets[@]}" \
              "${tag}-amd64" "${tag}-arm64"
          done

  dispatch-geobench:
    name: Trigger per-release benchmark (geobench)
    needs: publish-manifests
    # Only fire on release tags, after the multi-arch manifests are published so
    # the geobench suite can pull ghcr.io/honua-io/honua-server:<tag>. (#1596)
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.publish-manifests.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Dispatch honua-server-release event to geobench
        shell: bash
        env:
          # PAT with actions:write (repository_dispatch) on honua-io/geobench.
          # The repo-scoped GITHUB_TOKEN cannot dispatch to a different repo, so
          # without this secret the step skips with a clear notice rather than
          # failing the release. Configure GEOBENCH_DISPATCH_TOKEN in repo secrets
          # to enable per-release benchmark tracking (#1596).
          GEOBENCH_DISPATCH_TOKEN: ${{ secrets.GEOBENCH_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          HONUA_IMAGE: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GEOBENCH_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::GEOBENCH_DISPATCH_TOKEN not set; skipping geobench per-release benchmark dispatch for ${RELEASE_TAG}."
            exit 0
          fi

          payload=$(printf '{"event_type":"honua-server-release","client_payload":{"release_tag":"%s","honua_image":"%s","save_baseline":"false"}}' \
            "${RELEASE_TAG}" "${HONUA_IMAGE}")

          echo "Dispatching honua-server-release to honua-io/geobench for ${RELEASE_TAG} (image ${HONUA_IMAGE})."
          http_status=$(curl -sS -o /tmp/geobench-dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GEOBENCH_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/honua-io/geobench/dispatches \
            -d "${payload}")

          if [ "${http_status}" != "204" ]; then
            echo "::error::geobench dispatch failed (HTTP ${http_status})."
            cat /tmp/geobench-dispatch.out || true
            exit 1
          fi
          echo "geobench per-release benchmark dispatch accepted (HTTP 204)."

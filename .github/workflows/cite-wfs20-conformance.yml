name: WFS 2.0 CITE Conformance Tests

on:
  # Manual trigger for on-demand testing
  workflow_dispatch:
    inputs:
      profile:
        description: 'CITE test profile to run'
        required: true
        default: 'basic'
        type: choice
        options:
        - basic
        - transactional
        - full

  # Weekly scheduled run
  schedule:
    - cron: '0 3 * * 1'  # Monday 3 AM UTC

  # Tier: nightly — conformance suites are external and heavyweight.
  # PR/push triggers removed in #485. See docs/ci/gate-model.md.

permissions:
  contents: read
  packages: read
  actions: read
  checks: write

env:
  CITE_PROFILE: ${{ github.event.inputs.profile || 'basic' }}

concurrency:
  group: cite-wfs20-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wfs20-cite-conformance:
    name: WFS 2.0 CITE Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        profile:
          - ${{ github.event.inputs.profile || 'basic' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Free disk space for CITE Team Engine
      run: |
        # Free up space for CITE Team Engine and related containers
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/pipx
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/swift
        sudo apt-get autoremove -y
        sudo apt-get clean
        docker system prune -af
        df -h

    - name: Install system dependencies
      run: |
        # Install xmlstarlet for parsing CITE XML results
        sudo apt-get update
        sudo apt-get install -y xmlstarlet curl

    - name: Log system information
      run: |
        echo "Runner OS: ${{ runner.os }}"
        echo "Runner architecture: ${{ runner.arch }}"
        echo "Available disk space:"
        df -h
        echo "Available memory:"
        free -h
        echo "Docker version:"
        docker --version
        docker-compose --version || docker compose version
        echo "CITE Profile: ${{ matrix.profile }}"

    - name: Build Honua Server image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: honua-server:latest
        secrets: |
          github_actor=${{ github.actor }}
          github_token=${{ secrets.GITHUB_TOKEN }}
        cache-from: type=gha,scope=cite-wfs20
        cache-to: type=gha,mode=max,scope=cite-wfs20
        # buildx defaults to attaching provenance/SBOM attestations, which
        # produce an OCI image index (manifest list). The docker exporter
        # used by `load: true` cannot export a manifest list, so the build
        # fails with "docker exporter does not currently support exporting
        # manifest lists". Disable inline attestations to keep a single-image
        # output that loads into the local daemon for the CITE run. The SPDX
        # SBOM is still captured by the anchore/sbom-action step below.
        provenance: false
        sbom: false

    # Capture SPDX SBOM alongside CITE WFS 2.0 evidence so conformance
    # artifacts are reproducible to a known component list.
    - name: Generate SBOM (SPDX JSON) for honua-server:latest
      uses: anchore/sbom-action@v0
      with:
        image: honua-server:latest
        format: spdx-json
        output-file: sbom-honua-server-cite-wfs20-${{ matrix.profile }}.spdx.json
        artifact-name: sbom-honua-server-cite-wfs20-${{ matrix.profile }}.spdx.json
        upload-artifact: true
        upload-release-assets: false

    - name: Pre-pull CITE images
      run: |
        echo "Pre-pulling OGC CITE Team Engine images..."
        docker pull ogccite/ets-wfs20:latest
        docker pull postgis/postgis:15-3.3
        docker pull curlimages/curl:8.5.0

    - name: Verify CITE infrastructure
      run: |
        echo "Verifying CITE testing infrastructure..."

        # Verify Docker Compose file exists
        if [ ! -f "docker/cite/wfs20/compose.yml" ]; then
          echo "❌ CITE Docker Compose file missing"
          exit 1
        fi

        # Verify CITE scripts exist
        if [ ! -f "docker/cite/shared/scripts/execute-wfs20-tests.sh" ]; then
          echo "❌ CITE execution script missing"
          exit 1
        fi

        # Verify test data exists
        if [ ! -f "docker/cite/shared/test-data/01-init-cite-test-data.sql" ]; then
          echo "❌ CITE test data missing"
          exit 1
        fi

        # Make CITE scripts executable
        chmod +x scripts/conformance/cite/run-cite-wfs20-tests.sh
        chmod +x docker/cite/shared/scripts/execute-wfs20-tests.sh

        echo "✅ CITE infrastructure verified"

    - name: Execute WFS 2.0 CITE conformance tests
      env:
        HONUA_CITE_SKIP_BUILD: 'true'
      run: |
        echo "Executing OGC WFS 2.0 CITE conformance tests..."
        echo "Profile: ${{ matrix.profile }}"
        echo "Expected duration: 15-45 minutes"

        # Set environment variable for docker-compose
        export CITE_PROFILE="${{ matrix.profile }}"

        # Run CITE tests with verbose output
        ./scripts/conformance/cite/run-cite-wfs20-tests.sh \
          --profile "${{ matrix.profile }}" \
          --verbose \
          --no-cleanup

    - name: Analyze CITE results
      if: always()
      run: |
        echo "Analyzing WFS 2.0 CITE conformance results..."

        # Ensure results directory exists
        mkdir -p cite-wfs20-results

        # Check if we have test results
        if [ -d "cite-wfs20-results" ] && [ "$(ls -A cite-wfs20-results)" ]; then
          echo "=== CITE Test Results Found ==="
          find cite-wfs20-results -type f -name "*.xml" -o -name "*.log" -o -name "*.md" | head -10
        else
          echo "⚠️ No CITE test results found"
        fi

        # Parse compliance status from results
        COMPLIANCE_STATUS="UNKNOWN"
        PASSED_TESTS=0
        TOTAL_TESTS=0

        if [ -f "cite-wfs20-results/cite-compliance-report.xml" ]; then
          echo "Found XML compliance report"
          PASSED_TESTS=$(xmlstarlet sel -t -v "//testsPassed" cite-wfs20-results/cite-compliance-report.xml 2>/dev/null || echo "0")
          TOTAL_TESTS=$(xmlstarlet sel -t -v "//testsRun" cite-wfs20-results/cite-compliance-report.xml 2>/dev/null || echo "0")
          COMPLIANCE_STATUS=$(xmlstarlet sel -t -v "//status" cite-wfs20-results/cite-compliance-report.xml 2>/dev/null || echo "UNKNOWN")
        elif [ -f "cite-wfs20-results/cite-runner.log" ]; then
          echo "Parsing results from cite-runner logs"
          if grep -q "FULL WFS 2.0 CITE COMPLIANCE ACHIEVED" cite-wfs20-results/cite-runner.log; then
            COMPLIANCE_STATUS="COMPLIANT"
          elif grep -q "Partial WFS 2.0" cite-wfs20-results/cite-runner.log; then
            COMPLIANCE_STATUS="PARTIAL"
          fi
        fi

        # Store results for the summary step
        echo "COMPLIANCE_STATUS=$COMPLIANCE_STATUS" >> $GITHUB_ENV
        echo "PASSED_TESTS=$PASSED_TESTS" >> $GITHUB_ENV
        echo "TOTAL_TESTS=$TOTAL_TESTS" >> $GITHUB_ENV

        echo "Compliance Status: $COMPLIANCE_STATUS"
        echo "Tests Passed: $PASSED_TESTS/$TOTAL_TESTS"

    - name: Upload CITE test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: wfs20-cite-results-${{ matrix.profile }}-${{ github.run_number }}
        path: cite-wfs20-results/
        retention-days: 30
        if-no-files-found: warn

    - name: Generate compliance report comment
      if: always()
      run: |
        echo "Generating WFS 2.0 CITE compliance report for PR comments..."

        # Create a summary for PR comments
        cat > cite-comment-summary.md << EOF
        ## 🧪 WFS 2.0 CITE Conformance Results

        **Profile:** ${{ matrix.profile }}
        **Status:** ${{ env.COMPLIANCE_STATUS }}
        **Tests:** ${{ env.PASSED_TESTS }}/${{ env.TOTAL_TESTS }} passed

        $(
        if [[ "${{ env.COMPLIANCE_STATUS }}" == "COMPLIANT" ]]; then
          echo "🎉 **FULL CITE COMPLIANCE ACHIEVED!**"
        elif [[ "${{ env.COMPLIANCE_STATUS }}" == "PARTIAL" ]]; then
          echo "⚠️ **Partial Compliance** - Core functionality works"
        elif [[ "${{ env.COMPLIANCE_STATUS }}" == "NON_COMPLIANT" ]]; then
          echo "❌ **Non-Compliant** - Implementation issues detected"
        else
          echo "⚙️ **Status Unknown** - Test execution may have failed"
        fi
        )

        **Test Environment:**
        - OGC CITE Team Engine: ets-wfs20
        - Test Data: PostGIS with sample geometries
        - Profile: ${{ matrix.profile }}

        **Artifacts:** Test results and logs available in workflow artifacts.

        ---
        *Generated by WFS 2.0 CITE Conformance Tests*
        EOF

    - name: Determine workflow success
      if: always()
      run: |
        echo "=== WFS 2.0 CITE Conformance Final Status ==="
        echo "Profile: ${{ matrix.profile }}"
        echo "Compliance: ${{ env.COMPLIANCE_STATUS }}"
        echo "Tests: ${{ env.PASSED_TESTS }}/${{ env.TOTAL_TESTS }}"

        # Success criteria for CI
        case "${{ env.COMPLIANCE_STATUS }}" in
          "COMPLIANT")
            echo "🎉 WFS 2.0 CITE compliance achieved!"
            exit 0
            ;;
          "PARTIAL")
            if [ "${{ env.PASSED_TESTS }}" -gt 0 ]; then
              echo "❌ Partial WFS 2.0 compliance is not sufficient for this conformance gate"
              exit 1
            else
              echo "❌ No tests passed - implementation needs work"
              exit 1
            fi
            ;;
          "NON_COMPLIANT")
            echo "❌ WFS 2.0 CITE compliance failed"
            echo "See artifacts for detailed analysis"
            exit 1
            ;;
          *)
            echo "❌ CITE test execution status unknown"
            echo "Unknown or missing results are a workflow failure"
            exit 1
            ;;
        esac

  conformance-summary:
    name: CITE Conformance Summary
    runs-on: ubuntu-latest
    needs: wfs20-cite-conformance
    if: always()

    steps:
    - name: Download all artifacts
      if: always()
      uses: actions/download-artifact@v8
      with:
        path: all-cite-results

    - name: Generate final summary
      if: always()
      run: |
        echo "=== WFS 2.0 CITE Conformance Test Summary ==="
        echo "GitHub Run: ${{ github.run_number }}"
        echo "Profile: ${{ env.CITE_PROFILE }}"
        echo "Workflow Result: ${{ needs.wfs20-cite-conformance.result }}"

        # List all available result artifacts
        echo ""
        echo "Available Test Artifacts:"
        find all-cite-results -type f -name "*.md" -o -name "*.xml" -o -name "*.log" | head -20

        case "${{ needs.wfs20-cite-conformance.result }}" in
          "success")
            echo ""
            echo "✅ WFS 2.0 CITE conformance testing completed successfully"
            echo "The implementation meets OGC WFS 2.0 compliance requirements."
            ;;
          "failure")
            echo ""
            echo "❌ WFS 2.0 CITE conformance testing failed"
            echo "Implementation gaps need to be addressed for full compliance."
            ;;
          *)
            echo ""
            echo "⚠️ WFS 2.0 CITE conformance testing had issues"
            echo "Manual review of test artifacts may be required."
            ;;
        esac

        echo ""
        echo "📊 **Implementation Progress:**"
        echo "- WFS 2.0 endpoint structure: ✅ Complete"
        echo "- Basic operations framework: ✅ Complete"
        echo "- CITE test integration: ✅ Complete"
        echo "- Full OGC compliance: $(if [ '${{ needs.wfs20-cite-conformance.result }}' = 'success' ]; then echo '✅ Achieved'; else echo '🚧 In progress'; fi)"

        # The summary step never fails the workflow
        exit 0

name: Docs Public Install

# PRs select this same proof inside the required PR Gate. This entry point is
# for manually rechecking published artifacts without a source build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-public-install-manual
  cancel-in-progress: false

jobs:
  public-install:
    name: Public Docker install, publish, query and restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Replay the published quickstart without registry credentials
        run: python3 scripts/docs-validation/validate_public_install.py
      - name: Upload bounded installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-public-install
          path: artifacts/docs-validation/public-install/receipt.json
          if-no-files-found: warn
          retention-days: 14

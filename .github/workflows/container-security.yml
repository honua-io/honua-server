name: Container Security Scan

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  schedule:
    # Run nightly security scans
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  dockerfile-security-scan:
    name: Dockerfile Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint (Dockerfile Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-color: true
          failure-threshold: error

      - name: Upload Hadolint results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: hadolint-results.sarif

  build-scan-image:
    name: Build and Scan Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.build.outputs.imageid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image for scanning
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:security-scan
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for high/critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:security-scan
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v5
        id: grype-scan
        with:
          image: ${{ env.IMAGE_NAME }}:security-scan
          fail-build: true
          severity-cutoff: high

      - name: Upload Grype scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}

  container-structure-test:
    name: Container Structure Tests
    runs-on: ubuntu-latest
    needs: build-scan-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:structure-test

      - name: Install container-structure-test
        run: |
          curl -LO https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test

      - name: Create structure test config
        run: |
          cat > container-structure-test.yaml << EOF
          schemaVersion: 2.0.0

          commandTests:
            - name: "Check binary exists and is executable"
              command: "ls"
              args: ["-la", "/app/Honua.Server"]
              expectedOutput: [".*-rwxr-xr-x.*Honua.Server"]

            - name: "Check non-root user"
              command: "whoami"
              expectedOutput: ["honua"]

            - name: "Check required directories exist"
              command: "ls"
              args: ["-la", "/tmp"]
              expectedOutput: [".*honua-logs.*", ".*honua-cache.*"]

          fileExistenceTests:
            - name: 'Application binary'
              path: '/app/Honua.Server'
              shouldExist: true
              permissions: '-rwxr-xr-x'

            - name: 'Log directory'
              path: '/tmp/honua-logs'
              shouldExist: true
              isDirectory: true

            - name: 'Cache directory'
              path: '/tmp/honua-cache'
              shouldExist: true
              isDirectory: true

          metadataTest:
            exposedPorts: ["8080"]
            user: "honua"
            workdir: "/app"
          EOF

      - name: Run container structure tests
        run: |
          container-structure-test test \
            --image ${{ env.IMAGE_NAME }}:structure-test \
            --config container-structure-test.yaml

  security-benchmark:
    name: CIS Docker Benchmark
    runs-on: ubuntu-latest
    needs: build-scan-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build benchmark image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:benchmark

      - name: Run Docker Bench for Security
        run: |
          docker run --rm \
            --net host \
            --pid host \
            --userns host \
            --cap-add audit_control \
            -e DOCKER_CONTENT_TRUST=$DOCKER_CONTENT_TRUST \
            -v /var/lib:/var/lib:ro \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v /usr/lib/systemd:/usr/lib/systemd:ro \
            -v /etc:/etc:ro \
            --label docker_bench_security \
            docker/docker-bench-security || true

  runtime-security-scan:
    name: Runtime Security Analysis
    runs-on: ubuntu-latest
    needs: build-scan-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:runtime-test

      - name: Start container for runtime analysis
        run: |
          # Start container in detached mode
          docker run -d \
            --name honua-runtime-test \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 8080:8080 \
            ${{ env.IMAGE_NAME }}:runtime-test

          # Wait for container to start
          sleep 10

      - name: Test runtime security constraints
        run: |
          echo "Testing runtime security..."

          # Test read-only filesystem
          if docker exec honua-runtime-test touch /test-write 2>/dev/null; then
            echo "❌ Container filesystem is writable (should be read-only)"
            exit 1
          else
            echo "✅ Container filesystem is read-only"
          fi

          # Test capabilities
          if docker exec honua-runtime-test capsh --print | grep -q "Current:"; then
            echo "⚠️  Container has capabilities"
          else
            echo "✅ Container has minimal capabilities"
          fi

          # Test user
          user=$(docker exec honua-runtime-test whoami)
          if [[ "$user" != "honua" ]]; then
            echo "❌ Container not running as expected user: $user"
            exit 1
          else
            echo "✅ Container running as non-root user: $user"
          fi

      - name: Test application health
        run: |
          # Test health endpoints
          if curl -f http://localhost:8080/healthz/live; then
            echo "✅ Application liveness check passed"
          else
            echo "❌ Application liveness check failed"
            exit 1
          fi

      - name: Cleanup runtime test
        if: always()
        run: |
          docker stop honua-runtime-test || true
          docker rm honua-runtime-test || true

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [dockerfile-security-scan, build-scan-image, container-structure-test, security-benchmark, runtime-security-scan]
    if: always()
    steps:
      - name: Download security artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Generate security summary
        run: |
          echo "# 🔒 Container Security Report" > security-report.md
          echo "" >> security-report.md
          echo "**Scan Date**: $(date)" >> security-report.md
          echo "**Commit**: ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md

          echo "## 📊 Security Scan Results" >> security-report.md
          echo "" >> security-report.md

          # Check job results
          if [[ "${{ needs.dockerfile-security-scan.result }}" == "success" ]]; then
            echo "✅ Dockerfile Security Analysis: PASSED" >> security-report.md
          else
            echo "❌ Dockerfile Security Analysis: FAILED" >> security-report.md
          fi

          if [[ "${{ needs.build-scan-image.result }}" == "success" ]]; then
            echo "✅ Vulnerability Scanning: PASSED" >> security-report.md
          else
            echo "❌ Vulnerability Scanning: FAILED" >> security-report.md
          fi

          if [[ "${{ needs.container-structure-test.result }}" == "success" ]]; then
            echo "✅ Container Structure Tests: PASSED" >> security-report.md
          else
            echo "❌ Container Structure Tests: FAILED" >> security-report.md
          fi

          if [[ "${{ needs.runtime-security-scan.result }}" == "success" ]]; then
            echo "✅ Runtime Security Analysis: PASSED" >> security-report.md
          else
            echo "❌ Runtime Security Analysis: FAILED" >> security-report.md
          fi

          echo "" >> security-report.md
          echo "## 🔧 Security Recommendations" >> security-report.md
          echo "" >> security-report.md
          echo "- Regularly update base images" >> security-report.md
          echo "- Monitor security advisories" >> security-report.md
          echo "- Keep dependencies up to date" >> security-report.md
          echo "- Review and rotate secrets" >> security-report.md
          echo "- Implement runtime monitoring" >> security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 30
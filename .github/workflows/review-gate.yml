name: Review Gate Attestation

on:
  pull_request_target:
    branches: [trunk]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, closed]
  pull_request_review:
    types: [submitted, dismissed, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["PR Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-attest
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.inputs.pr || github.run_id }}
  # Never interrupt this trusted workflow between accepting a rerun and
  # recording the result. A later event serializes, observes attempt 2, and
  # becomes a deterministic no-op.
  cancel-in-progress: false

env:
  # Keep synchronized with pr-gate.yml. Observe mode records the exact decision
  # but performs no Actions mutation; #3216 owns the measured flip to enforce.
  REVIEW_FIRST_MODE: observe

jobs:
  attest:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    name: Publish SHA-bound Codex review attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Untrusted PR events always evaluate the default-branch policy. A manual
          # workflow_dispatch may intentionally validate a reviewed policy fix at
          # its selected ref, which provides the bootstrap path when the default
          # policy itself cannot recognize the connector's clean-result shape.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Attest current PR head
        uses: actions/github-script@v9
        with:
          script: |
            const { evaluateCodexEvidence, isCodex } = require('./scripts/ci/review-gate-evidence');
            const { fetchPullRequestSnapshot } = require('./scripts/ci/review-gate-snapshot');
            const {
              evaluateReviewFirstDispatch,
              selectExactAdmissionRun,
            } = require('./scripts/ci/review-first-dispatch');
            // workflow_run only carries pull_requests for same-repo PRs; GitHub
            // leaves it empty for fork PRs. Fall back to a head-SHA search (same
            // pattern as ci-failure-triage.yml) so fork PRs still get re-attested
            // when PR Gate completes, instead of failing before publishing status.
            let prNumber = Number(
              context.payload.pull_request?.number ||
              context.payload.issue?.number ||
              context.payload.workflow_run?.pull_requests?.[0]?.number ||
              '${{ github.event.inputs.pr }}'
            );
            if (!prNumber && context.payload.workflow_run) {
              const { data: assocPrs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo, commit_sha: context.payload.workflow_run.head_sha,
              });
              const openPr = assocPrs.find(p => p.state === 'open');
              if (openPr) prNumber = openPr.number;
            }
            if (!prNumber) {
              core.setFailed('Event does not identify a pull request.');
              return;
            }

            const pr = await fetchPullRequestSnapshot(
              github, context.repo.owner, context.repo.repo, prNumber);
            if (!pr) {
              core.setFailed(`PR #${prNumber} not found.`);
              return;
            }
            const head = pr.headRefOid;
            const labels = new Set(pr.labels.nodes.map(label => label.name));
            const reasons = [];
            if (pr.state !== 'OPEN') reasons.push('pull request is not open');
            if (pr.isDraft) reasons.push('pull request is draft');
            for (const label of ['hold', 'train:hold', 'train:escalated']) {
              if (labels.has(label)) reasons.push(`blocked by ${label}`);
            }
            const snapshotTruncated = pr.labels.pageInfo.hasNextPage ||
                pr.reviews.pageInfo.hasNextPage ||
                pr.comments.pageInfo.hasNextPage ||
                pr.reviewThreads.pageInfo.hasNextPage ||
                pr.reviewThreads.nodes.some(thread => thread.comments.pageInfo.hasNextPage);
            if (snapshotTruncated) {
              reasons.push('bounded review query truncated');
            }

            const unresolved = pr.reviewThreads.nodes.filter(thread =>
              !thread.isResolved && thread.comments.nodes.some(comment =>
                isCodex(comment.author?.login) && comment.commit?.oid === head));
            if (unresolved.length) reasons.push(`${unresolved.length} unresolved Codex thread(s)`);

            const cleanComments = await Promise.all(pr.comments.nodes.map(async comment => {
              if (!isCodex(comment.author?.login)) return comment;
              const matches = [...(comment.body || '').matchAll(
                /(?:\*\*Reviewed commit:\*\*|Reviewed commit:)\s*`([0-9a-f]{10,40})`/gi
              )];
              if (matches.length !== 1) return comment;
              const ref = matches[0][1];
              if (ref.length === 40) return { ...comment, resolvedCommitOid: ref };
              try {
                const { data: commit } = await github.rest.repos.getCommit({
                  ...context.repo, ref,
                });
                return { ...comment, resolvedCommitOid: commit.sha };
              } catch (error) {
                core.warning(`Could not uniquely resolve reviewed commit ${ref}: ${error.message}`);
                return comment;
              }
            }));

            const { exactReview, exactCleanComment } = evaluateCodexEvidence({
              reviews: pr.reviews.nodes, cleanComments,
              unresolvedCount: unresolved.length, head,
            });

            if (!exactReview && !exactCleanComment) {
              reasons.push('no exact-head Codex review evidence');
            }
            const state = reasons.length === 0 ? 'success' : 'failure';
            const description = reasons.length === 0
              ? 'Codex reviewed this exact head'
              : reasons.join('; ').slice(0, 140);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: head, state, context: 'Review Gate', description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`,
            });
            if (state !== 'success') {
              core.setFailed(description);
              return;
            }

            // The trusted default-branch workflow is the only review-first
            // transition authority. It never checks out the PR head and never
            // executes PR-authored code. It merely releases the already-created,
            // read-only pull_request workflow run for this immutable head.
            const { data: runPage } = await github.rest.actions.listWorkflowRunsForWorkflow({
              ...context.repo,
              workflow_id: 'pr-gate.yml',
              event: 'pull_request',
              head_sha: head,
              per_page: 100,
            });
            if (runPage.total_count > runPage.workflow_runs.length) {
              throw new Error('Exact-head PR Gate run query exceeded its bounded page.');
            }

            const { data: associatedPulls } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo, commit_sha: head,
              });
            const associatedPullNumbers = associatedPulls
              .filter(candidate => candidate.state === 'open' && candidate.head?.sha === head)
              .map(candidate => candidate.number);

            const selection = selectExactAdmissionRun({
              runs: runPage.workflow_runs,
              prNumber,
              head,
              associatedPullNumbers,
            });
            let jobs = [];
            if (selection.action === 'selected' &&
                selection.run.status === 'completed' &&
                Number(selection.run.run_attempt) === 1) {
              const { data: jobPage } = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo,
                run_id: selection.run.id,
                filter: 'latest',
                per_page: 100,
              });
              if (jobPage.total_count > jobPage.jobs.length) {
                throw new Error('Exact-head PR Gate job query exceeded its bounded page.');
              }
              jobs = jobPage.jobs;
            }

            const decision = evaluateReviewFirstDispatch({
              mode: process.env.REVIEW_FIRST_MODE,
              reviewReady: true,
              snapshotTruncated,
              runs: runPage.workflow_runs,
              jobs,
              prNumber,
              head,
              associatedPullNumbers,
            });
            const runUrl = decision.runId
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${decision.runId}`
              : 'n/a';
            core.info(`Review-first decision: ${decision.action}: ${decision.reason}`);
            await core.summary
              .addHeading('Review-first PR verification')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['Mode', process.env.REVIEW_FIRST_MODE],
                ['PR / head', `#${prNumber} / ${head}`],
                ['Decision', decision.action],
                ['Reason', decision.reason],
                ['PR Gate run', runUrl],
              ])
              .write();

            if (decision.action === 'block') {
              core.setFailed(`Review-first dispatch blocked: ${decision.reason}`);
              return;
            }
            if (decision.action !== 'rerun') return;

            // Close the event/snapshot race immediately before the mutation.
            // A later synchronize event will create and evaluate a new exact-
            // head admission run; it must not spend runners on the old head.
            const { data: currentPr } = await github.rest.pulls.get({
              ...context.repo, pull_number: prNumber,
            });
            const currentLabels = new Set(currentPr.labels.map(label => label.name));
            if (currentPr.state !== 'open' || currentPr.draft || currentPr.head.sha !== head ||
                ['hold', 'train:hold', 'train:escalated'].some(label => currentLabels.has(label))) {
              core.info('PR state/head changed before dispatch; the current event is now a no-op.');
              return;
            }

            try {
              await github.rest.actions.reRunWorkflowFailedJobs({
                ...context.repo, run_id: decision.runId,
              });
              core.notice(`Released PR Gate run ${decision.runId} as attempt 2.`);
            } catch (error) {
              // A burst of review/comment events may serialize immediately
              // behind the accepted request. Re-read before deciding whether
              // this was an idempotent duplicate or a real dispatch failure.
              const { data: refreshed } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: decision.runId,
              });
              if (Number(refreshed.run_attempt) > 1 || refreshed.status !== 'completed') {
                core.info(`Rerun already accepted for ${decision.runId}; duplicate event is a no-op.`);
                return;
              }
              throw error;
            }

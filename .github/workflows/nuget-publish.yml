name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build-and-publish:
    name: Build and Publish NuGet Packages
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Determine Version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/v}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Publishing version: ${VERSION}"

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Working Projects Only
      run: |
        echo "Building projects that are known to compile successfully..."

        # Build core infrastructure projects only (exclude SDK projects with compilation issues)
        dotnet build src/Honua.Core/Honua.Core.csproj --configuration Release --no-restore
        dotnet build src/Honua.Shared/Honua.Shared.csproj --configuration Release --no-restore
        dotnet build src/Honua.ServiceDefaults/Honua.ServiceDefaults.csproj --configuration Release --no-restore
        dotnet build src/Honua.Postgres/Honua.Postgres.csproj --configuration Release --no-restore
        dotnet build src/Honua.Server/Honua.Server.csproj --configuration Release --no-restore

        echo "✅ Core projects built successfully!"
        echo "⚠️ SDK projects (API, Admin, Mobile) excluded due to compilation issues"

    - name: Run Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack Working Projects
      run: |
        echo "📦 Packaging working projects..."

        # Pack Honua.Core (working)
        dotnet pack src/Honua.Core/Honua.Core.csproj \
          --configuration Release \
          --no-build \
          --output ./packages \
          -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
          -p:AssemblyVersion=${{ steps.version.outputs.VERSION }} \
          -p:FileVersion=${{ steps.version.outputs.VERSION }}

        # Pack Honua.Shared (working)
        dotnet pack src/Honua.Shared/Honua.Shared.csproj \
          --configuration Release \
          --no-build \
          --output ./packages \
          -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
          -p:AssemblyVersion=${{ steps.version.outputs.VERSION }} \
          -p:FileVersion=${{ steps.version.outputs.VERSION }}

        echo "✅ Core packages created successfully!"
        echo "⚠️ SDK packages (API, Admin, Mobile) skipped due to compilation issues"
        echo "   These will be enabled once the compilation errors are fixed"

    - name: List Packages
      run: ls -la ./packages/

    - name: Publish to NuGet.org
      run: |
        for package in ./packages/*.nupkg; do
          echo "Publishing $package"
          dotnet nuget push "$package" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source ${{ env.NUGET_SOURCE }} \
            --skip-duplicate
        done

    - name: Upload Packages as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-${{ steps.version.outputs.VERSION }}
        path: ./packages/*.nupkg
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./packages/*.nupkg
        generate_release_notes: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: success()

    steps:
    - name: Success Notification
      run: |
        echo "✅ Successfully published NuGet packages:"
        echo "  - Honua.Core v${{ needs.build-and-publish.outputs.VERSION }}"
        echo "  - Honua.Shared v${{ needs.build-and-publish.outputs.VERSION }}"
        echo ""
        echo "⚠️ SDK packages temporarily excluded due to compilation issues:"
        echo "  - Honua.Api.Sdk (pending fix)"
        echo "  - Honua.Admin.Sdk (pending fix)"
        echo "  - Honua.Mobile.Sdk (pending fix)"
        echo ""
        echo "🔧 Next steps: Fix compilation errors in SDK projects to enable full publishing"
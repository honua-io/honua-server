name: Nightly Container Build

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC nightly
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_GHCR: ${{ github.repository }}
  IMAGE_NAME_DOCKERHUB: honuaio/honua-server
  # .NET base images are pulled from Microsoft's anonymous-only registry
  # (mcr.microsoft.com -> mcrprod.azurecr.io), which rate-limits (429/401) and
  # has flaked nightly builds. There is no MCR login that raises the limit, so
  # we mirror the digest-pinned base images into GHCR once (the mirror-base-images
  # job below, with retries) and the build jobs pull them from GHCR (authenticated,
  # no anonymous limit) via the Dockerfiles' DOTNET_*_IMAGE build args.
  # The digests are NOT duplicated here: scripts/ci/base-image-mirrors.sh reads
  # them straight out of the `ARG DOTNET_*_IMAGE` defaults in Dockerfile,
  # docker/Dockerfile.aot, and docker/Dockerfile.lambda.aot, so refreshing a pin
  # in a Dockerfile is automatically what gets mirrored (and therefore what the
  # build jobs pull back out of GHCR).
  BASE_REPO: ghcr.io/${{ github.repository }}-base

concurrency:
  group: nightly-container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror-base-images:
    name: Mirror .NET base images (MCR -> GHCR)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails the run before anything is mirrored if a build job pulls a mirror
      # tag that no Dockerfile ARG produces (or vice versa).
      - name: Verify mirror map covers every consumed base tag
        run: scripts/ci/base-image-mirrors.sh --verify .github/workflows/nightly-container-build.yml

      - name: Mirror digest-pinned base images to GHCR (with retries)
        run: |
          set -euo pipefail
          mirror() {
            local src="$1" dst="$2"
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create --tag "$dst" "$src"; then
                echo "mirrored $src -> $dst"
                return 0
              fi
              echo "::warning::mirror attempt $attempt failed for $src; retrying after backoff"
              sleep $((attempt * 20))
            done
            echo "::error::failed to mirror $src to $dst after 5 attempts"
            return 1
          }
          # Source refs come from the Dockerfile ARG defaults, so the mirrored
          # images and the pins in the Dockerfiles cannot drift apart.
          #
          # The tab is built with printf rather than written as an ANSI-C $'\t' literal:
          # validate-single-merge-authority.sh rejects that construct in any workflow it does
          # not allowlist, because $'...' can hide a command token from static analysis. Same
          # idiom the merge-train scripts use.
          tab="$(printf '\tX')"; tab="${tab%X}"

          # Materialize the map BEFORE mirroring anything. A process substitution's exit status
          # is not propagated through `while`, so a producer that emitted some entries and then
          # failed on a missing or malformed pin left the step green after mirroring only part
          # of the map — and the build jobs then pulled the previous run's stale GHCR tags,
          # silently publishing images on old security pins.
          mirror_map="$(scripts/ci/base-image-mirrors.sh)"

          while IFS="${tab}" read -r tag src; do
            [ -n "$tag" ] || continue
            mirror "$src" "${BASE_REPO}:${tag}"
          done <<<"${mirror_map}"

  build-aot:
    name: Build & Push AOT (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: mirror-base-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly-aot
            type=raw,value=nightly-aot-{{date 'YYYYMMDD'}}
            type=sha,prefix=nightly-aot-
            type=raw,value=trunk-aot
          flavor: |
            suffix=-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: docker/Dockerfile.aot
          build-args: |
            DOTNET_SDK_IMAGE=${{ env.BASE_REPO }}:sdk-10.0-alpine
            DOTNET_RUNTIME_DEPS_IMAGE=${{ env.BASE_REPO }}:runtime-deps-10.0-alpine
            HONUA_GIT_SHA=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha,scope=nightly-aot-${{ matrix.arch }}
          # ignore-error: a failed/interrupted GHA cache export (common on the
          # hosted arm64 runner fleet, which can be preempted mid-export) must
          # not fail an otherwise-successful build+push. The cache is a build
          # accelerator, not a release artifact.
          cache-to: type=gha,mode=max,scope=nightly-aot-${{ matrix.arch }},ignore-error=true
          provenance: true
          sbom: true

  build-lambda-aot:
    name: Build & Push Lambda AOT (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: mirror-base-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly-lambda-aot
            type=raw,value=nightly-lambda-aot-{{date 'YYYYMMDD'}}
            type=sha,prefix=nightly-lambda-aot-
          flavor: |
            suffix=-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: docker/Dockerfile.lambda.aot
          build-args: |
            DOTNET_SDK_IMAGE=${{ env.BASE_REPO }}:sdk-10.0-lambda
            DOTNET_RUNTIME_DEPS_IMAGE=${{ env.BASE_REPO }}:runtime-deps-10.0
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha,scope=nightly-lambda-aot-${{ matrix.arch }}
          # ignore-error: a failed/interrupted GHA cache export (common on the
          # hosted arm64 runner fleet, which can be preempted mid-export) must
          # not fail an otherwise-successful build+push. The cache is a build
          # accelerator, not a release artifact.
          cache-to: type=gha,mode=max,scope=nightly-lambda-aot-${{ matrix.arch }},ignore-error=true
          provenance: false
          sbom: false

  manifest-lambda-aot:
    name: Publish Lambda AOT Manifests
    runs-on: ubuntu-24.04
    needs: build-lambda-aot
    if: ${{ needs.build-lambda-aot.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly-lambda-aot
            type=raw,value=nightly-lambda-aot-{{date 'YYYYMMDD'}}
            type=sha,prefix=nightly-lambda-aot-

      - name: Create and push multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

  build-jit:
    name: Build & Push JIT (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: mirror-base-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-{{date 'YYYYMMDD'}}
            type=sha,prefix=nightly-
            type=raw,value=trunk
          flavor: |
            suffix=-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            DOTNET_SDK_IMAGE=${{ env.BASE_REPO }}:sdk-10.0
            DOTNET_ASPNET_IMAGE=${{ env.BASE_REPO }}:aspnet-10.0-alpine
            HONUA_GIT_SHA=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha,scope=nightly-jit-${{ matrix.arch }}
          # ignore-error: a failed/interrupted GHA cache export (common on the
          # hosted arm64 runner fleet, which can be preempted mid-export) must
          # not fail an otherwise-successful build+push. The cache is a build
          # accelerator, not a release artifact.
          cache-to: type=gha,mode=max,scope=nightly-jit-${{ matrix.arch }},ignore-error=true
          provenance: true
          sbom: true

  manifest-aot:
    name: Publish AOT Manifests
    runs-on: ubuntu-24.04
    needs: build-aot
    if: ${{ needs.build-aot.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly-aot
            type=raw,value=nightly-aot-{{date 'YYYYMMDD'}}
            type=sha,prefix=nightly-aot-
            type=raw,value=trunk-aot

      - name: Create and push multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

  manifest-jit:
    name: Publish JIT Manifests
    runs-on: ubuntu-24.04
    needs: build-jit
    if: ${{ needs.build-jit.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-{{date 'YYYYMMDD'}}
            type=sha,prefix=nightly-
            type=raw,value=trunk

      - name: Create and push multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

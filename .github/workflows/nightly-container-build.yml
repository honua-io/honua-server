name: Nightly Container Build

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC nightly
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Full 40-hex trunk sha to image instead of the newest certified one. It must itself be certified (completed full-matrix ci.yml run, every certification lane successful). Empty = newest certified trunk sha. When it is not trunk head, the build re-dispatches itself at tag nightly-candidate-<sha7>. Ignored on branch proofs.'
        required: false
        default: ''

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_GHCR: ${{ github.repository }}
  IMAGE_NAME_DOCKERHUB: honuaio/honua-server
  # .NET base images are pulled from Microsoft's anonymous-only registry
  # (mcr.microsoft.com -> mcrprod.azurecr.io), which rate-limits (429/401) and
  # has flaked nightly builds. There is no MCR login that raises the limit, so
  # we mirror the digest-pinned base images into GHCR once (the mirror-base-images
  # job below, with retries) and the build jobs pull them from GHCR (authenticated,
  # no anonymous limit) via the Dockerfiles' DOTNET_*_IMAGE build args.
  # The digests are NOT duplicated here: scripts/ci/base-image-mirrors.sh reads
  # them straight out of the `ARG DOTNET_*_IMAGE` defaults in Dockerfile,
  # docker/Dockerfile.aot, and docker/Dockerfile.lambda.aot, so refreshing a pin
  # in a Dockerfile is automatically what gets mirrored (and therefore what the
  # build jobs pull back out of GHCR).
  # Branch proofs use a run-scoped repository so they cannot overwrite trunk bases.
  # Candidate-tag runs (refs/tags/nightly-candidate-<sha7>) are trunk builds at a
  # certified trunk sha and share the trunk mirrors.
  BASE_REPO: ghcr.io/${{ github.repository }}-base${{ (github.ref != 'refs/heads/trunk' && !startsWith(github.ref, 'refs/tags/nightly-candidate-')) && format('/proof-{0}', github.run_id) || '' }}

# One build per candidate sha: a candidate-tag run is grouped by its commit and is
# never cancelled by a later hand-off for the same sha (a duplicate queues behind it,
# and the selector does not dispatch while one is queued or running). Trunk and
# branch runs keep superseding each other by ref.
concurrency:
  group: nightly-container-build-${{ startsWith(github.ref, 'refs/tags/nightly-candidate-') && format('candidate-{0}', github.sha) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/nightly-candidate-') }}

jobs:
  # The image follows certification (honua-io/honua-release#376 R18). The release
  # resolver pins only a trunk sha that is BOTH imaged here AND certified by a
  # completed full-matrix ci.yml run. Imaging HEAD-at-cron made those two sets
  # stop intersecting (2026-09-16 .. 10-04: HEAD was imaged before its matrix
  # finished, the sha that certified was never imaged). So on trunk this run
  # images the NEWEST CERTIFIED sha, judged by the resolver's rule over the lane
  # list ci.yml declares (CERTIFICATION_LANE_JOBS), and fails loudly, naming the
  # missing lanes, when none of the newest 100 trunk commits qualifies.
  #
  # Invariant: image contents, the revision label and annotation, HONUA_GIT_SHA
  # and the build provenance all name ONE sha, and that sha is this run's
  # github.sha. Sigstore provenance (actions/attest-build-provenance) and BuildKit
  # provenance can only bind to the run's own commit, so building any other sha
  # yields an image no release gate can pin (run 38072453832 was dispatched at
  # 652f7ed, imaged 99cd5e3, and attested 652f7ed). Therefore:
  #   * trunk run, selected sha == github.sha: build here (mode build-trunk);
  #   * trunk run, selected sha != github.sha: create the lightweight tag
  #     nightly-candidate-<sha7> at the selected sha, re-dispatch THIS workflow
  #     at that tag, and build nothing here (mode redirect);
  #   * run on refs/tags/nightly-candidate-<sha7>: the candidate IS github.sha,
  #     which must still be a certified trunk sha. The run never re-dispatches,
  #     and it moves channel tags like a trunk build (mode build-candidate).
  # Every build and attest job re-checks candidate == github.sha and fails
  # otherwise. Branch proofs (any other ref) still build their own head and
  # publish no channel tags (mode proof).
  select-candidate:
    name: Select certified trunk candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # The Actions token only reads here: run lists, check runs and the tag lookup.
      # The two writes of a hand-off (creating refs/tags/nightly-candidate-<sha7> and
      # re-dispatching this workflow at it) use a short-lived HONUA_RELEASE_APP
      # installation token minted in this job (honua-io/honua-server#6613). The Actions
      # token cannot create that ref once the candidate's workflow files differ from
      # trunk head's: the API demands the `workflows` permission, which GITHUB_TOKEN
      # can never hold, and answers 403 "Resource not accessible by integration".
      actions: read
      checks: read
      contents: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      sha7: ${{ steps.select.outputs.sha7 }}
      certifying_run_id: ${{ steps.select.outputs.run_id }}
      # build-trunk | build-candidate | redirect | proof
      mode: ${{ steps.route.outputs.mode }}
      # 'true' only when this run may move channel tags (build-trunk, build-candidate).
      publish: ${{ steps.route.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test the certified-candidate selector
        run: python3 scripts/ci/select-certified-nightly-sha.test.py

      - name: Select the newest certified trunk sha
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/nightly-candidate-*)
              # A candidate-tag run images exactly its own commit, and only when the tag
              # names that commit and the commit is a certified trunk sha. Anyone with
              # write access can push a tag, so certification is proved again here.
              if [ "${GITHUB_REF}" != "refs/tags/nightly-candidate-${GITHUB_SHA:0:7}" ]; then
                echo "::error::${GITHUB_REF} does not name this run's commit ${GITHUB_SHA}; expected refs/tags/nightly-candidate-${GITHUB_SHA:0:7}."
                exit 1
              fi
              if [ -n "${REQUESTED_SHA:-}" ] && [ "${REQUESTED_SHA}" != "${GITHUB_SHA}" ]; then
                echo "::error::candidate_sha=${REQUESTED_SHA} conflicts with this candidate-tag run at ${GITHUB_SHA}; dispatch on trunk to choose a sha."
                exit 1
              fi
              python3 scripts/ci/select-certified-nightly-sha.py \
                --repository "${GITHUB_REPOSITORY}" \
                --branch trunk \
                --workflow .github/workflows/ci.yml \
                --sha "${GITHUB_SHA}"
              exit 0
              ;;
          esac
          if [ "${GITHUB_REF}" != "refs/heads/trunk" ]; then
            echo "Branch proof on ${GITHUB_REF}: building its own head ${GITHUB_SHA}; no channel tags are published."
            {
              echo "sha=${GITHUB_SHA}"
              echo "sha7=${GITHUB_SHA:0:7}"
              echo "run_id="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/select-certified-nightly-sha.py \
            --repository "${GITHUB_REPOSITORY}" \
            --branch trunk \
            --limit 100 \
            --workflow .github/workflows/ci.yml \
            --sha "${REQUESTED_SHA:-}"

      # Decide whether THIS run may build the selected sha. Only a trunk run whose own
      # commit is not the selected sha re-dispatches, and it re-dispatches onto a tag
      # ref, whose run routes to build-candidate and never reaches the redirect branch,
      # so the hand-off cannot loop.
      - name: Route the build to a run at the selected sha
        id: route
        env:
          CANDIDATE_SHA: ${{ steps.select.outputs.sha }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/nightly-candidate-*) mode=build-candidate ;;
            refs/heads/trunk)
              if [ "${CANDIDATE_SHA}" = "${GITHUB_SHA}" ]; then mode=build-trunk; else mode=redirect; fi
              ;;
            *) mode=proof ;;
          esac
          if [ "${mode}" != redirect ] && [ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::selected candidate ${CANDIDATE_SHA} is not this run's commit ${GITHUB_SHA} on ${GITHUB_REF}; refusing to build an image whose provenance would name a different sha."
            exit 1
          fi
          case "${mode}" in build-trunk|build-candidate) publish=true ;; *) publish=false ;; esac
          echo "Nightly route: mode=${mode} publish=${publish} candidate=${CANDIDATE_SHA} run=${GITHUB_SHA} ref=${GITHUB_REF}"
          {
            echo "mode=${mode}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

      # A hand-off needs the honua-release GitHub App. Its absence is a setup defect, so
      # the run fails here and names it; there is no fallback to the Actions token, which
      # is the 403 this replaces (honua-io/honua-server#6613).
      - name: Require the release GitHub App for the candidate hand-off
        if: steps.route.outputs.mode == 'redirect'
        env:
          HAS_APP_ID: ${{ secrets.HONUA_RELEASE_APP_ID != '' }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.HONUA_RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "${HAS_APP_ID}" = true ] || missing+=(HONUA_RELEASE_APP_ID)
          [ "${HAS_APP_PRIVATE_KEY}" = true ] || missing+=(HONUA_RELEASE_APP_PRIVATE_KEY)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Nightly candidate hand-off needs the honua-release GitHub App, but repository secret(s) ${missing[*]} are not set. Setup: create a GitHub App on the honua-io org with repository permissions Contents: write, Workflows: write and Actions: write; install it on honua-server only; then add its App ID as HONUA_RELEASE_APP_ID and its private key (PEM) as HONUA_RELEASE_APP_PRIVATE_KEY in honua-server's Actions secrets. See honua-io/honua-server#6613. The Actions token is not used as a fallback: it cannot create this tag."
            exit 1
          fi

      # Scoped to honua-server and to exactly the three permissions the hand-off uses.
      # The token is revoked when the job ends.
      - name: Mint the release GitHub App token for the candidate hand-off
        id: handoff-token
        if: steps.route.outputs.mode == 'redirect'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HONUA_RELEASE_APP_ID }}
          private-key: ${{ secrets.HONUA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: honua-server
          # contents + workflows: create a tag ref whose commit's workflow files differ
          # from trunk head's. actions: POST .../actions/workflows/{id}/dispatches.
          permission-contents: write
          permission-workflows: write
          permission-actions: write

      - name: Tag the selected sha and re-dispatch this workflow at it
        if: steps.route.outputs.mode == 'redirect'
        env:
          # Reads use the Actions token; only the tag create and the dispatch use the App token.
          GH_TOKEN: ${{ github.token }}
          HANDOFF_TOKEN: ${{ steps.handoff-token.outputs.token }}
          CANDIDATE_SHA: ${{ steps.select.outputs.sha }}
        run: |
          set -euo pipefail
          tag="nightly-candidate-${CANDIDATE_SHA:0:7}"
          # Create the lightweight tag, or accept an existing one only when it already
          # names the selected sha (a sha7 collision or a moved tag refuses).
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>"${RUNNER_TEMP}/tag-lookup.err")"; then
            if [ "${existing}" != "${CANDIDATE_SHA}" ]; then
              echo "::error::tag ${tag} already names ${existing}, not the selected ${CANDIDATE_SHA}; remove or correct it, then re-dispatch."
              exit 1
            fi
            echo "Tag ${tag} already names ${CANDIDATE_SHA}."
          elif grep -q 'HTTP 404' "${RUNNER_TEMP}/tag-lookup.err"; then
            GH_TOKEN="${HANDOFF_TOKEN}" gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="${CANDIDATE_SHA}" --jq '.ref'
          else
            cat "${RUNNER_TEMP}/tag-lookup.err" >&2
            echo "::error::could not read tag ${tag}."
            exit 1
          fi
          # One build per candidate: a queued or running candidate run already covers it.
          active="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow nightly-container-build.yml \
            --branch "${tag}" --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')"
          # A candidate that a run on its tag already imaged is not rebuilt. Each re-dispatch files
          # its checks on the candidate sha again, and the release resolver judges a lane by its
          # latest attempt: 8cb074f7 was imaged on 2026-10-23 (run 39876804619), then three nightly
          # re-dispatches failed only in mirror-base-images (Public ECR 429) and kept the imaged,
          # certified sha out of the release candidate (honua-io/honua-release#952).
          imaged="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow nightly-container-build.yml \
            --branch "${tag}" --limit 20 --json status,conclusion,headSha \
            --jq "[.[] | select(.status == \"completed\" and .conclusion == \"success\" and .headSha == \"${CANDIDATE_SHA}\")] | length")"
          if [ "${active}" != 0 ]; then
            echo "::notice::a Nightly Container Build run on ${tag} is already queued or running; not dispatching another."
          elif [ "${imaged}" != 0 ]; then
            echo "::notice::a Nightly Container Build run on ${tag} already imaged ${CANDIDATE_SHA}; not rebuilding it."
          else
            GH_TOKEN="${HANDOFF_TOKEN}" gh workflow run nightly-container-build.yml --repo "${GITHUB_REPOSITORY}" --ref "${tag}"
            echo "::notice::trunk head ${GITHUB_SHA} is not the newest certified sha ${CANDIDATE_SHA}; re-dispatched this workflow at ${tag} so the image, labels and provenance all name ${CANDIDATE_SHA}."
          fi
          {
            echo "### Nightly candidate hand-off"
            echo
            echo "Trunk head \`${GITHUB_SHA}\` is not the selected certified sha \`${CANDIDATE_SHA}\`."
            echo "The build runs in a separate Nightly Container Build run on tag \`${tag}\`; this run publishes nothing."
          } >> "${GITHUB_STEP_SUMMARY}"

  mirror-base-images:
    name: Mirror .NET base images (MCR -> GHCR)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: select-candidate
    if: needs.select-candidate.outputs.mode != 'redirect'
    permissions:
      contents: read
      packages: write
    outputs:
      # One build date for the WHOLE run. Every tag-producing job used to evaluate the
      # metadata-action date template independently at ITS OWN start time, so a run spanning UTC midnight
      # tagged the arch images with one date and then looked for the other when assembling the
      # manifest. Observed 2026-08-20 in run 32314563833: both AOT legs pushed
      # `nightly-20260819-*`, the manifest job started at 00:50 and failed with
      # `nightly-20260820-arm64: not found`, so no multi-arch tag (and no `nightly-aot-<sha>`
      # compatibility tag) was published at all. Cold native-AOT builds now take ~90 minutes, so
      # any run starting in the last ~1.5h of a UTC day straddles midnight — this is not rare.
      build_date: ${{ steps.run_date.outputs.date }}
    steps:
      - name: Refuse a candidate that is not this run's commit
        # Provenance binds to github.sha; a build of any other sha is unpinnable.
        env:
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: |
          if [ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::candidate ${CANDIDATE_SHA} is not this run's commit ${GITHUB_SHA}: labels would name ${CANDIDATE_SHA} while the build provenance names ${GITHUB_SHA}. Dispatch this workflow on trunk (it re-dispatches itself at refs/tags/nightly-candidate-<sha7>) or directly at that tag."
            exit 1
          fi

      # Named `run_date` deliberately. Honua.Architecture.Tests'
      # ReleaseWorkflows_ShouldInspectTheAotImagesTheyPublish counts the step-identifier prefix
      # shared by the two AOT build steps and requires exactly two, so that each one keeps
      # exposing an immutable digest to its verifier. A step identified as `build_date` would
      # carry that prefix and trip the guard; this name does not.
      - name: Freeze the build date for every tag in this run
        id: run_date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # The candidate's Dockerfiles define the base pins to mirror.
      - name: Checkout certified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-candidate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails the run before anything is mirrored if a build job pulls a mirror
      # tag that no Dockerfile ARG produces (or vice versa). The consumers are
      # THIS workflow revision's build jobs; the producers are the candidate's
      # Dockerfiles, which can be older than the workflow.
      - name: Verify mirror map covers every consumed base tag
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git show "${GITHUB_SHA}:.github/workflows/nightly-container-build.yml" > "${RUNNER_TEMP}/nightly-container-build.yml"
          scripts/ci/base-image-mirrors.sh --verify "${RUNNER_TEMP}/nightly-container-build.yml"

      - name: Mirror digest-pinned base images to GHCR (with retries)
        run: |
          set -euo pipefail
          mirror() {
            local src="$1" dst="$2" current
            # The source is digest-pinned and imagetools copies its index byte for byte, so a
            # destination tag already at that digest holds exactly these bytes. Skipping it keeps an
            # upstream outage out of the run: Public ECR answered 429 on every attempt for the Lambda
            # adapter in runs 39940535619, 40083981239 and 40184295976, although GHCR already held
            # sha256:46d6625e... from run 39876804619, and every image build was skipped.
            current="$(docker buildx imagetools inspect "$dst" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)"
            if [ -n "$current" ] && [ "$current" = "${src##*@}" ]; then
              echo "already mirrored $src -> $dst"
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create --tag "$dst" "$src"; then
                echo "mirrored $src -> $dst"
                return 0
              fi
              echo "::warning::mirror attempt $attempt failed for $src; retrying after backoff"
              sleep $((attempt * 20))
            done
            echo "::error::failed to mirror $src to $dst after 5 attempts"
            return 1
          }
          # Source refs come from the Dockerfile ARG defaults, so the mirrored
          # images and the pins in the Dockerfiles cannot drift apart.
          #
          # The tab is built with printf rather than written as an ANSI-C $'\t' literal:
          # validate-single-merge-authority.sh rejects that construct in any workflow it does
          # not allowlist, because $'...' can hide a command token from static analysis. Same
          # idiom the merge-train scripts use.
          tab="$(printf '\tX')"; tab="${tab%X}"

          # Materialize the map BEFORE mirroring anything. A process substitution's exit status
          # is not propagated through `while`, so a producer that emitted some entries and then
          # failed on a missing or malformed pin left the step green after mirroring only part
          # of the map — and the build jobs then pulled the previous run's stale GHCR tags,
          # silently publishing images on old security pins.
          mirror_map="$(scripts/ci/base-image-mirrors.sh)"

          while IFS="${tab}" read -r tag src; do
            [ -n "$tag" ] || continue
            mirror "$src" "${BASE_REPO}:${tag}"
          done <<<"${mirror_map}"

  build-aot:
    if: needs.select-candidate.outputs.publish == 'true'
    name: Build & Push AOT (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # 180, not 90: a COLD native-AOT build of this image does not fit in 90 minutes, and a timeout
    # is self-perpetuating. buildx exports the registry layer cache in `cache-to`, which only runs
    # after a successful build — so a job killed at the ceiling exports nothing, the next run starts
    # cold too, and the workflow can never converge on its own. Observed 2026-08-19: amd64 timed out
    # at 90m twice in a row (runs 32295916913 and 32304223543, the second on an idle runner pool), so
    # `Publish AOT Manifests` was skipped both times and no multi-arch tag was produced at all — which
    # blocks pinning a release candidate, since the pin resolves `image@digest`.
    # Warm builds are not the problem and stay fast: in run 32304223543 the arm64 leg finished in ~1m
    # off cache, having taken ~73m cold in the run before it, and 2026-08-18 completed amd64 in ~46m
    # warm. The ceiling only has to cover the cold case once; every run after that rides the cache.
    timeout-minutes: 180
    needs: [select-candidate, mirror-base-images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Refuse a candidate that is not this run's commit
        # Provenance binds to github.sha; a build of any other sha is unpinnable.
        env:
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: |
          if [ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::candidate ${CANDIDATE_SHA} is not this run's commit ${GITHUB_SHA}: labels would name ${CANDIDATE_SHA} while the build provenance names ${GITHUB_SHA}. Dispatch this workflow on trunk (it re-dispatches itself at refs/tags/nightly-candidate-<sha7>) or directly at that tag."
            exit 1
          fi

      - name: Checkout certified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-candidate.outputs.sha }}

      # The candidate can be older than this workflow revision, whose steps call
      # the verifier and promoter with its own flags (the registry-attestation
      # requirement arrived with #5367). Run those two self-contained scripts
      # from github.sha; the build context, Dockerfiles and the GeoParquet
      # smoke's compose/seed stay the candidate's own.
      - name: Stage this workflow revision's image verification tooling
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          mkdir -p "${RUNNER_TEMP}/nightly-tooling"
          git archive "${GITHUB_SHA}" scripts/ci/verify-serving-image-boundary.py scripts/ci/promote-verified-image.py \
            | tar -x -C "${RUNNER_TEMP}/nightly-tooling"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.mirror-base-images.outputs.build_date }}
            type=raw,value=nightly-${{ needs.select-candidate.outputs.sha7 }}
            type=raw,value=trunk
          flavor: |
            suffix=-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ needs.select-candidate.outputs.sha }}
          annotations: |
            org.opencontainers.image.revision=${{ needs.select-candidate.outputs.sha }}

      - name: Build nightly AOT candidate by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.aot
          build-args: |
            DOTNET_SDK_IMAGE=${{ env.BASE_REPO }}:sdk-10.0-aot
            DOTNET_RUNTIME_DEPS_IMAGE=${{ env.BASE_REPO }}:runtime-deps-10.0-aot
            HONUA_GIT_SHA=${{ needs.select-candidate.outputs.sha }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          # Share one cache per Dockerfile variant and architecture with PR/release builds.
          # BuildKit validates layer inputs, including the digest-pinned mirrored bases.
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-aot-${{ matrix.arch }}
          # ignore-error: a failed/interrupted registry cache export (common on the
          # hosted arm64 runner fleet, which can be preempted mid-export) must
          # not fail an otherwise-successful build. The cache is an accelerator,
          # not a release artifact.
          cache-to: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-aot-${{ matrix.arch }},mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Verify nightly AOT candidate before registry publication
        shell: bash
        working-directory: ${{ runner.temp }}/nightly-tooling
        env:
          CANDIDATE: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$CANDIDATE"
          python3 scripts/ci/verify-serving-image-boundary.py --serving-image "$CANDIDATE"

      # honua-server#4912: the musl image passed the boundary check and every unit lane while
      # f=parquet answered 501 because ParquetSharpNative could not load. Boot the exact
      # candidate digest against the CNG seed and require GeoParquet bytes before any tag moves.
      # amd64 only: the CNG lane's postgis/postgis:16-3.4 publishes no arm64 image. The arm64
      # leg keeps the Dockerfile's build-time `ldd -r` gate on the same native libraries.
      - name: Smoke nightly AOT candidate GeoParquet encoder before registry publication
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          CANDIDATE: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          scripts/ci/smoke-aot-geoparquet.sh "$CANDIDATE" "${RUNNER_TEMP}/aot-geoparquet-smoke"

      - name: Publish verified nightly AOT architecture tags
        shell: bash
        working-directory: ${{ runner.temp }}/nightly-tooling
        env:
          CANDIDATE: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          printf '%s\n' "$TAGS" | python3 scripts/ci/promote-verified-image.py \
            --candidate "$CANDIDATE" \
            --staging-tag "boundary-candidate-nightly-aot-${{ matrix.arch }}-${{ needs.select-candidate.outputs.sha }}" \
            --authfile "$HOME/.docker/config.json"

  build-lambda-aot:
    name: Build & Push Lambda AOT (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # 180, not 90: a COLD native-AOT build of this image does not fit in 90 minutes, and a timeout
    # is self-perpetuating. buildx exports the registry layer cache in `cache-to`, which only runs
    # after a successful build — so a job killed at the ceiling exports nothing, the next run starts
    # cold too, and the workflow can never converge on its own. Observed 2026-08-19: amd64 timed out
    # at 90m twice in a row (runs 32295916913 and 32304223543, the second on an idle runner pool), so
    # `Publish AOT Manifests` was skipped both times and no multi-arch tag was produced at all — which
    # blocks pinning a release candidate, since the pin resolves `image@digest`.
    # Warm builds are not the problem and stay fast: in run 32304223543 the arm64 leg finished in ~1m
    # off cache, having taken ~73m cold in the run before it, and 2026-08-18 completed amd64 in ~46m
    # warm. The ceiling only has to cover the cold case once; every run after that rides the cache.
    timeout-minutes: 180
    needs: [select-candidate, mirror-base-images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      # Publisher attestations for the runnable per-architecture child manifest
      # Lambda deploys (release locks pin it as awsLambdaDigest).
      attestations: write
      id-token: write
    steps:
      - name: Refuse a candidate that is not this run's commit
        # Provenance binds to github.sha; a build of any other sha is unpinnable.
        env:
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: |
          if [ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::candidate ${CANDIDATE_SHA} is not this run's commit ${GITHUB_SHA}: labels would name ${CANDIDATE_SHA} while the build provenance names ${GITHUB_SHA}. Dispatch this workflow on trunk (it re-dispatches itself at refs/tags/nightly-candidate-<sha7>) or directly at that tag."
            exit 1
          fi

      - name: Checkout certified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-candidate.outputs.sha }}

      # The candidate can be older than this workflow revision, whose steps call
      # the verifier and promoter with its own flags (the registry-attestation
      # requirement arrived with #5367). Run those two self-contained scripts
      # from github.sha; the build context, Dockerfiles and the GeoParquet
      # smoke's compose/seed stay the candidate's own.
      - name: Stage this workflow revision's image verification tooling
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          mkdir -p "${RUNNER_TEMP}/nightly-tooling"
          git archive "${GITHUB_SHA}" scripts/ci/verify-serving-image-boundary.py scripts/ci/promote-verified-image.py \
            | tar -x -C "${RUNNER_TEMP}/nightly-tooling"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.select-candidate.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly-lambda-aot
            type=raw,value=nightly-lambda-aot-${{ needs.mirror-base-images.outputs.build_date }}
            type=raw,value=nightly-lambda-aot-${{ needs.select-candidate.outputs.sha7 }}
          flavor: |
            suffix=-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ needs.select-candidate.outputs.sha }}
          annotations: |
            org.opencontainers.image.revision=${{ needs.select-candidate.outputs.sha }}

      - name: Build nightly Lambda AOT candidate by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.lambda.aot
          build-args: |
            DOTNET_SDK_IMAGE=${{ env.BASE_REPO }}:sdk-10.0-lambda
            DOTNET_RUNTIME_DEPS_IMAGE=${{ env.BASE_REPO }}:runtime-deps-10.0
            LAMBDA_ADAPTER_IMAGE=${{ env.BASE_REPO }}:lambda-adapter-0.9.1
            HONUA_GIT_SHA=${{ needs.select-candidate.outputs.sha }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          # Share one cache per Dockerfile variant and architecture with PR/release builds.
          # BuildKit validates layer inputs, including the digest-pinned mirrored bases.
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-lambda-aot-${{ matrix.arch }}
          # ignore-error: a failed/interrupted registry cache export (common on the
          # hosted arm64 runner fleet, which can be preempted mid-export) must
          # not fail an otherwise-successful build. The cache is an accelerator,
          # not a release artifact.
          cache-to: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-lambda-aot-${{ matrix.arch }},mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Verify nightly Lambda AOT candidate before registry publication
        id: verified
        shell: bash
        working-directory: ${{ runner.temp }}/nightly-tooling
        env:
          CANDIDATE: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          docker buildx imagetools inspect "$CANDIDATE"
          docker pull "$CANDIDATE"
          python3 scripts/ci/verify-serving-image-boundary.py --serving-image "$CANDIDATE" \
            --require-attestations --attestation-report "${RUNNER_TEMP}/lambda-attestations-${{ matrix.arch }}.json"
          # The verified report names the runnable child manifest Lambda deploys.
          serving_child="$(jq -er --arg platform "${{ matrix.platform }}" \
            '[.[] | select(.platform == $platform) | .subject | ltrimstr("oci://")] | unique | if length == 1 then .[0] else error("expected one serving child") end' \
            "${RUNNER_TEMP}/lambda-attestations-${{ matrix.arch }}.json")"
          echo "serving_child=${serving_child}" >> "$GITHUB_OUTPUT"
          echo "serving_child_digest=${serving_child##*@}" >> "$GITHUB_OUTPUT"

      - name: Publish verified nightly Lambda AOT architecture tags
        if: needs.select-candidate.outputs.publish == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/nightly-tooling
        env:
          CANDIDATE: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          printf '%s\n' "$TAGS" | python3 scripts/ci/promote-verified-image.py \
            --candidate "$CANDIDATE" \
            --staging-tag "boundary-candidate-nightly-lambda-aot-${{ matrix.arch }}-${{ needs.select-candidate.outputs.sha }}" \
            --authfile "$HOME/.docker/config.json"

      # Lambda runs the per-architecture child manifest, and release locks pin that
      # child (awsLambdaDigest), not the BuildKit evidence index around it. The
      # honua-release collector cannot reach the index's in-toto layers from the
      # child, so it looks up repos/honua-io/honua-server/attestations/<child digest>
      # and verifies --source-digest <sha> --signer-workflow this file. Attest the
      # child the boundary verifier just inspected: SLSA provenance and a CycloneDX
      # SBOM (actions/attest types SPDX as .../Document/v2.3, which the collector
      # does not accept).
      - name: Generate the Lambda serving child SBOM
        if: needs.select-candidate.outputs.publish == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.verified.outputs.serving_child }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/lambda-serving-child-${{ matrix.arch }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Refuse an empty Lambda serving child SBOM
        if: needs.select-candidate.outputs.publish == 'true'
        shell: bash
        run: |
          jq -e '.bomFormat == "CycloneDX" and ((.components // []) | length > 0)' \
            "${RUNNER_TEMP}/lambda-serving-child-${{ matrix.arch }}.cdx.json" >/dev/null

      - name: Attest the Lambda serving child provenance
        if: needs.select-candidate.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
          subject-digest: ${{ steps.verified.outputs.serving_child_digest }}
          push-to-registry: true

      - name: Attest the Lambda serving child SBOM
        if: needs.select-candidate.outputs.publish == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
          subject-digest: ${{ steps.verified.outputs.serving_child_digest }}
          sbom-path: ${{ runner.temp }}/lambda-serving-child-${{ matrix.arch }}.cdx.json
          push-to-registry: true

      - name: Upload Lambda immutable attestation references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-attestations-${{ matrix.arch }}
          path: ${{ runner.temp }}/lambda-attestations-${{ matrix.arch }}.json
          if-no-files-found: error

  manifest-lambda-aot:
    name: Publish Lambda AOT Manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [select-candidate, build-lambda-aot, mirror-base-images]
    if: ${{ needs.select-candidate.outputs.publish == 'true' && needs.build-lambda-aot.result == 'success' }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Refuse a candidate that is not this run's commit
        # Provenance binds to github.sha; a build of any other sha is unpinnable.
        env:
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: |
          if [ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::candidate ${CANDIDATE_SHA} is not this run's commit ${GITHUB_SHA}: labels would name ${CANDIDATE_SHA} while the build provenance names ${GITHUB_SHA}. Dispatch this workflow on trunk (it re-dispatches itself at refs/tags/nightly-candidate-<sha7>) or directly at that tag."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly-lambda-aot
            type=raw,value=nightly-lambda-aot-${{ needs.mirror-base-images.outputs.build_date }}
            type=raw,value=nightly-lambda-aot-${{ needs.select-candidate.outputs.sha7 }}

      - name: Create and push multi-arch manifests
        id: manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" \
              --annotation "index:org.opencontainers.image.revision=${CANDIDATE_SHA}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done
          subject_name="${REGISTRY_GHCR}/${IMAGE_NAME_GHCR}"
          subject_ref="${subject_name}:nightly-lambda-aot-${{ needs.mirror-base-images.outputs.build_date }}"
          subject_digest="$(docker buildx imagetools inspect "$subject_ref" --format '{{.Manifest.Digest}}')"
          echo "subject_name=$subject_name" >> "$GITHUB_OUTPUT"
          echo "subject_digest=$subject_digest" >> "$GITHUB_OUTPUT"

      - name: Attest nightly Lambda AOT manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.subject_name }}
          subject-digest: ${{ steps.manifest.outputs.subject_digest }}
          push-to-registry: true


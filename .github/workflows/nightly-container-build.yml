            exit 1
          fi

      - name: Checkout certified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-candidate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly-jit
            type=raw,value=nightly-jit-${{ needs.mirror-base-images.outputs.build_date }}
            type=raw,value=nightly-jit-${{ needs.select-candidate.outputs.sha7 }}
            type=raw,value=trunk-jit
          flavor: |
            suffix=-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ needs.select-candidate.outputs.sha }}
          annotations: |
            org.opencontainers.image.revision=${{ needs.select-candidate.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            DOTNET_SDK_IMAGE=${{ env.BASE_REPO }}:sdk-10.0
            DOTNET_ASPNET_IMAGE=${{ env.BASE_REPO }}:aspnet-10.0
            HONUA_GIT_SHA=${{ needs.select-candidate.outputs.sha }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          # Share one cache per Dockerfile variant and architecture with PR/release builds.
          # BuildKit validates layer inputs, including the digest-pinned mirrored bases.
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-jit-${{ matrix.arch }}
          # ignore-error: a failed/interrupted registry cache export (common on the
          # hosted arm64 runner fleet, which can be preempted mid-export) must
          # not fail an otherwise-successful build+push. The cache is a build
          # accelerator, not a release artifact.
          cache-to: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-jit-${{ matrix.arch }},mode=max,ignore-error=true
          provenance: true
          sbom: true

  manifest-aot:
    name: Publish AOT Manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [select-candidate, build-aot, mirror-base-images]
    outputs:
      image: ${{ steps.manifest.outputs.subject_name }}@${{ steps.manifest.outputs.subject_digest }}
    if: ${{ needs.select-candidate.outputs.publish == 'true' && needs.build-aot.result == 'success' }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Refuse a candidate that is not this run's commit
        # Provenance binds to github.sha; a build of any other sha is unpinnable.
        env:
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: |
          if [ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::candidate ${CANDIDATE_SHA} is not this run's commit ${GITHUB_SHA}: labels would name ${CANDIDATE_SHA} while the build provenance names ${GITHUB_SHA}. Dispatch this workflow on trunk (it re-dispatches itself at refs/tags/nightly-candidate-<sha7>) or directly at that tag."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.mirror-base-images.outputs.build_date }}
            type=raw,value=nightly-${{ needs.select-candidate.outputs.sha7 }}
            type=raw,value=trunk

      - name: Create and push multi-arch manifests
        id: manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            repository="${tag%:*}"
            tag_name="${tag##*:}"
            case "$tag_name" in
              nightly|trunk)
                compatibility_tag="${repository}:${tag_name}-aot"
                ;;
              nightly-*)
                compatibility_tag="${repository}:nightly-aot-${tag_name#nightly-}"
                ;;
              *)
                echo "Unexpected AOT manifest tag: $tag" >&2
                exit 1
                ;;
            esac
            docker buildx imagetools create -t "$tag" -t "$compatibility_tag" \
              --annotation "index:org.opencontainers.image.revision=${CANDIDATE_SHA}" \
              "${tag}-amd64" "${tag}-arm64"
          done
          subject_name="${REGISTRY_GHCR}/${IMAGE_NAME_GHCR}"
          subject_ref="${subject_name}:nightly-${{ needs.mirror-base-images.outputs.build_date }}"
          subject_digest="$(docker buildx imagetools inspect "$subject_ref" --format '{{.Manifest.Digest}}')"
          echo "subject_name=$subject_name" >> "$GITHUB_OUTPUT"
          echo "subject_digest=$subject_digest" >> "$GITHUB_OUTPUT"

      - name: Attest nightly AOT manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.subject_name }}
          subject-digest: ${{ steps.manifest.outputs.subject_digest }}
          push-to-registry: true

  compose-executor:
    name: Publish Compose executor and customer quickstart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [select-candidate, manifest-aot]
    if: needs.select-candidate.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-candidate.outputs.sha }}
          persist-credentials: false
      - name: Verify source and serving image binding
        env:
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
          SERVER_IMAGE: ${{ needs.manifest-aot.outputs.image }}
        run: |
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          [[ "$SERVER_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish executor from the serving candidate digest
        id: executor
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.compose-executor
          build-args: HONUA_SERVER_IMAGE=${{ needs.manifest-aot.outputs.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/honua-io/honua-compose-executor:nightly-${{ needs.select-candidate.outputs.sha7 }}
            ghcr.io/honua-io/honua-compose-executor:nightly
          labels: org.opencontainers.image.revision=${{ needs.select-candidate.outputs.sha }}
          annotations: index:org.opencontainers.image.revision=${{ needs.select-candidate.outputs.sha }}
          provenance: true
          sbom: true
      - name: Attest executor index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/honua-io/honua-compose-executor
          subject-digest: ${{ steps.executor.outputs.digest }}
          push-to-registry: true
      - name: Package immutable customer quickstart
        env:
          SERVER_IMAGE: ${{ needs.manifest-aot.outputs.image }}
          EXECUTOR_IMAGE: ghcr.io/honua-io/honua-compose-executor@${{ steps.executor.outputs.digest }}
          CANDIDATE_SHA7: ${{ needs.select-candidate.outputs.sha7 }}
        run: |
          python3 scripts/docker/package_quickstart.py --server-image "$SERVER_IMAGE" \
            --executor-image "$EXECUTOR_IMAGE" --worker-image "$SERVER_IMAGE" \
            --version "nightly-${CANDIDATE_SHA7}" --output artifacts/honua-compose-quickstart
          sha256sum artifacts/honua-compose-quickstart.tar.gz > artifacts/honua-compose-quickstart.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: honua-compose-quickstart-${{ needs.select-candidate.outputs.sha7 }}
          path: artifacts/honua-compose-quickstart.tar.gz*
          if-no-files-found: error

  manifest-jit:
    name: Publish JIT Manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [select-candidate, build-jit, mirror-base-images]
    if: ${{ needs.select-candidate.outputs.publish == 'true' && needs.build-jit.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Refuse a candidate that is not this run's commit
        # Provenance binds to github.sha; a build of any other sha is unpinnable.
        env:
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: |
          if [ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::candidate ${CANDIDATE_SHA} is not this run's commit ${GITHUB_SHA}: labels would name ${CANDIDATE_SHA} while the build provenance names ${GITHUB_SHA}. Dispatch this workflow on trunk (it re-dispatches itself at refs/tags/nightly-candidate-<sha7>) or directly at that tag."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=nightly-jit
            type=raw,value=nightly-jit-${{ needs.mirror-base-images.outputs.build_date }}
            type=raw,value=nightly-jit-${{ needs.select-candidate.outputs.sha7 }}
            type=raw,value=trunk-jit

      - name: Create and push multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" \
              --annotation "index:org.opencontainers.image.revision=${CANDIDATE_SHA}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

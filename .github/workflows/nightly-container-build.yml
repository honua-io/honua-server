name: Nightly Container Build

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC nightly
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_GHCR: ${{ github.repository }}
  IMAGE_NAME_DOCKERHUB: honuaio/honua-server

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.variant }} Images (Nightly)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: AOT
            dockerfile: docker/Dockerfile.aot
            tag_prefix: nightly-aot
          - variant: JIT
            dockerfile: Dockerfile
            tag_prefix: nightly
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
            docker.io/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=raw,value=${{ matrix.tag_prefix }}
            type=raw,value=${{ matrix.tag_prefix }}-{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ matrix.tag_prefix }}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

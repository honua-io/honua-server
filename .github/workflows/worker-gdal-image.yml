name: GDAL Worker Image

# The heavyweight GDAL worker image is intentionally isolated from the required,
# lean PR Gate. This path-filtered PR workflow supplies earlier image feedback
# for changes to the image definition without charging nearly every server edit
# for a native-tool image build and scan.
#
# ROUTING CONTRACT (#3553). The `pull_request` trigger below is deliberately
# limited to inputs that DEFINE the image: the worker Docker context, worker-owned
# managed source, the build context filter, the in-image restore helper, the
# boundary verifier, the production-image certification test and its CI setup,
# the real-PDAL execution proof and the [PdalCliFact]/[GdalCliFact] attribute
# helper it depends on (honua-server#4401 — this workflow is the ONLY lane that
# runs Category=PDAL, so a PR that deletes the attribute, retraits the case or
# weakens its assertions must land here to be seen), and this workflow. Shared managed-source and build-graph
# inputs (`src/Honua.Core/**`, `src/Honua.Core.Abstractions/**`,
# `src/Honua.Analyzers/**`, `src/Honua.Geoprocessing/**`, `src/Honua.Jobs/**`,
# `src/Honua.Geometry/**`, `src/Honua.Hosting/**`,
# `src/Honua.ServiceDefaults/**`, `eng/**`, the solution, build props/targets,
# package configuration, and `.editorconfig`) are NOT PR triggers, because they
# change across ordinary server work and made nearly every such pull request pay
# for the GDAL image even when it did not change the worker-owned boundary.
# Their evidence is placed elsewhere, and each risk still has a named owner:
#
#   * Managed compile risk -> the required PR Gate and the merge train's batch
#     CI, pre-merge, on the exact source and build graph that lands.
#   * Worker image/runtime integration risk from excluded shared inputs -> this
#     workflow's retained Monday schedule (`45 7 * * 1`) on trunk, including the
#     real worker entrypoint smoke and vulnerability scan. A defect introduced
#     by a broad `src/**` or build-graph change is therefore caught within seven
#     days rather than left uncovered.
#   * Direct image-boundary risk -> this workflow, per PR, whenever the Docker
#     context, worker-owned source, restore helper, verifier, certification, or
#     routing changes.
#
# As with #3204, deleting the boundary lane would trade cost for unbounded
# defects, so nothing is deleted here: the weekly schedule remains unchanged,
# and excluded shared-input risk moves from "every push" to "within seven days."
on:
  pull_request:
    branches: [trunk]
    paths:
      - 'docker/worker-gdal/**'
      - 'src/Honua.Worker.Gdal/**'
      - '.dockerignore'
      - 'scripts/docker/restore-dotnet-with-github-packages.sh'
      - 'scripts/ci/verify-serving-image-boundary.py'
      - 'scripts/qualification/gp_native_observer.py'
      - 'scripts/qualification/verify_native_entry_image.py'
      - 'tests/dotnet/Honua.Worker.Gdal.Tests/NativeEntryQualificationTests.cs'
      - 'tests/dotnet/Honua.Worker.Gdal.Tests/ProductionWorkerContainerHandoffTests.cs'
      - 'tests/dotnet/Honua.Protocols.OgcApi.Tests/Source/Processes/NativeWorkerPublicApiTests.cs'
      - 'tests/dotnet/Honua.Protocols.OgcApi.Tests/Honua.Protocols.OgcApi.Tests.csproj'
      - 'tests/dotnet/Honua.Worker.Gdal.Tests/PdalPointCloudRealCliTests.cs'
      - 'tests/dotnet/Honua.Worker.Gdal.Tests/GdalCli.cs'
      - 'tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj'
      - '.github/actions/setup-dotnet-ci/**'
      - '.github/workflows/worker-gdal-image.yml'
      - 'scripts/ci/worker_publication.py'
      - 'scripts/ci/test_worker_publication.py'
  schedule:
    - cron: '45 7 * * 1'
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish the exact gated amd64 worker from canonical trunk (never a release)
        type: boolean
        default: false
      candidate_sha:
        description: >-
          Optional full 40-hex commit to build and publish instead of the dispatch
          commit. The workflow must still be dispatched from trunk. The commit must
          be reachable from trunk. Empty builds the dispatch commit.
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-gdal-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publication-contract:
    name: Verify worker publication guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 -m unittest discover -s scripts/ci -p test_worker_publication.py -v

  build-and-scan:
    name: Build, verify, and scan GDAL worker
    needs: publication-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sarif-created: ${{ steps.sarif.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve worker source commit
        id: source
        env:
          # PR and schedule runs never see a candidate; only an explicit trunk dispatch may name one.
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || '' }}
          # A shallow checkout cannot prove candidate ancestry; the compare API fallback needs gh auth.
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/worker_publication.py resolve-source

      # The running workflow file is already loaded from trunk. Keep that publication
      # script: the candidate tree's copy records GITHUB_SHA and would disagree with
      # the image revision label. Boundary scripts after this step are the candidate's.
      - name: Check out the candidate the worker image must match
        if: steps.source.outputs.source_sha != github.sha
        run: |
          set -euo pipefail
          install -d /tmp/honua-worker-publication
          cp scripts/ci/worker_publication.py /tmp/honua-worker-publication/worker_publication.py
          git fetch --no-tags origin "${{ steps.source.outputs.source_sha }}"
          git checkout --detach "${{ steps.source.outputs.source_sha }}"

      - name: Set up .NET CI
        uses: ./.github/actions/setup-dotnet-ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR for build cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build isolated native worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/worker-gdal/Dockerfile
          platforms: linux/amd64
          load: true
          # Refresh runtime security upgrades while retaining PDAL and managed build caches.
          no-cache-filters: native-tools
          tags: honua-worker-gdal:boundary
          build-args: |
            HONUA_GIT_SHA=${{ steps.source.outputs.source_sha }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-worker-gdal-amd64
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-worker-gdal-amd64,mode=max' || '' }}
          provenance: false
          sbom: false

      - name: Prove managed native entry cleanup and loader floor
        run: |
          dotnet test tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~NativeEntryQualificationTests' \
            --logger 'trx;LogFileName=native-entry-managed.trx' \
            --results-directory tests/TestResults
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('tests/TestResults/native-entry-managed.trx').getroot()
          cases = root.findall('.//{*}UnitTestResult')
          passed = sum(case.get('outcome') == 'Passed' for case in cases)
          nonpassing = len(cases) - passed
          print(f'Managed native entry: {passed} passed, {nonpassing} non-passing')
          if passed < 15 or nonpassing:
              raise SystemExit('Native entry cleanup/loader/release controls missing, failed, or skipped')
          PY

      - name: Prove actual image native entry hold and cancellation
        run: >-
          python3 scripts/qualification/verify_native_entry_image.py
          --image honua-worker-gdal:boundary --source-sha "${{ steps.source.outputs.source_sha }}"
          --output tests/TestResults/native-entry-image.json

      - name: Start attested Redis for worker smoke test
        run: >-
          docker run --detach --name worker-redis --network host redis:7.2-alpine
          redis-server --appendonly yes --appendfsync always --save ""
          --maxmemory-policy noeviction

      - name: Wait for attested Redis
        run: >-
          timeout 30 sh -c
          'until docker exec worker-redis redis-cli ping; do sleep 1; done'

      - name: Verify native tools and smoke the real worker entrypoint
        run: >-
          python3 scripts/ci/verify-serving-image-boundary.py
          --worker-image honua-worker-gdal:boundary
          --worker-redis 127.0.0.1:6379

      - name: Certify production worker queue handoff
        id: worker-handoff
        env:
          HONUA_WORKER_IMAGE: honua-worker-gdal:boundary
        run: >-
          dotnet test tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~ProductionWorkerContainerHandoffTests
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=worker-container-handoff.trx"
          --results-directory tests/TestResults

      - name: Prove the container handoff cases ran, not skipped
        # honua-server#4401. ProductionWorkerContainerHandoffTests is a
        # [RequiredEnvironmentFact("HONUA_WORKER_IMAGE")] with no require-override:
        # if that env var is ever dropped from the step above, every case skips
        # cleanly and `dotnet test` still exits 0, so this lane would report green
        # having executed zero cases. Assert on the TRX counts, not the exit code.
        # Same idiom as ci.yml's Category=GDAL tripwire.
        if: ${{ !cancelled() && steps.worker-handoff.conclusion != 'skipped' }}
        run: |
          set -euo pipefail
          trx=tests/TestResults/worker-container-handoff.trx
          if [[ ! -f "${trx}" ]]; then
            echo "::error::no TRX produced for ProductionWorkerContainerHandoffTests"
            exit 1
          fi
          # `|| true` is load-bearing under `set -euo pipefail`: grep exits 1 when
          # it matches nothing, which is the healthy case for the skipped count.
          count_outcome() {
            { grep -o "outcome=\"$1\"" "${trx}" || true; } | wc -l | tr -d '[:space:]'
          }
          passed=$(count_outcome Passed)
          skipped=$(count_outcome NotExecuted)
          {
            echo '### Production worker container handoff'
            echo
            echo "- Passed: ${passed}"
            echo "- Skipped: ${skipped}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${skipped}" -gt 0 ]]; then
            echo "::error::${skipped} container handoff case(s) were skipped — HONUA_WORKER_IMAGE was not seen by the test host"
            exit 1
          fi
          if [[ "${passed}" -lt 1 ]]; then
            echo "::error::no container handoff case passed — the production-image certification has silently disappeared"
            exit 1
          fi

      - name: Prove real PDAL executes in the production worker image
        # honua-server#4401: PDAL had never been executed by any test — a repo-wide
        # grep for PdalCliFact / HONUA_REQUIRE_PDAL returned nothing, no workflow
        # installed it, and the only invocation anywhere was `pdal --version`. So
        # pcloud.translate's GA claim rested entirely on argument assertions against
        # a fake runner. HONUA_REQUIRE_PDAL_CLI turns an absent PDAL into a failure
        # rather than a skip, and the counts tripwire below catches every other way
        # the coverage could vanish.
        #
        # `dotnet test` runs on the RUNNER, and no Ubuntu release publishes a `pdal`
        # package — that is exactly why docker/worker-gdal/Dockerfile compiles the
        # pinned upstream source — so the tool cannot be apt-provisioned here. The
        # proof therefore dispatches every pdal invocation INTO the image just built,
        # through the production DockerGdalCommandRunner that HONUA_WORKER_IMAGE
        # selects (GdalCli.CreatePdalRunner): identical-path bind mount, executor code
        # path unchanged, and the PDAL binary under test is the one the worker ships.
        # HONUA_GDAL_PROOF_USER pins the container uid:gid to the runner's own so the
        # LAS/LAZ files written into the bind-mounted scratch stay host-readable.
        id: pdal-proof
        env:
          HONUA_WORKER_IMAGE: honua-worker-gdal:boundary
          HONUA_REQUIRE_PDAL_CLI: "true"
        run: |
          set -euo pipefail
          # Fail fast and legibly if the image lost PDAL, rather than inside a test.
          docker run --rm --network none --entrypoint pdal honua-worker-gdal:boundary --version
          export HONUA_GDAL_PROOF_USER="$(id -u):$(id -g)"
          dotnet test tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj \
            --configuration Release \
            --filter "Category=PDAL" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=worker-pdal-proof.trx" \
            --results-directory tests/TestResults

      - name: Prove the PDAL cases ran, not skipped
        if: ${{ !cancelled() && steps.pdal-proof.conclusion != 'skipped' }}
        run: |
          set -euo pipefail
          trx=tests/TestResults/worker-pdal-proof.trx
          if [[ ! -f "${trx}" ]]; then
            echo "::error::no TRX produced for the Category=PDAL subset"
            exit 1
          fi
          count_outcome() {
            { grep -o "outcome=\"$1\"" "${trx}" || true; } | wc -l | tr -d '[:space:]'
          }
          passed=$(count_outcome Passed)
          skipped=$(count_outcome NotExecuted)
          {
            echo '### Real-PDAL coverage'
            echo
            echo "- Passed: ${passed}"
            echo "- Skipped: ${skipped}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${skipped}" -gt 0 ]]; then
            echo "::error::${skipped} PDAL case(s) were skipped — the only real-PDAL coverage in the repository has disappeared"
            exit 1
          fi
          if [[ "${passed}" -lt 1 ]]; then
            echo "::error::no PDAL case passed — pcloud.translate has no executed receipt"
            exit 1
          fi

      - name: Prove native public API submit poll and decoded output
        env:
          HONUA_WORKER_IMAGE: honua-worker-gdal:boundary
        run: |
          dotnet test tests/dotnet/Honua.Protocols.OgcApi.Tests/Honua.Protocols.OgcApi.Tests.csproj \
            --configuration Release -maxcpucount:4 \
            --filter 'Category=NativePublicApi' \
            --logger 'trx;LogFileName=native-public-api.trx' \
            --results-directory tests/TestResults
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('tests/TestResults/native-public-api.trx').getroot()
          cases = root.findall('.//{*}UnitTestResult')
          passed = sum(case.get('outcome') == 'Passed' for case in cases)
          nonpassing = len(cases) - passed
          print(f'Native public API: {passed} passed, {nonpassing} non-passing')
          if passed < 1 or nonpassing:
              raise SystemExit('Native public API receipt missing, failed, or skipped')
          PY

      - name: Upload worker certification results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-gdal-certification
          path: |
            tests/TestResults/*.trx
            tests/TestResults/native-entry-image.json
          if-no-files-found: warn

      - name: Create worker vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: honua-worker-gdal:boundary
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-worker-gdal.sarif
          vuln-type: os,library

      # Report-only license inventory for the worker image. It is built on
      # ghcr.io/osgeo/gdal:ubuntu-full and knowingly carries LGPL/GPL system libraries
      # (GEOS, Poppler, MariaDB client, unixODBC, libheif, SpatiaLite); Honua invokes
      # GDAL as a separate process, and THIRD-PARTY-NOTICES.md records the set and
      # the source offer. Review the artifact when the base image changes.
      - name: Report worker image licenses
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: honua-worker-gdal:boundary
          scanners: license
          format: table
          output: trivy-worker-gdal-licenses.txt
          exit-code: '0'

      - name: Upload worker image license report
        if: always() && hashFiles('trivy-worker-gdal-licenses.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-worker-gdal-licenses-${{ github.sha }}
          path: trivy-worker-gdal-licenses.txt
          retention-days: 30

      - name: Record worker report availability
        id: sarif
        if: always() && hashFiles('trivy-worker-gdal.sarif') != ''
        shell: bash
        run: echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Retain worker scan report
        if: always() && steps.sarif.outputs.created == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-worker-gdal-${{ github.sha }}
          path: trivy-worker-gdal.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Enforce worker vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: honua-worker-gdal:boundary
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          vuln-type: os,library

      # Dispatch with publish_nightly=false rehearses export/load/identity without
      # a registry write. PR and scheduled validation do not retain a large tar.
      - name: Prepare exact tested worker publication bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          script="scripts/ci/worker_publication.py"
          if [[ -f /tmp/honua-worker-publication/worker_publication.py ]]; then
            script=/tmp/honua-worker-publication/worker_publication.py
          fi
          python3 "$script" prepare

      - name: Retain exact tested worker publication bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/worker-publication/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish-nightly:
    name: Publish verified nightly GDAL worker
    needs: [build-and-scan, publish-sarif]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish_nightly == true &&
      github.repository == 'honua-io/honua-server' && github.ref == 'refs/heads/trunk' &&
      needs.build-and-scan.result == 'success' && needs.publish-sarif.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUBLISH_NIGHTLY: ${{ inputs.publish_nightly }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/worker-publication
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the exact tested image without rebuilding
        id: publish
        run: python3 scripts/ci/worker_publication.py publish
      - name: Attest verified nightly worker
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.subject_name }}
          subject-digest: ${{ steps.publish.outputs.subject_digest }}
          push-to-registry: true
      - name: Verify exact source provenance and finalize receipt
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          gh attestation verify "oci://$WORKER_IMAGE" --repo honua-io/honua-server \
            --signer-workflow honua-io/honua-server/.github/workflows/worker-gdal-image.yml \
            --source-ref refs/heads/trunk --source-digest "$GITHUB_SHA" --format json \
            > artifacts/worker-publication/provenance-verification.json
          python3 scripts/ci/worker_publication.py finish
      - name: Retain publication identity and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-nightly-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/worker-publication/*.json
            artifacts/worker-publication/*.trx
            artifacts/worker-publication/*.sarif
          if-no-files-found: error
          retention-days: 30

  publish-sarif:
    name: Publish GDAL worker SARIF
    needs: build-and-scan
    if: >-
      always() &&
      needs.build-and-scan.outputs.sarif-created == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download worker scan report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-worker-gdal-${{ github.sha }}

      - name: Upload worker scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-worker-gdal.sarif
          category: worker-gdal

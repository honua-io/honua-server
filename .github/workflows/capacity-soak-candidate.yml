name: capacity-soak-candidate

# Attests one flat capacity-evidence.zip containing a v2 receipt and measured
# honua.capacity-observations/v1. Dispatch at the manifest candidate commit;
# the workflow source, checkout, image and observed deployment must all agree.
# The release checker recomputes the signals and binds the ZIP attestation.
# See docs/ops/capacity-soak-receipt.md.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character honua-server commit SHA to certify (the manifest-pinned candidate)
        required: true
        type: string
      candidate_image:
        description: >-
          Manifest-pinned immutable image reference (repo@sha256:...). Source-built images
          are inadmissible. The deployment revision is independently read from the server.
        required: true
        type: string
      lock_ref:
        description: honua-release ref to read certification/capacity-envelope.v1.json from
        required: false
        default: trunk
        type: string
      steady_state_seconds:
        description: Steady-state duration. 0 uses the lock's soak.minimumSteadyStateSeconds.
        required: false
        default: '0'
        type: string
      publish:
        description: Publish the attested ZIP to the soak-receipts branch and print its immutable URL
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      candidate_sha:
        description: Full 40-character honua-server commit SHA to certify (the manifest-pinned candidate)
        required: true
        type: string
      candidate_image:
        description: >-
          Manifest-pinned immutable image reference (repo@sha256:...). Source-built images
          are inadmissible. The deployment revision is independently read from the server.
        required: true
        type: string
      lock_ref:
        description: honua-release ref to read certification/capacity-envelope.v1.json from
        required: false
        default: trunk
        type: string
      steady_state_seconds:
        description: Steady-state duration. 0 uses the lock's soak.minimumSteadyStateSeconds.
        required: false
        default: '0'
        type: string
      publish:
        description: Publish the attested ZIP to the soak-receipts branch and print its immutable URL
        required: false
        default: true
        type: boolean
permissions:
  contents: write        # publishes the receipt to the orphan soak-receipts branch
  id-token: write        # actions/attest-build-provenance
  attestations: write    # actions/attest-build-provenance
  packages: read         # the candidate image build restores Geospatial.Grpc from GitHub Packages

concurrency:
  group: capacity-soak-candidate
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  BASE_URL: http://localhost:5000
  SOAK_SERVER_PORT: '5000'
  SOAK_DB_NAME: honua_soak
  SOAK_DB_USER: honua
  SOAK_DB_PORT: '5432'
  SOAK_DB_PASSWORD: soak-candidate-db-password
  # Per-run, not a repository literal: a credential checked in here is a public value, and
  # production startup validation refuses every credential literal this repository ships.
  SOAK_ADMIN_PASSWORD: 'Capacity-Soak-${{ github.run_id }}-${{ github.run_attempt }}-Aa1!'
  SOAK_MASTER_KEY: capacity-soak-master-key-${{ github.run_id }}-${{ github.run_attempt }}-padding0000
  SOAK_GP_WORKERS: '1'
  LOCK_PATH: certification/capacity-envelope.v1.json

jobs:
  soak:
    name: Candidate capacity soak
    runs-on: ubuntu-24.04
    # One soak is ramp-up + 60 minutes of steady state + ramp-down, on top of an image build and
    # a 40,000-feature seed. Budget generously; the job is dispatch-only.
    timeout-minutes: 300
    steps:
      - name: Check out the producer (this ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: producer

      - name: Check out the candidate at the exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate

      - name: Require workflow source and checkout at the candidate commit
        working-directory: producer
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess, sys
          sys.path.insert(0, "scripts/soak")
          from capacity_evidence import assert_candidate
          candidate = os.environ["CANDIDATE_SHA"]
          for checkout in (".", "../candidate"):
              actual = subprocess.check_output(["git", "-C", checkout, "rev-parse", "HEAD"], text=True).strip()
              assert_candidate(candidate, os.environ["GITHUB_SHA"], actual)
              assert_candidate(candidate, os.environ["GITHUB_WORKFLOW_SHA"], actual)
          if not re.fullmatch(r"ghcr.io/honua-io/honua-server@sha256:[0-9a-f]{64}", os.environ["CANDIDATE_IMAGE"]):
              sys.exit("candidate_image must be the manifest-pinned GHCR digest")
          PYTHON

      - name: Setup Python
        uses: ./producer/.github/actions/setup-python-ci
        with:
          python-version: '3.12'

      - name: Install driver dependencies
        run: python -m pip install --upgrade pip "httpx>=0.27" "psycopg[binary]>=3.1" "aiohttp>=3.12" "pyyaml>=6"

      - name: Setup .NET
        uses: ./producer/.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Fetch the frozen capacity lock
        id: lock
        env:
          LOCK_REF: ${{ inputs.lock_ref }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
        run: |
          set -euo pipefail
          # Resolve once: lock, manifest and verifier always come from the same commit.
          release_sha="$(gh api "repos/honua-io/honua-release/commits/$LOCK_REF" --jq .sha)"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          root="https://raw.githubusercontent.com/honua-io/honua-release/$release_sha"
          url="$root/$LOCK_PATH"
          curl --retry 5 --retry-all-errors --retry-max-time 300 --fail --silent --show-error --proto '=https' --tlsv1.2 "$url" -o lock.json
          mkdir -p "$RUNNER_TEMP/release-tools"
          for file in check_capacity_soak.py capacity_observations.py extract_capacity_evidence.py; do
            curl --retry 5 --retry-all-errors --retry-max-time 300 --fail --silent --show-error --proto '=https' --tlsv1.2 "$root/tools/$file" -o "$RUNNER_TEMP/release-tools/$file"
          done
          curl --retry 5 --retry-all-errors --retry-max-time 300 --fail --silent --show-error --proto '=https' --tlsv1.2 "$root/platform-manifest.yaml" -o "$RUNNER_TEMP/platform-manifest.yaml"
          python - <<'PYTHON'
          import os, pathlib, yaml
          manifest = yaml.safe_load((pathlib.Path(os.environ["RUNNER_TEMP"])/"platform-manifest.yaml").read_text())
          candidate = manifest["components"]["honua-server"]
          if candidate["sha"] != os.environ["CANDIDATE_SHA"] or candidate["digest"] != os.environ["CANDIDATE_IMAGE"].split("@")[-1]:
              raise SystemExit("dispatch does not match the pinned manifest candidate and image")
          PYTHON
          digest="$(sha256sum lock.json | cut -d' ' -f1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("lock.json", encoding="utf-8"))
          envelope = lock["supportedEnvelope"]
          print(f"profile={lock['soak']['profile']}")
          print(f"minimum_steady={lock['soak']['minimumSteadyStateSeconds']}")
          print(f"virtual_users={envelope['concurrentVirtualUsers']}")
          print(f"layers={envelope['layersPerService']}")
          print(f"features={envelope['featuresPerLayer']}")
          print(f"gp_workers={envelope['gpWorkers']}")
          print(f"gp_queue_depth={envelope['gpQueueDepth']}")
          print(f"subscriptions={envelope.get('activeSubscriptions', 256)}")
          print(f"streams_enabled={str('activeSubscriptions' in envelope).lower()}")
          PY
          echo "lock sha256: $digest"

      - name: Resolve the steady-state duration
        id: window
        env:
          REQUESTED: ${{ inputs.steady_state_seconds }}
          MINIMUM: ${{ steps.lock.outputs.minimum_steady }}
        run: |
          set -euo pipefail
          steady="$REQUESTED"
          if [ "$steady" = "0" ] || [ -z "$steady" ]; then steady="$MINIMUM"; fi
          if [ "$steady" -lt "$MINIMUM" ]; then
            echo "::error::steady_state_seconds ($steady) is below the locked minimum ($MINIMUM)"
            exit 1
          fi
          echo "steady=$steady" >> "$GITHUB_OUTPUT"

      - name: Assert the soak profile matches the frozen envelope
        id: profile
        working-directory: producer
        env:
          EXPECTED_PROFILE: ${{ steps.lock.outputs.profile }}
          EXPECTED_USERS: ${{ steps.lock.outputs.virtual_users }}
        run: |
          set -euo pipefail
          # Fail in seconds, not after an hour: the profile about to run has to be the profile the
          # lock names, at the concurrency the lock declares.
          dotnet run --project tests/dotnet/Honua.LoadTests -c Release -- \
            --profile "$EXPECTED_PROFILE" --print-profile | tee profile.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          profile = json.load(open("profile.json", encoding="utf-8"))
          expected = int(os.environ["EXPECTED_USERS"])
          if profile["totalVirtualUsers"] != expected:
              sys.exit(f"soak profile drives {profile['totalVirtualUsers']} virtual users, "
                       f"lock declares {expected}")
          print(f"virtual_users={profile['totalVirtualUsers']}")
          print(f"ramp_up={int(profile['rampUpSeconds'])}")
          PY

      - name: Mint a signed Pro license for this run
        id: license
        working-directory: producer
        run: |
          set -euo pipefail
          # Licensing:DevGrantEdition is refused under the Production startup policy by design, and
          # the soak keeps a real signed license on the same verification path a customer uses. The
          # key pair is generated here, used once, and never leaves the runner.
          mkdir -p "$RUNNER_TEMP/license"
          dotnet run --project src/Honua.LicenseMint -c Release -- keygen --key-id soak \
            --private-out "$RUNNER_TEMP/license/soak.key" | tee "$RUNNER_TEMP/license/keygen.txt"
          trusted="$(grep -oE 'base64url:[A-Za-z0-9_-]+' "$RUNNER_TEMP/license/keygen.txt" | head -1)"
          dotnet run --project src/Honua.LicenseMint -c Release -- mint --key-id soak \
            --license-id "capacity-soak-${{ github.run_id }}" \
            --licensed-to "Honua capacity soak (honua-release#235)" \
            --edition Pro --expires "$(date -u -d '+2 days' +%Y-%m-%d)" \
            --private-key-file "$RUNNER_TEMP/license/soak.key" \
            --out "$RUNNER_TEMP/license/license.json" >/dev/null
          rm -f "$RUNNER_TEMP/license/soak.key"
          echo "::add-mask::$trusted"
          echo "trusted_key=$trusted" >> "$GITHUB_OUTPUT"

      - name: Mint a throwaway key-ring certificate for this run
        run: |
          set -euo pipefail
          # Since #4722 the Production startup policy composes the Redis-backed durable operation
          # secret channel and refuses to boot unless an operator certificate encrypts the
          # data-protection key ring (Operations:SecretChannel:KeyRingCertificatePath); without one
          # every candidate after #4722 exits before readiness (#4885). The requirement stays: the
          # run supplies a certificate instead. It guards only this runner's disposable Redis, so it
          # is generated here, used for this run, and never leaves the runner or enters the repo.
          keyring="$RUNNER_TEMP/keyring"
          install -d -m 0755 "$keyring"
          SOAK_KEYRING_PASSWORD="$(openssl rand -hex 24)"
          export SOAK_KEYRING_PASSWORD
          echo "::add-mask::$SOAK_KEYRING_PASSWORD"
          (
            umask 077
            openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=honua-capacity-soak-keyring" \
              -keyout "$keyring/keyring.key" -out "$keyring/keyring.crt" 2>/dev/null
            openssl pkcs12 -export -in "$keyring/keyring.crt" -inkey "$keyring/keyring.key" \
              -out "$keyring/operation-keyring.pfx" -passout env:SOAK_KEYRING_PASSWORD
          )
          # The PKCS#12 carries the private key the server needs; the loose PEM copy is not kept.
          rm -f "$keyring/keyring.key" "$keyring/keyring.crt"
          # Bind-mounted read-only; the image's non-root user reads it by mode, not by host uid.
          chmod 0644 "$keyring/operation-keyring.pfx"
          # Every later `docker compose` call (boot, republish restart, the driver's recovery drill,
          # teardown) re-reads docker-compose.soak.yml, so the pair goes to the job environment.
          echo "SOAK_KEYRING_CERTIFICATE=$keyring/operation-keyring.pfx" >> "$GITHUB_ENV"
          echo "SOAK_KEYRING_PASSWORD=$SOAK_KEYRING_PASSWORD" >> "$GITHUB_ENV"

      - name: Pull the supplied candidate image
        id: pulled
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
        run: |
          set -euo pipefail
          docker pull "$CANDIDATE_IMAGE"
          echo "reference=$CANDIDATE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=${CANDIDATE_IMAGE##*@}" >> "$GITHUB_OUTPUT"

      - name: Start the local-docker substrate
        id: substrate
        working-directory: producer
        env:
          SOAK_SERVER_IMAGE: ${{ steps.pulled.outputs.reference }}
          SOAK_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOAK_LICENSE_TRUSTED_KEY: ${{ steps.license.outputs.trusted_key }}
          SOAK_STREAMS_ENABLED: ${{ steps.lock.outputs.streams_enabled }}
          SOAK_MAX_STREAM_SESSIONS: ${{ steps.lock.outputs.subscriptions }}
        run: |
          set -euo pipefail
          SOAK_LICENSE_CONTENT="$(cat "$RUNNER_TEMP/license/license.json")" \
            docker compose -f docker-compose.soak.yml up -d
          echo "image=$SOAK_SERVER_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Wait for the Production startup policy to report ready
        working-directory: producer
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 5 "$BASE_URL/healthz/ready" >/dev/null; then
              echo "ready"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' honua-capacity-soak-honua-1 2>/dev/null || echo false)" != true ]; then
              echo "::error::the candidate server exited before becoming ready"
              docker logs honua-capacity-soak-honua-1 2>&1 | tail -80
              exit 1
            fi
            sleep 5
          done
          echo "::error::the candidate server did not become ready within 600s"
          docker logs honua-capacity-soak-honua-1 2>&1 | tail -120
          exit 1

      - name: Seed exactly the declared envelope topology
        working-directory: producer
        run: |
          set -euo pipefail
          python scripts/soak/seed_envelope.py \
            --dsn "host=localhost port=${SOAK_DB_PORT} dbname=${SOAK_DB_NAME} user=${SOAK_DB_USER} password=${SOAK_DB_PASSWORD}" \
            --lock ../lock.json \
            --observation-out "$RUNNER_TEMP/topology.json"

      - name: Republish the served catalogue from the seeded rows
        working-directory: producer
        env:
          SOAK_SERVER_IMAGE: ${{ steps.substrate.outputs.image }}
          SOAK_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOAK_LICENSE_TRUSTED_KEY: ${{ steps.license.outputs.trusted_key }}
          SOAK_STREAMS_ENABLED: ${{ steps.lock.outputs.streams_enabled }}
          SOAK_MAX_STREAM_SESSIONS: ${{ steps.lock.outputs.subscriptions }}
        run: |
          set -euo pipefail
          # The server compiles its served metadata-v2 snapshot at startup, so a catalogue seeded
          # after boot is invisible until the snapshot is recompiled. Dropping the compiled
          # snapshot and restarting makes the server rebuild it from the seeded rows; flushing
          # Redis clears the response cache (including the 404s cached while the catalogue was
          # still empty) and starts the job store clean for the geoprocessing measurements.
          docker exec -e PGPASSWORD="$SOAK_DB_PASSWORD" honua-capacity-soak-postgres-1 \
            psql -U "$SOAK_DB_USER" -d "$SOAK_DB_NAME" \
            -c "DELETE FROM honua.metadata_v2_current; DELETE FROM honua.metadata_v2_snapshots;"
          docker exec honua-capacity-soak-redis-1 redis-cli FLUSHALL
          SOAK_LICENSE_CONTENT="$(cat "$RUNNER_TEMP/license/license.json")" \
            docker compose -f docker-compose.soak.yml restart honua
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 5 "$BASE_URL/healthz/ready" >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS "$BASE_URL/rest/services/test/FeatureServer/0/query?f=json&where=1%3D1&returnCountOnly=true"

      - name: Collect the complete candidate observation window
        id: soak
        working-directory: producer
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          IMAGE_DIGEST: ${{ steps.pulled.outputs.digest }}
          STEADY: ${{ steps.window.outputs.steady }}
          RAMP_UP: ${{ steps.profile.outputs.ramp_up }}
        run: |
          set -euo pipefail
          timeout --kill-after=60 "$(( RAMP_UP + STEADY + 900 ))s" \
            python scripts/soak/collect_capacity.py \
              --base-url "$BASE_URL" --admin-key "$SOAK_ADMIN_PASSWORD" \
              --lock ../lock.json --candidate-sha "$CANDIDATE_SHA" \
              --image-digest "$IMAGE_DIGEST" --steady-seconds "$STEADY" \
              --ramp-up-seconds "$RAMP_UP" \
              --out "$RUNNER_TEMP/capacity-observations.json"

      - name: Upload raw observations before binding the Actions artifact URI
        id: observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capacity-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity-observations.json
          if-no-files-found: error
          retention-days: 90

      - name: Build the bounded evidence ZIP
        working-directory: producer
        env:
          ARTIFACT_URL: ${{ steps.observations.outputs.artifact-url }}
        run: |
          python scripts/soak/capacity_evidence.py --lock ../lock.json \
            --observations "$RUNNER_TEMP/capacity-observations.json" \
            --artifact-url "$ARTIFACT_URL" --out "$RUNNER_TEMP/capacity-evidence.zip"

      - name: Attest the evidence ZIP
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/capacity-evidence.zip

      - name: Publish the ZIP at a commit-pinned HTTPS URL
        id: publish
        if: ${{ inputs.publish }}
        working-directory: producer
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python scripts/soak/publish_receipt.py \
            --receipt "$RUNNER_TEMP/capacity-evidence.zip" --repo "$GITHUB_REPOSITORY" \
            --branch soak-receipts --path "capacity/$CANDIDATE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.zip" \
            --message "capacity evidence for $CANDIDATE_SHA (run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT)" \
            --url-out "$RUNNER_TEMP/receipt-url.txt"
          echo "url=$(cat "$RUNNER_TEMP/receipt-url.txt")" >> "$GITHUB_OUTPUT"

      - name: Verify exact bundle bytes, attestation and recomputed release signals
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_URL: ${{ steps.publish.outputs.url }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          IMAGE_DIGEST: ${{ steps.pulled.outputs.digest }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/capacity-evidence.zip"
          if [ -n "$RECEIPT_URL" ]; then
            curl --retry 5 --retry-all-errors --retry-max-time 300 --fail --silent --show-error --proto '=https' --tlsv1.2 "$RECEIPT_URL" -o "$RUNNER_TEMP/published.zip"
            cmp "$bundle" "$RUNNER_TEMP/published.zip"
            bundle="$RUNNER_TEMP/published.zip"
          fi
          gh attestation verify "$bundle" --repo "$GITHUB_REPOSITORY" --format json > "$RUNNER_TEMP/verified-attestation.json"
          python "$RUNNER_TEMP/release-tools/extract_capacity_evidence.py" --bundle "$bundle" --output "$RUNNER_TEMP/verified-capacity"
          python "$RUNNER_TEMP/release-tools/check_capacity_soak.py" \
            --lock lock.json --receipt "$RUNNER_TEMP/verified-capacity/capacity-soak-receipt.json" \
            --artifact-root "$RUNNER_TEMP/verified-capacity" --expected-revision "$CANDIDATE_SHA" \
            --expected-image-digest "$IMAGE_DIGEST" --bundle "$bundle" \
            --attestation "$RUNNER_TEMP/verified-attestation.json" | tee "$RUNNER_TEMP/gate-verdict.txt"
          echo "selfcheck=pass" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          {
            echo "## Candidate capacity soak"
            echo
            echo "- candidate: \`$CANDIDATE_SHA\`"
            echo "- lock: ${{ steps.lock.outputs.url }} (sha256 \`${{ steps.lock.outputs.sha256 }}\`)"
            echo "- steady state: ${{ steps.window.outputs.steady }}s at ${{ steps.profile.outputs.virtual_users }} virtual users"
            echo "- self-check against the frozen lock: ${{ steps.receipt.outputs.selfcheck }}"
            if [ -n "${{ steps.publish.outputs.url }}" ]; then
              echo "- receipt: ${{ steps.publish.outputs.url }}"
              echo
              echo "\`capacity=${{ steps.publish.outputs.url }} candidate=$CANDIDATE_SHA\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect server logs
        if: always()
        run: |
          # Tail only: this server can emit gigabytes of Information records per hour under the
          # declared subscription load (honua-server#4711), and an artifact nobody can open is not
          # evidence. The rotated container log keeps the rest until the runner is recycled.
          docker logs --tail 50000 honua-capacity-soak-honua-1 > "$RUNNER_TEMP/honua-server.log" 2>&1 || true
          docker logs honua-capacity-soak-postgres-1 > "$RUNNER_TEMP/postgres.log" 2>&1 || true

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capacity-soak-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/capacity-evidence.zip
            ${{ runner.temp }}/capacity-observations.json
            ${{ runner.temp }}/verified-attestation.json
            ${{ runner.temp }}/gate-verdict.txt
            ${{ runner.temp }}/topology.json
            ${{ runner.temp }}/honua-server.log
            ${{ runner.temp }}/postgres.log
          if-no-files-found: warn
          retention-days: 90

      - name: Tear down the substrate
        if: always()
        working-directory: producer
        run: docker compose -f docker-compose.soak.yml down -v || true

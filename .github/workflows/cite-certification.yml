name: Exact-candidate CITE protocol certification
run-name: CITE Certification [${{ inputs.nightly_dispatch_id }}]

on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Immutable Honua Server candidate image (image@sha256:digest)
        required: true
        type: string
      source_sha:
        description: Full source SHA represented by the candidate image
        required: true
        type: string
      candidate_cut:
        description: RFC 3339 frozen candidate cut timestamp
        required: true
        type: string

      nightly_dispatch_id:
        description: Canonical nightly run and attempt correlation
        required: true
        type: string
      requirements_context:
        description: Bounded data-only governed CITE requirement context
        required: true
        type: string

# cite-evidence-report.yml requests packages/pages/id-token/issues write on the
# evidence job. The caller token is the intersection, so a narrower grant
# fails that reusable workflow before any job starts.
permissions:
  contents: read
  packages: write
  actions: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: cite-certification-${{ inputs.server_image }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Admit exact candidate and governed requirement context
        env:
          REQUIREMENTS_CONTEXT: ${{ inputs.requirements_context }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_IMAGE: ${{ inputs.server_image }}
          CANDIDATE_CUT: ${{ inputs.candidate_cut }}
          NIGHTLY_DISPATCH_ID: ${{ inputs.nightly_dispatch_id }}
        run: python3 scripts/conformance/cite/validate_cite_context.py

  cite:
    needs: admit
    uses: ./.github/workflows/cite-evidence-report.yml
    with:
      publish_pages: false
      server_image: ${{ inputs.server_image }}
      source_sha: ${{ inputs.source_sha }}
      candidate_cut: ${{ inputs.candidate_cut }}
    secrets: inherit

  normalize:
    needs: cite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download human-readable and raw CITE evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cite-conformance-evidence-*
          path: artifacts/cite-evidence
          merge-multiple: true

      - name: Emit exact-candidate normalized observations
        env:
          SERVER_IMAGE: ${{ inputs.server_image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_CUT: ${{ inputs.candidate_cut }}
          REQUIREMENTS_CONTEXT: ${{ inputs.requirements_context }}
          NIGHTLY_DISPATCH_ID: ${{ inputs.nightly_dispatch_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/conformance/cite/validate_cite_context.py --output "$RUNNER_TEMP/cite-requirements-context.json"
          started_at="$(< artifacts/cite-evidence/execution-started-at.txt)"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/conformance/cite/build_protocol_certification_fragment.py \
            --summary artifacts/cite-evidence/conformance-summary.json \
            --requirements "$RUNNER_TEMP/cite-requirements-context.json" \
            --wps-evidence artifacts/cite-evidence/reports/wps20 \
            --suite-provenance artifacts/cite-evidence/suite-provenance.json \
            --output artifacts/protocol-certification-fragment.json \
            --source-sha "$SOURCE_SHA" \
            --producer-source-sha "$GITHUB_SHA" \
            --image-digest "${SERVER_IMAGE##*@}" \
            --candidate-cut "$CANDIDATE_CUT" \
            --started-at "$started_at" \
            --completed-at "$completed_at" \
            --run-url "$RUN_URL"

      - name: Upload normalized certification fragment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cite-protocol-certification-${{ github.run_id }}
          path: |
            artifacts/protocol-certification-fragment.json
            artifacts/cite-evidence/
          retention-days: 180
          if-no-files-found: error

name: Archived quickstart customer journey

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
  pull_request:
    branches: [trunk]
    paths:
      - 'docs/get-started/**'
      - 'docker-compose*.yml'
      - 'docker/compose/**'
      - 'docs/guides/connect/working-with-ai-agents.md'
      - 'scripts/docker/*quickstart*.py'
      - 'tests/js-browser/quickstart/**'
      - 'tests/js-browser/playwright.quickstart.config.ts'
      - 'tests/js-browser/package*.json'
      - 'scripts/docs-validation/**'
      - 'src/Honua.Server/Migrations/**'
      - 'scripts/ci/start-empty-quickstart-docker.sh'
      - 'skills/**'
      - 'release/**'
      - '.github/workflows/nightly-container-build.yml'
      - '.github/workflows/shipped-quickstart.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: archived-quickstart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check archive and assertion refusal controls
        run: |
          python3 -m unittest discover -s scripts/docker -p 'test_shipped_quickstart*.py' -v
          python3 -m unittest discover -s scripts/docs-validation -p 'test_install_artifacts.py' -v

  package:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Create read-only Console artifact token for prospective package
        if: github.event_name == 'pull_request'
        id: console-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: honua-console
          permission-actions: read
      - name: Fetch official Console for prospective package
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.console-token.outputs.token }}
        run: python3 scripts/docker/fetch_quickstart_console.py --output "$RUNNER_TEMP/console.zip"
      - name: Prepare official archive or prospective PR package
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(--output "$RUNNER_TEMP/quickstart-proof")
          if [[ -n "$PR_SOURCE_SHA" ]]; then
            args+=(--prospective-source-sha "$PR_SOURCE_SHA" --prospective-console-bundle "$RUNNER_TEMP/console.zip")
          fi
          python3 scripts/docker/prepare_quickstart_proof.py "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickstart-proof-input
          path: |
            ${{ runner.temp }}/quickstart-proof/honua-compose-quickstart.tar.gz*
            ${{ runner.temp }}/quickstart-proof/quickstart.md
            ${{ runner.temp }}/quickstart-proof/input.json
          if-no-files-found: error
          retention-days: 7

  install:
    name: Archive install, Console/Studio sign-in, publish/query and fresh reinstall
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quickstart-proof-input
          path: ${{ runner.temp }}/quickstart-proof
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: tests/js-browser
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Start a dedicated empty Docker daemon
        run: bash scripts/ci/start-empty-quickstart-docker.sh
      - name: Install only archive files and execute documented data access
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'quickstart-proof'
          subprocess.run([
              'python3', 'scripts/docker/validate_shipped_quickstart.py',
              '--archive', str(root / 'honua-compose-quickstart.tar.gz'),
              '--document', str(root / 'quickstart.md'),
              '--receipt', 'artifacts/shipped-quickstart/receipt.json',
              '--input', str(root / 'input.json'),
          ], check=True)
          PY
      - name: Upload bounded customer journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archived-quickstart-customer-journey
          path: artifacts/shipped-quickstart/receipt.json
          if-no-files-found: warn
          retention-days: 14

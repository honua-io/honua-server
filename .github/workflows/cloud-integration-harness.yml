name: Cloud Integration Harness

# Opt-in, Docker-backed cloud-integration tests (#2163). Stands up REAL emulated cloud
# backends and exercises Honua's cloud seams end-to-end. Every test is tagged
# [Trait("Category","CloudIntegration")] so it is EXCLUDED from the default PR test run
# (which never invokes this project) and only runs here.
#
# All lanes are FREE (no paid token): kind (real Kubernetes-in-Docker) for
# KubernetesJobBatchComputeBackend, plus LocalStack Community (S3) via the project's
# Testcontainers fixture. Both gate cleanly with [SkippableFact] when Docker is unavailable.

on:
  schedule:
    # Nightly; the harness is Docker-heavy and not part of the per-PR gate.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  CSPROJ: tests/dotnet/Honua.CloudIntegration.Tests/Honua.CloudIntegration.Tests.csproj
  # Worker images the kind-backed Job lifecycle tests submit. Built and loaded into the kind node
  # below; ImagePullPolicy=Never in the tests keeps them local-only.
  #   succeed -> exits 0 (happy path), fail -> exits 1 (failure path), sleep -> long-running (cancel path).
  JOB_IMAGE: honua-ci/job-succeed:latest
  JOB_FAIL_IMAGE: honua-ci/job-fail:latest
  JOB_SLEEP_IMAGE: honua-ci/job-sleep:latest

concurrency:
  group: cloud-integration-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  free-tier:
    name: Free Tier (kind + LocalStack Community)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build cloud-integration test binaries
        timeout-minutes: 25
        run: dotnet build ${{ env.CSPROJ }} --no-restore --configuration Release

      - name: Pre-pull LocalStack Community image
        shell: bash
        run: |
          # Warm the docker cache so the LocalStackFixture Testcontainer does not pull during
          # the test run. Container provisioning itself is owned by the fixture.
          docker pull localstack/localstack:3.6.0 || echo "::warning::could not pre-pull localstack"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: honua-cloud-integration

      - name: Build and load the self-terminating worker images into kind
        shell: bash
        run: |
          # Minimal busybox images standing in for GP workers across the success, failure, and
          # cancellation lifecycle paths. The tests set ImagePullPolicy=Never, so each image must
          # be present on the kind node (no registry pull). BuildManifest does not set a container
          # command/args, so each image self-selects behaviour via its own ENTRYPOINT.
          build_and_load() {
            local image="$1" entrypoint="$2"
            local workdir
            workdir="$(mktemp -d)"
            cat > "${workdir}/Dockerfile" <<EOF
          FROM busybox:1.36
          ENTRYPOINT ${entrypoint}
          EOF
            docker build -t "${image}" "${workdir}"
            kind load docker-image "${image}" --name honua-cloud-integration
          }

          # Succeed (exit 0), fail (exit 1), and sleep (long-running, for the cancel path).
          build_and_load "${JOB_IMAGE}"       '["/bin/true"]'
          build_and_load "${JOB_FAIL_IMAGE}"  '["/bin/false"]'
          build_and_load "${JOB_SLEEP_IMAGE}" '["/bin/sleep", "600"]'

      - name: Export kind cluster inputs for the harness
        shell: bash
        run: |
          # The KindClusterFixture consumes these out-of-cluster credentials (mirroring the
          # ControlPlane:Kubernetes:* surface an operator configures for a remote cluster).
          # Extract them with kubectl — the canonical Kubernetes tool — so the harness needs no
          # kubeconfig parser. The kind API server URL must be reachable from the host network.
          api_server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          ca_bundle="${RUNNER_TEMP}/kind-ca.pem"
          kubectl config view --minify --raw \
            -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > "${ca_bundle}"

          # A ServiceAccount token permitted to create/observe/delete Jobs in the default namespace.
          kubectl create clusterrolebinding honua-ci-jobs \
            --clusterrole=cluster-admin \
            --serviceaccount=default:default || true
          token="$(kubectl create token default --duration=3600s)"

          {
            echo "HONUA_TEST_K8S_API_SERVER_URL=${api_server}"
            echo "HONUA_TEST_K8S_CA_BUNDLE_PATH=${ca_bundle}"
            echo "HONUA_TEST_K8S_BEARER_TOKEN=${token}"
            echo "HONUA_TEST_K8S_NAMESPACE=default"
            echo "HONUA_TEST_K8S_JOB_IMAGE=${JOB_IMAGE}"
            echo "HONUA_TEST_K8S_FAIL_IMAGE=${JOB_FAIL_IMAGE}"
            echo "HONUA_TEST_K8S_SLEEP_IMAGE=${JOB_SLEEP_IMAGE}"
          } >> "$GITHUB_ENV"

      - name: Run cloud-integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: false
        run: |
          mkdir -p ./tests/TestResults
          dotnet test ${{ env.CSPROJ }} \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "Category=CloudIntegration" \
            --logger "trx;LogFileName=cloud-integration.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cloud-integration-results
          path: tests/TestResults/
          retention-days: 14

  local-substrate:
    name: Local Substrate (YARP rolling + local process + migration gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    # ADR-0060 substrate-neutral lane (#2166, #2457): proves the single-host, zero-cloud (containers
    # only — no Kubernetes, no cloud) deploy / rolling-upgrade / expand-contract-migration / rollback
    # story on BOTH planes. Serving = YarpRollingDeployBackend + real embedded YARP + real docker
    # replica containers; GP = LocalProcessPoolBatchComputeBackend + real child processes; migration
    # gate = the real PostgresDatabaseMigrationRunner over a Testcontainers Postgres. FREE (no cloud
    # secrets), plain ubuntu runner with Docker. Every test [SkippableFact]-skips when Docker is absent.
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build cloud-integration test binaries
        timeout-minutes: 15
        run: dotnet build ${{ env.CSPROJ }} --no-restore --configuration Release

      - name: Pre-pull local-substrate base images
        shell: bash
        run: |
          # Warm the docker cache for the disposable images the lane builds/runs so provisioning does
          # not pull mid-test:
          #   busybox              -> the two-tag HTTP replica images the serving lane builds and runs.
          #   postgis/postgis:18-3.6 -> the migration-gate Testcontainers database
          #     (LocalSubstratePostgresFixture.Image). This was postgres:17-alpine until #3965 moved
          #     the fixture onto the PostGIS image for the real numbered-migration lane (#3899); the
          #     pre-pull was never updated, so it warmed a cache entry the lane never uses and left the
          #     actual image to pull cold, mid-test.
          docker pull busybox:1.36 || echo "::warning::could not pre-pull busybox"
          docker pull postgis/postgis:18-3.6 || echo "::warning::could not pre-pull postgis/postgis"

      - name: Run local-substrate tests
        id: run-tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: false
          HONUA_TEST_REDIS_URL: localhost:6379
        run: |
          mkdir -p ./tests/TestResults
          dotnet test ${{ env.CSPROJ }} \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "Category=LocalSubstrate" \
            --logger "trx;LogFileName=local-substrate.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      # honua-server#4415/#4414: LocalSubstrateDockerFixture and LocalSubstratePostgresFixture both
      # silently set Available=false on ANY InitializeAsync exception (image-pull failure, full disk,
      # container-start timeout — not just "Docker isn't installed"), and every [SkippableFact] in this
      # lane treats Available=false as a skip. `dotnet test` exits 0 whether every one of the lane's ~40
      # cases ran or every one of them skipped, so a fixture regression on this runner turns the entire
      # migration-gate/rolling-deploy/GP-process-pool lane green without executing anything. Same
      # counts-not-exit-code idiom as ci.yml's Worker GDAL tripwire: parse the TRX, fail on any
      # NotExecuted and on fewer than one Passed.
      - name: Prove the local-substrate lane actually executed
        if: ${{ !cancelled() && steps.run-tests.conclusion != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          trx=./tests/TestResults/local-substrate.trx
          if [[ ! -f "${trx}" ]]; then
            echo "::error::no TRX produced for the Category=LocalSubstrate lane"
            exit 1
          fi
          # `|| true` on each grep is load-bearing under `set -euo pipefail`: grep exits 1 when it
          # matches nothing, and on the healthy path the Failed and NotExecuted counts are zero.
          count_outcome() {
            { grep -o "outcome=\"$1\"" "${trx}" || true; } | wc -l | tr -d '[:space:]'
          }
          passed=$(count_outcome Passed)
          failed=$(count_outcome Failed)
          skipped=$(count_outcome NotExecuted)
          {
            echo '### Local-substrate lane coverage'
            echo
            echo "- Passed: ${passed}"
            echo "- Failed: ${failed}"
            echo "- Skipped: ${skipped}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${skipped}" -gt 0 ]]; then
            echo "::error::${skipped} [SkippableFact] case(s) were skipped — Docker/Postgres was unavailable on this runner (or a fixture regressed), and the entire local-substrate lane silently reported nothing"
            exit 1
          fi
          if [[ "${passed}" -lt 1 ]]; then
            echo "::error::no [SkippableFact] case passed — the Category=LocalSubstrate trait or the cases themselves are gone"
            exit 1
          fi
          echo "OK: ${passed} local-substrate case(s) executed, 0 skipped."

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: local-substrate-results
          path: tests/TestResults/
          retention-days: 14

name: Derived Artifact Normalization

# Untrusted producer. It may execute pull-request code, but can only read the
# repository/packages and upload a bounded data artifact. The default-branch
# consumer validates that artifact without executing anything from this head.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [trunk]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/generate-feature-catalog.sh'
      - 'scripts/generate-geoservices-parity.sh'
      - 'scripts/ci/capability-impact.py'
      - 'scripts/ci/generate-capability-matrix.py'
      - 'scripts/ci/normalization-envelope.py'
      - 'docs/cite-status.md'
      - 'docs/gis/**'
      - '*.sln'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'NuGet.config'
      - '.github/actions/setup-dotnet-ci/**'
      - '.github/workflows/normalize-derived-artifacts.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: normalization-producer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  generate:
    name: Generate bounded normalization projections
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request defaults to refs/pull/<n>/merge. The envelope is
          # explicitly bound to the contributor's immutable head SHA, so the
          # generator must execute that exact tree as well.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Regenerate governed projections
        run: |
          bash scripts/generate-feature-catalog.sh --configuration Release -m:1
          bash scripts/generate-geoservices-parity.sh --configuration Release -m:1 --no-build --no-restore
          python3 scripts/ci/generate-capability-matrix.py

      - name: Replay generators and stage only reproducible bounded projections
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          first_root="${RUNNER_TEMP}/first-normalized-projections"
          projection_root="${RUNNER_TEMP}/normalized-projections"
          projections=(
            'docs/gis/data/feature-catalog.json:4194304'
            'docs/gis/data/geoservices-rest-parity.json:1048576'
            'docs/gis/data/capability-matrix.v1.json:1048576'
          )
          for item in "${projections[@]}"; do
            projection="${item%%:*}"
            install -d "${first_root}/$(dirname "${projection}")"
            install -m 0600 "${projection}" "${first_root}/${projection}"
          done

          # Recompute from the exact committed output baseline with the already
          # built assemblies. Only a byte-identical replay becomes candidate
          # data; a nondeterministic or post-generation mutation fails closed.
          git restore --source="${HEAD_SHA}" --worktree -- \
            docs/gis/data/feature-catalog.json \
            docs/gis/data/geoservices-rest-parity.json \
            docs/gis/data/capability-matrix.v1.json
          bash scripts/generate-feature-catalog.sh --configuration Release -m:1 --no-build --no-restore
          bash scripts/generate-geoservices-parity.sh --configuration Release -m:1 --no-build --no-restore
          python3 scripts/ci/generate-capability-matrix.py

          total=0
          for item in "${projections[@]}"; do
            projection="${item%%:*}"
            limit="${item##*:}"
            size="$(stat -c '%s' "${projection}")"
            if (( size < 1 || size > limit )); then
              echo "${projection} size ${size} is outside bound 1..${limit}" >&2
              exit 1
            fi
            cmp -- "${first_root}/${projection}" "${projection}"
            total=$((total + size))
            install -d "${projection_root}/$(dirname "${projection}")"
            install -m 0600 "${projection}" "${projection_root}/${projection}"
          done
          if (( total > 6291456 )); then
            echo "normalization projections exceed the 6 MiB aggregate bound" >&2
            exit 1
          fi

      - name: Upload bounded projection data
        uses: actions/upload-artifact@v7
        with:
          name: normalization-projections-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/normalized-projections
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  produce:
    name: Produce data-only normalization envelope
    needs: generate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Packaging is deliberately isolated from the runner that executed PR
      # code. setup-dotnet-ci and generators cannot mutate this checkout,
      # environment, or the envelope builder before provenance is recorded.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download bounded projection data
        uses: actions/download-artifact@v8
        with:
          name: normalization-projections-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/normalized-projections

      - name: Build bounded normalization envelope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TREE_SHA="$(git rev-parse "${HEAD_SHA}^{tree}")"
          python3 scripts/ci/normalization-envelope.py build \
            --repo-root . \
            --output-root "${RUNNER_TEMP}/normalized-projections" \
            --repository "${GITHUB_REPOSITORY}" \
            --pull-request "${PR_NUMBER}" \
            --source-sha "${HEAD_SHA}" \
            --source-tree-sha "${TREE_SHA}" \
            --base-sha "${BASE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output "${RUNNER_TEMP}/normalization-envelope.json"

      - name: Upload data-only normalization envelope
        uses: actions/upload-artifact@v7
        with:
          name: normalization-envelope-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/normalization-envelope.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

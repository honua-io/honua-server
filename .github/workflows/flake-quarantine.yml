name: Publish Flaky Test Quarantine

on:
  workflow_run:
    workflows: [CI, PR Gate]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

# Serialize the read/modify/write of the repository-wide twenty-five-test cap.
# Keep completed-run events queued instead of replacing the pending publisher.
concurrency:
  group: publish-flaky-test-quarantine
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJson('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ${{ vars.HONUA_LIGHT_RUNNER && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository) && fromJSON(vars.HONUA_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # workflow_run uses trusted default-branch code. Never check out the
      # originating branch or execute anything from its downloaded artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download test evidence as data
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p quarantine-evidence
          # Shard artifacts carry an `-attempt-<n>` suffix, and an older
          # artifact can outrank a rerun's by id. Keep each shard's newest
          # attempt (older names have none) and fetch it by id under its shard name.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | test("^(server-test-results-|pr-gate-affected-shard-)[a-zA-Z0-9_-]+$")) | (.name | capture("^(?<shard>.+?)(-attempt-(?<attempt>[0-9]+))?$")) as $n | "\($n.attempt // "0") \(.created_at) \(.id) \($n.shard)"' \
            | sort -k1,1nr -k2,2r | awk '!seen[$4]++ { print $2, $3, $4 }' > quarantine-evidence/artifacts.txt
          while read -r _ artifact_id artifact; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "quarantine-evidence/${artifact}.zip"
            python3 -I -m zipfile -e "quarantine-evidence/${artifact}.zip" "quarantine-evidence/${artifact}"
            rm "quarantine-evidence/${artifact}.zip"
          done < quarantine-evidence/artifacts.txt
      - name: Publish verified pass-after-fail evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUARANTINE_EVIDENCE_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 scripts/ci/quarantine-issues.py publish --results quarantine-evidence

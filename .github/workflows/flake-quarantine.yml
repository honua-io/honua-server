name: Publish Flaky Test Quarantine
run-name: Quarantine evidence sweep

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    # Two scheduled sweeps per hour amortize full history discovery. One pending
    # sweep replaces older pending sweeps; manual dispatch also reconciles backlog.
    concurrency:
      group: publish-flaky-test-quarantine
      cancel-in-progress: false
    runs-on: ${{ vars.HONUA_LIGHT_RUNNER && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository) && fromJSON(vars.HONUA_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      # workflow_run uses trusted default-branch code. Never check out the
      # originating branch or execute anything from its downloaded artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Sweep retained evidence and publish verified pass-after-fail cases
        env:
          GH_TOKEN: ${{ github.token }}
          QUARANTINE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/ci/quarantine-sweep.py --checkpoint quarantine-cursor.json
      - name: Commit publication checkpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-quarantine-cursor-${{ github.run_id }}-${{ github.run_attempt }}
          path: quarantine-cursor.json
          if-no-files-found: error
          retention-days: 90

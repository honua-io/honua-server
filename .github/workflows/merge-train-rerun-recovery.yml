name: Merge Train Rerun Recovery

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

# NOT `group: merge-train`. Sharing the train's group looked like mutual
# exclusion but was a recovery shredder: GitHub keeps at most ONE pending run per
# concurrency group, and `merge-train.yml` enters that group every 15 minutes, so
# a queued recovery was evicted before its job ever evaluated (12 of 15
# consecutive recovery runs were `cancelled`). Each recovery now gets its own
# group keyed by the source CI run, so distinct recoveries queue independently
# and none is cancelled by the train's cadence.
#
# WHAT ACTUALLY MAKES OVERLAP SAFE — the Actions concurrency group never did.
# Correctness does not depend on the idle wait below, which is best-effort:
#   * A scheduled/`workflow_run` train is hard-coded TRAIN_APPLY=0
#     (scripts/ci/merge-train/resolve-mode.sh:20-22) and every train mutation
#     routes through `train_side_effect`, which in dry-run logs and returns
#     without executing (lib.sh:268-305). `train_state_write` uses it for both
#     the edit and create paths (state.sh:162-177). A dry-run train therefore
#     writes NOTHING — no state issue, no labels, no push.
#   * The plain (never forced) fast-forward push in `train_land` is the atomic
#     landing boundary (land.sh:184), enforced by the git server. Two actors
#     pushing the SAME batch SHA make the second a no-op; different SHAs make the
#     loser non-fast-forward, which land.sh:186-204 turns into rc=10 and a
#     re-assemble. Double-landing is structurally impossible.
#   * `train_land` re-attests every member's mutable admission immediately before
#     the CAS (land.sh:154-163) and requires trunk to still equal the assembly
#     base (land.sh:165-174), and this workflow's PR closes are gated on
#     `gh pr merge --match-head-commit` (recovery.sh:52-61).
#   * Recovery refuses to act unless the Merge Train State issue still names this
#     exact batch branch, this exact CI run id, and a recoverable phase
#     (`train_recovery_active_state`, recovery.sh), so a train that has moved on
#     fails it closed.
#
# RESIDUAL RISK — stated plainly, because it is more than a lost journal entry.
# The wait closes a window, it does not eliminate one: a live train can still be
# dispatched in the moment between the wait passing and recovery finishing.
# Nothing can double-land or merge an unreviewed head, but the green rerun this
# workflow exists to rescue CAN still be discarded, because a concurrently
# starting train performs its own startup recovery on the same state:
#   * a `ci-incomplete` batch is classified `escalate` (train.sh:380), which
#     labels every member `train:escalated` and clears the batch; or
#   * a land-family phase is taken over by `train_restore_post_land`
#     (land.sh:91-140), which reconciles against trunk and reselects.
# Either outcome loses the rescue and needs an operator to clear the escalation.
# State-issue writes carry the exact prior body observed by this controller;
# state.sh refuses a changed prior, verifies the persisted bytes, and retries
# only against that same prior. An interleaving writer therefore fails this job
# loudly instead of being silently treated as a successful recovery.
#
# Writing a `land` phase before the wait to fence the train out was considered
# and REJECTED: `land` is durable land intent that `train_state_salvage` refuses
# to reset (state.sh:232) and `train_recover_terminal_batch` refuses to clear
# (train.sh:464,470). Recording it for a batch this job has not yet decided to
# land — and might abandon at the wait cap — would trade a rare lost rescue for
# the repo-wide merge deadlock #3045 exists to prevent. Recovery-side land intent
# stays where it is: written only immediately before `train_land`, with immutable
# member heads and a batch SHA (recovery.sh, `train_recovery_write_state`).
# See docs/internal/contributor/merge-coordination-runbook.md.
concurrency:
  group: merge-train-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    name: Recover green batch rerun
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'train/batch/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "Mike McDougall"
          git config --global user.email "mike@honua.io"

      # CHEAP READ-ONLY RELEVANCE CHECK, BEFORE ANY WAITING.
      # This workflow fires on every green `train/batch/*` CI run, and a live
      # drain self-chains, so most invocations are for a batch the train has
      # already moved past. Discovering that only after the idle wait meant a
      # drain produced a string of recoveries that each burned the full wait and
      # then went red. `train_recovery_active_state` is the same guard the
      # recovery itself re-runs, so this cannot admit anything the real path
      # would reject.
      - name: Is this run still the active recoverable batch?
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRAIN_APPLY: 0
        run: |
          set -uo pipefail
          . scripts/ci/merge-train/lib.sh
          . scripts/ci/merge-train/select.sh
          . scripts/ci/merge-train/state.sh
          . scripts/ci/merge-train/recovery.sh
          if train_recovery_active_state \
              "${SOURCE_RUN_ID}" "${SOURCE_HEAD_BRANCH}" "${SOURCE_HEAD_SHA}" >/dev/null; then
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
          else
            echo "relevant=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Run ${SOURCE_RUN_ID} (${SOURCE_HEAD_BRANCH}) is not the active recoverable batch; nothing to recover."
          fi

      # Best-effort contention avoidance, NOT the safety mechanism (see header).
      #
      # Only `workflow_dispatch` runs are waited on. A scheduled train is
      # PROVABLY dry-run — resolve-mode.sh sets apply=1 only when
      # `EVENT_NAME == workflow_dispatch && DISPATCH_APPLY == true` — so it
      # cannot write anything, and waiting behind the 15-minute cadence would be
      # pure delay that could push a legitimate recovery past the cap.
      #
      # On expiry the job fails loudly with the state untouched: an operator sees
      # a red recovery instead of a silently cancelled one and can rerun it.
      - name: Wait out any live merge-train dispatch
        if: steps.precheck.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WAIT_SECONDS: '1800'
          POLL_SECONDS: '20'
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          while :; do
            # Count every non-completed dispatch run, rather than querying one
            # `status=` at a time: GitHub has several pre-terminal statuses
            # (queued, waiting, requested, pending) and enumerating them by name
            # silently misses whichever one is omitted.
            #
            # A failed query is "unknown", not "idle" and not fatal. Under
            # `set -e` an unguarded command substitution would abort the job on a
            # transient 5xx or secondary rate limit and throw the recovery away,
            # which is the failure this workflow was rewritten to stop doing.
            busy="$(gh api \
              "repos/${GH_REPO}/actions/workflows/merge-train.yml/runs?event=workflow_dispatch&per_page=50" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || true)"
            if [[ -z "${busy}" || ! "${busy}" =~ ^[0-9]+$ ]]; then
              echo "Could not read merge-train run state; treating as busy and retrying in ${POLL_SECONDS}s."
            elif [[ "${busy}" -eq 0 ]]; then
              echo "No live merge-train dispatch in flight; proceeding with recovery."
              break
            else
              echo "Live merge-train dispatch in flight (${busy}); re-checking in ${POLL_SECONDS}s."
            fi
            if [[ "$(date +%s)" -ge "${deadline}" ]]; then
              echo "::error::merge-train dispatch state was not provably idle after ${WAIT_SECONDS}s; refusing to recover alongside a live train. Rerun this workflow run once the train is idle."
              exit 1
            fi
            sleep "${POLL_SECONDS}"
          done

      - name: Clear stale escalation from a superseded green batch
        if: steps.precheck.outputs.relevant != 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRAIN_APPLY: 1
        run: |
          set -euo pipefail
          . scripts/ci/merge-train/lib.sh
          . scripts/ci/merge-train/select.sh
          . scripts/ci/merge-train/state.sh
          . scripts/ci/merge-train/recovery.sh
          train_recovery_clear_superseded_escalations \
            "${SOURCE_RUN_ID}" \
            "${SOURCE_HEAD_BRANCH}" \
            "${SOURCE_HEAD_SHA}"

      - name: Recover active immutable batch from green rerun
        if: steps.precheck.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRAIN_APPLY: 1
        run: |
          set -euo pipefail
          . scripts/ci/merge-train/lib.sh
          . scripts/ci/merge-train/select.sh
          . scripts/ci/merge-train/land.sh
          . scripts/ci/merge-train/state.sh
          . scripts/ci/merge-train/recovery.sh
          export TRAIN_STATE_PRIOR_FILE="$(mktemp)"
          trap 'rm -f "${TRAIN_STATE_PRIOR_FILE}"' EXIT
          train_recover_green_batch_rerun \
            "${SOURCE_RUN_ID}" \
            "${SOURCE_HEAD_BRANCH}" \
            "${SOURCE_HEAD_SHA}" \
            "${SOURCE_RUN_URL}"

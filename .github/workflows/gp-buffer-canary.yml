name: GP Candidate Canary
on:
  pull_request:
    paths:
      - 'scripts/qualification/gp_canary*.py'
      - 'scripts/qualification/gp-canary*.sh'
      - 'scripts/qualification/test_gp_canary.py'
      - '.github/workflows/gp-buffer-canary.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gp-geometry-buffer-canary
  cancel-in-progress: false
jobs:
  harness-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.2 Shapely==2.1.2
      - name: Verify numerical mutations and scheduled receipt continuity
        run: python3 -m unittest discover -s scripts/qualification -p 'test_gp_canary.py' -v
  geometry-buffer:
    if: github.event_name != 'pull_request'
    needs: harness-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HONUA_GP_CANARY_URL: ${{ vars.GP_CANARY_URL }}
      HONUA_GP_CANARY_TOKEN: ${{ secrets.GP_CANARY_TOKEN }}
      HONUA_GP_CANARY_RELEASE_REF: ${{ vars.GP_CANARY_RELEASE_REF }}
      HONUA_GP_CANARY_MANIFEST: ${{ github.workspace }}/artifacts/gp-canary/platform-manifest.yaml
      HONUA_GP_CANARY_RECEIPT: ${{ github.workspace }}/artifacts/gp-canary/receipt.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.2 Shapely==2.1.2
      - name: Fetch the frozen release manifest
        run: |
          set -euo pipefail
          mkdir -p artifacts/gp-canary
          [[ "$HONUA_GP_CANARY_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --silent --show-error --proto '=https' --max-time 30 \
            "https://raw.githubusercontent.com/honua-io/honua-release/${HONUA_GP_CANARY_RELEASE_REF}/platform-manifest.yaml" \
            -o "$HONUA_GP_CANARY_MANIFEST"
      - name: Execute both numerical canaries and retain failures
        if: always()
        run: scripts/qualification/gp-canary.sh
      - name: Verify seven actual scheduled intervals and retain their evidence
        if: always()
        env:
          HONUA_GP_CANARY_STREAK_RECEIPT: ${{ github.workspace }}/artifacts/gp-canary/streak.json
        run: scripts/qualification/gp-canary-streak.sh
      - name: Package immutable interval and streak evidence
        if: always()
        run: |
          tar -czf artifacts/gp-canary-bundle.tar.gz -C artifacts/gp-canary .
          sha256sum artifacts/gp-canary-bundle.tar.gz > artifacts/gp-canary-bundle.tar.gz.sha256
      - name: Retain machine-readable canary receipts and immutable bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gp-buffer-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/gp-canary/
          if-no-files-found: error
          retention-days: 90
      - name: Retain content-addressed evidence archive
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gp-canary-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/gp-canary-bundle.tar.gz*
          if-no-files-found: error
          retention-days: 90

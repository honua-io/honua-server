name: OGC GML 3.2 CITE Conformance Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'CITE test profile: applicable is the strict no-skip polygon-document profile; default is raw ETS diagnostics'
        required: false
        default: 'applicable'
        type: choice
        options:
          - applicable
          - default

  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: applicable
      server_image:
        required: false
        type: string
        default: ''
      source_sha:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: cite-gml32-conformance-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  cite:
    uses: ./.github/workflows/cite-conformance-common.yml
    with:
      honua-image: ${{ inputs.server_image || '' }}
      tested-honua-git-sha: ${{ inputs.source_sha || github.sha }}
      suite: gml32
      display-name: GML 3.2
      runner-script: ./scripts/conformance/cite/run-cite-gml32-tests.sh
      results-dir: cite-gml32-results
      summary-file: cite-gml32-summary.md
      cite-profile: ${{ inputs.profile || 'applicable' }}

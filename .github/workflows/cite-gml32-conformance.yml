name: OGC GML 3.2 CITE Conformance Tests

on:
  # Tier: nightly — conformance suites are external and heavyweight.
  # PR/push triggers removed in #485. See docs/ci/gate-model.md.
  schedule:
    # Run weekly to track GML conformance drift (Saturday 06:00 UTC)
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      profile:
        description: 'CITE test profile (GML 3.2 has a single validation pass; all values run the same tests)'
        required: false
        default: 'default'
        type: choice
        options:
          - default

permissions:
  contents: read

concurrency:
  group: cite-gml32-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cite:
    uses: ./.github/workflows/cite-conformance-common.yml
    with:
      suite: gml32
      display-name: GML 3.2
      runner-script: ./scripts/conformance/cite/run-cite-gml32-tests.sh
      results-dir: cite-gml32-results
      summary-file: cite-gml32-summary.md
      cite-profile: ${{ inputs.profile || 'default' }}

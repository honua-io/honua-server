name: Server Test Reuse Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded benchmark profile
        type: choice
        options: [core, observed-full]
        default: core
      prove_failed_rerun:
        description: Deliberately fail one reused consumer on attempt 1
        type: boolean
        default: false

run-name: Server test reuse ${{ inputs.mode || 'core' }} @ ${{ github.sha }} (attempt ${{ github.run_attempt }})

concurrency:
  group: server-test-reuse-benchmark-${{ github.sha }}-${{ inputs.mode || 'core' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: read

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  HONUA_TEST_CONFIGURATION: Release
  HONUA_TEST_DB_URL: 'Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua'

jobs:
  plan:
    name: Reuse benchmark plan
    runs-on: ubuntu-latest
    outputs:
      baseline: ${{ steps.plan.outputs.baseline }}
      producers: ${{ steps.plan.outputs.producers }}
      reused_consumers: ${{ steps.plan.outputs.reused_consumers }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        name: Validate and emit bounded matrices
        env:
          BENCHMARK_MODE: ${{ inputs.mode || 'core' }}
        run: |
          scripts/ci/validate-server-test-reuse-benchmark.sh
          python3 scripts/ci/plan-server-test-reuse-benchmark.py \
            --config .github/server-test-reuse-benchmark.json \
            --shards .github/ci-shards.json \
            --registry .github/server-test-artifact-projects.json \
            --mode "${BENCHMARK_MODE}" \
            --output benchmark-plan.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Upload immutable benchmark plan
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reuse-benchmark-plan-${{ github.run_id }}
          path: benchmark-plan.json
          retention-days: 7
          if-no-files-found: error

  producer:
    name: Reuse payload producer / ${{ matrix.identity }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.producers) }}
    steps:
      - id: job-start
        name: Start producer timer
        run: |
          epoch_ns="$(date +%s%N)"
          echo "epoch_ms=$(( epoch_ns / 1000000 ))" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Authenticate exact package inputs
        run: |
          dotnet nuget update source github-honua \
            --username '${{ github.actor }}' \
            --password '${{ github.token }}' \
            --store-password-in-clear-text
      - id: toolchain
        name: Resolve exact toolchain
        run: echo "sdk=$(dotnet --version)" >> "${GITHUB_OUTPUT}"
      - name: Restore, build, and package repeated project
        run: |
          scripts/ci/benchmark-server-test-transfer.sh producer \
            --project '${{ matrix.project }}' \
            --source-sha '${{ github.sha }}' \
            --payload payload \
            --metrics metrics/producer-${{ matrix.identity }}.json \
            --identity '${{ matrix.identity }}' \
            --job-start-epoch-ms '${{ steps.job-start.outputs.epoch_ms }}'
      - name: Bind payload to exact content-addressed inputs
        run: |
          suffix='${{ matrix.project_suffix }}'
          python3 scripts/ci/server-test-reuse-receipt.py build \
            --repo-root . \
            --source-sha '${{ github.sha }}' \
            --project '${{ matrix.project }}' \
            --dotnet-sdk '${{ steps.toolchain.outputs.sdk }}' \
            --runner-os '${{ runner.os }}' \
            --runner-arch '${{ runner.arch }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --manifest "payload/server-test-binaries-${suffix}.manifest.json" \
            --archive "payload/server-test-binaries-${suffix}.tar.gz" \
            --receipt "payload/server-test-reuse-${suffix}.receipt.json"
      - id: upload-start
        name: Start payload upload timer
        run: |
          epoch_ns="$(date +%s%N)"
          echo "epoch_ms=$(( epoch_ns / 1000000 ))" >> "${GITHUB_OUTPUT}"
      - name: Upload immutable same-run payload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-test-${{ github.sha }}-${{ matrix.project_suffix }}
          path: payload/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Record producer wall and upload timing
        run: |
          epoch_ns="$(date +%s%N)"
          ready_ms=$(( epoch_ns / 1000000 ))
          jq \
            --argjson upload_ms "$(( ready_ms - ${{ steps.upload-start.outputs.epoch_ms }} ))" \
            --argjson ready_ms "${ready_ms}" \
            --argjson job_elapsed_ms "$(( ready_ms - ${{ steps.job-start.outputs.epoch_ms }} ))" \
            '.artifact_upload_ms=$upload_ms | .artifact_ready_epoch_ms=$ready_ms | .job_elapsed_ms=$job_elapsed_ms' \
            metrics/producer-${{ matrix.identity }}.json > metrics/updated.json
          mv metrics/updated.json metrics/producer-${{ matrix.identity }}.json
      - name: Upload producer metrics
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reuse-metrics-producer-${{ matrix.identity }}-attempt-${{ github.run_attempt }}
          path: metrics/
          retention-days: 7

  baseline:
    name: Independent baseline shard / ${{ matrix.identity }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.baseline) }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - id: job-start
        name: Start baseline timer
        run: |
          epoch_ns="$(date +%s%N)"
          echo "epoch_ms=$(( epoch_ns / 1000000 ))" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Authenticate exact package inputs
        run: |
          dotnet nuget update source github-honua \
            --username '${{ github.actor }}' \
            --password '${{ github.token }}' \
            --store-password-in-clear-text
      - name: Restore, build, and run exact selection
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: |
          scripts/ci/benchmark-server-test-transfer.sh baseline \
            --project '${{ matrix.project }}' \
            --source-sha '${{ github.sha }}' \
            --metrics metrics/baseline-${{ matrix.identity }}.json \
            --identity '${{ matrix.identity }}' \
            --filter "${TEST_FILTER}" \
            --job-start-epoch-ms '${{ steps.job-start.outputs.epoch_ms }}'
          epoch_ns="$(date +%s%N)"
          finished_ms=$(( epoch_ns / 1000000 ))
          jq --argjson job_elapsed_ms "$(( finished_ms - ${{ steps.job-start.outputs.epoch_ms }} ))" \
            '.job_elapsed_ms=$job_elapsed_ms' metrics/baseline-${{ matrix.identity }}.json > metrics/updated.json
          mv metrics/updated.json metrics/baseline-${{ matrix.identity }}.json
      - name: Upload baseline metrics and TRX evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reuse-metrics-baseline-${{ matrix.identity }}-attempt-${{ github.run_attempt }}
          path: metrics/
          retention-days: 7

  reused-consumer:
    name: Overlapped reuse shard / ${{ matrix.identity }}
    # Deliberately do not depend on producer: checkout/toolchain setup overlaps
    # compilation, then the bounded poll waits only for the exact artifact.
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.reused_consumers) }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - id: job-start
        name: Start reuse-consumer timer
        run: |
          epoch_ns="$(date +%s%N)"
          echo "epoch_ms=$(( epoch_ns / 1000000 ))" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - id: toolchain
        name: Resolve exact toolchain
        run: echo "sdk=$(dotnet --version)" >> "${GITHUB_OUTPUT}"
      - id: artifact
        name: Wait for and download exact same-run payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/wait-for-run-artifact.sh \
            --run-id '${{ github.run_id }}' \
            --artifact 'server-test-${{ github.sha }}-${{ matrix.project_suffix }}' \
            --destination '${{ runner.temp }}/reuse-payload-${{ matrix.identity }}' \
            --timeout-seconds 1200 \
            --poll-seconds 5
      - name: Verify exact receipt before materialization
        run: |
          suffix='${{ matrix.project_suffix }}'
          payload='${{ runner.temp }}/reuse-payload-${{ matrix.identity }}'
          python3 scripts/ci/server-test-reuse-receipt.py validate \
            --repo-root . \
            --source-sha '${{ github.sha }}' \
            --project '${{ matrix.project }}' \
            --dotnet-sdk '${{ steps.toolchain.outputs.sdk }}' \
            --runner-os '${{ runner.os }}' \
            --runner-arch '${{ runner.arch }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --manifest "${payload}/server-test-binaries-${suffix}.manifest.json" \
            --archive "${payload}/server-test-binaries-${suffix}.tar.gz" \
            --receipt "${payload}/server-test-reuse-${suffix}.receipt.json"
      - name: Materialize and run exact selection without build
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: |
          scripts/ci/benchmark-server-test-transfer.sh consumer-artifact \
            --project '${{ matrix.project }}' \
            --source-sha '${{ github.sha }}' \
            --payload '${{ runner.temp }}/reuse-payload-${{ matrix.identity }}' \
            --metrics metrics/consumer-artifact-${{ matrix.identity }}.json \
            --identity '${{ matrix.identity }}' \
            --filter "${TEST_FILTER}" \
            --job-start-epoch-ms '${{ steps.job-start.outputs.epoch_ms }}'
          epoch_ns="$(date +%s%N)"
          finished_ms=$(( epoch_ns / 1000000 ))
          jq \
            --argjson wait_download_ms '${{ steps.artifact.outputs.wait_download_ms }}' \
            --argjson poll_attempts '${{ steps.artifact.outputs.poll_attempts }}' \
            --argjson job_elapsed_ms "$(( finished_ms - ${{ steps.job-start.outputs.epoch_ms }} ))" \
            '.wait_download_ms=$wait_download_ms | .poll_attempts=$poll_attempts | .job_elapsed_ms=$job_elapsed_ms' \
            metrics/consumer-artifact-${{ matrix.identity }}.json > metrics/updated.json
          mv metrics/updated.json metrics/consumer-artifact-${{ matrix.identity }}.json
      - name: Upload reuse metrics and TRX evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reuse-metrics-consumer-${{ matrix.identity }}-attempt-${{ github.run_attempt }}
          path: metrics/
          retention-days: 7
      - name: Deliberately fail one reused consumer for failed-only rerun proof
        if: >-
          inputs.prove_failed_rerun == true &&
          matrix.identity == 'server-b' &&
          github.run_attempt == 1
        run: |
          echo 'Intentional post-evidence failure; rerun failed jobs only.'
          exit 1

  summary:
    name: Reuse benchmark evidence summary
    needs: [plan, producer, baseline, reused-consumer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download benchmark plan
        uses: actions/download-artifact@v8
        with:
          name: reuse-benchmark-plan-${{ github.run_id }}
          path: evidence/plan/
      - name: Download raw benchmark metrics
        uses: actions/download-artifact@v8
        with:
          pattern: reuse-metrics-*
          path: raw-metrics/
      - name: Capture authoritative hosted job/step timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/raw-jobs
          for attempt in $(seq 1 '${{ github.run_attempt }}'); do
            gh api --paginate --slurp \
              'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/'"${attempt}"'/jobs?per_page=100' \
              > "evidence/raw-jobs/attempt-${attempt}.json"
          done
      - name: Apply predeclared parity, latency, and billed-minute thresholds
        run: |
          python3 scripts/ci/summarize-server-test-reuse-benchmark.py \
            --metrics raw-metrics \
            --plan evidence/plan/benchmark-plan.json \
            --config .github/server-test-reuse-benchmark.json \
            --hosted-jobs evidence/raw-jobs \
            --output evidence/summary.json \
            --markdown evidence/summary.md
          cat evidence/summary.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Preserve raw metrics
        run: cp -a raw-metrics evidence/raw-metrics
      - name: Upload raw and summarized reuse evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-test-reuse-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14

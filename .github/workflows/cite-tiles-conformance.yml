name: OGC API Tiles CITE Conformance Tests

on:
  # Tier: nightly — conformance suites are external and heavyweight.
  # Run on schedule and manual dispatch only. See docs/ci/gate-model.md.
  schedule:
    # Run weekly to catch conformance regressions
    - cron: '0 6 * * 2'
  workflow_dispatch:
    inputs:
      profile:
        description: 'CITE test profile'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - minimal
          - full

permissions:
  contents: read

concurrency:
  group: cite-tiles-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cite:
    uses: ./.github/workflows/cite-conformance-common.yml
    with:
      suite: tiles
      display-name: OGC API Tiles
      runner-script: ./scripts/conformance/cite/run-cite-tiles-tests.sh
      results-dir: cite-tiles-results
      summary-file: cite-tiles-summary.md
      timeout-seconds: 2400
      job-timeout-minutes: 45
      cite-profile: ${{ inputs.profile || 'default' }}
      extra-artifact-paths: docker/cite/ogc-api-tiles/config/

name: WPS 2.0 CITE Conformance Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'WPS 2.0 certification path to evaluate'
        required: true
        default: 'basic-async'
        type: choice
        options:
          - basic-async
          - basic-sync
          - all
# External ETS runs manually and during release-candidate qualification.
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: basic-async
      server_image:
        required: false
        type: string
        default: ''
      source_sha:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: cite-wps20-conformance-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  cite:
    uses: ./.github/workflows/cite-conformance-common.yml
    with:
      honua-image: ${{ inputs.server_image || '' }}
      tested-honua-git-sha: ${{ inputs.source_sha || github.sha }}
      suite: wps20
      display-name: WPS 2.0
      runner-script: ./scripts/conformance/cite/run-cite-wps20-tests.sh
      results-dir: cite-wps20-results
      summary-file: cite-wps20-summary.md
      timeout-seconds: 3600
      job-timeout-minutes: 70
      cite-profile: ${{ inputs.profile || 'basic-async' }}
      extra-artifact-paths: docker/cite/wps20/config/

name: Flaky Test Detection

# Bounded, incremental flake hunt (ADR-0037).
#
# WHY IT IS SHARDED AND ROTATING. The previous shape ran the WHOLE integration
# tier (`--filter "Tier=Integration&Tier!=Slow"` over Honua.Server.Tests) twice
# in ONE 180-minute job. That never had a chance: production CI splits the same
# body of tests across every shard in `.github/ci-shards.json`, whose declared
# inner test budgets already total ~1,600 minutes for a SINGLE pass. Every
# scheduled run was therefore cancelled at its job timeout inside iteration 1
# (13 of the 14 runs before this change), producing no TRX, no report, and no
# flake signal at all — while still burning three hours of runner time a day.
#
# The fix is scope, not a bigger timeout. Each run takes a bounded ROTATING
# WINDOW of shards, runs each shard's own filter `iterations` times under that
# shard's own inner budget via the shared scripts/ci/run-server-test-shard.sh,
# and reports per shard. The window advances daily, so the whole shard set is
# covered every ceil(shards / shard_count) days and every run finishes.
on:
  schedule:
    # Daily rotating flake hunt.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Times to re-run each selected shard (>= 2 to detect inconsistency)'
        required: false
        default: '2'
      shard_count:
        description: 'Shards in this run window'
        required: false
        default: '6'
      shards:
        description: 'Comma-separated shard names to run instead of the rotating window'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  HONUA_TEST_CONFIGURATION: Release

concurrency:
  group: flaky-detection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select flake-hunt window
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      window: ${{ steps.plan.outputs.window }}
      iterations: ${{ steps.plan.outputs.iterations }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        name: Choose this run's shards
        env:
          ITERATIONS: ${{ inputs.iterations || '2' }}
          SHARD_COUNT: ${{ inputs.shard_count || '6' }}
          EXPLICIT_SHARDS: ${{ inputs.shards || '' }}
        run: |
          set -euo pipefail
          iterations="${ITERATIONS}"
          [[ "${iterations}" =~ ^[0-9]+$ && "${iterations}" -ge 2 ]] || iterations=2
          count="${SHARD_COUNT}"
          [[ "${count}" =~ ^[0-9]+$ && "${count}" -ge 1 ]] || count=6

          total="$(jq '.shards | length' .github/ci-shards.json)"
          if [[ "${count}" -gt "${total}" ]]; then count="${total}"; fi
          windows=$(( (total + count - 1) / count ))
          # Days since the epoch: advances by exactly one every scheduled run and
          # does not reset at a year boundary the way day-of-year would.
          index=$(( ( $(date -u +%s) / 86400 ) % windows ))
          offset=$(( index * count ))

          if [[ -n "${EXPLICIT_SHARDS}" ]]; then
            selected="$(jq -c --arg names "${EXPLICIT_SHARDS}" '
              ($names | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $want
              | [ .shards[] | select(.name as $n | $want | index($n)) ]' .github/ci-shards.json)"
            window="explicit: ${EXPLICIT_SHARDS}"
          else
            selected="$(jq -c --argjson offset "${offset}" --argjson count "${count}" \
              '.shards[$offset:($offset + $count)]' .github/ci-shards.json)"
            window="rotation ${index}/${windows} (shards ${offset}..$(( offset + count - 1 )) of ${total})"
          fi

          if [[ "$(jq 'length' <<<"${selected}")" -eq 0 ]]; then
            echo "::error::No shard matched the requested selection." >&2
            exit 1
          fi

          matrix="$(jq -c --argjson iterations "${iterations}" '
            {include: [ .[] | {
              shard_name: .name,
              suffix: .artifact_suffix,
              csproj: (.csproj // "tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj"),
              filter: .filter,
              max_cpu_count: (.max_cpu_count // ""),
              test_timeout_minutes: .test_timeout_minutes,
              # Room for every iteration plus checkout, setup, restore and build.
              # Capped because a GitHub job may not exceed 360 minutes.
              job_timeout_minutes: ([(.test_timeout_minutes * $iterations + 25), 350] | min)
            } ]}' <<<"${selected}")"

          {
            echo "matrix=${matrix}"
            echo "window=${window}"
            echo "iterations=${iterations}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Flake-hunt window"
            echo
            echo "- Window: \`${window}\`"
            echo "- Iterations per shard: \`${iterations}\`"
            echo
            jq -r '.include[] | "- `\(.shard_name)` (budget \(.test_timeout_minutes)m/iteration, job cap \(.job_timeout_minutes)m)"' <<<"${matrix}"
          } >> "${GITHUB_STEP_SUMMARY}"

  flake-hunt:
    name: Flake hunt / ${{ matrix.shard_name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
    steps:
      - uses: actions/checkout@v7

      # Same reclamation the production shards do: the modular test topology
      # pushes some shards past the runner's free-disk limit.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        env:
          SHARD_CSPROJ: ${{ matrix.csproj }}
        run: scripts/ci/dotnet-restore-retry.sh "${SHARD_CSPROJ}"

      - name: Build shard test project
        timeout-minutes: 25
        env:
          SHARD_CSPROJ: ${{ matrix.csproj }}
        run: dotnet build "${SHARD_CSPROJ}" --no-restore --configuration Release

      - name: Re-run shard ${{ needs.plan.outputs.iterations }}x
        env:
          ITERATIONS: ${{ needs.plan.outputs.iterations }}
          SHARD_SUFFIX: ${{ matrix.suffix }}
          HONUA_SERVER_TEST_SHARD_NAME: ${{ matrix.shard_name }}
          HONUA_SERVER_TEST_FILTER: ${{ matrix.filter }}
          HONUA_SERVER_TEST_TIMEOUT_MINUTES: ${{ matrix.test_timeout_minutes }}
          HONUA_SERVER_TEST_MAX_CPU_COUNT: ${{ matrix.max_cpu_count }}
          HONUA_SERVER_TEST_CSPROJ: ${{ matrix.csproj }}
          HONUA_SERVER_TEST_RESULTS_DIR: ./tests/TestResults
          HONUA_SERVER_TEST_CONFIGURATION: Release
        run: |
          set -uo pipefail
          mkdir -p ./tests/TestResults
          for i in $(seq 1 "${ITERATIONS}"); do
            echo "::group::flake-hunt ${SHARD_SUFFIX} iteration ${i}"
            # Continue past failures: a 1-of-2 failure is exactly the signal this
            # workflow exists to capture, and every iteration must produce TRX.
            HONUA_SERVER_TEST_LOG_NAME="flake-${SHARD_SUFFIX}__iter${i}" \
              scripts/ci/run-server-test-shard.sh \
              || echo "iteration ${i} reported failures (expected during a flake hunt)"
            echo "::endgroup::"
          done

      - name: Upload shard flake evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-detection-${{ matrix.suffix }}
          path: |
            tests/TestResults/flake-*.trx
            tests/TestResults/flake-*.log
            tests/TestResults/flake-*.timing.json
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Flake candidate report
    needs: [plan, flake-hunt]
    # Report whatever the window produced, including when some shards failed or
    # timed out — a shard that could not finish is itself a signal. Skipped when
    # planning failed, because there is then nothing to report on.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download shard flake evidence
        uses: actions/download-artifact@v8
        with:
          pattern: flaky-detection-*
          path: flake-evidence
          merge-multiple: false

      - name: Summarize flake candidates
        run: |
          set -euo pipefail
          mkdir -p tests/TestResults
          python3 scripts/ci/summarize-flaky-detection.py \
            --results flake-evidence \
            --output tests/TestResults/flaky-report.json \
            --markdown tests/TestResults/flaky-report.md
          {
            echo "_Window: ${{ needs.plan.outputs.window }}_"
            echo
            cat tests/TestResults/flaky-report.md
          } >> "${GITHUB_STEP_SUMMARY}"

      # Detecting a candidate is the successful outcome, not a failure: this
      # workflow reports, it does not gate.
      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-detection-report
          path: |
            tests/TestResults/flaky-report.json
            tests/TestResults/flaky-report.md
          if-no-files-found: warn
          retention-days: 30

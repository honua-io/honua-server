name: OGC WMS CITE Conformance Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'CITE test profile'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - minimal
          - full

  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: default
      server_image:
        required: false
        type: string
        default: ''
      source_sha:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: cite-wms-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cite:
    uses: ./.github/workflows/cite-conformance-common.yml
    with:
      honua-image: ${{ inputs.server_image || '' }}
      tested-honua-git-sha: ${{ inputs.source_sha || github.sha }}
      suite: wms
      display-name: WMS
      runner-script: ./scripts/conformance/cite/run-cite-wms-tests.sh
      results-dir: cite-wms-results
      summary-file: cite-wms-summary.md
      timeout-seconds: 2400
      job-timeout-minutes: 45
      cite-profile: ${{ inputs.profile || 'default' }}
      extra-artifact-paths: docker/cite/wms13/config/

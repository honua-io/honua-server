name: Real AWS Certification

# Real-AWS certification lane (#2164). UNLIKE the emulated cloud-integration-harness.yml (kind +
# LocalStack), this lane runs the [Trait("Category","RealAwsCertification")] tests against a LIVE
# AWS account to certify the cloud control-plane seams Honua depends on.
#
# It is GATED, BUDGETED, and TEARDOWN-GUARANTEED:
#   * Gated   — runs the live tests ONLY when the maintainer OIDC role variable
#               `vars.REALAWS_CERT_ROLE_ARN` is configured. On forks, PRs, and any repo without
#               that variable the live step is skipped and the lane is an explicit no-op (it never
#               costs money and never fails for lack of credentials). The certify job runs in the
#               `cert` GitHub environment so it matches the honua-iac OIDC role's subject pin
#               (repo:honua-io/honua-server:environment:cert).
#   * Budgeted — each certification cell is tiny and short-lived (a register/deregister smoke, two
#               smallest-tier Batch jobs, one small S3 object, a no-op Lambda alias flip, one
#               same-revision ECS/ALB weighted cutover on a standing smallest-Fargate service) and
#               every resource is torn down; the reaper sweeps any crash-orphaned leftover.
#   * Teardown — every cell tears its state down in a finally block. Two DISTINCT teardown contracts:
#               (1) CREATED resources (the ephemeral per-run Batch job definitions, namespaced
#               honua-certrun-*, and the S3 artifact objects) are tagged honua-cert-run=<runId>; a
#               dedicated always() reaper step then reaps any honua-cert-run-tagged JOB DEFINITION or
#               S3 OBJECT older than the TTL, so crash-orphaned created resources cannot accumulate.
#               (2) IN-PLACE mutations of STANDING resources (the ECS/ALB listener-rule weights and the
#               Lambda alias) are NOT reaped — the reaper does not touch ALB weights, the Lambda alias,
#               or in-flight Batch jobs. Their correctness is each cell's guaranteed baseline-restore in
#               a finally (the ECS/ALB cell also asserts the baseline at start and fails loudly on drift),
#               so the shared substrate always returns to stable=100/canary=0 and the original alias state.
#
# Never runs on pull_request, so it cannot be triggered by forks or untrusted contributors.
#
# STACK-OUTPUT → REPO-VARIABLE → ENV-VAR CONTRACT (honua-iac examples/aws-cert). Every input is
# OPTIONAL and dormant-safe: each certification cell skips cleanly when its inputs are absent, so
# the lane degrades cell-by-cell. Set the repo variables (Settings → Secrets and variables →
# Actions → Variables) from the Terraform outputs to light up each cell:
#   terraform output           repo variable                              env var (fixture reads)
#   ------------------------   ----------------------------------------   ------------------------------------------
#   (OIDC role)                REALAWS_CERT_ROLE_ARN                      (assumed via configure-aws-credentials)
#   region                     REALAWS_CERT_REGION (default us-east-1)    HONUA_REALAWS_CERT_REGION
#   gp_job_queue_arn           REALAWS_CERT_JOB_QUEUE_ARN                 HONUA_REALAWS_CERT_JOB_QUEUE_ARN
#   gp_job_definition_arns.s   REALAWS_CERT_JOBDEF_ARN_S                  HONUA_REALAWS_CERT_JOBDEF_ARN_S
#   gp_job_definition_arns.m   REALAWS_CERT_JOBDEF_ARN_M                  HONUA_REALAWS_CERT_JOBDEF_ARN_M
#   gp_job_definition_arns.l   REALAWS_CERT_JOBDEF_ARN_L                  HONUA_REALAWS_CERT_JOBDEF_ARN_L
#   gp_job_definition_arns.xl  REALAWS_CERT_JOBDEF_ARN_XL                 HONUA_REALAWS_CERT_JOBDEF_ARN_XL
#   gp_job_role_arn            REALAWS_CERT_JOB_ROLE_ARN                  HONUA_REALAWS_CERT_JOB_ROLE_ARN
#   gp_execution_role_arn      REALAWS_CERT_EXECUTION_ROLE_ARN            HONUA_REALAWS_CERT_EXECUTION_ROLE_ARN
#   cert_artifact_bucket       REALAWS_CERT_ARTIFACT_BUCKET               HONUA_REALAWS_CERT_ARTIFACT_BUCKET
#   (cert Lambda function)     REALAWS_CERT_LAMBDA_FUNCTION               HONUA_REALAWS_CERT_LAMBDA_FUNCTION
#   (cert Lambda alias)        REALAWS_CERT_LAMBDA_ALIAS                  HONUA_REALAWS_CERT_LAMBDA_ALIAS
#   (cert ECS cluster)         REALAWS_CERT_ECS_CLUSTER                   HONUA_REALAWS_CERT_ECS_CLUSTER          (ECS/ALB cell)
#   (cert ECS service)         REALAWS_CERT_ECS_SERVICE                   HONUA_REALAWS_CERT_ECS_SERVICE          (ECS/ALB cell)
#   (cert ALB listener)        REALAWS_CERT_ALB_LISTENER_ARN              HONUA_REALAWS_CERT_ALB_LISTENER_ARN     (ECS/ALB cell)
#   (cert canary target group) REALAWS_CERT_CANARY_TARGET_GROUP_ARN       HONUA_REALAWS_CERT_CANARY_TARGET_GROUP_ARN (ECS/ALB cell)
#   (cert stable target group) REALAWS_CERT_STABLE_TARGET_GROUP_ARN       HONUA_REALAWS_CERT_STABLE_TARGET_GROUP_ARN (ECS/ALB cell)
#
# The Batch execution cell submits against the smallest-tier job definition, which the maintainer
# must provision (in the cert stack) as a trivially- and quickly-succeeding container (e.g. busybox
# `true`) — the SubmitJob seam can override env + resources but NOT the container image/command.

on:
  schedule:
    # Weekly; the live lane is intentionally infrequent.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for aws-actions/configure-aws-credentials (no-op when no role is set)
  # Geospatial.Grpc resolves from the authenticated github-honua feed (NuGet.config
  # packageSourceMapping), so restore 403s without this.
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  CSPROJ: tests/dotnet/Honua.CloudIntegration.Tests/Honua.CloudIntegration.Tests.csproj

concurrency:
  # REF-INDEPENDENT group + cancel-in-progress:false so live runs SERIALIZE against the ONE standing
  # cert substrate (listener rule / ECS service / Lambda alias) and are never cancelled mid-teardown.
  # A ref-keyed group would let a scheduled trunk run and a dispatched run mutate the same weights
  # concurrently (lost update); cancel-in-progress:true would kill an in-flight finally/restore and
  # strand the substrate off-baseline. Both are unsafe for a shared live-AWS resource.
  group: real-aws-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Certify (live AWS control-plane)
    runs-on: ubuntu-latest
    # Match the honua-iac OIDC role's subject pin (repo:honua-io/honua-server:environment:cert).
    environment: cert
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      # Always build the lane so a compile regression is caught even when the live run is dormant.
      - name: Build certification test binaries
        timeout-minutes: 25
        run: dotnet build ${{ env.CSPROJ }} --no-restore --configuration Release

      # Live credentials via OIDC, ONLY when a maintainer role is configured. Without it this step
      # is skipped and the lane stays dormant — exactly the fork/no-secret safe path.
      - name: Configure AWS credentials (OIDC)
        id: aws
        if: ${{ vars.REALAWS_CERT_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: ${{ vars.REALAWS_CERT_ROLE_ARN }}
          # Default aligned with the honua-iac examples/aws-cert stack default (us-east-1).
          aws-region: ${{ vars.REALAWS_CERT_REGION || 'us-east-1' }}
          role-session-name: honua-real-aws-certification

      - name: Run real-AWS certification tests
        id: certify
        if: ${{ vars.REALAWS_CERT_ROLE_ARN != '' }}
        env:
          # Master switch the RealAwsCertificationFixture reads; only set when creds are present.
          HONUA_REALAWS_CERT_ENABLED: 'true'
          HONUA_REALAWS_CERT_REGION: ${{ vars.REALAWS_CERT_REGION || 'us-east-1' }}
          # Stack-output inputs (all optional / dormant-safe). Each cell skips when its inputs are absent.
          HONUA_REALAWS_CERT_JOB_QUEUE_ARN: ${{ vars.REALAWS_CERT_JOB_QUEUE_ARN }}
          HONUA_REALAWS_CERT_JOBDEF_ARN_S: ${{ vars.REALAWS_CERT_JOBDEF_ARN_S }}
          HONUA_REALAWS_CERT_JOBDEF_ARN_M: ${{ vars.REALAWS_CERT_JOBDEF_ARN_M }}
          HONUA_REALAWS_CERT_JOBDEF_ARN_L: ${{ vars.REALAWS_CERT_JOBDEF_ARN_L }}
          HONUA_REALAWS_CERT_JOBDEF_ARN_XL: ${{ vars.REALAWS_CERT_JOBDEF_ARN_XL }}
          HONUA_REALAWS_CERT_JOB_ROLE_ARN: ${{ vars.REALAWS_CERT_JOB_ROLE_ARN }}
          HONUA_REALAWS_CERT_EXECUTION_ROLE_ARN: ${{ vars.REALAWS_CERT_EXECUTION_ROLE_ARN }}
          HONUA_REALAWS_CERT_ARTIFACT_BUCKET: ${{ vars.REALAWS_CERT_ARTIFACT_BUCKET }}
          HONUA_REALAWS_CERT_LAMBDA_FUNCTION: ${{ vars.REALAWS_CERT_LAMBDA_FUNCTION }}
          HONUA_REALAWS_CERT_LAMBDA_ALIAS: ${{ vars.REALAWS_CERT_LAMBDA_ALIAS }}
          HONUA_REALAWS_CERT_ECS_CLUSTER: ${{ vars.REALAWS_CERT_ECS_CLUSTER }}
          HONUA_REALAWS_CERT_ECS_SERVICE: ${{ vars.REALAWS_CERT_ECS_SERVICE }}
          HONUA_REALAWS_CERT_ALB_LISTENER_ARN: ${{ vars.REALAWS_CERT_ALB_LISTENER_ARN }}
          HONUA_REALAWS_CERT_CANARY_TARGET_GROUP_ARN: ${{ vars.REALAWS_CERT_CANARY_TARGET_GROUP_ARN }}
          HONUA_REALAWS_CERT_STABLE_TARGET_GROUP_ARN: ${{ vars.REALAWS_CERT_STABLE_TARGET_GROUP_ARN }}
        run: |
          mkdir -p ./tests/TestResults
          # Exclude the reaper here; it runs LAST in its own always() step so it sweeps this run's
          # leftovers (and any prior crash-orphaned resources) without racing the cells.
          dotnet test ${{ env.CSPROJ }} \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "Category=RealAwsCertification&FullyQualifiedName!~Reaper" \
            --logger "trx;LogFileName=real-aws-certification.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      # honua-server#4414 defect 1. `dotnet test` exits 0 whether every cell ran or every cell
      # skipped, and EVERY cell here is designed to skip: AwsEcsAlbRealCertificationTests and
      # AwsEcsAlbRollbackFailureRealCertificationTests both Skip.IfNot(...), and CloudTestAttribute
      # sets Skip rather than failing. So an all-skipped run and an all-passed run were
      # indistinguishable from the workflow's exit status, and nothing parsed the TRX this lane has
      # always produced. Parse it and fail on zero executed, naming the cells that skipped — the
      # 2026-09-04 test-evidence review, item 7: "skipped required cells are non-passing evidence".
      # Skips are reported but tolerated above the floor, because the lane is deliberately
      # cell-by-cell dormant: each cell lights up only when its stack-output variable is set.
      - name: Prove the certification lane actually executed
        if: ${{ !cancelled() && steps.certify.conclusion != 'skipped' }}
        run: |
          python3 scripts/ci/assert-trx-executed.py \
            --label "Real-AWS certification" \
            --trx tests/TestResults/real-aws-certification.trx \
            --min-passed "${{ vars.REALAWS_CERT_MIN_PASSED || 1 }}"

      # honua-server#4414 defect 3. The ECS service under the certification ALB is
      # public.ecr.aws/nginx/nginx:stable-alpine (honua-iac examples/aws-cert), so the weighted-cutover
      # cell has never sent one HTTP request through the data path. Its control-plane assertions are
      # correct and stay; what was missing is any evidence that HONUA serves behind that ALB. Set
      # vars.REALAWS_CERT_ALB_BASE_URL once the cert substrate runs a Honua image and this certifies
      # identity, readiness, a GeoServices response, a row count and an authorization denial through
      # the real data path — and fails loudly, naming the placeholder, if nginx is still there.
      - name: Certify Honua serving through the certification ALB
        id: serving
        if: ${{ vars.REALAWS_CERT_ROLE_ARN != '' && vars.REALAWS_CERT_ALB_BASE_URL != '' }}
        env:
          HONUA_REALAWS_CERT_ALB_BASE_URL: ${{ vars.REALAWS_CERT_ALB_BASE_URL }}
          HONUA_REALAWS_CERT_ALB_ADMIN_API_KEY: ${{ secrets.REALAWS_CERT_ALB_ADMIN_API_KEY }}
          HONUA_REALAWS_CERT_ALB_QUERY_PATH: ${{ vars.REALAWS_CERT_ALB_QUERY_PATH }}
          HONUA_REALAWS_CERT_ALB_EXPECTED_COUNT: ${{ vars.REALAWS_CERT_ALB_EXPECTED_COUNT }}
        run: scripts/cloud/certify-ecs-alb-serving.sh

      # The other half of defect 3: when no Honua service is reachable, say so in the run's own
      # evidence instead of letting a green "Real AWS Certification" run be read as satisfying a
      # cloud-qualification claim (release#129). This never fails the lane — it labels it.
      - name: Record what this run actually certified
        if: ${{ always() && vars.REALAWS_CERT_ROLE_ARN != '' && vars.REALAWS_CERT_ALB_BASE_URL == '' }}
        run: |
          {
            echo '### Scope of this certification run'
            echo
            echo '> [!IMPORTANT]'
            echo '> This run certified **weighted-cutover, convergence and rollback mechanics against a'
            echo '> placeholder service** — NOT Honua serving on ECS. The ECS service behind the'
            echo '> certification ALB is a third-party placeholder image, so no HTTP request reached'
            echo '> Honua: there is no row count, no write round-trip and no authorization denial in'
            echo '> this evidence. Do not record it as an "ECS certification" or as satisfying a cloud'
            echo '> qualification gate. Set `vars.REALAWS_CERT_ALB_BASE_URL` once the cert substrate'
            echo '> runs a Honua image to add the serving certification.'
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::warning::This run certified control-plane mechanics against a placeholder service, not Honua serving on ECS."

      - name: Reap crash-orphaned certification resources
        id: reap
        # always(): run even if a cell above failed, so a broken run still cleans up. Gated on the
        # same OIDC-role variable and enabled flag so it stays dormant on forks / unconfigured repos.
        if: ${{ always() && vars.REALAWS_CERT_ROLE_ARN != '' }}
        env:
          HONUA_REALAWS_CERT_ENABLED: 'true'
          HONUA_REALAWS_CERT_REGION: ${{ vars.REALAWS_CERT_REGION || 'us-east-1' }}
          HONUA_REALAWS_CERT_ARTIFACT_BUCKET: ${{ vars.REALAWS_CERT_ARTIFACT_BUCKET }}
        run: |
          mkdir -p ./tests/TestResults
          dotnet test ${{ env.CSPROJ }} \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "Category=RealAwsCertification&FullyQualifiedName~Reaper" \
            --logger "trx;LogFileName=real-aws-certification-reaper.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      # A reaper that silently skipped leaves crash-orphaned job definitions and S3 objects to
      # accumulate while the run still reports green, so it gets the same counts tripwire.
      - name: Prove the reaper actually executed
        if: ${{ !cancelled() && steps.reap.conclusion != 'skipped' }}
        run: |
          python3 scripts/ci/assert-trx-executed.py \
            --label "Real-AWS certification reaper" \
            --trx tests/TestResults/real-aws-certification-reaper.trx \
            --min-passed 1 \
            --max-skipped 0

      - name: Lane dormant (no OIDC role configured)
        if: ${{ vars.REALAWS_CERT_ROLE_ARN == '' }}
        run: |
          echo "::notice::Real-AWS certification lane is dormant — vars.REALAWS_CERT_ROLE_ARN is not set."
          echo "Configure the honua-iac examples/aws-cert OIDC role and set vars.REALAWS_CERT_ROLE_ARN"
          echo "(and the optional per-cell HONUA_REALAWS_CERT_* stack-output variables documented in the"
          echo "header) to enable live certification. No tests ran; no resources were created."

      - name: Upload results
        if: ${{ always() && vars.REALAWS_CERT_ROLE_ARN != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-aws-certification-results
          path: tests/TestResults/
          retention-days: 14

name: Repository hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence-paths:
    name: Execution evidence paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: python3 scripts/ci/check-evidence-paths.test.py
      - run: python3 scripts/ci/check-evidence-paths.py --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  shared-hygiene:
    uses: honua-io/.github/.github/workflows/repo-hygiene.yml@7e93a67a13dc498cc4e5032f00cd9e93171afb95 # light runner switch
  repo-hygiene:
    name: repo-hygiene / Repository hygiene
    if: ${{ always() }}
    needs: [evidence-paths, shared-hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Require both hygiene checks
        env:
          EVIDENCE_RESULT: ${{ needs.evidence-paths.result }}
          SHARED_RESULT: ${{ needs.shared-hygiene.result }}
        run: test "$EVIDENCE_RESULT" = success && test "$SHARED_RESULT" = success

name: GeoArrow Interop Fixture

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [trunk]
    # The formatter, its fixture test, shared CRS helpers and the package
    # graph decide the fixture bytes. Shared build, model and host inputs run
    # it in the twice-daily full CI (ci.yml `GeoArrow interop fixture`).
    paths:
      - '.github/workflows/geoarrow-interop-fixture.yml'
      - 'Directory.Packages.props'
      - 'NuGet.config'
      - 'global.json'
      - '**/*GeoArrow*'
      - 'src/Honua.Protocols/GeoServices/FeatureServer/Services/GeoParquetQueryFormatter.cs'
      - 'src/Honua.Core/Core/Features/Infrastructure/Crs/GeoParquetProjJsonCatalog.cs'
      - 'src/Honua.Core/Core/Features/Infrastructure/Crs/Resources/geoparquet-crs-projjson.json'
      - 'src/Honua.Protocols/GeoServices/GeoServicesObjectIdFieldResolver.cs'
      - 'tests/dotnet/Honua.Protocols.GeoServices.Tests/Honua.Protocols.GeoServices.Tests.csproj'
  workflow_dispatch:
  # The twice-daily full CI run calls this workflow, so shared inputs that
  # the narrow PR paths no longer admit still execute it on trunk.
  workflow_call:

permissions:
  contents: read
  # Geospatial.Grpc resolves from the authenticated github-honua feed (NuGet.config
  # packageSourceMapping), so restore 403s without this.
  packages: read

concurrency:
  group: geoarrow-interop-fixture-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  HONUA_GEOARROW_FIXTURE_OUTPUT_DIR: ${{ github.workspace }}/artifacts/test-results/geoarrow-interop
  HONUA_GEOARROW_PRODUCER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  produce:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Produce GeoArrow 0.2 fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HONUA_GEOARROW_PRODUCER_COMMIT }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test formatter and produce exact fixture
        env:
          NuGetAudit: false
        run: |
          dotnet test tests/dotnet/Honua.Protocols.GeoServices.Tests/Honua.Protocols.GeoServices.Tests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~GeoArrowQueryFormatterTests' \
            --logger 'console;verbosity=minimal' \
            --results-directory ./artifacts/test-results

      - name: Retain exact fixture, digest, and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: honua-server-geoarrow-02-${{ env.HONUA_GEOARROW_PRODUCER_COMMIT }}
          path: |
            artifacts/test-results/geoarrow-interop/honua-server-geoarrow-02-point.arrow
            artifacts/test-results/geoarrow-interop/honua-server-geoarrow-02-point.arrow.sha256
            artifacts/test-results/geoarrow-interop/honua-server-geoarrow-02-point.arrow.provenance.json
          if-no-files-found: error
          retention-days: 30

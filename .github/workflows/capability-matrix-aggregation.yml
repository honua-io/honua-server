name: Capability Matrix Aggregation

# Phase-A aggregation for the canonical capability layer (issue #2893, epic
# #2892). Joins feature-catalog.json, docs/cite-status.md, the geoservices
# REST parity index, capability-keys.v1.json's crosswalks, and the committed
# client-compat evidence envelopes (interop freshness, #2897) into
# docs/gis/data/capability-matrix.v1.json.
#
# ci.yml intentionally has no per-PR pull_request trigger (to avoid storming
# the merge train's workflow_run event with the heavy full CI matrix -- see
# ci.yml's header comment). This workflow is a single dependency-light Python
# script (no dotnet build, no services:), so it follows the same lightweight
# pattern as openapi-drift.yml: a pull_request drift-check plus a push-to-trunk
# regeneration/publish job, rather than living inside ci.yml.
on:
  pull_request:
    branches:
      - trunk
    paths:
      - 'docs/gis/data/feature-catalog.json'
      - 'docs/cite-status.md'
      - 'docs/gis/data/geoservices-rest-parity.json'
      - 'docs/gis/data/capability-keys.v1.json'
      - 'docs/gis/data/capability-no-surface-allowlist.v1.json'
      - 'docs/gis/data/capability-matrix.v1.json'
      - 'docs/gis/data/operation-capability.v1.json'
      - 'tests/baselines/client-compat/**'
      - 'scripts/ci/generate-capability-matrix.py'
      # generate-capability-matrix.py imports parse_timestamp/is_green/
      # freshness_state from capability-impact.py, so helper changes can
      # change the committed matrix.
      - 'scripts/ci/capability-impact.py'
      - 'scripts/ci/validate-cite-openapi-compliance.py'
      # The operation -> capability join reads the same catalog and every
      # OpenAPI document the drift checker declares, so both move it.
      - 'scripts/ci/generate-operation-capability.py'
      - 'scripts/ci/generate-operation-capability.test.py'
      # WS1: the manifest crosswalk reads the registry source, the keys and the
      # adjudication, so all three move it.
      - 'scripts/ci/generate-capability-manifest-crosswalk.py'
      - 'scripts/ci/generate-capability-manifest-crosswalk.test.py'
      - 'docs/gis/data/capability-manifest-adjudication.v1.json'
      - 'docs/gis/data/capability-manifest-crosswalk.v1.json'
      - 'src/Honua.Core/Features/Capabilities/CapabilityRegistry.cs'
      - 'scripts/ci/openapi-drift-check.py'
      - 'docs/developer/api-specs/**'
      - 'src/Honua.Server/openapi.json'
      - 'src/Honua.Server/ogc-tiles-openapi.json'
      - 'src/Honua.Server/ogc-maps-openapi.json'
      - 'src/Honua.Server/ogc-coverages-openapi.json'
      - 'src/Honua.Server/ogc-processes-openapi.json'
      - '.github/workflows/capability-matrix-aggregation.yml'
  push:
    branches:
      - trunk
    paths:
      - 'docs/gis/data/feature-catalog.json'
      - 'docs/cite-status.md'
      - 'docs/gis/data/geoservices-rest-parity.json'
      - 'docs/gis/data/capability-keys.v1.json'
      - 'docs/gis/data/capability-no-surface-allowlist.v1.json'
      - 'tests/baselines/client-compat/**'
      - 'scripts/ci/generate-capability-matrix.py'
      - 'scripts/ci/capability-impact.py'
      - 'scripts/ci/validate-cite-openapi-compliance.py'
      # The operation -> capability join reads the same catalog and every
      # OpenAPI document the drift checker declares, so both move it.
      - 'scripts/ci/generate-operation-capability.py'
      - 'scripts/ci/generate-operation-capability.test.py'
      # WS1: the manifest crosswalk reads the registry source, the keys and the
      # adjudication, so all three move it.
      - 'scripts/ci/generate-capability-manifest-crosswalk.py'
      - 'scripts/ci/generate-capability-manifest-crosswalk.test.py'
      - 'docs/gis/data/capability-manifest-adjudication.v1.json'
      - 'docs/gis/data/capability-manifest-crosswalk.v1.json'
      - 'src/Honua.Core/Features/Capabilities/CapabilityRegistry.cs'
      - 'scripts/ci/openapi-drift-check.py'
      - 'docs/developer/api-specs/**'
      - 'src/Honua.Server/openapi.json'
      - 'src/Honua.Server/ogc-tiles-openapi.json'
      - 'src/Honua.Server/ogc-maps-openapi.json'
      - 'src/Honua.Server/ogc-coverages-openapi.json'
      - 'src/Honua.Server/ogc-processes-openapi.json'
  schedule:
    # Weekly freshness check: cite-status.md and geoservices-rest-parity.json
    # are hand-refreshed on their own cadence (not every push touches this
    # workflow's paths), so a schedule catches drift between a source doc
    # update and the next matching push/PR.
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-matrix-aggregation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate:
    name: Generate and validate capability-matrix.v1.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Regenerate capability-matrix.v1.json
        run: python3 scripts/ci/generate-capability-matrix.py

      - name: Drift check against the committed artifact
        run: |
          if ! git diff --exit-code -- docs/gis/data/capability-matrix.v1.json; then
            echo "::error::docs/gis/data/capability-matrix.v1.json is stale. Run 'python3 scripts/ci/generate-capability-matrix.py' and commit the result." >&2
            exit 1
          fi
          echo "docs/gis/data/capability-matrix.v1.json is up to date."

      # WS2 of the OKF knowledge-graph program: the OpenAPI operation ->
      # capability correspondence was computed on every run and discarded. It is
      # now an artifact, and stale means the join moved without anyone saying so.
      # Proved before it is trusted, like the doc gates: a join that wrongly
      # reports complete is the failure mode that matters.
      - name: Test the operation-capability join
        run: python3 scripts/ci/generate-operation-capability.test.py

      - name: Test the capability-manifest crosswalk
        run: python3 scripts/ci/generate-capability-manifest-crosswalk.test.py

      - name: Drift check operation-capability.v1.json
        run: python3 scripts/ci/generate-operation-capability.py --check

      # Fails when a manifest id resolves nowhere and nobody adjudicated it,
      # which is the drift WS1 exists to close.
      - name: Drift check capability-manifest-crosswalk.v1.json
        run: python3 scripts/ci/generate-capability-manifest-crosswalk.py --check

      - name: Validate CITE evidence-table joins against OpenAPI metadata
        run: python3 scripts/ci/validate-cite-openapi-compliance.py

      - name: Upload capability-matrix.v1.json artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capability-matrix-${{ github.run_id }}
          path: docs/gis/data/capability-matrix.v1.json
          retention-days: 90


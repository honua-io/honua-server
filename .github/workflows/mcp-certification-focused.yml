name: Focused MCP Certification

# Diagnostic proof only. This workflow never substitutes for full_ci admission
# in nightly-container-build.yml.
on:
  pull_request:
    branches: [trunk]
    paths:
      - 'tests/mcp-certification/**'
      - '.github/workflows/mcp-certification-focused.yml'
  push:
    branches: [trunk]
    paths:
      - 'tests/mcp-certification/**'
      - '.github/workflows/mcp-certification-focused.yml'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'Exact published MCP SDK source SHA to exercise'
        required: true
        default: 'ae6a835b5334a14c380b085d1af57161243ae0d5'

permissions:
  contents: read
  # The canonical setup restores Honua.Sdk.Admin from github-honua.
  packages: read

concurrency:
  group: focused-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspector-browser-controls:
    name: Public Inspector UI cancellation controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: honua-io/geospatial-mcp
          ref: 372d9ad1366a5fa28165e7ebbc7481e6e1ca13c4
          path: .mcp-client
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Install authenticated Inspector and existing locked browser toolchain
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix .mcp-client/certification
          test "$(node -p "require('./.mcp-client/certification/node_modules/@modelcontextprotocol/inspector/package.json').version")" = 2.10.1
          npm ci --ignore-scripts --prefix tests/mcp-certification/browser
          tests/mcp-certification/browser/node_modules/.bin/playwright install --with-deps chromium
          ln -s "${GITHUB_WORKSPACE}/.mcp-client/certification/node_modules" tests/mcp-certification/node_modules
      - name: Execute public UI and independent cessation controls
        env:
          EXPECTED_SERVER_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          HONUA_MCP_OBSERVER_PGHOST: 127.0.0.1
          HONUA_MCP_OBSERVER_PGPORT: '5432'
          HONUA_MCP_OBSERVER_PGUSER: honua
          HONUA_MCP_OBSERVER_PGPASSWORD: honua
          HONUA_MCP_OBSERVER_PGSERVER_APP_NAME: honua-inspector-control
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SERVER_SOURCE}"
          mkdir -p artifacts/inspector-browser-controls
          node --test tests/mcp-certification/inspector-browser-wire.test.mjs | tee artifacts/inspector-browser-controls/wire.tap
          node --test tests/mcp-certification/inspector-browser-cancellation.integration.mjs | tee artifacts/inspector-browser-controls/browser-postgres.tap
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          evidence = {'schema': 'honua.inspector-browser-controls/v1', 'candidateQualified': False,
                      'serverSource': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'canonicalClientSource': '372d9ad1366a5fa28165e7ebbc7481e6e1ca13c4',
                      'inspectorVersion': '2.10.1', 'playwrightVersion': '1.59.1', 'controls': {}}
          for name, floor in [('wire', 12), ('browser-postgres', 2)]:
              text = Path(f'artifacts/inspector-browser-controls/{name}.tap').read_text()
              counts = {key: int(value) for key, value in re.findall(r'^# (tests|pass|fail|skipped|cancelled) (\d+)$', text, re.M)}
              assert counts.get('tests', 0) >= floor and counts.get('pass') == counts['tests'], (name, counts)
              assert all(counts.get(key) == 0 for key in ('fail', 'skipped', 'cancelled')), (name, counts)
              evidence['controls'][name] = counts
          Path('artifacts/inspector-browser-controls/source-and-counts.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: inspector-browser-controls-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/inspector-browser-controls/
          if-no-files-found: error
          retention-days: 30

  request-cancellation-controls:
    name: Installed SDK cancellation harness controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the reviewed canonical-client dependency lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: honua-io/geospatial-mcp
          ref: 372d9ad1366a5fa28165e7ebbc7481e6e1ca13c4
          path: .mcp-client
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Install the exact published official SDK
        working-directory: .mcp-client/certification
        run: |
          test "$(git rev-parse HEAD)" = 372d9ad1366a5fa28165e7ebbc7481e6e1ca13c4
          npm ci --ignore-scripts
          test "$(node -p "require('./node_modules/@modelcontextprotocol/sdk/package.json').version")" = 1.32.1
          test "$(node -p "require('./node_modules/@modelcontextprotocol/inspector/package.json').version")" = 2.10.1
      - name: Exercise the final server-owned control paths
        shell: bash
        env:
          EXPECTED_SERVER_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          HONUA_MCP_OBSERVER_PGHOST: 127.0.0.1
          HONUA_MCP_OBSERVER_PGPORT: '5432'
          HONUA_MCP_OBSERVER_PGUSER: honua
          HONUA_MCP_OBSERVER_PGPASSWORD: honua
          HONUA_MCP_OBSERVER_PGSERVER_APP_NAME: honua-observer-control
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SERVER_SOURCE}"
          ln -s "${GITHUB_WORKSPACE}/.mcp-client/certification/node_modules" tests/mcp-certification/node_modules
          mkdir -p artifacts/mcp-cancellation-controls
          node --test tests/mcp-certification/inspector-addressability.test.mjs | tee artifacts/mcp-cancellation-controls/inspector-addressability.tap
          node --test tests/mcp-certification/test/*.test.mjs | tee artifacts/mcp-cancellation-controls/wire.tap
          node --test tests/mcp-certification/test/postgres-observer.integration.mjs | tee artifacts/mcp-cancellation-controls/postgres.tap
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess
          evidence = {'schema': 'honua.mcp-cancellation-controls/v1', 'candidateQualified': False,
                      'serverSource': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'canonicalClientSource': '372d9ad1366a5fa28165e7ebbc7481e6e1ca13c4', 'sdkVersion': '1.32.1',
                      'inspectorVersion': '2.10.1', 'inspectorAddressability': {'initialPing': 'unsupported-public-cli',
                          'unknownToolWireError': 'locally-refused-not-server-proof'}, 'controls': {}}
          for name, floor in [('wire', 10), ('postgres', 1), ('inspector-addressability', 3)]:
              text = Path(f'artifacts/mcp-cancellation-controls/{name}.tap').read_text()
              counts = {key: int(value) for key, value in re.findall(r'^# (tests|pass|fail|skipped|cancelled) (\d+)$', text, re.M)}
              assert counts.get('tests', 0) >= floor, (name, counts)
              assert counts.get('pass') == counts['tests'], (name, counts)
              assert all(counts.get(key) == 0 for key in ('fail', 'skipped', 'cancelled')), (name, counts)
              evidence['controls'][name] = counts
          Path('artifacts/mcp-cancellation-controls/source-and-counts.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Retain harness controls independently of qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-cancellation-controls-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/mcp-cancellation-controls/
          if-no-files-found: error
          retention-days: 30

  certification:
    if: github.event_name == 'workflow_dispatch'
    name: Focused MCP (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        transport: [rest, grpc-web]
    env:
      HONUA_MCP_CERT_TARGET: standalone
      HONUA_BASE_URL: http://localhost:5000
      HONUA_TRANSPORT: ${{ matrix.transport }}
      HONUA_SERVICE_ID: test_service
      HONUA_MCP_SERVICE_ID: test_service_mcp
      HONUA_LAYER_ID: '0'
      HONUA_MCP_LAYER_ID: '10'
      HONUA_API_KEY: ci-admin-password
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Require immutable source identity
        env:
          SDK_REF: ${{ inputs.sdk_ref }}
        run: |
          [[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'sdk_ref must be an exact SHA' >&2; exit 1; }
          echo "Server source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "SDK source: $SDK_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup the canonical live MCP environment
        id: setup
        uses: ./.github/actions/setup-honua-mcp
        with:
          dotnet-version: '10.0.x'
          node-version: '20'
          python-version: '3.11'
          sdk-ref: ${{ inputs.sdk_ref }}

      - name: Require certification and artifact scripts
        env:
          CERT_AVAILABLE: ${{ steps.setup.outputs.cert-available }}
          ARTIFACT_AVAILABLE: ${{ steps.setup.outputs.cert-artifact-available }}
          SDK_REF: ${{ inputs.sdk_ref }}
        run: |
          [[ "$CERT_AVAILABLE" == true && "$ARTIFACT_AVAILABLE" == true ]] || {
            echo 'Both certification and artifact scripts are required for focused proof' >&2
            exit 1
          }
          [[ "$(git -C honua-sdk-js rev-parse HEAD)" == "$SDK_REF" ]]

      - name: Run actual live transport certification
        run: npm run test:certification
        working-directory: honua-sdk-js/mcp

      - name: Generate certification artifact
        if: always() && steps.setup.outcome == 'success' && steps.setup.outputs.cert-artifact-available == 'true'
        run: npm run test:certification:artifact
        working-directory: honua-sdk-js/mcp

      - name: Verify live certification artifact identity
        if: always() && steps.setup.outcome == 'success' && steps.setup.outputs.cert-artifact-available == 'true'
        run: |
          python3 scripts/certification/verify_mcp_live_certification.py \
            honua-sdk-js/mcp/mcp-certification-results.json \
            --transport "$HONUA_TRANSPORT" --base-url "$HONUA_BASE_URL" \
            --sdk-source "$(git -C honua-sdk-js rev-parse HEAD)"

      - name: Retain live receipts and startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focused-mcp-${{ matrix.transport }}
          path: |
            honua-sdk-js/mcp/mcp-certification-results.json
            honua-sdk-js/mcp/mcp-certification-results.md
            ${{ runner.temp }}/honua-server-setup.log
          if-no-files-found: error
          retention-days: 30

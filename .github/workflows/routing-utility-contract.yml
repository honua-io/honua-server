name: Routing Utility Contract

on:
  pull_request:
    branches: [trunk]
    paths:
      - 'src/Honua.Protocols.GeoServices/GPServer/**'
      - 'src/Honua.Protocols.GeoServices/NAServer/**'
      - 'tests/dotnet/Honua.Protocols.GeoServices.Tests/Source/GPServer/RoutingUtilityServiceTests.cs'
      - '.github/workflows/routing-utility-contract.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: routing-utility-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  routing-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ''
      HONUA_TEST_CONFIGURATION: Release
      HONUA_TEST_DB_URL: 'Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=ci-${{ github.run_id }}-${{ github.run_attempt }}'
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-ci
        with:
          nuget-cache-read-only: 'true'
      - name: Run provider discovery and established GP and routing contracts
        run: |
          dotnet test tests/dotnet/Honua.Protocols.GeoServices.Tests/Honua.Protocols.GeoServices.Tests.csproj \
            --configuration Release -m:1 \
            --filter 'FullyQualifiedName~RoutingUtilityServiceTests|FullyQualifiedName~NetworkAnalysisUtilitiesTaskTests|FullyQualifiedName~NAServerMetadataEndpointTests|FullyQualifiedName~NAServerAnonymousContractTests|FullyQualifiedName~GPServerSoapEndpointsTests|FullyQualifiedName~FindRoutesExecuteTests' \
            --logger 'trx;LogFileName=routing-utility-contract.trx' --results-directory routing-results
      - name: Verify every new source case actually executed and passed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          source = Path('tests/dotnet/Honua.Protocols.GeoServices.Tests/Source/GPServer/RoutingUtilityServiceTests.cs').read_text()
          methods = re.findall(r'public async Task (\w+)\(', source)
          assert methods
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          root = ET.parse('routing-results/routing-utility-contract.trx').getroot()
          counts = root.find('t:ResultSummary/t:Counters', ns).attrib
          assert int(counts['total']) >= len(methods) > 0, counts
          assert counts['total'] == counts['executed'] == counts['passed'], counts
          assert counts['failed'] == counts['notExecuted'] == '0', counts
          definitions = {test.attrib['id']: test.find('t:TestMethod', ns).attrib['name']
                         for test in root.findall('t:TestDefinitions/t:UnitTest', ns)}
          results = root.findall('t:Results/t:UnitTestResult', ns)
          assert len(results) == int(counts['passed']) and all(result.attrib['outcome'] == 'Passed' for result in results)
          for method in methods:
              assert any(definitions[result.attrib['testId']] == method for result in results), method
          print(f"Actual routing contract: {counts['passed']} executed/passed; all {len(methods)} new source methods present, 0 skipped/failed.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-utility-contract-results
          path: routing-results/
          if-no-files-found: error

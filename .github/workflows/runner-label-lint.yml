name: Runner label lint

# Pull-request jobs from forks must resolve to GitHub-hosted runners. This
# check parses the candidate's workflow files and reports when a fork-reachable
# job could resolve runs-on to a self-hosted runner without the fork guard.
# pull_request_target keeps this caller on the base branch's version; the
# shared workflow checks out only the PR's .github/workflows (merge ref, else head), without
# credentials, and reads it as data.
# The lint reads only .github/workflows, so other changes cannot alter its result.
on:
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/**'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner-label-lint:
    uses: honua-io/.github/.github/workflows/runner-label-lint.yml@fe9517f40a39eaea9caee394ba867522d9ef0d7f # runner-label lint

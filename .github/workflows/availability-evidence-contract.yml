name: Availability evidence contract
on:
  pull_request:
    paths:
      - 'scripts/scale/*distributed*availability*'
      - '.github/workflows/availability-evidence-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Recount individual request ledgers and reject invalid comparisons
        run: python -m pytest scripts/scale/test_check_distributed_availability.py -q --junitxml=test-results/availability.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: availability-checker-tests
          path: test-results/availability.xml
          if-no-files-found: error

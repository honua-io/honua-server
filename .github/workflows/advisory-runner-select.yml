name: Advisory heavy runner selection

on:
  workflow_call:
    inputs:
      hosted-runner:
        type: string
        default: ubuntu-latest
    secrets:
      wake-role:
        required: false
    outputs:
      runner:
        value: ${{ jobs.select.outputs.runner }}

permissions:
  contents: read
  id-token: write

jobs:
  select:
    # Hosted, like PR Gate's runner-select: honua-light hosts only have the snap
    # AWS CLI, which snap-confine refuses inside the runner sandbox, so every
    # read failed as "host unreadable" there and all callers stayed hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.select.outputs.runner || toJSON(inputs.hosted-runner) }}
    steps:
      # Read credentials run only with PR base scripts or the default-branch commit.
      # Forks and non-default dispatch refs stay hosted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: trusted-base
        if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && vars.HONUA_HEAVY_RUNNER != ''
        continue-on-error: true
        timeout-minutes: 1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/select-advisory-runner.sh
            scripts/ci/gate-runner-heartbeat.sh
          sparse-checkout-cone-mode: false
      - name: Read build-host health credential
        if: steps.trusted-base.outcome == 'success' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && vars.HONUA_HEAVY_RUNNER != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.wake-role }}
          aws-region: ${{ vars.HONUA_PR_GATE_RUNNER_REGION }}
          mask-aws-account-id: true
          retry-max-attempts: 1
      - name: Select healthy heavy pool or hosted fallback
        id: select
        if: steps.trusted-base.outcome == 'success' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && vars.HONUA_HEAVY_RUNNER != ''
        continue-on-error: true
        timeout-minutes: 1
        env:
          HONUA_HEAVY_RUNNER: ${{ vars.HONUA_HEAVY_RUNNER }}
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
        run: bash scripts/ci/select-advisory-runner.sh

name: Advisory heavy runner selection

on:
  workflow_call:
    inputs:
      hosted-runner:
        type: string
        default: ubuntu-latest
    secrets:
      wake-role:
        required: false
    outputs:
      runner:
        value: ${{ jobs.select.outputs.runner }}

permissions:
  contents: read
  id-token: write

jobs:
  select:
    runs-on: ${{ vars.HONUA_LIGHT_RUNNER && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HONUA_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.select.outputs.runner || toJSON(inputs.hosted-runner) }}
    steps:
      # Only trusted base scripts run with the read credential. Forks stay hosted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.HONUA_HEAVY_RUNNER != ''
        continue-on-error: true
        timeout-minutes: 1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/select-advisory-runner.sh
            scripts/ci/gate-runner-heartbeat.sh
          sparse-checkout-cone-mode: false
      - name: Read build-host health credential
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.HONUA_HEAVY_RUNNER != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.wake-role }}
          aws-region: ${{ vars.HONUA_PR_GATE_RUNNER_REGION }}
          mask-aws-account-id: true
          retry-max-attempts: 1
      - name: Select healthy heavy pool or hosted fallback
        id: select
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.HONUA_HEAVY_RUNNER != ''
        continue-on-error: true
        timeout-minutes: 1
        env:
          HONUA_HEAVY_RUNNER: ${{ vars.HONUA_HEAVY_RUNNER }}
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
        run: bash scripts/ci/select-advisory-runner.sh

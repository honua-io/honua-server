name: Review Event Bridge

# GitHub executes pull_request_review and pull_request_review_comment workflows
# from the PR merge branch. Keep this bridge deliberately inert and read-only.
# Its completion is only a latency hint: a PR can suppress its own bridge, so
# the merge train independently re-reads review evidence at selection/pre-land.
on:
  pull_request_review:
    types: [submitted, dismissed, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event.pull_request.base.ref == 'trunk'
    name: Notify trusted review gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: review-event-bridge-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Shed superseded review event
        id: stale
        uses: actions/github-script@v9
        with:
          script: |
            const shed = async reason => {
              core.notice(`superseded: ${reason}`);
              core.summary.addRaw(`Shed superseded review event: ${reason}`, true);
              await core.summary.write();
              core.setOutput('superseded', 'true');
              // workflow_run consumers cannot read step outputs, and GitHub offers
              // no conclusion filter on the `workflow_run` trigger. A non-success
              // conclusion is the only signal review-gate.yml's job-level `if` can
              // read, so this stays `setFailed` rather than a neutral exit. The
              // bridge is inert and read-only; a red run here withholds a latency
              // hint and nothing else.
              core.setFailed('Superseded review event; trusted notification suppressed.');
            };

            const prNumber = context.payload.pull_request.number;
            const eventHead = context.payload.review?.commit_id ||
              context.payload.comment?.commit_id;
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo, pull_number: prNumber,
            });
            // Shed the closed subject one hop earlier than review-gate.yml does, so
            // a review comment on a merged pull request never creates a trusted run.
            if (pull.state !== 'open') {
              return shed(`PR #${prNumber} is ${pull.state}; the trusted gate has nothing left to attest`);
            }
            if (pull.head.sha !== eventHead) {
              return shed(
                `event subject ${eventHead} is not current head ${pull.head.sha} for PR #${prNumber}`);
            }

      - name: Record review event
        if: steps.stale.outputs.superseded != 'true'
        run: |
          echo "Review event received for PR #${{ github.event.pull_request.number }}."
          echo "The trusted Review Gate may now re-read all evidence from GitHub."

name: Impact Routing Evidence Ledger

# Cohort reset contract: changes to the impact classifiers, native routing
# policy, observer workflows, trusted resolver, or authoritative gate workflow
# start a new semantic generation because they decide what a receipt means and
# which source run is eligible for collection. Legacy serving/worker workflow
# pins remain provenance because their routing declarations are validated by
# the native policy. Keep the 60-sample floor, seven-day green requirement, and
# report-only promotion boundary unchanged.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/impact-routing-evidence-ledger.yml'
      - '.github/workflows/native-image-impact-observe.yml'
      - '.github/impact-routing-*.json'
      - 'scripts/ci/*impact*'
      - 'scripts/ci/trusted-pr-workflow-run*'
  schedule:
    - cron: "47 13 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: impact-routing-evidence-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay seven-day receipt evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify receipt collection and seven-day audit
        run: |
          python3 scripts/ci/collect-impact-routing-runs.test.py
          python3 scripts/ci/audit-impact-routing-evidence.test.py
          node scripts/ci/trusted-pr-workflow-run.test.js

  audit:
    name: Audit trusted impact-routing observations
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Indexing the PR Gate stream's receipts (previously invisible to the
    # reader, see PR_GATE_ARTIFACT) roughly doubles the number of receipt
    # archives this job downloads.
    timeout-minutes: 60
    steps:
      - name: Checkout trusted ledger policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - id: policy
        name: Bind the current impact-routing cohort
        run: |
          mkdir -p evidence
          python3 scripts/ci/audit-impact-routing-evidence.py policy \
            --policy .github/impact-routing-promotion.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Validate impact-routing evidence fixtures
        run: |
          python3 scripts/ci/collect-impact-routing-runs.test.py
          python3 scripts/ci/classify-pr-gate-impact.test.py
          python3 scripts/ci/audit-impact-routing-evidence.test.py

      - id: collect
        name: Collect workflow and artifact catalogs within the token budget
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_CUTOFF: ${{ steps.policy.outputs.receipt_cutoff }}
          PRODUCER_RUN_CUTOFF: ${{ steps.policy.outputs.producer_run_cutoff }}
          IMAGE_RUN_CUTOFF: ${{ steps.policy.outputs.image_run_cutoff }}
          COLLECTION_UPPER: ${{ steps.policy.outputs.collection_upper }}
          MAXIMUM_RUNS: ${{ steps.policy.outputs.maximum_runs_per_query }}
          MAXIMUM_CATALOGS: ${{ steps.policy.outputs.maximum_producer_run_catalogs }}
          REQUEST_LIMIT: ${{ steps.policy.outputs.github_token_request_limit }}
          REQUEST_RESERVE: ${{ steps.policy.outputs.github_token_request_reserve }}
        run: |
          set -euo pipefail
          mkdir -p evidence/runs/{pr-gate,native,serving,worker} \
            evidence/artifacts/{pr-gate,native} evidence/archives
          collector=scripts/ci/collect-impact-routing-runs.py

          # Every GITHUB_TOKEN request this job makes, retries included, is
          # charged to one allowance: policy limit less reserve, clamped to
          # what the (unmetered) /rate_limit reports is left this hour.
          python3 "${collector}" budget --output evidence/request-budget.json \
            --limit "${REQUEST_LIMIT}" --reserve "${REQUEST_RESERVE}"

          collect_runs() {
            python3 "${collector}" runs --budget evidence/request-budget.json \
              --endpoint "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs" \
              --lower "$2" --upper "${COLLECTION_UPPER}" \
              --maximum "${MAXIMUM_RUNS}" --output "$3" "${@:4}"
          }
          collect_runs pr-gate-impact-observe.yml "${PRODUCER_RUN_CUTOFF}" evidence/runs/pr-gate
          collect_runs native-image-impact-observe.yml "${PRODUCER_RUN_CUTOFF}" evidence/runs/native

          # Only a SUCCESSFUL observer run can have uploaded a receipt or a
          # skip marker, so only those need an artifact catalog. Non-success
          # runs stay in the run catalog above so `discover` keeps reporting
          # them as observer-run-<conclusion> exclusions.
          {
            jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' \
              evidence/runs/pr-gate/*.json
            jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' \
              evidence/runs/native/*.json
          } | sort -nu > evidence/producer-run-ids.txt
          producer_count="$(wc -l < evidence/producer-run-ids.txt | tr -d '[:space:]')"
          [[ "${producer_count}" =~ ^[0-9]+$ && "${MAXIMUM_CATALOGS}" =~ ^[1-9][0-9]*$ ]] || exit 1
          if (( producer_count > MAXIMUM_CATALOGS )); then
            printf '::error::%s successful observer runs exceed the %s artifact-catalog budget. Raise maximum_producer_run_catalogs in .github/impact-routing-promotion.json or shorten receipt_retention_days.\n' \
              "${producer_count}" "${MAXIMUM_CATALOGS}" >&2
            exit 1
          fi

          # One request per successful observer would be ~1,740 at the current
          # seven-day volume. Name-filtered repository listings return the same
          # artifact objects 100 per request; only runs that list no current-
          # attempt receipt (skips, losses) fall back to a per-run catalog.
          python3 "${collector}" artifacts --budget evidence/request-budget.json \
            --repository "${GITHUB_REPOSITORY}" --runs evidence/runs/pr-gate \
            --name pr-gate-impact-docs-only-v3 --name pr-gate-impact-full-v3 \
            --output evidence/artifacts/pr-gate
          python3 "${collector}" artifacts --budget evidence/request-budget.json \
            --repository "${GITHUB_REPOSITORY}" --runs evidence/runs/native \
            --name native-image-impact-observation-v3 \
            --output evidence/artifacts/native
          collect_runs serving-image-boundary.yml "${IMAGE_RUN_CUTOFF}" evidence/runs/serving --event pull_request
          collect_runs worker-gdal-image.yml "${IMAGE_RUN_CUTOFF}" evidence/runs/worker --event pull_request

      - id: discover
        name: Select exact current-attempt observation receipts
        continue-on-error: true
        run: |
          python3 scripts/ci/audit-impact-routing-evidence.py discover \
            --policy .github/impact-routing-promotion.json \
            --pr-gate-runs evidence/runs/pr-gate \
            --native-runs evidence/runs/native \
            --pr-gate-artifacts evidence/artifacts/pr-gate \
            --native-artifacts evidence/artifacts/native \
            --receipt-cutoff "${RECEIPT_CUTOFF}" \
            --output evidence/index.json
        env:
          RECEIPT_CUTOFF: ${{ steps.policy.outputs.receipt_cutoff }}

      # Receipt archives are immutable per artifact ID, so each is transferred
      # once and then reused from this default-branch-scoped cache (pull
      # request runs can neither restore nor write it). A cached archive is
      # used only while it matches the catalog's SHA-256 digest; archives that
      # left the retention window are pruned before the cache is saved again.
      - name: Restore verified receipt archives
        if: always() && hashFiles('evidence/index.json') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: evidence/archives
          key: impact-routing-receipts-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: impact-routing-receipts-v1-

      - id: download
        name: Download only indexed receipts missing from the cache
        if: always() && hashFiles('evidence/index.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MAXIMUM_DOWNLOADS: ${{ steps.policy.outputs.maximum_receipt_downloads }}
        run: |
          python3 scripts/ci/collect-impact-routing-runs.py download \
            --budget evidence/request-budget.json \
            --repository "${GITHUB_REPOSITORY}" \
            --index evidence/index.json \
            --archives evidence/archives \
            --catalogs evidence/artifacts/pr-gate \
            --catalogs evidence/artifacts/native \
            --maximum "${MAXIMUM_DOWNLOADS}"

      # Saved even when the download ran out of budget: the verified archives
      # it did fetch are progress the next audit resumes from.
      - name: Retain verified receipt archives for the next audit
        if: always() && hashFiles('evidence/archives/*.zip') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: evidence/archives
          key: impact-routing-receipts-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - id: summarize
        name: Reconcile receipts with authoritative exact-head image outcomes
        if: always() && steps.download.outcome == 'success' && hashFiles('evidence/index.json') != ''
        continue-on-error: true
        run: |
          python3 scripts/ci/audit-impact-routing-evidence.py summarize \
            --policy .github/impact-routing-promotion.json \
            --tombstones .github/impact-routing-tombstones.json \
            --policy-head-sha "${{ github.workflow_sha }}" \
            --index evidence/index.json \
            --archives evidence/archives \
            --serving-runs evidence/runs/serving \
            --worker-runs evidence/runs/worker \
            --repository-root . \
            --output evidence/ledger.json \
            --markdown evidence/ledger.md
          cat evidence/ledger.md >> "${GITHUB_STEP_SUMMARY}"

      # The promotion gate is "green for promotion_green_days consecutive days
      # with receipt loss under budget". No single run can answer that, so the
      # auditor reads its OWN retained ledgers and states the streak. Advisory:
      # a failure to fetch history must never redden the integrity check.
      - id: trend
        name: Report the consecutive-green promotion streak
        if: always() && hashFiles('evidence/ledger.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_LEDGER_RUNS: "20"
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p evidence/history
          cp evidence/ledger.json "evidence/history/${GITHUB_RUN_ID}.json"
          # Reserve the worst case up front: one run listing plus an artifact
          # listing and a download per retained ledger.
          if python3 scripts/ci/collect-impact-routing-runs.py spend \
              --budget evidence/request-budget.json --label trend-history \
              --requests "$((1 + 2 * RETAINED_LEDGER_RUNS))"; then
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/impact-routing-evidence-ledger.yml/runs" \
              -F per_page="${RETAINED_LEDGER_RUNS}" -F page=1 -F status=completed \
              -f branch="${DEFAULT_BRANCH}" \
              --jq '.workflow_runs[].id' > evidence/history-run-ids.txt
          else
            printf '::notice::request budget cannot cover retained-ledger history; the streak reports this run only\n'
            : > evidence/history-run-ids.txt
          fi
          while read -r prior; do
            [[ "${prior}" =~ ^[1-9][0-9]*$ ]] || continue
            if [[ "${prior}" == "${GITHUB_RUN_ID}" ]]; then
              continue
            fi
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prior}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)
                     | select(.name | startswith("impact-routing-evidence-ledger-"))
                     | .id] | first // empty')" || continue
            [[ "${artifact}" =~ ^[1-9][0-9]*$ ]] || continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}/zip" \
              > "${RUNNER_TEMP}/prior.zip" || continue
            python3 - "${RUNNER_TEMP}/prior.zip" "evidence/history/${prior}.json" <<'PY' || continue
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              if "ledger.json" not in archive.namelist():
                  raise SystemExit(1)
              info = archive.getinfo("ledger.json")
              if info.file_size > 32 * 1024 * 1024:
                  raise SystemExit(1)
              with archive.open(info) as handle, open(sys.argv[2], "wb") as out:
                  out.write(handle.read(32 * 1024 * 1024))
          PY
          done < evidence/history-run-ids.txt
          python3 scripts/ci/audit-impact-routing-evidence.py trend \
            --policy .github/impact-routing-promotion.json \
            --ledgers evidence/history \
            --output evidence/trend.json \
            --markdown evidence/trend.md
          cat evidence/trend.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain the report-only ledger
        if: always() && hashFiles('evidence/index.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: impact-routing-evidence-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/index.json
            evidence/ledger.json
            evidence/ledger.md
            evidence/trend.json
            evidence/trend.md
            evidence/request-budget.json
            evidence/runs
            evidence/artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Report GITHUB_TOKEN request spend
        if: always() && hashFiles('evidence/request-budget.json') != ''
        run: |
          python3 scripts/ci/collect-impact-routing-runs.py report \
            --budget evidence/request-budget.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail closed on receipt integrity errors
        if: always()
        env:
          DISCOVER_OUTCOME: ${{ steps.discover.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          SUMMARIZE_OUTCOME: ${{ steps.summarize.outcome }}
        run: |
          [[ "${DISCOVER_OUTCOME}" == success && "${DOWNLOAD_OUTCOME}" == success && "${SUMMARIZE_OUTCOME}" == success ]]

name: GeoParquet Interop Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [trunk]
    # Parquet-named sources and tests, the format dispatch/detection/import
    # entry points, the Python readers and the package graph. Shared build, host and protocol inputs run it
    # in the twice-daily full CI (ci.yml `GeoParquet interop evidence`).
    paths:
      - '.github/workflows/geoparquet-interop.yml'
      - 'scripts/ci/check-geoparquet-interop.py'
      - 'tests/python/unit/test_geoparquet_report_output.py'
      - 'tests/python/feature_server/test_geoparquet_interop.py'
      - 'tests/python/requirements.txt'
      - 'tests/python/pytest.ini'
      - 'tests/python/conftest.py'
      - 'tests/python/shared/**'
      - 'tests/seed/**'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
      - '**/*Parquet*'
      - '**/*geoparquet*'
      - 'tests/dotnet/Honua.Server.Tests/TestData/GeoParquet/**'
      - 'tests/dotnet/Honua.Protocols.GeoServices.UnitTests/Source/FeatureServer/Services/QueryFormatterTests.cs'
      # Format dispatch, PAR1 detection, streaming import and limits wiring.
      - 'src/Honua.Protocols/GeoServices/FeatureServer/Services/QueryFormatters.cs'
      - 'src/Honua.Core/Core/Features/FileImport/Services/FileFormatDetectionService.cs'
      - 'src/Honua.Db/Postgres/Features/FileImport/StreamingFileImportService*'
      - 'src/Honua.Core/Core/Configuration/LimitsOptions.cs'
  workflow_dispatch:
  # The twice-daily full CI run calls this workflow, so shared inputs that
  # the narrow PR paths no longer admit still execute it on trunk.
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: geoparquet-interop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  HONUA_TEST_CONFIGURATION: Release
  HONUA_MSBUILD_NODE_CAP: 4
  PRODUCER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  evidence:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: GeoParquet execution evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCER_COMMIT }}

      - uses: ./.github/actions/setup-dotnet-ci

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/python/requirements.txt

      - name: Verify report output and nonpassing receipts
        run: python3 -m unittest discover -s tests/python/unit -p test_geoparquet_report_output.py -v

      - name: Install native writer and independent readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq libatomic1
          python -m pip install -r tests/python/requirements.txt

      - name: Verify OData values, filters and geometry
        run: |
          dotnet test tests/dotnet/Honua.Protocols.OData.Tests/Honua.Protocols.OData.Tests.csproj \
            --configuration Release --filter 'FullyQualifiedName~ODataParquetFormatTests' \
            --logger 'trx;LogFileName=geoparquet-odata.trx' --results-directory artifacts/test-results

      - name: Verify public import readback and large row groups
        if: ${{ !cancelled() }}
        run: |
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --configuration Release --filter 'FullyQualifiedName~GeoParquetImportTests' \
            --logger 'trx;LogFileName=geoparquet-import.trx' --results-directory artifacts/test-results

      - name: Verify independent schemas
        if: ${{ !cancelled() }}
        run: |
          dotnet test tests/dotnet/Honua.Protocols.GeoServices.Tests/Honua.Protocols.GeoServices.Tests.csproj \
            --configuration Release --filter 'FullyQualifiedName~GeoParquetSdkInteropConformanceTests' \
            --logger 'trx;LogFileName=geoparquet-schema.trx' --results-directory artifacts/test-results

      - name: Verify bounded writer and memory receipt
        if: ${{ !cancelled() }}
        run: |
          dotnet test tests/dotnet/Honua.Protocols.GeoServices.Tests/Honua.Protocols.GeoServices.Tests.csproj \
            --configuration Release --no-build --no-restore \
            --filter 'FullyQualifiedName~FormatAsGeoParquet_MultipleRowGroups|FullyQualifiedName~FormatAsGeoParquet_WideSingleRow|FullyQualifiedName~FormatAsGeoParquet_InputBudget|FullyQualifiedName~FormatAsGeoParquet_FooterExceedsOutputBudget|FullyQualifiedName~FormatAsGeoParquet_ByteBound|FullyQualifiedName~FormatAsGeoParquet_WideGeometryPage' \
            --logger 'trx;LogFileName=geoparquet-writer.trx' --results-directory artifacts/test-results

      - name: Verify isolated query formatter byte budget
        if: ${{ !cancelled() }}
        run: |
          dotnet test tests/dotnet/Honua.Protocols.GeoServices.UnitTests/Honua.Protocols.GeoServices.UnitTests.csproj \
            --configuration Release --filter 'FullyQualifiedName~FormatQueryResultAsync_Parquet_UsesConfiguredByteBudget' \
            --logger 'trx;LogFileName=geoparquet-writer-unit.trx' --results-directory artifacts/test-results

      - name: Verify protocol budget refusal and subsequent encoding
        if: ${{ !cancelled() }}
        run: |
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --configuration Release --no-build --no-restore --filter 'FullyQualifiedName~GeoParquetBudgetEndpointTests' \
            --logger 'trx;LogFileName=geoparquet-budget.trx' --results-directory artifacts/test-results

      - name: Verify live HTTP with GeoPandas and pyarrow
        if: ${{ !cancelled() }}
        working-directory: tests/python
        run: |
          mkdir -p ../../artifacts/test-results
          report="../../artifacts/test-results/geoparquet-interop.xml"
          status=0
          pytest --tb=short -q feature_server/test_geoparquet_interop.py --junitxml="${report}" || status=$?
          python ../../scripts/ci/check-geoparquet-interop.py "${report}" "${status}" "$(git rev-parse HEAD)"

      - name: Require every .NET evidence cell to pass
        if: ${{ !cancelled() }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          counts = {}
          memory = None
          for name, expected in {"odata": 3, "import": 9, "schema": 10, "writer": 7, "writer-unit": 1, "budget": 4}.items():
              report = Path(f"artifacts/test-results/geoparquet-{name}.trx")
              rows = list(ET.parse(report).getroot().iter("{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}UnitTestResult"))
              counts[name] = dict(tests=len(rows), passed=sum(row.get("outcome") == "Passed" for row in rows), expected=expected)
              if name == "writer":
                  match = re.search(r"GeoParquet memory receipt: ([^\r\n]+)", "\n".join("".join(row.itertext()) for row in rows))
                  if match:
                      memory = {key.strip(): int(value.strip()) for key, value in
                                (part.split("=", 1) for part in match.group(1).split(";"))}
          passing = memory is not None and all(row["tests"] >= row["expected"] and row["passed"] == row["tests"] for row in counts.values())
          receipt = json.dumps(dict(commit=os.environ["PRODUCER_COMMIT"], suites=counts, memory=memory, passing=passing), indent=2)
          Path("artifacts/test-results/geoparquet-dotnet.json").write_text(receipt + "\n")
          print(receipt)
          if not passing:
              raise SystemExit("Every required .NET GeoParquet cell must execute and pass")
          PYTHON

      - name: Retain execution receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geoparquet-evidence-${{ env.PRODUCER_COMMIT }}
          path: artifacts/test-results/geoparquet-*
          if-no-files-found: error
          retention-days: 30

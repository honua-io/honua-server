name: CodeQL

on:
  # Tier: weekly deep scan only.
  #
  # PR-time and push-time CodeQL for this repository is provided by GitHub code
  # scanning DEFAULT SETUP (`dynamic/github-code-scanning/codeql`, active since
  # 2026-07-12), enrolled through the org-level "Honua public (advanced CodeQL)"
  # security configuration. That setup analyses actions, csharp, javascript,
  # javascript-typescript, python, and typescript on every PR and trunk push —
  # a strict superset of the C#-only, path-filtered no-build lane this workflow
  # used to add, and it ran ~15 minutes per PR on top of it.
  #
  # What default setup does NOT do is a full instrumented build with the
  # `security-extended` query suite, so that is all this workflow keeps: one
  # weekly deep scan (plus manual dispatch). Do not re-add a `pull_request`
  # trigger here — it re-creates the duplicate C# analysis, not extra coverage.
  # Repository code-security settings are org-enforced and are not changed by
  # this file.
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    # The scheduled manual-build scan remains the upper bound for this job.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL (full scan)
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: manual
          queries: security-extended

      - name: Restore dependencies
        run: dotnet restore Honua.sln

      - name: Build
        run: dotnet build Honua.sln --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

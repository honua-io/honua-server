name: CodeQL

on:
  # Tier: security-path pull requests, trunk, and the weekly full scan.
  # - pull_request: C# no-build extraction on the paths in
  #   .github/codeql/pr-paths.txt (auth, admin endpoints, connections and
  #   secrets, import and object storage, SQL building, operation approval,
  #   the MCP and Studio AI surface, outbound HTTP proxies, sharing, sessions,
  #   exports, workflows). That file
  #   is the only list; scripts/ci/codeql-pr-paths.test.py fails when this
  #   block drifts. Other source changes wait for the trunk push or the weekly
  #   scan, which also covers test code.
  # - push to trunk: the same no-build suite on src/** and the build graph.
  #   Superseded trunk pushes cancel each other.
  # - schedule: a full instrumented build with security-extended queries.
  push:
    branches: [trunk]
    paths:
      - 'src/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'Honua.sln'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [trunk]
    paths:
      - 'src/Honua.Hosting/Features/Authentication/**'
      - 'src/Honua.Server/Features/Infrastructure/Authentication/**'
      - 'src/Honua.Server/Features/Mobile/Auth/**'
      - 'src/Honua.Core/Core/Features/Authorization/**'
      - 'src/Honua.Db/Postgres/Features/Authorization/**'
      - 'src/Honua.Core/Abstractions/Features/Security/**'
      - 'src/Honua.Core/Core/Features/Identity/**'
      - 'src/Honua.Core/Core/Features/Security/**'
      - 'src/Honua.Db/Databricks/Features/Security/**'
      - 'src/Honua.Db/MySql/Features/Security/**'
      - 'src/Honua.Db/Oracle/Features/Security/**'
      - 'src/Honua.Db/Postgres/Features/Identity/**'
      - 'src/Honua.Db/Postgres/Features/Security/**'
      - 'src/Honua.Db/Redshift/Features/Security/**'
      - 'src/Honua.Db/Snowflake/Features/Security/**'
      - 'src/Honua.Db/SqlServer/Features/Security/**'
      - 'src/Honua.Hosting/Features/Security/**'
      - 'src/Honua.Server/Features/Identity/**'
      - 'src/Honua.Server/Features/Infrastructure/Security/**'
      - 'src/Honua.Server/Features/Admin/**'
      - 'src/Honua.Core/Core/Features/Admin/**'
      - 'src/Honua.Db/Postgres/Features/Admin/**'
      - 'src/Honua.Db/MySql/Features/Infrastructure/**'
      - 'src/Honua.Db/Postgres/Features/Infrastructure/**'
      - 'src/Honua.Db/Postgres.Shared/Features/Infrastructure/**'
      - 'src/Honua.Db/SqlServer/Features/Infrastructure/**'
      - 'src/Honua.Core/Core/Features/Import/**'
      - 'src/Honua.Core/Core/Features/FileImport/**'
      - 'src/Honua.Import/**'
      - 'src/Honua.Server/Features/Import/**'
      - 'src/Honua.Server/Features/FileStorage/**'
      - 'src/Honua.Server/Features/Infrastructure/FileStorage/**'
      - 'src/Honua.Hosting/Features/FileStorage/**'
      - 'src/Honua.Io/Features/FileStorage/**'
      - 'src/Honua.Cloud/**'
      - 'src/Honua.Geometry/Features/FileImport/**'
      - 'src/Honua.Db/Postgres/Features/FileImport/**'
      - 'src/Honua.Core/Abstractions/Queries/**'
      - 'src/Honua.Core/Core/Features/Infrastructure/Sql/**'
      - 'src/Honua.Core/Core/Queries/**'
      - 'src/Honua.Db/Databricks/Queries/**'
      - 'src/Honua.Db/DuckDB/Queries/**'
      - 'src/Honua.Db/DuckDB/Features/Infrastructure/**'
      - 'src/Honua.Db/MySql/Queries/**'
      - 'src/Honua.Db/Oracle/Queries/**'
      - 'src/Honua.Db/Postgres/Queries/**'
      - 'src/Honua.Db/Postgres/Features/FeatureStore/**'
      - 'src/Honua.Db/Postgres/Features/Raster/**'
      - 'src/Honua.Db/Redshift/Queries/**'
      - 'src/Honua.Db/Snowflake/Queries/**'
      - 'src/Honua.Db/SqlServer/Queries/**'
      - 'src/Honua.Db/SqlServer/Features/FeatureStore/**'
      - 'src/Honua.Db/MySql/Features/FeatureStore/**'
      - 'src/Honua.Protocols/OData/**'
      - 'src/Honua.Server/Features/Operations/**'
      - 'src/Honua.Server/Features/ControlPlane/**'
      - 'src/Honua.Core/Core/Features/Operations/**'
      - 'src/Honua.Core/Core/Features/ControlPlane/**'
      - 'src/Honua.Ai/Features/Protocols/Mcp/**'
      - 'src/Honua.Ai/Features/StudioAiProxy/**'
      - 'src/Honua.Server/Features/Infrastructure/Http/**'
      - 'src/Honua.Core/Core/Features/Infrastructure/Http/**'
      - 'src/Honua.Server/Features/Protocols/Tiles/PMTilesProxy/**'
      - 'src/Honua.Server/Features/Portal/Sharing/**'
      - 'src/Honua.Protocols/GeoServices/Sharing/**'
      - 'src/Honua.Core/Core/Features/Infrastructure/Session/**'
      - 'src/Honua.Io/Features/Export/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/codeql/**'
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

env:
  DOTNET_VERSION: '11.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-select:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/advisory-runner-select.yml
    permissions:
      contents: read
      id-token: write
    with:
      hosted-runner: ubuntu-latest
    secrets:
      wake-role: ${{ secrets.HONUA_PR_GATE_WAKE_ROLE_ARN }}

  analyze:
    needs: runner-select
    name: Analyze C#
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.runner-select.outputs.runner || '"ubuntu-latest"') || 'ubuntu-latest' }}
    # The scheduled manual-build scan remains the upper bound for this job.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action inspects the host root cgroup, outside the runner's 16 GiB slice.
      - name: Bound self-hosted CodeQL resources
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          {
            echo 'CODEQL_RAM=8192'
            echo 'CODEQL_THREADS=4'
            echo 'DOTNET_PROCESSOR_COUNT=4'
          } >> "$GITHUB_ENV"

      # The scheduled instrumented build needs more disk than the PR no-build lane.
      - name: Free disk space
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && runner.environment == 'github-hosted' }}
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup .NET
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL (pull request and trunk)
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          ram: ${{ env.CODEQL_RAM }}
          threads: ${{ env.CODEQL_THREADS }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none
          dependency-caching: true

      - name: Initialize CodeQL (full scan)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          ram: ${{ env.CODEQL_RAM }}
          threads: ${{ env.CODEQL_THREADS }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: manual
          queries: security-extended

      - name: Restore dependencies
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: dotnet restore Honua.sln

      - name: Build
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: dotnet build Honua.sln --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"

name: Cloud Post-Apply Validation

# Validates an already-deployed Honua environment: the post-deployment probe script plus the
# Category=Cloud cells in Honua.Server.Tests (CloudDeploymentValidationTests), which hold the only
# staged-import row-count assertion in the deploy story
# (`featuresProcessed == 1`, `failedFeatures == 0`).
#
# honua-server#4414 defect 2: this was workflow_call + workflow_dispatch with ZERO callers, so those
# cells had been unreachable since April 2026 — and because every one of them is a [CloudTest] that
# SKIPS when its inputs are absent, nothing ever noticed. Two changes fix that here:
#   * `local_target: true` boots a real Honua.Server + PostGIS on the runner and validates against
#     it, so the workflow has a free, credential-free target it can always reach. That is what
#     `cloud-post-apply-validation-nightly.yml` calls every night.
#   * the run is followed by a counts tripwire, so a run in which every cell skipped fails instead
#     of reporting green.
# `local_target` proves the post-apply CONTRACT against a real server; it is NOT a cloud substrate.
# Validating a real cloud deployment still means passing `base_url` (honua-iac's terraform-manual-
# validation lane is the intended caller for that, once its stale script path is repaired).

on:
  workflow_call:
    inputs:
      base_url:
        description: Public base URL for the deployed Honua environment. Required unless local_target is true.
        required: false
        type: string
      local_target:
        description: Boot a real Honua.Server + PostGIS on the runner and validate against it instead of a deployed environment.
        required: false
        type: boolean
        default: false
      min_passed:
        description: Counts tripwire floor — fail when fewer than this many Category=Cloud cells executed.
        required: false
        type: string
        default: '1'
      expected_environment:
        description: Optional expected environment label returned by deploy preflight.
        required: false
        type: string
      expected_deployment_mode:
        description: Optional expected deployment mode returned by deploy preflight.
        required: false
        type: string
      expected_ready_for_coordinated_deploy:
        description: Optional expected ready-for-coordinated-deploy flag.
        required: false
        type: string
      platform:
        description: Optional platform hint (kubernetes, aws-ecs, aws-lambda, azure-functions, azure-container-apps).
        required: false
        type: string
      deploy_target_id:
        description: Optional deploy target id for live deploy-plan or deploy-operation checks.
        required: false
        type: string
      deploy_current_revision:
        description: Optional current revision for live deploy-plan or deploy-operation checks.
        required: false
        type: string
      deploy_desired_revision:
        description: Optional desired revision for live deploy-plan or deploy-operation checks.
        required: false
        type: string
      execute_deploy_operation:
        description: Execute a real deploy operation through the admin API.
        required: false
        type: boolean
        default: false
      verify_deploy_rollback:
        description: Request rollback after the live deploy operation and restore the desired revision.
        required: false
        type: boolean
        default: false
      deploy_timeout_seconds:
        description: Optional timeout in seconds for live deploy-operation polling.
        required: false
        type: string
      import_table_prefix:
        description: Optional table prefix to enable the live cloud-staged import mutation test.
        required: false
        type: string
      import_timeout_seconds:
        description: Optional timeout in seconds for the live import mutation test.
        required: false
        type: string
      include_scale_tests:
        description: Run existing multi-node scale tests when scale-specific inputs are provided.
        required: false
        type: boolean
        default: false
      scale_test_base_url:
        description: Optional scale-test ingress URL for multi-node validation.
        required: false
        type: string
      scale_test_service_id:
        description: Optional FeatureServer service ID for replica scale tests.
        required: false
        type: string
      scale_test_redis:
        description: Optional Redis connection string for scale validation.
        required: false
        type: string
    secrets:
      admin_api_key:
        description: Admin API key used for control-plane validation.
        required: false
      cloud_validation_admin_api_key:
        description: Optional compatibility alias for the primary admin API key.
        required: false
      scale_test_admin_api_key:
        description: Optional admin API key for multi-node replica scale tests.
        required: false
  workflow_dispatch:
    inputs:
      base_url:
        description: Public base URL for the deployed Honua environment. Required unless local_target is true.
        required: false
        type: string
      local_target:
        description: Boot a real Honua.Server + PostGIS on the runner and validate against it instead of a deployed environment.
        required: false
        type: boolean
        default: false
      min_passed:
        description: Counts tripwire floor — fail when fewer than this many Category=Cloud cells executed.
        required: false
        type: string
        default: '1'
      expected_environment:
        description: Optional expected environment label returned by deploy preflight.
        required: false
        type: string
      expected_deployment_mode:
        description: Optional expected deployment mode returned by deploy preflight.
        required: false
        type: string
      expected_ready_for_coordinated_deploy:
        description: Optional expected ready-for-coordinated-deploy flag.
        required: false
        type: string
      platform:
        description: Optional platform hint (kubernetes, aws-ecs, aws-lambda, azure-functions, azure-container-apps).
        required: false
        type: string
      deploy_target_id:
        description: Optional deploy target id for live deploy-plan or deploy-operation checks.
        required: false
        type: string
      deploy_current_revision:
        description: Optional current revision for live deploy-plan or deploy-operation checks.
        required: false
        type: string
      deploy_desired_revision:
        description: Optional desired revision for live deploy-plan or deploy-operation checks.
        required: false
        type: string
      execute_deploy_operation:
        description: Execute a real deploy operation through the admin API.
        required: false
        type: boolean
        default: false
      verify_deploy_rollback:
        description: Request rollback after the live deploy operation and restore the desired revision.
        required: false
        type: boolean
        default: false
      deploy_timeout_seconds:
        description: Optional timeout in seconds for live deploy-operation polling.
        required: false
        type: string
      import_table_prefix:
        description: Optional table prefix to enable the live cloud-staged import mutation test.
        required: false
        type: string
      import_timeout_seconds:
        description: Optional timeout in seconds for the live import mutation test.
        required: false
        type: string
      include_scale_tests:
        description: Run existing multi-node scale tests when scale-specific inputs are provided.
        required: false
        type: boolean
        default: false
      scale_test_base_url:
        description: Optional scale-test ingress URL for multi-node validation.
        required: false
        type: string
      scale_test_service_id:
        description: Optional FeatureServer service ID for replica scale tests.
        required: false
        type: string
      scale_test_redis:
        description: Optional Redis connection string for scale validation.
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: cloud-post-apply-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deployed-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: '10.0.x'

      - name: Require a validation target
        run: |
          if [ -z "${{ inputs.base_url }}" ] && [ "${{ inputs.local_target }}" != "true" ]; then
            echo "::error::Pass base_url for a deployed environment, or local_target: true to boot one on the runner."
            exit 1
          fi

      # Build only what the local target needs; the deployed-environment path skips this entirely.
      - name: Build Honua.Server for the local target
        if: ${{ inputs.local_target }}
        timeout-minutes: 25
        run: |
          dotnet restore src/Honua.Server/Honua.Server.csproj
          dotnet build src/Honua.Server/Honua.Server.csproj --no-restore --configuration Release

      - name: Boot the local post-apply target
        id: local-target
        if: ${{ inputs.local_target }}
        run: scripts/cloud/start-local-post-apply-target.sh

      - name: Run cloud post-apply validation
        id: validate
        env:
          # start-local-post-apply-target.sh exports HONUA_CLOUD_TEST_* into $GITHUB_ENV, so the
          # local-target path already has a base URL, an admin key and publish-DB credentials here.
          # An explicit base_url input always wins.
          HONUA_CLOUD_TEST_BASE_URL: ${{ inputs.base_url || env.HONUA_CLOUD_TEST_BASE_URL }}
          HONUA_CLOUD_TEST_ADMIN_API_KEY: ${{ secrets.admin_api_key || secrets.cloud_validation_admin_api_key || env.HONUA_CLOUD_TEST_ADMIN_API_KEY }}
          HONUA_CLOUD_TEST_EXPECTED_ENVIRONMENT: ${{ inputs.expected_environment }}
          HONUA_CLOUD_TEST_EXPECTED_DEPLOYMENT_MODE: ${{ inputs.expected_deployment_mode }}
          HONUA_CLOUD_TEST_EXPECT_READY_FOR_COORDINATED_DEPLOY: ${{ inputs.expected_ready_for_coordinated_deploy }}
          HONUA_CLOUD_TEST_PLATFORM: ${{ inputs.platform }}
          HONUA_CLOUD_TEST_DEPLOY_TARGET_ID: ${{ inputs.deploy_target_id }}
          HONUA_CLOUD_TEST_DEPLOY_CURRENT_REVISION: ${{ inputs.deploy_current_revision }}
          HONUA_CLOUD_TEST_DEPLOY_DESIRED_REVISION: ${{ inputs.deploy_desired_revision }}
          HONUA_CLOUD_TEST_EXECUTE_DEPLOY_OPERATION: ${{ inputs.execute_deploy_operation }}
          HONUA_CLOUD_TEST_VERIFY_DEPLOY_ROLLBACK: ${{ inputs.verify_deploy_rollback }}
          HONUA_CLOUD_TEST_DEPLOY_TIMEOUT_SECONDS: ${{ inputs.deploy_timeout_seconds }}
          HONUA_CLOUD_TEST_IMPORT_TABLE_PREFIX: ${{ inputs.import_table_prefix }}
          HONUA_CLOUD_TEST_IMPORT_TIMEOUT_SECONDS: ${{ inputs.import_timeout_seconds }}
          INCLUDE_SCALE_TESTS: ${{ inputs.include_scale_tests }}
          HONUA_SCALE_TEST_BASE_URL: ${{ inputs.scale_test_base_url }}
          HONUA_SCALE_TEST_ADMIN_API_KEY: ${{ secrets.scale_test_admin_api_key || secrets.admin_api_key || secrets.cloud_validation_admin_api_key || '' }}
          HONUA_SCALE_TEST_SERVICE_ID: ${{ inputs.scale_test_service_id }}
          HONUA_SCALE_TEST_REDIS: ${{ inputs.scale_test_redis }}
        run: |
          chmod +x scripts/cloud/run-cloud-post-apply-validation.sh
          ./scripts/cloud/run-cloud-post-apply-validation.sh

      # honua-server#4414 defect 1. Every Category=Cloud cell is a [CloudTest] whose Skip is set
      # when its inputs are missing, and `dotnet test` exits 0 on an all-skipped run. Without this,
      # a validation run that proved nothing — including the staged-import row count — reported
      # exactly like one that proved everything.
      - name: Prove the post-apply validation actually executed
        if: ${{ !cancelled() && steps.validate.conclusion != 'skipped' }}
        run: |
          python3 scripts/ci/assert-trx-executed.py \
            --label "Cloud post-apply validation" \
            --trx tests/TestResults/cloud-post-apply-validation.trx \
            --min-passed "${{ inputs.min_passed || '1' }}"

      - name: Upload post-apply validation results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cloud-post-apply-validation-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/TestResults/
          retention-days: 14
          if-no-files-found: warn

      - name: Stop the local post-apply target
        if: ${{ always() && inputs.local_target }}
        run: |
          pid_file="${RUNNER_TEMP:-/tmp}/honua-post-apply-server.pid"
          container_file="${RUNNER_TEMP:-/tmp}/honua-post-apply-db.container"
          if [ -f "$pid_file" ]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi
          if [ -f "$container_file" ]; then
            docker rm --force "$(cat "$container_file")" >/dev/null 2>&1 || true
          fi
          echo "----- local post-apply target server log -----"
          sed -n '1,200p' "${RUNNER_TEMP:-/tmp}/honua-post-apply-server.log" 2>/dev/null || true

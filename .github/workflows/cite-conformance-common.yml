# Reusable workflow for single-suite OGC CITE conformance runs.
#
# The CITE suites all shared
# the same ~100-line skeleton — this workflow consolidates them so each dispatcher
# file only has to declare its schedule, display name, and a handful of suite-
# specific paths. WFS 2.0 still keeps a standalone workflow because it has a
# profile matrix, extra Team Engine setup, and custom check-summary publishing.

name: CITE Conformance (reusable)

on:
  workflow_call:
    inputs:
      suite:
        description: 'Short suite id used for cache scope and artifact naming (e.g. "kml22")'
        required: true
        type: string
      display-name:
        description: 'Human-friendly suite label for log + error messages (e.g. "KML 2.2")'
        required: true
        type: string
      runner-script:
        description: 'Path to the suite runner script, relative to repo root'
        required: true
        type: string
      results-dir:
        description: 'Directory where the runner writes results (relative to repo root)'
        required: true
        type: string
      summary-file:
        description: 'Path to the suite summary markdown inside results-dir'
        required: true
        type: string
      timeout-seconds:
        description: 'Timeout to pass to the runner script'
        required: false
        type: number
        default: 1800
      job-timeout-minutes:
        description: 'GitHub Actions job timeout'
        required: false
        type: number
        default: 30
      cite-profile:
        description: 'CITE_PROFILE value passed to the runner script'
        required: false
        type: string
        default: 'default'
      extra-artifact-paths:
        description: 'Additional newline-separated paths to include in the results artifact'
        required: false
        type: string
        default: ''
      validation-command:
        description: 'Optional shell command to run after the suite completes and before result parsing'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  cite:
    name: ${{ inputs.display-name }} CITE
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Honua Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: honua-server:latest
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=cite-${{ inputs.suite }}
          cache-to: type=gha,mode=max,scope=cite-${{ inputs.suite }}
          # buildx defaults to attaching provenance/SBOM attestations, which
          # produce an OCI image index (manifest list). The docker exporter
          # used by `load: true` cannot export a manifest list, so the build
          # fails with "docker exporter does not currently support exporting
          # manifest lists". Disable inline attestations to keep a single-image
          # output that loads into the local daemon for the CITE run. The SPDX
          # SBOM is still captured by the anchore/sbom-action step below.
          provenance: false
          sbom: false

      # Archive an SPDX SBOM for the CITE-tested image so conformance evidence
      # bundles record the exact bill of materials behind each pass/fail.
      - name: Generate SBOM (SPDX JSON) for honua-server:latest
        uses: anchore/sbom-action@v0
        with:
          image: honua-server:latest
          format: spdx-json
          output-file: sbom-honua-server-cite-${{ inputs.suite }}.spdx.json
          artifact-name: sbom-honua-server-cite-${{ inputs.suite }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Run ${{ inputs.display-name }} CITE conformance tests
        id: run-suite
        env:
          CITE_PROFILE: ${{ inputs.cite-profile }}
          HONUA_CITE_SKIP_BUILD: 'true'
        run: |
          set +e
          timeout ${{ inputs.timeout-seconds }} ${{ inputs.runner-script }} \
            --profile "$CITE_PROFILE" --verbose
          cite_exit_code=$?
          set -e

          echo "exit_code=$cite_exit_code" >> "$GITHUB_OUTPUT"

          if [[ $cite_exit_code -eq 124 ]]; then
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
            echo "CITE tests timed out after ${{ inputs.timeout-seconds }} seconds"
          else
            echo "timed_out=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ $cite_exit_code -ne 0 ]]; then
            echo "CITE tests finished with exit code: $cite_exit_code"
          fi

      - name: Run suite validation command
        if: always() && inputs.validation-command != ''
        run: ${{ inputs.validation-command }}

      - name: Parse CITE results
        id: parse-results
        if: always()
        run: |
          summary="${{ inputs.results-dir }}/${{ inputs.summary-file }}"
          TOTAL_TESTS=0
          PASSED_TESTS=0
          FAILED_TESTS=0
          SKIPPED_TESTS=0
          CANTTELL_TESTS=0
          SUCCESS_RATE=0

          extract_summary_count() {
            label="$1"
            awk -F: -v label="$label" '
              index($0, "**" label "**") {
                gsub(/[^0-9]/, "", $2)
                print $2
                exit
              }
            ' "$summary"
          }

          if [ -f "$summary" ]; then
            TOTAL_TESTS=$(extract_summary_count "Total Tests")
            PASSED_TESTS=$(extract_summary_count "Passed")
            FAILED_TESTS=$(extract_summary_count "Failed")
            SKIPPED_TESTS=$(extract_summary_count "Skipped")
            CANTTELL_TESTS=$(extract_summary_count "CantTell")
            SUCCESS_RATE=$(extract_summary_count "Success Rate")
            echo "results_available=true" >> $GITHUB_OUTPUT
          else
            echo "results_available=false" >> $GITHUB_OUTPUT
          fi

          echo "total_tests=${TOTAL_TESTS:-0}" >> $GITHUB_OUTPUT
          echo "passed_tests=${PASSED_TESTS:-0}" >> $GITHUB_OUTPUT
          echo "failed_tests=${FAILED_TESTS:-0}" >> $GITHUB_OUTPUT
          echo "skipped_tests=${SKIPPED_TESTS:-0}" >> $GITHUB_OUTPUT
          echo "canttell_tests=${CANTTELL_TESTS:-0}" >> $GITHUB_OUTPUT
          echo "success_rate=${SUCCESS_RATE:-0}" >> $GITHUB_OUTPUT

      - name: Upload CITE test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cite-${{ inputs.suite }}-conformance-results-${{ github.run_number }}
          # Primary results dir plus any runner-specific extras (e.g. config dump).
          path: |
            ${{ inputs.results-dir }}/
            ${{ inputs.extra-artifact-paths }}
          retention-days: 30

      - name: Fail on conformance issues
        if: |
          steps.run-suite.outputs.timed_out == 'true' ||
          steps.run-suite.outputs.exit_code != '0' ||
          steps.parse-results.outputs.results_available != 'true' ||
          steps.parse-results.outputs.total_tests == '0' ||
          steps.parse-results.outputs.failed_tests != '0' ||
          steps.parse-results.outputs.skipped_tests != '0' ||
          steps.parse-results.outputs.canttell_tests != '0'
        run: |
          if [[ "${{ steps.parse-results.outputs.results_available }}" != "true" ]]; then
            echo "${{ inputs.display-name }} CITE conformance results were not produced"
            exit 1
          fi

          if [[ "${{ steps.run-suite.outputs.timed_out }}" == "true" ]]; then
            echo "${{ inputs.display-name }} CITE conformance tests timed out"
          elif [[ "${{ steps.run-suite.outputs.exit_code }}" != "0" ]]; then
            echo "${{ inputs.display-name }} CITE runner exited with status ${{ steps.run-suite.outputs.exit_code }}"
          else
            echo "${{ inputs.display-name }} CITE conformance tests failed"
          fi

          echo "Total tests: ${{ steps.parse-results.outputs.total_tests }}"
          echo "Failed tests: ${{ steps.parse-results.outputs.failed_tests }}"
          echo "Skipped tests: ${{ steps.parse-results.outputs.skipped_tests }}"
          echo "CantTell tests: ${{ steps.parse-results.outputs.canttell_tests }}"
          echo "Review the test results and fix conformance issues"
          exit 1

name: Heavy Runner Shutdown Retry

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: heavy-shutdown-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry interrupted full-CI jobs once
    if: >-
      github.repository == 'honua-io/honua-server' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'trunk' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/trunk
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { retryShutdown } = require('./scripts/ci/heavy-shutdown-retry');
            await retryShutdown({ github, context, core });

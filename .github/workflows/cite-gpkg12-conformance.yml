name: OGC GeoPackage 1.2 CITE Conformance Tests

on:
  # Tier: nightly — conformance suites are external and heavyweight.
  # PR/push triggers removed in #485. See docs/ci/gate-model.md.
  schedule:
    # Run weekly to track GeoPackage conformance drift (Saturday 03:00 UTC)
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      profile:
        description: 'CITE test profile (GeoPackage 1.2 has a single validation pass; all values run the same tests)'
        required: false
        default: 'default'
        type: choice
        options:
          - default

permissions:
  contents: read

concurrency:
  group: cite-gpkg12-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cite:
    uses: ./.github/workflows/cite-conformance-common.yml
    with:
      suite: gpkg12
      display-name: GeoPackage 1.2
      runner-script: ./scripts/run-cite-gpkg12-tests.sh
      results-dir: cite-gpkg12-results
      summary-file: cite-gpkg12-summary.md
      cite-profile: ${{ inputs.profile || 'default' }}

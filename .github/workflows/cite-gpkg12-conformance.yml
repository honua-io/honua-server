name: OGC GeoPackage 1.2 CITE Conformance Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'CITE test profile: applicable is the strict core/features profile; default is raw ETS diagnostics'
        required: false
        default: 'applicable'
        type: choice
        options:
          - applicable
          - default

  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: applicable
      server_image:
        required: false
        type: string
        default: ''
      source_sha:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: cite-gpkg12-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cite:
    uses: ./.github/workflows/cite-conformance-common.yml
    with:
      honua-image: ${{ inputs.server_image || '' }}
      tested-honua-git-sha: ${{ inputs.source_sha || github.sha }}
      suite: gpkg12
      display-name: GeoPackage 1.2
      runner-script: ./scripts/conformance/cite/run-cite-gpkg12-tests.sh
      results-dir: cite-gpkg12-results
      summary-file: cite-gpkg12-summary.md
      cite-profile: ${{ inputs.profile || 'applicable' }}

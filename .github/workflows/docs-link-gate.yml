name: Docs Link Gate

# Grades documentation links the way a reader and an agent actually follow them:
# the target file AND the `#fragment` must resolve. The previous state of the art
# here was "the file exists", under which a renamed heading stayed green forever —
# which is how `docs/guides/deploy/examples/prometheus-alerts.yml` shipped 19
# `runbook_url` annotations pointing at `docs.honua.io/operations/runbook#...`, a
# page this repository has never had.
#
# It also gates `scripts/ci/code-referenced-anchors.v1.json`: the absolute
# docs.honua.io URLs that product code and shipped config hand to an operator or
# an agent at runtime. #3583 turned two of those into wire contracts
# (`remediationRef` on a typed capability refusal), so a moved heading stops being
# a docs nit and becomes a broken API response an agent is told to follow. Both are
# registered and enforced. An entry may carry `pendingPr: <n>` while the heading it
# names exists only on an open branch — a warning until that branch lands, then a
# hard error until the marker is deleted, so the escape hatch cannot be forgotten.
#
# ROUTING. Path-filtered rather than folded into `PR Gate`: `pr-gate.yml` carries
# an explicit "do not add a paths filter" contract because it is the required
# verification context, and this check has nothing to say about a change that
# touches no documentation. It is also not a step in `ci.yml` — that workflow has
# no `pull_request` trigger (schedule / merge_group / workflow_dispatch only), so
# a step there would never grade a pull request. `scripts/ci/**` is deliberately
# NOT a trigger beyond this checker's own files and data manifests: a shared-infrastructure edit
# already escalates `pre-pr-check.sh` to a full run, and widening the trigger to
# the whole directory would fire this lane on every CI script change for nothing.
on:
  pull_request:
    branches: [trunk]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'src/**'
      - 'docker/**'
      - 'observability/**'
      - 'eng/**'
      - 'scripts/ci/check-doc-links.py'
      - 'scripts/ci/check-doc-links.test.py'
      - 'scripts/ci/code-referenced-anchors.v1.json'
      - 'scripts/ci/doc-link-rot-allowlist.v1.json'
      - 'scripts/ci/check-doc-example-surfaces.py'
      - 'scripts/ci/check-doc-example-surfaces.test.py'
      - 'scripts/ci/check-okf-bundle.py'
      - 'scripts/ci/check-okf-bundle.test.py'
      - 'scripts/ci/okf-bundle.v1.json'
      - 'scripts/ci/generate-capability-concepts.py'
      - 'scripts/ci/generate-llms-txt.py'
      - 'scripts/ci/doc-wire-reference-allowlist.v1.json'
      - 'scripts/docs-validation/test_windows_package_verification.py'
      - '.github/workflows/docs-link-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-link-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Documentation links and anchors
    runs-on: ubuntu-latest
    # Stdlib Python over ~1.6k Markdown files and a handful of source roots: a
    # cold run is seconds, not minutes. The ceiling is a bound, not a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The additions-only example gate diffs the PR head against its base.
          fetch-depth: 0

      # The checker's own tests run first and are self-contained (synthetic docs
      # trees in temp directories). A checker that wrongly reports clean is the
      # failure mode that matters here, so it is proved before it is trusted —
      # and its last two cases assert the live repository is green, which means a
      # genuine break is named by BOTH steps rather than only the second.
      - name: Test the documentation link checker
        run: python3 scripts/ci/check-doc-links.test.py

      - name: Test documentation example surface enforcement
        run: python3 scripts/ci/check-doc-example-surfaces.test.py

      - name: Test the OKF bundle checker
        run: python3 scripts/ci/check-okf-bundle.test.py

      - name: Challenge Windows package readback verification under Python optimization
        run: python3 scripts/docs-validation/test_windows_package_verification.py

      - name: Check documentation links, anchors, and code-referenced anchors
        run: python3 scripts/ci/check-doc-links.py

      # Nodes, after the edges. Every page inside the bundle boundary carries
      # OKF frontmatter with a declared type, and every page outside it is
      # outside by a recorded decision rather than by being un-navigable.
      - name: Check the OKF concept bundle
        run: python3 scripts/ci/check-okf-bundle.py --summary

      # One capability concept per registry entry, generated from
      # docs/gis/data/capability-keys.v1.json and the capability matrix. They
      # are the join between the capability registry and the documentation
      # graph, so a capability added to the registry without regenerating them
      # would leave an agent unable to find it - and a capability no page
      # documents is stated as such rather than quietly absent.
      - name: Check the capability concepts are current
        run: python3 scripts/ci/generate-capability-concepts.py --check

      # llms.txt is derived from SUMMARY.md plus each page's frontmatter, so it
      # cannot drift from the docs on its own -- but it can go stale against
      # them, which is what this catches.
      - name: Check docs/llms.txt is current
        run: python3 scripts/ci/generate-llms-txt.py --check

      - name: Reject raw curl additions in documentation
        run: python3 scripts/ci/check-doc-example-surfaces.py --base "${{ github.event.pull_request.base.sha || 'origin/trunk' }}"

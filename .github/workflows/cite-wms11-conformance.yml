name: OGC WMS 1.1.1 CITE Conformance Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'CITE test profile'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - minimal
          - full

  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: default
      server_image:
        required: false
        type: string
        default: ''
      source_sha:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  cite:
    uses: ./.github/workflows/cite-conformance-common.yml
    with:
      honua-image: ${{ inputs.server_image || '' }}
      tested-honua-git-sha: ${{ inputs.server_image != '' && inputs.source_sha || github.sha }}
      suite: wms11
      display-name: WMS 1.1.1
      runner-script: ./scripts/conformance/cite/run-cite-wms11-tests.sh
      results-dir: cite-wms11-results
      summary-file: cite-wms11-summary.md
      timeout-seconds: 2400
      job-timeout-minutes: 45
      cite-profile: ${{ inputs.profile || 'default' }}
      extra-artifact-paths: docker/cite/wms11/config/

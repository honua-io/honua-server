name: OGC CITE Conformance Tests

on:
  schedule:
    # Run weekly to catch conformance regressions
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      profile:
        description: 'CITE test profile'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - minimal
          - full
      honua_image:
        description: >-
          Optional prebuilt Honua Server image (ref, optionally @sha256:digest) to test
          instead of building from source. The release-bundle orchestrator passes the
          immutable release-candidate image here so CITE evidence is pinned to that digest.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: cite-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cite:
    uses: ./.github/workflows/cite-conformance-common.yml
    secrets: inherit
    with:
      suite: features
      display-name: OGC API Features
      runner-script: ./scripts/conformance/cite/run-cite-tests.sh
      results-dir: cite-results
      summary-file: cite-summary.md
      timeout-seconds: 2400
      job-timeout-minutes: 45
      cite-profile: ${{ inputs.profile || 'default' }}
      honua-image: ${{ inputs.honua_image || '' }}
      validation-command: bash ./scripts/conformance/ogc/validate-ogc-conformance.sh --results cite-results
      extra-artifact-paths: docker/cite/ogc-api-features/config/

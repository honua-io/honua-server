name: Protocol harness certification

on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:
    inputs:
      candidate_source_sha:
        description: Full server source SHA to certify; defaults to the workflow SHA
        required: false
        type: string
      candidate_image:
        description: Immutable image reference ending in @sha256; blank builds the candidate locally
        required: false
        type: string
      candidate_cut_at:
        description: Candidate cut timestamp; blank uses the candidate commit timestamp
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: protocol-harness-certification-${{ github.event.inputs.candidate_source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out producer contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: producer

      - name: Resolve candidate identity
        id: identity
        env:
          REQUESTED_SHA: ${{ github.event.inputs.candidate_source_sha }}
          REQUESTED_CUT: ${{ github.event.inputs.candidate_cut_at }}
        run: |
          set -euo pipefail
          producer_sha="$(git -C producer rev-parse HEAD)"
          candidate_sha="${REQUESTED_SHA:-${producer_sha}}"
          [[ "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid candidate SHA" >&2; exit 1; }
          [[ "${candidate_sha}" == "${producer_sha}" ]] || {
            echo "source-host certification requires candidate and producer SHAs to be identical" >&2
            exit 1
          }
          normalized_cut=""
          if [[ -n "${REQUESTED_CUT}" ]]; then
            [[ "${REQUESTED_CUT}" != *$'\n'* && "${REQUESTED_CUT}" != *$'\r'* ]] || {
              echo "candidate cut must be a single-line timestamp" >&2
              exit 1
            }
            normalized_cut="$(python3 -c '
          from datetime import datetime
          import sys
          value = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          if value.tzinfo is None:
              raise SystemExit("candidate cut must include a timezone")
          print(value.isoformat().replace("+00:00", "Z"))
          ' "${REQUESTED_CUT}")"
          fi
          echo "producer_sha=${producer_sha}" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "requested_cut=${normalized_cut}" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Verify or build candidate image identity
        id: image
        env:
          CANDIDATE_IMAGE: ${{ github.event.inputs.candidate_image }}
          CANDIDATE_SHA: ${{ steps.identity.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${CANDIDATE_IMAGE}" ]]; then
            [[ "${CANDIDATE_IMAGE}" =~ @sha256:([0-9a-f]{64})$ ]] || { echo "candidate image must be immutable" >&2; exit 1; }
            docker pull "${CANDIDATE_IMAGE}"
            image_digest="sha256:${BASH_REMATCH[1]}"
            image_ref="${CANDIDATE_IMAGE}"
          else
            image_ref="honua-protocol-harness:${CANDIDATE_SHA}"
            docker build --build-arg "HONUA_GIT_SHA=${CANDIDATE_SHA}" -t "${image_ref}" producer
            image_digest="$(docker image inspect --format '{{.Id}}' "${image_ref}")"
          fi
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image_ref}")"
          [[ "${revision}" == "${CANDIDATE_SHA}" ]] || { echo "image revision does not match candidate" >&2; exit 1; }
          [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid resolved image digest" >&2; exit 1; }
          echo "digest=${image_digest}" >> "$GITHUB_OUTPUT"

      - name: Execute exact governed test roster
        id: tests
        env:
          REQUESTED_CUT: ${{ steps.identity.outputs.requested_cut }}
        run: |
          set -uo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p evidence
          run_project() {
            local project="$1" slug="$2" output_name="$3"
            local filter
            filter="$(python3 producer/scripts/certification/generate-protocol-harness-fragment.py \
              --contract producer/docs/gis/data/protocol-harness-assignments.v1.json \
              --print-filter --project "${project}")"
            dotnet test "producer/tests/dotnet/${project}/${project}.csproj" \
              --configuration Release \
              --filter "${filter}" \
              --logger "trx;LogFileName=${slug}.trx" \
              --results-directory "${GITHUB_WORKSPACE}/evidence"
            printf -v "${output_name}" '%s' "$?"
          }
          run_project Honua.Protocols.GeoServices.Tests geoservices code_geoservices
          run_project Honua.Protocols.OgcApi.Tests ogcapi code_ogcapi
          run_project Honua.Protocols.SensorThings.Tests sensorthings code_sensorthings
          run_project Honua.Server.Tests server code_server
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          candidate_cut="${REQUESTED_CUT:-$(git -C producer show -s --format=%cI HEAD)}"
          {
            echo "exit_geoservices=${code_geoservices}"
            echo "exit_ogcapi=${code_ogcapi}"
            echo "exit_sensorthings=${code_sensorthings}"
            echo "exit_server=${code_server}"
            echo "started_at=${started_at}"
            echo "completed_at=${completed_at}"
            echo "candidate_cut=${candidate_cut}"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate closed certification fragment
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 producer/scripts/certification/generate-protocol-harness-fragment.py \
            --contract producer/docs/gis/data/protocol-harness-assignments.v1.json \
            --trx evidence/geoservices.trx --trx-exit-code "${{ steps.tests.outputs.exit_geoservices }}" \
            --trx evidence/ogcapi.trx --trx-exit-code "${{ steps.tests.outputs.exit_ogcapi }}" \
            --trx evidence/sensorthings.trx --trx-exit-code "${{ steps.tests.outputs.exit_sensorthings }}" \
            --trx evidence/server.trx --trx-exit-code "${{ steps.tests.outputs.exit_server }}" \
            --source-sha "${{ steps.identity.outputs.candidate_sha }}" \
            --producer-source-sha "${{ steps.identity.outputs.producer_sha }}" \
            --image-digest "${{ steps.image.outputs.digest }}" \
            --candidate-cut-at "${{ steps.tests.outputs.candidate_cut }}" \
            --started-at "${{ steps.tests.outputs.started_at }}" \
            --completed-at "${{ steps.tests.outputs.completed_at }}" \
            --generated-at "${generated_at}" \
            --output evidence/protocol-certification-fragment.json

      - name: Upload immutable producer fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-protocol-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/protocol-certification-fragment.json
            evidence/*.trx
          if-no-files-found: error
          retention-days: 30

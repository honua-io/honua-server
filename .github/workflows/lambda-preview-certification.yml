name: Lambda Preview Certification

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: Exact GHCR Lambda AOT tag from the platform manifest
        required: true
        type: string
      architecture:
        description: awsLambdaArchitecture from the manifest candidate (must match the ECR platform)
        required: true
        type: choice
        options:
          - x86_64
          - arm64
      source_digest:
        description: Exact GHCR Lambda manifest digest (sha256:<64hex>)
        required: true
        type: string
      server_revision:
        description: Exact 40-character server revision bound to the image
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: real-aws-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Deploy, serve, upgrade, rollback, teardown
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    environment: cert
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.REALAWS_CERT_REGION || 'us-east-1' }}
      REALAWS_CERT_LAMBDA_FUNCTION: ${{ vars.REALAWS_CERT_LAMBDA_FUNCTION }}
      REALAWS_CERT_LAMBDA_ALIAS: ${{ vars.REALAWS_CERT_LAMBDA_ALIAS }}
      HONUA_LAMBDA_WRITE_BASE_URL: ${{ vars.REALAWS_CERT_LAMBDA_WRITE_BASE_URL }}
      HONUA_DEMO_BASE_URL: ${{ vars.HONUA_DEMO_BASE_URL }}
      HONUA_LAMBDA_CERT_DENIED_KEY: ${{ secrets.REALAWS_CERT_DENIED_KEY }}
      HONUA_LAMBDA_CERT_ADMIN_KEY: ${{ secrets.REALAWS_CERT_ADMIN_KEY }}
      HONUA_LAMBDA_ARCHITECTURE: ${{ inputs.architecture }}
      HONUA_LAMBDA_SOURCE_IMAGE: ${{ inputs.source_image }}
      HONUA_LAMBDA_SOURCE_DIGEST: ${{ inputs.source_digest }}
      HONUA_LAMBDA_SERVER_REVISION: ${{ inputs.server_revision }}
      HONUA_LAMBDA_PREVIEW_REPOSITORY: ${{ vars.REALAWS_CERT_LAMBDA_PREVIEW_REPOSITORY }}
      HONUA_LAMBDA_PREVIEW_EXECUTION_ROLE_ARN: ${{ vars.REALAWS_CERT_LAMBDA_PREVIEW_EXECUTION_ROLE_ARN }}
      HONUA_LAMBDA_PREVIEW_RECEIPT: evidence/lambda-preview-receipt.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci

      - name: Build the production Lambda deploy path driver
        run: dotnet build scripts/cloud/lambda-deploy-driver/LambdaDeployDriver.csproj --configuration Release

      - name: Offline lane self-test
        run: python3 scripts/cloud/test-certify-lambda-preview.py

      - name: Require the certified bootstrap
        shell: bash
        env:
          ROLE_ARN: ${{ vars.REALAWS_CERT_ROLE_ARN }}
        run: |
          set -euo pipefail
          required=(ROLE_ARN HONUA_LAMBDA_PREVIEW_REPOSITORY HONUA_LAMBDA_PREVIEW_EXECUTION_ROLE_ARN REALAWS_CERT_LAMBDA_FUNCTION REALAWS_CERT_LAMBDA_ALIAS HONUA_LAMBDA_WRITE_BASE_URL HONUA_DEMO_BASE_URL HONUA_LAMBDA_CERT_ADMIN_KEY HONUA_LAMBDA_CERT_DENIED_KEY)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing cert bootstrap variable: ${name}"
              exit 1
            fi
          done

      - name: Configure certified AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: ${{ vars.REALAWS_CERT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: honua-lambda-preview-certification

      - name: Install crane (pinned, checksum-verified)
        shell: bash
        env:
          CRANE_VERSION: v0.22.1
          # go-containerregistry release checksums.txt for CRANE_VERSION.
          CRANE_SHA256_x86_64: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
          CRANE_SHA256_arm64: 898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset=x86_64; expected="$CRANE_SHA256_x86_64" ;;
            aarch64|arm64) asset=arm64; expected="$CRANE_SHA256_arm64" ;;
            *) echo "::error::unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/go-containerregistry.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$archive" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${asset}.tar.gz"
          echo "${expected}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" crane
          install -m 0755 "$RUNNER_TEMP/crane" /usr/local/bin/crane
          crane version

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Standing limits (release#210, verbatim): plan summaries to the evidence thread BEFORE apply, STOP on any destroy beyond the lane's own teardown-of-what-it-created, no IAM trust widening, fingerprints only.
      - name: Deploy, invoke, verify, and tear down the exact Lambda artifact
        shell: bash
        run: scripts/cloud/certify-lambda-preview.sh

      - name: Publish fingerprint-only receipt
        if: ${{ always() && hashFiles('evidence/lambda-preview-receipt.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lambda-preview-certification-receipt
          path: evidence/lambda-preview-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Receipt handoff
        if: ${{ success() }}
        shell: bash
        run: |
          digest="$(jq -er '.artifact.ecrDigest' evidence/lambda-preview-receipt.json)"
          echo "### Lambda Preview receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: pass" >> "$GITHUB_STEP_SUMMARY"
          echo "- True ECR artifact digest: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release handoff: replace \`honua-server.awsLambdaEcrDigest\` sentinel with this digest in the platform manifest." >> "$GITHUB_STEP_SUMMARY"

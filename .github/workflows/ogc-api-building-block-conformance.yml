name: OGC API Building-Block Conformance

# The official Features and Tiles ETS workflows remain the authority for their
# selected ETS profiles. This lane closes the evidence gap for the vendored
# CQL2, MVT/TMS 2.0, Maps, and Schemathesis validators that do not belong to an
# ETS profile. Every run builds and checks the exact candidate source SHA.
on:
  pull_request:
    branches: [trunk]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full source SHA to certify (defaults to the selected ref)'
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: ogc-api-building-block-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: OGC API building-block conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve exact candidate source
        id: candidate
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full 40-character SHA" >&2
            exit 1
          fi
          echo "sha=$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 2

      # Only the immutable base supplies executable classification policy.
      # A missing/failed classifier leaves the ordinary checks enabled.
      - name: Classify validated generated-only diff
        id: generated-only
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo 'generated_only=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            if ! git cat-file -e "${TRUSTED_BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$TRUSTED_BASE_SHA" || exit 0
            fi
            policy="${RUNNER_TEMP}/generated-output-diff.py"
            if git show "${TRUSTED_BASE_SHA}:scripts/ci/generated-output-diff.py" > "$policy"; then
              python3 "$policy" --github-output
            fi
          fi

      - name: Verify exact candidate checkout
        if: steps.generated-only.outputs.generated_only != 'true'
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ steps.candidate.outputs.sha }}"
          [[ "$actual" == "$expected" ]] || {
            echo "checked out $actual, expected $expected" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        if: steps.generated-only.outputs.generated_only != 'true'
        uses: docker/setup-buildx-action@v4

      # A pull-request head is candidate-controlled code. Package credentials
      # are only available to trusted repository refs; fork PRs use the same
      # exact-candidate build path with empty BuildKit secrets.
      - name: Build exact candidate server image (trusted package feed)
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.generated-only.outputs.generated_only != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: honua-server:ogcapi-${{ steps.candidate.outputs.sha }}
          build-args: |
            HONUA_GIT_SHA=${{ steps.candidate.outputs.sha }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ secrets.GITHUB_TOKEN }}
          provenance: false
          sbom: false

      - name: Build exact candidate server image (untrusted PR, no repository token)
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && steps.generated-only.outputs.generated_only != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: honua-server:ogcapi-${{ steps.candidate.outputs.sha }}
          build-args: |
            HONUA_GIT_SHA=${{ steps.candidate.outputs.sha }}
          provenance: false
          sbom: false

      - name: Verify candidate image identity
        if: steps.generated-only.outputs.generated_only != 'true'
        run: |
          set -euo pipefail
          image="honua-server:ogcapi-${{ steps.candidate.outputs.sha }}"
          revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$revision" == "${{ steps.candidate.outputs.sha }}" ]] || {
            echo "image revision $revision does not match candidate ${{ steps.candidate.outputs.sha }}" >&2
            exit 1
          }

      - name: Prepare evidence directory
        if: (always()) && steps.generated-only.outputs.generated_only != 'true'
        run: mkdir -p ogcapi-conformance-results

      - name: Set up Node.js
        if: steps.generated-only.outputs.generated_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: scripts/conformance/ogcapi/package-lock.json

      - name: Install OGC validator dependencies
        if: steps.generated-only.outputs.generated_only != 'true'
        run: |
          set -euo pipefail
          npm ci --prefix scripts/conformance/ogcapi
          python3 -m venv "$RUNNER_TEMP/ogcapi-venv"
          "$RUNNER_TEMP/ogcapi-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/conformance/ogcapi/requirements-conformance.txt
          "$RUNNER_TEMP/ogcapi-venv/bin/python" -m pip freeze --all | sort > ogcapi-conformance-results/python-toolchain.txt
          echo "$RUNNER_TEMP/ogcapi-venv/bin" >> "$GITHUB_PATH"

      - name: Run exact-candidate OGC API validators
        if: steps.generated-only.outputs.generated_only != 'true'
        env:
          HONUA_CONFORMANCE_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          HONUA_CONFORMANCE_SERVER_IMAGE: honua-server:ogcapi-${{ steps.candidate.outputs.sha }}
          HONUA_CONFORMANCE_RESULTS_DIR: ogcapi-conformance-results
          PYTHON_BIN: ${{ runner.temp }}/ogcapi-venv/bin/python
        run: bash scripts/conformance/ogcapi/run-building-block-conformance.sh

      - name: Upload OGC API conformance evidence
        if: (always()) && steps.generated-only.outputs.generated_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ogc-api-building-block-conformance-${{ github.run_id }}
          path: ogcapi-conformance-results/
          if-no-files-found: warn
          retention-days: 30

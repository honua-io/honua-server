name: Compose Release Lifecycle

on:
  pull_request:
    branches: [trunk]
    paths:
      - 'src/Honua.Server/Features/ControlPlane/**'
      - 'src/Honua.Server/Features/Infrastructure/Monitoring/McpPlatformOpsReader.cs'
      - 'src/Honua.Core/Features/ControlPlane/**'
      - 'docs/get-started/compose.executor.yaml'
      - 'docs/get-started/quickstart.md'
      - 'tests/integration/test_compose_release_lifecycle.py'
      - '.github/workflows/compose-release-lifecycle.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: compose-release-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  published-rc1-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare runner disk space
        run: |
          scripts/ci/server-test-shard-free-disk.sh
          scripts/ci/server-test-shard-free-disk.sh --await
      - name: Build production candidate image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build --file docker/Dockerfile.aot --tag honua-lifecycle:candidate \
            --secret id=github_actor,env=GITHUB_ACTOR --secret id=github_token,env=GITHUB_TOKEN .
      - name: Run published-image MCP and restore journey
        run: |
          python3 -m venv /tmp/honua-lifecycle-venv
          /tmp/honua-lifecycle-venv/bin/pip install pytest
          export HONUA_LIFECYCLE_IMAGE="$(docker image inspect --format '{{.Id}}' honua-lifecycle:candidate)"
          /tmp/honua-lifecycle-venv/bin/pytest -q tests/integration/test_compose_release_lifecycle.py

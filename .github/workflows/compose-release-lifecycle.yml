name: Compose Release Lifecycle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [trunk]
    paths:
      - 'src/Honua.Server/Features/ControlPlane/**'
      - 'src/Honua.Server/Features/Infrastructure/Monitoring/McpPlatformOpsReader.cs'
      - 'src/Honua.Core/Core/Features/ControlPlane/**'
      - 'docs/get-started/compose.executor.yaml'
      - 'docs/get-started/compose.console.yaml'
      - 'docs/get-started/quickstart.md'
      - 'docs/guides/connect/working-with-ai-agents.md'
      - 'docs/guides/connect/operating-skills.md'
      - 'tests/integration/test_compose_release_lifecycle.py'
      - '.github/workflows/compose-release-lifecycle.yml'
      - '.github/workflows/nightly-container-build.yml'
      - 'docker/Dockerfile.aot'
      - 'docker/Dockerfile.compose-executor'
      - 'scripts/docker/*quickstart*.py'
      - 'scripts/docker/test_compose_release_lifecycle_polling.py'
      - 'scripts/docker/test_operating_skills.py'
      - 'skills/**'

permissions:
  contents: read
  packages: read

concurrency:
  group: compose-release-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  published-rc1-lifecycle:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare runner disk space
        run: |
          scripts/ci/server-test-shard-free-disk.sh
          scripts/ci/server-test-shard-free-disk.sh --await
      - name: Verify proposal lifecycle polling
        run: python3 -m unittest discover -s scripts/docker -p 'test_compose_release_lifecycle_polling.py' -v
      - name: Verify operating skill package bytes and checksums
        run: python3 -m unittest discover -s scripts/docker -p 'test_operating_skills.py' -v
      # A separate builder keeps the plain `docker build` below on the local image store,
      # where the executor image resolves honua-lifecycle:candidate.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
      - name: Log in to GHCR for build cache
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Reuses the restore and base layers of the nightly and serving-image AOT builds.
      - name: Build production candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: docker/Dockerfile.aot
          load: true
          tags: honua-lifecycle:candidate
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-aot-amd64
          provenance: false
          sbom: false
      - name: Build the dedicated customer executor image
        run: |
          docker build --file docker/Dockerfile.compose-executor --tag honua-lifecycle:executor \
            --build-arg HONUA_SERVER_IMAGE=honua-lifecycle:candidate .
      - name: Verify customer package and isolation contract
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -m unittest discover -s scripts/docker -p 'test_compose_quickstart.py' -v
      - name: Run published-image MCP and restore journey
        run: |
          export TMPDIR="${RUNNER_TEMP}"
          python3 -m venv "${RUNNER_TEMP}/honua-lifecycle-venv"
          "${RUNNER_TEMP}/honua-lifecycle-venv/bin/pip" install pytest
          export HONUA_LIFECYCLE_EXECUTOR_IMAGE="$(docker image inspect --format '{{.Id}}' honua-lifecycle:executor)"
          export HONUA_LIFECYCLE_IMAGE="$(docker image inspect --format '{{.Id}}' honua-lifecycle:candidate)"
          "${RUNNER_TEMP}/honua-lifecycle-venv/bin/pytest" -q --tb=short --no-showlocals tests/integration/test_compose_release_lifecycle.py

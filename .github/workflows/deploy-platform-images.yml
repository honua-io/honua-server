name: Build & Publish Platform Images

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      scan_only:
        description: Build and scan images without authenticating to or publishing to registries
        required: false
        default: false
        type: boolean

permissions: {}

env:
  ECR_REGION: ${{ vars.AWS_ECR_REGION }}
  ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
  TRIVY_IMAGE: aquasec/trivy:0.68.1
  PUBLISH_IMAGES: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.scan_only != true) }}

concurrency:
  group: deploy-platform-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.image_name }} (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/trunk' || inputs.scan_only == true
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_key: ecs-jit
            image_name: ECS Development JIT Image
            dockerfile: Dockerfile
            tag_suffix: -ecs-jit
            cache_scope: release-ecs-jit
            sarif_output: trivy-results-ecs
            sarif_category: trivy-ecs
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            provenance: true
            sbom: true
          - image_key: ecs-aot
            image_name: ECS AOT Image
            dockerfile: docker/Dockerfile.aot
            tag_suffix: -ecs-aot
            cache_scope: release-ecs-aot
            sarif_output: trivy-results-ecs-aot
            sarif_category: trivy-ecs-aot
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            provenance: true
            sbom: true
          - image_key: lambda-jit
            image_name: Lambda Development JIT Image
            dockerfile: docker/Dockerfile.lambda
            tag_suffix: -lambda-jit
            cache_scope: release-lambda-jit
            sarif_output: trivy-results-lambda
            sarif_category: trivy-lambda
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            provenance: false
            sbom: false
          - image_key: lambda-aot
            image_name: Lambda AOT Image
            dockerfile: docker/Dockerfile.lambda.aot
            tag_suffix: -lambda-aot
            cache_scope: release-lambda-aot
            sarif_output: trivy-results-lambda-aot
            sarif_category: trivy-lambda-aot
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            provenance: false
            sbom: false
          - image_key: functions-jit
            image_name: Functions Development JIT Image
            dockerfile: docker/Dockerfile.functions
            tag_suffix: -functions-jit
            cache_scope: release-functions-jit
            sarif_output: trivy-results-functions
            sarif_category: trivy-functions
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            provenance: true
            sbom: true
          - image_key: functions-aot
            image_name: Functions AOT Image
            dockerfile: docker/Dockerfile.functions.aot
            tag_suffix: -functions-aot
            cache_scope: release-functions-aot
            sarif_output: trivy-results-functions-aot
            sarif_category: trivy-functions-aot
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            provenance: true
            sbom: true
    permissions:
      contents: read
      packages: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Configure AWS credentials for ECR
        if: ${{ env.PUBLISH_IMAGES == 'true' && env.ECR_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: arn:aws:iam::585192672263:role/honua-server-gha-ecr-publish
          aws-region: ${{ env.ECR_REGION }}

      - name: Resolve ECR registry
        id: ecr
        if: ${{ env.PUBLISH_IMAGES == 'true' && env.ECR_REGION != '' }}
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${ECR_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        if: ${{ env.PUBLISH_IMAGES == 'true' && steps.ecr.outputs.registry != '' }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${ECR_REPOSITORY:-honua-server}"
          if ! aws ecr describe-repositories --repository-names "$repo" --region "$ECR_REGION" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$repo" \
              --image-scanning-configuration scanOnPush=true \
              --region "$ECR_REGION" >/dev/null 2>&1 || \
              aws ecr describe-repositories --repository-names "$repo" --region "$ECR_REGION" >/dev/null
          fi

      - name: Log in to Amazon ECR
        if: ${{ env.PUBLISH_IMAGES == 'true' && steps.ecr.outputs.registry != '' }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Validate Azure credentials for ACR
        if: ${{ env.PUBLISH_IMAGES == 'true' && env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          required=(
            ARM_CLIENT_ID
            ARM_CLIENT_SECRET
            ARM_TENANT_ID
            ARM_SUBSCRIPTION_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Azure credential for ACR publish: $name" >&2
              exit 1
            fi
          done

      - name: Log in to Azure Container Registry
        if: ${{ env.PUBLISH_IMAGES == 'true' && env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          acr_name="${ACR_LOGIN_SERVER%%.*}"
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" >/dev/null
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          az acr login --name "$acr_name"

      - name: Resolve target image names
        id: targets
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ACR_LOGIN_SERVER: ${{ env.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          ecr_repo="${ECR_REPOSITORY:-honua-server}"
          acr_repo="${ACR_REPOSITORY:-honua-server}"
          images=()

          if [ -n "$ECR_REGISTRY" ]; then
            images+=("${ECR_REGISTRY}/${ecr_repo}")
          fi
          if [ -n "$ACR_LOGIN_SERVER" ]; then
            images+=("${ACR_LOGIN_SERVER}/${acr_repo}")
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            echo "No registry target configured for platform image publish." >&2
            echo "Set AWS_ECR_REGION + AWS credential secrets and/or ACR_LOGIN_SERVER + Azure ARM credential secrets." >&2
            exit 1
          fi

          {
            echo "images<<EOF"
            printf '%s\n' "${images[@]}"
            echo "EOF"
            echo "scan_image=${images[0]}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }}
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}},suffix=${{ matrix.tag_suffix }}
            type=sha,prefix={{branch}}-,suffix=${{ matrix.tag_suffix }}
            type=raw,value=latest${{ matrix.tag_suffix }},enable={{is_default_branch}}

      - name: Add explicit arch suffixes to image tags
        id: arch_tags
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              printf '%s-%s\n' "$tag" "$ARCH"
            done <<< "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build native-AOT platform candidate by digest
        id: aot_candidate
        if: ${{ env.PUBLISH_IMAGES == 'true' && contains(matrix.image_key, 'aot') }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.targets.outputs.scan_image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          provenance: ${{ matrix.provenance }}
          sbom: ${{ matrix.sbom }}

      - name: Verify native-AOT platform candidate before registry publication
        if: ${{ env.PUBLISH_IMAGES == 'true' && contains(matrix.image_key, 'aot') }}
        shell: bash
        env:
          CANDIDATE: ${{ steps.targets.outputs.scan_image }}@${{ steps.aot_candidate.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$CANDIDATE"
          python3 scripts/ci/verify-serving-image-boundary.py --serving-image "$CANDIDATE"

      - name: Publish verified native-AOT platform architecture tags
        if: ${{ env.PUBLISH_IMAGES == 'true' && contains(matrix.image_key, 'aot') }}
        shell: bash
        env:
          CANDIDATE: ${{ steps.targets.outputs.scan_image }}@${{ steps.aot_candidate.outputs.digest }}
          TAGS: ${{ steps.arch_tags.outputs.tags }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          printf '%s\n' "$TAGS" | python3 scripts/ci/promote-verified-image.py \
            --candidate "$CANDIDATE" \
            --staging-tag "boundary-candidate-${{ matrix.image_key }}-${{ matrix.arch }}-${{ github.sha }}" \
            --authfile "$HOME/.docker/config.json"

      - name: Build and push JIT platform image
        id: build
        if: ${{ env.PUBLISH_IMAGES == 'true' && contains(matrix.image_key, 'aot') == false }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          provenance: ${{ matrix.provenance }}
          sbom: ${{ matrix.sbom }}

      - name: Build local image for security scan
        if: ${{ env.PUBLISH_IMAGES != 'true' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: honua-platform-scan:${{ matrix.image_key }}-${{ matrix.arch }}-${{ github.sha }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Pull image for Trivy scan
        id: scan_prep
        shell: bash
        env:
          PUBLISH_IMAGES: ${{ env.PUBLISH_IMAGES }}
          SCAN_SOURCE: ${{ steps.targets.outputs.scan_image }}@${{ contains(matrix.image_key, 'aot') && steps.aot_candidate.outputs.digest || steps.build.outputs.digest }}
          SCAN_LOCAL: honua-platform-scan:${{ matrix.image_key }}-${{ matrix.arch }}-${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_IMAGES" == "true" ]]; then
            docker pull "$SCAN_SOURCE"
            docker tag "$SCAN_SOURCE" "$SCAN_LOCAL"
          fi
          echo "scan_local=$SCAN_LOCAL" >> "$GITHUB_OUTPUT"

      - name: Enforce native-AOT boundary for scan-only build
        if: ${{ env.PUBLISH_IMAGES != 'true' && contains(matrix.image_key, 'aot') }}
        run: python3 scripts/ci/verify-serving-image-boundary.py --serving-image "${{ steps.scan_prep.outputs.scan_local }}"

      # Always generate an SPDX SBOM artifact for every platform image, even
      # when matrix.sbom is false (Lambda images skip the OCI SBOM
      # attestation because AWS Lambda's image format rejects unknown
      # manifest entries). This ensures audit gate A -> A+ coverage of
      # *every* container build, not just the ones that publish an
      # attestation alongside the image.
      - name: Generate SBOM (SPDX JSON) for ${{ matrix.image_key }} (${{ matrix.arch }})
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.scan_prep.outputs.scan_local }}
          format: spdx-json
          output-file: sbom-${{ matrix.image_key }}-${{ matrix.arch }}.spdx.json
          artifact-name: sbom-${{ matrix.image_key }}-${{ matrix.arch }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # Two passes over the same image, because "what is worth paging on" and
      # "what is worth recording" are different questions (honua-server#3036):
      #
      #   1. Actionable -> GitHub Security tab. HIGH/CRITICAL *with an upstream fix
      #      available* (`--ignore-unfixed`). This is the only lane that raises code
      #      scanning alerts, so it is restricted to findings this repo can actually
      #      close by bumping a package or a base image. It matches the posture the
      #      blocking CI gate already uses ("Trivy image scan (full CI, HIGH/CRITICAL,
      #      fixed only)" in ci.yml, `ignore-unfixed: true`); the per-image SARIF was
      #      previously the one lane that did *not*, which is how distro won't-fix
      #      records came to be ~99% of this repo's open scan volume and drowned out
      #      genuinely new criticals.
      #   2. Inventory -> build artifact. The same severities with NO
      #      `--ignore-unfixed`, so nothing is hidden. A vulnerability whose distro
      #      has not shipped a fix stays fully recorded here, and moves into pass 1
      #      (and therefore onto the Security tab) the moment upstream publishes one.
      #
      # Neither pass honours `.trivyignore`. That file includes advisories suppressed
      # because no upstream fix exists: applying it to pass 1 would keep those findings
      # hidden after a fix ships, while applying it to pass 2 would make the inventory
      # incomplete. Both passes must therefore rely only on their explicit filters.
      - name: Run Trivy vulnerability scanner (actionable, fixed only)
        shell: bash
        env:
          SARIF_OUTPUT: ${{ matrix.sarif_output }}-${{ matrix.arch }}.sarif
          SCAN_LOCAL: ${{ steps.scan_prep.outputs.scan_local }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --skip-version-check \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output "/work/$SARIF_OUTPUT" \
            "$SCAN_LOCAL"

      # Deliberately NO --ignorefile in either pass. Trivy excludes anything the ignore file
      # names, including after a fix ships, so applying it here would make the inventory
      # incomplete and applying it above would defeat the automatic move into actionable SARIF.
      - name: Run Trivy vulnerability scanner (full inventory, including unfixed)
        if: always() && steps.scan_prep.outcome == 'success'
        shell: bash
        env:
          INVENTORY_OUTPUT: trivy-inventory-${{ matrix.image_key }}-${{ matrix.arch }}.json
          SCAN_LOCAL: ${{ steps.scan_prep.outputs.scan_local }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --skip-version-check \
            --severity HIGH,CRITICAL \
            --format json \
            --output "/work/$INVENTORY_OUTPUT" \
            "$SCAN_LOCAL"

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('{0}-{1}.sarif', matrix.sarif_output, matrix.arch)) != ''
        with:
          sarif_file: ${{ matrix.sarif_output }}-${{ matrix.arch }}.sarif
          category: ${{ matrix.sarif_category }}-${{ matrix.arch }}

      - name: Upload Trivy unfixed-inclusive inventory
        uses: actions/upload-artifact@v7
        if: always() && hashFiles(format('trivy-inventory-{0}-{1}.json', matrix.image_key, matrix.arch)) != ''
        with:
          name: trivy-inventory-${{ matrix.image_key }}-${{ matrix.arch }}
          path: trivy-inventory-${{ matrix.image_key }}-${{ matrix.arch }}.json
          retention-days: 90

  publish-manifests:
    name: Publish ${{ matrix.image_name }} Manifest
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/trunk' && inputs.scan_only != true)) && needs.build-and-push.result == 'success' }}
    needs: build-and-push
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: ECS Development JIT Image
            tag_suffix: -ecs-jit
            source_arches: "arm64"
            publish_aot_alias: false
          - image_name: ECS AOT Image
            tag_suffix: -ecs-aot
            source_arches: "arm64"
            publish_aot_alias: true
          - image_name: Lambda Development JIT Image
            tag_suffix: -lambda-jit
            source_arches: "arm64"
            publish_aot_alias: false
          - image_name: Lambda AOT Image
            tag_suffix: -lambda-aot
            source_arches: "arm64"
            publish_aot_alias: true
          - image_name: Functions Development JIT Image
            tag_suffix: -functions-jit
            source_arches: "amd64"
            publish_aot_alias: false
          - image_name: Functions AOT Image
            tag_suffix: -functions-aot
            source_arches: "amd64"
            publish_aot_alias: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Configure AWS credentials for ECR
        if: ${{ env.ECR_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: arn:aws:iam::585192672263:role/honua-server-gha-ecr-publish
          aws-region: ${{ env.ECR_REGION }}

      - name: Resolve ECR registry
        id: ecr
        if: ${{ env.ECR_REGION != '' }}
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${ECR_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        if: ${{ steps.ecr.outputs.registry != '' }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${ECR_REPOSITORY:-honua-server}"
          if ! aws ecr describe-repositories --repository-names "$repo" --region "$ECR_REGION" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$repo" \
              --image-scanning-configuration scanOnPush=true \
              --region "$ECR_REGION" >/dev/null 2>&1 || \
              aws ecr describe-repositories --repository-names "$repo" --region "$ECR_REGION" >/dev/null
          fi

      - name: Log in to Amazon ECR
        if: ${{ steps.ecr.outputs.registry != '' }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Validate Azure credentials for ACR
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          required=(
            ARM_CLIENT_ID
            ARM_CLIENT_SECRET
            ARM_TENANT_ID
            ARM_SUBSCRIPTION_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Azure credential for ACR publish: $name" >&2
              exit 1
            fi
          done

      - name: Log in to Azure Container Registry
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          acr_name="${ACR_LOGIN_SERVER%%.*}"
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" >/dev/null
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          az acr login --name "$acr_name"

      - name: Resolve target image names
        id: targets
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ACR_LOGIN_SERVER: ${{ env.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          ecr_repo="${ECR_REPOSITORY:-honua-server}"
          acr_repo="${ACR_REPOSITORY:-honua-server}"
          images=()

          if [ -n "$ECR_REGISTRY" ]; then
            images+=("${ECR_REGISTRY}/${ecr_repo}")
          fi
          if [ -n "$ACR_LOGIN_SERVER" ]; then
            images+=("${ACR_LOGIN_SERVER}/${acr_repo}")
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            echo "No registry target configured for platform image publish." >&2
            echo "Set AWS_ECR_REGION + AWS credential secrets and/or ACR_LOGIN_SERVER + Azure ARM credential secrets." >&2
            exit 1
          fi

          {
            echo "images<<EOF"
            printf '%s\n' "${images[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }}
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}},suffix=${{ matrix.tag_suffix }}
            type=sha,prefix={{branch}}-,suffix=${{ matrix.tag_suffix }}
            type=raw,value=latest${{ matrix.tag_suffix }},enable={{is_default_branch}}

      - name: Publish target tags
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_ARCHES: ${{ matrix.source_arches }}
          PUBLISH_AOT_ALIAS: ${{ matrix.publish_aot_alias }}
        run: |
          set -euo pipefail
          read -r -a source_arches <<< "$SOURCE_ARCHES"

          if [[ "${#source_arches[@]}" -eq 0 ]]; then
            echo "No source architectures configured for ${TAGS:-<empty tag set>}." >&2
            exit 1
          fi

          for tag in $TAGS; do
            refs=()
            for arch in "${source_arches[@]}"; do
              refs+=("${tag}-${arch}")
            done

            targets=(-t "$tag")
            if [[ "$PUBLISH_AOT_ALIAS" == "true" ]]; then
              targets+=(-t "${tag%-aot}")
            fi
            docker buildx imagetools create "${targets[@]}" "${refs[@]}"
          done

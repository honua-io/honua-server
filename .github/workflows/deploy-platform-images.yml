name: Build & Publish Platform Images

on:
  push:
    branches: [trunk]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

env:
  ECR_REGION: ${{ vars.AWS_ECR_REGION }}
  ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}

jobs:
  build-and-push-lambda:
    name: Build & Push Lambda JIT Image (Debug Fallback)
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials for ECR
        if: ${{ env.ECR_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Resolve ECR registry
        id: ecr
        if: ${{ env.ECR_REGION != '' }}
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${ECR_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        if: ${{ steps.ecr.outputs.registry != '' }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${ECR_REPOSITORY:-honua-server}"
          if ! aws ecr describe-repositories --repository-names "$repo" --region "$ECR_REGION" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$repo" \
              --image-scanning-configuration scanOnPush=true \
              --region "$ECR_REGION" >/dev/null
          fi

      - name: Log in to Amazon ECR
        if: ${{ steps.ecr.outputs.registry != '' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate Azure credentials for ACR
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          required=(
            ARM_CLIENT_ID
            ARM_CLIENT_SECRET
            ARM_TENANT_ID
            ARM_SUBSCRIPTION_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Azure credential for ACR publish: $name" >&2
              exit 1
            fi
          done

      - name: Log in to Azure Container Registry
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          acr_name="${ACR_LOGIN_SERVER%%.*}"
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" >/dev/null
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          az acr login --name "$acr_name"

      - name: Resolve target image names
        id: targets
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ACR_LOGIN_SERVER: ${{ env.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          ecr_repo="${ECR_REPOSITORY:-honua-server}"
          acr_repo="${ACR_REPOSITORY:-honua-server}"
          images=()

          if [ -n "$ECR_REGISTRY" ]; then
            images+=("${ECR_REGISTRY}/${ecr_repo}")
          fi
          if [ -n "$ACR_LOGIN_SERVER" ]; then
            images+=("${ACR_LOGIN_SERVER}/${acr_repo}")
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            echo "No registry target configured for platform image publish." >&2
            echo "Set AWS_ECR_REGION + AWS credential secrets and/or ACR_LOGIN_SERVER + Azure ARM credential secrets." >&2
            exit 1
          fi

          {
            echo "images<<EOF"
            printf '%s\n' "${images[@]}"
            echo "EOF"
            echo "scan_image=${images[0]}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=branch,suffix=-lambda
            type=ref,event=tag,suffix=-lambda
            type=semver,pattern={{version}},suffix=-lambda
            type=semver,pattern={{major}}.{{minor}},suffix=-lambda
            type=semver,pattern={{major}},suffix=-lambda
            type=sha,prefix={{branch}}-,suffix=-lambda
            type=raw,value=latest-lambda,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.lambda
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-lambda-jit
          cache-to: type=gha,mode=max,scope=release-lambda-jit
          provenance: true
          sbom: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@22438a435773de8c97dc0958cc0b823c45b064ac # master
        with:
          image-ref: ${{ steps.targets.outputs.scan_image }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results-lambda.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results-lambda.sarif') != ''
        with:
          sarif_file: 'trivy-results-lambda.sarif'
          category: 'trivy-lambda'


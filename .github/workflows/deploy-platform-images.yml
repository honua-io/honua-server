      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results-functions-aot.sarif') != ''
        with:
          sarif_file: 'trivy-results-functions-aot.sarif'
          category: 'trivy-functions-aot'

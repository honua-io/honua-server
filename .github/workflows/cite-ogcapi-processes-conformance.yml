name: OGC API Processes 1.0 Release Gate

on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Exact digest-addressed Honua Server candidate image (image@sha256:...)
        required: true
        type: string
      source_sha:
        description: Full Honua source SHA represented by server_image
        required: true
        type: string

# Tier: required release gate. Intentionally dispatch-only: release cuts supply
# the immutable candidate digest after publication. This is never a per-PR job.
permissions:
  contents: read
  packages: write

concurrency:
  group: cite-ogcapi-processes-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-image:
    name: Validate candidate image reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject mutable candidate image tags
        env:
          SERVER_IMAGE: ${{ inputs.server_image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SERVER_IMAGE" =~ ^[a-z0-9.-]+(/[a-z0-9._-]+)+@sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::server_image must be a canonical lowercase immutable image@sha256 digest reference'
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::source_sha must be the full lowercase source commit represented by server_image'
            exit 1
          fi

  cite:
    needs: validate-image
    uses: ./.github/workflows/cite-conformance-common.yml
    with:
      suite: ogcapi-processes10
      display-name: OGC API Processes 1.0
      runner-script: ./scripts/conformance/cite/run-cite-ogcapi-processes-tests.sh
      results-dir: cite-ogcapi-processes-results
      summary-file: cite-ogcapi-processes-summary.md
      timeout-seconds: 3600
      job-timeout-minutes: 70
      cite-profile: diagnostic
      tested-honua-git-sha: ${{ inputs.source_sha }}
      honua-image: ${{ inputs.server_image }}
      extra-artifact-paths: docker/cite/ogc-api-processes/config/
      validation-command: >-
        python3 scripts/conformance/cite/enforce_ogcapi_processes_release_gate.py
        --input cite-ogcapi-processes-results/cite-ogcapi-processes-diagnostic.json
        --baseline scripts/conformance/cite/ogcapi-processes-release-baseline.json
        --expected-image '${{ inputs.server_image }}'
        --expected-source '${{ inputs.source_sha }}'
        --json cite-ogcapi-processes-results/release-gate-verdict.json
        --summary cite-ogcapi-processes-results/release-gate-verdict.md
      diagnostic-only: false

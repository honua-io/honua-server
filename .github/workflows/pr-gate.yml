name: PR Gate

# This workflow is the required verification context. The trusted `Review Gate`
# status is a separate required admission context, so PR-authored workflow code
# cannot satisfy branch protection before exact-head review. In observe mode
# this workflow records the review-first receipt while preserving eager behavior.
# After the measured shadow period in #3216, changing REVIEW_FIRST_MODE to
# `enforce` makes pull_request attempt 1 admission-only and fail-closed. The
# trusted default-branch Review Gate workflow releases the same run exactly once
# after exact-head review; attempt 2 performs the existing expensive gate.
#
# Do not rename the workflow/job or add a paths filter: either change silently
# un-gates trunk or leaves pull requests waiting for a status that never exists.
on:
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read
  statuses: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  # Staged rollout: observe first, then flip this one audited value to enforce.
  # Keep synchronized with review-gate.yml; the admission validator fails on
  # drift. Rollback is the inverse one-line change back to `observe`.
  REVIEW_FIRST_MODE: observe
  # Observation only. `full` remains authoritative until #3235's shadow and
  # hosted promotion thresholds pass; this value changes no step decision.
  PR_GATE_IMPACT_MODE: observe

jobs:
  pr-gate:
    # This exact string is the branch-protection verification context. Changing it
    # silently un-gates trunk or leaves pull requests waiting forever.
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - id: impact-input
        name: Collect exact PR change metadata for impact observation
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runnerTemp = process.env.RUNNER_TEMP;
            const inputPath = runnerTemp && path.join(runnerTemp, 'pr-gate-impact-input.json');
            const classifierPath = runnerTemp && path.join(runnerTemp, 'trusted-classify-pr-gate-impact.py');
            try {
              if (!runnerTemp) throw new Error('RUNNER_TEMP is unavailable');
              const number = context.payload.pull_request?.number;
              const expectedBase = context.payload.pull_request?.base?.sha;
              const expectedHead = context.payload.pull_request?.head?.sha;
              if (!number || !expectedBase || !expectedHead) {
                throw new Error('pull request identity is incomplete');
              }
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              if (pr.base.sha !== expectedBase || pr.head.sha !== expectedHead) {
                throw new Error('pull request moved while collecting changed files');
              }
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                { ...context.repo, pull_number: number, per_page: 100 },
              );
              // Close the identity/listFiles race. A push during pagination can
              // otherwise bind the moved head's file list to the event's old
              // SHA and corrupt the zero-miss shadow sample.
              const { data: currentPr } = await github.rest.pulls.get({
                ...context.repo, pull_number: number,
              });
              if (currentPr.base.sha !== expectedBase || currentPr.head.sha !== expectedHead) {
                throw new Error('pull request moved while paginating changed files');
              }

              // The checked-out merge ref is PR-authored. Promotion evidence
              // must be computed by policy from the immutable trusted base,
              // never by the classifier in the candidate checkout.
              const { data: policy } = await github.rest.repos.getContent({
                ...context.repo,
                path: 'scripts/ci/classify-pr-gate-impact.py',
                ref: expectedBase,
              });
              if (Array.isArray(policy) || policy.type !== 'file' || policy.encoding !== 'base64' ||
                  !policy.content || !/^[0-9a-f]{40}$/.test(policy.sha || '')) {
                throw new Error('trusted base classifier is unavailable or malformed');
              }
              fs.writeFileSync(classifierPath, Buffer.from(policy.content, 'base64'));
              fs.writeFileSync(inputPath, JSON.stringify({
                repository: `${context.repo.owner}/${context.repo.repo}`,
                pull_request: number,
                base_sha: expectedBase,
                head_sha: expectedHead,
                policy_sha: expectedBase,
                policy_blob_sha: policy.sha,
                changed_files: pr.changed_files,
                files: files.map((item) => ({
                  filename: item.filename,
                  previous_filename: item.previous_filename,
                  status: item.status,
                })),
              }));
            } catch (error) {
              core.warning(`PR Gate impact observation unavailable: ${error.message}`);
              if (inputPath) {
                fs.writeFileSync(inputPath, JSON.stringify({
                  unavailable_reason: 'change-metadata-unavailable',
                  files: [],
                }));
              }
            }

      - name: Record non-authoritative PR Gate impact observation
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python3 "${RUNNER_TEMP}/trusted-classify-pr-gate-impact.py" \
            --input "${RUNNER_TEMP}/pr-gate-impact-input.json" \
            --output "${RUNNER_TEMP}/pr-gate-impact-observation.json"
          mode="$(jq -r '.mode' "${RUNNER_TEMP}/pr-gate-impact-observation.json")"
          reason="$(jq -r '.reason' "${RUNNER_TEMP}/pr-gate-impact-observation.json")"
          files="$(jq -r '.changed_file_count' "${RUNNER_TEMP}/pr-gate-impact-observation.json")"
          {
            echo '### PR Gate impact observation'
            echo "- Rollout: \`${PR_GATE_IMPACT_MODE}\`"
            echo "- Would route: \`${mode}\`"
            echo "- Reason: \`${reason}\`"
            echo "- Changed files: \`${files}\`"
            echo '- Authoritative path: `full` (unchanged)'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload PR Gate impact observation
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-gate-impact-observation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr-gate-impact-observation.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify review-first admission contract
        run: scripts/ci/validate-review-first-dispatch.sh

      - name: Verify .NET base-image security inventory
        run: |
          scripts/ci/base-image-mirrors.sh --self-test
          scripts/ci/base-image-mirrors.sh --verify-inventory-doc docs/internal/security/code-scanning-2026-Q2-remediation.md

      # The trusted dispatcher requires this exact successful step before it
      # can release an enforced attempt 1. A failed admission never reaches it.
      - name: Admission receipt
        run: |
          echo "mode=${REVIEW_FIRST_MODE}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          echo "head=${GITHUB_SHA}"
          {
            echo "### PR Gate admission"
            echo "- Mode: \`${REVIEW_FIRST_MODE}\`"
            echo "- Attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- Head: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # This intentional failure keeps the required context non-green until a
      # trusted exact-head review releases the failed job as attempt 2.
      - name: Await exact-head review
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          echo "Admission passed; exact-head review has not released verification yet."
          exit 1

      # Review evidence is mutable after the trusted dispatcher accepts the
      # rerun. Check its SHA-bound status before spending runners and again
      # immediately before the required verification context can become green. A
      # dismissal, deleted clean result, or new unresolved thread therefore
      # fails attempt 2 closed instead of relying only on its run number.
      - name: Revalidate exact-head review before verification
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt > 1
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request?.head?.sha;
            if (!head || head !== '${{ github.event.pull_request.head.sha }}') {
              core.setFailed('Attempt 2 has no trustworthy pull-request head.');
              return;
            }
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { ...context.repo, ref: head, per_page: 100 },
            );
            const reviewGate = statuses.find(status => status.context === 'Review Gate');
            if (reviewGate?.state !== 'success') {
              core.setFailed(`Exact-head Review Gate is ${reviewGate?.state || 'missing'}.`);
            }

      # The full-solution Release build can exhaust ubuntu-latest disk once
      # every project writes bin/obj. Best-effort cleanup mirrors ci.yml.
      - name: Free disk space
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup .NET
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Lean gate (build + format + fast unit/architecture smoke)
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/lean-gate
        with:
          trx-prefix: pr-gate

      # Exercise all clean and injected-rootfs fixtures here without building a
      # container. The separate serving-image workflow and release/deploy/nightly
      # lanes apply this detector to the final production root filesystems.
      - name: Test serving-image boundary detector
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: |
          python3 scripts/ci/fixtures/validate-serving-image-boundary.py
          python3 scripts/ci/fixtures/validate-promote-verified-image.py

      - name: Revalidate exact-head review before success
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt > 1
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request?.head?.sha;
            if (!head || head !== '${{ github.event.pull_request.head.sha }}') {
              core.setFailed('Attempt 2 has no trustworthy pull-request head.');
              return;
            }
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { ...context.repo, ref: head, per_page: 100 },
            );
            const reviewGate = statuses.find(status => status.context === 'Review Gate');
            if (reviewGate?.state !== 'success') {
              core.setFailed(`Exact-head Review Gate is ${reviewGate?.state || 'missing'}.`);
            }

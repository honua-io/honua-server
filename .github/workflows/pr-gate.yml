name: PR Gate

# This workflow is the required verification context. The trusted `Review Gate`
# status is a separate required admission context, so PR-authored workflow code
# cannot satisfy branch protection before exact-head review. In observe mode
# this workflow records the review-first receipt while preserving eager behavior.
# After the measured shadow period in #3216, changing REVIEW_FIRST_MODE to
# `enforce` makes pull_request attempt 1 admission-only and fail-closed. The
# trusted default-branch Review Gate workflow releases the same run exactly once
# after exact-head review; attempt 2 performs the existing expensive gate.
#
# Do not rename the workflow/job or add a paths filter: either change silently
# un-gates trunk or leaves pull requests waiting for a status that never exists.
on:
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read
  statuses: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  # Reuse the persistent MSBuild server across this job's restore, gate build,
  # and no-build test invocations; Roslyn shared compilation stays enabled.
  DOTNET_CLI_USE_MSBUILD_SERVER: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  # Staged rollout: observe first, then flip this one audited value to enforce.
  # Keep synchronized with review-gate.yml; the admission validator fails on
  # drift. Rollback is the inverse one-line change back to `observe`.
  REVIEW_FIRST_MODE: observe

jobs:
  format:
    name: PR Gate / Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `rerun-failed-jobs` only releases jobs that failed attempt 1. Make this
      # independent path an admission failure too, otherwise a skipped-success
      # format job would never execute on enforced attempt 2.
      - name: Await exact-head review
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          echo "Admission passed; exact-head review has not released format verification yet."
          exit 1

      - uses: actions/checkout@v7.0.1
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        with:
          fetch-depth: 2

      - name: Setup .NET
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: scripts/ci/dotnet-restore-retry.sh Honua.sln

      - name: Format Check
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/format-check
        with:
          format-scope: affected

  pr-gate:
    # This exact string is the branch-protection verification context. Changing it
    # silently un-gates trunk or leaves pull requests waiting forever.
    name: PR Gate / Build and tests
    runs-on: ubuntu-latest
    # Includes the required production PDAL toolchain build and content proof.
    timeout-minutes: 75
    steps:
      # fetch-depth 2, not the default 1: the checked-out ref is
      # refs/pull/N/merge, whose FIRST PARENT is the current tip of `trunk`. That
      # parent is what the lean gate's affected-scope computation diffs against,
      # and at depth 1 the parent commits are not in the object store, so the
      # computation force-fulls and the optimization silently never fires. Two
      # commits is a couple of extra seconds of fetch; do not lower it, and do
      # not raise it to 0 (full history on this repo is minutes).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      # Admission tier: ~3 seconds over every tracked text blob, so a branch that
      # saved documentation as Windows-1252 (#3320) is named here instead of
      # surfacing as a bare UnicodeDecodeError from whichever later step happens
      # to read one of the affected files -- or, for files nothing reads, merging
      # corrupted. Binary fixtures are excluded by git's own classification.
      - name: Verify tracked text files are UTF-8
        run: |
          # The reporting check runs FIRST. Its whole purpose is to name the
          # offending file, byte, offset and line; running the fixture suite
          # ahead of it meant a genuinely mis-encoded file tripped the suite's
          # own live-repository assertion, `&&` short-circuited, and the gate
          # blocked with no diagnostic at all -- the exact failure #3321 was
          # filed about. The suite still runs after, so a checker that wrongly
          # reports clean is caught in the same step.
          python3 scripts/ci/validate-tracked-file-encoding.py
          python3 scripts/ci/validate-tracked-file-encoding.test.py

      - name: Verify terminal error receipt contract
        run: python3 scripts/certification/verify-terminal-error-receipts.py

      - name: Verify review-first admission contract
        run: scripts/ci/validate-review-first-dispatch.sh

      - name: Verify .NET base-image security inventory
        run: |
          scripts/ci/base-image-mirrors.sh --self-test
          scripts/ci/base-image-mirrors.sh --verify-inventory-doc docs/internal/security/code-scanning-2026-Q2-remediation.md

      # The trusted dispatcher requires this exact successful step before it
      # can release an enforced attempt 1. A failed admission never reaches it.
      - name: Admission receipt
        run: |
          echo "mode=${REVIEW_FIRST_MODE}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          echo "head=${GITHUB_SHA}"
          {
            echo "### PR Gate admission"
            echo "- Mode: \`${REVIEW_FIRST_MODE}\`"
            echo "- Attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- Head: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # This intentional failure keeps the required context non-green until a
      # trusted exact-head review releases the failed job as attempt 2.
      - name: Await exact-head review
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          echo "Admission passed; exact-head review has not released verification yet."
          exit 1

      # Review evidence is mutable after the trusted dispatcher accepts the
      # rerun. Check its SHA-bound status before spending runners and again
      # immediately before the required verification context can become green. A
      # dismissal, deleted clean result, or new unresolved thread therefore
      # fails attempt 2 closed instead of relying only on its run number.
      - name: Revalidate exact-head review before verification
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt > 1
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request?.head?.sha;
            if (!head || head !== '${{ github.event.pull_request.head.sha }}') {
              core.setFailed('Attempt 2 has no trustworthy pull-request head.');
              return;
            }
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { ...context.repo, ref: head, per_page: 100 },
            );
            const reviewGate = statuses.find(status => status.context === 'Review Gate');
            if (reviewGate?.state !== 'success') {
              core.setFailed(`Exact-head Review Gate is ${reviewGate?.state || 'missing'}.`);
            }

      # The full-solution Release build can exhaust ubuntu-latest disk once
      # every project writes bin/obj. Best-effort cleanup mirrors ci.yml.
      - name: Free disk space
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup .NET
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # Cross-job bin/obj cache (ADR-0043 PR #1), behind a repo variable so
          # promotion is a variable flip and rollback is instant — no PR, no
          # merge train, no wait on the very gate being changed.
          #
          # HONUA_PR_GATE_BUILD_CACHE STARTS UNSET, i.e. OFF. Merging this
          # changes nothing observable; it only installs the switch.
          #
          # PROMOTION CRITERION IS `PR Gate` p90 STRICTLY BETTER OVER ONE WEEK OF
          # RUNS — never cache-hit rate. That is the #2708 lesson: the 150 MiB
          # shared server-test producer had a fine hit rate and still regressed
          # time-to-first-test, which is why #2735 replaced it. A cache that hits
          # 90% of the time and adds restore/save to every run is a regression.
          # Watch the restore/save cost on MISSES too, the `**/bin` + `**/obj`
          # payload against the disk budget the `Free disk space` step above
          # already fights for, and key thrash — the key hashes every `.cs`, so
          # any source change invalidates the entry and falls to `restore-keys`.
          # If p90 is not strictly better, the variable stays unset. That is a
          # successful measurement, not a failed change.
          enable-build-cache: ${{ vars.HONUA_PR_GATE_BUILD_CACHE == 'true' && 'true' || 'false' }}

      # The server boot smoke below uses the same PostGIS image as the
      # Testcontainers-backed Governance/Drift coverage. Pull it while the
      # existing lean build runs so the required path pays only sidecar startup
      # and migrations, not a cold image fetch.
      - name: Pre-pull Testcontainers PostGIS image (background)
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: scripts/ci/prepull-testcontainers-postgis.sh

      - name: Lean gate (build + fast unit/architecture smoke)
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/lean-gate
        with:
          trx-prefix: pr-gate
          prepull-postgis: 'true'
          # Per-PR only. The gate compiles the diff's reverse-dependency closure
          # plus every project its own --no-build test steps consume, and falls
          # back to the full solution whenever the diff base is untrustworthy or
          # shared build infrastructure changed. A closure miss fails the merge
          # train's full-solution build before landing, so it is fixed forward
          # and never reaches trunk unverified.
          build-scope: affected
          # Format retains this same affected/full/skip contract in the parallel
          # format job above. The default remains inline for every other caller.
          run-format: 'false'

      - name: Prove raster catalog execution with production GDAL
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ARG GDAL_BASE_IMAGE=//p' docker/worker-gdal/Dockerfile)
          test -n "$image"
          docker pull "$image"
          dotnet test tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj \
            --configuration Release -maxcpucount:4 \
            --filter 'Category=RasterExecutionProof' \
            --logger 'trx;LogFileName=raster-execution-proof.trx' \
            --results-directory tests/TestResults

      - name: Build production PDAL native tools
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        timeout-minutes: 30
        run: |
          docker build --target native-tools -f docker/worker-gdal/Dockerfile -t honua-pdal-proof .
          echo "HONUA_PDAL_PROOF_IMAGE=$(docker image inspect --format '{{.Id}}' honua-pdal-proof)" >> "$GITHUB_ENV"
          echo "HONUA_GDAL_PROOF_USER=$(id -u):$(id -g)" >> "$GITHUB_ENV"

      - name: Prove point-cloud execution with production PDAL
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        timeout-minutes: 10
        run: |
          dotnet test tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj \
            --configuration Release --filter 'Category=PdalExecutionProof' \
            --logger 'trx;LogFileName=pdal-execution-proof.trx' --results-directory tests/TestResults

      - name: Upload point-cloud execution proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdal-execution-proof
          path: tests/TestResults/pdal-execution-proof.trx

      - name: Upload raster execution proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raster-execution-proof
          path: tests/TestResults/raster-execution-proof.trx
          if-no-files-found: warn

      - name: Await Testcontainers PostGIS pre-pull
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        env:
          PREPULL_AWAIT_TIMEOUT_SECONDS: '120'
        run: scripts/ci/prepull-testcontainers-postgis.sh --await

      - name: Honua.Server boot + migrations smoke
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: timeout 175s scripts/ci/server-boot-smoke.sh

      # Exercise all clean and injected-rootfs fixtures here without building a
      # container. The separate serving-image workflow and release/deploy/nightly
      # lanes apply this detector to the final production root filesystems.
      - name: Test serving-image boundary detector
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: |
          python3 scripts/ci/fixtures/validate-serving-image-boundary.py
          python3 scripts/ci/fixtures/validate-promote-verified-image.py

      - name: Revalidate exact-head review before success
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt > 1
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request?.head?.sha;
            if (!head || head !== '${{ github.event.pull_request.head.sha }}') {
              core.setFailed('Attempt 2 has no trustworthy pull-request head.');
              return;
            }
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { ...context.repo, ref: head, per_page: 100 },
            );
            const reviewGate = statuses.find(status => status.context === 'Review Gate');
            if (reviewGate?.state !== 'success') {
              core.setFailed(`Exact-head Review Gate is ${reviewGate?.state || 'missing'}.`);
            }

  required:
    # Keep the exact branch-protection context stable while both independent
    # verification paths fail closed into it.
    name: PR Gate
    if: always()
    needs: [pr-gate, format]
    runs-on: ubuntu-latest
    steps:
      - name: Require build, tests, and format
        env:
          BUILD_AND_TEST_RESULT: ${{ needs.pr-gate.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
        run: |
          if [[ "${BUILD_AND_TEST_RESULT}" != "success" || "${FORMAT_RESULT}" != "success" ]]; then
            echo "::error::PR Gate failed: build/tests=${BUILD_AND_TEST_RESULT}, format=${FORMAT_RESULT}"
            exit 1
          fi

      # This is the last step in the stable required context, after both
      # parallel verification paths have completed. It closes the interval in
      # which review evidence could be dismissed while format was still running.
      - name: Revalidate exact-head review before success
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt > 1
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request?.head?.sha;
            if (!head || head !== '${{ github.event.pull_request.head.sha }}') {
              core.setFailed('Attempt 2 has no trustworthy pull-request head.');
              return;
            }
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { ...context.repo, ref: head, per_page: 100 },
            );
            const reviewGate = statuses.find(status => status.context === 'Review Gate');
            if (reviewGate?.state !== 'success') {
              core.setFailed(`Exact-head Review Gate is ${reviewGate?.state || 'missing'}.`);
            }

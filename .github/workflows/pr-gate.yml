name: PR Gate

# This workflow is the required verification context. The trusted `Review Gate`
# status is a separate required admission context, so PR-authored workflow code
# cannot satisfy branch protection before exact-head review. In observe mode
# this workflow records the review-first receipt while preserving eager behavior.
# After the measured shadow period in #3216, changing REVIEW_FIRST_MODE to
# `enforce` makes pull_request attempt 1 admission-only and fail-closed. The
# trusted default-branch Review Gate workflow releases the same run exactly once
# after exact-head review; attempt 2 performs the existing expensive gate.
#
# Do not rename the workflow/job or add a paths filter: either change silently
# un-gates trunk or leaves pull requests waiting for a status that never exists.
on:
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read
  statuses: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  # Reuse the persistent MSBuild server across this job's restore, gate build,
  # and no-build test invocations; Roslyn shared compilation stays enabled.
  DOTNET_CLI_USE_MSBUILD_SERVER: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  # Staged rollout: observe first, then flip this one audited value to enforce.
  # Keep synchronized with review-gate.yml; the admission validator fails on
  # drift. Rollback is the inverse one-line change back to `observe`.
  REVIEW_FIRST_MODE: observe
  # Promotion switch for the report-only affected-shard detector below. `report`
  # publishes the verdict and concludes success; `enforce` fails the
  # `PR Gate / Affected shards` context on a red shard. See the block comment on
  # the `affected-shards-select` job for the measurement that gates the flip.
  AFFECTED_SHARDS_MODE: report
  # Hard fan-out bound for that lane. A `run_all` router answer is 71 shard
  # jobs; this is what keeps the lane a detector instead of a second matrix.
  AFFECTED_SHARDS_CAP: '6'

jobs:
  format:
    name: PR Gate / Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `rerun-failed-jobs` only releases jobs that failed attempt 1. Make this
      # independent path an admission failure too, otherwise a skipped-success
      # format job would never execute on enforced attempt 2.
      - name: Await exact-head review
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          echo "Admission passed; exact-head review has not released format verification yet."
          exit 1

      - uses: actions/checkout@v7
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        with:
          fetch-depth: 2

      - name: Setup .NET
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: scripts/ci/dotnet-restore-retry.sh Honua.sln

      - name: Format Check
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/format-check
        with:
          format-scope: affected

  pr-gate:
    # This exact string is the branch-protection verification context. Changing it
    # silently un-gates trunk or leaves pull requests waiting forever.
    name: PR Gate / Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth 2, not the default 1: the checked-out ref is
      # refs/pull/N/merge, whose FIRST PARENT is the current tip of `trunk`. That
      # parent is what the lean gate's affected-scope computation diffs against,
      # and at depth 1 the parent commits are not in the object store, so the
      # computation force-fulls and the optimization silently never fires. Two
      # commits is a couple of extra seconds of fetch; do not lower it, and do
      # not raise it to 0 (full history on this repo is minutes).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Admission tier: ~3 seconds over every tracked text blob, so a branch that
      # saved documentation as Windows-1252 (#3320) is named here instead of
      # surfacing as a bare UnicodeDecodeError from whichever later step happens
      # to read one of the affected files -- or, for files nothing reads, merging
      # corrupted. Binary fixtures are excluded by git's own classification.
      - name: Verify tracked text files are UTF-8
        run: |
          # The reporting check runs FIRST. Its whole purpose is to name the
          # offending file, byte, offset and line; running the fixture suite
          # ahead of it meant a genuinely mis-encoded file tripped the suite's
          # own live-repository assertion, `&&` short-circuited, and the gate
          # blocked with no diagnostic at all -- the exact failure #3321 was
          # filed about. The suite still runs after, so a checker that wrongly
          # reports clean is caught in the same step.
          python3 scripts/ci/validate-tracked-file-encoding.py
          python3 scripts/ci/validate-tracked-file-encoding.test.py

      - name: Verify terminal error receipt contract
        run: python3 scripts/certification/verify-terminal-error-receipts.py

      - name: Verify review-first admission contract
        run: scripts/ci/validate-review-first-dispatch.sh

      - name: Verify .NET base-image security inventory
        run: |
          scripts/ci/base-image-mirrors.sh --self-test
          scripts/ci/base-image-mirrors.sh --verify-inventory-doc docs/internal/security/code-scanning-2026-Q2-remediation.md

      # The trusted dispatcher requires this exact successful step before it
      # can release an enforced attempt 1. A failed admission never reaches it.
      - name: Admission receipt
        run: |
          echo "mode=${REVIEW_FIRST_MODE}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "attempt=${GITHUB_RUN_ATTEMPT}"
          echo "head=${GITHUB_SHA}"
          {
            echo "### PR Gate admission"
            echo "- Mode: \`${REVIEW_FIRST_MODE}\`"
            echo "- Attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- Head: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # This intentional failure keeps the required context non-green until a
      # trusted exact-head review releases the failed job as attempt 2.
      - name: Await exact-head review
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          echo "Admission passed; exact-head review has not released verification yet."
          exit 1

      # Review evidence is mutable after the trusted dispatcher accepts the
      # rerun. Check its SHA-bound status before spending runners and again
      # immediately before the required verification context can become green. A
      # dismissal, deleted clean result, or new unresolved thread therefore
      # fails attempt 2 closed instead of relying only on its run number.
      - name: Revalidate exact-head review before verification
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt > 1
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request?.head?.sha;
            if (!head || head !== '${{ github.event.pull_request.head.sha }}') {
              core.setFailed('Attempt 2 has no trustworthy pull-request head.');
              return;
            }
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { ...context.repo, ref: head, per_page: 100 },
            );
            const reviewGate = statuses.find(status => status.context === 'Review Gate');
            if (reviewGate?.state !== 'success') {
              core.setFailed(`Exact-head Review Gate is ${reviewGate?.state || 'missing'}.`);
            }

      # The full-solution Release build can exhaust ubuntu-latest disk once
      # every project writes bin/obj. Best-effort cleanup mirrors ci.yml.
      - name: Free disk space
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup .NET
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # Cross-job bin/obj cache (ADR-0043 PR #1), behind a repo variable so
          # promotion is a variable flip and rollback is instant — no PR, no
          # merge train, no wait on the very gate being changed.
          #
          # HONUA_PR_GATE_BUILD_CACHE STARTS UNSET, i.e. OFF. Merging this
          # changes nothing observable; it only installs the switch.
          #
          # PROMOTION CRITERION IS `PR Gate` p90 STRICTLY BETTER OVER ONE WEEK OF
          # RUNS — never cache-hit rate. That is the #2708 lesson: the 150 MiB
          # shared server-test producer had a fine hit rate and still regressed
          # time-to-first-test, which is why #2735 replaced it. A cache that hits
          # 90% of the time and adds restore/save to every run is a regression.
          # Watch the restore/save cost on MISSES too, the `**/bin` + `**/obj`
          # payload against the disk budget the `Free disk space` step above
          # already fights for, and key thrash — the key hashes every `.cs`, so
          # any source change invalidates the entry and falls to `restore-keys`.
          # If p90 is not strictly better, the variable stays unset. That is a
          # successful measurement, not a failed change.
          enable-build-cache: ${{ vars.HONUA_PR_GATE_BUILD_CACHE == 'true' && 'true' || 'false' }}

      # The server boot smoke below uses the same PostGIS image as the
      # Testcontainers-backed Governance/Drift coverage. Pull it while the
      # existing lean build runs so the required path pays only sidecar startup
      # and migrations, not a cold image fetch.
      - name: Pre-pull Testcontainers PostGIS image (background)
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: scripts/ci/prepull-testcontainers-postgis.sh

      - name: Lean gate (build + fast unit/architecture smoke)
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        uses: ./.github/actions/lean-gate
        with:
          trx-prefix: pr-gate
          prepull-postgis: 'true'
          # Per-PR only. The gate compiles the diff's reverse-dependency closure
          # plus every project its own --no-build test steps consume, and falls
          # back to the full solution whenever the diff base is untrustworthy or
          # shared build infrastructure changed. A closure miss fails the merge
          # train's full-solution build before landing, so it is fixed forward
          # and never reaches trunk unverified.
          build-scope: affected
          # Format retains this same affected/full/skip contract in the parallel
          # format job above. The default remains inline for every other caller.
          run-format: 'false'

      - name: Prove remote source execution with real HTTP and PostGIS
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        timeout-minutes: 10
        run: |
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --configuration Release --filter 'Category=RemoteSourceExecutionProof' \
            --logger 'trx;LogFileName=remote-source-execution-proof.trx' --results-directory tests/TestResults

      - name: Upload remote source execution proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-source-execution-proof
          path: tests/TestResults/remote-source-execution-proof.trx

      - name: Prove raster catalog execution with production GDAL
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ARG GDAL_BASE_IMAGE=//p' docker/worker-gdal/Dockerfile)
          test -n "$image"
          docker pull "$image"
          dotnet test tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj \
            --configuration Release -maxcpucount:4 \
            --filter 'Category=RasterExecutionProof' \
            --logger 'trx;LogFileName=raster-execution-proof.trx' \
            --results-directory tests/TestResults

          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --configuration Release -maxcpucount:4 \
            --filter 'Category=CopyFeaturesExecutionProof' \
            --logger 'trx;LogFileName=copy-features-execution-proof.trx' \
            --results-directory tests/TestResults

      - name: Upload raster execution proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raster-execution-proof
          path: tests/TestResults/raster-execution-proof.trx
          if-no-files-found: warn

      - name: Await Testcontainers PostGIS pre-pull
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        env:
          PREPULL_AWAIT_TIMEOUT_SECONDS: '120'
        run: scripts/ci/prepull-testcontainers-postgis.sh --await

      - name: Upload copy-features execution proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copy-features-execution-proof
          path: tests/TestResults/copy-features-execution-proof.trx
          if-no-files-found: warn

      - name: Honua.Server boot + migrations smoke
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: timeout 175s scripts/ci/server-boot-smoke.sh

      # Exercise all clean and injected-rootfs fixtures here without building a
      # container. The separate serving-image workflow and release/deploy/nightly
      # lanes apply this detector to the final production root filesystems.
      - name: Test serving-image boundary detector
        if: env.REVIEW_FIRST_MODE != 'enforce' || github.event_name != 'pull_request' || github.run_attempt > 1
        run: |
          python3 scripts/ci/fixtures/validate-serving-image-boundary.py
          python3 scripts/ci/fixtures/validate-promote-verified-image.py

      - name: Revalidate exact-head review before success
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt > 1
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request?.head?.sha;
            if (!head || head !== '${{ github.event.pull_request.head.sha }}') {
              core.setFailed('Attempt 2 has no trustworthy pull-request head.');
              return;
            }
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { ...context.repo, ref: head, per_page: 100 },
            );
            const reviewGate = statuses.find(status => status.context === 'Review Gate');
            if (reviewGate?.state !== 'success') {
              core.setFailed(`Exact-head Review Gate is ${reviewGate?.state || 'missing'}.`);
            }

  # ---------------------------------------------------------------------------
  # AFFECTED SHARD FAMILIES (#3204 / #3213). REPORT-ONLY.
  #
  # THE PROBLEM. `PR Gate` above is a lean subset: build + fast unit +
  # architecture. The 71 server-test shard families in `.github/ci-shards.json`
  # run per trunk tip in the trailing matrix (p50 44 / p90 65 min, plus a rerun
  # to classify), so a shard regression is found AFTER the merge that caused it.
  # On 2026-09-07 trunk was red ~15 of the previous 24 hours, and every real
  # regression in that window -- Console/Alerts (#4489), Tiles/Replica
  # (#4463/#4465), Caching/Styling (#4466) -- was in a shard whose own `paths`
  # the offending PR had touched. The routing information needed to catch them
  # pre-merge already existed; nothing on the pull request consumed it.
  #
  # WHAT THIS LANE DOES. `affected-shards-select` asks the SAME ADR-0037 router
  # the trailing matrix uses (scripts/ci/honua-server-targeted-tests.sh) which
  # shard families claim the diff, narrows a `run_all` answer by the ADR-0043
  # reverse-dependency closure (scripts/ci/compute-affected-projects.sh, which
  # is what maps a changed SOURCE project to the TEST projects that consume it),
  # ranks largest-impact first, and truncates to AFFECTED_SHARDS_CAP families.
  # `affected-shard` then runs each one through scripts/ci/run-server-test-shard.sh
  # -- the same runner, the same `.github/ci-shards.json` filter, and the same
  # inner/outer budgets as ci.yml::server-tests -- so a red here is a red there.
  #
  # WHY THE CAP IS NOT NEGOTIABLE. A `run_all` answer is 71 shard jobs. Fanning
  # that out per pull request is the 2026-06-18 runner-starvation spiral that
  # #2865 removed and that ./.github/actions/lean-gate is written to avoid. This
  # lane is a DETECTOR with a fixed budget, not a second full matrix: it buys a
  # bounded probability of catching the regression pre-merge, and the trailing
  # matrix stays the complete backstop. Do not raise the cap to "cover more".
  #
  # WHY IT IS REPORT-ONLY, AND HOW IT GETS PROMOTED. `AFFECTED_SHARDS_MODE`
  # starts at `report`: the per-shard test failure is swallowed at the step (the
  # ci.yml advisory-shard pattern -- a red check-run on a non-required job still
  # forces the pull request to UNSTABLE and stalls the clean-only merge train),
  # and the aggregate context `PR Gate / Affected shards` publishes the verdict
  # in its step summary and as HONUA_AFFECTED_SHARD_* annotations while
  # concluding success.
  #
  #   PROMOTION RULE: make this context required when its FALSE-RED rate over 7
  #   days of runs is < 2%. A false red is a run that emits
  #   HONUA_AFFECTED_SHARD_RED for a head whose change did not in fact break
  #   that shard -- flake, cross-shard interference, or an environment
  #   difference from ci.yml::server-tests. Measure it by collecting the
  #   annotations from this context across the window and reconciling each red
  #   against the same shard's result in the trailing matrix for the merge
  #   commit. Promotion is then TWO audited changes: flip AFFECTED_SHARDS_MODE
  #   to `enforce` here, and add `PR Gate / Affected shards` to branch
  #   protection. Rollback is the inverse one-line flip. Below 2% is the bar
  #   because this lane costs a bounded fan-out on every product-code PR;
  #   a noisier detector spends that budget re-running green shards by hand.
  #
  # If the measurement says the false-red rate is too high, leaving
  # AFFECTED_SHARDS_MODE at `report` is a successful measurement, not a failed
  # change.
  # ---------------------------------------------------------------------------
  affected-shards-select:
    name: PR Gate / Affected shards (select)
    # pull_request only: the selection diffs against HEAD^1, and only the
    # refs/pull/N/merge ref has the base-branch tip as its first parent. The
    # same reasoning scopes scripts/ci/compute-lean-gate-build-scope.sh.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.select.outputs.skip }}
      reason: ${{ steps.select.outputs.reason }}
      selected_count: ${{ steps.select.outputs.selected_count }}
      matrix_include: ${{ steps.select.outputs.matrix_include }}
    steps:
      # Same shape as the `format` job's admission failure. `rerun-failed-jobs`
      # releases only jobs that FAILED attempt 1, so a job that quietly
      # succeeded by skipping its steps would never execute on the enforced
      # attempt 2 -- and the shards it selects would never run at all.
      - name: Await exact-head review
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          echo "Admission passed; exact-head review has not released shard selection yet."
          exit 1

      # fetch-depth 2 for the same reason the required job documents above: the
      # checked-out ref is refs/pull/N/merge and its FIRST PARENT is the current
      # tip of the base branch, which is the diff base both the router and the
      # affected-projects closure are computed against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The selector, the shard map and this workflow are all PR-authored, and
      # `scripts/ci/fixtures/validate-affected-shards.py` -- the fixture that
      # proves a feature namespace still selects its owning shard, that the cap
      # holds, that advisory shards stay out, and that each of those checks
      # fails against its own injected defect -- otherwise runs ONLY in
      # `ci.yml::ci-router-validation`, and ci.yml has no `pull_request`
      # trigger (see its header). So without this step nothing validates the
      # selector on the pull request that changes it: an under-scoped edit
      # would make selection and aggregation both green and land, and only the
      # trailing workflow would discover the broken fixture. AGENTS.md already
      # treats a diff touching the selectors as unable to scope itself; the
      # same reasoning applies to a lane consuming its own PR-authored
      # selector. Offline (no network, no dotnet), so it costs seconds.
      - name: Validate the shard selector before consuming it
        run: python3 scripts/ci/fixtures/validate-affected-shards.py

      - name: Select affected shard families
        id: select
        env:
          CAP: ${{ env.AFFECTED_SHARDS_CAP }}
        run: |
          python3 scripts/ci/compute-affected-shards.py \
            --cap "${CAP}" \
            --github-output \
            --json "${RUNNER_TEMP}/affected-shards.json" \
            --summary "${RUNNER_TEMP}/affected-shards.md"
          cat "${RUNNER_TEMP}/affected-shards.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload selection receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-gate-affected-shards-selection
          path: ${{ runner.temp }}/affected-shards.json
          if-no-files-found: warn

  affected-shard:
    name: PR Gate / Affected shard (${{ matrix.shard_name }})
    # An `include:` that evaluates to `[]` is a workflow error ("matrix vector
    # 'include' does not contain any values"), so the empty selection is
    # short-circuited here, before the strategy is expanded, rather than by the
    # selector emitting a sentinel entry.
    if: >-
      github.event_name == 'pull_request'
      && needs.affected-shards-select.outputs.skip != 'true'
      && needs.affected-shards-select.outputs.matrix_include != '[]'
    needs: affected-shards-select
    runs-on: ubuntu-latest
    # The shard's OWN outer budget from .github/ci-shards.json, exactly as
    # ci.yml::server-tests applies it. Substituting a flat cap here would make
    # this lane time out on shards the trailing matrix runs comfortably, which
    # is precisely the false red the promotion rule measures.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.affected-shards-select.outputs.matrix_include) }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
      HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Start freeing disk space
        run: scripts/ci/server-test-shard-free-disk.sh

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Wait for free disk space
        run: scripts/ci/server-test-shard-free-disk.sh --await

      # Deliberately NOT wired to the exact-head shard cache
      # (scripts/ci/server-test-shard-cache.sh). That cache designates the
      # highest-dispatch_rank shard of a project as the writer and has every
      # sibling materialize its payload; on a hit the payload is missing another
      # project's build outputs, which is the open #4453 defect. A detector lane
      # whose job is to make a red mean something must not import a known source
      # of false reds. Each shard here restores and builds its own project.
      - name: Restore
        env:
          SHARD_CSPROJ: ${{ matrix.csproj }}
        run: scripts/ci/dotnet-restore-retry.sh "${SHARD_CSPROJ}"

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Build server test binaries
        timeout-minutes: 20
        env:
          SHARD_CSPROJ: ${{ matrix.csproj }}
        run: |
          dotnet build "${SHARD_CSPROJ}" \
            --no-restore \
            --configuration Release \
            -graphBuild \
            /p:RunAnalyzers=false

      # continue-on-error, always: the test failure is the SIGNAL this lane
      # exists to publish, and it is published by the aggregate context below.
      # Letting it fail the matrix job would put a red check-run on the pull
      # request for a non-required lane, which forces mergeStateStatus to
      # UNSTABLE and stalls the clean-only merge train -- the exact regression
      # ci.yml::server-tests documents for advisory shards. Promotion changes
      # AFFECTED_SHARDS_MODE below, never this.
      - name: Run affected shard
        id: shard
        continue-on-error: true
        env:
          HONUA_SERVER_TEST_SHARD_NAME: ${{ matrix.shard_name }}
          HONUA_SERVER_TEST_FILTER: ${{ matrix.filter }}
          HONUA_SERVER_TEST_LOG_NAME: ${{ matrix.log_name }}
          HONUA_SERVER_TEST_TIMEOUT_MINUTES: ${{ matrix.test_timeout_minutes }}
          HONUA_SERVER_TEST_MAX_CPU_COUNT: ${{ matrix.max_cpu_count }}
          HONUA_SERVER_TEST_RESULTS_DIR: ./tests/TestResults
          HONUA_SERVER_TEST_CONFIGURATION: Release
          HONUA_SERVER_TEST_CSPROJ: ${{ matrix.csproj }}
        run: scripts/ci/run-server-test-shard.sh

      # The timing artifact run-server-test-shard.sh writes is what the
      # aggregate context reads; a shard that never produced one is reported as
      # infrastructure, not as a shard red.
      - name: Upload affected shard results
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 3
        with:
          name: pr-gate-affected-shard-${{ matrix.artifact_suffix }}
          path: tests/TestResults/
          retention-days: 7

  affected-shards:
    # The single stable context for this lane. Report-only until the promotion
    # rule at the top of this block is satisfied; NOT in `required.needs`.
    name: PR Gate / Affected shards
    if: always() && github.event_name == 'pull_request'
    needs: [affected-shards-select, affected-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download affected shard receipts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: pr-gate-affected-shard-*
          path: shard-results
          merge-multiple: true

      - name: Report affected-shard verdict
        env:
          MODE: ${{ env.AFFECTED_SHARDS_MODE }}
          SELECT_RESULT: ${{ needs.affected-shards-select.result }}
          SELECT_SKIP: ${{ needs.affected-shards-select.outputs.skip }}
          SELECT_REASON: ${{ needs.affected-shards-select.outputs.reason }}
          SELECT_COUNT: ${{ needs.affected-shards-select.outputs.selected_count }}
          SHARDS_RESULT: ${{ needs.affected-shard.result }}
        run: |
          set -euo pipefail

          note() { printf '%s\n' "$1" >> "${GITHUB_STEP_SUMMARY}"; }
          note '### PR Gate / Affected shards'
          note ''
          note "- Mode: \`${MODE}\` (report-only until the promotion rule in pr-gate.yml is met)"
          note "- Selection: \`${SELECT_REASON:-unavailable}\` (\`${SELECT_COUNT:-0}\` shard families)"

          # MISSING EVIDENCE IS NOT A PASS ONCE THIS CONTEXT IS REQUIRED.
          # Promotion is documented as exactly two changes -- flip
          # AFFECTED_SHARDS_MODE to `enforce`, add this context to branch
          # protection -- so every path that concludes "no evidence" has to be
          # aware of the mode. Otherwise a selector crash, an invalid routing
          # config, or shard jobs that die before their receipts would exit 0
          # and silently disable the required gate rather than blocking on it.
          # In `report` the behaviour is unchanged: warn, publish, pass.
          unavailable() {
            local verdict="$1" explanation="$2" annotation="$3"
            note "- Verdict: \`${verdict}\` — ${explanation}"
            if [[ "${MODE}" == "enforce" ]]; then
              note '  `AFFECTED_SHARDS_MODE` is `enforce`, so this required context fails closed on'
              note '  missing evidence rather than reporting a pass it cannot support.'
              echo "::error::HONUA_AFFECTED_SHARD_UNAVAILABLE ${annotation}"
              exit 1
            fi
            echo "::warning::HONUA_AFFECTED_SHARD_UNAVAILABLE ${annotation}"
            exit 0
          }

          if [[ "${SELECT_RESULT}" != "success" ]]; then
            unavailable "selection_${SELECT_RESULT}" \
              "no shard evidence for this head." \
              "selection concluded '${SELECT_RESULT}'."
          fi
          if [[ "${SELECT_SKIP}" == "true" ]]; then
            note "- Verdict: \`skipped\` — nothing in this diff can move a server-test shard."
            exit 0
          fi

          shopt -s nullglob
          timings=(shard-results/*.timing.json)
          received=${#timings[@]}
          expected=${SELECT_COUNT:-0}
          if [[ "${received}" -eq 0 ]]; then
            note '  A shard that fails before its test step (restore, build, runner disk) produces no'
            note '  receipt; that is an infrastructure failure of this lane, not a shard regression.'
            unavailable "no_receipts" \
              "shard jobs concluded \`${SHARDS_RESULT}\` without a timing artifact." \
              "shard jobs concluded '${SHARDS_RESULT}' with no timing receipt."
          fi

          note ''
          note '| Shard | Status | Duration | Budget used | Capacity |'
          note '|---|---|---:|---:|---|'
          red=0
          for timing in "${timings[@]}"; do
            shard=$(jq -r '.shard' "${timing}")
            status=$(jq -r '.status' "${timing}")
            duration=$(jq -r '.duration_seconds' "${timing}")
            budget=$(jq -r 'if .headroom_ratio == null then "n/a" else ((.headroom_ratio * 1000 | round) / 10 | tostring) + "%" end' "${timing}")
            capacity=$(jq -r '.capacity_status' "${timing}")
            note "| ${shard} | \`${status}\` | ${duration}s | ${budget} | \`${capacity}\` |"
            if [[ "${status}" != "passed" ]]; then
              red=$((red + 1))
              echo "::error::HONUA_AFFECTED_SHARD_RED shard='${shard}' status='${status}' — this shard family is red on the pull-request head. The trailing matrix will report the same failure on trunk after this merges."
            fi
          done

          note ''
          # A PARTIAL RECEIPT SET IS NOT GREEN. `timings` being non-empty only
          # proves SOME selected shard reported; when one shard dies before
          # run-server-test-shard.sh writes its timing file and another passes,
          # every receipt present says `passed` and the naive check below would
          # call that a clean prediction of the trailing matrix. It is not --
          # the unreported family is exactly the one this lane was spending a
          # runner to learn about. Checked AFTER the table so the partial
          # evidence is still published, and after `red` is counted so a
          # confirmed red still reports as a red rather than as infrastructure.
          if [[ "${red}" -eq 0 && "${received}" -lt "${expected}" ]]; then
            note "  \`${received}\` of \`${expected}\` selected shard families reported a receipt."
            unavailable "incomplete_receipts" \
              "only ${received} of ${expected} selected shard families produced a timing receipt, so this head has no complete shard evidence." \
              "shard jobs concluded '${SHARDS_RESULT}' with ${received}/${expected} timing receipts."
          fi
          if [[ "${red}" -eq 0 ]]; then
            note "- Verdict: \`green\` — all ${received} selected shard families passed on this head."
            echo "::notice::HONUA_AFFECTED_SHARD_GREEN ${received} selected shard families passed."
            exit 0
          fi

          note "- Verdict: \`red\` — ${red} of ${received} selected shard families failed on this head."
          if [[ "${MODE}" == "enforce" ]]; then
            echo "::error::PR Gate / Affected shards: ${red} shard families are red on this head."
            exit 1
          fi
          note '  Reported only: `AFFECTED_SHARDS_MODE` is `report`, so this context stays green while'
          note '  the false-red rate is measured. Treat the rows above as a pre-merge prediction of the'
          note '  trailing matrix and fix them before landing.'
          exit 0

  required:
    # Keep the exact branch-protection context stable while both independent
    # verification paths fail closed into it.
    name: PR Gate
    if: always()
    needs: [pr-gate, format]
    runs-on: ubuntu-latest
    steps:
      - name: Require build, tests, and format
        env:
          BUILD_AND_TEST_RESULT: ${{ needs.pr-gate.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
        run: |
          if [[ "${BUILD_AND_TEST_RESULT}" != "success" || "${FORMAT_RESULT}" != "success" ]]; then
            echo "::error::PR Gate failed: build/tests=${BUILD_AND_TEST_RESULT}, format=${FORMAT_RESULT}"
            exit 1
          fi

      # This is the last step in the stable required context, after both
      # parallel verification paths have completed. It closes the interval in
      # which review evidence could be dismissed while format was still running.
      - name: Revalidate exact-head review before success
        if: env.REVIEW_FIRST_MODE == 'enforce' && github.event_name == 'pull_request' && github.run_attempt > 1
        uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request?.head?.sha;
            if (!head || head !== '${{ github.event.pull_request.head.sha }}') {
              core.setFailed('Attempt 2 has no trustworthy pull-request head.');
              return;
            }
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { ...context.repo, ref: head, per_page: 100 },
            );
            const reviewGate = statuses.find(status => status.context === 'Review Gate');
            if (reviewGate?.state !== 'success') {
              core.setFailed(`Exact-head Review Gate is ${reviewGate?.state || 'missing'}.`);
            }

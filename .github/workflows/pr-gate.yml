name: PR Gate

# The branch-protection context produced by this workflow must remain a cheap,
# unconditional per-PR floor. The authoritative broad matrix remains on the
# merge train/nightly schedule, and native-AOT image assembly runs separately
# in serving-image-boundary.yml so Docker work cannot stall this required gate.
# Do not add a paths filter: a skipped required workflow leaves PRs permanently
# waiting for a status that GitHub never creates (#2865).
on:
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  pr-gate:
    # This exact string is the branch-protection required context. Changing it
    # silently un-gates trunk or leaves pull requests waiting forever.
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # The full-solution Release build can exhaust ubuntu-latest disk once
      # every project writes bin/obj. Best-effort cleanup mirrors ci.yml.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Lean gate (build + format + fast unit/architecture smoke)
        uses: ./.github/actions/lean-gate
        with:
          trx-prefix: pr-gate

      # Exercise all clean and injected-rootfs fixtures here without building a
      # container. The separate serving-image workflow and release/deploy/nightly
      # lanes apply this detector to the final production root filesystems.
      - name: Test serving-image boundary detector
        run: |
          python3 scripts/ci/fixtures/validate-serving-image-boundary.py
          python3 scripts/ci/fixtures/validate-promote-verified-image.py

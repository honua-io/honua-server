name: Merge Train
run-name: Merge Train [${{ inputs.recovery_key || 'ordinary' }}]

# Optimistic batch merge train. DRY-RUN unless dispatched with train_apply=true.
#
# This workflow assembles a batch of ready PRs, smart-CIs the batch, and (only
# when dispatched with train_apply=true) lands it onto trunk. Scheduled runs
# and the bare dispatch default stay dry-run.
#
# DISPATCH POLICY (operator decision, 2026-08-28): automation MAY dispatch live
# trains. The train's own self-chain, the fleet stall restart, disposition
# actions, and the clean-review nudge in claude-review.yml all dispatch with
# train_apply=true. The safety boundary is NOT who dispatches; it is the
# per-PR admission ladder in select.sh (unresolved findings and standing
# objections block) plus the train:escalated label, which is the sole manual
# brake under immediate admission. The original "a human flips it live" text
# predated that decision; do not cite it to make automated dispatch dry-run.

on:
  # Cadence: dry-run report every 15 minutes (never acts).
  schedule:
    - cron: '*/15 * * * *'
  # NO workflow_run trigger. It fired on EVERY CI completion (formerly per-PR
  # runs, now the train's own batch CIs), spawning a storm of train runs that
  # thrashed the concurrency group so badly that runs were cancelled mid-batch-CI
  # wait before they could land. The 15-minute schedule is the SOLE automatic
  # driver — one clean run at a time, which always survives to land.
  # Dispatch control. This is the ONLY path that can act, and only with
  # train_apply=true — set by the operator or by approved automation (see
  # DISPATCH POLICY above).
  workflow_dispatch:
    inputs:
      train_apply:
        description: 'Actually land the batch (push/merge/comment). Leave false for a dry-run report.'
        type: boolean
        required: false
        default: false
      max_batch:
        description: 'Max PRs per batch.'
        type: string
        required: false
        default: '10'
      use_llm:
        description: 'Enable the OPTIONAL gated Bedrock LLM judgment layer (TRAIN_LLM=1). Off by default; every gate has a deterministic fallback. Requires secrets.BEDROCK_AWS_ACCESS_KEY_ID / secrets.BEDROCK_AWS_SECRET_ACCESS_KEY.'
        type: boolean
        required: false
        default: false
      use_autofix:
        description: 'Enable the OPTIONAL roll-forward AI fix-agent (TRAIN_AUTOFIX=1). Off by default. When on, a batch-introduced REAL failure (after the pre-existing filter, not a flake) is patched FORWARD by Claude via Bedrock, surgically re-verified, then landed — instead of escalating. Capped at 2 attempts; still-failing => escalate. Requires the BEDROCK_AWS_* secrets.'
        type: boolean
        required: false
        default: false
      autofix_model:
        description: 'Bedrock model id for the AI fix-agent (code edits). Default a Sonnet-class model; override per your account entitlement.'
        type: string
        required: false
        default: ''
      recovery_key:
        description: 'Internal idempotency key for durable recovery dispatches.'
        type: string
        required: false
        default: ''
      reset_state:
        description: 'RECOVERY ONLY: clear the active batch in the Merge Train State issue back to the cleared select shape, release train:landing from its members, and stop. Requires train_apply=true. Use this instead of hand-editing the machine-managed state issue; refused while a batch carries durable land intent.'
        type: boolean
        required: false
        default: false

# Serialize every state-writing controller. Live train dispatches share this
# key with rerun recovery, so their issue-body read/edit sequences cannot
# interleave. Read-only scheduled and bare-dispatch observers use a unique key:
# GitHub retains only one pending run per concurrency group, so putting those
# observers in the writer group could evict a queued recovery.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.train_apply && 'merge-train-state-writers' || format('merge-train-read-only-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write        # push the batch branch / fast-forward trunk
  packages: read         # restore private GitHub Packages during catalog generation
  pull-requests: write   # merge PRs, edit labels, comment
  actions: write         # dispatch and rerun CI runs
  issues: write          # maintain the Merge Train State issue
  id-token: write        # OIDC for AWS Bedrock (claude-code-action), when autofix on

jobs:
  train:
    name: Run Merge Train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # NOTE: do NOT put matrix.* in this job-level if: — there is no matrix on
    # this job, and a matrix.* reference in a job-level if: previously caused a
    # 0-job startup failure. This job runs on every listed trigger.
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # The FF land pushes directly to trunk, so the git push must be
          # authenticated as the merge-train PAT (a repo admin that the trunk
          # ruleset bypass covers). The default GITHUB_TOKEN pushes as
          # github-actions[bot], which has no ruleset bypass, so the push is
          # rejected with GH013 "changes must be made through a pull request".
          token: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        # REQUIRED: the train creates real commits (assemble merge commits,
        # forward-fix commits). Without an identity `git merge --no-ff -m ...`
        # fails with "empty ident name", which assemble.sh would otherwise
        # mis-report as a conflict and skip every PR. Author = repo owner.
        run: |
          git config --global user.name "Mike McDougall"
          git config --global user.email "mike@honua.io"

      - name: Set up gh + jq
        run: |
          jq --version
          gh --version

      - name: Resolve TRAIN_APPLY (dry-run unless explicitly dispatched live)
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_APPLY: ${{ github.event.inputs.train_apply }}
          DISPATCH_MAX_BATCH: ${{ github.event.inputs.max_batch }}
          DISPATCH_USE_LLM: ${{ github.event.inputs.use_llm }}
          DISPATCH_USE_AUTOFIX: ${{ github.event.inputs.use_autofix }}
          DISPATCH_AUTOFIX_MODEL: ${{ github.event.inputs.autofix_model }}
          DISPATCH_RESET_STATE: ${{ github.event.inputs.reset_state }}
          HAVE_BEDROCK_KEYS: ${{ secrets.BEDROCK_AWS_ACCESS_KEY_ID != '' && secrets.BEDROCK_AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          scripts/ci/merge-train/resolve-mode.sh "$GITHUB_OUTPUT"

      # --- Roll-forward AI fix-agent setup (autofix only) --------------------
      # These steps run ONLY when autofix is enabled (TRAIN_AUTOFIX=1), which is
      # itself only possible on an explicit live workflow_dispatch with the
      # Bedrock secrets present. They wire Claude-via-Bedrock so train.sh's
      # in-loop fix step (TRAIN_AUTOFIX_STEP_CMD -> autofix-agent.sh) can patch a
      # failing batch forward. The claude-code-action engine (its CLI) is the
      # same one anthropics/claude-code-action wraps; we install it here and
      # route it to Bedrock per docs/cloud-providers.md.
      - name: Configure AWS credentials for Bedrock (autofix)
        if: steps.mode.outputs.train_autofix == '1'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.BEDROCK_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BEDROCK_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.HONUA_BEDROCK_REGION || 'us-west-2' }}

      - name: Install Claude Code CLI (autofix fix-agent engine, Bedrock)
        if: steps.mode.outputs.train_autofix == '1'
        run: npm install -g @anthropic-ai/claude-code

      - name: Authenticate GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget update source github-honua \
            --username "${{ github.actor }}" \
            --password "${NUGET_AUTH_TOKEN}" \
            --store-password-in-clear-text

      - id: run-train
        name: Run train
        env:
          MERGE_TRAIN_TOKEN_PRESENT: ${{ secrets.MERGE_TRAIN_TOKEN != '' }}
          # MERGE_TRAIN_TOKEN is preferred: a PAT can re-trigger downstream
          # workflows (a push by GITHUB_TOKEN does NOT retrigger other
          # workflows, so CI on the batch branch would not start). Fall back to
          # GITHUB_TOKEN when the PAT is absent — acceptable for dry-run, but
          # live landing wants the PAT so the batch-branch CI actually fires.
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
          TRAIN_APPLY: ${{ steps.mode.outputs.train_apply }}
          MAX_BATCH: ${{ steps.mode.outputs.max_batch }}
          # RECOVERY ONLY. 1 clears the active batch and stops (no selection, no
          # assembly, no landing). Resolved to 0 on every automatic trigger and
          # whenever train_apply is false, so no schedule can ever reset state.
          TRAIN_RESET_STATE: ${{ steps.mode.outputs.train_reset_state }}
          # Instrumentation: the run timestamp is injected here (not generated in
          # the script) so the Step Summary, metrics JSON, and state-issue
          # aggregate all agree on a single run instant.
          TRAIN_RUN_TIMESTAMP: ${{ github.event.repository.updated_at }}
          # Write the metrics artifact into the workspace for upload below. The
          # train ALSO appends its dashboard to $GITHUB_STEP_SUMMARY directly, so
          # the Summary tab is populated even when the train selects nothing.
          TRAIN_METRICS_OUT: ${{ github.workspace }}/merge-train-metrics.json
          TRAIN_EARLY_FAILURE_RAW_OUT: ${{ github.workspace }}/merge-train-early-failure-observation.json
          # Observation only. No code path reads this evidence to cancel,
          # classify, drop, or land; #3224 requires 20 live observations before
          # a separate enforcement proposal is even eligible for review.
          TRAIN_EARLY_FAILURE_MODE: observe
          # The authoritative status read remains every 30s. While active, one
          # jobs-page read every 120s adds 25% to that request rate. Completion
          # may add one final jobs read inside the interval so the observation
          # records GitHub's exact terminal timestamp (one bounded exception per
          # run, material only for very short runs).
          TRAIN_EARLY_FAILURE_POLL_SECONDS: "120"
          # Report-only PR Gate build reuse is separately kill-switched. When
          # false/unset the selector performs no source-run lookup and Smart CI
          # receives no reuse identity.
          TRAIN_PR_GATE_BUILD_REUSE_SHADOW: ${{ vars.HONUA_PR_GATE_BUILD_REUSE_SHADOW == 'true' && 'true' || 'false' }}
          # OPTIONAL gated LLM layer. TRAIN_LLM=0 here on every default path; the
          # gates are inert and make zero Bedrock calls unless this is 1.
          TRAIN_LLM: ${{ steps.mode.outputs.train_llm }}
          # Bedrock auth via the dedicated least-privilege IAM user
          # (honua-merge-train-bedrock) access-key secrets. These are only
          # consumed by bedrock-invoke.sh when TRAIN_LLM=1; on every default
          # (deterministic) path no AWS call is made and the keys go unused.
          # bedrock-invoke.sh reads the standard AWS_* env, so exporting the
          # secrets here is all that is needed.
          AWS_ACCESS_KEY_ID: ${{ secrets.BEDROCK_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.HONUA_BEDROCK_REGION || 'us-west-2' }}
          BEDROCK_MODEL_ID: ${{ vars.HONUA_BEDROCK_MODEL_ID || 'us.anthropic.claude-haiku-4-5-20251001-v1:0' }}
          # OPTIONAL roll-forward AI fix-agent. TRAIN_AUTOFIX=0 on every default
          # path; the autofix gate is inert and the train escalates fixable
          # failures exactly like Phase 1. When 1 (explicit live dispatch +
          # Bedrock secrets), a batch-introduced REAL failure is patched forward
          # by the fix-agent (autofix-agent.sh, wired below), surgically
          # re-verified, and landed; still-failing after the cap => escalate.
          TRAIN_AUTOFIX: ${{ steps.mode.outputs.train_autofix }}
          # The fix model (code edits) — a Sonnet-class default unless overridden.
          TRAIN_AUTOFIX_MODEL: ${{ steps.mode.outputs.autofix_model != '' && steps.mode.outputs.autofix_model || (vars.HONUA_BEDROCK_AUTOFIX_MODEL_ID || 'us.anthropic.claude-sonnet-4-5-20250929-v1:0') }}
          # CLAUDE_CODE_USE_BEDROCK routes the fix-agent CLI to Bedrock (matching
          # anthropics/claude-code-action's use_bedrock:true). Only consumed when
          # TRAIN_AUTOFIX=1; ignored otherwise.
          CLAUDE_CODE_USE_BEDROCK: 1
          # The in-loop fix step: train.sh invokes this wrapper as
          # "<cmd> <batch> <request-file>". Only reached when TRAIN_AUTOFIX=1.
          TRAIN_AUTOFIX_STEP_CMD: ${{ github.workspace }}/scripts/ci/merge-train/autofix-agent.sh
        run: |
          set -euo pipefail
          # Stamp a real ISO-8601 instant (the repository updated_at above is only
          # a stable fallback; prefer a fresh UTC timestamp for this run).
          export TRAIN_RUN_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A reused workspace must never upload another controller's raw
          # observation when this run has no selected-shard failure.
          rm -f -- "${TRAIN_EARLY_FAILURE_RAW_OUT}"
          if [[ "${TRAIN_APPLY}" == "1" && "${MERGE_TRAIN_TOKEN_PRESENT}" != "true" ]]; then
            echo "::error::MERGE_TRAIN_TOKEN is required for TRAIN_APPLY=1. Set MERGE_TRAIN_TOKEN before running live mode."
            exit 1
          fi
          scripts/ci/merge-train/train.sh

      - name: Ensure Step Summary is never silent
        if: always()
        run: |
          # Defensive: if the train crashed before writing any dashboard, leave a
          # breadcrumb so a run is never an empty Summary tab.
          if [[ ! -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ]]; then
            {
              echo "## 🚂 Merge Train"
              echo ""
              echo "_The train produced no dashboard this run (it may have failed before reporting). Check the **Run train** step log above._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merge-train metrics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: merge-train-metrics
          path: |
            ${{ github.workspace }}/merge-train-metrics.json
            ${{ github.workspace }}/merge-train-early-failure-observation.json
          if-no-files-found: warn
          retention-days: 30

      # Continuous drain: GitHub throttles the */15 schedule to ~every 2h, so after
      # an APPLYING run finishes the train would otherwise sit idle for hours with
      # PRs still waiting. Instead, if selectable PRs remain, dispatch the next run
      # NOW. The `concurrency: merge-train` group (cancel-in-progress:false) makes the
      # dispatched run QUEUE behind this one and only start once it fully exits —
      # single-instance, back-to-back, no storm. The chain TERMINATES on its own:
      # every PR eventually either lands (closed → leaves the set) or is escalated
      # (train:escalated → excluded below), so when nothing is selectable we do NOT
      # re-dispatch and fall back to the schedule. Only applying runs chain (a dry-run
      # report must never spawn live runs).
      # success() (not always()): a run that FAILED (e.g. a hard error the retries
      # couldn't absorb) must NOT chain — otherwise a fast-failing run loops every
      # ~2min and hammers the API. A failed run breaks the chain; the */15 schedule
      # re-primes it. A normal run (landed / merged-through / escalated) exits 0 and
      # chains as intended.
      - name: Self-chain next run while PRs remain
        # NEVER chain off a reset-only run. `reset_state=true` clears the state
        # and exits 0 without selecting or landing; chaining here would
        # immediately dispatch an ordinary live train that could land a batch
        # the operator has not looked at yet, breaking the reset's contract.
        if: success() && steps.mode.outputs.train_apply == '1' && steps.mode.outputs.train_reset_state == '0'
        env:
          # MUST be the PAT: a `gh workflow run` authenticated with GITHUB_TOKEN does
          # NOT trigger a new workflow run (GitHub's recursion guard), so the chain
          # would silently never start. MERGE_TRAIN_TOKEN is a repo-admin PAT.
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.MERGE_TRAIN_TOKEN != '' }}
          CHAIN_MAX_BATCH: ${{ steps.mode.outputs.max_batch }}
          LANDED_THIS_RUN: ${{ steps.run-train.outputs.landed_this_run }}
        run: |
          if [[ "${HAS_PAT}" != "true" ]]; then
            echo "::warning::MERGE_TRAIN_TOKEN not set; a GITHUB_TOKEN dispatch won't trigger the next run. Self-chain skipped (schedule remains)."
            exit 0
          fi
          # Use the exact selector predicate, including live Codex re-attestation
          # and a bounded refresh of GitHub's transient mergeable=UNKNOWN state,
          # so an all-inadmissible queue cannot spin the live self-chain. Durable
          # land intent is an independent continuation reason: GitHub can report
          # the PR as OPEN for a few seconds after the trunk CAS, and cleanup must
          # not depend on some unrelated future PR becoming selectable.
          export TRAIN_APPLY=1 MAX_BATCH=1 TRAIN_REPO_ROOT="${GITHUB_WORKSPACE}"
          source scripts/ci/merge-train/lib.sh
          source scripts/ci/merge-train/state.sh
          source scripts/ci/merge-train/select.sh
          recovery_rc=1
          if train_state_requires_live_reconciliation; then recovery_rc=0; else recovery_rc=$?; fi
          if [[ "${recovery_rc}" == "2" ]]; then
            echo "::error::Durable merge-train state is unreadable; refusing to dispatch or stop silently."
            exit 1
          fi
          # Only the controller that performed the successful trunk CAS may
          # spawn the one immediate reconciliation continuation. If that
          # continuation still cannot finalize GitHub's PR projection, fail it
          # visibly and retain the durable journal rather than creating an
          # unbounded successful self-chain loop.
          # The Run train step publishes this output only after the exact
          # fast-forward CAS is observed and the corresponding durable state is
          # written. Metrics are deliberately not consulted: they are
          # best-effort observability and may be absent after a successful land.
          if [[ "${recovery_rc}" == "0" && "${LANDED_THIS_RUN:-}" != "true" ]]; then
            echo "::error::Durable land intent remains after its bounded reconciliation controller; retaining state and stopping the chain."
            exit 1
          fi
          if [[ "${recovery_rc}" == "0" ]] || train_has_selectable_pr; then
            if [[ "${recovery_rc}" == "0" ]]; then
              echo "Dispatching the next train run to reconcile durable land intent."
            else
              echo "Dispatching the next train run (continuous drain; concurrency-guarded, single-instance)."
            fi
            # A continuation is a fresh deterministic run. Optional Bedrock
            # judgment/autofix remains an operator choice for a one-off manual
            # dispatch and must never be silently re-enabled by the drain loop.
            # Preserve the operator's batch bound across the whole drain chain;
            # widening a max_batch=1 recovery to ten would admit PRs the
            # operator did not include in the bounded action.
            gh workflow run merge-train.yml --repo "${GITHUB_REPOSITORY}" --ref trunk \
              -f train_apply=true -f use_llm=false -f use_autofix=false -f max_batch="${CHAIN_MAX_BATCH}"
          else
            echo "No recovery or selectable PRs remain — chain stops; the */15 schedule remains as the backstop."
          fi

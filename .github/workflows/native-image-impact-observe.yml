name: Native Image Impact Observation

# Lightweight, report-only shadow router for #3204 and ADR-0074. It runs on
# every PR so the observation set includes both current-trigger positives and
# negatives. Existing serving/worker workflows remain authoritative until the
# documented 20-run parity threshold is met.
on:
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for an explicit observation
        required: true
        type: string
      head_sha:
        description: Head commit for an explicit observation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-image-impact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Compare native-image impact routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate selector and failure-injection fixtures
        run: |
          python3 scripts/ci/native-image-impact.py validate
          python3 -m unittest discover \
            -s tests/python/unit \
            -p 'test_native_image_impact.py' \
            -v

      - name: Observe exact diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          python3 scripts/ci/native-image-impact.py observe \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --output native-image-impact-observation.json \
            --markdown native-image-impact-summary.md
          cat native-image-impact-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain observation evidence
        uses: actions/upload-artifact@v7
        with:
          name: native-image-impact-${{ github.run_id }}
          path: |
            native-image-impact-observation.json
            native-image-impact-summary.md
          if-no-files-found: error
          retention-days: 30

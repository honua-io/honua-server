name: OGC API Maps Conformance Tests

on:
  pull_request:
    branches:
      - trunk
      - main
    paths:
      - 'src/Honua.Server/Features/OgcMaps/**'
      - 'src/Honua.Postgres/Features/Raster/**'
      - 'tests/Honua.Server.Tests/Features/OgcMaps/**'
      - 'scripts/run-ogc-maps-conformance-tests.sh'
      - '.github/workflows/ogc-maps-conformance.yml'
  push:
    branches:
      - trunk
      - main
    paths:
      - 'src/Honua.Server/Features/OgcMaps/**'
      - 'src/Honua.Postgres/Features/Raster/**'
      - 'tests/Honua.Server.Tests/Features/OgcMaps/**'
      - 'scripts/run-ogc-maps-conformance-tests.sh'
      - '.github/workflows/ogc-maps-conformance.yml'
  schedule:
    # Weekly drift check for OGC API - Maps declarations and behavior
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # For PR comments

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  ogc-maps-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-ogc-maps-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-ogc-maps-
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore tests/Honua.Server.Tests/Honua.Server.Tests.csproj

      - name: Run OGC API - Maps conformance tests
        id: run-tests
        run: |
          set +e
          timeout 1800 ./scripts/run-ogc-maps-conformance-tests.sh --configuration Release --verbose
          test_exit_code=$?
          set -e
          echo "exit_code=$test_exit_code" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Parse results
        id: parse-results
        if: always()
        run: |
          if [[ ! -f ogc-maps-results/ogc-maps-summary.md ]]; then
            echo "results_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL_TESTS=$(grep "Total Tests" ogc-maps-results/ogc-maps-summary.md | grep -o '[0-9]\+' || echo "0")
          PASSED_TESTS=$(grep "Passed" ogc-maps-results/ogc-maps-summary.md | grep -o '[0-9]\+' | head -n 1 || echo "0")
          FAILED_TESTS=$(grep "Failed" ogc-maps-results/ogc-maps-summary.md | grep -o '[0-9]\+' | head -n 1 || echo "0")
          SKIPPED_TESTS=$(grep "Skipped" ogc-maps-results/ogc-maps-summary.md | grep -o '[0-9]\+' | head -n 1 || echo "0")

          echo "total_tests=$TOTAL_TESTS" >> "$GITHUB_OUTPUT"
          echo "passed_tests=$PASSED_TESTS" >> "$GITHUB_OUTPUT"
          echo "failed_tests=$FAILED_TESTS" >> "$GITHUB_OUTPUT"
          echo "skipped_tests=$SKIPPED_TESTS" >> "$GITHUB_OUTPUT"
          echo "results_available=true" >> "$GITHUB_OUTPUT"

          # Detect conformance class coverage from TRX results
          TRX_FILE=$(find ogc-maps-results -maxdepth 2 -name "*.trx" -type f | head -1 || true)
          CORE_PASSED="false"
          COLLECTION_MAP_PASSED="false"
          DATASET_MAP_PASSED="false"
          FORMATS_PASSED="false"
          SPATIAL_PASSED="false"

          if [[ -n "$TRX_FILE" && -f "$TRX_FILE" ]]; then
            if grep -q "IncludesCoreConformance.*outcome=\"Passed\"" "$TRX_FILE" 2>/dev/null; then
              CORE_PASSED="true"
            fi
            if grep -q "IncludesCollectionMapConformance.*outcome=\"Passed\"" "$TRX_FILE" 2>/dev/null; then
              COLLECTION_MAP_PASSED="true"
            fi
            if grep -q "IncludesDatasetMapConformance.*outcome=\"Passed\"" "$TRX_FILE" 2>/dev/null; then
              DATASET_MAP_PASSED="true"
            fi
            if grep -q "IncludesFormatConformance.*outcome=\"Passed\"" "$TRX_FILE" 2>/dev/null; then
              FORMATS_PASSED="true"
            fi
            if grep -q "IncludesSpatialConformance.*outcome=\"Passed\"" "$TRX_FILE" 2>/dev/null; then
              SPATIAL_PASSED="true"
            fi
          fi

          echo "core_passed=$CORE_PASSED" >> "$GITHUB_OUTPUT"
          echo "collection_map_passed=$COLLECTION_MAP_PASSED" >> "$GITHUB_OUTPUT"
          echo "dataset_map_passed=$DATASET_MAP_PASSED" >> "$GITHUB_OUTPUT"
          echo "formats_passed=$FORMATS_PASSED" >> "$GITHUB_OUTPUT"
          echo "spatial_passed=$SPATIAL_PASSED" >> "$GITHUB_OUTPUT"

      - name: Upload OGC API - Maps artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ogc-maps-conformance-results-${{ github.run_number }}
          path: |
            ogc-maps-results/
          retention-days: 30

      - name: Comment on PR (Success)
        if: github.event_name == 'pull_request' && steps.parse-results.outputs.results_available == 'true' && steps.parse-results.outputs.failed_tests == '0'
        uses: actions/github-script@v8
        with:
          script: |
            const totalTests = '${{ steps.parse-results.outputs.total_tests }}';
            const passedTests = '${{ steps.parse-results.outputs.passed_tests }}';
            const corePass = '${{ steps.parse-results.outputs.core_passed }}' === 'true' ? 'Y' : 'N';
            const collectionMapPass = '${{ steps.parse-results.outputs.collection_map_passed }}' === 'true' ? 'Y' : 'N';
            const datasetMapPass = '${{ steps.parse-results.outputs.dataset_map_passed }}' === 'true' ? 'Y' : 'N';
            const formatsPass = '${{ steps.parse-results.outputs.formats_passed }}' === 'true' ? 'Y' : 'N';
            const spatialPass = '${{ steps.parse-results.outputs.spatial_passed }}' === 'true' ? 'Y' : 'N';

            const body = `## OGC API Maps Conformance Tests - PASSED

            ### Test Summary
            - **Total Tests**: ${totalTests}
            - **Passed**: ${passedTests}
            - **Success Rate**: 100%

            ### Conformance Classes
            - **Core**: ${corePass}
            - **Collection Map**: ${collectionMapPass}
            - **Dataset Map**: ${datasetMapPass}
            - **Formats (PNG/JPEG/TIFF)**: ${formatsPass}
            - **Spatial (CRS/Subsetting)**: ${spatialPass}

            ### Test Environment
            - **Commit**: ${context.sha.substring(0, 8)}

            **All OGC API Maps conformance tests passed successfully!**

            <details>
            <summary>View test artifacts</summary>

            Download detailed results from the [workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            </details>`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Comment on PR (Failure)
        if: github.event_name == 'pull_request' && (steps.parse-results.outputs.results_available != 'true' || steps.parse-results.outputs.failed_tests != '0')
        uses: actions/github-script@v8
        with:
          script: |
            const totalTests = '${{ steps.parse-results.outputs.total_tests }}' || '0';
            const passedTests = '${{ steps.parse-results.outputs.passed_tests }}' || '0';
            const failedTests = '${{ steps.parse-results.outputs.failed_tests }}' || 'unknown';
            const skippedTests = '${{ steps.parse-results.outputs.skipped_tests }}' || '0';

            const body = `## OGC API Maps Conformance Tests - FAILED

            ### Test Summary
            - **Total Tests**: ${totalTests}
            - **Passed**: ${passedTests}
            - **Failed**: ${failedTests}
            - **Skipped**: ${skippedTests}

            ### Next Steps
            1. Review the [detailed test results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Fix conformance issues in the implementation
            3. Re-run tests to validate fixes

            **OGC API Maps conformance validation failed. Please review and fix the issues before merging.**

            <details>
            <summary>Troubleshooting</summary>

            Common conformance issues:
            - Missing or incorrect conformance class declarations
            - Invalid map rendering responses
            - Incorrect HTTP status codes or content types
            - Missing required query parameters support (bbox, width, height)
            - Invalid spatial reference handling

            Check the workflow logs and artifacts for detailed error information.

            </details>`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail on conformance issues
        if: always()
        run: |
          if [[ "${{ steps.run-tests.outputs.exit_code }}" == "124" ]]; then
            echo "OGC API - Maps conformance tests timed out after 30 minutes"
            exit 1
          elif [[ "${{ steps.run-tests.outputs.exit_code }}" != "0" ]]; then
            echo "OGC API - Maps conformance tests failed with exit code: ${{ steps.run-tests.outputs.exit_code }}"
            exit 1
          fi

          if [[ "${{ steps.parse-results.outputs.results_available }}" != "true" ]]; then
            echo "OGC API - Maps conformance results were not produced"
            exit 1
          fi

          if [[ "${{ steps.parse-results.outputs.total_tests }}" == "0" ]]; then
            echo "No OGC API - Maps conformance tests were executed"
            exit 1
          fi

          if [[ "${{ steps.parse-results.outputs.failed_tests }}" != "0" ]]; then
            echo "OGC API - Maps conformance tests failed"
            echo "Failed tests: ${{ steps.parse-results.outputs.failed_tests }}"
            exit 1
          fi

          echo "OGC API - Maps conformance tests passed: ${{ steps.parse-results.outputs.passed_tests }}/${{ steps.parse-results.outputs.total_tests }}"

name: Regenerate Generated Files on Trunk

on:
  push:
    branches: [trunk]

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      generated: ${{ steps.commit.outputs.generated }}
    steps:
      - name: Verify generated commit provenance
        id: commit
        uses: actions/github-script@v9
        with:
          script: |
            const { data: commit } = await github.rest.git.getCommit({
              ...context.repo, commit_sha: context.sha,
            });
            const message = commit.message;
            const trailers = message.match(/^Generated-From:.*$/gm) || [];
            const source = trailers.length === 1 &&
              trailers[0].match(/^Generated-From: ([0-9a-f]{40})$/);
            const generated = message.split('\n')[0] === 'ci: regenerate generated files on trunk' &&
              Boolean(source) && commit.parents.length === 1 && commit.parents[0].sha === source[1];
            core.setOutput('generated', String(generated));

  regenerate:
    needs: provenance
    # Inherited subjects/trailers cannot suppress regeneration of a new source.
    if: needs.provenance.outputs.generated != 'true'
    # Guard before queueing: skipped self-generated events must not replace a
    # pending real merge. Each eligible writer checks out current trunk.
    concurrency:
      group: generated-files-on-trunk
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: trunk
          # Existing ruleset-bypass credential also used by merge-train.yml.
          # No GITHUB_TOKEN fallback: that identity cannot write protected trunk.
          token: ${{ secrets.MERGE_TRAIN_TOKEN }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # PR Gate already enforces analyzers. Match the trailing foundation
      # rebuild: compiler errors and generator/input validation remain hard.
      - name: Regenerate repository projections
        run: bash scripts/ci/regenerate-generated-files.sh --configuration Release /p:RunAnalyzers=false

      - name: Validate authored inputs against fresh projections
        run: |
          python3 scripts/ci/validate-cite-openapi-compliance.py
          dotnet test tests/dotnet/Honua.Architecture.Tests/Honua.Architecture.Tests.csproj \
            --configuration Release --no-build --no-restore \
            --filter 'FullyQualifiedName~FeatureCatalog|FullyQualifiedName~GeoServicesParityMatrixDriftTests|FullyQualifiedName~PublicInterfaceProofLedgerTests'

      - name: Commit changed projections once
        run: bash scripts/ci/commit-generated-files.sh --commit

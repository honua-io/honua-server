name: Regenerate Generated Files on Trunk

on:
  push:
    branches: [trunk]

permissions:
  contents: read
  packages: read

# Do not cancel a writer. Each queued run checks out current trunk, so an older
# event can never publish projections computed from its stale event SHA.
concurrency:
  group: generated-files-on-trunk
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  regenerate:
    # The merge-train credential emits push events. Require both the reserved
    # subject and provenance trailer so a similarly titled PR still regenerates.
    if: >-
      !(startsWith(github.event.head_commit.message, 'ci: regenerate generated files on trunk')
      && contains(github.event.head_commit.message, 'Generated-From: '))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: trunk
          # Existing ruleset-bypass credential also used by merge-train.yml.
          # No GITHUB_TOKEN fallback: that identity cannot write protected trunk.
          token: ${{ secrets.MERGE_TRAIN_TOKEN }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # PR Gate already enforces analyzers. Match the trailing foundation
      # rebuild: compiler errors and generator/input validation remain hard.
      - name: Regenerate repository projections
        run: bash scripts/ci/regenerate-generated-files.sh --configuration Release /p:RunAnalyzers=false

      - name: Validate authored inputs against fresh projections
        run: |
          python3 scripts/ci/validate-cite-openapi-compliance.py
          dotnet test tests/dotnet/Honua.Architecture.Tests/Honua.Architecture.Tests.csproj \
            --configuration Release --no-build --no-restore \
            --filter 'FullyQualifiedName~FeatureCatalog|FullyQualifiedName~GeoServicesParityMatrixDriftTests|FullyQualifiedName~PublicInterfaceProofLedgerTests'

      - name: Commit changed projections once
        run: bash scripts/ci/commit-generated-files.sh --commit

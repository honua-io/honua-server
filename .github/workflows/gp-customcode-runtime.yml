name: GP Custom Code Runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'docker/worker-customcode-*/**'
      - '.github/workflows/gp-customcode-runtime.yml'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gp-customcode-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  harnesses:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Python production transport and harness regression tests
        working-directory: docker/worker-customcode-python/harness
        run: |
          python -m pip install -e ".[test]"
          PYTHONPATH=. python -m pytest tests -ra --junitxml=../../../artifacts/customcode-python.xml
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
      - name: .NET production transport and harness regression tests
        run: dotnet test docker/worker-customcode-dotnet/harness/tests/Honua.CustomCode.Harness.Tests/Honua.CustomCode.Harness.Tests.csproj --configuration Release --logger 'trx;LogFileName=customcode-dotnet.trx' --results-directory artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: customcode-runtime-tests
          path: artifacts
          if-no-files-found: error

  # Both custom-code worker images build here on every change to them: every package they
  # install is hash-verified (Python requirements.lock, .NET packages.lock.json files) and the
  # .NET SDK comes from the digest-pinned SDK image, so a stale lock or pin fails this PR.
  images:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Build ${{ matrix.runtime }} worker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [python, dotnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build docker/worker-customcode-${{ matrix.runtime }}
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -f "docker/worker-customcode-${RUNTIME}/Dockerfile" \
            -t "honua-worker-customcode-${RUNTIME}:ci" .
          docker image inspect "honua-worker-customcode-${RUNTIME}:ci" --format '{{.Id}} {{.Size}}'
      - name: Verify offline .NET tool build as non-root uid 1001
        if: matrix.runtime == 'dotnet'
        run: |
          set -euo pipefail
          tar -C docker/worker-customcode-dotnet/harness --exclude='**/bin' --exclude='**/obj' --exclude='packages.lock.json' -cf - . \
            | docker run --rm -i --network=none --entrypoint /bin/sh \
                "honua-worker-customcode-dotnet:ci" \
                -c 'set -eu
                  test "$(id -u)" = "1001"
                  tar -xf - -C /work/src
                  dotnet build /work/src/samples/BufferTool/BufferTool.csproj \
                    --configuration Release \
                    --nologo \
                    --source /opt/nuget/packages \
                    -p:RestoreConfigFile=/opt/nuget/NuGet.config \
                    -p:RestoreIgnoreFailedSources=false \
                    -p:RestoreAdditionalProjectSources= \
                    -p:RestoreAdditionalProjectFallbackFolders= \
                    -p:NuGetAudit=false \
                    --output /work/build
                  test -f /work/build/BufferTool.dll'

name: GP Custom Code Runtime

on:
  pull_request:
    paths:
      - 'docker/worker-customcode-*/**'
      - '.github/workflows/gp-customcode-runtime.yml'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Python production transport and harness regression tests
        working-directory: docker/worker-customcode-python/harness
        run: |
          python -m pip install -e ".[test]"
          PYTHONPATH=. python -m pytest tests -ra --junitxml=../../../artifacts/customcode-python.xml
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: .NET production transport and harness regression tests
        run: dotnet test docker/worker-customcode-dotnet/harness/tests/Honua.CustomCode.Harness.Tests/Honua.CustomCode.Harness.Tests.csproj --configuration Release --logger 'trx;LogFileName=customcode-dotnet.trx' --results-directory artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: customcode-runtime-tests
          path: artifacts
          if-no-files-found: error

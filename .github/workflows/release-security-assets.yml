name: Release Security Assets

# Run once per published release image, after the release is cut. It produces the
# security assets that ship beside the release (OpenVEX, SPDX SBOM, Trivy verdict with
# VEX applied, and the attestation-free manifest reference used for registry copies that
# must not carry attestation layers), then registers the digest in
# eng/security/supported-images.json so security-nightly.yml rescans it every night.
# See docs/internal/security/security-patch-releases.md.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release id, e.g. 2026.1-rc.2'
        required: true
        type: string
      image:
        description: 'Published image by digest: ghcr.io/honua-io/honua-server@sha256:<digest>'
        required: true
        type: string
      platform:
        description: 'Image platform'
        type: choice
        options: [linux/amd64, linux/arm64]
        default: linux/amd64
      source_revision:
        description: 'Full server source SHA the image was built from'
        required: true
        type: string
      register:
        description: 'Push a branch that adds the digest to eng/security/supported-images.json'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-security-assets-${{ inputs.release }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  assets:
    name: Build release security assets
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      SCAN_IMAGE: ${{ inputs.image }}
      SCAN_PLATFORM: ${{ inputs.platform }}
      SCAN_REVISION: ${{ inputs.source_revision }}
      RELEASE: ${{ inputs.release }}
    outputs:
      asset_name: ${{ steps.names.outputs.asset_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify controls and requested identity
        id: names
        run: |
          set -euo pipefail
          python3 scripts/security/test-existing-image-scan.py
          python3 scripts/security/test-release-images.py
          python3 scripts/security/existing-image-scan.py validate
          if ! [[ "$RELEASE" =~ ^[0-9]{4}\.[0-9]+(\.[0-9]+)?(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Release id must look like 2026.1, 2026.1.1 or 2026.1-rc.2"
            exit 1
          fi
          echo "asset_name=honua-server-${RELEASE}-${SCAN_PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Pull the release image and bind its identity
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
          docker pull --platform "$SCAN_PLATFORM" "$SCAN_IMAGE"
          docker image inspect "$SCAN_IMAGE" > existing-image-inspect.json
          python3 scripts/security/existing-image-scan.py identity
          : > "$RUNNER_TEMP/release-empty.trivyignore"
      # Buildx provenance and SBOM attestations live in the image index beside the platform
      # manifest. Registries that reject attestation layers (the AWS Marketplace registry) get
      # a copy of the platform manifest alone; its digest is recorded here and the SBOM,
      # VEX and provenance travel as separate release assets instead.
      - name: Resolve the attestation-free platform manifest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$SCAN_IMAGE" > source-manifest.json
          if jq -e '.manifests' source-manifest.json >/dev/null; then
            digest="$(python3 scripts/security/release_images.py platform-manifest --platform "$SCAN_PLATFORM" < source-manifest.json)"
          else
            digest="${SCAN_IMAGE#*@}"
          fi
          platform_ref="ghcr.io/honua-io/honua-server@${digest}"
          docker buildx imagetools inspect --raw "$platform_ref" \
            | python3 scripts/security/release_images.py assert-single-manifest
          echo "$platform_ref" > "${{ steps.names.outputs.asset_name }}.attestation-free-ref.txt"
          echo "PLATFORM_REF=$platform_ref" >> "$GITHUB_ENV"
      - name: Generate the release OpenVEX document
        run: |
          set -euo pipefail
          images=(--image "$SCAN_IMAGE")
          if [ "$PLATFORM_REF" != "$SCAN_IMAGE" ]; then images+=(--image "$PLATFORM_REF"); fi
          python3 scripts/security/release_images.py vex-generate --name "$RELEASE" "${images[@]}" \
            --output "${{ steps.names.outputs.asset_name }}.openvex.json"
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.image }}
          format: spdx-json
          output-file: ${{ steps.names.outputs.asset_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Scan with the release VEX applied
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ inputs.platform }}
          TRIVY_VEX: ${{ steps.names.outputs.asset_name }}.openvex.json
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          scan-type: image
          image-ref: ${{ inputs.image }}
          scanners: vuln
          format: json
          output: ${{ steps.names.outputs.asset_name }}.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: ${{ runner.temp }}/release-empty.trivyignore
          exit-code: '0'
      - name: Refuse a release image with a fixable high or critical finding
        run: |
          set -euo pipefail
          name="${{ steps.names.outputs.asset_name }}"
          python3 scripts/security/release_images.py verdict --unregistered --release "$RELEASE" \
            --identity existing-image-identity.json --trivy "$name.trivy.json" --output "$name.verdict.json"
          {
            echo "## Release security assets: $name"
            echo "- Attestation-free platform manifest: \`$PLATFORM_REF\`"
            jq -r '"- Findings: \(.findingCount); documented not affected (VEX): \(.suppressedFindings|length); fixable high/critical: \(.blockingFindings|length)"' "$name.verdict.json"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.status == "pass"' "$name.verdict.json" >/dev/null
      - name: Upload release security assets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-security-assets-${{ steps.names.outputs.asset_name }}
          path: |
            ${{ steps.names.outputs.asset_name }}.openvex.json
            ${{ steps.names.outputs.asset_name }}.spdx.json
            ${{ steps.names.outputs.asset_name }}.trivy.json
            ${{ steps.names.outputs.asset_name }}.verdict.json
            ${{ steps.names.outputs.asset_name }}.attestation-free-ref.txt
          if-no-files-found: error
          retention-days: 90

  register:
    name: Register the digest for nightly rescans
    needs: assets
    if: inputs.register
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HAS_APP: ${{ secrets.HONUA_RELEASE_APP_ID != '' && secrets.HONUA_RELEASE_APP_PRIVATE_KEY != '' }}
      RELEASE: ${{ inputs.release }}
      IMAGE: ${{ inputs.image }}
      PLATFORM: ${{ inputs.platform }}
      REVISION: ${{ inputs.source_revision }}
      BRANCH: security/supported-images-${{ needs.assets.outputs.asset_name }}
    steps:
      # GitHub Actions may not open pull requests in this repository, so the release app
      # pushes a branch and the release owner opens the pull request from it.
      - name: Mint the release app token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HONUA_RELEASE_APP_ID }}
          private-key: ${{ secrets.HONUA_RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          persist-credentials: ${{ env.HAS_APP == 'true' }}
      - name: Add the digest to the supported inventory
        run: |
          set -euo pipefail
          python3 scripts/security/release_images.py inventory-add --release "$RELEASE" \
            --image "$IMAGE" --platform "$PLATFORM" --revision "$REVISION"
          python3 scripts/security/release_images.py inventory-validate
      - name: Push the registration branch
        if: env.HAS_APP == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- eng/security/supported-images.json; then
            echo "::notice::$IMAGE ($PLATFORM) is already registered."
            exit 0
          fi
          git config user.name 'honua-release[bot]'
          git config user.email 'honua-release[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -m "chore(security): register $RELEASE $PLATFORM image for nightly rescans" \
            -- eng/security/supported-images.json
          git push origin "$BRANCH"
          echo "Open a pull request from \`$BRANCH\`: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/trunk...$BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the inventory change to the release owner
        if: env.HAS_APP != 'true'
        run: |
          {
            echo "The release app secrets are not available, so no branch was pushed."
            echo "Commit this change to eng/security/supported-images.json in a pull request:"
            echo '```'
            echo "python3 scripts/security/release_images.py inventory-add --release '$RELEASE' --image '$IMAGE' --platform '$PLATFORM' --revision '$REVISION'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

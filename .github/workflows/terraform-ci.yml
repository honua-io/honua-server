name: Terraform CI/CD

on:
  push:
    branches: [trunk]
    paths: ['infrastructure/terraform/**']
  pull_request:
    branches: [trunk]
    paths: ['infrastructure/terraform/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev, staging, prod)'
        required: true
        type: choice
        options:
        - dev
        - staging
        - prod
      apply:
        description: 'Apply changes (plan only if false)'
        required: true
        type: boolean
        default: false

env:
  TERRAFORM_VERSION: '1.7.0'
  TFLINT_VERSION: '0.50.0'
  TFSEC_VERSION: '1.28.0'

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  changes:
    name: Detect Terraform Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      aws: ${{ steps.filter.outputs.aws }}
      azure: ${{ steps.filter.outputs.azure }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            terraform:
              - 'infrastructure/terraform/**/*.tf'
              - 'infrastructure/terraform/**/*.tfvars'
              - 'infrastructure/terraform/**/*.hcl'
            aws:
              - 'infrastructure/terraform/**/aws/**'
              - 'infrastructure/terraform/modules/aws-*/**'
            azure:
              - 'infrastructure/terraform/**/azure/**'
              - 'infrastructure/terraform/modules/azure-*/**'
            k8s:
              - 'infrastructure/terraform/**/k8s/**'
              - 'infrastructure/terraform/modules/k8s-*/**'

  terraform-validate:
    name: Terraform Validate & Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff infrastructure/terraform/

      - name: Terraform Validate (Root Modules)
        run: |
          for dir in infrastructure/terraform/environments/*/; do
            if [ -f "$dir/main.tf" ]; then
              echo "Validating $dir"
              cd "$dir"
              terraform init -backend=false
              terraform validate
              cd - >/dev/null
            fi
          done

      - name: Terraform Validate (Modules)
        run: |
          for dir in infrastructure/terraform/modules/*/; do
            if [ -f "$dir/main.tf" ]; then
              echo "Validating module $dir"
              cd "$dir"
              terraform init -backend=false
              terraform validate
              cd - >/dev/null
            fi
          done

  terraform-security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup TFSec
        run: |
          curl -sSL https://github.com/aquasecurity/tfsec/releases/download/v${{ env.TFSEC_VERSION }}/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec
          chmod +x /usr/local/bin/tfsec

      - name: Run TFSec Security Scan
        run: |
          tfsec infrastructure/terraform/ \
            --format sarif \
            --out tfsec-results.sarif \
            --soft-fail
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif

      - name: Run TFSec (Fail on High/Critical)
        run: |
          tfsec infrastructure/terraform/ \
            --minimum-severity HIGH \
            --format table

  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup TFLint
        run: |
          curl -sSL https://github.com/terraform-linters/tflint/releases/download/v${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip \
            -o tflint.zip
          unzip tflint.zip
          sudo mv tflint /usr/local/bin/
          chmod +x /usr/local/bin/tflint

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: |
          find infrastructure/terraform -name "*.tf" -path "*/.*" -prune -o -name "*.tf" -type f -exec dirname {} \; | \
          sort -u | \
          while read dir; do
            echo "Linting $dir"
            (cd "$dir" && tflint --format compact)
          done

  terraform-plan-aws:
    name: Plan AWS Infrastructure
    runs-on: ubuntu-latest
    needs: [changes, terraform-validate]
    if: needs.changes.outputs.aws == 'true'
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Plan (AWS Dev)
        run: |
          cd infrastructure/terraform/environments/aws-dev
          terraform init
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      - name: Upload AWS Plan
        uses: actions/upload-artifact@v7
        with:
          name: aws-terraform-plan
          path: infrastructure/terraform/environments/aws-dev/tfplan.*
          retention-days: 7

  terraform-plan-azure:
    name: Plan Azure Infrastructure
    runs-on: ubuntu-latest
    needs: [changes, terraform-validate]
    if: needs.changes.outputs.azure == 'true'
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Plan (Azure Dev)
        run: |
          cd infrastructure/terraform/environments/azure-dev
          terraform init
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      - name: Upload Azure Plan
        uses: actions/upload-artifact@v7
        with:
          name: azure-terraform-plan
          path: infrastructure/terraform/environments/azure-dev/tfplan.*
          retention-days: 7

  terraform-cost-analysis:
    name: Cost Analysis
    runs-on: ubuntu-latest
    needs: [terraform-plan-aws, terraform-plan-azure]
    if: always() && (needs.terraform-plan-aws.result == 'success' || needs.terraform-plan-azure.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Plans
        uses: actions/download-artifact@v8
        with:
          pattern: "*-terraform-plan"
          merge-multiple: true

      - name: Install Infracost
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh

      - name: AWS Cost Analysis
        if: needs.terraform-plan-aws.result == 'success'
        run: |
          export INFRACOST_API_KEY=${{ secrets.INFRACOST_API_KEY }}
          if [ -f "tfplan.json" ]; then
            /usr/local/bin/infracost breakdown --path tfplan.json --format table
            /usr/local/bin/infracost breakdown --path tfplan.json --format json --out-file aws-costs.json
          fi

      - name: Comment Cost Analysis on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let costComment = '## 💰 Infrastructure Cost Analysis\n\n';

            if (fs.existsSync('aws-costs.json')) {
              const awsCosts = JSON.parse(fs.readFileSync('aws-costs.json', 'utf8'));
              costComment += `### AWS Cost Impact\n`;
              costComment += `- **Monthly Cost:** $${awsCosts.totalMonthlyCost || '0.00'}\n`;
              costComment += `- **Hourly Cost:** $${awsCosts.totalHourlyCost || '0.00'}\n\n`;
            }

            costComment += '*Cost estimates are provided by Infracost and may vary from actual costs.*';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('Infrastructure Cost Analysis')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: costComment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: costComment
              });
            }

  terraform-apply:
    name: Apply Infrastructure Changes
    runs-on: ubuntu-latest
    needs: [terraform-plan-aws, terraform-plan-azure, terraform-security]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.apply) &&
      (needs.terraform-plan-aws.result == 'success' || needs.terraform-plan-azure.result == 'success')
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Plans
        uses: actions/download-artifact@v8
        with:
          pattern: "*-terraform-plan"
          merge-multiple: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        if: needs.terraform-plan-aws.result == 'success'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Apply AWS Changes
        if: needs.terraform-plan-aws.result == 'success'
        run: |
          cd infrastructure/terraform/environments/aws-${{ inputs.environment }}
          terraform init
          terraform apply tfplan.binary

      - name: Azure Login
        if: needs.terraform-plan-azure.result == 'success'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply Azure Changes
        if: needs.terraform-plan-azure.result == 'success'
        run: |
          cd infrastructure/terraform/environments/azure-${{ inputs.environment }}
          terraform init
          terraform apply tfplan.binary

  terraform-drift-detection:
    name: Drift Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Detect AWS Drift
        run: |
          cd infrastructure/terraform/environments/aws-prod
          terraform init
          terraform plan -detailed-exitcode || echo "Drift detected in AWS infrastructure"

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Detect Azure Drift
        run: |
          cd infrastructure/terraform/environments/azure-prod
          terraform init
          terraform plan -detailed-exitcode || echo "Drift detected in Azure infrastructure"
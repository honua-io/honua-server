name: Docs Quickstart Validation

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: docs-quickstart-validation
  cancel-in-progress: false

jobs:
  quickstart:
    name: Primary quickstart (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Execute documented quickstart
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/docs-validation/validate-quickstart.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-quickstart-validation
          path: artifacts/docs-validation/quickstart/
          if-no-files-found: warn
          retention-days: 14

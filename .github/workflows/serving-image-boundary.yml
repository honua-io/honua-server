name: Qualification Final Merged Native AOT Image Export

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged trunk commit; runtime fingerprints must match the qualified release candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: qualification-aot-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QUALIFICATION_SOURCE: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify exact source and isolated destination
        shell: bash
        run: |
          set -euo pipefail
          [[ "${QUALIFICATION_SOURCE}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${QUALIFICATION_SOURCE}"
          git fetch --no-tags origin refs/heads/trunk:refs/remotes/origin/trunk
          git merge-base --is-ancestor "${QUALIFICATION_SOURCE}" refs/remotes/origin/trunk
          test "$(git rev-parse HEAD:src)" = "82c6005cb6184160170c61be2fb1d42124aaf795"
          test "$(git rev-parse HEAD:eng)" = "b784c544bcebcdafd19c5990353dc7667b71cf28"
          test "$(git rev-parse HEAD:certification)" = "e59df170ba774fd6341ba024d237525319247dac"
          test "$(git rev-parse HEAD:docs/developer/api-specs/admin-api.json)" = "ce412eac851e8b7413db55d87de94b8fd4bff771"
          test "$(git rev-parse HEAD:docs/gis/data/feature-catalog.json)" = "ac81abde95dc6a067c14fb4364e13d7bc3a1e256"
          test "$(git rev-parse HEAD:tests/fixtures/ai-builder)" = "0642d1ec34f4565df0c5b5611917a0544752c298"
          test "$(git rev-parse HEAD:Directory.Build.props)" = "687905075c9ed074c4e7fa1fdaf0de1a8dacef2a"
          test "$(git rev-parse HEAD:Directory.Build.targets)" = "e2c297ba822937de86d1ad18662a550beddf689d"
          test "$(git rev-parse HEAD:Directory.Packages.props)" = "205ce93e9ec0aa410fbfaa46de6bec0fd910eaa6"
          test "$(git rev-parse HEAD:Honua.sln)" = "f99a9133d26817c585801327458f2abf8d14059e"
          test "$(git rev-parse HEAD:NuGet.config)" = "0b382d9cd73ebbdbcb841f1c4006eaf9beb9bf47"
          test "$(git rev-parse HEAD:.editorconfig)" = "ccb83149c6c979dd6eebc72182109d3679a4b2b2"
          test "$(git rev-parse HEAD:.dockerignore)" = "06afa624cad7541ca187d6a17baba3eb3c5161be"
          test "$(git rev-parse HEAD:docker/Dockerfile.aot)" = "a420627aa1d10b40e14d7978a92a1bdf48d01abc"
          test "$(git rev-parse HEAD:scripts/docker/restore-dotnet-with-github-packages.sh)" = "4a4a6c68ad35ac05f57fbc6b56a9eafe63cf3574"
          test -z "$(git ls-tree HEAD -- global.json)"
          test "${GITHUB_REF}" = refs/heads/qualification/aot-export-final-20261002
          echo "CANDIDATE_IMAGE=ghcr.io/honua-io/honua-server:qualification-aot-${QUALIFICATION_SOURCE}-${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production full-profile Native AOT candidate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: docker/Dockerfile.aot
          platforms: linux/amd64
          load: true
          tags: honua-server:qualification-aot
          build-args: |
            HONUA_GIT_SHA=${{ inputs.source_sha }}
            HONUA_BUILD_PROFILE=full
            RUNTIME_PACKAGE_REVISION=20261001
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-aot-amd64
          provenance: false
          sbom: false
      - name: Verify Native AOT serving-image boundary
        run: python3 scripts/ci/verify-serving-image-boundary.py --serving-image honua-server:qualification-aot
      - name: Smoke native executable
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name qualification-aot-smoke --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e HONUA_SKIP_MIGRATIONS=true \
            -e HONUA_ADMIN_PASSWORD=qualification-smoke-password \
            -e Security__ConnectionEncryption__MasterKey=0123456789abcdef0123456789abcdef \
            -e ConnectionStrings__DefaultConnection='Host=127.0.0.1;Database=honua_boundary;Username=honua;Password=honua' \
            honua-server:qualification-aot
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/healthz/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs qualification-aot-smoke
          exit 1
      - name: Export verified candidate without shipping aliases
        shell: bash
        run: |
          set -euo pipefail
          docker tag honua-server:qualification-aot "${CANDIDATE_IMAGE}"
          docker push "${CANDIDATE_IMAGE}"
          mkdir -p qualification-receipt
          docker image inspect "${CANDIDATE_IMAGE}" > qualification-receipt/image.json
          git rev-parse HEAD > qualification-receipt/source.txt
          git rev-parse HEAD:src >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:eng >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:certification >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:docs/developer/api-specs/admin-api.json >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:docs/gis/data/feature-catalog.json >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:tests/fixtures/ai-builder >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:Directory.Build.props >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:Directory.Build.targets >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:Directory.Packages.props >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:Honua.sln >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:NuGet.config >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:.editorconfig >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:.dockerignore >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:docker/Dockerfile.aot >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:scripts/docker/restore-dotnet-with-github-packages.sh >> qualification-receipt/build-input-objects.txt
          git rev-parse HEAD:docker/Dockerfile.aot > qualification-receipt/production-dockerfile-blob.txt
          docker run --rm --entrypoint dpkg-query "${CANDIDATE_IMAGE}" -W > qualification-receipt/runtime-packages.txt
          printf '%s\n' "${CANDIDATE_IMAGE}" > qualification-receipt/image-reference.txt
          printf '%s\n' 'HONUA_BUILD_PROFILE=full' 'RUNTIME_PACKAGE_REVISION=20261001' > qualification-receipt/build-arguments.txt
          printf '%s\n' "Image: ${CANDIDATE_IMAGE}" 'Actual merged-source qualification image; HTTP oracle and final measurement remain pending.' >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-aot-receipt-${{ github.run_id }}
          path: qualification-receipt/
          if-no-files-found: error
      - name: Clean exact smoke container
        if: always()
        run: docker rm -f qualification-aot-smoke || true

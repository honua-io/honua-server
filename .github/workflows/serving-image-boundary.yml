name: Qualification Native AOT Image Export

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: qualification-aot-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QUALIFICATION_SOURCE: da06c51de0bc8579601fc86bc5ddcafabaed7a70
    steps:
      - uses: actions/checkout@v7
        with:
          ref: da06c51de0bc8579601fc86bc5ddcafabaed7a70
      - name: Verify exact source and isolated destination
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QUALIFICATION_SOURCE}"
          test "${GITHUB_REF}" = refs/heads/qualification/aot-export-20261001
          echo "CANDIDATE_IMAGE=ghcr.io/honua-io/honua-server:qualification-aot-${QUALIFICATION_SOURCE}-${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"
      - name: Wait for identical serving-source native build cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            result=$(gh api repos/honua-io/honua-server/actions/jobs/110233108397)
            if test "$(jq -r .status <<< "$result")" = completed; then
              test "$(jq -r .conclusion <<< "$result")" = success
              exit 0
            fi
            sleep 30
          done
          echo 'Upstream AOT verification/cache not complete; no duplicate compiler launched.' >&2
          exit 1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production full-profile Native AOT candidate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: docker/Dockerfile.aot
          platforms: linux/amd64
          load: true
          tags: honua-server:qualification-aot
          build-args: |
            HONUA_GIT_SHA=da06c51de0bc8579601fc86bc5ddcafabaed7a70
            HONUA_BUILD_PROFILE=full
            RUNTIME_PACKAGE_REVISION=20261001
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-aot-amd64
          provenance: false
          sbom: false
      - name: Verify Native AOT serving-image boundary
        run: python3 scripts/ci/verify-serving-image-boundary.py --serving-image honua-server:qualification-aot
      - name: Smoke native executable
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name qualification-aot-smoke --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e HONUA_SKIP_MIGRATIONS=true \
            -e HONUA_ADMIN_PASSWORD=qualification-smoke-password \
            -e Security__ConnectionEncryption__MasterKey=0123456789abcdef0123456789abcdef \
            -e ConnectionStrings__DefaultConnection='Host=127.0.0.1;Database=honua_boundary;Username=honua;Password=honua' \
            honua-server:qualification-aot
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/healthz/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs qualification-aot-smoke
          exit 1
      - name: Export verified candidate without shipping aliases
        shell: bash
        run: |
          set -euo pipefail
          docker tag honua-server:qualification-aot "${CANDIDATE_IMAGE}"
          docker push "${CANDIDATE_IMAGE}"
          mkdir -p qualification-receipt
          docker image inspect "${CANDIDATE_IMAGE}" > qualification-receipt/image.json
          git rev-parse HEAD > qualification-receipt/source.txt
          git rev-parse HEAD:docker/Dockerfile.aot > qualification-receipt/production-dockerfile-blob.txt
          docker run --rm --entrypoint dpkg-query "${CANDIDATE_IMAGE}" -W > qualification-receipt/runtime-packages.txt
          printf '%s\n' "${CANDIDATE_IMAGE}" > qualification-receipt/image-reference.txt
          printf '%s\n' 'HONUA_BUILD_PROFILE=full' 'RUNTIME_PACKAGE_REVISION=20261001' > qualification-receipt/build-arguments.txt
          printf '%s\n' "Image: ${CANDIDATE_IMAGE}" 'Qualification only; HTTP oracle, merges and final measurement remain pending.' >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-aot-receipt-${{ github.run_id }}
          path: qualification-receipt/
          if-no-files-found: error
      - name: Clean exact smoke container
        if: always()
        run: docker rm -f qualification-aot-smoke || true

name: Cloud-Native-Geospatial Conformance

on:
  # Tier: nightly — external validators + a full server image build are
  # heavyweight. Run on schedule and manual dispatch only, mirroring the CITE
  # suites. See docs/internal/ci/gate-model.md.
  schedule:
    # Weekly, offset from the CITE suites (Mon/Tue) to spread runner load.
    - cron: '0 6 * * 3'
  # honua-server#4398: the validator's own unit tests were in no testpaths and in no
  # workflow, so the code that decides what the certification fragment claims was
  # itself unverified. The `validator-selftest` job below is cheap (no Docker, no
  # geospatial toolchain), so it runs on every change to the lane, not weekly.
  pull_request:
    paths:
      - 'scripts/conformance/cng/**'
      - '.github/workflows/cng-conformance.yml'
      - '.github/workflows/cng-candidate.yml'
  push:
    branches: [trunk]
    paths:
      - 'scripts/conformance/cng/**'
      - '.github/workflows/cng-conformance.yml'
      - '.github/workflows/cng-candidate.yml'
  workflow_dispatch:
    inputs:
      server_image:
        description: Exact digest-addressed candidate image; omit only for a diagnostic local build
        required: false
        type: string
      source_sha:
        description: Exact candidate server source SHA
        required: false
        type: string
      candidate_cut_at:
        description: Exact candidate cut timestamp
        required: false
        type: string

  workflow_call:
    inputs:
      harness_ref:
        required: true
        type: string
      server_image:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      candidate_cut_at:
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  # honua-server#4479: the cheap push/PR self-test must never cancel an in-flight
  # heavyweight run. A push to `trunk` touching these paths shares `refs/heads/trunk`
  # with the scheduled and dispatched lane, and the replacement push run skips the
  # `cng` job entirely (it is restricted to schedule/workflow_dispatch), so the
  # cancellation would destroy a full conformance result and produce nothing in its
  # place. Split the group by tier: self-tests serialise against self-tests, the lane
  # against the lane.
  group: cng-conformance-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.server_image != '') && 'lane' || 'selftest' }}
  cancel-in-progress: true

jobs:
  validator-selftest:
    name: CNG Validator Self-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          repository: honua-io/honua-server
          ref: ${{ inputs.harness_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Run CNG validator self-tests
        # These assert the governed assignment roster, the artifact-producer
        # attribution and the budget-profile evaluation that decides whether a
        # certification cell may pass. They import the validator module directly and
        # need none of the geospatial client toolchain the lane installs.
        run: python3 -m unittest discover -s scripts/conformance/cng -p 'test_*.py' -v

  cng:
    name: CNG Conformance
    runs-on: ubuntu-24.04
    # The lane must not run against a validator whose own tests are red.
    needs: validator-selftest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.server_image != ''
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: honua-io/honua-server
          ref: ${{ inputs.harness_ref || github.sha }}

      - name: Check out the exact candidate source for offline Honua consumers
        if: inputs.server_image != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: honua-io/honua-server
          ref: ${{ inputs.source_sha }}
          path: candidate-source

      - name: Verify candidate identity before installing tools
        if: inputs.server_image != ''
        env:
          SERVER_IMAGE: ${{ inputs.server_image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CUT_AT: ${{ inputs.candidate_cut_at }}
        run: |
          set -euo pipefail
          python3 scripts/conformance/cng/artifact-gen/candidate_identity.py validate-inputs
          actual="$(git -C candidate-source rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA"
          echo "HONUA_CNG_SOURCE_ROOT=$GITHUB_WORKSPACE/candidate-source" >> "$GITHUB_ENV"
          echo "CNG_GENERATOR_SOURCE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: '10.0.x'

      - name: Set up Go (gpq / go-pmtiles)
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Set up Node.js (3d-tiles-validator)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install validator toolchain
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" -eq 3 ]]; then
                return 1
              fi
              echo "validator install failed (attempt ${attempt}/3); retrying in $((attempt * 10))s" >&2
              sleep "$((attempt * 10))"
            done
          }
          # GeoParquet + PMTiles validators (Go).
          go install github.com/planetlabs/gpq/cmd/gpq@v0.24.0
          go install github.com/protomaps/go-pmtiles@v1.30.0
          mv "$(go env GOPATH)/bin/go-pmtiles" "$(go env GOPATH)/bin/pmtiles"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # FlatGeobuf read-back (GDAL ogrinfo).
          sudo apt-get update -qq
          sudo apt-get install -y \
            gdal-bin=3.8.4+dfsg-3ubuntu3 \
            hdf5-tools=1.10.10+repack-3.1ubuntu4 \
            curl jq
          # Canonical artifact consumers. Exact pins are evidence identities.
          python3 -m pip install \
            dask==2026.7.1 \
            fsspec==2026.7.0 \
            geopandas==1.1.4 \
            h5netcdf==1.8.1 \
            h5py==3.16.0 \
            numcodecs==0.16.5 \
            numpy==2.5.2 \
            pyarrow==25.0.1 \
            pyogrio==0.13.0 \
            pmtiles==3.7.0 \
            pystac-client==0.9.0 \
            rasterio==1.5.1 \
            rio-cogeo==7.0.2 \
            xarray==2026.7.0 \
            zarr==3.3.0
          npm install --no-save --package-lock=false flatgeobuf@4.4.0 pmtiles@4.5.0
          # 3D Tiles validator (chains the Khronos glTF validator).
          # sharp downloads libvips during this install. Retry transient transport
          # failures without changing the exact validator evidence identity.
          retry npm install -g 3d-tiles-validator@0.6.1

      - name: Run CNG conformance lane
        id: run
        env:
          SERVER_IMAGE: ${{ inputs.server_image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CUT_AT: ${{ inputs.candidate_cut_at }}
          HONUA_CNG_SKIP_BUILD: ${{ inputs.server_image != '' }}
          HONUA_CNG_CLEANUP: 'false'
          # Official OSGeo ubuntu-full image includes the Arrow/Parquet driver
          # omitted from Ubuntu's gdal-bin build. Digest is the immutable
          # ubuntu-full-latest manifest promoted on 2026-08-20.
          HONUA_CNG_GDAL_IMAGE: ghcr.io/osgeo/gdal@sha256:323828a57fd01e2f0a96ece1b2caf6b4ad41e2e47458386836697418fd67665c
          GITHUB_ACTOR: ${{ github.actor }}
          HONUA_DOCKER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          harness_sha="$(git rev-parse HEAD)"
          trap 'docker compose -f docker/cng/compose.yml down --remove-orphans --volumes >/dev/null 2>&1 || true' EXIT
          if [[ -n "$SERVER_IMAGE" ]]; then
            if [[ ! "$SERVER_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "server_image must be digest-addressed" >&2
              exit 1
            fi
            docker pull "$SERVER_IMAGE" || exit 1
            revision="$(docker image inspect "$SERVER_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            if [[ "$revision" != "$SOURCE_SHA" ]]; then
              echo "Candidate image revision $revision differs from $SOURCE_SHA" >&2
              exit 1
            fi
            docker tag "$SERVER_IMAGE" honua-server:latest
          fi
          cng_exit=0
          bash ./scripts/conformance/cng/run-cng-conformance.sh || cng_exit=$?

          if [[ -n "$SERVER_IMAGE" ]]; then
            image_digest="$SERVER_IMAGE"; image_digest="${image_digest##*@}"
            source_sha="$SOURCE_SHA"
            candidate_cut_at="$CUT_AT"
            if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ || -z "$candidate_cut_at" ]]; then
              echo "Digest-addressed dispatch requires source_sha and candidate_cut_at" >&2
              exit 1
            fi
          else
            image_digest="$(docker image inspect --format '{{.Id}}' honua-server:latest 2>/dev/null)"
            source_sha="$harness_sha"
            candidate_cut_at="$(git show -s --format=%cI HEAD)"
          fi
          client_exit=0
          python3 ./scripts/conformance/cng/validate-canonical-artifacts.py \
            --artifacts cng-results/artifacts \
            --native-results cng-results \
            --output cng-results/protocol-certification-fragment.json \
            --source-sha "$source_sha" \
            --generator-source-sha "${CNG_GENERATOR_SOURCE_SHA:-$harness_sha}" \
            --image-digest "$image_digest" \
            --candidate-cut-at "$candidate_cut_at" \
            --fixture-revision "docker/cng/seed.sql@$harness_sha" \
            --evidence-uri "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --base-url "http://localhost:8094" || client_exit=$?

          docker compose -f docker/cng/compose.yml logs --no-color honua-server \
            > cng-results/honua-server.log 2>&1 || true

          if [[ "$cng_exit" -ne 0 || "$client_exit" -ne 0 ]]; then exit_code=1; else exit_code=0; fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload CNG results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cng-conformance-results-${{ github.run_number }}
          path: |
            cng-results/
          retention-days: 30

      - name: Fail on conformance issues
        if: steps.run.outputs.exit_code != '0'
        run: |
          echo "CNG conformance lane reported validator failures."
          echo "Review cng-results/cng-summary.md and the per-validator logs."
          exit 1

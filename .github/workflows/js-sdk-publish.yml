name: Publish JS SDK Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "js-sdk-v*"

jobs:
  publish-js-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: sdk/js
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: |
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run test:playwright
          npm run verify:split-packages

      - name: Validate tag version
        if: github.event_name == 'push'
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag_version="${GITHUB_REF_NAME#js-sdk-v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match sdk/js package version ($package_version)."
            exit 1
          fi

      - name: Publish split packages
        run: |
          if [[ "${DRY_RUN}" != "true" && -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN secret is required for publishing."
            exit 1
          fi

          flags=""
          if [[ "${DRY_RUN}" == "true" ]]; then
            flags="--dry-run"
          fi

          publish_package() {
            local package_dir="$1"
            npm publish "$package_dir" --access public $flags
          }

          publish_package "./dist/packages/honua-sdk"
          publish_package "./dist/packages/honua-sdk-esri-compat"
          publish_package "./dist/packages/honua-migrate"

name: Alerting Enabled Candidate

on:
  pull_request:
    paths:
      - '.github/workflows/alerting-enabled-candidate.yml'
      - 'src/Honua.Core/Features/Alerts/**'
      - 'src/Honua.Db/Postgres/Features/Alerts/**'
      - 'src/Honua.Server/Features/Alerts/**'
      - 'src/Honua.Server/Migrations/**'
      - 'tests/dotnet/Honua.Server.Tests/Features/Alerts/AlertWebhookDeliveryE2eTests.cs'
      - 'tests/dotnet/Honua.Server.Tests/Features/Alerts/WebhookAlertDeliverySinkTests.cs'
      - 'tests/dotnet/Honua.Server.Tests/Features/Alerts/AlertNotificationRateLimiterTests.cs'
      - 'tests/dotnet/Honua.Server.Tests/Features/Alerts/AlertEvaluationHealthCheckTests.cs'
      - 'tests/dotnet/Honua.Server.Tests/Features/Alerts/AlertDispatchHealthCheckTests.cs'
      - 'tests/dotnet/Honua.Server.Tests/Features/Alerts/AlertPipelineMetricsTests.cs'
      - 'quality/alerting-enabled-candidate-scenarios.json'
      - 'tests/dotnet/Honua.Server.Tests/DatabaseShardCollections.cs'
  workflow_dispatch:
    inputs:
      candidate_source_sha:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: alerting-enabled-candidate-${{ github.event.pull_request.head.sha || inputs.candidate_source_sha }}
  cancel-in-progress: false

jobs:
  postgres-webhook-e2e:
    name: ENABLED exact candidate / Postgres webhook E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      Alerts__Enabled: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Resolve exact candidate
        id: candidate
        env:
          REQUESTED_SHA: ${{ inputs.candidate_source_sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          candidate_sha="${PR_SHA:-${REQUESTED_SHA}}"
          [[ "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_source_sha must be an exact 40-character commit SHA' >&2; exit 1; }
          echo "sha=${candidate_sha}" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}

      - name: Verify checkout identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Authenticate package restore and stamp candidate receipt
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          dotnet nuget update source github-honua \
            --username "${{ github.actor }}" \
            --password "${NUGET_AUTH_TOKEN}" \
            --store-password-in-clear-text
          mkdir -p artifacts/alerting-enabled-candidate
          printf '%s\n' "${CANDIDATE_SHA}" > artifacts/alerting-enabled-candidate/candidate-source-sha.txt

      - name: Run enabled alerting qualification scenarios
        run: |
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~AlertWebhookDeliveryE2eTests|FullyQualifiedName~WebhookAlertDeliverySinkTests|FullyQualifiedName~AlertNotificationRateLimiterTests|FullyQualifiedName~AlertEvaluationHealthCheckTests|FullyQualifiedName~AlertDispatchHealthCheckTests|FullyQualifiedName~AlertPipelineMetricsTests' \
            --logger 'trx;LogFileName=alerting-enabled-candidate.trx' \
            --results-directory artifacts/alerting-enabled-candidate \
            -m:1 /nodeReuse:false

      - name: Retain honest-red qualification scenarios
        continue-on-error: true
        run: |
          cp quality/alerting-enabled-candidate-scenarios.json \
            artifacts/alerting-enabled-candidate/scenarios.json
          jq -e 'all(.scenarios[]; .status == "green")' \
            artifacts/alerting-enabled-candidate/scenarios.json

      - name: Retain immutable candidate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerting-enabled-candidate-${{ steps.candidate.outputs.sha }}
          path: artifacts/alerting-enabled-candidate/
          if-no-files-found: error
          retention-days: 90

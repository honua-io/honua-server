name: Proto Wire Compatibility

on:
  pull_request:
    branches:
      - trunk
      - main
    paths:
      - 'src/**/Proto/**'
      - 'proto/**'
      - 'buf.yaml'
      - '.github/workflows/proto-wire-governance.yml'
  push:
    branches:
      - trunk
      - main
    paths:
      - 'src/**/Proto/**'
      - 'proto/**'
      - 'buf.yaml'
      - '.github/workflows/proto-wire-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proto-wire-breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine baseline ref
        id: baseline
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "ref=origin/${GITHUB_BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      - name: Check wire compatibility
        env:
          BUF_BASE_REF: ${{ steps.baseline.outputs.ref }}
          BUF_ALLOW_BREAKING_CHANGES: ${{ vars.BUF_ALLOW_BREAKING_CHANGES || 'false' }}
        run: |
          if [[ "${BUF_ALLOW_BREAKING_CHANGES}" == "true" ]]; then
            echo "::warning::BUF_ALLOW_BREAKING_CHANGES is set — skipping wire compatibility check."
            echo "Ensure breaking changes are documented in docs/user/CONTROL_PLANE_MIGRATION_GUIDE.md."
            exit 0
          fi

          echo "Running buf breaking change detection against ${BUF_BASE_REF}..."
          buf breaking --against ".git#ref=${BUF_BASE_REF}" --against-config buf.yaml

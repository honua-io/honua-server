name: Cross-Server Consume Nightly

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

permissions:
  contents: read
  packages: read

concurrency:
  group: cross-server-consume-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consume:
    name: Reference Server Consume
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build
        run: dotnet build Honua.sln --no-restore --configuration Release

      - name: Run cross-server consume suite
        id: consume-tests
        continue-on-error: true
        env:
          HONUA_TEST_CROSS_SERVER_CONSUME: '1'
        run: |
          mkdir -p artifacts/cross-server-consume
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~CrossServerConsume" \
            --logger "trx;LogFileName=cross-server-consume.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./artifacts/cross-server-consume

      - name: Generate gap report
        if: always() && hashFiles('artifacts/cross-server-consume/cross-server-consume.trx') != ''
        run: |
          bash scripts/ci/generate-cross-server-gap-report.sh \
            artifacts/cross-server-consume/cross-server-consume.trx \
            artifacts/cross-server-consume/gap-report.md

      - name: Write gap report summary
        if: always() && hashFiles('artifacts/cross-server-consume/gap-report.md') != ''
        run: cat artifacts/cross-server-consume/gap-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consume artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-server-consume-${{ github.run_id }}
          path: |
            artifacts/cross-server-consume/cross-server-consume.trx
            artifacts/cross-server-consume/gap-report.md

      - name: Fail on consume test failure
        if: steps.consume-tests.outcome == 'failure'
        run: exit 1

name: Security Nightly

on:
  schedule:
    # One nightly security lane for dependency, filesystem, and container scans.
    - cron: '0 2 * * *'
  # Dependency changes run only the NuGet vulnerability gate; every other job is nightly/dispatch.
  pull_request:
    paths:
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '**/*.csproj'
      - '**/packages.lock.json'
      - 'scripts/ci/check-nuget-vulnerabilities.py'
      - 'scripts/ci/check-nuget-vulnerabilities.test.py'
      - '.github/workflows/security-nightly.yml'
  workflow_dispatch:
    inputs:
      include_transitive:
        description: 'Include transitive NuGet dependencies'
        type: boolean
        default: true
      existing_image:
        description: 'Read-only scan instead of builds: ghcr.io/honua-io/honua-server@sha256:<digest>'
        type: string
        default: ''
      existing_image_platform:
        description: 'Required platform of the existing image'
        type: choice
        options: [linux/amd64, linux/arm64]
        default: linux/amd64
      existing_image_revision:
        description: 'Required full server source SHA when scanning an existing image'
        type: string
        default: ''

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Authenticate the Trivy installer's GitHub release lookup so it is not throttled by the
  # unauthenticated API rate limit (the cause of intermittent "unable to find tag" install failures).
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: security-nightly-${{ github.ref }}-${{ inputs.existing_image || 'build' }}-${{ inputs.existing_image_platform || 'default' }}
  cancel-in-progress: true

jobs:
  existing-image-scan:
    name: Scan existing immutable image
    if: github.event_name == 'workflow_dispatch' && inputs.existing_image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      SCAN_IMAGE: ${{ inputs.existing_image }}
      SCAN_PLATFORM: ${{ inputs.existing_image_platform }}
      SCAN_REVISION: ${{ inputs.existing_image_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate requested identity
        run: python3 scripts/security/existing-image-scan.py validate
      - name: Verify scan receipt controls
        run: python3 scripts/security/test-existing-image-scan.py
      - name: Pull the existing image without running it
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
          docker pull --platform "$SCAN_PLATFORM" "$SCAN_IMAGE"
          docker image inspect "$SCAN_IMAGE" > existing-image-inspect.json
          python3 scripts/security/existing-image-scan.py identity
          # The action requires a regular file; /dev/null is rejected. Use a fresh
          # empty file so no repository ignore entries affect this inventory.
          : > "$RUNNER_TEMP/existing-image-empty.trivyignore"
      - name: Scan full vulnerability inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ inputs.existing_image_platform }}
        with:
          scan-type: image
          image-ref: ${{ inputs.existing_image }}
          scanners: vuln
          format: json
          output: existing-image-trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: ${{ runner.temp }}/existing-image-empty.trivyignore
          exit-code: '0'
      - name: Bind inventory and enforce fixed high severity findings
        run: python3 scripts/security/existing-image-scan.py verdict
      - name: Retain immutable scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: existing-image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            existing-image-identity.json
            existing-image-inspect.json
            existing-image-trivy.json
            existing-image-verdict.json
          if-no-files-found: warn
          retention-days: 90

  nuget-vulnerability-scan:
    if: inputs.existing_image == ''
    name: NuGet Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify vulnerability gate parser
        run: python3 scripts/ci/check-nuget-vulnerabilities.test.py

      # NuGet audit is disabled for this restore only: under TreatWarningsAsErrors a new
      # advisory of any severity would fail restore before the gate below could apply its
      # High/Critical policy and report Moderate findings.
      - name: Restore
        run: scripts/ci/dotnet-restore-retry.sh Honua.sln -p:NuGetAudit=false

      - name: Scan for vulnerable NuGet packages
        id: nuget-scan
        env:
          INCLUDE_TRANSITIVE: ${{ github.event.inputs.include_transitive || 'true' }}
        run: |
          set -euo pipefail

          include_flag=()
          if [ "$INCLUDE_TRANSITIVE" = "true" ]; then
            include_flag+=(--include-transitive)
          fi

          # Advisory data comes from nuget.org; GitHub Packages publishes none and only adds an
          # authenticated round trip that can fail the listing.
          dotnet list Honua.sln package --vulnerable "${include_flag[@]}" \
            --source https://api.nuget.org/v3/index.json --format json > vulnerability-report.json

          # High/Critical fail; Moderate/Low are reported only. Advisories with no upstream
          # fix are risk-accepted once, as <NuGetAuditSuppress> in Directory.Build.props,
          # and the parser reads that list rather than keeping a copy here.
          status=0
          python3 scripts/ci/check-nuget-vulnerabilities.py vulnerability-report.json \
            --props Directory.Build.props --summary-json vulnerability-summary.json || status=$?

          if [ "$status" -eq 1 ]; then
            echo "vulnerable_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable_packages=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload vulnerability report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nuget-vulnerability-report-${{ github.run_number }}
          path: |
            vulnerability-report.json
            vulnerability-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Create issue on vulnerabilities
        if: github.event_name != 'pull_request' && steps.nuget-scan.outputs.vulnerable_packages == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Security Alert: High/Critical vulnerabilities detected';
            const body = `## Security Vulnerability Alert

            The nightly NuGet vulnerability scan detected high or critical vulnerabilities in project dependencies.

            **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Report**: Available in workflow artifacts

            ## Acceptance Criteria

            - Affected packages are upgraded, removed, or explicitly risk-accepted.
            - Security scan artifacts show no unresolved high or critical NuGet vulnerabilities.
            - Updated dependencies pass the normal CI gate.

            This issue was created automatically by the nightly security scan.
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Security Alert') &&
              issue.title.includes('vulnerabilities detected')
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'automated', 'high-priority']
              });
            }

  trivy-filesystem-scan:
    if: github.event_name != 'pull_request' && inputs.existing_image == ''
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Restrict SARIF generation to HIGH/CRITICAL so the GitHub Security tab carries
      # only actionable findings. The SARIF artifact uploaded below is generated by this
      # filtered step, so lower severities are intentionally not retained by this
      # workflow; re-introduce them by removing the `severity:` input on this step.
      - name: Run Trivy SARIF scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-filesystem-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload filesystem SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy-filesystem-results.sarif') != ''
        with:
          sarif_file: trivy-filesystem-results.sarif

      - name: Upload filesystem Trivy results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('trivy-filesystem-results.sarif') != ''
        with:
          name: trivy-filesystem-results-${{ github.run_number }}
          path: trivy-filesystem-results.sarif
          retention-days: 30

      - name: Fail on high or critical filesystem vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  third-party-notices-check:
    if: github.event_name != 'pull_request' && inputs.existing_image == ''
    name: Third-party notices are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify THIRD-PARTY-NOTICES.md matches Directory.Packages.props
        run: python3 scripts/ci/generate-third-party-notices.py --check

  container-security-scan:
    if: github.event_name != 'pull_request' && inputs.existing_image == ''
    name: Container Security Scan (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: jit-debian
            timeout_minutes: 30
            dockerfile: Dockerfile
            image_tag: security-test-jit
            cache_scope: honua-jit-amd64
            trivyignore: .trivyignore
          - variant: aot-alpine
            # Cold native-AOT builds have exceeded 90 minutes; match the
            # equivalent nightly AOT build's ceiling so cache export can
            # complete and subsequent security scans receive an image.
            timeout_minutes: 180
            dockerfile: docker/Dockerfile.aot
            image_tag: security-test-aot
            cache_scope: honua-aot-amd64
            trivyignore: .trivyignore-release
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR for build cache
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Hadolint
        id: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          format: sarif
          output-file: hadolint-results-${{ matrix.variant }}.sarif
          no-color: true
          failure-threshold: error

      - name: Upload Hadolint SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles(format('hadolint-results-{0}.sarif', matrix.variant)) != ''
        with:
          sarif_file: hadolint-results-${{ matrix.variant }}.sarif
          category: hadolint-${{ matrix.variant }}

      - name: Build container image for security testing
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:${{ matrix.cache_scope }}
          cache-to: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:${{ matrix.cache_scope }},mode=max
          # This image is loaded into the local Docker daemon for the
          # downstream Trivy, structure, and runtime checks. Buildx exports
          # provenance/SBOM attestations as an image index, which cannot be
          # used with `load: true`; the SPDX SBOM artifact is generated by the
          # next step after the image is available locally.
          provenance: false
          sbom: false

      # Generate an SPDX JSON SBOM artifact for the security-test image so it
      # can be archived alongside the nightly security evidence bundle.
      - name: Generate SBOM (SPDX JSON) for security-test image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}
          format: spdx-json
          output-file: sbom-security-test-${{ matrix.variant }}.spdx.json
          artifact-name: sbom-security-test-${{ matrix.variant }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # Restrict SARIF generation to HIGH/CRITICAL so the GitHub Security tab carries
      # only actionable findings. The SARIF artifact uploaded below is generated by this
      # filtered step, so lower severities are intentionally not retained by this
      # workflow; re-introduce them by removing the `severity:` input on this step.
      - name: Run container Trivy SARIF scan
        id: trivy-sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}
          format: sarif
          output: trivy-container-results-${{ matrix.variant }}.sarif
          severity: HIGH,CRITICAL
          trivyignores: ${{ matrix.trivyignore }}

      - name: Upload container Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles(format('trivy-container-results-{0}.sarif', matrix.variant)) != ''
        with:
          sarif_file: trivy-container-results-${{ matrix.variant }}.sarif
          category: trivy-container-${{ matrix.variant }}

      - name: Fail on high or critical container vulnerabilities
        id: trivy-vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: ${{ matrix.trivyignore }}

      # License policy for the serving image: Honua Server is Fair Source (FCL-1.0-ALv2)
      # and must not carry GPL/AGPL/SSPL-class components in-process. Trivy maps
      # FORBIDDEN licenses to CRITICAL and RESTRICTED (GPL, LGPL) to HIGH; the worker
      # images, which carry GDAL's LGPL/GPL system libraries as separate processes,
      # are scanned in worker-gdal-image.yml with a report-only posture.
      - name: Report image licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}
          scanners: license
          format: table
          output: trivy-licenses-${{ matrix.variant }}.txt
          exit-code: '0'

      - name: Upload image license report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-licenses-${{ matrix.variant }}
          path: trivy-licenses-${{ matrix.variant }}.txt
          retention-days: 30

      - name: Fail on restricted or forbidden licenses in the serving image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}
          scanners: license
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Install container-structure-test
        run: |
          set -euo pipefail
          curl -LO https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test

      - name: Create structure test config
        run: |
          cat > container-structure-test.yaml <<'EOF'
          schemaVersion: 2.0.0

          commandTests:
            - name: "Check binary exists and is executable"
              command: "ls"
              args: ["-la", "/app/Honua.Server"]
              expectedOutput: [".*-rwxr-xr-x.*Honua.Server"]

            - name: "Check non-root user"
              command: "whoami"
              expectedOutput: ["honua"]

            - name: "Check log directory"
              command: "test"
              args: ["-d", "/tmp/honua-logs"]

            - name: "Check cache directory"
              command: "test"
              args: ["-d", "/tmp/honua-cache"]

          fileExistenceTests:
            - name: "Application binary"
              path: "/app/Honua.Server"
              shouldExist: true
              permissions: "-rwxr-xr-x"

          metadataTest:
            exposedPorts: ["8080"]
            user: "1001:1001"
            workdir: "/app"
          EOF

      - name: Run container structure tests
        id: structure-tests
        run: |
          container-structure-test test \
            --image ${{ env.IMAGE_NAME }}:${{ matrix.image_tag }} \
            --config container-structure-test.yaml

      - name: Start container for runtime security analysis
        env:
          # A per-run database password: the Production cold start refuses the shipped
          # harness placeholders (ConfigurationValidationService.KnownPlaceholderSecrets),
          # so a fixed literal such as `honua_password` keeps the app from ever going live.
          RUNTIME_DB_PASSWORD: sec-nightly-db-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # The published image runs a Production cold start that performs the
          # PostGIS preflight and migration/schema checks. Provision an empty
          # database on a dedicated network and let the hardened app perform
          # its normal migrations before testing the running container.
          docker network create honua-runtime-net

          docker run -d \
            --name honua-runtime-db \
            --network honua-runtime-net \
            -e POSTGRES_DB=honua \
            -e POSTGRES_USER=honua \
            -e POSTGRES_PASSWORD="$RUNTIME_DB_PASSWORD" \
            postgis/postgis:16-3.4

          echo "Waiting for PostGIS to accept connections..."
          ready=false
          for _ in $(seq 1 60); do
            if docker exec honua-runtime-db pg_isready -U honua -d honua >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          # The readiness loop is authoritative. A bare `pg_isready` here under `set -e` previously
          # aborted the whole step when PostGIS's first-boot initdb bounced the server between the
          # loop's success and this check; the app container has its own connection retries + a sleep.
          if [ "$ready" != true ]; then
            echo "::error::PostGIS did not become ready in time"
            docker logs honua-runtime-db || true
            exit 1
          fi

          docker run -d \
            --name honua-runtime-test \
            --network honua-runtime-net \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e HONUA_ADMIN_PASSWORD="Sec-Nightly-${{ github.run_id }}-${{ github.run_attempt }}-Aa1!" \
            -e Security__ConnectionEncryption__MasterKey="sec-nightly-master-key-${{ github.run_id }}-${{ github.run_attempt }}-padding0000" \
            -e ConnectionStrings__DefaultConnection="Host=honua-runtime-db;Port=5432;Database=honua;Username=honua;Password=$RUNTIME_DB_PASSWORD" \
            -p 8080:8080 \
            ${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}

          ready=false
          for _ in $(seq 1 120); do
            if curl --fail --silent --max-time 2 http://localhost:8080/healthz/live >/dev/null; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' honua-runtime-test)" != true ]; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::Container did not become live after database migrations."
            docker logs honua-runtime-test || true
            exit 1
          fi

      - name: Test runtime security constraints
        id: runtime-security
        run: |
          set -euo pipefail

          if ! docker ps --filter "name=^/honua-runtime-test$" --format '{{.Names}}' | grep -q '^honua-runtime-test$'; then
            echo "Container exited before runtime checks."
            docker logs honua-runtime-test || true
            exit 1
          fi

          if ! docker exec honua-runtime-test sh -c 'touch /test-write' 2>/dev/null; then
            : # expected — read-only filesystem rejects the write
          else
            echo "::error::Container filesystem is writable; expected read-only."
            exit 1
          fi

          if ! user="$(docker exec honua-runtime-test whoami 2>&1)"; then
            echo "::error::Failed to query container user (container may have exited): $user"
            docker logs honua-runtime-test || true
            exit 1
          fi
          if [ "$user" != "honua" ]; then
            echo "Container not running as expected user: $user"
            exit 1
          fi

          curl -f http://localhost:8080/healthz/live

      - name: Cleanup runtime test
        if: always()
        run: |
          docker stop honua-runtime-test || true
          docker rm honua-runtime-test || true
          docker stop honua-runtime-db || true
          docker rm honua-runtime-db || true
          docker network rm honua-runtime-net || true

      - name: Generate container security summary
        if: always()
        run: |
          status_line() {
            name="$1"
            status="$2"
            case "$status" in
              success) echo "- ${name}: passed" ;;
              failure) echo "- ${name}: failed" ;;
              cancelled) echo "- ${name}: cancelled" ;;
              skipped) echo "- ${name}: skipped" ;;
              *) echo "- ${name}: ${status}" ;;
            esac
          }

          {
            echo "# Container Security Report"
            echo
            echo "**Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "**Commit**: ${{ github.sha }}"
            echo "**Image**: ${{ env.IMAGE_NAME }}:${{ matrix.image_tag }}"
            echo
            echo "## Checks"
            status_line "Dockerfile security analysis (Hadolint)" "${{ steps.hadolint.outcome }}"
            status_line "Container vulnerability scan (Trivy)" "${{ steps.trivy-vulnerabilities.outcome }}"
            status_line "Container structure tests" "${{ steps.structure-tests.outcome }}"
            status_line "Runtime security analysis" "${{ steps.runtime-security.outcome }}"
            echo
            echo "## Runtime features checked"
            echo "- Non-root user execution"
            echo "- Read-only filesystem"
            echo "- Minimal Linux capabilities"
            echo "- No privilege escalation"
            echo "- Liveness endpoint under constrained runtime"
          } > container-security-report-${{ matrix.variant }}.md

      - name: Upload container security artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-security-results-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            container-security-report-${{ matrix.variant }}.md
            hadolint-results-${{ matrix.variant }}.sarif
            trivy-container-results-${{ matrix.variant }}.sarif
          retention-days: 30

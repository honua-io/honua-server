name: Security Nightly

on:
  schedule:
    # One nightly security lane for dependency, filesystem, and container scans.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      include_transitive:
        description: 'Include transitive NuGet dependencies'
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: security-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuget-vulnerability-scan:
    name: NuGet Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Scan for vulnerable NuGet packages
        id: nuget-scan
        env:
          INCLUDE_TRANSITIVE: ${{ github.event.inputs.include_transitive || 'true' }}
        run: |
          set -euo pipefail

          include_flag=()
          if [ "$INCLUDE_TRANSITIVE" = "true" ]; then
            include_flag+=(--include-transitive)
          fi

          if dotnet list package --vulnerable "${include_flag[@]}" > vulnerability-report.txt 2>&1; then
            echo "scan_result=success" >> "$GITHUB_OUTPUT"
          else
            echo "scan_result=failure" >> "$GITHUB_OUTPUT"
          fi

          cat vulnerability-report.txt

          if grep -E "(High|Critical)" vulnerability-report.txt; then
            echo "vulnerable_packages=true" >> "$GITHUB_OUTPUT"
            echo "::error::High or Critical vulnerabilities found in NuGet packages"
            exit 1
          fi

          echo "vulnerable_packages=false" >> "$GITHUB_OUTPUT"
          echo "No high or critical NuGet vulnerabilities found"

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nuget-vulnerability-report-${{ github.run_number }}
          path: vulnerability-report.txt
          retention-days: 30

      - name: Create issue on vulnerabilities
        if: steps.nuget-scan.outputs.vulnerable_packages == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Security Alert: High/Critical vulnerabilities detected';
            const body = `## Security Vulnerability Alert

            The nightly NuGet vulnerability scan detected high or critical vulnerabilities in project dependencies.

            **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Report**: Available in workflow artifacts

            ## Acceptance Criteria

            - Affected packages are upgraded, removed, or explicitly risk-accepted.
            - Security scan artifacts show no unresolved high or critical NuGet vulnerabilities.
            - Updated dependencies pass the normal CI gate.

            This issue was created automatically by the nightly security scan.
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Security Alert') &&
              issue.title.includes('vulnerabilities detected')
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'automated', 'high-priority']
              });
            }

  trivy-filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Restrict SARIF generation to HIGH/CRITICAL so the GitHub Security tab carries
      # only actionable findings. The SARIF artifact uploaded below is generated by this
      # filtered step, so lower severities are intentionally not retained by this
      # workflow; re-introduce them by removing the `severity:` input on this step.
      - name: Run Trivy SARIF scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-filesystem-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload filesystem SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-filesystem-results.sarif') != ''
        with:
          sarif_file: trivy-filesystem-results.sarif

      - name: Upload filesystem Trivy results
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('trivy-filesystem-results.sarif') != ''
        with:
          name: trivy-filesystem-results-${{ github.run_number }}
          path: trivy-filesystem-results.sarif
          retention-days: 30

      - name: Fail on high or critical filesystem vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  container-security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Hadolint
        id: hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-color: true
          failure-threshold: error

      - name: Upload Hadolint SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('hadolint-results.sarif') != ''
        with:
          sarif_file: hadolint-results.sarif

      - name: Build container image for security testing
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:security-test
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha,scope=security-jit
          cache-to: type=gha,mode=max,scope=security-jit
          # This image is loaded into the local Docker daemon for the
          # downstream Trivy, structure, and runtime checks. Buildx exports
          # provenance/SBOM attestations as an image index, which cannot be
          # used with `load: true`; the SPDX SBOM artifact is generated by the
          # next step after the image is available locally.
          provenance: false
          sbom: false

      # Generate an SPDX JSON SBOM artifact for the security-test image so it
      # can be archived alongside the nightly security evidence bundle.
      - name: Generate SBOM (SPDX JSON) for security-test image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:security-test
          format: spdx-json
          output-file: sbom-security-test.spdx.json
          artifact-name: sbom-security-test.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # Restrict SARIF generation to HIGH/CRITICAL so the GitHub Security tab carries
      # only actionable findings. The SARIF artifact uploaded below is generated by this
      # filtered step, so lower severities are intentionally not retained by this
      # workflow; re-introduce them by removing the `severity:` input on this step.
      - name: Run container Trivy SARIF scan
        id: trivy-sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:security-test
          format: sarif
          output: trivy-container-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload container Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-container-results.sarif') != ''
        with:
          sarif_file: trivy-container-results.sarif

      - name: Fail on high or critical container vulnerabilities
        id: trivy-vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:security-test
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Install container-structure-test
        run: |
          set -euo pipefail
          curl -LO https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test

      - name: Create structure test config
        run: |
          cat > container-structure-test.yaml <<'EOF'
          schemaVersion: 2.0.0

          commandTests:
            - name: "Check binary exists and is executable"
              command: "ls"
              args: ["-la", "/app/Honua.Server"]
              expectedOutput: [".*-rwxr-xr-x.*Honua.Server"]

            - name: "Check non-root user"
              command: "whoami"
              expectedOutput: ["honua"]

            - name: "Check log directory"
              command: "test"
              args: ["-d", "/tmp/honua-logs"]

            - name: "Check cache directory"
              command: "test"
              args: ["-d", "/tmp/honua-cache"]

          fileExistenceTests:
            - name: "Application binary"
              path: "/app/Honua.Server"
              shouldExist: true
              permissions: "-rwxr-xr-x"

          metadataTest:
            exposedPorts: ["8080"]
            user: "1001:1001"
            workdir: "/app"
          EOF

      - name: Run container structure tests
        id: structure-tests
        run: |
          container-structure-test test \
            --image ${{ env.IMAGE_NAME }}:security-test \
            --config container-structure-test.yaml

      - name: Start container for runtime security analysis
        run: |
          set -euo pipefail

          # The published image runs a Production cold start that performs the
          # PostGIS preflight compatibility check before migrations, so a
          # reachable PostGIS database is required even when migrations are
          # skipped. Provision one on a dedicated network and point the
          # hardened app container at it by service name.
          docker network create honua-runtime-net

          docker run -d \
            --name honua-runtime-db \
            --network honua-runtime-net \
            -e POSTGRES_DB=honua \
            -e POSTGRES_USER=honua \
            -e POSTGRES_PASSWORD=honua_password \
            postgis/postgis:16-3.4

          echo "Waiting for PostGIS to accept connections..."
          for _ in $(seq 1 60); do
            if docker exec honua-runtime-db pg_isready -U honua -d honua >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec honua-runtime-db pg_isready -U honua -d honua

          docker run -d \
            --name honua-runtime-test \
            --network honua-runtime-net \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e HONUA_SKIP_MIGRATIONS=true \
            -e HONUA_ADMIN_PASSWORD="Security-Nightly-Admin-Pass1!" \
            -e Security__ConnectionEncryption__MasterKey="security-nightly-master-key-at-least-32-chars" \
            -e ConnectionStrings__DefaultConnection="Host=honua-runtime-db;Port=5432;Database=honua;Username=honua;Password=honua_password" \
            -p 8080:8080 \
            ${{ env.IMAGE_NAME }}:security-test

          sleep 10

      - name: Test runtime security constraints
        id: runtime-security
        run: |
          set -euo pipefail

          if ! docker ps --filter "name=^/honua-runtime-test$" --format '{{.Names}}' | grep -q '^honua-runtime-test$'; then
            echo "Container exited before runtime checks."
            docker logs honua-runtime-test || true
            exit 1
          fi

          if docker exec honua-runtime-test touch /test-write 2>/dev/null; then
            echo "Container filesystem is writable; expected read-only."
            exit 1
          fi

          user="$(docker exec honua-runtime-test whoami)"
          if [ "$user" != "honua" ]; then
            echo "Container not running as expected user: $user"
            exit 1
          fi

          curl -f http://localhost:8080/healthz/live

      - name: Cleanup runtime test
        if: always()
        run: |
          docker stop honua-runtime-test || true
          docker rm honua-runtime-test || true
          docker stop honua-runtime-db || true
          docker rm honua-runtime-db || true
          docker network rm honua-runtime-net || true

      - name: Generate container security summary
        if: always()
        run: |
          status_line() {
            name="$1"
            status="$2"
            case "$status" in
              success) echo "- ${name}: passed" ;;
              failure) echo "- ${name}: failed" ;;
              cancelled) echo "- ${name}: cancelled" ;;
              skipped) echo "- ${name}: skipped" ;;
              *) echo "- ${name}: ${status}" ;;
            esac
          }

          {
            echo "# Container Security Report"
            echo
            echo "**Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "**Commit**: ${{ github.sha }}"
            echo "**Image**: ${{ env.IMAGE_NAME }}:security-test"
            echo
            echo "## Checks"
            status_line "Dockerfile security analysis (Hadolint)" "${{ steps.hadolint.outcome }}"
            status_line "Container vulnerability scan (Trivy)" "${{ steps.trivy-vulnerabilities.outcome }}"
            status_line "Container structure tests" "${{ steps.structure-tests.outcome }}"
            status_line "Runtime security analysis" "${{ steps.runtime-security.outcome }}"
            echo
            echo "## Runtime features checked"
            echo "- Non-root user execution"
            echo "- Read-only filesystem"
            echo "- Minimal Linux capabilities"
            echo "- No privilege escalation"
            echo "- Liveness endpoint under constrained runtime"
          } > container-security-report.md

      - name: Upload container security artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-security-results-${{ github.run_number }}
          path: |
            container-security-report.md
            hadolint-results.sarif
            trivy-container-results.sarif
          retention-days: 30

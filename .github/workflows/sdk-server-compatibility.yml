---
# yamllint disable rule:line-length
name: SDK Server Compatibility

'on':
  workflow_dispatch:
  schedule:
    - cron: '35 8 * * 1'

permissions:
  contents: read
  packages: read

concurrency:
  group: sdk-server-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  HONUA_SERVER_BASE_URL: 'http://localhost:5000'
  HONUA_ADMIN_API_KEY: 'ci-admin-password'
  HONUA_SDK_SERVICE_ID: 'test_service'
  HONUA_SDK_LAYER_ID: '0'
  HONUA_SDK_SEED_PROFILE: 'tests/seed/base-schema.sql:test_service:layer0'
  SDK_COMPATIBILITY_TIMEOUT_SECONDS: '2400'
  SDK_COMPATIBILITY_MANIFEST: docs/developer/sdk-compatibility-versions.json

jobs:
  load-matrix:
    name: Load SDK Compatibility Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout honua-server
        uses: actions/checkout@v5

      - name: Build matrix from manifest
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          manifest="$SDK_COMPATIBILITY_MANIFEST"
          jq -e '
            . as $manifest
            | ($manifest.schemaVersion == 1)
            and ($manifest.adminApiMajor | type == "string" and length > 0)
            and ($manifest.matrixDepth == 3)
            and ($manifest.serverRefs | type == "array" and length == $manifest.matrixDepth)
            and ($manifest.sdkSetVersions | type == "array" and length == $manifest.matrixDepth)
            and all($manifest.serverRefs[]; (.label | type == "string" and length > 0) and (.ref | type == "string" and length > 0))
            and all($manifest.sdkSetVersions[]; (.label | type == "string" and length > 0) and (.refs.js | type == "string" and length > 0) and (.refs.python | type == "string" and length > 0) and (.refs.dotnet | type == "string" and length > 0))
          ' "$manifest" >/dev/null

          matrix="$(
            jq -c --arg head "$GITHUB_SHA" '
              def serverByLabel($manifest; $name):
                ($manifest.serverRefs[] | select(.label == $name)) // error("Unknown server label: " + $name);
              def sdkByLabel($manifest; $name):
                ($manifest.sdkSetVersions[] | select(.label == $name)) // error("Unknown SDK set label: " + $name);
              def checkoutRef($ref):
                  if $ref == "HEAD" then $head else $ref end;
              def cell($manifest; $status; $expectedSupported):
                  . as $cell
                  | (serverByLabel($manifest; $cell.server)) as $server
                  | (sdkByLabel($manifest; $cell.sdk)) as $sdk
                  | {
                      server_label: $server.label,
                      server_ref: $server.ref,
                      server_checkout_ref: checkoutRef($server.ref),
                      server_channel: $server.channel,
                      sdk_label: $sdk.label,
                      sdk_channel: $sdk.channel,
                      sdk_js_ref: $sdk.refs.js,
                      sdk_python_ref: $sdk.refs.python,
                      sdk_dotnet_ref: $sdk.refs.dotnet,
                      cell_status: $status,
                      expected_supported: $expectedSupported
                    };
              . as $manifest
              |
              {
                include: (
                  (($manifest.matrix.supported // []) | map(cell($manifest; "supported"; true)))
                  + (($manifest.matrix.evaluation // []) | map(cell($manifest; "evaluation"; false)))
                )
              }
            ' "$manifest"
          )"

          cell_count="$(jq '.include | length' <<<"$matrix")"
          if [ "$cell_count" -eq 0 ]; then
            echo "::error::SDK compatibility manifest produced no matrix cells."
            exit 1
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "## SDK Compatibility Matrix"
            echo
            echo "- Manifest: \`$manifest\`"
            echo "- Matrix cells: $cell_count"
          } >> "$GITHUB_STEP_SUMMARY"

  sdk-compat-matrix:
    name: ${{ matrix.server_label }} x ${{ matrix.sdk_label }} (${{ matrix.cell_status }})
    needs: load-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: ${{ matrix.expected_supported == false }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout compatibility workflow source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: compatibility-source

      - name: Preserve current compatibility runner
        shell: bash
        run: |
          set -euo pipefail
          cp compatibility-source/scripts/ci/run-sdk-server-compatibility.sh "$RUNNER_TEMP/run-sdk-server-compatibility.sh"
          chmod +x "$RUNNER_TEMP/run-sdk-server-compatibility.sh"

      - name: Checkout honua-server target
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.server_checkout_ref }}
          fetch-depth: 0

      - name: Resolve honua-server commit
        id: server-revision
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Honua Server
        uses: ./.github/actions/setup-honua-server
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          base-seed-path: tests/seed/base-schema.sql
          log-path: logs/honua-server-sdk-compat-${{ matrix.server_label }}-${{ matrix.sdk_label }}.log

      - name: Checkout honua-sdk-js
        uses: actions/checkout@v5
        with:
          repository: honua-io/honua-sdk-js
          path: sdk/honua-sdk-js
          ref: ${{ matrix.sdk_js_ref }}

      - name: Checkout honua-sdk-python
        uses: actions/checkout@v5
        with:
          repository: honua-io/honua-sdk-python
          path: sdk/honua-sdk-python
          ref: ${{ matrix.sdk_python_ref }}

      - name: Checkout honua-sdk-dotnet
        uses: actions/checkout@v5
        with:
          repository: honua-io/honua-sdk-dotnet
          path: sdk/honua-sdk-dotnet
          ref: ${{ matrix.sdk_dotnet_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdk/honua-sdk-js/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure GitHub Packages for .NET SDK
        shell: bash
        run: |
          config_file="sdk/honua-sdk-dotnet/NuGet.config"
          if [[ -f "$config_file" ]] && grep -q 'github-honua' "$config_file"; then
            dotnet nuget update source github-honua \
              --configfile "$config_file" \
              --username "${{ github.actor }}" \
              --password "${{ github.token }}" \
              --store-password-in-clear-text
          fi

      - name: Prepare isolated SDK workspaces
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="$RUNNER_TEMP/sdk-compat"
          rm -rf "$sdk_root"
          mkdir -p \
            "$sdk_root/honua-sdk-js" \
            "$sdk_root/honua-sdk-python" \
            "$sdk_root/honua-sdk-dotnet"

          cp -a sdk/honua-sdk-js/. "$sdk_root/honua-sdk-js/"
          cp -a sdk/honua-sdk-python/. "$sdk_root/honua-sdk-python/"
          cp -a sdk/honua-sdk-dotnet/. "$sdk_root/honua-sdk-dotnet/"

          {
            echo "HONUA_SDK_JS_DIR=$sdk_root/honua-sdk-js"
            echo "HONUA_SDK_PYTHON_DIR=$sdk_root/honua-sdk-python"
            echo "HONUA_SDK_DOTNET_DIR=$sdk_root/honua-sdk-dotnet"
          } >> "$GITHUB_ENV"

      - name: Run SDK live compatibility smoke tests
        id: compatibility
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p results
          set +e
          timeout --kill-after=30s "$SDK_COMPATIBILITY_TIMEOUT_SECONDS" \
            bash "$RUNNER_TEMP/run-sdk-server-compatibility.sh" \
            > results/compatibility-run.log 2>&1
          exit_code=$?
          if [ "$exit_code" -eq 124 ]; then
            printf 'SDK compatibility smoke tests timed out after %ss.\n' "$SDK_COMPATIBILITY_TIMEOUT_SECONDS" \
              >> results/compatibility-run.log
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          tail -n 200 results/compatibility-run.log || true
          exit "$exit_code"

      - name: Write compatibility result
        if: always()
        shell: bash
        env:
          SERVER_LABEL: ${{ matrix.server_label }}
          SERVER_REF: ${{ matrix.server_ref }}
          SERVER_CHECKOUT_REF: ${{ matrix.server_checkout_ref }}
          SERVER_COMMIT: ${{ steps.server-revision.outputs.commit }}
          SERVER_CHANNEL: ${{ matrix.server_channel }}
          SDK_LABEL: ${{ matrix.sdk_label }}
          SDK_CHANNEL: ${{ matrix.sdk_channel }}
          SDK_JS_REF: ${{ matrix.sdk_js_ref }}
          SDK_PYTHON_REF: ${{ matrix.sdk_python_ref }}
          SDK_DOTNET_REF: ${{ matrix.sdk_dotnet_ref }}
          CELL_STATUS: ${{ matrix.cell_status }}
          EXPECTED_SUPPORTED: ${{ matrix.expected_supported }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
          COMPATIBILITY_EXIT_CODE: ${{ steps.compatibility.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p results

          passed=false
          if [ "$COMPATIBILITY_OUTCOME" = "success" ]; then
            passed=true
          fi

          exit_code="${COMPATIBILITY_EXIT_CODE:-}"
          if [ -z "$exit_code" ]; then
            exit_code="null"
          fi

          json_version() {
            local path="$1"
            if [ -f "$path" ]; then
              jq -r '.version // "unknown"' "$path" 2>/dev/null || printf 'unknown\n'
            else
              printf 'unknown\n'
            fi
          }

          pyproject_version() {
            local path="$1"
            python - "$path" <<'PY'
          import sys
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          path = sys.argv[1]
          try:
              with open(path, "rb") as handle:
                  data = tomllib.load(handle)
              print(data.get("project", {}).get("version") or data.get("tool", {}).get("poetry", {}).get("version") or "unknown")
          except Exception:
              print("unknown")
          PY
          }

          csproj_version() {
            local path="$1"
            local property_name
            local value

            if [ -f "$path" ] && command -v dotnet >/dev/null 2>&1; then
              for property_name in PackageVersion Version VersionPrefix; do
                if value="$(dotnet msbuild "$path" -nologo -v:q -getProperty:"$property_name" 2>/dev/null)"; then
                  value="$(printf '%s\n' "$value" | awk 'NF { print; exit }')"
                  if [ -n "$value" ]; then
                    printf '%s\n' "$value"
                    return
                  fi
                fi
              done
            fi

            python - "$path" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
              for tag in ("PackageVersion", "Version", "VersionPrefix"):
                  node = root.find(f".//{tag}")
                  if node is not None and node.text and node.text.strip():
                      print(node.text.strip())
                      break
              else:
                  print("unknown")
          except Exception:
              print("unknown")
          PY
          }

          sdk_js_dir="${HONUA_SDK_JS_DIR:-sdk/honua-sdk-js}"
          sdk_python_dir="${HONUA_SDK_PYTHON_DIR:-sdk/honua-sdk-python}"
          sdk_dotnet_dir="${HONUA_SDK_DOTNET_DIR:-sdk/honua-sdk-dotnet}"

          js_package_version="$(json_version "$sdk_js_dir/package.json")"
          python_sdk_package_version="$(pyproject_version "$sdk_python_dir/packages/honua-sdk/pyproject.toml")"
          python_admin_package_version="$(pyproject_version "$sdk_python_dir/packages/honua-admin/pyproject.toml")"
          dotnet_admin_package_version="$(csproj_version "$sdk_dotnet_dir/src/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj")"
          dotnet_geoservices_package_version="$(csproj_version "$sdk_dotnet_dir/src/Honua.Sdk.GeoServices/Honua.Sdk.GeoServices.csproj")"
          dotnet_ogc_features_package_version="$(csproj_version "$sdk_dotnet_dir/src/Honua.Sdk.OgcFeatures/Honua.Sdk.OgcFeatures.csproj")"

          server_commit="${SERVER_COMMIT:-}"
          if [ -z "$server_commit" ]; then
            server_commit="$(git rev-parse HEAD 2>/dev/null || printf '%s' "$SERVER_CHECKOUT_REF")"
          fi

          failure_tail=""
          if [ "$passed" != "true" ] && [ -f results/compatibility-run.log ]; then
            failure_tail="$(tail -n 120 results/compatibility-run.log)"
          fi

          jq -n \
            --arg serverLabel "$SERVER_LABEL" \
            --arg serverRef "$SERVER_REF" \
            --arg serverCheckoutRef "$SERVER_CHECKOUT_REF" \
            --arg serverCommit "$server_commit" \
            --arg serverChannel "$SERVER_CHANNEL" \
            --arg sdkLabel "$SDK_LABEL" \
            --arg sdkChannel "$SDK_CHANNEL" \
            --arg sdkJsRef "$SDK_JS_REF" \
            --arg sdkPythonRef "$SDK_PYTHON_REF" \
            --arg sdkDotnetRef "$SDK_DOTNET_REF" \
            --arg cellStatus "$CELL_STATUS" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg seedProfile "$HONUA_SDK_SEED_PROFILE" \
            --arg serviceId "$HONUA_SDK_SERVICE_ID" \
            --arg layerId "$HONUA_SDK_LAYER_ID" \
            --arg jsPackageVersion "$js_package_version" \
            --arg pythonSdkPackageVersion "$python_sdk_package_version" \
            --arg pythonAdminPackageVersion "$python_admin_package_version" \
            --arg dotnetAdminPackageVersion "$dotnet_admin_package_version" \
            --arg dotnetGeoservicesPackageVersion "$dotnet_geoservices_package_version" \
            --arg dotnetOgcFeaturesPackageVersion "$dotnet_ogc_features_package_version" \
            --arg failureTail "$failure_tail" \
            --argjson expectedSupported "$EXPECTED_SUPPORTED" \
            --argjson passed "$passed" \
            --argjson exitCode "$exit_code" \
            '{
              server_label: $serverLabel,
              server_ref: $serverRef,
              server_checkout_ref: $serverCheckoutRef,
              server_commit: $serverCommit,
              server_image: null,
              server_channel: $serverChannel,
              server: {
                ref: $serverRef,
                commit: $serverCommit,
                image: null,
                channel: $serverChannel
              },
              sdk_label: $sdkLabel,
              sdk_channel: $sdkChannel,
              sdk_refs: {
                js: $sdkJsRef,
                python: $sdkPythonRef,
                dotnet: $sdkDotnetRef
              },
              sdk_package_versions: {
                js: {
                  package: "@honua/sdk-js",
                  version: $jsPackageVersion,
                  ref: $sdkJsRef
                },
                python: {
                  honua_sdk: $pythonSdkPackageVersion,
                  honua_admin: $pythonAdminPackageVersion,
                  ref: $sdkPythonRef
                },
                dotnet: {
                  "Honua.Sdk.Admin": $dotnetAdminPackageVersion,
                  "Honua.Sdk.GeoServices": $dotnetGeoservicesPackageVersion,
                  "Honua.Sdk.OgcFeatures": $dotnetOgcFeaturesPackageVersion,
                  ref: $sdkDotnetRef
                }
              },
              seed_profile: $seedProfile,
              service_id: $serviceId,
              layer_id: $layerId,
              protocol_surfaces: [
                "control-plane-admin",
                "platform-http",
                "geoservices-catalog",
                "feature-server",
                "ogc-api-features"
              ],
              protocol_surfaces_by_sdk: {
                js: [
                  "control-plane-admin",
                  "geoservices-catalog",
                  "feature-server",
                  "ogc-api-features"
                ],
                python: [
                  "control-plane-admin",
                  "platform-http",
                  "geoservices-catalog",
                  "feature-server"
                ],
                dotnet: [
                  "control-plane-admin"
                ]
              },
              cell_status: $cellStatus,
              expected_supported: $expectedSupported,
              passed: $passed,
              exit_code: $exitCode,
              run_id: $runId,
              run_attempt: $runAttempt,
              workflow_sha: $sha,
              failure_diagnostics: (
                if $passed then null
                else {
                  run_log: "results/compatibility-run.log",
                  server_log: ("logs/honua-server-sdk-compat-" + $serverLabel + "-" + $sdkLabel + ".log"),
                  exit_code: $exitCode,
                  log_tail: $failureTail
                }
                end
              )
            }' > results/compat-result.json

      - name: Upload SDK compatibility cell evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-compat-result-${{ matrix.server_label }}-${{ matrix.sdk_label }}-${{ github.run_id }}
          path: |
            results/compat-result.json
            results/compatibility-run.log
            logs/honua-server-sdk-compat-${{ matrix.server_label }}-${{ matrix.sdk_label }}.log
            ${{ runner.temp }}/sdk-compat/honua-sdk-js/test-results/
            ${{ runner.temp }}/sdk-compat/honua-sdk-python/.pytest_cache/
            ${{ runner.temp }}/sdk-compat/honua-sdk-dotnet/**/TestResults/
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail supported compatibility regression
        if: ${{ always() && matrix.expected_supported == true && steps.compatibility.outcome != 'success' }}
        shell: bash
        run: |
          echo "::error::Supported SDK/server compatibility cell failed: ${{ matrix.server_label }} x ${{ matrix.sdk_label }}"
          exit 1

  compatibility-report:
    name: Publish SDK Compatibility Table
    needs:
      - load-matrix
      - sdk-compat-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout honua-server
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download compatibility results
        uses: actions/download-artifact@v8
        with:
          pattern: sdk-compat-result-*-${{ github.run_id }}
          path: sdk-compat-results

      - name: Generate compatibility table
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/generate-sdk-compatibility-table.sh \
            "$SDK_COMPATIBILITY_MANIFEST" \
            sdk-compat-results \
            sdk-compat-report
          cat sdk-compat-report/sdk-compatibility-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SDK compatibility table
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-compatibility-matrix-${{ github.run_id }}
          path: |
            sdk-compat-report/sdk-compatibility-matrix.md
            sdk-compat-report/sdk-compatibility-summary.json
          retention-days: 30

      - name: Fail on supported compatibility regressions
        shell: bash
        run: jq -e '.passed == true' sdk-compat-report/sdk-compatibility-summary.json >/dev/null

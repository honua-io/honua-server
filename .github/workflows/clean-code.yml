name: Clean code

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean-code:
    uses: honua-io/.github/.github/workflows/clean-code.yml@675f8b0e58a2a19fa4da5050ed1757b16d93c2c8 # v1.1.0

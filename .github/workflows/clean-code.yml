name: Clean code

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean-code:
    uses: honua-io/.github/.github/workflows/clean-code.yml@d05acacf878e6abe755cab07bbb8f127d3802ac3 # v1.2.0 + light runner switch

name: Clean code

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean-code:
    uses: honua-io/.github/.github/workflows/clean-code.yml@fe9517f40a39eaea9caee394ba867522d9ef0d7f # v1.2.0 + light runner switch

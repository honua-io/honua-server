name: Clean code

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean-code:
    uses: honua-io/.github/.github/workflows/clean-code.yml@ac1810ad6ef51b72204898a44c0cbeee90e57914 # v1.2.0 + light runner switch

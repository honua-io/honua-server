          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        # Postgres-compat only runs Honua.Postgres.Tests; restoring the full
        # solution was unnecessary work that scaled with every project added
        # to the repo. dotnet auto-restores transitive ProjectReferences.
        run: scripts/ci/dotnet-restore-retry.sh tests/dotnet/Honua.Db.Postgres.Tests/Honua.Postgres.Tests.csproj

      - name: Build
        # Same scoping rationale as the restore above — dotnet builds
        # transitive ProjectReferences from this csproj so Honua.Core,
        # Honua.Core.Abstractions, Honua.Postgres, Honua.ServiceDefaults,
        # and Honua.TestKit all build as needed; unrelated projects
        # (Server, DuckDB, SqlServer, MySql, Worker.Gdal, samples,
        # benchmarks, sibling test projects) stay out of the build graph.
        run: dotnet build tests/dotnet/Honua.Db.Postgres.Tests/Honua.Postgres.Tests.csproj --configuration Release --no-restore

      - name: Run Postgres compatibility tests
        env:
          HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
          HONUA_TEST_CONFIGURATION: Release
          COLLECT_COVERAGE: ${{ matrix.collect_coverage }}
          PG_IMAGE: ${{ matrix.pg_image }}
          # Inner test budget, split from the job-level timeout-minutes the
          # same way .github/ci-shards.json splits test_timeout_minutes from
          # timeout_minutes. Healthy legs finish in well under a minute
          # (33-36s observed across runs), so 10 minutes is ~17x headroom
          # while the 30-minute job cap stays reserved for checkout, restore,
          # build and artifact upload. Run 33109819708 hung the 16-3.4 leg for
          # 24.4 minutes until the job cap killed it — siblings passed in ~34s
          # — and rejected a whole merge-train batch; the inner bound turns
          # that hang into a fast failure that names the image and leaves a
          # complete log.
          TEST_TIMEOUT_MINUTES: "10"
        run: |
          test_args=(
            dotnet test tests/dotnet/Honua.Db.Postgres.Tests/Honua.Postgres.Tests.csproj
            --configuration Release
            --no-build
            --logger "console;verbosity=detailed"
            --results-directory ./tests/TestResults
          )
          if [ "${COLLECT_COVERAGE}" = "true" ]; then
            test_args+=(--collect:"XPlat Code Coverage" --settings coverlet.runsettings)
          fi
          rc=0
          start="${SECONDS}"
          timeout --kill-after=30s "${TEST_TIMEOUT_MINUTES}m" "${test_args[@]}" || rc=$?
          elapsed=$(( SECONDS - start ))
          # rc 124: `timeout` sent SIGTERM at the deadline — a proven inner
          # timeout. rc 137 alone is NOT proof: GNU timeout reports 137 both
          # when its own --kill-after SIGKILL fires (SIGTERM was ignored) and
          # when the command is SIGKILLed from outside (e.g. the OOM killer)
          # well before the deadline. Elapsed time disambiguates: the wrapper
          # cannot deliver any KILL before the budget has elapsed, so a 137
          # at/after the deadline is the kill-after path while an early 137 is
          # an external SIGKILL and must not carry the inner-timeout marker —
          # the merge-train classifier would otherwise route runner resource
          # loss through the leg-flake/leg-hang rule (and, on the common
          # single-leg baseline matrix, attribute it to a PR).
          if [ "${rc}" -eq 124 ] || { [ "${rc}" -eq 137 ] && [ "${elapsed}" -ge $(( TEST_TIMEOUT_MINUTES * 60 )) ]; }; then
            echo "::error::HONUA_MATRIX_LEG_INNER_TIMEOUT image='${PG_IMAGE}' step='Run Postgres compatibility tests' exceeded its ${TEST_TIMEOUT_MINUTES}m inner test budget (healthy legs finish in under a minute); killed early instead of burning the job cap."
            exit 124
          fi
          if [ "${rc}" -eq 137 ]; then
            echo "::error::dotnet test for image '${PG_IMAGE}' died from SIGKILL after ${elapsed}s, before its ${TEST_TIMEOUT_MINUTES}m inner test budget elapsed. That signal came from outside the timeout wrapper (suspect the OOM killer), so this is runner resource loss, not evidence of an inner timeout."
            exit "${rc}"
          fi
          exit "${rc}"

      - name: Upload Postgres coverage (cobertura)
        uses: actions/upload-artifact@v7.0.1
        if: ${{ always() && matrix.collect_coverage }}
        timeout-minutes: 3
        with:
          name: postgres-coverage-${{ matrix.pg_suffix }}
          path: tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Postgres coverage to Codecov
        if: ${{ always() && matrix.collect_coverage && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/TestResults/**/coverage.cobertura.xml
          flags: postgres-${{ matrix.pg_suffix }}
          name: postgres-compat
          fail_ci_if_error: false

  core-package-compatibility:
    name: Honua.Core Package Compatibility
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.build_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        # Scoped to Honua.Core's transitive ProjectReferences; the package
        # job only pack's Honua.Core. Full-sln restore was over-fetching
        # for the entire repo every run.
        run: scripts/ci/dotnet-restore-retry.sh src/Honua.Core/Honua.Core.csproj

      - name: Build Honua.Core package
        run: |
          package_version="0.0.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          # Honua.Core's package takes a dependency on Honua.Core.Abstractions
          # (the Phase-0 contract split), so the compatibility consumer can only
          # restore Honua.Core if Honua.Core.Abstractions is in the same feed.
          # Pack both at the same version.
          dotnet pack src/Honua.Core.Abstractions/Honua.Core.Abstractions.csproj \
            --configuration Release \
            --output ./packages \
            --no-restore \
            -p:PackageVersion="${package_version}" \
            -p:Version="${package_version}"
          dotnet pack src/Honua.Core/Honua.Core.csproj \
            --configuration Release \
            --output ./packages \
            --no-restore \
            -p:PackageVersion="${package_version}" \
            -p:Version="${package_version}"

      - name: Test package integration
        run: |
          mkdir -p package-test
          cd package-test
          dotnet new console

          PACKAGE_SOURCE="$(realpath ../packages)"
          cat > NuGet.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-packages" value="${PACKAGE_SOURCE}" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="github-honua" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github-honua>
                <add key="Username" value="${{ github.actor }}" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </github-honua>
            </packageSourceCredentials>
            <packageSourceMapping>
              <packageSource key="local-packages">
                <package pattern="Honua.Core*" />
              </packageSource>
              <packageSource key="github-honua">
                <package pattern="Geospatial.Grpc" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          # Keep the temporary consumer independent from repository CPM.
          cat > Directory.Packages.props <<EOF
          <Project>
            <PropertyGroup>
              <ManagePackageVersionsCentrally>false</ManagePackageVersionsCentrally>
            </PropertyGroup>
          </Project>
          EOF

          # Add package under test
          VERSION=$(basename "$(ls ../packages/Honua.Core*.nupkg | head -1)" | sed -E 's/^Honua\.Core\.([0-9A-Za-z.-]+)\.nupkg$/\1/')
          dotnet add package Honua.Core --version "$VERSION"

          # Test build
          dotnet build --configuration Release

      - name: Validate server compatibility
        run: |
          # Build server with SDK packages to ensure no conflicts
          scripts/ci/dotnet-restore-retry.sh src/Honua.Server/Honua.Server.csproj
          dotnet build src/Honua.Server/Honua.Server.csproj --configuration Release --no-restore

  aot-build:
    name: AOT Build Verification
    # NOT gated on `full_ci` (#3204). A merge-train batch is dispatched as
    # `workflow_dispatch` on `train/batch/*` WITHOUT `full_ci=true`, which the
    # `changes` job classifies as a selective batch and reports `full_ci=false`.
    # While this job required `full_ci == 'true'` it therefore never ran on the
    # ordinary landing path - the only pre-merge native-AOT compile signal for a
    # source change was `serving-image-boundary.yml` building the AOT images on
    # every push, which #3204 narrowed to image-defining inputs. Requiring only
    # the change classes it actually depends on keeps AOT compile risk pre-merge
    # at BATCH granularity: once per landing batch instead of three container
    # builds per review-fix push. It runs alongside the shard matrix (p90 88.6m)
    # under a 45-minute ceiling, so it is not expected to extend the batch
    # critical path.
    if: ${{ success() && needs.changes.outputs.integration_changes == 'true' && needs.changes.outputs.non_test_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes, core-package-compatibility, postgres-compat]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        # Scoped to Honua.Server's transitive ProjectReferences; the AOT
        # publish only targets Honua.Server. Full-sln restore was
        # over-fetching every other project's package set every run.
        run: scripts/ci/dotnet-restore-retry.sh src/Honua.Server/Honua.Server.csproj

      - name: Publish AOT
        run: |
          dotnet publish Honua.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            -p:PublishAot=true \
            -p:HonuaSkipAdminClientForAotVerification=true \
            -p:HonuaSkipOracleForAotVerification=true \
            -p:HonuaSkipSnowflakeForAotVerification=true \
            -p:HonuaIncludeStacOpsDemo=false \
            -p:StripSymbols=true \
            -o ./publish
        working-directory: src/Honua.Server

      - name: Verify Binary Size
        run: |
          SIZE=$(stat --printf="%s" ./publish/Honua.Server 2>/dev/null || echo "0")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"

          # Warn if over 100MB (target from MVP_PLAN)
          if [ "$SIZE_MB" -gt 100 ]; then
            echo "::warning::AOT binary ${SIZE_MB}MB exceeds 100MB target"
          fi
        working-directory: src/Honua.Server

  docker-build:
    name: Docker Build & Integration Test
    if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.full_ci == 'true' && needs.changes.outputs.integration_changes == 'true' && needs.changes.outputs.non_test_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: changes
    # A cold BuildKit build consumed 13m45s in run 29088883576, leaving no
    # time for the filesystem scan or endpoint proof. Keep the whole gate
    # bounded while allowing every release-evidence step to execute (#2634).
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Pre-pull BuildKit image with retries
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull moby/buildkit:buildx-stable-1; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Failed to pre-pull moby/buildkit:buildx-stable-1 after retries."
          exit 1

      - name: Set up Docker Buildx
        timeout-minutes: 3
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for build cache
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: docker_build
        timeout-minutes: 20
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: honua-server:test
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          # Shared with every other lane that builds ./Dockerfile for linux/amd64
          # (security-nightly, the cite-* suites, deploy.yml's jit amd64 leg). These
          # produce identical layers; the only build-arg that differs between them is
          # HONUA_GIT_SHA, declared at Dockerfile:188 of 208 in the runtime stage,
          # after every expensive layer.
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-jit-amd64
          cache-to: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-jit-amd64,mode=max
          # provenance/sbom must be false for `load: true` — the local docker exporter
          # can't load a manifest list. SBOM is generated separately via Anchore below.
          provenance: false
          sbom: false

      # Generate an SPDX JSON SBOM for the freshly built image and upload it
      # as a workflow artifact so PR reviewers (and downstream supply-chain
      # tooling) can inspect the bill of materials without having to pull the
      # image registry attestation. Required by audit gate A -> A+.
      - name: Generate SBOM (SPDX JSON) for honua-server:test
        id: sbom
        timeout-minutes: 3
        uses: anchore/sbom-action@v0
        with:
          image: honua-server:test
          format: spdx-json
          output-file: sbom-honua-server-test.spdx.json
          artifact-name: sbom-honua-server-test.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # Run Trivy against the image we just built locally (no double-build:
      # we reuse honua-server:test that the build-push step `load: true`'d
      # into the docker daemon). Fail full CI on any HIGH/CRITICAL CVE that
      # already has a fix available upstream.
      - name: Trivy image scan (full CI, HIGH/CRITICAL, fixed only)
        id: trivy_image
        timeout-minutes: 5
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: honua-server:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          vuln-type: os,library

      # Filesystem scan catches CVEs introduced by the Dockerfile base image
      # / package manifests / lockfiles that the image scan may miss when a
      # vulnerable dependency hasn't shipped to a release artifact yet.
      - name: Trivy filesystem scan (full CI, HIGH/CRITICAL, fixed only)
        id: trivy_fs
        if: always()
        timeout-minutes: 5
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          vuln-type: os,library

      - name: Trivy failure guidance
        if: failure() && (steps.trivy_image.outcome == 'failure' || steps.trivy_fs.outcome == 'failure')
        run: |
          echo "::error title=Trivy full CI gate failed::One or more HIGH/CRITICAL CVEs with available fixes were detected."
          echo "::notice::To resolve: review the Trivy output above, then bump the affected dependency / base image to a fixed version. If a CVE is a false positive, add an entry to .trivyignore with a justification and CVE link."
          exit 1

      - name: Run Docker container
        timeout-minutes: 3
        run: |
          docker run -d \
            --name honua-test \
            --network host \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Database=honua_test;Username=honua;Password=honua" \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e HONUA_ADMIN_PASSWORD=ci-docker-admin-password \
            -e Security__ConnectionEncryption__MasterKey="0123456789abcdef0123456789abcdef" \
            -p 8080:8080 \
            honua-server:test

          # Wait for container to start
          sleep 10

          # Health check
          live_success=false
          for i in {1..30}; do
            if curl -f http://localhost:8080/healthz/live; then
              echo "Container started successfully"
              live_success=true
              break
            fi
            sleep 2
          done

          if [ "$live_success" != "true" ]; then
            echo "Container failed liveness probe"
            exit 1
          fi

      - name: Test Docker container endpoints
        timeout-minutes: 2
        run: |
          # Test basic endpoints
          curl --retry 15 --retry-delay 2 --retry-connrefused -f http://localhost:8080/healthz/ready
          curl --retry 5 --retry-delay 2 --retry-connrefused -f http://localhost:8080/openapi.json

          # Test API endpoints
          curl -f "http://localhost:8080/api/admin/health" || true

      - name: Container logs
        if: always()
        timeout-minutes: 2
        run: docker logs honua-test || true

      - name: Cleanup
        if: always()
        timeout-minutes: 2
        run: |
          docker stop honua-test || true
          docker rm honua-test || true

  quickstart-console-smoke:
    name: Quickstart Console Compose Smoke
    if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.full_ci == 'true' && needs.changes.outputs.integration_changes == 'true' && needs.changes.outputs.non_test_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve Console image
        id: console_image
        env:
          INPUT_CONSOLE_IMAGE: ${{ github.event.inputs.console_image || '' }}
          VAR_CONSOLE_IMAGE: ${{ vars.HONUA_CONSOLE_IMAGE || '' }}
        run: |
          set -euo pipefail
          image="${INPUT_CONSOLE_IMAGE:-${VAR_CONSOLE_IMAGE:-}}"
          if [ -z "${image}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HONUA_CONSOLE_IMAGE is not configured; skipping quickstart Console compose smoke until a compatible image is published."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Run quickstart Console compose smoke
        if: steps.console_image.outputs.enabled == 'true'
        env:
          HONUA_CONSOLE_IMAGE: ${{ steps.console_image.outputs.image }}
        run: bash scripts/ci/smoke-quickstart-console.sh

  # ===========================================================================
  # LEAN MERGE-QUEUE GATE
  # ===========================================================================
  # Runs ONLY on merge_group (the batched/combined commit GitHub forms from the
  # queued PRs). It is the queue's REQUIRED status check — set branch
  # protection / ruleset 17808547's merge_group required check to "Merge Queue
  # Gate", NOT "CI Gate". It is deliberately LEAN: build (warnings-as-errors) +
  # format + the Fast/architecture unit smoke. It does NOT run AOT, docker, the
  # Server Tests shard matrix, the browser/MCP/Postgres lanes, or any
  # integration suite — those already gated each PR on its own run before the PR
  # entered the queue (today that is `PR Gate` from pr-gate.yml). The queue only
  # needs to catch SEMANTIC conflicts introduced by BATCHING (e.g. two PRs that
  # each compile alone but not together, a format drift, an architecture-rule
  # break). Keeping it lean is the fix for the 2026-06-18 runner-starvation
  # spiral: a batch of 5 no longer fans out to ~225 concurrent jobs, so the
  # group finishes inside check_response_timeout_minutes and the front PR is not
  # ejected.
  #
  # DORMANT: the GitHub merge queue is disabled (2026-06-18) and re-enabling it
  # is an explicit non-goal (#2865), so this job does not currently fire. Its
  # steps are shared with the live per-PR `PR Gate` job via
  # ./.github/actions/lean-gate — one definition, so the dormant copy cannot
  # rot away from the live one.
  merge-queue-gate:
    name: Merge Queue Gate
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      # Mirror the build job's disk reclaim — the full-solution build can
      # exhaust ubuntu-latest disk once every project writes Release outputs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Lean gate (build + format + fast unit/architecture smoke)
        uses: ./.github/actions/lean-gate
        with:
          trx-prefix: merge-queue
          # Stays FULL while `PR Gate` narrows to `affected`. A batched
          # merge_group commit's diff base is the queue base rather than a single
          # PR, so an affected-projects computation here is not trustworthy — and
          # this full-solution compile is precisely the backstop that makes the
          # per-PR narrowing safe. Do not "align" the two callers.
          build-scope: full
          # Same reasoning for the format check: this solution-wide run (and
          # ci.yml's own Build & Format Check) is the backstop that catches
          # any diagnostic the per-PR --include-scoped format missed in files
          # outside a diff. Do not "align" this with PR Gate either.
          format-scope: full

  # Summary gate: a single job that branch-protection can require.
  # Add every job whose failure should block merge.
  ci-gate:
    name: CI Gate
    # When a newer run supersedes this one via workflow concurrency, avoid
    # publishing a false failing gate from the cancelled run.
    #
    # Does NOT run on merge_group: CI Gate is the PR-TIME aggregator (it needs
    # the full heavy matrix, all of which is skipped on a batched commit). The
    # merge queue's required check is the separate `Merge Queue Gate` job below,
    # NOT this one. Keeping CI Gate off merge_group avoids a misleading all-
    # skipped "pass" status appearing in the queue context.
    if: ${{ github.event_name != 'merge_group' && always() && !cancelled() }}
    needs: [pr-template-check, pr-readiness, changes, targeted-shards, ci-router-validation, build, test-all, aot-build, js-integration-tests, esri-leaflet-browser-tests, maplibre-compat, mcp-certification, core-package-compatibility, postgres-compat, docker-build, quickstart-console-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required CI jobs were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed."

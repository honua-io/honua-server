name: CI
run-name: "CI ${{ inputs.merge_train_nonce }}"

on:
  schedule:
    # Full integration lane. PR CI is selective; release workflows own
    # packaging/publishing smoke.
    - cron: '23 9 * * *'
    - cron: '23 21 * * *'
  # Per-PR verification lives in pr-gate.yml. Full CI runs on trunk twice
  # daily or by dispatch, keeping runtime proofs and protocol builds off the
  # per-push critical path while preserving complete integration coverage.
  workflow_dispatch:
    inputs:
      merge_train_nonce:
        description: 'Opaque merge-train dispatch identity used to correlate the exact Actions run'
        required: false
        default: ''
      sdk_ref:
        description: 'honua-sdk-js git ref for MCP tests (overrides MCP_SDK_REF env)'
        required: false
        default: ''
      full_ci:
        description: 'Force the FULL matrix even on a train/batch/* dispatch (overrides the selective-vs-trunk batch gate). Also overrides selective_base.'
        required: false
        type: boolean
        default: false
      selective_base:
        description: 'Trailing-verification mode: full SHA of a trunk ancestor (typically the latest completed CI head). The base refreshes when execution starts; selections above 30 shards use the newest merge. Gates only affected shards/lanes. Empty = full lane. Overridden by full_ci=true.'
        required: false
        type: string
        default: ''
      investigation_base:
        description: 'Last green trunk ancestor for the CI doctor suspect range; independent of selective execution scope. Empty = unknown.'
        required: false
        type: string
        default: ''
      console_image:
        description: 'Optional honua-console image tag for the quickstart Console compose smoke. Defaults to repository variable HONUA_CONSOLE_IMAGE when set.'
        required: false
        default: ''


env:
  # Preserve the upstream reaper index while avoiding Docker Hub authentication.
  TESTCONTAINERS_RYUK_CONTAINER_IMAGE: 'mirror.gcr.io/testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0'
  DOTNET_VERSION: '10.0.x'
  # Keep one persistent MSBuild server alive across restore/build/test calls in
  # each job. Roslyn shared compilation remains enabled by default.
  DOTNET_CLI_USE_MSBUILD_SERVER: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  # Immutable mcp-server-v0.1.19 release source with isolated certification
  # settings and native gRPC count/statistics. Both live backends remain required.
  # workflow_dispatch sdk_ref remains an
  # explicit override for development/release replays, recorded in each receipt.
  MCP_SDK_REF: 'ae6a835b5334a14c380b085d1af57161243ae0d5'
  # Release certification lanes (honua-io/honua-release#376 R18): the job ids
  # whose check-runs must ALL conclude `success` in the newest completed
  # schedule/workflow_dispatch run of this workflow before a trunk sha is
  # certified. This is the one declaration of that list: the nightly container
  # build reads it (scripts/ci/select-certified-nightly-sha.py) to image only
  # certified shas, and honua-release's resolver requires the same check-run
  # names (certification/full-matrix-checks.yaml there). Every lane here must
  # run on a full-matrix workflow_dispatch -- see the run_all escalation in
  # the `changes` job.
  # The separate format job remains required through ci-gate, preserving the shared five-lane contract.
  CERTIFICATION_LANE_JOBS: 'build dotnet-foundation-tests python-integration-tests test-all ci-gate'

permissions:
  issues: read
  contents: read
  packages: read
jobs:
  pr-readiness:
    name: PR Mergeability & Freshness
    # Decoupled from pr-template-check (was: `needs: pr-template-check`).
    # Chaining the build/test graph behind the PR-body template check meant a
    # single template miss SKIPPED every downstream job and published a RED
    # "CI Gate" with no actual validation run — the most common reason an
    # otherwise-correct PR looked broken (see "Gate model" in docs/internal/contributor/merge-coordination-runbook.md;
    # #1736/#1737 needed a manual re-trigger). pr-template-check is still a
    # first-class job and still feeds CI Gate (so a template failure still
    # fails the gate), but it no longer gates whether the code is validated.
    # Skips on merge_group (no PR to check mergeability/freshness for; the queue
    # enforces up-to-date-ness itself).
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip mergeability preflight for non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Non-PR event; mergeability preflight skipped."

      - name: Fail fast on conflicted or stale PR branches
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            let pull = null;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pull = response.data;
              if (pull.mergeable !== null) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!pull) {
              core.setFailed('Unable to load pull request metadata.');
              return;
            }

            const mergeable = pull.mergeable;
            const mergeableState = String(pull.mergeable_state || 'unknown');
            core.info(`mergeable=${mergeable} mergeable_state=${mergeableState}`);

            if (mergeable === false || mergeableState === 'dirty') {
              core.setFailed('PR branch has merge conflicts. Resolve conflicts before running CI.');
              return;
            }

            if (mergeableState === 'behind') {
              core.setFailed('PR branch is behind trunk. Refresh the branch before running CI.');
            }

  changes:
    name: Detect Non-Test Changes
    permissions:
      contents: read
      actions: read
    # Skips on merge_group: the lean merge-queue gate does not consult the
    # change-detection / shard-routing graph (it always runs build + format +
    # fast smoke). Skipping `changes` cascades a skip to every heavy job that
    # `needs: changes` (build, *-tests, postgres-compat, aot-build, docker-build,
    # browser/MCP lanes), so the full matrix never runs on a batched commit.
    if: ${{ github.event_name != 'merge_group' }}
    needs: pr-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      non_test_changes: ${{ steps.filter.outputs.non_test_changes }}
      build_changes: ${{ steps.filter.outputs.build_changes }}
      integration_changes: ${{ steps.filter.outputs.integration_changes }}
      integration_reason: ${{ steps.filter.outputs.integration_reason }}
      full_ci: ${{ steps.filter.outputs.full_ci }}
      postgres_matrix: ${{ steps.filter.outputs.postgres_matrix }}
      specialized_lanes: ${{ steps.specialized.outputs.lanes }}
      selective_base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        env:
          SELECTIVE_BASE: ${{ inputs.selective_base }}
          FULL_CI_INPUT: ${{ inputs.full_ci }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch the base branch with FULL history (NOT --depth=1). The filter below
          # uses a three-dot range (base...head) that needs a merge-base; a shallow
          # base fetch makes `git diff` fail with "fatal: no merge base", which the
          # downstream `|| true` silently turned into an empty changed-file list →
          # build_changes=false → the required build jobs SKIP and the PR is stuck
          # BLOCKED. checkout already used fetch-depth: 0, so this is a cheap ref update.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "range=origin/${{ github.base_ref }}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "trailing_selective=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
               [[ "${SELECTIVE_BASE}" =~ ^[0-9a-f]{40}$ ]] &&
               [ "${FULL_CI_INPUT}" != "true" ]; then
            # Trailing-verification dispatch: diff against the latest completed
            # trunk head so only landings since then gate lanes/shards. The
            # SHA regex is the injection guard; an unknown SHA fails safe to
            # the full trunk range below.
            git fetch --no-tags origin trunk
            if git cat-file -e "${SELECTIVE_BASE}^{commit}" 2>/dev/null; then
              python3 scripts/ci/resolve-trailing-base.py "${SELECTIVE_BASE}" "${GITHUB_SHA}"
            else
              echo "::warning::selective_base ${SELECTIVE_BASE} not found in history; forcing full CI."
              echo "range=origin/trunk...${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "trailing_selective=false" >> "$GITHUB_OUTPUT"
            fi
          else
            git fetch --no-tags origin trunk
            echo "range=origin/trunk...${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "trailing_selective=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record suspect merge range
        if: steps.diff.outputs.trailing_selective == 'true'
        env:
          INVESTIGATION_BASE: ${{ inputs.investigation_base }}
        run: |
          set -euo pipefail
          if [ -n "${INVESTIGATION_BASE}" ]; then
            scripts/ci/trunk-suspect-range.sh "${INVESTIGATION_BASE}" "${GITHUB_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Last green trunk ancestor unknown; no bounded culprit range is available." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for non-test changes
        id: filter
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          TRAILING_SELECTIVE_BASE: ${{ inputs.selective_base }}
        run: |
          set -euo pipefail
          # PRs and selective batches run the complete compatibility suite without
          # coverage instrumentation; scheduled/manual full CI remains authoritative.
          POSTGRES_BASELINE='[{"pg_image":"postgis/postgis:16-3.4","pg_service_image":"mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5","pg_suffix":"16","collect_coverage":false}]'
          POSTGRES_FULL='[{"pg_image":"postgis/postgis:16-3.4","pg_service_image":"mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5","pg_suffix":"16","collect_coverage":true},{"pg_image":"postgis/postgis:17-3.5","pg_service_image":"mirror.gcr.io/postgis/postgis:17-3.5@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba","pg_suffix":"17","collect_coverage":false},{"pg_image":"postgis/postgis:18-3.6","pg_service_image":"mirror.gcr.io/postgis/postgis:18-3.6@sha256:7e00e8c3539fdd43f513b98806c8204714dcd09dea683c259e333d7690317119","pg_suffix":"18","collect_coverage":false}]'

          # Fail safe: if the diff range cannot be computed (e.g. no merge-base after a
          # full base fetch), run the full build/integration lane rather than silently
          # skipping the required build jobs. A diff failure must NEVER fall through to
          # build_changes=false (that left PRs stuck BLOCKED with build jobs "skipping").
          if ! CHANGED_FILES=$(git diff --no-renames --name-only "${{ steps.diff.outputs.range }}" 2>/dev/null); then
            echo "::warning::Diff range '${{ steps.diff.outputs.range }}' unavailable (no merge-base); running the full build lane."
            # targeted-shards fails safe to run_all on the same range, so a
            # dispatch here is a full matrix and must run every lane, including
            # the full_ci-gated certification lanes (see the run_all escalation
            # below). A pull request keeps the baseline compatibility set.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              UNAVAILABLE_FULL_CI=false
              UNAVAILABLE_POSTGRES="${POSTGRES_BASELINE}"
            else
              UNAVAILABLE_FULL_CI=true
              UNAVAILABLE_POSTGRES="${POSTGRES_FULL}"
            fi
            {
              echo "build_changes=true"
              echo "non_test_changes=true"
              echo "integration_changes=true"
              echo "integration_reason=diff_range_unavailable"
              echo "full_ci=${UNAVAILABLE_FULL_CI}"
              echo "postgres_matrix=${UNAVAILABLE_POSTGRES}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A merge-train batch CI is dispatched via workflow_dispatch on a
          # `train/batch/*` branch. Treat it like a PR diffed against trunk: gate
          # only the shards/lanes its cumulative diff touches (the smart-ci subset
          # the train already computes) instead of re-running the full matrix on
          # every batch. The targeted-tests script self-escalates to run_all on
          # infra/shared/unmapped changes, and the nightly `schedule` still runs
          # the full lane, so coverage is preserved. `-f full_ci=true` forces full.
          SELECTIVE_BATCH=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [[ "${GITHUB_REF_NAME}" == train/batch/* ]] &&
             [ "${{ inputs.full_ci }}" != "true" ]; then
            SELECTIVE_BATCH=true
          fi
          # Trailing-verification dispatch (selective_base input): same selective
          # gating as a batch — lanes/shards the diff touches, nightly stays full.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "${{ steps.diff.outputs.trailing_selective }}" = "true" ] &&
             [ "${{ inputs.full_ci }}" != "true" ]; then
            SELECTIVE_BATCH=true
          fi
          # A selective dispatch the shard router cannot scope is a FULL matrix
          # (honua-io/honua-release#376 R18). The router answers run_all for an
          # empty range -- a re-dispatch at an already-verified head, where
          # selective_base == HEAD -- and for infrastructure/unmapped changes,
          # and targeted-shards then selects every shard. This job used to
          # derive build/integration/full_ci from the bare diff regardless, so
          # Build & Format Check, .NET Foundation Tests and Python Integration
          # Tests SKIPPED in a run that still concluded success; as the newest
          # completed run on its sha it superseded the real full-matrix
          # certification there (7aad613: run 37183672893 over 37181115405).
          # Run the whole matrix instead, so a dispatched full matrix certifies.
          # Pull requests keep their path-based skipping: this only applies to
          # selective workflow_dispatch runs.
          if [ "${SELECTIVE_BATCH}" = "true" ]; then
            if ROUTER_DESCRIPTOR=$(printf '%s\n' "${CHANGED_FILES}" | scripts/ci/honua-server-targeted-tests.sh --stdin); then
              ROUTER_RUN_ALL=$(jq -r '.run_all' <<<"${ROUTER_DESCRIPTOR}")
              ROUTER_REASON=$(jq -r '.reason' <<<"${ROUTER_DESCRIPTOR}")
            else
              ROUTER_RUN_ALL=true
              ROUTER_REASON=targeted_selection_failed
            fi
            if [ "${ROUTER_RUN_ALL}" = "true" ]; then
              echo "Shard router resolved run_all (${ROUTER_REASON}); this dispatch runs the full matrix."
              SELECTIVE_BATCH=false
            fi
          fi
          echo "Selective batch decision: ref_name=${GITHUB_REF_NAME} full_ci=${{ inputs.full_ci }} selective=${SELECTIVE_BATCH}"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${SELECTIVE_BATCH}" != "true" ]; then
            echo "build_changes=true" >> "$GITHUB_OUTPUT"
            echo "non_test_changes=true" >> $GITHUB_OUTPUT
            echo "integration_changes=true" >> "$GITHUB_OUTPUT"
            echo "integration_reason=scheduled_or_manual_full_ci" >> "$GITHUB_OUTPUT"
            echo "full_ci=true" >> "$GITHUB_OUTPUT"
            echo "postgres_matrix=${POSTGRES_FULL}" >> "$GITHUB_OUTPUT"
            INTEGRATION_FILES="<full integration event>"
            BUILD_FILES="<full integration event>"
          else
            if printf '%s' "${PR_LABELS_JSON:-[]}" | jq -e 'index("ci/full") or index("full-ci")' >/dev/null; then
              FULL_CI=true
            else
              FULL_CI=false
            fi

            # PRs that only touch docs, CI/publish plumbing, package metadata,
            # or NuGet source configuration do not need the full integration
            # fanout. Scheduled/manual CI still runs the full lane.
            NON_TEST_FILES=$(echo "$CHANGED_FILES" | grep -Ev '^(tests/|test/)' | sed '/^$/d' || true)
            if [ -z "$NON_TEST_FILES" ]; then
              echo "non_test_changes=false" >> $GITHUB_OUTPUT
            else
              echo "non_test_changes=true" >> $GITHUB_OUTPUT
            fi

            BUILD_FILES=$(
              printf '%s\n' "$CHANGED_FILES" \
                | grep -Ev '^($|docs/|README\.md$|\.github/(workflows/[^/]+\.yml$|ci-shards\.json$)|scripts/ci/)' \
                | sed '/^$/d' || true
            )

            INTEGRATION_FILES=$(
              printf '%s\n' "$CHANGED_FILES" \
                | grep -Ev '^($|docs/|README\.md$|\.github/(actions/setup-dotnet-ci/|workflows/[^/]+\.yml$|ci-shards\.json$)|scripts/ci/|NuGet\.config$|src/Honua\.Core/Honua\.Core\.csproj$)' \
                | sed '/^$/d' || true
            )

            if [ "${FULL_CI}" = "true" ]; then
              echo "build_changes=true" >> "$GITHUB_OUTPUT"
              echo "integration_changes=true" >> "$GITHUB_OUTPUT"
              echo "integration_reason=pr_label_ci_full" >> "$GITHUB_OUTPUT"
              echo "postgres_matrix=${POSTGRES_FULL}" >> "$GITHUB_OUTPUT"
            elif [ -z "$INTEGRATION_FILES" ]; then
              if [ -z "$BUILD_FILES" ]; then
                echo "build_changes=false" >> "$GITHUB_OUTPUT"
              else
                echo "build_changes=true" >> "$GITHUB_OUTPUT"
              fi
              echo "integration_changes=false" >> "$GITHUB_OUTPUT"
              echo "integration_reason=ci_package_or_docs_only" >> "$GITHUB_OUTPUT"
              echo "postgres_matrix=${POSTGRES_BASELINE}" >> "$GITHUB_OUTPUT"
            else
              echo "build_changes=true" >> "$GITHUB_OUTPUT"
              echo "integration_changes=true" >> "$GITHUB_OUTPUT"
              echo "integration_reason=runtime_or_test_changes" >> "$GITHUB_OUTPUT"
              echo "postgres_matrix=${POSTGRES_BASELINE}" >> "$GITHUB_OUTPUT"
            fi
            echo "full_ci=${FULL_CI}" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          echo "Non-test files:"
          echo "${NON_TEST_FILES:-<full integration event>}"
          echo ""
          echo "Build-triggering files:"
          echo "${BUILD_FILES:-<none>}"
          echo ""
          echo "Integration-triggering files:"
          echo "${INTEGRATION_FILES:-<none>}"
          echo ""
          echo "Full CI:"
          echo "${FULL_CI:-true}"

      - name: Select expensive affected lanes
        id: specialized
        env:
          DIFF_RANGE: ${{ steps.diff.outputs.range }}
          SELECTIVE: ${{ steps.diff.outputs.trailing_selective == 'true' && steps.filter.outputs.full_ci != 'true' && 'true' || 'false' }}
        run: python3 scripts/ci/affected-ci-lanes.py --range "$DIFF_RANGE" --selective "$SELECTIVE" >> "$GITHUB_OUTPUT"

  # Compute the server-tests shard subset for this PR. Scheduled/manual full
  # integration runs execute every shard. See ADR-0037.
  # Per ADR-0037 .github/ci-shards.json is the single source of truth for both
  # the shard routing data (paths) and the matrix-runtime metadata
  # (artifact_suffix, log_name, timeout_minutes, test_timeout_minutes,
  # max_cpu_count, upload flags, filter). This job emits two outputs:
  #   - descriptor: the {run_all, shards, reason} structure from the targeted-
  #     tests script (kept for visibility in logs).
  #   - matrix_include: a JSON array of matrix entries built from ci-shards.json
  #     and filtered to the selected shard names. ci.yml::server-tests consumes
  #     this via `strategy.matrix.include: ${{ fromJson(...) }}` so unselected
  #     shards never instantiate a runner.
  targeted-shards:
    name: Detect Targeted Server-Tests Shards
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      descriptor: ${{ steps.compute.outputs.descriptor }}
      matrix_include: ${{ steps.compute.outputs.matrix_include }}
      matrix_artifact: ${{ steps.compute.outputs.matrix_artifact }}
      affected_max_parallel: ${{ steps.compute.outputs.affected_max_parallel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute shard descriptor and matrix include
        id: compute
        env:
          TRAILING_SELECTIVE_BASE: ${{ needs.changes.outputs.selective_base || inputs.selective_base }}
        run: |
          set -euo pipefail
          all_shards_json=$(jq -c '[.shards[].name]' .github/ci-shards.json)
          # Scratch reproduction: two PostGIS/Testcontainers shards only.
          all_shards_json='["Core and Cloud Contracts","Migration"]'
          # Selective base: a PR diffs against its base branch; a merge-train
          # batch (workflow_dispatch on train/batch/*, no full_ci override) diffs
          # against trunk so it runs ONLY the shards its cumulative diff touches
          # — the smart-ci subset — instead of the full fanout every batch.
          selective_base=""
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.outputs.full_ci }}" != "true" ]; then
            selective_base="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/batch/') && inputs.full_ci != true }}" = "true" ]; then
            selective_base="origin/trunk"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
               [[ "${TRAILING_SELECTIVE_BASE:-}" =~ ^[0-9a-f]{40}$ ]] &&
               [ "${{ inputs.full_ci }}" != "true" ]; then
            # Trailing-verification dispatch: shard-select against the last
            # verified trunk head. Unknown SHA falls through to the script's
            # own run_all fail-safe below.
            selective_base="${TRAILING_SELECTIVE_BASE}"
          fi

          if [ -n "${selective_base}" ]; then
            # Full base history (not --depth=1) so the targeted-tests diff has a
            # merge-base. A raw-SHA base needs no ref fetch (fetch-depth: 0
            # checkout already has trunk history).
            [[ "${selective_base}" == origin/* ]] && git fetch --no-tags origin "${selective_base#origin/}"
            # Fail SAFE to run_all if the diff/script cannot be computed, so a
            # batch is never under-tested by a silent selection failure.
            if ! descriptor=$(scripts/ci/honua-server-targeted-tests.sh --base "${selective_base}"); then
              echo "::warning::targeted-tests selection failed for base ${selective_base}; falling back to run_all."
              descriptor=$(jq -nc --argjson shards "${all_shards_json}" \
                '{run_all: true, shards: $shards, reason: "targeted_selection_failed"}')
            fi
          else
            reason="scheduled_or_manual_full_ci"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              reason="pr_label_ci_full"
            fi
            descriptor=$(jq -nc --argjson shards "${all_shards_json}" \
              --arg reason "${reason}" \
              '{run_all: true, shards: $shards, reason: $reason}')
          fi
          echo "Descriptor: ${descriptor}"

          # Build the matrix include list by joining the selected shard names
          # against the ci-shards.json shard metadata. Drop the routing-only
          # `paths` field; project the rest verbatim into matrix entries.
          selected=$(printf '%s' "${descriptor}" | jq -c '.shards')
          matrix_include=$(jq -c --argjson sel "${selected}" '
            .shards
            | map(select(.name as $n | $sel | index($n)))
            | map({
                shard_name,
                dispatch_rank,
                artifact_suffix,
                log_name,
                timeout_minutes,
                test_timeout_minutes,
                max_cpu_count,
                upload_operator_eval_report,
                upload_odata_evidence,
                filter,
                csproj: (.csproj // ""),
                csprojs: (.csprojs // null),
                advisory: (.advisory // false)
              })
            | sort_by(-.dispatch_rank)
          ' .github/ci-shards.json)
          matrix_include=$(printf '%s' "${matrix_include}" | python3 scripts/ci/annotate-shard-resources.py \
            --catalog .github/test-projects.json)
          if [ "$(printf '%s' "${matrix_include}" | jq 'length')" = "0" ]; then
            echo "::error::matrix_include is empty — targeted-shards selected no shards"
            exit 1
          fi
          printf '%s\n' "${matrix_include}" > "${RUNNER_TEMP}/managed-matrix.json"
          echo "descriptor=${descriptor}" >> "$GITHUB_OUTPUT"
          echo "matrix_include=${matrix_include}" >> "$GITHUB_OUTPUT"
          echo "affected_max_parallel=$(printf '%s' "${matrix_include}" | python3 scripts/ci/trailing_selection.py)" >> "$GITHUB_OUTPUT"
          echo "matrix_artifact=selected-server-test-matrix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload selected shard matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-server-test-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-matrix.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build & Format Check
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && (needs.changes.outputs.build_changes == 'true' || needs.changes.outputs.integration_changes == 'true') }}
    needs: [changes, targeted-shards]
    outputs:
      producer_attempt: ${{ steps.managed-publish.outputs.producer-attempt }}
      managed_sdk_version: ${{ steps.managed-sdk.outputs.dotnet-sdk-version }}
    runs-on: ${{ vars.HONUA_CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Canonical Instruction Check
        run: bash scripts/ci/check-instructions-sync.sh

      # The full-solution build can exhaust ubuntu-latest disk once every
      # project writes Release bin/obj outputs. Reclaim unused hosted toolchains
      # before .NET setup and restore so runner diagnostics keep enough space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup .NET
        id: managed-sdk
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Compute affected projects
        id: affected
        # ADR-0043 PR #2 — scope the warnings-as-errors build to projects
        # affected by this PR + their reverse-dependency closure. Force-fulls
        # whenever shared infra changes (Directory.Packages.props, Honua.sln,
        # .github/, scripts/ci/) so a graph change cannot bypass the gate.
        # Trailing dispatches use the verified range base, rather than comparing
        # trunk to itself and unnecessarily rebuilding the entire solution.
        env:
          FULL_CI: ${{ needs.changes.outputs.full_ci }}
          BASE_REF: ${{ github.event.pull_request.base.sha || needs.changes.outputs.selective_base || inputs.selective_base || 'origin/trunk' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: |
          if [[ "${FULL_CI}" == true ]]; then
            affected=ALL
          else
            affected="$(scripts/ci/compute-affected-projects.sh)"
          fi
          if [[ -z "${affected}" || "${affected}" == "ALL" ]]; then
            mode="full"
            projects=""
          else
            mode="affected"
            projects="$(printf '%s' "${affected}" | tr '\n' ' ')"
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          {
            echo "projects<<EOF"
            printf '%s' "${projects}"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Warnings-as-errors build mode: ${mode}${projects:+ (${projects})}"
          python3 scripts/ci/protocol-profile-selection.py --dry-run --changed-from-git > "${RUNNER_TEMP}/protocol-profiles.json"
          cat "${RUNNER_TEMP}/protocol-profiles.json"

      - name: Download selected shard matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.targeted-shards.outputs.matrix_artifact }}
          path: ${{ runner.temp }}

      - name: Select managed producer outputs and build graph
        id: managed-plan
        env:
          AFFECTED_MODE: ${{ steps.affected.outputs.mode }}
          AFFECTED_PROJECTS: ${{ steps.affected.outputs.projects }}
        run: |
          python3 scripts/ci/managed-test-build.py projects --lane ci \
            --matrix-file "${RUNNER_TEMP}/managed-matrix.json" --output "${RUNNER_TEMP}/managed-projects.json"
          target=Honua.sln
          echo '[]' > "${RUNNER_TEMP}/standalone-projects.json"
          if [[ "${AFFECTED_MODE}" == affected ]]; then
            python3 -c 'import json,os; json.dump({"solution":{"path":"Honua.sln","projects":os.environ["AFFECTED_PROJECTS"].split()}},open(os.environ["RUNNER_TEMP"]+"/affected-base.slnf","w"))'
            target="${RUNNER_TEMP}/managed-build.slnf"
            python3 scripts/ci/managed-test-build.py filter --projects-file "${RUNNER_TEMP}/managed-projects.json" \
              --base-filter "${RUNNER_TEMP}/affected-base.slnf" --output "${target}" \
              --standalone-output "${RUNNER_TEMP}/standalone-projects.json"
          fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Restore producer build graph
        env:
          BUILD_TARGET: ${{ steps.managed-plan.outputs.target }}
        run: scripts/ci/dotnet-restore-retry.sh "${BUILD_TARGET}" -p:Configuration=Release -p:TreatWarningsAsErrors=true -p:RunAnalyzers=true -p:UseSharedCompilation=false

      - name: Build (warnings as errors)
        env:
          BUILD_TARGET: ${{ steps.managed-plan.outputs.target }}
        run: dotnet build "${BUILD_TARGET}" --no-restore --configuration Release -graphBuild -p:TreatWarningsAsErrors=true -p:RunAnalyzers=true -p:UseSharedCompilation=false

      - name: Build selected standalone tooling projects
        run: >-
          python3 scripts/ci/managed-test-build.py standalone
          --projects-file "${RUNNER_TEMP}/standalone-projects.json"

      - name: Build selected protocol profiles
        run: python3 scripts/ci/build-selected-protocol-profiles.py --selection "${RUNNER_TEMP}/protocol-profiles.json"

      # Package pristine outputs before any test/coverage process can modify them.
      - name: Publish managed test outputs
        id: managed-publish
        uses: ./.github/actions/managed-test-artifacts
        with:
          mode: publish
          projects-file: ${{ runner.temp }}/managed-projects.json
          enabled: ${{ vars.HONUA_MANAGED_TEST_ARTIFACTS != 'false' }}

      # Observe where the normal producer has all inspected/reference outputs.
      # The complete collector remains required in the downstream server family;
      # this adds only a small CI tool build, no inspected build or transport.
      - name: Build source inventory observation tool
        if: vars.HONUA_SOURCE_INVENTORY_PILOT != 'false'
        timeout-minutes: 5
        run: >-
          dotnet build eng/ci/Honua.Ci.SourceInventory/Honua.Ci.SourceInventory.csproj
          --configuration Release -p:TreatWarningsAsErrors=true -p:UseSharedCompilation=false

      - name: Verify source inventory fixture semantics
        if: vars.HONUA_SOURCE_INVENTORY_PILOT != 'false'
        timeout-minutes: 3
        run: |
          dotnet eng/ci/Honua.Ci.SourceInventory/bin/Release/net10.0/Honua.Ci.SourceInventory.dll self-test
          python3 scripts/ci/source-inventory-pilot/test_run.py

      - name: Observe source inventory metadata parity
        if: vars.HONUA_SOURCE_INVENTORY_PILOT != 'false'
        timeout-minutes: 15
        continue-on-error: true
        run: >-
          python3 scripts/ci/source-inventory-pilot/run.py
          --tool eng/ci/Honua.Ci.SourceInventory/bin/Release/net10.0/Honua.Ci.SourceInventory.dll

      - name: Upload producer source inventory observations
        if: always() && vars.HONUA_SOURCE_INVENTORY_PILOT != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: source-inventory-pilot-${{ github.run_attempt }}
          path: artifacts/test-results/source-inventory-pilot/
          if-no-files-found: warn
          retention-days: 7


  server-tests:
    name: Server Tests (${{ matrix.shard_name }})
    # Per ADR-0037 the PR gate runs only the targeted shards selected by
    # scripts/ci/honua-server-targeted-tests.sh; scheduled/manual full runs
    # execute the full matrix. The matrix is built dynamically
    # by `targeted-shards` from .github/ci-shards.json — unselected shards
    # never instantiate a runner job, so per-shard `if:` gating is no longer
    # needed. The PR shard step composes its filter with `&Tier!=Slow` so
    # [EmulatorTest]/[ScaleTest]/[ExternalServiceTest]/[CloudTest] methods
    # in a shard's namespace stay in nightly-slow-tier.yml, and `&Tier!=Fast`
    # so Fast tests run only once in dotnet-foundation-tests. Per #2943 that
    # foundation "Run .NET Tests (Protocol Fast Tier)" step now covers all 8
    # protocol-split projects (not just Honua.Server.Tests), so this
    # exclusion is safe for every shard's csproj, not only the legacy
    # Honua.Server.Tests.csproj default.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    # Even matrix indices run on the build host's honua-heavy runners when
    # vars.HONUA_HEAVY_RUNNER holds their runner JSON; fork code never does.
    runs-on: ${{ fromJSON('{"group":"honua-heavy","labels":["honua-heavy"]}') }}
    # Explicit producer dependency; only unmaterialized projects compile here.
    needs: [changes, targeted-shards, build]
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      # Keep the affected budget even when routing expands to full coverage.
      # Full runs take 16 of the org's 60 hosted runners: other per-PR
      # workflows already hold 20-35, and PR Gate starved at 24 (11 Nov).
      max-parallel: ${{ inputs.selective_base && fromJson(needs.targeted-shards.outputs.affected_max_parallel) || 16 }}
      matrix:
        include: ${{ fromJson(needs.targeted-shards.outputs.matrix_include) }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
    services:
      postgres:
        image: ${{ toJSON(matrix.needs_postgres) != 'false' && 'mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5' || '' }}
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        # An ephemeral host port: several self-hosted runners share one host.
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load validated flaky-test quarantine
        env:
          GH_TOKEN: ${{ github.token }}
          HONUA_TEST_QUARANTINE_FILE: ${{ runner.temp }}/honua-flake-quarantine.json
        run: |
          python3 scripts/ci/quarantine-issues.py snapshot --output "${HONUA_TEST_QUARANTINE_FILE}"
          echo "HONUA_TEST_QUARANTINE_FILE=${HONUA_TEST_QUARANTINE_FILE}" >> "${GITHUB_ENV}"

      # Reclaim runner disk while .NET setup and cache planning run. The
      # modular topology (8 protocol
      # assemblies + native packages such as ParquetSharp/Apache.Arrow/SkiaSharp
      # duplicated across their bin/obj, plus Coverlet coverage output) pushed
      # some shards over the ~14GB free-disk limit ("No space left on device").
      # Remove preinstalled toolchains the .NET test shards never use. Best-effort.
      - name: Start freeing disk space
        run: scripts/ci/server-test-shard-free-disk.sh

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          artifact-sdk-version: ${{ needs.build.outputs.managed_sdk_version }}

      - name: Select shard managed outputs
        env:
          SHARD_CSPROJ: ${{ matrix.csproj }}
          SHARD_CSPROJS: ${{ toJSON(matrix.csprojs) }}
        run: |
          python3 scripts/ci/managed-test-build.py projects --lane shard \
            --project "${SHARD_CSPROJ:-tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj}" --projects-json "${SHARD_CSPROJS}" \
            --output "${RUNNER_TEMP}/shard-projects.json"

      - name: Restore package prerequisites before shard materialization
        timeout-minutes: 10
        run: >-
          python3 scripts/ci/managed-test-build.py fallback
          --projects-file "${RUNNER_TEMP}/shard-projects.json"
          --restored-file "${RUNNER_TEMP}/shard-projects.json"

      - name: Consume managed shard outputs
        id: managed-consume
        uses: ./.github/actions/managed-test-artifacts
        with:
          mode: consume
          projects-file: ${{ runner.temp }}/shard-projects.json
          producer-attempt: ${{ needs.build.outputs.producer_attempt }}
          enabled: ${{ vars.HONUA_MANAGED_TEST_ARTIFACTS != 'false' && matrix.advisory != true }}

      - name: Record managed materialization
        id: managed-status
        env:
          RESTORED_PROJECTS: ${{ steps.managed-consume.outputs.restored-projects-file }}
        run: |
          restored="$(jq -r --slurpfile requested "${RUNNER_TEMP}/shard-projects.json" \
            '($requested[0] - .) | length == 0' "${RESTORED_PROJECTS}")"
          echo "restored=${restored}" >> "$GITHUB_OUTPUT"

      - name: Download selected shard matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.targeted-shards.outputs.matrix_artifact }}
          path: ${{ runner.temp }}

      - name: Plan shard-local exact-head cache
        id: shard-cache-plan
        if: steps.managed-status.outputs.restored != 'true' && matrix.csprojs == null
        shell: bash
        env:
          SHARD_NAME: ${{ matrix.shard_name }}
          SHARD_CSPROJ: ${{ matrix.csproj }}
          # Attempt-1 opportunistic reuse (#3213). Contract, fail-open behaviour
          # and rollback: docs/internal/ci/server-test-binary-artifacts.md.
          # The raw repository variable is forwarded verbatim; the single
          # "on only when exactly 'true'" rule lives in the plan script.
          PREBUILD_CONSUME: ${{ vars.HONUA_SERVER_TEST_PREBUILD_CONSUME }}
        run: |
          scripts/ci/server-test-shard-cache.sh plan \
            --shard "${SHARD_NAME}" \
            --project "${SHARD_CSPROJ}" \
            --matrix-file "${RUNNER_TEMP}/managed-matrix.json" \
            --source-sha '${{ github.sha }}' \
            --runner-os '${{ runner.os }}' \
            --sdk "$(dotnet --version)" \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prebuild-consume "${PREBUILD_CONSUME}"

      - name: Wait for free disk space
        run: scripts/ci/server-test-shard-free-disk.sh --await

      - name: Start exact-head cache restore timer
        if: steps.shard-cache-plan.outputs.restore_enabled == 'true'
        id: shard-cache-restore-start
        shell: bash
        run: echo "epoch_ms=$(date +%s%3N)" >> "${GITHUB_OUTPUT}"

      - name: Restore exact-head shard cache
        # Fail-open: a cache service error is a miss rather than a red shard. See
        # docs/internal/ci/server-test-binary-artifacts.md.
        if: steps.shard-cache-plan.outputs.restore_enabled == 'true'
        id: shard-cache-download
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.shard-cache-plan.outputs.payload_dir }}
          key: ${{ steps.shard-cache-plan.outputs.cache_key }}
          fail-on-cache-miss: false

      - name: Wait before retrying exact-head shard cache
        if: steps.shard-cache-plan.outputs.restore_enabled == 'true' && steps.shard-cache-plan.outputs.cache_writer != 'true' && steps.shard-cache-download.outputs.cache-hit != 'true'
        shell: bash
        run: sleep '${{ steps.shard-cache-plan.outputs.restore_retry_delay_seconds }}'

      - name: Retry exact-head shard cache restore
        if: steps.shard-cache-plan.outputs.restore_enabled == 'true' && steps.shard-cache-plan.outputs.cache_writer != 'true' && steps.shard-cache-download.outputs.cache-hit != 'true'
        id: shard-cache-download-retry
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.shard-cache-plan.outputs.payload_dir }}
          key: ${{ steps.shard-cache-plan.outputs.cache_key }}
          fail-on-cache-miss: false

      - name: Record exact-head cache restore duration
        if: always() && steps.shard-cache-plan.outputs.restore_enabled == 'true'
        id: shard-cache-restore-elapsed
        shell: bash
        run: echo "milliseconds=$(( $(date +%s%3N) - ${{ steps.shard-cache-restore-start.outputs.epoch_ms }} ))" >> "${GITHUB_OUTPUT}"

      - name: Verify and unpack exact-head shard cache
        id: shard-cache-materialize
        if: steps.managed-status.outputs.restored != 'true' && matrix.csprojs == null
        shell: bash
        env:
          CACHE_HIT_FIRST: ${{ steps.shard-cache-download.outputs.cache-hit }}
          CACHE_HIT_RETRY: ${{ steps.shard-cache-download-retry.outputs.cache-hit }}
        run: |
          cache_hit=false
          if [[ "${CACHE_HIT_FIRST:-false}" == "true" || "${CACHE_HIT_RETRY:-false}" == "true" ]]; then
            cache_hit=true
          fi
          scripts/ci/server-test-shard-cache.sh restore \
            --project '${{ steps.shard-cache-plan.outputs.project }}' \
            --source-sha '${{ github.sha }}' \
            --payload '${{ steps.shard-cache-plan.outputs.payload_dir }}' \
            --cache-hit "${cache_hit}" \
            --read-mode '${{ steps.shard-cache-plan.outputs.restore_mode }}'

      - name: Create Test Results Directory
        run: mkdir -p ./artifacts/test-results

      - name: Build server test binaries
        id: shard-cache-build
        if: steps.managed-status.outputs.restored != 'true' && steps.shard-cache-materialize.outputs.restored != 'true'
        timeout-minutes: 20
        env:
          RESTORED_PROJECTS: ${{ steps.managed-consume.outputs.restored-projects-file }}
        run: python3 scripts/ci/managed-test-build.py fallback --projects-file "${RUNNER_TEMP}/shard-projects.json" --restored-file "${RESTORED_PROJECTS}"

      - name: Package shard-local cache payload
        id: shard-cache-package
        # `package_enabled` is the plan step's single decision point; the
        # attempt counter is parsed there and nowhere else.
        if: ${{ steps.shard-cache-build.outcome == 'success' && steps.shard-cache-plan.outputs.package_enabled == 'true' }}
        shell: bash
        run: |
          rm -rf '${{ steps.shard-cache-plan.outputs.payload_dir }}'
          mkdir -p '${{ steps.shard-cache-plan.outputs.payload_dir }}'
          scripts/ci/package-server-test-binaries.sh \
            --project '${{ steps.shard-cache-plan.outputs.project }}' \
            --output '${{ steps.shard-cache-plan.outputs.payload_dir }}' \
            --source-sha '${{ github.sha }}'

      - name: Start exact-head cache save timer
        if: steps.shard-cache-package.outcome == 'success'
        id: shard-cache-save-start
        shell: bash
        run: echo "epoch_ms=$(date +%s%3N)" >> "${GITHUB_OUTPUT}"

      - name: Save exact-head shard cache
        if: steps.shard-cache-package.outcome == 'success'
        id: shard-cache-save
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.shard-cache-plan.outputs.payload_dir }}
          key: ${{ steps.shard-cache-plan.outputs.cache_key }}

      - name: Record exact-head cache save duration
        if: always() && steps.shard-cache-package.outcome == 'success'
        id: shard-cache-save-elapsed
        shell: bash
        run: echo "milliseconds=$(( $(date +%s%3N) - ${{ steps.shard-cache-save-start.outputs.epoch_ms }} ))" >> "${GITHUB_OUTPUT}"

      - name: Report shard cache decision
        if: always() && steps.shard-cache-plan.outcome == 'success'
        shell: bash
        env:
          CACHE_KEY: ${{ steps.shard-cache-plan.outputs.cache_key }}
          RESTORE_MODE: ${{ steps.shard-cache-plan.outputs.restore_mode }}
          CONSUME_SWITCH: ${{ steps.shard-cache-plan.outputs.consume_switch }}
          DOWNLOAD_OUTCOME_FIRST: ${{ steps.shard-cache-download.outcome }}
          DOWNLOAD_OUTCOME_RETRY: ${{ steps.shard-cache-download-retry.outcome }}
          BUILD_OUTCOME: ${{ steps.shard-cache-build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.shard-cache-package.outcome }}
          SAVE_OUTCOME: ${{ steps.shard-cache-save.outcome }}
          CACHE_WRITER: ${{ steps.shard-cache-plan.outputs.cache_writer }}
          CACHE_WRITER_SHARD: ${{ steps.shard-cache-plan.outputs.cache_writer_shard }}
          CACHE_HIT_FIRST: ${{ steps.shard-cache-download.outputs.cache-hit }}
          CACHE_HIT_RETRY: ${{ steps.shard-cache-download-retry.outputs.cache-hit }}
          MATERIALIZED: ${{ steps.shard-cache-materialize.outputs.restored }}
          REASON: ${{ steps.shard-cache-materialize.outputs.reason }}
          TRANSFER_MS: ${{ steps.shard-cache-restore-elapsed.outputs.milliseconds }}
          INTEGRITY_MS: ${{ steps.shard-cache-materialize.outputs.integrity_check_ms }}
          UNPACK_MS: ${{ steps.shard-cache-materialize.outputs.unpack_ms }}
          SAVE_MS: ${{ steps.shard-cache-save-elapsed.outputs.milliseconds }}
          PAYLOAD_DIR: ${{ steps.shard-cache-plan.outputs.payload_dir }}
          PROJECT_SUFFIX: ${{ steps.shard-cache-plan.outputs.project_suffix }}
        run: |
          # Only a package step that actually succeeded produced this manifest;
          # on a cache hit the manifest in the payload dir belongs to the
          # RESTORED evidence and its timing describes the writer, not us.
          package_ms=na
          if [[ "${PACKAGE_OUTCOME}" == 'success' ]]; then
            manifest="${PAYLOAD_DIR}/server-test-binaries-${PROJECT_SUFFIX}.manifest.json"
            if [[ -f "${manifest}" ]]; then
              package_ms="$(jq -r '.package_milliseconds' "${manifest}")"
            fi
          fi
          cache_hit=false
          if [[ "${CACHE_HIT_FIRST:-false}" == 'true' || "${CACHE_HIT_RETRY:-false}" == 'true' ]]; then
            cache_hit=true
          fi
          {
            echo '### Server-test shard cache'
            echo
            echo "- Key: \`${CACHE_KEY:-unavailable}\`"
            echo "- Attempt: \`${{ github.run_attempt }}\`"
            echo "- Read mode: \`${RESTORE_MODE:-disabled}\` (HONUA_SERVER_TEST_PREBUILD_CONSUME=\`${CONSUME_SWITCH:-unset}\`, lookup outcomes first=\`${DOWNLOAD_OUTCOME_FIRST:-skipped}\` retry=\`${DOWNLOAD_OUTCOME_RETRY:-skipped}\`)"
            echo "- Decision: \`${REASON:-not_evaluated}\`"
            echo "- Exact cache hit: \`${cache_hit}\`"
            echo "- Materialized without build: \`${MATERIALIZED:-false}\`"
            # Only claim a successful local fallback when one actually happened.
            # A failed or cancelled build must not be reported as the unchanged
            # happy path.
            if [[ "${MATERIALIZED:-false}" != 'true' && "${BUILD_OUTCOME}" == 'success' ]]; then
              echo "- Fallback: \`${REASON:-consumer_disabled}\`; this shard restored and built \`${PROJECT_SUFFIX}\` locally (unchanged path)."
            fi
            # Writer identity is only meaningful when this job actually
            # published; a designated writer that hit the cache saved nothing.
            if [[ "${SAVE_OUTCOME}" == 'success' || "${SAVE_OUTCOME}" == 'failure' ]]; then
              echo "- Published payload: \`true\` (designated writer \`${CACHE_WRITER_SHARD:-unknown}\`, save \`${SAVE_OUTCOME}\`)"
            else
              echo "- Published payload: \`false\` (designated writer \`${CACHE_WRITER_SHARD:-unknown}\`, this shard writer=\`${CACHE_WRITER:-false}\`)"
            fi
            echo "- Transfer / integrity / unpack: \`${TRANSFER_MS:-0} / ${INTEGRITY_MS:-0} / ${UNPACK_MS:-0} ms\`"
            echo "- Package / save: \`${package_ms} / ${SAVE_MS:-0} ms\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare shard Testcontainers images
        timeout-minutes: 12
        shell: bash
        env:
          SERVER_SHARD: ${{ matrix.shard_name }}
        run: |
          # Only these current shard filters select explicit Redis fixtures.
          images=()
          case "${SERVER_SHARD}" in
            'Admin & Infrastructure '[0-9]*| \
            'Migration'| \
            'FeatureServer Editing and Relationships'| \
            'FeatureServer Query Services and Replication '[0-9]*| \
            'OGC API Tiles Coverages and Processes'| \
            'GeoServices GPServer and NAServer'| \
            'Caching File Storage Styling and Infrastructure'| \
            'Operator Eval Harness'| \
            'gRPC Protocol and Scene'| \
            'MCP and Sessions'| \
            'Server Features Admin Runtime Operations'| \
            'Server Features Admin Authorization'| \
            'Server Features Admin Authorization Matrix'| \
            'Server Features Admin Network and Jobs'| \
            'Server Features Admin Integrations and Automation '[0-9]*| \
            'Server Features Admin Alert Endpoints'| \
            'Server Features Streaming Snapshot and Conformance'| \
            'Server Features Data Enrichment and Capabilities'| \
            'Server Features Miscellaneous'| \
            'Server Features Studio Packaging') images+=(redis) ;;
          esac
          if [[ "${SERVER_SHARD}" == 'Operator Eval Harness' ]]; then
            images+=(postgis17)
          fi
          # These real-process/seed proofs create their own PostGIS containers.
          if [[ "${SERVER_SHARD}" == 'Core and Cloud Contracts' ]]; then
            images+=(postgis16 postgis18)
          fi
          if (( ${#images[@]} > 0 )); then
            scripts/ci/prepare-testcontainer-images.sh ryuk "${images[@]}"
          fi

      - name: Run server test shard
        shell: bash
        env:
          HONUA_SERVER_TEST_SHARD_NAME: ${{ matrix.shard_name }}
          HONUA_TEST_DB_URL: ${{ toJSON(matrix.needs_postgres) != 'false' && format('Host=localhost;Port={2};Database=honua_test;Username=honua;Password=ci-{0}-{1}', github.run_id, github.run_attempt, job.services.postgres.ports['5432']) || '' }}
          HONUA_SERVER_TEST_FILTER: ${{ matrix.filter }}
          HONUA_SERVER_TEST_LOG_NAME: ${{ matrix.log_name }}
          HONUA_SERVER_TEST_TIMEOUT_MINUTES: ${{ matrix.test_timeout_minutes }}
          HONUA_SERVER_TEST_MAX_CPU_COUNT: ${{ matrix.max_cpu_count }}
          HONUA_SERVER_TEST_RESULTS_DIR: ./artifacts/test-results
          HONUA_SERVER_TEST_CONFIGURATION: Release
          # Phase 2 / ADR-0042: per-protocol test-project routing.
          # The shard record's optional `csproj` field selects the test
          # assembly; the shard script defaults to Honua.Server.Tests.csproj
          # when this env var is empty so legacy shards keep working unchanged.
          HONUA_SERVER_TEST_CSPROJ: ${{ matrix.csproj }}
          HONUA_SERVER_TEST_CSPROJS: ${{ toJSON(matrix.csprojs) }}
        run: |
          scripts/ci/run-server-test-shard.sh

      # #3204 drain guard, ADVISORY. Three shards hit their test budget in 24
      # hours (#4450, #4455, and Analytics Studio Export on run 34072577139).
      # Every one of them was already spending >85% of its budget on the run
      # BEFORE it went red, and nothing said so — the drain of test-heavy
      # must-fix PRs kept adding cases until a shard tipped over on trunk.
      #
      # WHERE THIS FIRES. Only here, on the full matrix: the nightly schedule,
      # a manual dispatch, and the train's train/batch/* dispatch. It is NOT a
      # per-PR signal — pr-gate.yml runs no shard matrix at all, so a PR head
      # produces no *.timing.json anywhere and there is nothing for the audit to
      # read. Under the trailing-matrix landing model that means the warning
      # lands after merge; the value is that it lands while the shard still
      # PASSES at >85%, instead of one or more runs later when it times out and
      # turns trunk red. Making this a genuine pre-merge signal would require
      # per-PR shard execution, which #2865 deliberately removed.
      #
      # CONTRACT (#4790): advisory, not a gate. `--advisory` makes the guard emit
      # HONUA_SHARD_OVER_MAX_UTILIZATION as a ::warning:: and exit 0, so the
      # step's annotation, exit code and conclusion all say the same thing. The
      # only hard capacity band is the shard runner's own
      # HONUA_SHARD_CAPACITY_EXHAUSTED at 100% of the test budget, which the
      # merge train classifies as terminal. Below it sit two warning bands:
      # HONUA_SHARD_LOW_HEADROOM at 80% (run-server-test-shard.sh) and this
      # guard at 85%. The job summary table is the per-run report; the
      # multi-run trend is the re-basing audit in
      # docs/internal/ci/shard-timeout-budgets.md. A guard that failed here would
      # red trunk on a passing shard whenever a runner was slow, which is a
      # flake, not a signal. continue-on-error remains only so a crash in the
      # audit itself cannot fail a shard whose tests passed.
      - name: Report shard headroom (advisory)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          set -uo pipefail
          if ! ls artifacts/test-results/*.timing.json >/dev/null 2>&1; then
            echo "No timing artifact for this shard; nothing to report."
            exit 0
          fi
          table=$(python3 scripts/ci/audit-shard-headroom.py \
            --timings-dir artifacts/test-results --markdown 2>/dev/null \
            | grep -Ev '\| no_data \|')
          printf '%s\n' "${table}"
          {
            echo "### Server test shard headroom"
            echo
            printf '%s\n' "${table}"
          } >> "${GITHUB_STEP_SUMMARY}"
          # Advisory: the ::warning:: annotation is the signal and --advisory
          # exits 0, so the step never reports a failure it does not mean.
          python3 scripts/ci/audit-shard-headroom.py \
            --timings-dir artifacts/test-results --max-utilization 0.85 --advisory >/dev/null

      - name: Upload Operator Eval Report
        if: ${{ always() && matrix.upload_operator_eval_report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-eval-report
          path: artifacts/test-results/eval-report.json
          if-no-files-found: error

      - name: Upload OData CLI certification evidence
        if: ${{ always() && matrix.upload_odata_evidence }}
        uses: ./.github/actions/upload-ci-evidence
        with:
          kind: evidence
          suffix: cli-odata
          path: artifacts/test-results/*-cli-odata.cert.json
          tier: pr

      - name: Upload shard test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: server-test-results-${{ matrix.artifact_suffix }}
          path: artifacts/test-results/
          retention-days: 7


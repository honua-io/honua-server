          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-admin-infra.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Cloud & Contract)
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Cloud.|FullyQualifiedName~Honua.Server.Tests.CloudCog.|FullyQualifiedName~Honua.Server.Tests.Contract." \
            --logger "trx;LogFileName=server-tests-cloud-contract.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            > ./tests/TestResults/server-tests-cloud-contract.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do

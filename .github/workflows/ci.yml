name: CI
run-name: "CI ${{ inputs.merge_train_nonce }}"

on:
  schedule:
    # Full integration lane. PR CI is selective; release workflows own
    # packaging/publishing smoke.
    - cron: '0 9 * * *'
  # NO per-PR `pull_request` trigger. In the optimistic merge-train model the
  # ONE batch CI (dispatched by the train on a `train/batch/*` branch via
  # workflow_dispatch) is the authoritative gate; running the full matrix on
  # every individual PR too is pure double-work — N per-PR runs + the batch run
  # — and the flood of per-PR CI completions storms the train's `workflow_run`
  # trigger so badly that no train run survives to land. The heavy jobs below
  # gate on `event_name != 'merge_group'`, so the train's workflow_dispatch (and
  # the nightly schedule) still run them; only the per-PR fan-out is dropped.
  # A genuinely-broken PR is caught when the train batches it (attribute+drop).
  #
  # PER-PR GATING LIVES IN pr-gate.yml, NOT HERE (#2865). Dropping the per-PR
  # fan-out was right; leaving `CI Gate` as trunk's required context was not.
  # `CI Gate` is produced only by a train/batch/* dispatch, so it never appears
  # on a PR head SHA — every PR was permanently BLOCKED and `--admin` became the
  # only merge path, which meant the batch CI never ran on merged work (that is
  # how a stale feature-catalog.json reached trunk). The fix is a SEPARATE
  # workflow, `.github/workflows/pr-gate.yml`, publishing the context `PR Gate`:
  # one cheap runner (build + format + Fast unit + architecture/MCP governance
  # smoke plus the required Server Governance/Drift Testcontainers check, no
  # `services:` orchestration), sharing its steps
  # with `merge-queue-gate`
  # below via ./.github/actions/lean-gate.
  # DO NOT "simplify" that by adding a `pull_request` trigger to THIS workflow.
  # The heavy jobs below guard on `event_name != 'pull_request' || <not
  # dependabot>`, which is TRUE for an ordinary PR — the trigger alone would fan
  # the full CI matrix — every server-test shard in `.github/ci-shards.json`
  # plus the AOT/Docker/browser/MCP/provider lanes — out per PR and rebuild the
  # exact runner storm this header exists to prevent. Three gates, three
  # distinct contexts, none interchangeable: `PR Gate` (per-PR) / `Merge Queue Gate` (per-batch,
  # dormant) / `CI Gate` (the train's batch CI).
  #
  # SELECTIVE BATCHES: a train/batch/* dispatch is gated like a PR diffed against
  # trunk — the `changes` + `targeted-shards` jobs run only the shards/lanes the
  # batch's cumulative diff touches (the smart-ci subset the train computes),
  # not the whole fanout every batch. The targeted-tests selector self-escalates
  # to run_all on infra/shared/unmapped changes, and the nightly `schedule` still
  # runs the FULL matrix as the backstop, so coverage is preserved while the
  # per-batch rerun of already-green shards is eliminated. `-f full_ci=true`
  # (or a schedule/non-train dispatch) forces the full lane.
  # Merge queue (LEAN gate): GitHub batches approved PRs and runs CI once on
  # the combined commit before fast-forwarding trunk. The full CI matrix (every
  # server-test shard in `.github/ci-shards.json` plus the AOT, Docker, browser,
  # MCP and provider lanes) already gated each PR on its own `pull_request` run
  # BEFORE it entered the queue, so
  # re-running that matrix on every batch is pure waste — and at batch sizes of
  # 5 it caused runner starvation, ejected the front PR, reformed the group,
  # spawned zombie runs, and spiralled (merge queue disabled 2026-06-18,
  # ruleset 17808547). The merge_group event therefore runs ONLY the lean
  # `merge-queue-gate` job (build + format + fast unit/architecture smoke) to
  # catch semantic conflicts from BATCHING — not to re-validate each PR. Every
  # heavy job is `if:`-gated to `pull_request`/schedule and SKIPS on
  # merge_group; the PR-time aggregator `CI Gate` likewise does not run on
  # merge_group. The merge-queue REQUIRED check must be `Merge Queue Gate`,
  # NOT `CI Gate`. See docs/internal/ci/gate-model.md.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      merge_train_nonce:
        description: 'Opaque merge-train dispatch identity used to correlate the exact Actions run'
        required: false
        default: ''
      sdk_ref:
        description: 'honua-sdk-js git ref for MCP tests (overrides MCP_SDK_REF env)'
        required: false
        default: ''
      full_ci:
        description: 'Force the FULL matrix even on a train/batch/* dispatch (overrides the selective-vs-trunk batch gate). Also overrides selective_base.'
        required: false
        type: boolean
        default: false
      selective_base:
        description: 'Trailing-verification mode: full SHA of a trunk ancestor (typically the last matrix-green head). The run diffs selective_base...HEAD and gates only the shards/lanes that diff touches. Empty = full lane. Overridden by full_ci=true.'
        required: false
        type: string
        default: ''
      console_image:
        description: 'Optional honua-console image tag for the quickstart Console compose smoke. Defaults to repository variable HONUA_CONSOLE_IMAGE when set.'
        required: false
        default: ''

concurrency:
  # PR runs key on the PR number (re-push cancels the prior run). Trunk runs
  # serialize without cancellation so at least one trailing matrix always
  # reaches a terminal result for the fleet lander's red/green brake. merge_group
  # and other non-PR events key on github.ref. For merge_group, github.ref is
  # the unique per-batch queue ref (refs/heads/gh-readonly-queue/trunk/pr-...),
  # so each batch gets its OWN concurrency group: a reformed group runs under a
  # NEW ref and is NOT cancelled-in-progress by the prior batch (and cannot be
  # cancelled BY it). This is deliberate — the historical zombie-run spiral came
  # from re-running the full matrix per batch, not from this key; with the lean
  # gate the per-batch group is cheap, so leave cancel-in-progress on (it still
  # collapses duplicate checks_requested events for the SAME batch ref).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

env:
  DOTNET_VERSION: '10.0.x'
  # Keep one persistent MSBuild server alive across restore/build/test calls in
  # each job. Roslyn shared compilation remains enabled by default.
  DOTNET_CLI_USE_MSBUILD_SERVER: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  # honua-sdk-js ref for MCP certification and LLM smoke tests.
  # STATUS (#2807): this pinned commit does NOT yet contain the
  # `test:certification`, `test:certification:artifact`, or `test:llm-smoke`
  # scripts (they are honua-sdk-js #484 work), so the mcp-certification /
  # mcp-llm-smoke lanes skip cleanly and produce NO certification artifact
  # today. Do not read the pin as evidence that the MCP surface is certified.
  # IMPORTANT: once the scripts land, re-pin this to the SDK tag or commit SHA
  # that contains them so results are reproducible release-grade evidence for a
  # given server commit. A branch name like 'trunk' is useful for development
  # but its artifacts are not release-grade evidence.
  # workflow_dispatch `sdk_ref` overrides this value for manual replays.
  MCP_SDK_REF: '404242df3cbf10f707ee9137405bf93b3de0012d'

permissions:
  contents: read
  packages: read

jobs:
  pr-template-check:
    name: Validate PR Template Compliance
    # Gate every heavy CI job on PR-body template compliance. For non-PR events
    # (schedule, workflow_dispatch) this job short-circuits to success so
    # nightly/manual runs are never blocked. Dependabot PRs skip the check to
    # match the previous standalone workflow's behavior. Skips on merge_group —
    # the batched commit has no PR body and the lean gate does not template-check.
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Skip template validation for non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Non-PR event; PR template validation skipped."

      - name: Check PR Template Compliance
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const body = pr.body || '';
            const title = pr.title || '';

            console.log('Validating PR:', title);

            const issues = [];
            const warnings = [];

            // --- Required sections ---

            // 1. Issue link
            const hasIssueLink = /(?:Fixes|Closes|Resolves|Related to)\s+#\d+/i.test(body);
            if (!hasIssueLink) {
              issues.push('**Missing issue link** — add `Fixes #123` (or Closes/Resolves/Related to)');
            }

            // 2. Summary (non-empty content after the heading)
            const hasSummary = /## Summary\s*\n(?:<!--[\s\S]*?-->\s*\n)?\s*\S+/m.test(body);
            if (!hasSummary) {
              issues.push('**Empty Summary** — describe what this PR does and why');
            }

            // 3. Changes Made (at least one bullet, bounded to section)
            const changesSection = body.match(/## Changes Made([\s\S]*?)(?=\n##|\n---|\s*$)/);
            const hasChanges = changesSection && /\n- \S/.test(changesSection[1]);
            if (!hasChanges) {
              issues.push('**Changes Made incomplete** — list key changes as bullet points');
            }

            // 4. Breaking Changes (must have content, not just the heading)
            const breakingSection = body.match(/## Breaking Changes\s*\n([\s\S]*?)(?=\n---|$)/m);
            if (!breakingSection || !breakingSection[1].trim()) {
              issues.push('**Breaking Changes empty** — list breaking changes or write "None"');
            }

            // 5. Pre-PR check confirmed
            const prePrChecked = /- \[x\].*scripts\/ci\/pre-pr-check\.sh/i.test(body);
            if (!prePrChecked) {
              issues.push('**Pre-PR validation not confirmed** — run `scripts/ci/pre-pr-check.sh` and check the box');
            }

            // 6. PR title format (conventional commits)
            const titleFormat = /^(feat|fix|docs|style|refactor|test|chore|ci|perf)(\([^)]+\))?: .+/i;
            if (!titleFormat.test(title)) {
              issues.push('**PR title format** — use conventional format: `type(scope): description` (e.g., `feat: add query endpoint`)');
            }

            // --- Warnings (recommended but not blocking) ---

            // Gate impact section
            const hasGateImpact = /## Gate Impact/m.test(body);
            if (!hasGateImpact) {
              warnings.push('**Missing Gate Impact section** — template may be outdated');
            } else {
              const gateSection = body.match(/## Gate Impact([\s\S]*?)(?=\n##|\n---|\s*$)/);
              if (!gateSection || !/- \[x\]/.test(gateSection[1])) {
                warnings.push('**No Gate Impact boxes checked** — indicate which CI tiers are affected');
              }
            }

            // Testing section (bounded to section)
            const testingSection = body.match(/## Testing([\s\S]*?)(?=\n##|\n---|\s*$)/);
            if (!testingSection || !/- \[x\]/.test(testingSection[1])) {
              warnings.push('**No Testing boxes checked** — indicate what testing was performed');
            }

            // --- Generate comment ---
            let comment = '## PR Template Validation\n\n';

            if (issues.length === 0 && warnings.length === 0) {
              comment += 'All checks passed. Your PR follows the template correctly.\n';
            } else {
              if (issues.length > 0) {
                comment += '### Issues (must fix)\n\n';
                issues.forEach(issue => comment += `- ${issue}\n`);
                comment += '\n';
              }

              if (warnings.length > 0) {
                comment += '### Warnings (recommended)\n\n';
                warnings.forEach(warning => comment += `- ${warning}\n`);
                comment += '\n';
              }

              comment += 'Edit your PR description to address these issues — this check re-runs automatically.\n';
            }

            comment += '\n---\n*PR validation — see [template guide](../blob/trunk/.github/pull_request_template.md) and [gate model](../blob/trunk/docs/internal/ci/gate-model.md)*';

            // Upsert validation comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.body.includes('## PR Template Validation') || c.body.includes('\u{1F916} PR Template Validation')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

            if (issues.length > 0) {
              // Advisory only: surface template gaps as a warning + the PR comment above, but
              // never block the merge. Agent PRs carry rich descriptions that rarely match the
              // exact template shape; gating real CI signal behind a formatting lint was pure
              // friction (the #1 reason a sound PR looked broken). The comment still nudges.
              core.warning(`PR template suggestions: ${issues.length} item(s) — see the PR comment (non-blocking).`);
            }

  pr-readiness:
    name: PR Mergeability & Freshness
    # Decoupled from pr-template-check (was: `needs: pr-template-check`).
    # Chaining the build/test graph behind the PR-body template check meant a
    # single template miss SKIPPED every downstream job and published a RED
    # "CI Gate" with no actual validation run — the most common reason an
    # otherwise-correct PR looked broken (see Pull Request Policy in CLAUDE.md;
    # #1736/#1737 needed a manual re-trigger). pr-template-check is still a
    # first-class job and still feeds CI Gate (so a template failure still
    # fails the gate), but it no longer gates whether the code is validated.
    # Skips on merge_group (no PR to check mergeability/freshness for; the queue
    # enforces up-to-date-ness itself).
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip mergeability preflight for non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Non-PR event; mergeability preflight skipped."

      - name: Fail fast on conflicted or stale PR branches
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            let pull = null;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pull = response.data;
              if (pull.mergeable !== null) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!pull) {
              core.setFailed('Unable to load pull request metadata.');
              return;
            }

            const mergeable = pull.mergeable;
            const mergeableState = String(pull.mergeable_state || 'unknown');
            core.info(`mergeable=${mergeable} mergeable_state=${mergeableState}`);

            if (mergeable === false || mergeableState === 'dirty') {
              core.setFailed('PR branch has merge conflicts. Resolve conflicts before running CI.');
              return;
            }

            if (mergeableState === 'behind') {
              core.setFailed('PR branch is behind trunk. Refresh the branch before running CI.');
            }

  changes:
    name: Detect Non-Test Changes
    # Skips on merge_group: the lean merge-queue gate does not consult the
    # change-detection / shard-routing graph (it always runs build + format +
    # fast smoke). Skipping `changes` cascades a skip to every heavy job that
    # `needs: changes` (build, *-tests, postgres-compat, aot-build, docker-build,
    # browser/MCP lanes), so the full matrix never runs on a batched commit.
    if: ${{ github.event_name != 'merge_group' }}
    needs: pr-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      non_test_changes: ${{ steps.filter.outputs.non_test_changes }}
      build_changes: ${{ steps.filter.outputs.build_changes }}
      integration_changes: ${{ steps.filter.outputs.integration_changes }}
      integration_reason: ${{ steps.filter.outputs.integration_reason }}
      full_ci: ${{ steps.filter.outputs.full_ci }}
      postgres_matrix: ${{ steps.filter.outputs.postgres_matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        env:
          SELECTIVE_BASE: ${{ inputs.selective_base }}
          FULL_CI_INPUT: ${{ inputs.full_ci }}
        run: |
          # Fetch the base branch with FULL history (NOT --depth=1). The filter below
          # uses a three-dot range (base...head) that needs a merge-base; a shallow
          # base fetch makes `git diff` fail with "fatal: no merge base", which the
          # downstream `|| true` silently turned into an empty changed-file list →
          # build_changes=false → the required build jobs SKIP and the PR is stuck
          # BLOCKED. checkout already used fetch-depth: 0, so this is a cheap ref update.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "range=origin/${{ github.base_ref }}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "trailing_selective=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
               [[ "${SELECTIVE_BASE}" =~ ^[0-9a-f]{40}$ ]] &&
               [ "${FULL_CI_INPUT}" != "true" ]; then
            # Trailing-verification dispatch: diff against the last verified
            # trunk head so only landings since then gate lanes/shards. The
            # SHA regex is the injection guard; an unknown SHA fails safe to
            # the full trunk range below.
            git fetch --no-tags origin trunk
            if git cat-file -e "${SELECTIVE_BASE}^{commit}" 2>/dev/null; then
              echo "range=${SELECTIVE_BASE}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "trailing_selective=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::selective_base ${SELECTIVE_BASE} not found in history; forcing full CI."
              echo "range=origin/trunk...${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "trailing_selective=false" >> "$GITHUB_OUTPUT"
            fi
          else
            git fetch --no-tags origin trunk
            echo "range=origin/trunk...${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "trailing_selective=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for non-test changes
        id: filter
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          TRAILING_SELECTIVE_BASE: ${{ inputs.selective_base }}
        run: |
          set -euo pipefail
          # PRs and selective batches run the complete compatibility suite without
          # coverage instrumentation; scheduled/manual full CI remains authoritative.
          POSTGRES_BASELINE='[{"pg_image":"postgis/postgis:16-3.4","pg_suffix":"16","collect_coverage":false}]'
          POSTGRES_FULL='[{"pg_image":"postgis/postgis:16-3.4","pg_suffix":"16","collect_coverage":true},{"pg_image":"postgis/postgis:17-3.5","pg_suffix":"17","collect_coverage":false},{"pg_image":"postgis/postgis:18-3.6","pg_suffix":"18","collect_coverage":false}]'

          # Fail safe: if the diff range cannot be computed (e.g. no merge-base after a
          # full base fetch), run the full build/integration lane rather than silently
          # skipping the required build jobs. A diff failure must NEVER fall through to
          # build_changes=false (that left PRs stuck BLOCKED with build jobs "skipping").
          if ! CHANGED_FILES=$(git diff --name-only "${{ steps.diff.outputs.range }}" 2>/dev/null); then
            echo "::warning::Diff range '${{ steps.diff.outputs.range }}' unavailable (no merge-base); running the full build lane."
            {
              echo "build_changes=true"
              echo "non_test_changes=true"
              echo "integration_changes=true"
              echo "integration_reason=diff_range_unavailable"
              echo "full_ci=false"
              echo "postgres_matrix=${POSTGRES_BASELINE}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A merge-train batch CI is dispatched via workflow_dispatch on a
          # `train/batch/*` branch. Treat it like a PR diffed against trunk: gate
          # only the shards/lanes its cumulative diff touches (the smart-ci subset
          # the train already computes) instead of re-running the full matrix on
          # every batch. The targeted-tests script self-escalates to run_all on
          # infra/shared/unmapped changes, and the nightly `schedule` still runs
          # the full lane, so coverage is preserved. `-f full_ci=true` forces full.
          SELECTIVE_BATCH=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [[ "${GITHUB_REF_NAME}" == train/batch/* ]] &&
             [ "${{ inputs.full_ci }}" != "true" ]; then
            SELECTIVE_BATCH=true
          fi
          # Trailing-verification dispatch (selective_base input): same selective
          # gating as a batch — lanes/shards the diff touches, nightly stays full.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "${{ steps.diff.outputs.trailing_selective }}" = "true" ] &&
             [ "${{ inputs.full_ci }}" != "true" ]; then
            SELECTIVE_BATCH=true
          fi
          echo "Selective batch decision: ref_name=${GITHUB_REF_NAME} full_ci=${{ inputs.full_ci }} selective=${SELECTIVE_BATCH}"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${SELECTIVE_BATCH}" != "true" ]; then
            echo "build_changes=true" >> "$GITHUB_OUTPUT"
            echo "non_test_changes=true" >> $GITHUB_OUTPUT
            echo "integration_changes=true" >> "$GITHUB_OUTPUT"
            echo "integration_reason=scheduled_or_manual_full_ci" >> "$GITHUB_OUTPUT"
            echo "full_ci=true" >> "$GITHUB_OUTPUT"
            echo "postgres_matrix=${POSTGRES_FULL}" >> "$GITHUB_OUTPUT"
            INTEGRATION_FILES="<full integration event>"
            BUILD_FILES="<full integration event>"
          else
            if printf '%s' "${PR_LABELS_JSON:-[]}" | jq -e 'index("ci/full") or index("full-ci")' >/dev/null; then
              FULL_CI=true
            else
              FULL_CI=false
            fi

            # PRs that only touch docs, CI/publish plumbing, package metadata,
            # or NuGet source configuration do not need the full integration
            # fanout. Scheduled/manual CI still runs the full lane.
            NON_TEST_FILES=$(echo "$CHANGED_FILES" | grep -Ev '^(tests/|test/)' | sed '/^$/d' || true)
            if [ -z "$NON_TEST_FILES" ]; then
              echo "non_test_changes=false" >> $GITHUB_OUTPUT
            else
              echo "non_test_changes=true" >> $GITHUB_OUTPUT
            fi

            BUILD_FILES=$(
              printf '%s\n' "$CHANGED_FILES" \
                | grep -Ev '^($|docs/|README\.md$|\.github/(workflows/[^/]+\.yml$|ci-shards\.json$)|scripts/ci/)' \
                | sed '/^$/d' || true
            )

            INTEGRATION_FILES=$(
              printf '%s\n' "$CHANGED_FILES" \
                | grep -Ev '^($|docs/|README\.md$|\.github/(actions/setup-dotnet-ci/|workflows/[^/]+\.yml$|ci-shards\.json$)|scripts/ci/|NuGet\.config$|src/Honua\.Core/Honua\.Core\.csproj$)' \
                | sed '/^$/d' || true
            )

            # A trailing run is selective across a range of already-landed commits,
            # but the compatibility jobs below are currently routed by full_ci rather
            # than by individual path selectors. Keep docs/CI-only ranges cheap; when
            # the range contains runtime or test changes, run those compatibility
            # lanes instead of silently suppressing them.
            if [ "${{ steps.diff.outputs.trailing_selective }}" = "true" ] &&
               [ -n "$INTEGRATION_FILES" ]; then
              FULL_CI=true
            fi

            if [ "${FULL_CI}" = "true" ]; then
              echo "build_changes=true" >> "$GITHUB_OUTPUT"
              echo "integration_changes=true" >> "$GITHUB_OUTPUT"
              echo "integration_reason=pr_label_ci_full" >> "$GITHUB_OUTPUT"
              echo "postgres_matrix=${POSTGRES_FULL}" >> "$GITHUB_OUTPUT"
            elif [ -z "$INTEGRATION_FILES" ]; then
              if [ -z "$BUILD_FILES" ]; then
                echo "build_changes=false" >> "$GITHUB_OUTPUT"
              else
                echo "build_changes=true" >> "$GITHUB_OUTPUT"
              fi
              echo "integration_changes=false" >> "$GITHUB_OUTPUT"
              echo "integration_reason=ci_package_or_docs_only" >> "$GITHUB_OUTPUT"
              echo "postgres_matrix=${POSTGRES_BASELINE}" >> "$GITHUB_OUTPUT"
            else
              echo "build_changes=true" >> "$GITHUB_OUTPUT"
              echo "integration_changes=true" >> "$GITHUB_OUTPUT"
              echo "integration_reason=runtime_or_test_changes" >> "$GITHUB_OUTPUT"
              echo "postgres_matrix=${POSTGRES_BASELINE}" >> "$GITHUB_OUTPUT"
            fi
            echo "full_ci=${FULL_CI}" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          echo "Non-test files:"
          echo "${NON_TEST_FILES:-<full integration event>}"
          echo ""
          echo "Build-triggering files:"
          echo "${BUILD_FILES:-<none>}"
          echo ""
          echo "Integration-triggering files:"
          echo "${INTEGRATION_FILES:-<none>}"
          echo ""
          echo "Full CI:"
          echo "${FULL_CI:-true}"

  # Compute the server-tests shard subset for this PR. Scheduled/manual full
  # integration runs execute every shard. See ADR-0037.
  # Per ADR-0037 .github/ci-shards.json is the single source of truth for both
  # the shard routing data (paths) and the matrix-runtime metadata
  # (artifact_suffix, log_name, timeout_minutes, test_timeout_minutes,
  # max_cpu_count, upload flags, filter). This job emits two outputs:
  #   - descriptor: the {run_all, shards, reason} structure from the targeted-
  #     tests script (kept for visibility in logs).
  #   - matrix_include: a JSON array of matrix entries built from ci-shards.json
  #     and filtered to the selected shard names. ci.yml::server-tests consumes
  #     this via `strategy.matrix.include: ${{ fromJson(...) }}` so unselected
  #     shards never instantiate a runner.
  targeted-shards:
    name: Detect Targeted Server-Tests Shards
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      descriptor: ${{ steps.compute.outputs.descriptor }}
      matrix_include: ${{ steps.compute.outputs.matrix_include }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Compute shard descriptor and matrix include
        id: compute
        env:
          TRAILING_SELECTIVE_BASE: ${{ inputs.selective_base }}
        run: |
          set -euo pipefail
          all_shards_json=$(jq -c '[.shards[].name]' .github/ci-shards.json)
          # Selective base: a PR diffs against its base branch; a merge-train
          # batch (workflow_dispatch on train/batch/*, no full_ci override) diffs
          # against trunk so it runs ONLY the shards its cumulative diff touches
          # — the smart-ci subset — instead of the full fanout every batch.
          selective_base=""
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.outputs.full_ci }}" != "true" ]; then
            selective_base="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/batch/') && inputs.full_ci != true }}" = "true" ]; then
            selective_base="origin/trunk"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
               [[ "${TRAILING_SELECTIVE_BASE:-}" =~ ^[0-9a-f]{40}$ ]] &&
               [ "${{ inputs.full_ci }}" != "true" ]; then
            # Trailing-verification dispatch: shard-select against the last
            # verified trunk head. Unknown SHA falls through to the script's
            # own run_all fail-safe below.
            selective_base="${TRAILING_SELECTIVE_BASE}"
          fi

          if [ -n "${selective_base}" ]; then
            # Full base history (not --depth=1) so the targeted-tests diff has a
            # merge-base. A raw-SHA base needs no ref fetch (fetch-depth: 0
            # checkout already has trunk history).
            [[ "${selective_base}" == origin/* ]] && git fetch --no-tags origin "${selective_base#origin/}"
            # Fail SAFE to run_all if the diff/script cannot be computed, so a
            # batch is never under-tested by a silent selection failure.
            if ! descriptor=$(scripts/ci/honua-server-targeted-tests.sh --base "${selective_base}"); then
              echo "::warning::targeted-tests selection failed for base ${selective_base}; falling back to run_all."
              descriptor=$(jq -nc --argjson shards "${all_shards_json}" \
                '{run_all: true, shards: $shards, reason: "targeted_selection_failed"}')
            fi
          else
            reason="scheduled_or_manual_full_ci"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              reason="pr_label_ci_full"
            fi
            descriptor=$(jq -nc --argjson shards "${all_shards_json}" \
              --arg reason "${reason}" \
              '{run_all: true, shards: $shards, reason: $reason}')
          fi
          echo "Descriptor: ${descriptor}"

          # Build the matrix include list by joining the selected shard names
          # against the ci-shards.json shard metadata. Drop the routing-only
          # `paths` field; project the rest verbatim into matrix entries.
          selected=$(printf '%s' "${descriptor}" | jq -c '.shards')
          matrix_include=$(jq -c --argjson sel "${selected}" '
            .shards
            | map(select(.name as $n | $sel | index($n)))
            | map({
                shard_name,
                dispatch_rank,
                artifact_suffix,
                log_name,
                timeout_minutes,
                test_timeout_minutes,
                max_cpu_count,
                upload_operator_eval_report,
                upload_odata_evidence,
                filter,
                csproj: (.csproj // ""),
                advisory: (.advisory // false)
              })
            | sort_by(-.dispatch_rank)
          ' .github/ci-shards.json)
          if [ "$(printf '%s' "${matrix_include}" | jq 'length')" = "0" ]; then
            echo "::error::matrix_include is empty — targeted-shards selected no shards"
            exit 1
          fi
          echo "matrix_include: ${matrix_include}"
          echo "descriptor=${descriptor}" >> "$GITHUB_OUTPUT"
          echo "matrix_include=${matrix_include}" >> "$GITHUB_OUTPUT"

  ci-router-validation:
    name: CI Router Validation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate workflow and shard routing metadata
        run: |
          scripts/ci/validate-ci-router.sh
          scripts/ci/merge-train/fixtures/validate-mode.sh
          bash scripts/ci/validate-single-merge-authority.sh

      # The manual batch train remains a merge authority, so its offline
      # fixtures gate every CI run rather than only a local pre-PR check. They carry the
      # startup-recovery drift guard: a phase added to the persisted-state
      # schema without a recovery class deadlocks all merging repo-wide (#3045),
      # and a guard that never runs in CI would not have caught it. Both are
      # offline (no network, no gh, no dotnet) and run in ~90s together.
      - name: Validate merge-train recovery and landing fixtures
        run: |
          scripts/ci/merge-train/fixtures/validate-merge-train.sh
          scripts/ci/merge-train/fixtures/validate-review-admission.sh
          scripts/ci/merge-train/fixtures/validate-timeout-retry.sh
          scripts/ci/merge-train/fixtures/validate-leg-timeout-flake.sh
          scripts/ci/merge-train/fixtures/validate-capacity-ordering.sh
          scripts/ci/merge-train/fixtures/validate-early-failure-observe.sh

      - name: Validate Kubernetes operator guide contract
        run: scripts/ci/check-kubernetes-guide.sh

  build:
    name: Build & Format Check
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.build_changes == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Canonical Instruction Check
        run: bash scripts/ci/check-instructions-sync.sh

      # The full-solution build can exhaust ubuntu-latest disk once every
      # project writes Release bin/obj outputs. Reclaim unused hosted toolchains
      # before .NET setup and restore so runner diagnostics keep enough space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: scripts/ci/dotnet-restore-retry.sh Honua.sln

      - name: Compute affected projects
        id: affected
        # ADR-0043 PR #2 — scope the warnings-as-errors build to projects
        # affected by this PR + their reverse-dependency closure. Force-fulls
        # whenever shared infra changes (Directory.Packages.props, Honua.sln,
        # .github/, scripts/ci/) so a graph change cannot bypass the gate.
        # The trunk-merge build is unaffected: push events resolve to BASE_REF
        # 'origin/trunk' against HEAD 'HEAD'; on trunk that diff is empty so
        # the script emits nothing and the build step short-circuits — meaning
        # the canonical correctness gate is the PR check that landed it.
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/trunk' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: |
          affected="$(scripts/ci/compute-affected-projects.sh)"
          if [[ -z "${affected}" || "${affected}" == "ALL" ]]; then
            mode="full"
            projects=""
          else
            mode="affected"
            projects="$(printf '%s' "${affected}" | tr '\n' ' ')"
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          {
            echo "projects<<EOF"
            printf '%s' "${projects}"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Warnings-as-errors build mode: ${mode}${projects:+ (${projects})}"

      - name: Build (warnings as errors)
        run: |
          if [[ "${{ steps.affected.outputs.mode }}" == "affected" ]]; then
            # shellcheck disable=SC2086
            dotnet build ${{ steps.affected.outputs.projects }} \
              --no-restore \
              --configuration Release \
              -graphBuild \
              /p:TreatWarningsAsErrors=true
          else
            dotnet build Honua.sln \
              --no-restore \
              --configuration Release \
              -graphBuild \
              /p:TreatWarningsAsErrors=true
          fi

      - name: Format Check
        # --no-restore: the `Restore` step above already restored Honua.sln and
        # the build consumed those exact assets, so letting `dotnet format`
        # re-evaluate restore is pure repeated network/project work with no gain
        # in format coverage. Identical to the lean gate's own format line.
        run: dotnet format Honua.sln --verify-no-changes --no-restore --verbosity diagnostic

  # Foundation test FAMILIES (#3567). This lane used to be a single serial job
  # whose per-family steps ran back to back: on the 2026-08-27 batch run
  # 33097133234 it spanned 39m19s (Core 18m23s of which ~18m was Coverlet
  # instrumentation of the 39-assembly closure for an 8-second test run, Core
  # Security 2m52s, Server Fast 2m08s, Protocol Fast 2m29s, everything else
  # under 1m30s each) and the merge train waited on all of it. The families are
  # now four concurrent runners; scripts/ci/run-foundation-family.sh owns the
  # family -> project/filter mapping so the "same tests run after the split"
  # invariant lives in one file. `dotnet-foundation-tests` below fans them back
  # in, keeping the `.NET Foundation Tests` check name that `test-all`, the
  # merge-train real-gate regex (scripts/ci/merge-train/select.sh) and the
  # coverage artifacts already depend on. A matrix (rather than four hand-rolled
  # jobs) is deliberate: adding a family cannot leave a job un-required, because
  # `test-all` needs the single matrix job id.
  dotnet-foundation-family-tests:
    name: .NET Foundation Tests (${{ matrix.family_name }})
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    # Each family restores and builds its own closure. Run in parallel with
    # Build & Format Check; CI Gate still requires every result via `test-all`.
    needs: changes
    runs-on: ubuntu-latest
    # Per-family budget. The pre-split job carried a single 110-minute
    # orchestrator timeout covering every step; these are the same
    # step budgets regrouped, with headroom over the measured family time
    # (Core ~13m, Server ~13m, Protocols ~10m, Providers ~8m projected).
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: core
            family_name: Core
            timeout_minutes: 45
          - family: server
            family_name: Server
            timeout_minutes: 40
          - family: protocols
            family_name: Protocols
            timeout_minutes: 30
          - family: providers
            family_name: Providers
            timeout_minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1

      # Reclaim runner disk before the build + coverage run; the modular
      # topology pushed some runners over the free-disk limit. Best-effort.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h / || true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: scripts/ci/dotnet-restore-retry.sh Honua.sln

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      # The pre-split job computed an affected-project closure (ADR-0043 PR #2)
      # and built THAT, then ran `dotnet test --no-build` against projects that
      # closure did not necessarily contain — correct only because the fallback
      # was a full-solution build. Each family now builds exactly the projects
      # it is about to test, in ONE MSBuild invocation so the shared closure is
      # walked once and parallelised. That is both smaller than the
      # full-solution build for the Protocols/Providers families and immune to
      # the diff shape, which is what makes `--no-build` safe below.
      - name: Build foundation family binaries
        timeout-minutes: 25
        run: scripts/ci/run-foundation-family.sh build ${{ matrix.family }}

      - name: Run foundation family tests
        timeout-minutes: 45
        run: scripts/ci/run-foundation-family.sh run ${{ matrix.family }}

      - name: Upload foundation family test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        timeout-minutes: 3
        with:
          name: foundation-test-results-${{ matrix.family }}
          path: tests/TestResults/
          if-no-files-found: warn
          retention-days: 7

      # Coverlet's XPlat collector drops `coverage.cobertura.xml` into a per-run
      # GUID subdirectory under TestResults. Only the Core family collects
      # coverage (as before the split), but the artifact is uploaded per family
      # so the fan-in job below can merge whatever exists without special-casing.
      - name: Upload foundation family coverage (cobertura)
        uses: actions/upload-artifact@v7.0.1
        if: always()
        timeout-minutes: 3
        with:
          name: foundation-coverage-${{ matrix.family }}
          path: tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 7

  # Fan-in for the family matrix above. Deliberately keeps the job id
  # `dotnet-foundation-tests` and the check name `.NET Foundation Tests`:
  #   - `test-all` (and therefore `CI Gate`) already requires this id;
  #   - scripts/ci/merge-train/select.sh classifies `.NET Foundation Tests` as a
  #     REAL gate (never laundered into a flake) via TRAIN_REAL_GATE_JOB_REGEX,
  #     which matches the family jobs too since their names carry the prefix;
  #   - the merged `foundation-test-results` / `foundation-coverage` artifact
  #     names and the `foundation` Codecov flag are unchanged for consumers.
  # `test-all` needs BOTH this job and the matrix job, so a bug in this
  # aggregation cannot silently un-gate a family.
  dotnet-foundation-tests:
    name: .NET Foundation Tests
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    needs: [changes, dotnet-foundation-family-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Needed for scripts/ci/run-foundation-family.sh, which supplies the
      # expected trx count the parity check below asserts against.
      - uses: actions/checkout@v7.0.1

      # continue-on-error: a family that died before its upload step leaves no
      # artifact to download, and that must surface as the family's own failure
      # in the result check below rather than as a confusing download error.
      # It does NOT mean a download failure is tolerated — the parity check in
      # the next step fails the job whenever the families all succeeded but the
      # merged set is short, so an artifact-service error cannot land a green
      # `.NET Foundation Tests` on top of missing results.
      - name: Download family test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: foundation-test-results-*
          path: tests/TestResults
          merge-multiple: true

      - name: Verify merged foundation results
        run: |
          trx_count=$(find tests/TestResults -name '*.trx' 2>/dev/null | wc -l)
          cobertura_count=$(find tests/TestResults -name 'coverage.cobertura.xml' 2>/dev/null | wc -l)
          expected_trx=$(scripts/ci/run-foundation-family.sh expected-trx-count)
          family_result='${{ needs.dotnet-foundation-family-tests.result }}'

          {
            echo "### .NET Foundation Tests"
            echo
            echo "| families | trx merged | trx expected | cobertura reports |"
            echo "| --- | ---: | ---: | ---: |"
            echo "| ${family_result} | ${trx_count} | ${expected_trx} | ${cobertura_count} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Merged ${trx_count}/${expected_trx} trx file(s) and ${cobertura_count} cobertura report(s)."

          # One trx per claimed test project. If every family passed, the merged
          # set must be complete: anything less means a family's results never
          # reached this job (artifact upload/download failure, or a project that
          # silently produced no results), and republishing a short
          # `foundation-test-results` as if it were whole is exactly the kind of
          # green-over-missing-evidence this lane must not do.
          if [[ "${family_result}" == "success" && "${trx_count}" -lt "${expected_trx}" ]]; then
            echo "::error::All foundation families passed but only ${trx_count} of ${expected_trx} trx files reached the fan-in job — results are missing, not merged."
            exit 1
          fi

      # Republish under the pre-split artifact names so anything pointing at
      # `foundation-test-results` / `foundation-coverage` keeps working, and so
      # coverage is aggregated across families in one place rather than being
      # scattered by the split.
      - name: Upload foundation test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-test-results
          path: tests/TestResults/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload foundation coverage (cobertura)
        uses: actions/upload-artifact@v7.0.1
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-coverage
          path: tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      # CodeCov upload — only runs when a token is configured in repo secrets.
      # Unchanged from the pre-split job except that the files it uploads are
      # now the merged set from every family.
      - name: Upload coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/TestResults/**/coverage.cobertura.xml
          flags: foundation
          name: foundation-tests
          fail_ci_if_error: false

      - name: Check foundation family results
        run: |
          result='${{ needs.dotnet-foundation-family-tests.result }}'
          if [[ "${result}" != "success" ]]; then
            echo "::error::.NET Foundation Tests families concluded '${result}'."
            exit 1
          fi
          echo "All .NET Foundation Tests families passed."

  server-tests:
    name: Server Tests (${{ matrix.shard_name }})
    # Per ADR-0037 the PR gate runs only the targeted shards selected by
    # scripts/ci/honua-server-targeted-tests.sh; scheduled/manual full runs
    # execute the full matrix. The matrix is built dynamically
    # by `targeted-shards` from .github/ci-shards.json — unselected shards
    # never instantiate a runner job, so per-shard `if:` gating is no longer
    # needed. The PR shard step composes its filter with `&Tier!=Slow` so
    # [EmulatorTest]/[ScaleTest]/[ExternalServiceTest]/[CloudTest] methods
    # in a shard's namespace stay in nightly-slow-tier.yml, and `&Tier!=Fast`
    # so Fast tests run only once in dotnet-foundation-tests. Per #2943 that
    # foundation "Run .NET Tests (Protocol Fast Tier)" step now covers all 8
    # protocol-split projects (not just Honua.Server.Tests), so this
    # exclusion is safe for every shard's csproj, not only the legacy
    # Honua.Server.Tests.csproj default.
    #
    # Advisory shards (matrix.advisory==true — the #1965 rotted Features.* buckets)
    # are SKIPPED on pull_request: they are non-gating, currently always-red, and
    # painting every PR red kept PRs UNSTABLE (blocking the clean-only merge-train).
    # They still run on scheduled/manual full-matrix runs so the coverage signal
    # isn't lost. Delete the matrix.advisory clause once #1965 fixes the tests.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    runs-on: ubuntu-latest
    # Every shard restores and builds its own test project. Waiting for the
    # independent build/format job added ~14 minutes to the critical path.
    needs: [changes, targeted-shards]
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # Advisory shards (matrix.advisory == true in .github/ci-shards.json) RUN and
    # publish results but do NOT gate the merge: continue-on-error is applied to the
    # "Run server test shard" STEP (below), so an advisory test failure is swallowed
    # there and the JOB CONCLUDES SUCCESS. That keeps CI Gate green (needs.*.result
    # has no failure) AND keeps the job's check-run green — so the PR's
    # mergeStateStatus stays CLEAN and the clean-only merge-train can auto-merge it.
    # (A job-LEVEL continue-on-error kept CI Gate green but still published a FAILING
    # check-run for the shard, forcing every PR to UNSTABLE and stalling auto-drain.)
    # Used to keep a newly-running coverage shard visible while its rotted tests are
    # repaired (the #1899/#1964 Features.* orphan buckets; tracked in #1965) instead
    # of blocking unrelated PRs. Delete the shard's `advisory` field to re-block it.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targeted-shards.outputs.matrix_include) }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
      HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1

      # Reclaim runner disk while .NET setup and cache planning run. The
      # modular topology (8 protocol
      # assemblies + native packages such as ParquetSharp/Apache.Arrow/SkiaSharp
      # duplicated across their bin/obj, plus Coverlet coverage output) pushed
      # some shards over the ~14GB free-disk limit ("No space left on device").
      # Remove preinstalled toolchains the .NET test shards never use. Best-effort.
      - name: Start freeing disk space
        run: scripts/ci/server-test-shard-free-disk.sh

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Plan shard-local exact-head cache
        id: shard-cache-plan
        shell: bash
        env:
          SHARD_NAME: ${{ matrix.shard_name }}
          SHARD_CSPROJ: ${{ matrix.csproj }}
          SELECTED_SHARDS_JSON: ${{ needs.targeted-shards.outputs.matrix_include }}
          # Attempt-1 opportunistic reuse (#3213). Contract, fail-open behaviour
          # and rollback: docs/internal/ci/server-test-binary-artifacts.md.
          # The raw repository variable is forwarded verbatim; the single
          # "on only when exactly 'true'" rule lives in the plan script.
          PREBUILD_CONSUME: ${{ vars.HONUA_SERVER_TEST_PREBUILD_CONSUME }}
        run: |
          scripts/ci/server-test-shard-cache.sh plan \
            --shard "${SHARD_NAME}" \
            --project "${SHARD_CSPROJ}" \
            --matrix-json "${SELECTED_SHARDS_JSON}" \
            --source-sha '${{ github.sha }}' \
            --runner-os '${{ runner.os }}' \
            --sdk "$(dotnet --version)" \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --prebuild-consume "${PREBUILD_CONSUME}"

      - name: Wait for free disk space
        run: scripts/ci/server-test-shard-free-disk.sh --await

      - name: Start exact-head cache restore timer
        if: steps.shard-cache-plan.outputs.restore_enabled == 'true'
        id: shard-cache-restore-start
        shell: bash
        run: echo "epoch_ms=$(date +%s%3N)" >> "${GITHUB_OUTPUT}"

      - name: Restore exact-head shard cache
        # Fail-open: a cache service error is a miss rather than a red shard. See
        # docs/internal/ci/server-test-binary-artifacts.md.
        if: steps.shard-cache-plan.outputs.restore_enabled == 'true'
        id: shard-cache-download
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.shard-cache-plan.outputs.payload_dir }}
          key: ${{ steps.shard-cache-plan.outputs.cache_key }}
          fail-on-cache-miss: false

      - name: Wait before retrying exact-head shard cache
        if: steps.shard-cache-plan.outputs.restore_enabled == 'true' && steps.shard-cache-plan.outputs.cache_writer != 'true' && steps.shard-cache-download.outputs.cache-hit != 'true'
        shell: bash
        run: sleep '${{ steps.shard-cache-plan.outputs.restore_retry_delay_seconds }}'

      - name: Retry exact-head shard cache restore
        if: steps.shard-cache-plan.outputs.restore_enabled == 'true' && steps.shard-cache-plan.outputs.cache_writer != 'true' && steps.shard-cache-download.outputs.cache-hit != 'true'
        id: shard-cache-download-retry
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.shard-cache-plan.outputs.payload_dir }}
          key: ${{ steps.shard-cache-plan.outputs.cache_key }}
          fail-on-cache-miss: false

      - name: Record exact-head cache restore duration
        if: always() && steps.shard-cache-plan.outputs.restore_enabled == 'true'
        id: shard-cache-restore-elapsed
        shell: bash
        run: echo "milliseconds=$(( $(date +%s%3N) - ${{ steps.shard-cache-restore-start.outputs.epoch_ms }} ))" >> "${GITHUB_OUTPUT}"

      - name: Verify and unpack exact-head shard cache
        id: shard-cache-materialize
        shell: bash
        env:
          CACHE_HIT_FIRST: ${{ steps.shard-cache-download.outputs.cache-hit }}
          CACHE_HIT_RETRY: ${{ steps.shard-cache-download-retry.outputs.cache-hit }}
        run: |
          cache_hit=false
          if [[ "${CACHE_HIT_FIRST:-false}" == "true" || "${CACHE_HIT_RETRY:-false}" == "true" ]]; then
            cache_hit=true
          fi
          scripts/ci/server-test-shard-cache.sh restore \
            --project '${{ steps.shard-cache-plan.outputs.project }}' \
            --source-sha '${{ github.sha }}' \
            --payload '${{ steps.shard-cache-plan.outputs.payload_dir }}' \
            --cache-hit "${cache_hit}" \
            --read-mode '${{ steps.shard-cache-plan.outputs.restore_mode }}'

      - name: Restore
        if: steps.shard-cache-materialize.outputs.restored != 'true'
        # Phase 2 / ADR-0042 routing: each shard targets its declared csproj
        # (matrix.csproj) and falls back to Honua.Server.Tests.csproj for
        # legacy shards that have not been migrated to a per-protocol project.
        env:
          SHARD_CSPROJ: ${{ matrix.csproj }}
        run: |
          csproj="${SHARD_CSPROJ:-tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj}"
          scripts/ci/dotnet-restore-retry.sh "${csproj}"

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Build server test binaries
        id: shard-cache-build
        if: steps.shard-cache-materialize.outputs.restored != 'true'
        timeout-minutes: 20
        env:
          SHARD_CSPROJ: ${{ matrix.csproj }}
        run: |
          csproj="${SHARD_CSPROJ:-tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj}"
          dotnet build "${csproj}" \
            --no-restore \
            --configuration Release \
            -graphBuild \
            /p:RunAnalyzers=false

      - name: Package shard-local cache payload
        id: shard-cache-package
        # `package_enabled` is the plan step's single decision point; the
        # attempt counter is parsed there and nowhere else.
        if: ${{ steps.shard-cache-build.outcome == 'success' && steps.shard-cache-plan.outputs.package_enabled == 'true' }}
        shell: bash
        run: |
          rm -rf '${{ steps.shard-cache-plan.outputs.payload_dir }}'
          mkdir -p '${{ steps.shard-cache-plan.outputs.payload_dir }}'
          scripts/ci/package-server-test-binaries.sh \
            --project '${{ steps.shard-cache-plan.outputs.project }}' \
            --output '${{ steps.shard-cache-plan.outputs.payload_dir }}' \
            --source-sha '${{ github.sha }}'

      - name: Start exact-head cache save timer
        if: steps.shard-cache-package.outcome == 'success'
        id: shard-cache-save-start
        shell: bash
        run: echo "epoch_ms=$(date +%s%3N)" >> "${GITHUB_OUTPUT}"

      - name: Save exact-head shard cache
        if: steps.shard-cache-package.outcome == 'success'
        id: shard-cache-save
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.shard-cache-plan.outputs.payload_dir }}
          key: ${{ steps.shard-cache-plan.outputs.cache_key }}

      - name: Record exact-head cache save duration
        if: always() && steps.shard-cache-package.outcome == 'success'
        id: shard-cache-save-elapsed
        shell: bash
        run: echo "milliseconds=$(( $(date +%s%3N) - ${{ steps.shard-cache-save-start.outputs.epoch_ms }} ))" >> "${GITHUB_OUTPUT}"

      - name: Report shard cache decision
        if: always()
        shell: bash
        env:
          CACHE_KEY: ${{ steps.shard-cache-plan.outputs.cache_key }}
          RESTORE_MODE: ${{ steps.shard-cache-plan.outputs.restore_mode }}
          CONSUME_SWITCH: ${{ steps.shard-cache-plan.outputs.consume_switch }}
          DOWNLOAD_OUTCOME_FIRST: ${{ steps.shard-cache-download.outcome }}
          DOWNLOAD_OUTCOME_RETRY: ${{ steps.shard-cache-download-retry.outcome }}
          BUILD_OUTCOME: ${{ steps.shard-cache-build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.shard-cache-package.outcome }}
          SAVE_OUTCOME: ${{ steps.shard-cache-save.outcome }}
          CACHE_WRITER: ${{ steps.shard-cache-plan.outputs.cache_writer }}
          CACHE_WRITER_SHARD: ${{ steps.shard-cache-plan.outputs.cache_writer_shard }}
          CACHE_HIT_FIRST: ${{ steps.shard-cache-download.outputs.cache-hit }}
          CACHE_HIT_RETRY: ${{ steps.shard-cache-download-retry.outputs.cache-hit }}
          MATERIALIZED: ${{ steps.shard-cache-materialize.outputs.restored }}
          REASON: ${{ steps.shard-cache-materialize.outputs.reason }}
          TRANSFER_MS: ${{ steps.shard-cache-restore-elapsed.outputs.milliseconds }}
          INTEGRITY_MS: ${{ steps.shard-cache-materialize.outputs.integrity_check_ms }}
          UNPACK_MS: ${{ steps.shard-cache-materialize.outputs.unpack_ms }}
          SAVE_MS: ${{ steps.shard-cache-save-elapsed.outputs.milliseconds }}
          PAYLOAD_DIR: ${{ steps.shard-cache-plan.outputs.payload_dir }}
          PROJECT_SUFFIX: ${{ steps.shard-cache-plan.outputs.project_suffix }}
        run: |
          # Only a package step that actually succeeded produced this manifest;
          # on a cache hit the manifest in the payload dir belongs to the
          # RESTORED evidence and its timing describes the writer, not us.
          package_ms=na
          if [[ "${PACKAGE_OUTCOME}" == 'success' ]]; then
            manifest="${PAYLOAD_DIR}/server-test-binaries-${PROJECT_SUFFIX}.manifest.json"
            if [[ -f "${manifest}" ]]; then
              package_ms="$(jq -r '.package_milliseconds' "${manifest}")"
            fi
          fi
          cache_hit=false
          if [[ "${CACHE_HIT_FIRST:-false}" == 'true' || "${CACHE_HIT_RETRY:-false}" == 'true' ]]; then
            cache_hit=true
          fi
          {
            echo '### Server-test shard cache'
            echo
            echo "- Key: \`${CACHE_KEY:-unavailable}\`"
            echo "- Attempt: \`${{ github.run_attempt }}\`"
            echo "- Read mode: \`${RESTORE_MODE:-disabled}\` (HONUA_SERVER_TEST_PREBUILD_CONSUME=\`${CONSUME_SWITCH:-unset}\`, lookup outcomes first=\`${DOWNLOAD_OUTCOME_FIRST:-skipped}\` retry=\`${DOWNLOAD_OUTCOME_RETRY:-skipped}\`)"
            echo "- Decision: \`${REASON:-not_evaluated}\`"
            echo "- Exact cache hit: \`${cache_hit}\`"
            echo "- Materialized without build: \`${MATERIALIZED:-false}\`"
            # Only claim a successful local fallback when one actually happened.
            # A failed or cancelled build must not be reported as the unchanged
            # happy path.
            if [[ "${MATERIALIZED:-false}" != 'true' && "${BUILD_OUTCOME}" == 'success' ]]; then
              echo "- Fallback: \`${REASON:-consumer_disabled}\`; this shard restored and built \`${PROJECT_SUFFIX}\` locally (unchanged path)."
            fi
            # Writer identity is only meaningful when this job actually
            # published; a designated writer that hit the cache saved nothing.
            if [[ "${SAVE_OUTCOME}" == 'success' || "${SAVE_OUTCOME}" == 'failure' ]]; then
              echo "- Published payload: \`true\` (designated writer \`${CACHE_WRITER_SHARD:-unknown}\`, save \`${SAVE_OUTCOME}\`)"
            else
              echo "- Published payload: \`false\` (designated writer \`${CACHE_WRITER_SHARD:-unknown}\`, this shard writer=\`${CACHE_WRITER:-false}\`)"
            fi
            echo "- Transfer / integrity / unpack: \`${TRANSFER_MS:-0} / ${INTEGRITY_MS:-0} / ${UNPACK_MS:-0} ms\`"
            echo "- Package / save: \`${package_ms} / ${SAVE_MS:-0} ms\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run server test shard
        # Advisory shards (matrix.advisory==true) swallow their test failure HERE so
        # the job concludes success and the PR stays CLEAN (see job comment above).
        # Non-advisory shards (false) fail the job as normal. A build failure in an
        # earlier step still fails the job regardless — only the test run is swallowed.
        continue-on-error: ${{ matrix.advisory == true }}
        shell: bash
        env:
          HONUA_SERVER_TEST_SHARD_NAME: ${{ matrix.shard_name }}
          HONUA_SERVER_TEST_FILTER: ${{ matrix.filter }}
          HONUA_SERVER_TEST_LOG_NAME: ${{ matrix.log_name }}
          HONUA_SERVER_TEST_TIMEOUT_MINUTES: ${{ matrix.test_timeout_minutes }}
          HONUA_SERVER_TEST_MAX_CPU_COUNT: ${{ matrix.max_cpu_count }}
          HONUA_SERVER_TEST_RESULTS_DIR: ./tests/TestResults
          HONUA_SERVER_TEST_CONFIGURATION: Release
          # Phase 2 / ADR-0042: per-protocol test-project routing.
          # The shard record's optional `csproj` field selects the test
          # assembly; the shard script defaults to Honua.Server.Tests.csproj
          # when this env var is empty so legacy shards keep working unchanged.
          HONUA_SERVER_TEST_CSPROJ: ${{ matrix.csproj }}
        run: |
          scripts/ci/run-server-test-shard.sh

      - name: Upload Operator Eval Report
        if: ${{ always() && matrix.upload_operator_eval_report }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: operator-eval-report
          path: tests/TestResults/eval-report.json
          if-no-files-found: error

      - name: Upload OData CLI certification evidence
        if: ${{ always() && matrix.upload_odata_evidence }}
        uses: ./.github/actions/upload-ci-evidence
        with:
          kind: evidence
          suffix: cli-odata
          path: tests/TestResults/*-cli-odata.cert.json
          tier: pr

      - name: Upload shard test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 3
        with:
          name: server-test-results-${{ matrix.artifact_suffix }}
          path: tests/TestResults/
          retention-days: 7

  worker-gdal-tests:
    name: Worker GDAL Tests
    # #3271. `Honua.Worker.Gdal.Tests` used to run as one step of
    # dotnet-foundation-tests on a lean ubuntu-latest agent with no GDAL CLI on
    # PATH. GdalCliFactAttribute (tests/dotnet/Honua.Worker.Gdal.Tests/GdalCli.cs)
    # sets Skip when the tool it names is missing, so the ONLY cases that drive
    # the real `gdaldem` / `ogr2ogr` command lines the native-profile worker
    # shells out to were skipped on every run while the step exited 0 — the 22
    # src/Honua.Worker.Gdal/Execution/Gdal*JobExecutor.cs executors were covered
    # only by their FakeGdalCommandRunner unit cases. This job installs GDAL
    # first so those cases execute, and asserts they did (a skip is invisible in
    # a dotnet-test exit code, so it needs an explicit guard).
    #
    # Gating deliberately MIRRORS the foundation job this was carved out of
    # (integration_changes) instead of path-filtering on src/Honua.Worker.Gdal/**:
    # the project's ~300 [UnitTest] cases already ran on every integration PR, and
    # a narrower gate would trade a fixed skip for a new coverage hole. Scheduled
    # / manual full CI and merge-train batches set integration_changes=true, so
    # the job is part of the run_all lane too.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: changes
    # Step caps sit inside the job cap with the >=10 min non-test overhead margin
    # the ci-shards.json budget policy asks for (#3054): build 15m + test 10m
    # under a 30m job cap. Measured locally on this branch: 318 discovered cases
    # run in ~1s once built, and a cold Release build of the test project takes
    # ~6 min, so the caps bound a hang rather than normal growth.
    timeout-minutes: 30
    env:
      HONUA_TEST_CONFIGURATION: Release
      # Suppresses GdalCliFactAttribute's "tool not on PATH" skip, so a runner
      # that lost its GDAL install FAILS the real-GDAL cases instead of silently
      # reporting them skipped with a green exit code (#3271).
      HONUA_REQUIRE_GDAL_CLI: "true"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GDAL CLI
        # Same provisioning as python-integration-tests below. `gdal-bin` carries
        # gdaldem / ogr2ogr / gdal_create / gdal_translate, which is the whole
        # tool surface GdalCli.Available() probes. The production worker image
        # (docker/worker-gdal/Dockerfile) pins a much richer GDAL base; this job
        # asserts the CLI contract, not the driver universe, which stays owned by
        # worker-gdal-image.yml and gdal-driver-e2e.yml.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq gdal-bin python3-gdal python3-numpy python3-scipy
          # Match the allocation worker's GDAL + SciPy dependency path. Prefer
          # the distro interpreter that owns the apt-installed Python bindings.
          echo "/usr/bin" >> "${GITHUB_PATH}"
          /usr/bin/python3 -c 'from osgeo import gdal; from scipy import ndimage; import numpy'
          for tool in gdaldem ogr2ogr gdal_translate gdal_proximity.py; do
            command -v "${tool}" >/dev/null \
              || { echo "::error::${tool} is missing after installing gdal-bin"; exit 1; }
          done
          gdalinfo --version

      - name: Restore
        run: scripts/ci/dotnet-restore-retry.sh tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Build
        timeout-minutes: 15
        run: |
          dotnet build tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj \
            --no-restore \
            --configuration Release

      - name: Run Worker GDAL tests
        id: run-tests
        timeout-minutes: 10
        run: |
          dotnet test tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=worker-gdal-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      - name: Run the real-GDAL cases and prove they were not skipped
        # HONUA_REQUIRE_GDAL_CLI above already turns a missing tool into a test
        # FAILURE, so this is the tripwire for every other way the coverage could
        # vanish (trait removed, attribute deleted, env var lost): re-run just the
        # Category=GDAL subset into its own TRX and require at least one Passed
        # and zero NotExecuted. `dotnet test` exits 0 when a filter matches
        # nothing and when every matched case skips, so the counts — not the exit
        # code — are the assertion. Same idiom as warehouse-nightly.yml.
        #
        # Runs whenever the main test step ran, pass or fail: a failing run can
        # still have skipped every real-GDAL case, and that is the regression
        # being guarded. Skipped when the build produced nothing, so a build break
        # reports once instead of twice.
        if: ${{ !cancelled() && steps.run-tests.conclusion != 'skipped' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          trx=./tests/TestResults/worker-gdal-cli.trx
          dotnet test tests/dotnet/Honua.Worker.Gdal.Tests/Honua.Worker.Gdal.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "Category=GDAL" \
            --logger "trx;LogFileName=worker-gdal-cli.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./tests/TestResults
          if [[ ! -f "${trx}" ]]; then
            echo "::error::no TRX produced for the Category=GDAL subset"
            exit 1
          fi
          # `|| true` on each grep is load-bearing under `set -euo pipefail`:
          # grep exits 1 when it matches nothing, and on the healthy path BOTH
          # the Failed and NotExecuted counts are zero. Without it the step dies
          # before printing the summary — and reports failure for a green run.
          # (warehouse-nightly.yml uses the bare idiom because it does not set
          # pipefail.)
          count_outcome() {
            { grep -o "outcome=\"$1\"" "${trx}" || true; } | wc -l | tr -d '[:space:]'
          }
          passed=$(count_outcome Passed)
          failed=$(count_outcome Failed)
          skipped=$(count_outcome NotExecuted)
          {
            echo '### Real-GDAL coverage'
            echo
            echo "- Passed: ${passed}"
            echo "- Failed: ${failed}"
            echo "- Skipped: ${skipped}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${skipped}" -gt 0 ]]; then
            echo "::error::${skipped} [GdalCliFact] case(s) were skipped — the real-GDAL coverage silently disappeared"
            exit 1
          fi
          if [[ "${passed}" -lt 1 ]]; then
            echo "::error::no [GdalCliFact] case passed — the Category=GDAL trait or the cases themselves are gone"
            exit 1
          fi
          echo "OK: ${passed} real-GDAL case(s) executed, 0 skipped."

      - name: Upload Worker GDAL test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 3
        with:
          name: worker-gdal-test-results
          path: tests/TestResults/
          retention-days: 7

  python-integration-tests:
    name: Python Integration Tests
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' && needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tests/python/requirements.txt

      - name: Restore
        # Scoped to Honua.Server's transitive ProjectReferences; the Python
        # fixtures host below only needs the Server runtime built. Full-sln
        # restore was over-fetching for unrelated projects (DuckDB / SqlServer /
        # MySql / samples / benchmarks / sibling test projects).
        run: scripts/ci/dotnet-restore-retry.sh src/Honua.Server/Honua.Server.csproj

      - name: Build server binaries for Python fixtures
        run: |
          dotnet build src/Honua.Server/Honua.Server.csproj \
            --no-restore \
            --configuration Release

      - name: Install GDAL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq gdal-bin
          ogrinfo --version

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/python/requirements.txt

      - name: Run Python Integration Tests (OGC + FeatureServer + GDAL)
        # honua-server#4396: this lane carries the only independent-consumer evidence for
        # GeoParquet. HONUA_REQUIRE_GEOPARQUET_INTEROP makes a missing reader stack an import
        # error instead of a silent module-level skip.
        env:
          HONUA_REQUIRE_GEOPARQUET_INTEROP: "1"
        run: pytest --tb=short
        working-directory: tests/python

      - name: Prove the GeoParquet interop cells were executed, not skipped
        # honua-server#4396, modelled on the [GdalCliFact] anti-skip tripwire above: assert on
        # executed-cell counts rather than on the exit code, so a lane that skips every
        # GeoParquet cell reports non-passing instead of green. Under the 2026-09-04 ruling a
        # skipped required cell is non-passing evidence, so a skip fails here.
        env:
          HONUA_REQUIRE_GEOPARQUET_INTEROP: "1"
        working-directory: tests/python
        run: |
          set -euo pipefail
          mkdir -p ../TestResults
          report="../TestResults/geoparquet-interop.xml"
          pytest --tb=short -q feature_server/test_geoparquet_interop.py --junitxml="${report}"
          python - "${report}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse(sys.argv[1])
          suites = tree.getroot().iter("testsuite")
          tests = errors = failures = skipped = 0
          for suite in suites:
              tests += int(suite.get("tests", 0))
              errors += int(suite.get("errors", 0))
              failures += int(suite.get("failures", 0))
              skipped += int(suite.get("skipped", 0))

          executed = tests - skipped
          print(f"geoparquet interop: tests={tests} executed={executed} skipped={skipped} "
                f"failures={failures} errors={errors}")

          if skipped > 0:
              print("::error::%d GeoParquet interop cell(s) were skipped - a skipped required "
                    "cell is non-passing evidence (honua-server#4396)" % skipped)
              sys.exit(1)
          if executed < 1:
              print("::error::no GeoParquet interop cell executed - the independent-consumer "
                    "evidence for GeoParquet has silently disappeared")
              sys.exit(1)
          if failures or errors:
              print("::error::GeoParquet interop cells failed")
              sys.exit(1)
          PY

      - name: Upload Python test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        timeout-minutes: 3
        with:
          name: python-test-results
          path: |
            tests/TestResults/
            tests/python/gdal-ogr-results*.json
            tests/python/stac-client-compat-results*.json
            tests/python/stac-client-compat-results*.md
          retention-days: 7

  js-typecheck:
    name: JavaScript Type Check
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Install JavaScript test dependencies
        run: npm ci
        working-directory: tests/js

      - name: TypeScript type check (JavaScript tests)
        run: npm run typecheck
        working-directory: tests/js

  test-all:
    name: Test Suite Summary
    # `always()` would otherwise let this run on merge_group with all test
    # needs skipped (a misleading all-skipped "pass"); exclude merge_group so
    # the heavy test lane is fully dormant on a batched commit.
    if: ${{ github.event_name != 'merge_group' && always() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      # Both the family matrix and its fan-in: a bug in the fan-in job's result
      # check cannot then leave a foundation family un-gated (#3567).
      - dotnet-foundation-family-tests
      - dotnet-foundation-tests
      - server-tests
      - worker-gdal-tests
      - python-integration-tests
      - js-typecheck
      - js-integration-tests
      - esri-leaflet-browser-tests
      - maplibre-compat
    steps:
      - name: Check required test job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required test jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required test jobs were cancelled."
            exit 1
          fi
          echo "All test suite jobs passed."

  js-integration-tests:
    name: JavaScript Integration Tests
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' && needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Honua Server
        uses: ./.github/actions/setup-honua-server
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Install JavaScript test dependencies
        run: npm ci
        working-directory: tests/js

      # Playwright downloads its Chromium bundle into ~/.cache/ms-playwright on every
      # run; actions/setup-node's npm cache above covers the package tarballs only, not
      # the browser. Key on the lockfile that pins @playwright/test for this job, so a
      # Playwright version bump correctly misses the cache.
      #
      # The install step below deliberately still runs with --with-deps: the apt system
      # dependencies it installs live outside this path and are not cached, so they must
      # be resolved on a hit as well as a miss. On a hit, `playwright install` finds the
      # expected browser revision already present and skips the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/js/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: |
          # Ubuntu 24 runner images currently ship Microsoft apt feeds that can
          # return transient 403s, which breaks Playwright's dependency bootstrap
          # before the JS tests even start.
          sudo find /etc/apt/sources.list.d -maxdepth 1 \
            \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) \
            -print -delete
          npx playwright install --with-deps chromium
        working-directory: tests/js

      - name: Run JavaScript Integration Tests
        run: npm test -- --reporter=verbose --reporter=junit --outputFile="${RUNNER_TEMP}/javascript-integration-tests.xml"
        working-directory: tests/js
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          # Dedicated 'Mixed' layer for the heterogeneous geometry round-trip suite (layer 0 is Point).
          HONUA_MIXED_LAYER_ID: '1'
          HONUA_API_KEY: "ci-admin-password"

      - name: Run OpenLayers Rendering Test
        run: npx playwright test --config openlayers/rendering/playwright.config.ts
        working-directory: tests/js
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          HONUA_API_KEY: "ci-admin-password"

      # The setup-honua-server action redirects the server's stdout/stderr to
      # ${RUNNER_TEMP}/honua-server-setup.log but only dumps it when the readiness
      # wait *fails*. When readiness succeeds and a later JS request 500s (e.g. a
      # WFS GetFeature), the server-side exception is otherwise lost — leaving the
      # failure undiagnosable. Surface the log (and DB seed status) on ANY later
      # failure in this job so the actual exception/stack trace is visible.
      # Keep this after both test steps: failure() only sees earlier failures.
      - name: Dump Honua Server log on failure
        if: failure()
        run: |
          SERVER_LOG="${RUNNER_TEMP:-/tmp}/honua-server-setup.log"
          if [ -f "$SERVER_LOG" ]; then
            echo "----- Honua Server log (${SERVER_LOG}) -----"
            cat "$SERVER_LOG"
          else
            echo "No Honua Server log found at ${SERVER_LOG}."
          fi
          echo "----- DB seed status (features per layer) -----"
          PGPASSWORD=honua psql -h localhost -U honua -d honua_test \
            -c "SELECT layer_id, COUNT(*) AS feature_count FROM features GROUP BY layer_id ORDER BY layer_id;" 2>&1 || \
            echo "(could not query feature counts — DB unreachable?)"

      - name: Upload JavaScript test diagnostics
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: javascript-integration-results
          path: |
            ${{ runner.temp }}/javascript-integration-tests.xml
            ${{ runner.temp }}/honua-server-setup.log
          retention-days: 7

      - name: Upload OpenLayers Evidence
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: openlayers-compat-results
          path: |
            tests/js/js-*.cert.json
            tests/js/certification-evidence/*.cert.json
          retention-days: 7


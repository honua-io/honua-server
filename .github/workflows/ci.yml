name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'honua-sdk-js git ref for MCP tests (overrides MCP_SDK_REF env)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  # honua-sdk-js ref for MCP certification and LLM smoke tests.
  # IMPORTANT: for release-evidence certification this MUST be pinned to a
  # specific tag or commit SHA so results are reproducible for a given server
  # commit. While set to a branch name like 'trunk' the lane is useful for
  # development but certification artifacts are not release-grade evidence.
  # workflow_dispatch `sdk_ref` overrides this value for manual replays.
  MCP_SDK_REF: '404242df3cbf10f707ee9137405bf93b3de0012d'

jobs:
  pr-readiness:
    name: PR Mergeability & Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip mergeability preflight for non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Non-PR event; mergeability preflight skipped."

      - name: Fail fast on conflicted or stale PR branches
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            let pull = null;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pull = response.data;
              if (pull.mergeable !== null) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!pull) {
              core.setFailed('Unable to load pull request metadata.');
              return;
            }

            const mergeable = pull.mergeable;
            const mergeableState = String(pull.mergeable_state || 'unknown');
            core.info(`mergeable=${mergeable} mergeable_state=${mergeableState}`);

            if (mergeable === false || mergeableState === 'dirty') {
              core.setFailed('PR branch has merge conflicts. Resolve conflicts before running CI.');
              return;
            }

            if (mergeableState === 'behind') {
              core.setFailed('PR branch is behind trunk. Refresh the branch before running CI.');
            }

  changes:
    name: Detect Non-Test Changes
    needs: pr-readiness
    runs-on: ubuntu-latest
    outputs:
      non_test_changes: ${{ steps.filter.outputs.non_test_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            echo "range=origin/${{ github.base_ref }}...${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs: diff against trunk so AOT/Docker gates are not
            # silently skipped due to github.event.before being undefined.
            git fetch origin trunk --depth=1
            echo "range=origin/trunk...${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "range=${{ github.event.before }}...${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Check for non-test changes
        id: filter
        run: |
          CHANGED_FILES=$(git diff --name-only "${{ steps.diff.outputs.range }}" || true)
          NON_TEST_FILES=$(echo "$CHANGED_FILES" | grep -Ev '^(tests/|test/)' | sed '/^$/d' || true)

          if [ -z "$NON_TEST_FILES" ]; then
            echo "non_test_changes=false" >> $GITHUB_OUTPUT
          else
            echo "non_test_changes=true" >> $GITHUB_OUTPUT
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          echo "Non-test files:"
          echo "$NON_TEST_FILES"

  build:
    name: Build & Format Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: pr-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instruction Sync (Claude/Codex)
        run: bash scripts/check-instructions-sync.sh

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build (warnings as errors)
        run: dotnet build Honua.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=false

      - name: Format Check
        run: dotnet format Honua.sln --verify-no-changes --verbosity diagnostic

  test-all:
    name: Test Suite (.NET + Python + JS)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim disk space for test suite
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          docker system df || true

          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          $SUDO rm -rf /usr/local/lib/android || true
          $SUDO rm -rf /opt/ghc || true
          $SUDO rm -rf /usr/share/swift || true
          $SUDO rm -rf /opt/hostedtoolcache/CodeQL || true

          docker system prune -af --volumes || true
          docker builder prune -af || true

          echo "Disk space after cleanup:"
          df -h
          docker system df || true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tests/python/requirements.txt

      - name: Install Localstack CLI (awslocal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user awscli-local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Pre-pull Docker images for faster tests
        run: |
          docker pull --quiet postgis/postgis:16-3.4-alpine || true
          docker pull --quiet postgis/postgis:18-3.6 || true

      - name: Start emulator containers (Azurite + Localstack)
        run: |
          docker compose -f docker/docker-compose.emulators.yml up -d --quiet-pull
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/4566) >/dev/null 2>&1 \
              && (echo > /dev/tcp/localhost/10000) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Emulators failed to start."
          docker compose -f docker/docker-compose.emulators.yml ps
          exit 1

      - name: Build .NET test binaries
        timeout-minutes: 20
        run: |
          # Use MSBuild default parallelism (-m with no value = runner CPU count).
          # The prior `-m:1` serialized project compiles for no documented reason
          # and cost ~2 min of PR wall-clock on the 2-core runner.
          dotnet build Honua.sln \
            --no-restore \
            --configuration Release

      - name: Run .NET Tests (Core/Postgres)
        timeout-minutes: 20
        run: |
          dotnet test tests/dotnet/Honua.Core.Tests/Honua.Core.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=core-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

          dotnet test tests/dotnet/Honua.LoadTests/Honua.LoadTests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=load-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

          dotnet test tests/dotnet/Honua.Postgres.Tests/Honua.Postgres.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=postgres-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      - name: Run .NET Tests (Server - Core)
        timeout-minutes: 30
        env:
          HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
        shell: bash
        run: |
          set +e
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName!~Honua.Server.Tests.Features.&FullyQualifiedName!~Honua.Server.Tests.Import.&FullyQualifiedName!~Honua.Server.Tests.Performance.&FullyQualifiedName!~Honua.Server.Tests.Comprehensive.&FullyQualifiedName!~Honua.Server.Tests.Admin.&FullyQualifiedName!~Honua.Server.Tests.Infrastructure.&FullyQualifiedName!~Honua.Server.Tests.Cloud.&FullyQualifiedName!~Honua.Server.Tests.CloudCog.&FullyQualifiedName!~Honua.Server.Tests.Contract.&FullyQualifiedName!~Honua.Server.Tests.AdminEndpointTests" \
            --logger "trx;LogFileName=server-tests-core.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            > ./tests/TestResults/server-tests-core.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-core-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-core.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Admin & Infrastructure)
        timeout-minutes: 30
        env:
          HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
        shell: bash
        run: |
          set +e
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Admin.|FullyQualifiedName~Honua.Server.Tests.Infrastructure.|FullyQualifiedName~Honua.Server.Tests.AdminEndpointTests" \
            --logger "trx;LogFileName=server-tests-admin-infra.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            > ./tests/TestResults/server-tests-admin-infra.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do

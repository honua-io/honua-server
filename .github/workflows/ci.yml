name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instruction Sync (Claude/Codex)
        run: bash scripts/check-instructions-sync.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build (warnings as errors)
        run: dotnet build Honua.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Format Check
        run: dotnet format Honua.sln --verify-no-changes --verbosity diagnostic

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Run Unit Tests
        run: |
          dotnet test Honua.sln \
            --no-restore \
            --configuration Release \
            --filter "Category!=Integration" \
            --logger "trx;LogFileName=unit-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./tests/TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: tests/TestResults/

  test-integration:
    name: Integration Tests (Testcontainers + PostGIS)
    runs-on: ubuntu-latest
    needs: build
    outputs:
      needs_integration: ${{ steps.changes.outputs.integration }}
    services:
      # Testcontainers will manage containers, but we need Docker available
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Detect Integration Test Scope
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            integration:
              - 'src/**'
              - 'tests/**'
              - 'docker/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '**/*.csproj'
              - 'Directory.Build.props'
              - 'Honua.sln'
              - '.github/workflows/**'
              - 'scripts/**'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Run Integration Tests
        if: steps.changes.outputs.integration == 'true'
        run: |
          dotnet test Honua.sln \
            --no-restore \
            --configuration Release \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integration-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./tests/TestResults
        env:
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: steps.changes.outputs.integration == 'true'
        with:
          name: integration-test-results
          path: tests/TestResults/

  test-architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Run Architecture Tests
        run: |
          dotnet test Honua.sln \
            --no-restore \
            --configuration Release \
            --filter "Category=Architecture" \
            --logger "trx;LogFileName=architecture-results.trx" \
            --results-directory ./tests/TestResults

      - name: Upload Architecture Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-test-results
          path: tests/TestResults/

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Scan for Vulnerable NuGet Packages
        id: nuget-scan
        run: |
          echo "Scanning for vulnerable NuGet packages..."

          # Run vulnerability scan and capture output
          if dotnet list package --vulnerable --include-transitive > vulnerability-report.txt 2>&1; then
            echo "scan_result=success" >> $GITHUB_OUTPUT
          else
            echo "scan_result=failure" >> $GITHUB_OUTPUT
          fi

          # Display the results
          cat vulnerability-report.txt

          # Check if any high or critical vulnerabilities were found
          if grep -E "(High|Critical)" vulnerability-report.txt; then
            echo "vulnerable_packages=true" >> $GITHUB_OUTPUT
            echo "::error::High or Critical vulnerabilities found in NuGet packages"
            exit 1
          else
            echo "vulnerable_packages=false" >> $GITHUB_OUTPUT
            echo "No high or critical vulnerabilities found"
          fi

      - name: Upload Vulnerability Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: vulnerability-report.txt

      - name: Setup Trivy for Container Scanning
        if: needs.build.result == 'success'
        uses: aquasecurity/trivy-action@0.15.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.sarif

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-architecture, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Download Unit Test Results
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: ./coverage/unit

      - name: Download Integration Test Results
        uses: actions/download-artifact@v4
        if: needs.test-integration.outputs.needs_integration == 'true'
        with:
          name: integration-test-results
          path: ./coverage/integration

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Html;Cobertura;TextSummary"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report/

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/report/Cobertura.xml
          flags: combined
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check Coverage Threshold
        run: |
          # Extract line coverage percentage from summary
          COVERAGE=$(grep -oP 'Line coverage: \K[\d.]+' ./coverage/report/Summary.txt || echo "0")
          echo "Line coverage: ${COVERAGE}%"
          BRANCH_COVERAGE=$(grep -oP 'Branch coverage: \K[\d.]+' ./coverage/report/Summary.txt || echo "0")
          echo "Branch coverage: ${BRANCH_COVERAGE}%"

          # Coverage baseline from current reality: Integration tests provide ~0.7%/0.4%
          # Progressive path: 1%/0.5% (current+) → 10%/5% → 40%/30% → 80%/70% (MVP)
          # Start with achievable floor above current baseline to establish gates
          if (( $(echo "$COVERAGE < 1" | bc -l) )); then
            echo "::error::Line coverage ${COVERAGE}% is below 1% threshold"
            exit 1
          fi
          if (( $(echo "$BRANCH_COVERAGE < 0.5" | bc -l) )); then
            echo "::error::Branch coverage ${BRANCH_COVERAGE}% is below 0.5% threshold"
            exit 1
          fi

          echo "✅ Coverage thresholds met: Line ${COVERAGE}% >= 1%, Branch ${BRANCH_COVERAGE}% >= 0.5%"
          echo "ℹ️  Coverage roadmap: Current ~0.7%/0.4% → 1%/0.5% → 10%/5% → 80%/70% (MVP)"

  llm-architecture-review:
    name: LLM Architecture Review
    runs-on: ubuntu-latest
    needs: build  # Only run after successful build
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    outputs:
      assessment: ${{ steps.llm-analysis.outputs.assessment }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        run: |
          # Get ALL changed files for comprehensive review (acceptance criteria, issue linking)
          ALL_CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})

          # Get C# files separately for architecture-specific analysis
          CS_CHANGED_FILES=$(echo "$ALL_CHANGED_FILES" | grep -E '\.(cs|csproj)$' || echo "")

          if [ -z "$ALL_CHANGED_FILES" ]; then
            echo "No files changed, skipping review"
            echo "skip_review=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$ALL_CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "cs_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CS_CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "skip_review=false" >> $GITHUB_OUTPUT

          # Show what we found
          echo "All changed files:"
          echo "$ALL_CHANGED_FILES"
          echo ""
          echo "C# files (for architecture analysis):"
          echo "$CS_CHANGED_FILES"

      - name: Get File Contents and Diff
        if: steps.changed-files.outputs.skip_review == 'false'
        id: get-content
        run: |
          # Create analysis context
          mkdir -p /tmp/architecture-review

          # Get project architectural rules
          echo "=== HONUA ARCHITECTURE RULES ===" > /tmp/architecture-review/context.md
          echo "" >> /tmp/architecture-review/context.md

          # Include relevant parts of CLAUDE.md
          echo "## Project Architecture (from CLAUDE.md):" >> /tmp/architecture-review/context.md
          sed -n '/## Critical Rules/,/## Phase-Based Development/p' CLAUDE.md >> /tmp/architecture-review/context.md
          echo "" >> /tmp/architecture-review/context.md

          # Include file changes with context
          echo "## Changed Files Analysis:" >> /tmp/architecture-review/context.md
          echo "" >> /tmp/architecture-review/context.md

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "### File: $file" >> /tmp/architecture-review/context.md

              # Determine syntax highlighting based on file extension
              case "$file" in
                *.cs) syntax="csharp" ;;
                *.csproj) syntax="xml" ;;
                *.yml|*.yaml) syntax="yaml" ;;
                *.json) syntax="json" ;;
                *.md) syntax="markdown" ;;
                *.sh) syntax="bash" ;;
                Dockerfile*) syntax="dockerfile" ;;
                *) syntax="text" ;;
              esac

              echo "\`\`\`$syntax" >> /tmp/architecture-review/context.md
              cat "$file" >> /tmp/architecture-review/context.md
              echo '```' >> /tmp/architecture-review/context.md
              echo "" >> /tmp/architecture-review/context.md

              echo "### Diff for: $file" >> /tmp/architecture-review/context.md
              echo '```diff' >> /tmp/architecture-review/context.md
              git diff origin/${{ github.base_ref }}...${{ github.sha }} -- "$file" >> /tmp/architecture-review/context.md
              echo '```' >> /tmp/architecture-review/context.md
              echo "" >> /tmp/architecture-review/context.md
            fi
          done <<< "${{ steps.changed-files.outputs.changed_files }}"

      - name: Setup Python
        if: steps.changed-files.outputs.skip_review == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        if: steps.changed-files.outputs.skip_review == 'false'
        run: |
          python -m pip install --upgrade pip
          # Only install OpenAI if API key is available
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            pip install openai
          fi

      - name: LLM Architecture Analysis
        if: steps.changed-files.outputs.skip_review == 'false'
        id: llm-analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_PR_NUMBER: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/architecture-review.py

      - name: Post Review Comment
        if: steps.changed-files.outputs.skip_review == 'false'
        uses: actions/github-script@v7
        env:
          ANALYSIS_OUTPUT: ${{ steps.llm-analysis.outputs.analysis }}
          ASSESSMENT_OUTPUT: ${{ steps.llm-analysis.outputs.assessment }}
        with:
          script: |
            const analysis = process.env.ANALYSIS_OUTPUT;
            const assessment = process.env.ASSESSMENT_OUTPUT;

            let assessmentIcon = '✅';
            let assessmentColor = 'green';
            if (assessment === 'NEEDS_ATTENTION') {
              assessmentIcon = '⚠️';
              assessmentColor = 'orange';
            } else if (assessment === 'BLOCKING_ISSUES') {
              assessmentIcon = '🚫';
              assessmentColor = 'red';
            }

            const body = `## 🤖 LLM Architecture Review

            ${assessmentIcon} **Assessment: ${assessment}**

            ${analysis}

            ---
            *Automated architectural analysis powered by OpenAI GPT-4*
            *This review focuses on architectural patterns and design decisions*
            *Human review still recommended for complex changes*`;

            // Check if we already have a review comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('🤖 LLM Architecture Review')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  aot-build:
    name: AOT Build Verification
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Publish AOT
        run: |
          dotnet publish \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -o ./publish
        working-directory: src/Honua.Server

      - name: Verify Binary Size
        run: |
          SIZE=$(stat --printf="%s" ./publish/Honua.Server 2>/dev/null || echo "0")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"

          # Warn if over 100MB (target from MVP_PLAN)
          if [ "$SIZE_MB" -gt 100 ]; then
            echo "::warning::AOT binary ${SIZE_MB}MB exceeds 100MB target"
          fi
        working-directory: src/Honua.Server


  # Architecture gate job that blocks merge if LLM review finds blocking issues
  architecture-gate:
    name: Architecture Gate
    needs: llm-architecture-review
    runs-on: ubuntu-latest
    if: needs.llm-architecture-review.outputs.assessment == 'BLOCKING_ISSUES'
    steps:
      - name: Block PR on Architectural Violations
        run: |
          echo "::error::Architecture review found BLOCKING_ISSUES that must be resolved before merge."
          echo "::error::Please review the LLM Architecture Review comment and address all critical violations."
          echo "::error::Common blocking issues: dependency violations, controller usage, AOT incompatibility, missing docs."
          exit 1

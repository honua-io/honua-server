          node-version: ${{ env.NODE_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          sdk-ref: ${{ github.event.inputs.sdk_ref || env.MCP_SDK_REF }}

      - name: Report skipped smoke tests
        if: steps.setup.outputs.smoke-available != 'true'
        shell: bash
        run: |
          echo "::warning::test:llm-smoke script not found in honua-sdk-js/mcp — smoke tests skipped"
          echo "## ⚠️ MCP LLM Smoke Tests Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The \`test:llm-smoke\` script was not found in \`honua-sdk-js/mcp\` (ref: \`${{ github.event.inputs.sdk_ref || env.MCP_SDK_REF }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "Land the smoke test scripts in \`honua-sdk-js\` to activate this lane." >> "$GITHUB_STEP_SUMMARY"

      - name: Run MCP LLM Smoke Tests
        if: steps.setup.outputs.smoke-available == 'true'
        run: npm run test:llm-smoke
        working-directory: honua-sdk-js/mcp
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_TRANSPORT: rest
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          HONUA_DEV_AUTH: "true"
          HONUA_API_KEY: "ci-admin-password"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload LLM smoke transcripts
        if: always() && steps.setup.outputs.smoke-available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mcp-llm-smoke-transcripts
          path: |
            honua-sdk-js/mcp/llm-smoke-results.json
            honua-sdk-js/mcp/llm-smoke-results.md
            honua-sdk-js/mcp/llm-smoke-transcripts/
          if-no-files-found: warn
          retention-days: 30

  postgres-compat:
    name: Postgres Compatibility (${{ matrix.pg_image }})
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes]
    timeout-minutes: 30
    strategy:
      # Report every PG version's status independently so a PG 16 regression does
      # not hide PG 17/18 results. Each version is worth ~6 min; fail-fast saves
      # little and costs triage signal.
      fail-fast: false
      matrix:
        pg_image:
          - "postgis/postgis:16-3.4"   # Aurora PG 16.x baseline
          - "postgis/postgis:17-3.5"   # Azure Flex PG 17.x
          - "postgis/postgis:18-3.6"          # Latest self-hosted
    services:
      postgres:
        image: ${{ matrix.pg_image }}
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build
        run: dotnet build Honua.sln --configuration Release --no-restore

      - name: Run Postgres compatibility tests
        env:
          HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
          HONUA_TEST_CONFIGURATION: Release
        run: |
          dotnet test tests/dotnet/Honua.Postgres.Tests/Honua.Postgres.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=detailed" \
            --results-directory ./tests/TestResults \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings

      - name: Upload Postgres coverage (cobertura)
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          name: postgres-coverage-${{ strategy.job-index }}
          path: tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Postgres coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/TestResults/**/coverage.cobertura.xml
          flags: postgres-${{ strategy.job-index }}
          name: postgres-compat
          fail_ci_if_error: false

  core-package-compatibility:
    name: Honua.Core Package Compatibility
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build Honua.Core package
        run: |
          package_version="0.0.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          dotnet pack src/Honua.Core/Honua.Core.csproj \
            --configuration Release \
            --output ./packages \
            --no-restore \
            -p:PackageVersion="${package_version}" \
            -p:Version="${package_version}"

      - name: Test package integration
        run: |
          mkdir -p package-test
          cd package-test
          dotnet new console

          PACKAGE_SOURCE="$(realpath ../packages)"
          cat > NuGet.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-packages" value="${PACKAGE_SOURCE}" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="github-honua" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github-honua>
                <add key="Username" value="${{ github.actor }}" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </github-honua>
            </packageSourceCredentials>
            <packageSourceMapping>
              <packageSource key="local-packages">
                <package pattern="Honua.Core" />
              </packageSource>
              <packageSource key="github-honua">
                <package pattern="Geospatial.Grpc" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          # Keep the temporary consumer independent from repository CPM.
          cat > Directory.Packages.props <<EOF
          <Project>
            <PropertyGroup>
              <ManagePackageVersionsCentrally>false</ManagePackageVersionsCentrally>
            </PropertyGroup>
          </Project>
          EOF

          # Add package under test
          VERSION=$(basename "$(ls ../packages/Honua.Core*.nupkg | head -1)" | sed -E 's/^Honua\.Core\.([0-9A-Za-z.-]+)\.nupkg$/\1/')
          dotnet add package Honua.Core --version "$VERSION"

          # Test build
          dotnet build --configuration Release

      - name: Validate server compatibility
        run: |
          # Build server with SDK packages to ensure no conflicts
          dotnet build src/Honua.Server/Honua.Server.csproj --configuration Release --no-restore

  aot-build:
    name: AOT Build Verification
    if: ${{ success() && needs.changes.outputs.integration_changes == 'true' && needs.changes.outputs.non_test_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes, test-all, core-package-compatibility, postgres-compat]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Publish AOT
        run: |
          dotnet publish Honua.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            -p:PublishAot=true \
            -p:HonuaSkipAdminClientForAotVerification=true \
            -p:HonuaIncludeStacOpsDemo=false \
            -p:StripSymbols=true \
            -o ./publish
        working-directory: src/Honua.Server

      - name: Verify Binary Size
        run: |
          SIZE=$(stat --printf="%s" ./publish/Honua.Server 2>/dev/null || echo "0")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"

          # Warn if over 100MB (target from MVP_PLAN)
          if [ "$SIZE_MB" -gt 100 ]; then
            echo "::warning::AOT binary ${SIZE_MB}MB exceeds 100MB target"
          fi
        working-directory: src/Honua.Server

  docker-build:
    name: Docker Build & Integration Test
    if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' && needs.changes.outputs.non_test_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes]
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pre-pull BuildKit image with retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull moby/buildkit:buildx-stable-1; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Failed to pre-pull moby/buildkit:buildx-stable-1 after retries."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: honua-server:test
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance/sbom must be false for `load: true` — the local docker exporter
          # can't load a manifest list. SBOM is generated separately via Anchore below.
          provenance: false
          sbom: false

      # Generate an SPDX JSON SBOM for the freshly built image and upload it
      # as a workflow artifact so PR reviewers (and downstream supply-chain
      # tooling) can inspect the bill of materials without having to pull the
      # image registry attestation. Required by audit gate A -> A+.
      - name: Generate SBOM (SPDX JSON) for honua-server:test
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: honua-server:test
          format: spdx-json
          output-file: sbom-honua-server-test.spdx.json
          artifact-name: sbom-honua-server-test.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # Run Trivy against the image we just built locally (no double-build:
      # we reuse honua-server:test that the build-push step `load: true`'d
      # into the docker daemon). Fail the PR gate on any HIGH/CRITICAL CVE
      # that already has a fix available upstream.
      - name: Trivy image scan (PR gate, HIGH/CRITICAL, fixed only)
        id: trivy_image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: honua-server:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          vuln-type: os,library

      # Filesystem scan catches CVEs introduced by the Dockerfile base image
      # / package manifests / lockfiles that the image scan may miss when a
      # vulnerable dependency hasn't shipped to a release artifact yet.
      - name: Trivy filesystem scan (PR gate, HIGH/CRITICAL, fixed only)
        id: trivy_fs
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          vuln-type: os,library

      - name: Trivy failure guidance
        if: failure() && (steps.trivy_image.outcome == 'failure' || steps.trivy_fs.outcome == 'failure')
        run: |
          echo "::error title=Trivy PR gate failed::One or more HIGH/CRITICAL CVEs with available fixes were detected."
          echo "::notice::To resolve: review the Trivy output above, then bump the affected dependency / base image to a fixed version. If a CVE is a false positive, add an entry to .trivyignore with a justification and CVE link."
          exit 1

      - name: Run Docker container
        run: |
          docker run -d \
            --name honua-test \
            --network host \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Database=honua_test;Username=honua;Password=honua" \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e HONUA_ADMIN_PASSWORD=ci-docker-admin-password \
            -e Security__ConnectionEncryption__MasterKey="0123456789abcdef0123456789abcdef" \
            -p 8080:8080 \
            honua-server:test

          # Wait for container to start
          sleep 10

          # Health check
          live_success=false
          for i in {1..30}; do
            if curl -f http://localhost:8080/healthz/live; then
              echo "Container started successfully"
              live_success=true
              break
            fi
            sleep 2
          done

          if [ "$live_success" != "true" ]; then
            echo "Container failed liveness probe"
            exit 1
          fi

      - name: Test Docker container endpoints
        run: |
          # Test basic endpoints
          curl --retry 15 --retry-delay 2 --retry-connrefused -f http://localhost:8080/healthz/ready
          curl --retry 5 --retry-delay 2 --retry-connrefused -f http://localhost:8080/openapi.json

          # Test API endpoints
          curl -f "http://localhost:8080/api/admin/health" || true

      - name: Container logs
        if: always()
        run: docker logs honua-test || true

      - name: Cleanup
        if: always()
        run: |
          docker stop honua-test || true
          docker rm honua-test || true

  # Summary gate: a single job that branch-protection can require.
  # Add every job whose failure should block merge.
  ci-gate:
    name: CI Gate
    # When a newer run supersedes this one via workflow concurrency, avoid
    # publishing a false failing gate from the cancelled run.
    if: ${{ always() && !cancelled() }}
    needs: [pr-template-check, pr-readiness, changes, targeted-shards, build, test-all, aot-build, js-integration-tests, esri-leaflet-browser-tests, maplibre-compat, mcp-certification, core-package-compatibility, postgres-compat, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required CI jobs were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed."

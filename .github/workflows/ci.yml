name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'honua-sdk-js git ref for MCP tests (overrides MCP_SDK_REF env)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  # honua-sdk-js ref for MCP certification and LLM smoke tests.
  # IMPORTANT: for release-evidence certification this MUST be pinned to a
  # specific tag or commit SHA so results are reproducible for a given server
  # commit. While set to a branch name like 'trunk' the lane is useful for
  # development but certification artifacts are not release-grade evidence.
  # workflow_dispatch `sdk_ref` overrides this value for manual replays.
  MCP_SDK_REF: '404242df3cbf10f707ee9137405bf93b3de0012d'

jobs:
  pr-readiness:
    name: PR Mergeability & Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip mergeability preflight for non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Non-PR event; mergeability preflight skipped."

      - name: Fail fast on conflicted or stale PR branches
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            let pull = null;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pull = response.data;
              if (pull.mergeable !== null) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!pull) {
              core.setFailed('Unable to load pull request metadata.');
              return;
            }

            const mergeable = pull.mergeable;
            const mergeableState = String(pull.mergeable_state || 'unknown');
            core.info(`mergeable=${mergeable} mergeable_state=${mergeableState}`);

            if (mergeable === false || mergeableState === 'dirty') {
              core.setFailed('PR branch has merge conflicts. Resolve conflicts before running CI.');
              return;
            }

            if (mergeableState === 'behind') {
              core.setFailed('PR branch is behind trunk. Refresh the branch before running CI.');
            }

  changes:
    name: Detect Non-Test Changes
    needs: pr-readiness
    runs-on: ubuntu-latest
    outputs:
      non_test_changes: ${{ steps.filter.outputs.non_test_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            echo "range=origin/${{ github.base_ref }}...${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs: diff against trunk so AOT/Docker gates are not
            # silently skipped due to github.event.before being undefined.
            git fetch origin trunk --depth=1
            echo "range=origin/trunk...${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "range=${{ github.event.before }}...${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Check for non-test changes
        id: filter
        run: |
          CHANGED_FILES=$(git diff --name-only "${{ steps.diff.outputs.range }}" || true)
          NON_TEST_FILES=$(echo "$CHANGED_FILES" | grep -Ev '^(tests/|test/)' | sed '/^$/d' || true)

          if [ -z "$NON_TEST_FILES" ]; then
            echo "non_test_changes=false" >> $GITHUB_OUTPUT
          else
            echo "non_test_changes=true" >> $GITHUB_OUTPUT
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          echo "Non-test files:"
          echo "$NON_TEST_FILES"

  # Compute the server-tests shard subset for this PR. On push events we always
  # run every shard (full integration tier on merge-to-trunk). See ADR-0037.
  targeted-shards:
    name: Detect Targeted Server-Tests Shards
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: pr-readiness
    runs-on: ubuntu-latest
    outputs:
      descriptor: ${{ steps.compute.outputs.descriptor }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute shard descriptor
        id: compute
        env:
          ALL_SHARDS_JSON: '["Core","Admin & Infrastructure","Cloud & Contract","Import","Performance","Comprehensive","Feature APIs","OData","Map and Imagery","Infra and Security","Operator Eval Harness"]'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            descriptor=$(scripts/ci/honua-server-targeted-tests.sh --base "origin/${{ github.base_ref }}")
          else
            descriptor=$(jq -nc --argjson shards "${ALL_SHARDS_JSON}" \
              '{run_all: true, shards: $shards, reason: "non_pr_event"}')
          fi
          echo "Descriptor: ${descriptor}"
          echo "descriptor=${descriptor}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Format Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: pr-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Canonical Instruction Check
        run: bash scripts/ci/check-instructions-sync.sh

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build (warnings as errors)
        run: dotnet build Honua.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Format Check
        run: dotnet format Honua.sln --verify-no-changes --verbosity diagnostic

  dotnet-foundation-tests:
    name: .NET Foundation Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Build foundation test binaries
        timeout-minutes: 20
        run: |
          dotnet build Honua.sln \
            --no-restore \
            --configuration Release

      - name: Run .NET Tests (Core)
        # Honua.Postgres.Tests is covered by the postgres-compat job which
        # runs it against the full Postgres version matrix (16/17/18). Running
        # it here as well was duplicating ~2 min of test time per PR on the
        # baseline 16-3.4 image. Keep core + loadtests here; defer Postgres
        # coverage entirely to postgres-compat.
        timeout-minutes: 20
        run: |
          dotnet test tests/dotnet/Honua.Core.Tests/Honua.Core.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=core-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

          dotnet test tests/dotnet/Honua.LoadTests/Honua.LoadTests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=load-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      - name: Run .NET Tests (Architecture)
        timeout-minutes: 10
        run: |
          dotnet test tests/dotnet/Honua.Architecture.Tests/Honua.Architecture.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=architecture-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      - name: Upload foundation test results
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          name: foundation-test-results
          path: tests/TestResults/
          retention-days: 7

  server-tests:
    name: Server Tests (${{ matrix.shard_name }})
    # Per ADR-0037 the PR gate runs only the targeted shards from
    # scripts/ci/honua-server-targeted-tests.sh; merge-to-trunk and
    # workflow_dispatch run the full matrix.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && contains(fromJson(needs.targeted-shards.outputs.descriptor).shards, matrix.shard_name) }}
    runs-on: ubuntu-latest
    needs: [build, targeted-shards]
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_name: Core
            artifact_suffix: core
            log_name: server-tests-core
            timeout_minutes: 30
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: false
            filter: "FullyQualifiedName!~Honua.Server.Tests.Features.&FullyQualifiedName!~Honua.Server.Tests.Import.&FullyQualifiedName!~Honua.Server.Tests.Performance.&FullyQualifiedName!~Honua.Server.Tests.Comprehensive.&FullyQualifiedName!~Honua.Server.Tests.Admin.&FullyQualifiedName!~Honua.Server.Tests.Infrastructure.&FullyQualifiedName!~Honua.Server.Tests.Cloud.&FullyQualifiedName!~Honua.Server.Tests.Features.Protocols.Cog&FullyQualifiedName!~Honua.Server.Tests.Contract.&FullyQualifiedName!~Honua.Server.Tests.AdminEndpointTests"
          - shard_name: Admin & Infrastructure
            artifact_suffix: admin-infra
            log_name: server-tests-admin-infra
            timeout_minutes: 30
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: false
            filter: "FullyQualifiedName~Honua.Server.Tests.Admin.|FullyQualifiedName~Honua.Server.Tests.Infrastructure.|FullyQualifiedName~Honua.Server.Tests.AdminEndpointTests"
          - shard_name: Cloud & Contract
            artifact_suffix: cloud-contract
            log_name: server-tests-cloud-contract
            timeout_minutes: 30
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: false
            filter: "FullyQualifiedName~Honua.Server.Tests.Cloud.|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Cog|FullyQualifiedName~Honua.Server.Tests.Contract."
          - shard_name: Import
            artifact_suffix: import
            log_name: server-tests-import
            timeout_minutes: 30
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: false
            filter: "FullyQualifiedName~Honua.Server.Tests.Import."
          - shard_name: Performance
            artifact_suffix: performance
            log_name: server-tests-performance
            timeout_minutes: 20
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: false
            filter: "FullyQualifiedName~Honua.Server.Tests.Performance."
          - shard_name: Comprehensive
            artifact_suffix: comprehensive
            log_name: server-tests-comprehensive
            timeout_minutes: 30
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: false
            filter: "FullyQualifiedName~Honua.Server.Tests.Comprehensive."
          - shard_name: Feature APIs
            artifact_suffix: feature-apis
            log_name: server-tests-feature-apis
            timeout_minutes: 60
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: false
            filter: "FullyQualifiedName~Honua.Server.Tests.Features.Protocols.GeoServices.FeatureServer|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.GeoServices.GeoServicesSpatialFilterBuilderTests|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Ogc.Api.Features|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Ogc.Classic.Wfs20|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Stac|FullyQualifiedName~Honua.Server.Tests.Features.API"
          - shard_name: OData
            artifact_suffix: odata
            log_name: server-tests-odata
            timeout_minutes: 35
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: true
            filter: "FullyQualifiedName~Honua.Server.Tests.Features.Protocols.OData"
          - shard_name: Map and Imagery
            artifact_suffix: map-imagery
            log_name: server-tests-map-imagery
            timeout_minutes: 45
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: false
            filter: "FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Ogc.Api.Maps|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Ogc.Api.Tiles|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Ogc.Classic.Wms|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Ogc.Classic.Wmts|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.GeoServices.MapServer|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.GeoServices.ImageServer|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.GeoServices.GeometryService|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Tiles"
          - shard_name: Infra and Security
            artifact_suffix: infra-security
            log_name: server-tests-infra-security
            timeout_minutes: 20
            max_cpu_count: ""
            upload_operator_eval_report: false
            upload_odata_evidence: false
            filter: "FullyQualifiedName~Honua.Server.Tests.Features.Infrastructure|FullyQualifiedName~Honua.Server.Tests.Features.Caching|FullyQualifiedName~Honua.Server.Tests.Features.Security|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.GeoServices.Catalog|FullyQualifiedName~Honua.Server.Tests.Features.FileStorage|FullyQualifiedName~Honua.Server.Tests.Features.Styling"
          - shard_name: Operator Eval Harness
            artifact_suffix: operator-eval
            log_name: server-tests-operator-eval
            timeout_minutes: 20
            max_cpu_count: "1"
            upload_operator_eval_report: true
            upload_odata_evidence: false
            filter: "FullyQualifiedName~Honua.Server.Tests.Features.Eval|FullyQualifiedName~Honua.Server.Tests.Features.Geoprocessing|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Ogc.Api.Processes|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Grpc|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.Mcp|FullyQualifiedName~Honua.Server.Tests.Features.Protocols.GeoServices.GPServer"
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
      HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Pre-pull Docker images for faster tests
        shell: bash
        run: |
          pull_with_retry() {
            local image="$1"
            local required="${2:-true}"

            for attempt in 1 2 3 4 5; do
              if docker pull --quiet "$image"; then
                return 0
              fi

              if [ "$attempt" -eq 5 ]; then
                if [ "$required" = "true" ]; then
                  echo "Failed to pull required image $image after $attempt attempts." >&2
                  return 1
                fi

                echo "Could not pre-pull optional image $image after $attempt attempts." >&2
                return 0
              fi

              sleep_seconds=$((attempt * 5))
              echo "Pull failed for $image (attempt $attempt/5); retrying in ${sleep_seconds}s..." >&2
              sleep "$sleep_seconds"
            done
          }

          pull_with_retry postgis/postgis:16-3.4 false
          pull_with_retry postgis/postgis:18-3.6 false
          pull_with_retry localstack/localstack:3.6.0
          pull_with_retry mcr.microsoft.com/azure-storage/azurite:3.31.0

      - name: Start emulator containers (Azurite + Localstack)
        run: |
          docker compose -f docker/docker-compose.emulators.yml up -d --pull never
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/4566) >/dev/null 2>&1 \
              && (echo > /dev/tcp/localhost/10000) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Emulators failed to start."
          docker compose -f docker/docker-compose.emulators.yml ps
          exit 1

      - name: Build server test binaries
        timeout-minutes: 20
        run: |
          dotnet build tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-restore \
            --configuration Release

      - name: Run server test shard
        shell: bash
        run: |
          set +e
          filter='${{ matrix.filter }}'
          log_file="./tests/TestResults/${{ matrix.log_name }}.log"
          trx_file="${{ matrix.log_name }}.trx"
          extra_args=()
          if [ -n "${{ matrix.max_cpu_count }}" ]; then
            extra_args+=(-- "RunConfiguration.MaxCpuCount=${{ matrix.max_cpu_count }}")
          fi

          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "$filter" \
            --logger "trx;LogFileName=$trx_file" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            "${extra_args[@]}" \
            > "$log_file" 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[${{ matrix.log_name }}-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat "$log_file"
          exit "$test_exit_code"

      - name: Upload Operator Eval Report
        if: ${{ always() && matrix.upload_operator_eval_report }}
        uses: actions/upload-artifact@v7
        with:
          name: operator-eval-report
          path: tests/TestResults/eval-report.json
          if-no-files-found: error

      - name: Upload OData CLI certification evidence
        if: ${{ always() && matrix.upload_odata_evidence }}
        uses: ./.github/actions/upload-ci-evidence
        with:
          kind: evidence
          suffix: cli-odata
          path: tests/TestResults/*-cli-odata.cert.json
          tier: pr

      - name: Upload shard test results
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          name: server-test-results-${{ matrix.artifact_suffix }}
          path: tests/TestResults/
          retention-days: 7

      - name: Stop emulator containers
        if: always()
        run: docker compose -f docker/docker-compose.emulators.yml down -v || true

  python-integration-tests:
    name: Python Integration Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tests/python/requirements.txt

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build server binaries for Python fixtures
        run: |
          dotnet build src/Honua.Server/Honua.Server.csproj \
            --no-restore \
            --configuration Release

      - name: Install GDAL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq gdal-bin
          ogrinfo --version

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/python/requirements.txt

      - name: Run Python Integration Tests (OGC + FeatureServer + GDAL)
        run: pytest --tb=short
        working-directory: tests/python

      - name: Upload Python test results
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          name: python-test-results
          path: |
            tests/TestResults/
            tests/python/gdal-ogr-results*.json
            tests/python/stac-client-compat-results*.json
            tests/python/stac-client-compat-results*.md
          retention-days: 7

  js-typecheck:
    name: JavaScript Type Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Install JavaScript test dependencies
        run: npm ci
        working-directory: tests/js

      - name: TypeScript type check (JavaScript tests)
        run: npm run typecheck
        working-directory: tests/js

  test-all:
    name: Test Suite (.NET + Python + JS + Browser Clients)
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    needs:
      - dotnet-foundation-tests
      - server-tests
      - python-integration-tests
      - js-typecheck
      - js-integration-tests
      - esri-leaflet-browser-tests
      - maplibre-compat
    steps:
      - name: Check required test job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required test jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required test jobs were cancelled."
            exit 1
          fi
          echo "All test suite jobs passed."

  js-integration-tests:
    name: JavaScript Integration Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Honua Server
        uses: ./.github/actions/setup-honua-server
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Install JavaScript test dependencies
        run: npm ci
        working-directory: tests/js

      - name: Install Playwright Browsers
        run: |
          # Ubuntu 24 runner images currently ship Microsoft apt feeds that can
          # return transient 403s, which breaks Playwright's dependency bootstrap
          # before the JS tests even start.
          sudo find /etc/apt/sources.list.d -maxdepth 1 \
            \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) \
            -print -delete
          npx playwright install --with-deps chromium
        working-directory: tests/js

      - name: Run JavaScript Integration Tests
        run: npm test
        working-directory: tests/js
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          HONUA_API_KEY: "ci-admin-password"

      - name: Run OpenLayers Rendering Test
        run: npx playwright test --config openlayers/rendering/playwright.config.ts
        working-directory: tests/js
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          HONUA_API_KEY: "ci-admin-password"

      - name: Upload OpenLayers Evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openlayers-compat-results
          path: |
            tests/js/js-*.cert.json
            tests/js/certification-evidence/*.cert.json
          retention-days: 7


name: CI

on:
  schedule:
    # Full integration lane. PR CI is selective; release workflows own
    # packaging/publishing smoke.
    - cron: '0 9 * * *'
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'honua-sdk-js git ref for MCP tests (overrides MCP_SDK_REF env)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  # honua-sdk-js ref for MCP certification and LLM smoke tests.
  # IMPORTANT: for release-evidence certification this MUST be pinned to a
  # specific tag or commit SHA so results are reproducible for a given server
  # commit. While set to a branch name like 'trunk' the lane is useful for
  # development but certification artifacts are not release-grade evidence.
  # workflow_dispatch `sdk_ref` overrides this value for manual replays.
  MCP_SDK_REF: '404242df3cbf10f707ee9137405bf93b3de0012d'

permissions:
  contents: read
  packages: read

jobs:
  pr-template-check:
    name: Validate PR Template Compliance
    # Gate every heavy CI job on PR-body template compliance. For non-PR events
    # (schedule, workflow_dispatch) this job short-circuits to success so
    # nightly/manual runs are never blocked. Dependabot PRs skip the check to
    # match the previous standalone workflow's behavior.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Skip template validation for non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Non-PR event; PR template validation skipped."

      - name: Check PR Template Compliance
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const body = pr.body || '';
            const title = pr.title || '';

            console.log('Validating PR:', title);

            const issues = [];
            const warnings = [];

            // --- Required sections ---

            // 1. Issue link
            const hasIssueLink = /(?:Fixes|Closes|Resolves|Related to)\s+#\d+/i.test(body);
            if (!hasIssueLink) {
              issues.push('**Missing issue link** — add `Fixes #123` (or Closes/Resolves/Related to)');
            }

            // 2. Summary (non-empty content after the heading)
            const hasSummary = /## Summary\s*\n(?:<!--[\s\S]*?-->\s*\n)?\s*\S+/m.test(body);
            if (!hasSummary) {
              issues.push('**Empty Summary** — describe what this PR does and why');
            }

            // 3. Changes Made (at least one bullet, bounded to section)
            const changesSection = body.match(/## Changes Made([\s\S]*?)(?=\n##|\n---|\s*$)/);
            const hasChanges = changesSection && /\n- \S/.test(changesSection[1]);
            if (!hasChanges) {
              issues.push('**Changes Made incomplete** — list key changes as bullet points');
            }

            // 4. Breaking Changes (must have content, not just the heading)
            const breakingSection = body.match(/## Breaking Changes\s*\n([\s\S]*?)(?=\n---|$)/m);
            if (!breakingSection || !breakingSection[1].trim()) {
              issues.push('**Breaking Changes empty** — list breaking changes or write "None"');
            }

            // 5. Pre-PR check confirmed
            const prePrChecked = /- \[x\].*scripts\/ci\/pre-pr-check\.sh/i.test(body);
            if (!prePrChecked) {
              issues.push('**Pre-PR validation not confirmed** — run `scripts/ci/pre-pr-check.sh` and check the box');
            }

            // 6. PR title format (conventional commits)
            const titleFormat = /^(feat|fix|docs|style|refactor|test|chore|ci|perf)(\([^)]+\))?: .+/i;
            if (!titleFormat.test(title)) {
              issues.push('**PR title format** — use conventional format: `type(scope): description` (e.g., `feat: add query endpoint`)');
            }

            // --- Warnings (recommended but not blocking) ---

            // Gate impact section
            const hasGateImpact = /## Gate Impact/m.test(body);
            if (!hasGateImpact) {
              warnings.push('**Missing Gate Impact section** — template may be outdated');
            } else {
              const gateSection = body.match(/## Gate Impact([\s\S]*?)(?=\n##|\n---|\s*$)/);
              if (!gateSection || !/- \[x\]/.test(gateSection[1])) {
                warnings.push('**No Gate Impact boxes checked** — indicate which CI tiers are affected');
              }
            }

            // Testing section (bounded to section)
            const testingSection = body.match(/## Testing([\s\S]*?)(?=\n##|\n---|\s*$)/);
            if (!testingSection || !/- \[x\]/.test(testingSection[1])) {
              warnings.push('**No Testing boxes checked** — indicate what testing was performed');
            }

            // --- Generate comment ---
            let comment = '## PR Template Validation\n\n';

            if (issues.length === 0 && warnings.length === 0) {
              comment += 'All checks passed. Your PR follows the template correctly.\n';
            } else {
              if (issues.length > 0) {
                comment += '### Issues (must fix)\n\n';
                issues.forEach(issue => comment += `- ${issue}\n`);
                comment += '\n';
              }

              if (warnings.length > 0) {
                comment += '### Warnings (recommended)\n\n';
                warnings.forEach(warning => comment += `- ${warning}\n`);
                comment += '\n';
              }

              comment += 'Edit your PR description to address these issues — this check re-runs automatically.\n';
            }

            comment += '\n---\n*PR validation — see [template guide](../blob/trunk/.github/pull_request_template.md) and [gate model](../blob/trunk/docs/ci/gate-model.md)*';

            // Upsert validation comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.body.includes('## PR Template Validation') || c.body.includes('\u{1F916} PR Template Validation')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

            if (issues.length > 0) {
              core.setFailed(`PR template validation failed: ${issues.length} issue(s)`);
            }

  pr-readiness:
    name: PR Mergeability & Freshness
    needs: pr-template-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip mergeability preflight for non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Non-PR event; mergeability preflight skipped."

      - name: Fail fast on conflicted or stale PR branches
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            let pull = null;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pull = response.data;
              if (pull.mergeable !== null) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!pull) {
              core.setFailed('Unable to load pull request metadata.');
              return;
            }

            const mergeable = pull.mergeable;
            const mergeableState = String(pull.mergeable_state || 'unknown');
            core.info(`mergeable=${mergeable} mergeable_state=${mergeableState}`);

            if (mergeable === false || mergeableState === 'dirty') {
              core.setFailed('PR branch has merge conflicts. Resolve conflicts before running CI.');
              return;
            }

            if (mergeableState === 'behind') {
              core.setFailed('PR branch is behind trunk. Refresh the branch before running CI.');
            }

  changes:
    name: Detect Non-Test Changes
    needs: pr-readiness
    runs-on: ubuntu-latest
    outputs:
      non_test_changes: ${{ steps.filter.outputs.non_test_changes }}
      integration_changes: ${{ steps.filter.outputs.integration_changes }}
      integration_reason: ${{ steps.filter.outputs.integration_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            echo "range=origin/${{ github.base_ref }}...${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            git fetch origin trunk --depth=1
            echo "range=origin/trunk...${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Check for non-test changes
        id: filter
        run: |
          CHANGED_FILES=$(git diff --name-only "${{ steps.diff.outputs.range }}" || true)

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "non_test_changes=true" >> $GITHUB_OUTPUT
            echo "integration_changes=true" >> "$GITHUB_OUTPUT"
            echo "integration_reason=scheduled_or_manual_full_ci" >> "$GITHUB_OUTPUT"
            INTEGRATION_FILES="<full integration event>"
          else
            # PRs that only touch docs, CI/publish plumbing, package metadata,
            # or NuGet source configuration do not need the full integration
            # fanout. Scheduled/manual CI still runs the full lane.
            NON_TEST_FILES=$(echo "$CHANGED_FILES" | grep -Ev '^(tests/|test/)' | sed '/^$/d' || true)
            if [ -z "$NON_TEST_FILES" ]; then
              echo "non_test_changes=false" >> $GITHUB_OUTPUT
            else
              echo "non_test_changes=true" >> $GITHUB_OUTPUT
            fi

            INTEGRATION_FILES=$(
              printf '%s\n' "$CHANGED_FILES" \
                | grep -Ev '^($|docs/|README\.md$|\.github/(actions/setup-dotnet-ci/|workflows/[^/]+\.yml$)|NuGet\.config$|src/Honua\.Core/Honua\.Core\.csproj$)' \
                | sed '/^$/d' || true
            )

            if [ -z "$INTEGRATION_FILES" ]; then
              echo "integration_changes=false" >> "$GITHUB_OUTPUT"
              echo "integration_reason=ci_package_or_docs_only" >> "$GITHUB_OUTPUT"
            else
              echo "integration_changes=true" >> "$GITHUB_OUTPUT"
              echo "integration_reason=runtime_or_test_changes" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          echo "Non-test files:"
          echo "${NON_TEST_FILES:-<full integration event>}"
          echo ""
          echo "Integration-triggering files:"
          echo "${INTEGRATION_FILES:-<none>}"

  # Compute the server-tests shard subset for this PR. Scheduled/manual full
  # integration runs execute every shard. See ADR-0037.
  # Per ADR-0037 .github/ci-shards.json is the single source of truth for both
  # the shard routing data (paths) and the matrix-runtime metadata
  # (artifact_suffix, log_name, timeout_minutes, test_timeout_minutes,
  # max_cpu_count, upload flags, filter). This job emits two outputs:
  #   - descriptor: the {run_all, shards, reason} structure from the targeted-
  #     tests script (kept for visibility in logs).
  #   - matrix_include: a JSON array of matrix entries built from ci-shards.json
  #     and filtered to the selected shard names. ci.yml::server-tests consumes
  #     this via `strategy.matrix.include: ${{ fromJson(...) }}` so unselected
  #     shards never instantiate a runner.
  targeted-shards:
    name: Detect Targeted Server-Tests Shards
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: pr-readiness
    runs-on: ubuntu-latest
    outputs:
      descriptor: ${{ steps.compute.outputs.descriptor }}
      matrix_include: ${{ steps.compute.outputs.matrix_include }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute shard descriptor and matrix include
        id: compute
        run: |
          set -euo pipefail
          all_shards_json=$(jq -c '[.shards[].name]' .github/ci-shards.json)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            descriptor=$(scripts/ci/honua-server-targeted-tests.sh --base "origin/${{ github.base_ref }}")
          else
            descriptor=$(jq -nc --argjson shards "${all_shards_json}" \
              '{run_all: true, shards: $shards, reason: "scheduled_or_manual_full_ci"}')
          fi
          echo "Descriptor: ${descriptor}"

          # Build the matrix include list by joining the selected shard names
          # against the ci-shards.json shard metadata. Drop the routing-only
          # `paths` field; project the rest verbatim into matrix entries.
          selected=$(printf '%s' "${descriptor}" | jq -c '.shards')
          matrix_include=$(jq -c --argjson sel "${selected}" '
            .shards
            | map(select(.name as $n | $sel | index($n)))
            | map({
                shard_name,
                artifact_suffix,
                log_name,
                timeout_minutes,
                test_timeout_minutes,
                max_cpu_count,
                upload_operator_eval_report,
                upload_odata_evidence,
                filter
              })
          ' .github/ci-shards.json)
          if [ "$(printf '%s' "${matrix_include}" | jq 'length')" = "0" ]; then
            echo "::error::matrix_include is empty — targeted-shards selected no shards"
            exit 1
          fi
          echo "matrix_include: ${matrix_include}"
          echo "descriptor=${descriptor}" >> "$GITHUB_OUTPUT"
          echo "matrix_include=${matrix_include}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Format Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: pr-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Canonical Instruction Check
        run: bash scripts/ci/check-instructions-sync.sh

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build (warnings as errors)
        run: dotnet build Honua.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Format Check
        run: dotnet format Honua.sln --verify-no-changes --verbosity diagnostic

  dotnet-foundation-tests:
    name: .NET Foundation Tests
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Bumped 35→70 to absorb Coverlet XPlat-collector instrumentation
    # overhead across the per-project test steps (Core 30m, Server Fast 20m,
    # Architecture 10m, Security 3m). Step-level timeouts still bound each
    # individual run; this just keeps the orchestrator from cancelling the
    # job before the steps get to fail naturally (#1144).
    timeout-minutes: 70
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Build foundation test binaries
        timeout-minutes: 20
        run: |
          dotnet build Honua.sln \
            --no-restore \
            --configuration Release

      - name: Run .NET Tests (Core)
        # Honua.Postgres.Tests is covered by the postgres-compat job which
        # runs it against the full Postgres version matrix (16/17/18). Running
        # it here as well was duplicating ~2 min of test time per PR on the
        # baseline 16-3.4 image. Keep core + loadtests here; defer Postgres
        # coverage entirely to postgres-compat.
        # Coverlet XPlat collector emits cobertura.xml per project under
        # ./coverage; see coverlet.runsettings for exclusions / formats.
        # Timeout bumped 20→30 to absorb XPlat-collector instrumentation
        # overhead on the larger Honua.Core assembly (#1144).
        timeout-minutes: 30
        run: |
          dotnet test tests/dotnet/Honua.Core.Tests/Honua.Core.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=core-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings

          # Per ADR-0037 PR CI executes the LoadTests project's Fast tier only —
          # the actual NBomber scenarios are exercised by the nightly load-soak
          # workflow. Any future scenario-runner test marked `[Trait("Tier", "Slow")]`
          # is skipped here.
          dotnet test tests/dotnet/Honua.LoadTests/Honua.LoadTests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "Tier!=Slow" \
            --logger "trx;LogFileName=load-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      - name: Run .NET Tests (Server Fast Tier)
        # Per ADR-0037 the Fast tier runs across every test project on every
        # PR, including Honua.Server.Tests. Filtering by Tier=Fast keeps this
        # step under a few minutes — the [UnitTest] tests in Server.Tests use
        # NSubstitute / NullLogger / in-memory caches and do not require the
        # PostgreSQL service. Decoupled from the targeted-shards matrix so a
        # PR with no matching shard still runs the fast server unit tests.
        # Coverage collection on this step would add ~20m of Coverlet teardown
        # overhead on Honua.Server.dll (size + density). Server.Tests coverage
        # is collected by the sharded server-tests jobs which DO use the
        # collector. Keeping this step coverage-free preserves the "fast smoke"
        # intent (#1144).
        timeout-minutes: 15
        run: |
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "Tier=Fast" \
            --logger "trx;LogFileName=server-fast-tier.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      - name: Run .NET Tests (Architecture)
        timeout-minutes: 10
        run: |
          dotnet test tests/dotnet/Honua.Architecture.Tests/Honua.Architecture.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=architecture-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults

      - name: Upload foundation test results
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          name: foundation-test-results
          path: tests/TestResults/
          retention-days: 7

      # Coverlet's XPlat collector drops `coverage.cobertura.xml` into a per-run
      # GUID subdirectory under TestResults. Surface those files as their own
      # artifact so downstream coverage tooling (CodeCov, ReportGenerator, etc.)
      # can pull them without unpacking the full test-results bundle.
      - name: Upload foundation coverage (cobertura)
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          name: foundation-coverage
          path: tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      # CodeCov upload — only runs when a token is configured in repo secrets.
      # Without a token the artifact above is still produced so coverage can be
      # inspected manually from the workflow run.
      - name: Upload coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/TestResults/**/coverage.cobertura.xml
          flags: foundation
          name: foundation-tests
          fail_ci_if_error: false

  server-tests:
    name: Server Tests (${{ matrix.shard_name }})
    # Per ADR-0037 the PR gate runs only the targeted shards selected by
    # scripts/ci/honua-server-targeted-tests.sh; scheduled/manual full runs
    # execute the full matrix. The matrix is built dynamically
    # by `targeted-shards` from .github/ci-shards.json — unselected shards
    # never instantiate a runner job, so per-shard `if:` gating is no longer
    # needed. The PR shard step composes its filter with `&Tier!=Slow` so
    # [EmulatorTest]/[ScaleTest]/[ExternalServiceTest]/[CloudTest] methods
    # in a shard's namespace stay in nightly-slow-tier.yml. The CI shard step
    # also opts into `&Tier!=Fast` so Fast tests run only once in
    # dotnet-foundation-tests, while local pre-PR validation still exercises
    # every server-test shard.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes, targeted-shards]
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targeted-shards.outputs.matrix_include) }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
      HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Build server test binaries
        timeout-minutes: 20
        run: |
          dotnet build tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-restore \
            --configuration Release

      - name: Run server test shard
        shell: bash
        env:
          HONUA_SERVER_TEST_SHARD_NAME: ${{ matrix.shard_name }}
          HONUA_SERVER_TEST_FILTER: ${{ matrix.filter }}
          HONUA_SERVER_TEST_LOG_NAME: ${{ matrix.log_name }}
          HONUA_SERVER_TEST_TIMEOUT_MINUTES: ${{ matrix.test_timeout_minutes }}
          HONUA_SERVER_TEST_MAX_CPU_COUNT: ${{ matrix.max_cpu_count }}
          HONUA_SERVER_TEST_RESULTS_DIR: ./tests/TestResults
          HONUA_SERVER_TEST_CONFIGURATION: Release
          HONUA_SERVER_TEST_EXCLUDE_FAST: "true"
        run: |
          scripts/ci/run-server-test-shard.sh

      - name: Upload Operator Eval Report
        if: ${{ always() && matrix.upload_operator_eval_report }}
        uses: actions/upload-artifact@v7
        with:
          name: operator-eval-report
          path: tests/TestResults/eval-report.json
          if-no-files-found: error

      - name: Upload OData CLI certification evidence
        if: ${{ always() && matrix.upload_odata_evidence }}
        uses: ./.github/actions/upload-ci-evidence
        with:
          kind: evidence
          suffix: cli-odata
          path: tests/TestResults/*-cli-odata.cert.json
          tier: pr

      - name: Upload shard test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 3
        with:
          name: server-test-results-${{ matrix.artifact_suffix }}
          path: tests/TestResults/
          retention-days: 7

  python-integration-tests:
    name: Python Integration Tests
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes]
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-ci
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tests/python/requirements.txt

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build server binaries for Python fixtures
        run: |
          dotnet build src/Honua.Server/Honua.Server.csproj \
            --no-restore \
            --configuration Release

      - name: Install GDAL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq gdal-bin
          ogrinfo --version

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/python/requirements.txt

      - name: Run Python Integration Tests (OGC + FeatureServer + GDAL)
        run: pytest --tb=short
        working-directory: tests/python

      - name: Upload Python test results
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          name: python-test-results
          path: |
            tests/TestResults/
            tests/python/gdal-ogr-results*.json
            tests/python/stac-client-compat-results*.json
            tests/python/stac-client-compat-results*.md
          retention-days: 7

  js-typecheck:
    name: JavaScript Type Check
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Install JavaScript test dependencies
        run: npm ci
        working-directory: tests/js

      - name: TypeScript type check (JavaScript tests)
        run: npm run typecheck
        working-directory: tests/js

  test-all:
    name: Test Suite (.NET + Python + JS + Browser Clients)
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    needs:
      - dotnet-foundation-tests
      - server-tests
      - python-integration-tests
      - js-typecheck
      - js-integration-tests
      - esri-leaflet-browser-tests
      - maplibre-compat
    steps:
      - name: Check required test job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required test jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required test jobs were cancelled."
            exit 1
          fi
          echo "All test suite jobs passed."

  js-integration-tests:
    name: JavaScript Integration Tests
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.integration_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes]
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
          POSTGIS_GDAL_ENABLED_DRIVERS: ENABLE_ALL
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Honua Server
        uses: ./.github/actions/setup-honua-server
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Install JavaScript test dependencies
        run: npm ci
        working-directory: tests/js

      - name: Install Playwright Browsers
        run: |
          # Ubuntu 24 runner images currently ship Microsoft apt feeds that can
          # return transient 403s, which breaks Playwright's dependency bootstrap
          # before the JS tests even start.
          sudo find /etc/apt/sources.list.d -maxdepth 1 \
            \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) \
            -print -delete
          npx playwright install --with-deps chromium
        working-directory: tests/js

      - name: Run JavaScript Integration Tests
        run: npm test
        working-directory: tests/js
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          HONUA_API_KEY: "ci-admin-password"

      - name: Run OpenLayers Rendering Test
        run: npx playwright test --config openlayers/rendering/playwright.config.ts
        working-directory: tests/js
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          HONUA_API_KEY: "ci-admin-password"

      - name: Upload OpenLayers Evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openlayers-compat-results
          path: |
            tests/js/js-*.cert.json
            tests/js/certification-evidence/*.cert.json
          retention-days: 7


name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions: {}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  changes:
    name: Detect Non-Test Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      non_test_changes: ${{ steps.filter.outputs.non_test_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            echo "range=origin/${BASE_REF}...${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${BEFORE_SHA}...${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for non-test changes
        id: filter
        env:
          DIFF_RANGE: ${{ steps.diff.outputs.range }}
        run: |
          CHANGED_FILES=$(git diff --name-only "$DIFF_RANGE" || true)
          NON_TEST_FILES=$(echo "$CHANGED_FILES" | grep -Ev '^(tests/|test/)' | sed '/^$/d' || true)

          if [ -z "$NON_TEST_FILES" ]; then
            echo "non_test_changes=false" >> $GITHUB_OUTPUT
          else
            echo "non_test_changes=true" >> $GITHUB_OUTPUT
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          echo "Non-test files:"
          echo "$NON_TEST_FILES"

  build:
    name: Build & Format Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Instruction Sync (Claude/Codex)
        run: bash scripts/check-instructions-sync.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build (warnings as errors)
        run: dotnet build Honua.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Format Check
        run: dotnet format Honua.sln --verify-no-changes --verbosity diagnostic

  js-sdk-validation:
    name: JS SDK Validation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Real sample migration runtime gate
        run: npm run test:migration:real-samples

      - name: Real sample migration readiness gate
        run: npm run gate:migration:real-samples

      - name: Demo target migration gate
        run: npm run gate:migration:demo-target

      - name: Esri Leaflet deterministic target gate
        run: npm run gate:migration:esri-leaflet-target

      - name: FeatureTable demo codemod pipeline report
        continue-on-error: true
        run: |
          npm run demo:migration:featuretable || (
            echo "Retrying feature-table demo codemod pipeline report once after transient failure..."
            npm run demo:migration:featuretable
          )

      - name: Constructor parity matrix artifact
        run: npm run matrix:parity

      - name: FeatureTable demo live migration pipeline (optional)
        continue-on-error: true
        env:
          HONUA_DEMO_TARGET_BASE_URL: ${{ secrets.HONUA_DEMO_TARGET_BASE_URL }}
          HONUA_DEMO_ADMIN_API_KEY: ${{ secrets.HONUA_DEMO_ADMIN_API_KEY }}
          HONUA_DEMO_SOURCE_SERVICE_URL: ${{ secrets.HONUA_DEMO_SOURCE_SERVICE_URL }}
          HONUA_DEMO_TABLE_NAME: ${{ secrets.HONUA_DEMO_TABLE_NAME }}
          HONUA_DEMO_LAYER_ID: ${{ secrets.HONUA_DEMO_LAYER_ID }}
          HONUA_DEMO_SOURCE_BASE_URL: ${{ secrets.HONUA_DEMO_SOURCE_BASE_URL }}
          HONUA_DEMO_SOURCE_SERVICE_ID: ${{ secrets.HONUA_DEMO_SOURCE_SERVICE_ID }}
          HONUA_DEMO_TARGET_SERVICE_ID: ${{ secrets.HONUA_DEMO_TARGET_SERVICE_ID }}
          HONUA_DEMO_SAMPLE_SIZE: ${{ vars.HONUA_DEMO_SAMPLE_SIZE }}
          HONUA_DEMO_TIMEOUT_SECONDS: ${{ vars.HONUA_DEMO_TIMEOUT_SECONDS }}
        run: npm run demo:migration:featuretable:live

      - name: Runtime parity matrix artifact
        run: npm run matrix:runtime

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Browser migration smoke test
        run: npm run test:playwright:migration

      - name: Split package verification
        run: npm run verify:split-packages

      - name: Upload JS migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: js-migration-artifacts
          path: |
            sdk/js/reports/demo-featuretable-primary-metrics.json
            sdk/js/reports/demo-featuretable-fallback-esri-leaflet-metrics.json
            sdk/js/reports/demo-featuretable-codemod-report.json
            sdk/js/reports/parity-matrix.json
            sdk/js/reports/real-sample-metrics.json
            sdk/js/reports/runtime-parity-matrix.json

      - name: Upload JS live demo artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: js-live-demo-artifacts
          path: sdk/js/reports/demo-featuretable-live-report.json
          if-no-files-found: ignore

  mcp-sdk-validation:
    name: MCP SDK Validation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/mcp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdk/mcp/package-lock.json

      - name: Build JS SDK dependency
        run: |
          npm ci --prefix ../js
          npm run build --prefix ../js

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Dist smoke tests
        run: npx vitest run test/dist-smoke.test.ts

  python-sdk-validation:
    name: Python SDK Validation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[grpc]"
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  dotnet-sdk-validation:
    name: .NET SDK Validation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Admin SDK
        run: dotnet build sdk/dotnet/Honua.Sdk.Admin/Honua.Sdk.Admin.csproj --configuration Release /p:TreatWarningsAsErrors=true

      - name: Test Admin SDK
        run: dotnet test sdk/dotnet/Honua.Sdk.Admin.Tests/Honua.Sdk.Admin.Tests.csproj --configuration Release

      - name: Build gRPC SDK
        run: dotnet build sdk/dotnet/Honua.Sdk.Grpc/Honua.Sdk.Grpc.csproj --configuration Release /p:TreatWarningsAsErrors=true

      - name: Test gRPC SDK
        run: dotnet test sdk/dotnet/Honua.Sdk.Grpc.Tests/Honua.Sdk.Grpc.Tests.csproj --configuration Release

  terraform-fmt:
    name: Terraform Format Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive infrastructure/terraform
          terraform fmt -check -recursive docs/devops/examples

  terraform-validate:
    name: Terraform Validate (${{ matrix.component }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: terraform-fmt
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: aws
            roots: |
              infrastructure/terraform/bootstrap/aws-ecs
              infrastructure/terraform/examples/aws
              infrastructure/terraform/modules/aws-ecs
          - component: aws-serverless
            roots: |
              infrastructure/terraform/bootstrap/aws-serverless
              infrastructure/terraform/examples/aws-serverless
              infrastructure/terraform/modules/aws-serverless
          - component: azure
            roots: |
              infrastructure/terraform/bootstrap/azure-aca
              infrastructure/terraform/examples/azure
              infrastructure/terraform/modules/azure-aca
          - component: azure-functions
            roots: |
              infrastructure/terraform/bootstrap/azure-functions
              infrastructure/terraform/examples/azure-functions
              infrastructure/terraform/modules/azure-functions
          - component: observability
            roots: |
              infrastructure/terraform/examples/observability
              infrastructure/terraform/modules/observability-stack
          - component: docs-examples
            roots: |
              docs/devops/examples
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init and validate Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r root; do
            [ -z "$root" ] && continue
            echo "::group::terraform init ($root)"
            terraform -chdir="$root" init -backend=false -input=false -no-color
            echo "::endgroup::"

            echo "::group::terraform validate ($root)"
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done <<< "${{ matrix.roots }}"

  test-all:
    name: Test Suite (.NET + Python + JS)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    timeout-minutes: 90
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
      HONUA_ADMIN_E2E_BASE_URL: http://localhost:8080/admin/
      HONUA_ADMIN_E2E_DB_URL: Host=localhost;Username=honua;Password=honua;Database=honua_test
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space for test suite
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          docker system df || true

          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          $SUDO rm -rf /usr/local/lib/android || true
          $SUDO rm -rf /opt/ghc || true
          $SUDO rm -rf /usr/share/swift || true
          $SUDO rm -rf /opt/hostedtoolcache/CodeQL || true

          docker system prune -af --volumes || true
          docker builder prune -af || true

          echo "Disk space after cleanup:"
          df -h
          docker system df || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tests/python/requirements.txt

      - name: Install Localstack CLI (awslocal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user awscli-local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Pre-pull Docker images for faster tests
        run: |
          docker pull --quiet postgis/postgis:16-3.4-alpine || true
          docker pull --quiet postgis/postgis:18-3.6 || true

      - name: Start emulator containers (Azurite + Localstack)
        run: |
          docker compose -f .devcontainer/docker-compose.emulators.yml up -d --quiet-pull
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/4566) >/dev/null 2>&1 \
              && (echo > /dev/tcp/localhost/10000) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Emulators failed to start."
          docker compose -f .devcontainer/docker-compose.emulators.yml ps
          exit 1

      - name: Build .NET test binaries
        timeout-minutes: 20
        run: |
          dotnet build Honua.sln \
            --no-restore \
            --configuration Release \
            -m:1

      - name: Install Playwright dependencies for .NET tests
        timeout-minutes: 10
        run: |
          pwsh tests/Honua.Admin.Playwright/bin/Release/net10.0/playwright.ps1 install-deps chromium
          pwsh tests/Honua.Admin.Playwright/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Start Admin UI Server
        run: |
          ASPNETCORE_ENVIRONMENT=Test \
            HONUA_DEV_AUTH=true \
            HONUA_SKIP_MIGRATIONS=true \
            HONUA_TEST_SCHEMA_HEADERS=true \
            Security__ConnectionEncryption__MasterKey="test-master-key-that-is-at-least-32-characters-long-for-security" \
            Security__ConnectionEncryption__Salt="dGVzdC1zYWx0LWZvci1lbmNyeXB0aW9uLXRlc3RpbmctcHVycG9zZXM=" \
            ASPNETCORE_URLS=http://localhost:8080 \
            dotnet run --project src/Honua.Server/Honua.Server.csproj \
              --configuration Release \
              --no-launch-profile \
              --no-build \
              > ./tests/TestResults/admin-ui-server.log 2>&1 &
          echo $! > /tmp/honua-admin-ui.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/healthz/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Admin UI server failed to start."
          cat ./tests/TestResults/admin-ui-server.log
          exit 1

      - name: Run .NET Tests (Admin/Core/Postgres)
        timeout-minutes: 20
        run: |
          dotnet test tests/Honua.Admin.Tests/Honua.Admin.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=admin-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

          dotnet test tests/Honua.Admin.Playwright/Honua.Admin.Playwright.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=admin-playwright-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

          dotnet test tests/Honua.Core.Tests/Honua.Core.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=core-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

          dotnet test tests/Honua.LoadTests/Honua.LoadTests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=load-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

          dotnet test tests/Honua.Postgres.Tests/Honua.Postgres.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=postgres-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

      - name: Run .NET Tests (Server - Core)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName!~Honua.Server.Tests.Features." \
            --logger "trx;LogFileName=server-tests-core.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1 \
            > ./tests/TestResults/server-tests-core.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-core-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-core.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Feature APIs)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Features.FeatureServer|FullyQualifiedName~Honua.Server.Tests.Features.OData|FullyQualifiedName~Honua.Server.Tests.Features.OgcFeatures|FullyQualifiedName~Honua.Server.Tests.Features.API" \
            --logger "trx;LogFileName=server-tests-feature-apis.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1 \
            > ./tests/TestResults/server-tests-feature-apis.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-feature-apis-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-feature-apis.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Map and Imagery)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Features.OgcMaps|FullyQualifiedName~Honua.Server.Tests.Features.OgcTiles|FullyQualifiedName~Honua.Server.Tests.Features.MapServer|FullyQualifiedName~Honua.Server.Tests.Features.ImageServer|FullyQualifiedName~Honua.Server.Tests.Features.GeometryService" \
            --logger "trx;LogFileName=server-tests-map-imagery.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1 \
            > ./tests/TestResults/server-tests-map-imagery.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-map-imagery-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-map-imagery.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Infra and Security)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Features.Infrastructure|FullyQualifiedName~Honua.Server.Tests.Features.Caching|FullyQualifiedName~Honua.Server.Tests.Features.Security|FullyQualifiedName~Honua.Server.Tests.Features.GeoservicesCatalog|FullyQualifiedName~Honua.Server.Tests.Features.FileStorage|FullyQualifiedName~Honua.Server.Tests.Features.Styling" \
            --logger "trx;LogFileName=server-tests-infra-security.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1 \
            > ./tests/TestResults/server-tests-infra-security.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-infra-security-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-infra-security.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Uncategorized)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Features.&FullyQualifiedName!~FeatureServer&FullyQualifiedName!~OData&FullyQualifiedName!~OgcFeatures&FullyQualifiedName!~API&FullyQualifiedName!~OgcMaps&FullyQualifiedName!~OgcTiles&FullyQualifiedName!~MapServer&FullyQualifiedName!~ImageServer&FullyQualifiedName!~GeometryService&FullyQualifiedName!~Infrastructure&FullyQualifiedName!~Caching&FullyQualifiedName!~Security&FullyQualifiedName!~GeoservicesCatalog&FullyQualifiedName!~FileStorage&FullyQualifiedName!~Styling" \
            --logger "trx;LogFileName=server-tests-uncategorized.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1 \
            > ./tests/TestResults/server-tests-uncategorized.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-uncategorized-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-uncategorized.log

          # Exit code 8 from dotnet test means "no tests matched the filter" which is OK for the catch-all
          if [ "$test_exit_code" -eq 8 ]; then
            echo "No uncategorized tests found (this is expected when all namespaces are covered)."
            exit 0
          fi
          exit "$test_exit_code"

      - name: Run .NET Tests (Architecture)
        timeout-minutes: 10
        run: |
          dotnet test tests/Honua.Architecture.Tests/Honua.Architecture.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=architecture-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/python/requirements.txt

      - name: Run Python Integration Tests (OGC + FeatureServer)
        run: pytest --tb=short
        working-directory: tests/python

      - name: Install JavaScript test dependencies
        run: npm ci
        working-directory: tests/js

      - name: TypeScript type check (JavaScript tests)
        run: npm run typecheck
        working-directory: tests/js

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 3
        with:
          name: all-test-results
          path: tests/TestResults/
          retention-days: 7

  js-integration-tests:
    name: JavaScript Integration Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Restore .NET packages
        run: dotnet restore Honua.sln

      - name: Build Honua Server
        run: dotnet build src/Honua.Server --configuration Release --no-restore

      - name: Initialize test database
        run: |
          PGPASSWORD=honua psql -h localhost -U honua -d honua_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
        env:
          PGPASSWORD: honua

      - name: Seed FeatureServer metadata
        run: |
          cat <<'SQL' > /tmp/honua-js-seed.sql
          CREATE SCHEMA IF NOT EXISTS honua;

          CREATE TABLE IF NOT EXISTS honua.services (
              service_name VARCHAR(64) PRIMARY KEY,
              description TEXT NOT NULL DEFAULT '',
              srid INT NOT NULL DEFAULT 4326,
              max_record_count INT NOT NULL DEFAULT 1000,
              supported_formats TEXT[] NOT NULL DEFAULT '{JSON,GeoJSON}',
              capabilities TEXT[] NOT NULL DEFAULT '{Query,Extract}',
              service_extent GEOMETRY,
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW()
          );

          CREATE TABLE IF NOT EXISTS honua.layers (
              layer_id SERIAL PRIMARY KEY,
              layer_name TEXT NOT NULL,
              description TEXT,
              table_name TEXT NOT NULL,
              geometry_type TEXT NOT NULL,
              srid INT NOT NULL DEFAULT 4326,
              extent GEOMETRY(POLYGON, 4326),
              min_scale DOUBLE PRECISION,
              max_scale DOUBLE PRECISION,
              default_visibility BOOLEAN NOT NULL DEFAULT TRUE,
              created_at TIMESTAMPTZ DEFAULT NOW()
          );

          ALTER TABLE IF EXISTS honua.services
              ADD COLUMN IF NOT EXISTS metadata JSONB;

          ALTER TABLE IF EXISTS honua.layers
              ADD COLUMN IF NOT EXISTS metadata JSONB;

          CREATE TABLE IF NOT EXISTS honua.service_layers (
              service_name VARCHAR(64) NOT NULL REFERENCES honua.services(service_name) ON DELETE CASCADE,
              layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
              layer_order INT NOT NULL,
              PRIMARY KEY (service_name, layer_id),
              UNIQUE (service_name, layer_order)
          );

          CREATE TABLE IF NOT EXISTS honua.layer_fields (
              layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
              field_name VARCHAR(64) NOT NULL,
              field_type VARCHAR(32) NOT NULL,
              field_order INT NOT NULL,
              max_length INT,
              nullable BOOLEAN NOT NULL DEFAULT TRUE,
              default_value TEXT,
              description TEXT,
              PRIMARY KEY (layer_id, field_name)
          );

          CREATE TABLE IF NOT EXISTS honua.attachments (
              id BIGSERIAL PRIMARY KEY,
              feature_id BIGINT NOT NULL,
              layer_id INT NOT NULL,
              filename TEXT NOT NULL,
              content_type TEXT NOT NULL,
              size BIGINT NOT NULL CHECK (size >= 0),
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              storage_path TEXT NOT NULL,
              keywords TEXT
          );

          CREATE TABLE IF NOT EXISTS honua.relationships (
              id SERIAL PRIMARY KEY,
              layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
              relationship_id INT NOT NULL,
              name TEXT NOT NULL,
              related_layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
              relationship_type TEXT NOT NULL,
              origin_foreign_key TEXT NOT NULL,
              destination_foreign_key TEXT NOT NULL,
              description TEXT,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              CONSTRAINT relationships_layer_relationship_unique UNIQUE(layer_id, relationship_id),
              CONSTRAINT relationships_valid_ids CHECK(layer_id >= 0 AND related_layer_id >= 0 AND relationship_id > 0),
              CONSTRAINT relationships_valid_fields CHECK(
                  LENGTH(name) > 0 AND LENGTH(name) <= 128 AND
                  LENGTH(relationship_type) > 0 AND LENGTH(relationship_type) <= 64 AND
                  LENGTH(origin_foreign_key) > 0 AND LENGTH(origin_foreign_key) <= 128 AND
                  LENGTH(destination_foreign_key) > 0 AND LENGTH(destination_foreign_key) <= 128
              ),
              CONSTRAINT relationships_valid_type CHECK(
                  relationship_type IN ('esriRelRoleOrigin', 'esriRelRoleDestination', 'esriRelRoleAny')
              )
          );

          CREATE TABLE IF NOT EXISTS features (
              objectid BIGSERIAL PRIMARY KEY,
              layer_id INT NOT NULL,
              geometry GEOMETRY,
              attributes JSONB,
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW()
          );

          CREATE INDEX IF NOT EXISTS idx_service_layers_service_name ON honua.service_layers(service_name);
          CREATE INDEX IF NOT EXISTS idx_service_layers_layer_id ON honua.service_layers(layer_id);
          CREATE INDEX IF NOT EXISTS idx_layer_fields_layer_id ON honua.layer_fields(layer_id);
          CREATE INDEX IF NOT EXISTS idx_relationships_layer_id ON honua.relationships(layer_id);
          CREATE INDEX IF NOT EXISTS idx_relationships_related_layer_id ON honua.relationships(related_layer_id);
          CREATE INDEX IF NOT EXISTS idx_features_layer_id ON features(layer_id);
          CREATE INDEX IF NOT EXISTS idx_features_geometry ON features USING GIST(geometry);
          CREATE INDEX IF NOT EXISTS idx_features_attributes ON features USING GIN(attributes);

          INSERT INTO honua.services (
              service_name,
              description,
              srid,
              max_record_count,
              supported_formats,
              capabilities,
              service_extent
          )
          VALUES (
              'test_service',
              'Test Feature Service',
              4326,
              1000,
              ARRAY['JSON', 'GeoJSON'],
              ARRAY['Query', 'Extract', 'Create', 'Update', 'Delete'],
              ST_MakeEnvelope(-122.5, 37.7, -122.35, 37.84, 4326)
          )
          ON CONFLICT (service_name) DO UPDATE SET
              description = EXCLUDED.description,
              srid = EXCLUDED.srid,
              max_record_count = EXCLUDED.max_record_count,
              supported_formats = EXCLUDED.supported_formats,
              capabilities = EXCLUDED.capabilities,
              service_extent = EXCLUDED.service_extent,
              updated_at = NOW();

          UPDATE honua.services
          SET metadata = jsonb_build_object('accessPolicy', jsonb_build_object('allowAnonymous', true))
          WHERE service_name = 'test_service';

          INSERT INTO honua.layers (
              layer_id,
              layer_name,
              description,
              table_name,
              geometry_type,
              srid,
              extent,
              default_visibility
          )
          VALUES (
              0,
              'Test Layer',
              'Default layer for integration tests',
              'features',
              'Point',
              4326,
              ST_MakeEnvelope(-122.5, 37.7, -122.35, 37.84, 4326),
              true
          )
          ON CONFLICT (layer_id) DO UPDATE SET
              layer_name = EXCLUDED.layer_name,
              description = EXCLUDED.description,
              table_name = EXCLUDED.table_name,
              geometry_type = EXCLUDED.geometry_type,
              srid = EXCLUDED.srid,
              extent = EXCLUDED.extent,
              default_visibility = EXCLUDED.default_visibility;

          UPDATE honua.layers
          SET metadata = jsonb_build_object('accessPolicy', jsonb_build_object('allowAnonymous', true))
          WHERE layer_id = 0;

          INSERT INTO honua.layer_fields (
              layer_id,
              field_name,
              field_type,
              field_order,
              max_length,
              nullable,
              default_value,
              description
          )
          VALUES
              (0, 'objectid', 'Integer', 0, NULL, false, NULL, 'Object ID'),
              (0, 'name', 'String', 1, 255, true, NULL, 'Name'),
              (0, 'description', 'String', 2, 1024, true, NULL, 'Description'),
              (0, 'shape', 'Geometry', 3, NULL, true, NULL, 'Geometry')
          ON CONFLICT (layer_id, field_name) DO NOTHING;

          INSERT INTO honua.layer_fields (
              layer_id,
              field_name,
              field_type,
              field_order,
              max_length,
              nullable,
              default_value,
              description
          )
          VALUES
              (0, 'status', 'String', 4, 64, true, NULL, 'Status'),
              (0, 'count', 'Integer', 5, NULL, true, NULL, 'Count'),
              (0, 'ratio', 'Double', 6, NULL, true, NULL, 'Ratio'),
              (0, 'active', 'Boolean', 7, NULL, true, NULL, 'Active flag'),
              (0, 'created_at', 'DateTime', 8, NULL, true, NULL, 'Created timestamp'),
              (0, 'event_date', 'Date', 9, NULL, true, NULL, 'Event date'),
              (0, 'event_time', 'Time', 10, NULL, true, NULL, 'Event time'),
              (0, 'uid', 'Uuid', 11, NULL, true, NULL, 'Unique identifier'),
              (0, 'tags', 'Json', 12, NULL, true, NULL, 'Tag array'),
              (0, 'numbers', 'Json', 13, NULL, true, NULL, 'Number array')
          ON CONFLICT (layer_id, field_name) DO NOTHING;

          INSERT INTO honua.service_layers (
              service_name,
              layer_id,
              layer_order
          )
          VALUES ('test_service', 0, 0)
          ON CONFLICT (service_name, layer_id) DO NOTHING;
          SQL
          PGPASSWORD=honua psql -v ON_ERROR_STOP=1 -h localhost -U honua -d honua_test -f /tmp/honua-js-seed.sql

      - name: Start Honua Server
        run: |
          dotnet run --project src/Honua.Server --configuration Release --no-build --no-launch-profile &
          sleep 10
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5000/healthz/live || exit 1
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=honua_test;Username=honua;Password=honua"
          ASPNETCORE_URLS: "http://localhost:5000"

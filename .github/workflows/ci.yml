name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'honua-sdk-js git ref for MCP tests (overrides MCP_SDK_REF env)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  # honua-sdk-js ref for MCP certification and LLM smoke tests.
  # IMPORTANT: for release-evidence certification this MUST be pinned to a
  # specific tag or commit SHA so results are reproducible for a given server
  # commit. While set to a branch name like 'trunk' the lane is useful for
  # development but certification artifacts are not release-grade evidence.
  # workflow_dispatch `sdk_ref` overrides this value for manual replays.
  MCP_SDK_REF: '404242df3cbf10f707ee9137405bf93b3de0012d'

jobs:
  pr-readiness:
    name: PR Mergeability & Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip mergeability preflight for non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Non-PR event; mergeability preflight skipped."

      - name: Fail fast on conflicted or stale PR branches
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            let pull = null;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pull = response.data;
              if (pull.mergeable !== null) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!pull) {
              core.setFailed('Unable to load pull request metadata.');
              return;
            }

            const mergeable = pull.mergeable;
            const mergeableState = String(pull.mergeable_state || 'unknown');
            core.info(`mergeable=${mergeable} mergeable_state=${mergeableState}`);

            if (mergeable === false || mergeableState === 'dirty') {
              core.setFailed('PR branch has merge conflicts. Resolve conflicts before running CI.');
              return;
            }

            if (mergeableState === 'behind') {
              core.setFailed('PR branch is behind trunk. Refresh the branch before running CI.');
            }

  changes:
    name: Detect Non-Test Changes
    needs: pr-readiness
    runs-on: ubuntu-latest
    outputs:
      non_test_changes: ${{ steps.filter.outputs.non_test_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            echo "range=origin/${{ github.base_ref }}...${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs: diff against trunk so AOT/Docker gates are not
            # silently skipped due to github.event.before being undefined.
            git fetch origin trunk --depth=1
            echo "range=origin/trunk...${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "range=${{ github.event.before }}...${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Check for non-test changes
        id: filter
        run: |
          CHANGED_FILES=$(git diff --name-only "${{ steps.diff.outputs.range }}" || true)
          NON_TEST_FILES=$(echo "$CHANGED_FILES" | grep -Ev '^(tests/|test/)' | sed '/^$/d' || true)

          if [ -z "$NON_TEST_FILES" ]; then
            echo "non_test_changes=false" >> $GITHUB_OUTPUT
          else
            echo "non_test_changes=true" >> $GITHUB_OUTPUT
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          echo "Non-test files:"
          echo "$NON_TEST_FILES"

  build:
    name: Build & Format Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: pr-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instruction Sync (Claude/Codex)
        run: bash scripts/check-instructions-sync.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build (warnings as errors)
        run: dotnet build Honua.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=false

      - name: Format Check
        run: dotnet format Honua.sln --verify-no-changes --verbosity diagnostic

  test-all:
    name: Test Suite (.NET + Python + JS)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90
    env:
      TESTCONTAINERS_RYUK_DISABLED: false
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ""
      HONUA_TEST_CONFIGURATION: Release
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim disk space for test suite
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          docker system df || true

          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          $SUDO rm -rf /usr/local/lib/android || true
          $SUDO rm -rf /opt/ghc || true
          $SUDO rm -rf /usr/share/swift || true
          $SUDO rm -rf /opt/hostedtoolcache/CodeQL || true

          docker system prune -af --volumes || true
          docker builder prune -af || true

          echo "Disk space after cleanup:"
          df -h
          docker system df || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tests/python/requirements.txt

      - name: Install Localstack CLI (awslocal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user awscli-local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Create Test Results Directory
        run: mkdir -p ./tests/TestResults

      - name: Pre-pull Docker images for faster tests
        run: |
          docker pull --quiet postgis/postgis:16-3.4-alpine || true
          docker pull --quiet postgis/postgis:18-3.6 || true

      - name: Start emulator containers (Azurite + Localstack)
        run: |
          docker compose -f .devcontainer/docker-compose.emulators.yml up -d --quiet-pull
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/4566) >/dev/null 2>&1 \
              && (echo > /dev/tcp/localhost/10000) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Emulators failed to start."
          docker compose -f .devcontainer/docker-compose.emulators.yml ps
          exit 1

      - name: Build .NET test binaries
        timeout-minutes: 20
        run: |
          dotnet build Honua.sln \
            --no-restore \
            --configuration Release \
            -m:1

      - name: Run .NET Tests (Core/Postgres)
        timeout-minutes: 20
        run: |
          dotnet test tests/Honua.Core.Tests/Honua.Core.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=core-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

          dotnet test tests/Honua.LoadTests/Honua.LoadTests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=load-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

          dotnet test tests/Honua.Postgres.Tests/Honua.Postgres.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=postgres-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

      - name: Run .NET Tests (Server - Core)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName!~Honua.Server.Tests.Features." \
            --logger "trx;LogFileName=server-tests-core.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1 \
            > ./tests/TestResults/server-tests-core.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-core-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-core.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Feature APIs)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Features.FeatureServer|FullyQualifiedName~Honua.Server.Tests.Features.OData|FullyQualifiedName~Honua.Server.Tests.Features.OgcFeatures|FullyQualifiedName~Honua.Server.Tests.Features.API" \
            --logger "trx;LogFileName=server-tests-feature-apis.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1 \
            > ./tests/TestResults/server-tests-feature-apis.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-feature-apis-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-feature-apis.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Map and Imagery)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Features.OgcMaps|FullyQualifiedName~Honua.Server.Tests.Features.OgcTiles|FullyQualifiedName~Honua.Server.Tests.Features.MapServer|FullyQualifiedName~Honua.Server.Tests.Features.ImageServer|FullyQualifiedName~Honua.Server.Tests.Features.GeometryService" \
            --logger "trx;LogFileName=server-tests-map-imagery.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1 \
            > ./tests/TestResults/server-tests-map-imagery.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-map-imagery-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-map-imagery.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Infra and Security)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Features.Infrastructure|FullyQualifiedName~Honua.Server.Tests.Features.Caching|FullyQualifiedName~Honua.Server.Tests.Features.Security|FullyQualifiedName~Honua.Server.Tests.Features.GeoservicesCatalog|FullyQualifiedName~Honua.Server.Tests.Features.FileStorage|FullyQualifiedName~Honua.Server.Tests.Features.Styling" \
            --logger "trx;LogFileName=server-tests-infra-security.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1 \
            > ./tests/TestResults/server-tests-infra-security.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-infra-security-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-infra-security.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Architecture)
        timeout-minutes: 10
        run: |
          dotnet test tests/Honua.Architecture.Tests/Honua.Architecture.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=architecture-tests.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            -- RunConfiguration.MaxCpuCount=1

      - name: Install GDAL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq gdal-bin
          ogrinfo --version

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/python/requirements.txt

      - name: Run Python Integration Tests (OGC + FeatureServer + GDAL)
        run: pytest --tb=short
        working-directory: tests/python

      - name: Install JavaScript test dependencies
        run: npm ci
        working-directory: tests/js

      - name: TypeScript type check (JavaScript tests)
        run: npm run typecheck
        working-directory: tests/js

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          name: all-test-results
          path: |
            tests/TestResults/
            tests/python/gdal-ogr-results*.json
            tests/python/stac-client-compat-results*.json
            tests/python/stac-client-compat-results*.md
          retention-days: 7

  js-integration-tests:
    name: JavaScript Integration Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Honua Server
        uses: ./.github/actions/setup-honua-server
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js/package-lock.json

      - name: Install JavaScript test dependencies
        run: npm ci
        working-directory: tests/js

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/js

      - name: Run JavaScript Integration Tests
        run: npm test
        working-directory: tests/js
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          HONUA_API_KEY: "ci-admin-password"

      - name: Run OpenLayers Rendering Test
        run: npx playwright test --config openlayers/rendering/playwright.config.ts
        working-directory: tests/js
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          HONUA_API_KEY: "ci-admin-password"

      - name: Upload OpenLayers Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openlayers-compat-results
          path: |
            tests/js/js-*.cert.json
            tests/js/certification-evidence/*.cert.json
          retention-days: 7

  maplibre-compat:
    name: MapLibre GL JS Browser Compatibility
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pyyaml
        shell: bash
        run: python -m pip install 'pyyaml>=6,<7'

      - name: Setup Honua Server
        uses: ./.github/actions/setup-honua-server
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          post-seed-yaml: tests/seed/browser-compat.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/js-browser/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests/js-browser

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/js-browser

      - name: Run MapLibre Browser Compatibility Tests
        run: npm test
        working-directory: tests/js-browser
        env:
          HONUA_BASE_URL: http://localhost:5000
          CI: 'true'

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maplibre-compat-results
          path: |
            tests/js-browser/test-results/
            tests/js-browser/playwright-report/
          retention-days: 14

  mcp-certification:
    name: MCP Certification (${{ matrix.transport }})
    if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    needs: [build, test-all, js-integration-tests, core-package-compatibility, postgres-compat]
    timeout-minutes: 15
    outputs:
      # Matrix job: GHA keeps the last-finishing leg's output.
      # Both legs check the same package.json so the value is always consistent.
      cert_ran: ${{ steps.setup.outputs.cert-available }}
    strategy:
      fail-fast: true
      matrix:
        transport: [grpc-web, rest]
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      # Design: skip-if-absent is intentional for cross-repo coordination.
      # Test code lives in honua-sdk-js; this repo provides only CI jobs,
      # seed data, and docs (AC 8). The action inspects package.json
      # BEFORE npm ci so the skip path cannot fail on missing deps.
      # See docs/contributor/mcp-certification.md.
      - name: Setup Honua MCP environment
        id: setup
        uses: ./.github/actions/setup-honua-mcp
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          sdk-ref: ${{ github.event.inputs.sdk_ref || env.MCP_SDK_REF }}

      - name: Report skipped certification
        if: steps.setup.outputs.cert-available != 'true'
        shell: bash
        run: |
          echo "::warning::test:certification script not found in honua-sdk-js/mcp — certification skipped"
          echo "## ⚠️ MCP Certification Skipped (${{ matrix.transport }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The \`test:certification\` script was not found in \`honua-sdk-js/mcp\` (ref: \`${{ github.event.inputs.sdk_ref || env.MCP_SDK_REF }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "**No certification tests were executed and no artifacts were produced.**" >> "$GITHUB_STEP_SUMMARY"
          echo "Land the certification scripts in \`honua-sdk-js\` to activate this gate." >> "$GITHUB_STEP_SUMMARY"

      - name: Warn if SDK ref is not pinned
        if: steps.setup.outputs.cert-available == 'true'
        shell: bash
        run: |
          REF="${{ github.event.inputs.sdk_ref || env.MCP_SDK_REF }}"
          if ! echo "$REF" | grep -qE '^[0-9a-f]{7,40}$|^v[0-9]'; then
            echo "::warning::MCP_SDK_REF ($REF) appears to be a branch name. Pin to a tag or commit SHA for reproducible release-evidence certification."
          fi

      - name: Run MCP Certification Tests
        if: steps.setup.outputs.cert-available == 'true'
        run: npm run test:certification
        working-directory: honua-sdk-js/mcp
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_TRANSPORT: ${{ matrix.transport }}
          HONUA_SERVICE_ID: test_service
          HONUA_MCP_SERVICE_ID: test_service_mcp
          HONUA_LAYER_ID: '0'
          HONUA_MCP_LAYER_ID: '10'
          HONUA_DEV_AUTH: "true"
          HONUA_API_KEY: "ci-admin-password"

      - name: Warn if certification ran without artifact support
        if: steps.setup.outputs.cert-available == 'true' && steps.setup.outputs.cert-artifact-available != 'true'
        shell: bash
        run: |
          echo "::warning::test:certification ran but test:certification:artifact is missing — no evidence artifacts will be produced. Land the artifact script in honua-sdk-js to satisfy the release-evidence contract."
          echo "## ⚠️ MCP Certification Artifacts Missing (${{ matrix.transport }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Certification tests **executed**, but the \`test:certification:artifact\` script was not found." >> "$GITHUB_STEP_SUMMARY"
          echo "**No JSON/Markdown evidence artifacts were produced.**" >> "$GITHUB_STEP_SUMMARY"
          echo "Land the artifact reporter in \`honua-sdk-js\` to produce release-grade evidence." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate certification artifact
        if: always() && steps.setup.outputs.cert-available == 'true' && steps.setup.outputs.cert-artifact-available == 'true'
        run: npm run test:certification:artifact
        working-directory: honua-sdk-js/mcp

      - name: Upload certification artifact
        if: always() && steps.setup.outputs.cert-available == 'true' && steps.setup.outputs.cert-artifact-available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mcp-certification-${{ matrix.transport }}
          path: |
            honua-sdk-js/mcp/mcp-certification-results.json
            honua-sdk-js/mcp/mcp-certification-results.md
          if-no-files-found: error
          retention-days: 30

  mcp-llm-smoke:
    name: MCP LLM Smoke Tests
    if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.mcp-certification.outputs.cert_ran == 'true' }}
    runs-on: ubuntu-latest
    needs: mcp-certification
    continue-on-error: true
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Honua MCP environment
        id: setup
        uses: ./.github/actions/setup-honua-mcp
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          sdk-ref: ${{ github.event.inputs.sdk_ref || env.MCP_SDK_REF }}

      - name: Report skipped smoke tests
        if: steps.setup.outputs.smoke-available != 'true'
        shell: bash
        run: |
          echo "::warning::test:llm-smoke script not found in honua-sdk-js/mcp — smoke tests skipped"
          echo "## ⚠️ MCP LLM Smoke Tests Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The \`test:llm-smoke\` script was not found in \`honua-sdk-js/mcp\` (ref: \`${{ github.event.inputs.sdk_ref || env.MCP_SDK_REF }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "Land the smoke test scripts in \`honua-sdk-js\` to activate this lane." >> "$GITHUB_STEP_SUMMARY"

      - name: Run MCP LLM Smoke Tests
        if: steps.setup.outputs.smoke-available == 'true'
        run: npm run test:llm-smoke
        working-directory: honua-sdk-js/mcp
        env:
          HONUA_BASE_URL: http://localhost:5000
          HONUA_TRANSPORT: rest
          HONUA_SERVICE_ID: test_service
          HONUA_LAYER_ID: '0'
          HONUA_DEV_AUTH: "true"
          HONUA_API_KEY: "ci-admin-password"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload LLM smoke transcripts
        if: always() && steps.setup.outputs.smoke-available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mcp-llm-smoke-transcripts
          path: |
            honua-sdk-js/mcp/llm-smoke-results.json
            honua-sdk-js/mcp/llm-smoke-results.md
            honua-sdk-js/mcp/llm-smoke-transcripts/
          if-no-files-found: warn
          retention-days: 30

  llm-architecture-review:
    name: LLM Architecture Review
    runs-on: ubuntu-latest
    needs: [build, test-all, aot-build]  # Run after core tests complete
    if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]' }}
    outputs:
      assessment: ${{ steps.llm-analysis.outputs.assessment }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        run: |
          # Get ALL changed files for comprehensive review (acceptance criteria, issue linking)
          ALL_CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})

          # Get C# files separately for architecture-specific analysis
          CS_CHANGED_FILES=$(echo "$ALL_CHANGED_FILES" | grep -E '\.(cs|csproj)$' || echo "")

          if [ -z "$ALL_CHANGED_FILES" ]; then
            echo "No files changed, skipping review"
            echo "skip_review=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$ALL_CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "cs_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CS_CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "skip_review=false" >> $GITHUB_OUTPUT

          # Show what we found
          echo "All changed files:"
          echo "$ALL_CHANGED_FILES"
          echo ""
          echo "C# files (for architecture analysis):"
          echo "$CS_CHANGED_FILES"

      - name: Setup Python
        if: steps.changed-files.outputs.skip_review == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        if: steps.changed-files.outputs.skip_review == 'false'
        run: |
          python -m pip install --upgrade pip
          # Only install OpenAI if API key is available
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            pip install openai
          fi

      - name: LLM Architecture Analysis
        if: steps.changed-files.outputs.skip_review == 'false'
        id: llm-analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_PR_NUMBER: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_CHUNK_LINES: 300
          REVIEW_MAX_FILES: 50
        run: |
          python scripts/architecture-review.py

      - name: Post Review Comment
        if: steps.changed-files.outputs.skip_review == 'false'
        uses: actions/github-script@v8
        env:
          ANALYSIS_OUTPUT: ${{ steps.llm-analysis.outputs.analysis }}
          ASSESSMENT_OUTPUT: ${{ steps.llm-analysis.outputs.assessment }}
        with:
          script: |
            const analysis = process.env.ANALYSIS_OUTPUT;
            const assessment = process.env.ASSESSMENT_OUTPUT;

            let assessmentIcon = '✅';
            let assessmentColor = 'green';
            if (assessment === 'NEEDS_ATTENTION') {
              assessmentIcon = '⚠️';
              assessmentColor = 'orange';
            } else if (assessment === 'BLOCKING_ISSUES') {
              assessmentIcon = '🚫';
              assessmentColor = 'red';
            }

            const body = `## 🤖 LLM Architecture Review

            ${assessmentIcon} **Assessment: ${assessment}**

            ${analysis}

            ---
            *Automated architectural analysis powered by OpenAI GPT-4*
            *This review focuses on architectural patterns and design decisions*
            *Human review still recommended for complex changes*`;

            // Check if we already have a review comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('🤖 LLM Architecture Review')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  postgres-compat:
    name: Postgres Compatibility (${{ matrix.pg_image }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: [build, test-all]
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        pg_image:
          - "postgis/postgis:16-3.4-alpine"   # Aurora PG 16.x baseline
          - "postgis/postgis:17-3.5-alpine"   # Azure Flex PG 17.x
          - "postgis/postgis:18-3.6"          # Latest self-hosted
    services:
      postgres:
        image: ${{ matrix.pg_image }}
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build
        run: dotnet build Honua.sln --configuration Release --no-restore

      - name: Run Postgres compatibility tests
        env:
          HONUA_TEST_DB_URL: "Host=localhost;Port=5432;Database=honua_test;Username=honua;Password=honua"
          HONUA_TEST_CONFIGURATION: Release
        run: |
          dotnet test tests/Honua.Postgres.Tests/Honua.Postgres.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=detailed"

  core-package-compatibility:
    name: Honua.Core Package Compatibility
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs: [build, test-all]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Build Honua.Core package
        run: |
          dotnet pack src/Honua.Core/Honua.Core.csproj --configuration Release --output ./packages --no-restore

      - name: Test package integration
        run: |
          mkdir -p package-test
          cd package-test
          dotnet new console

          # Add local package source
          PACKAGE_SOURCE="$(realpath ../packages)"
          dotnet nuget add source "$PACKAGE_SOURCE" --name local-packages

          # Add package under test
          VERSION=$(basename "$(ls ../packages/Honua.Core*.nupkg | head -1)" | sed -E 's/^Honua\.Core\.([0-9A-Za-z.-]+)\.nupkg$/\1/')
          dotnet add package Honua.Core --source "$PACKAGE_SOURCE" --version "$VERSION"

          # Test build
          dotnet build --configuration Release

      - name: Validate server compatibility
        run: |
          # Build server with SDK packages to ensure no conflicts
          dotnet build src/Honua.Server/Honua.Server.csproj --configuration Release --no-restore

  aot-build:
    name: AOT Build Verification
    if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.non_test_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes, test-all, js-integration-tests, core-package-compatibility, postgres-compat]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Honua.sln

      - name: Publish AOT
        run: |
          dotnet publish Honua.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            -p:PublishAot=true \
            -p:HonuaSkipAdminClientForAotVerification=true \
            -p:HonuaIncludeStacOpsDemo=false \
            -p:StripSymbols=true \
            -o ./publish
        working-directory: src/Honua.Server

      - name: Verify Binary Size
        run: |
          SIZE=$(stat --printf="%s" ./publish/Honua.Server 2>/dev/null || echo "0")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"

          # Warn if over 100MB (target from MVP_PLAN)
          if [ "$SIZE_MB" -gt 100 ]; then
            echo "::warning::AOT binary ${SIZE_MB}MB exceeds 100MB target"
          fi
        working-directory: src/Honua.Server

  docker-build:
    name: Docker Build & Integration Test
    if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && needs.changes.outputs.non_test_changes == 'true' }}
    runs-on: ubuntu-latest
    needs: [build, changes, test-all, js-integration-tests]
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: honua-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker container
        run: |
          docker run -d \
            --name honua-test \
            --network host \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Database=honua_test;Username=honua;Password=honua" \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e HONUA_ADMIN_PASSWORD=ci-docker-admin-password \
            -e Security__ConnectionEncryption__MasterKey="0123456789abcdef0123456789abcdef" \
            -p 8080:8080 \
            honua-server:test

          # Wait for container to start
          sleep 10

          # Health check
          live_success=false
          for i in {1..30}; do
            if curl -f http://localhost:8080/healthz/live; then
              echo "Container started successfully"
              live_success=true
              break
            fi
            sleep 2
          done

          if [ "$live_success" != "true" ]; then
            echo "Container failed liveness probe"
            exit 1
          fi

      - name: Test Docker container endpoints
        run: |
          # Test basic endpoints
          curl --retry 15 --retry-delay 2 --retry-connrefused -f http://localhost:8080/healthz/ready
          curl --retry 5 --retry-delay 2 --retry-connrefused -f http://localhost:8080/openapi.json

          # Test API endpoints
          curl -f "http://localhost:8080/api/admin/health" || true

      - name: Container logs
        if: always()
        run: docker logs honua-test

      - name: Cleanup
        if: always()
        run: |
          docker stop honua-test || true
          docker rm honua-test || true


  # Summary gate: a single job that branch-protection can require.
  # Add every job whose failure should block merge.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [pr-readiness, changes, build, test-all, aot-build, js-integration-tests, maplibre-compat, mcp-certification, core-package-compatibility, postgres-compat, docker-build, llm-architecture-review, architecture-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required CI jobs were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed."

  # Architecture gate job that blocks merge if LLM review finds blocking issues
  architecture-gate:
    name: Architecture Gate
    needs: llm-architecture-review
    runs-on: ubuntu-latest
    if: needs.llm-architecture-review.outputs.assessment == 'BLOCKING_ISSUES'
    steps:
      - name: Block PR on Architectural Violations
        run: |
          echo "::error::Architecture review found BLOCKING_ISSUES that must be resolved before merge."
          echo "::error::Please review the LLM Architecture Review comment and address all critical violations."
          echo "::error::Common blocking issues: dependency violations, controller usage, AOT incompatibility, missing docs."
          exit 1

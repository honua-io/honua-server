          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Import)
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Import." \
            --logger "trx;LogFileName=server-tests-import.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            > ./tests/TestResults/server-tests-import.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-import-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-import.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Performance)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Performance." \
            --logger "trx;LogFileName=server-tests-performance.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            > ./tests/TestResults/server-tests-performance.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-performance-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-performance.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Comprehensive)
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Comprehensive." \
            --logger "trx;LogFileName=server-tests-comprehensive.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            > ./tests/TestResults/server-tests-comprehensive.log 2>&1 &
          test_pid=$!

          while kill -0 "$test_pid" 2>/dev/null; do
            echo "[server-tests-comprehensive-heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') running"
            sleep 30
          done

          wait "$test_pid"
          test_exit_code=$?
          set -e

          cat ./tests/TestResults/server-tests-comprehensive.log
          exit "$test_exit_code"

      - name: Run .NET Tests (Server - Feature APIs)
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test tests/dotnet/Honua.Server.Tests/Honua.Server.Tests.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            --filter "FullyQualifiedName~Honua.Server.Tests.Features.FeatureServer|FullyQualifiedName~Honua.Server.Tests.Features.OData|FullyQualifiedName~Honua.Server.Tests.Features.OgcFeatures|FullyQualifiedName~Honua.Server.Tests.Features.API" \
            --logger "trx;LogFileName=server-tests-feature-apis.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./tests/TestResults \
            > ./tests/TestResults/server-tests-feature-apis.log 2>&1 &

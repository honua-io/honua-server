name: Real-Client Interop Matrix (Nightly)

# Tier: nightly. Non-PR-blocking. Promote to gating once 30 consecutive
# nightly passes are observed across all lanes (#806 design).
#
# Exercises Honua against the actual GIS clients customers use (QGIS, GDAL,
# OpenLayers, Cesium, ArcGIS Pro stub) via Docker harnesses under
# docker/client-compat/. CITE conformance suites prove spec compliance; this
# matrix proves real-client compatibility.

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC, before pyqgis-client-compat (07:30) and windows-client-compat (07:15)
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Comma-separated lane subset (default = all)'
        required: false
        default: 'gdal,pyqgis,openlayers,cesium,arcgis-stub'

permissions:
  contents: write   # baseline-diff job commits gap-report.md
  packages: read
  pull-requests: read

concurrency:
  group: client-interop-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve lane matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      lanes: ${{ steps.resolve.outputs.lanes }}
      client_lanes: ${{ steps.resolve.outputs.client_lanes }}
    steps:
      - name: Resolve lanes input
        id: resolve
        shell: bash
        env:
          LANES_INPUT: ${{ github.event.inputs.lanes }}
        run: |
          set -euo pipefail
          # Schedule and dispatch-with-empty-input default to the full matrix.
          default='gdal,pyqgis,openlayers,cesium,arcgis-stub'
          raw="${LANES_INPUT:-}"
          # Strip whitespace and trailing/leading commas.
          raw="${raw// /}"
          raw="${raw#,}"
          raw="${raw%,}"
          if [[ -z "$raw" ]]; then
            raw="$default"
          fi
          # Reject anything not in the known lane set so a typo can't silently
          # produce an empty matrix that "passes".
          allowed=$'gdal\npyqgis\nopenlayers\ncesium\narcgis-stub'
          IFS=',' read -ra requested <<<"$raw"
          for lane in "${requested[@]}"; do
            if ! grep -Fxq "$lane" <<<"$allowed"; then
              echo "::error::Unknown lane '$lane'; allowed: $(tr '\n' ',' <<<"$allowed" | sed 's/,$//')" >&2
              exit 1
            fi
          done
          json=$(jq -cn --arg lanes "$raw" '$lanes | split(",")')
          echo "lanes=$json" >> "$GITHUB_OUTPUT"
          echo "Resolved lane matrix: $json"

          # Map each requested lane to its client_lane value (the field on
          # .cert.json envelopes that the diff script keys on). The mapping
          # mirrors docs/gis/CROSS_CLIENT_CERTIFICATION_EVIDENCE.md and the
          # docker compose service names.
          declare -A LANE_TO_CLIENT_LANE=(
            [gdal]="cli"
            [pyqgis]="desktop-qgis"
            [openlayers]="js"
            [cesium]="js-cesium"
            [arcgis-stub]="arcgis-stub"
          )
          client_lanes=""
          for lane in "${requested[@]}"; do
            mapped="${LANE_TO_CLIENT_LANE[$lane]:-}"
            if [[ -z "$mapped" ]]; then
              echo "::error::No client_lane mapping for '$lane'; update LANE_TO_CLIENT_LANE in the prepare job." >&2
              exit 1
            fi
            if [[ -n "$client_lanes" ]]; then client_lanes+=","; fi
            client_lanes+="$mapped"
          done
          echo "client_lanes=$client_lanes" >> "$GITHUB_OUTPUT"
          echo "Resolved client_lanes filter: $client_lanes"

  matrix:
    name: ${{ matrix.lane }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.prepare.outputs.lanes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure docker BuildKit
        run: |
          mkdir -p ~/.docker
          echo '{ "features": { "buildkit": "true" } }' > ~/.docker/config.json

      - name: Cache docker buildx layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: client-compat-${{ matrix.lane }}-${{ hashFiles(format('docker/client-compat/{0}/**', matrix.lane)) }}
          restore-keys: |
            client-compat-${{ matrix.lane }}-

      - name: Build honua base image (pre-lane)
        id: prebuild
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p docker/client-compat/output/${{ matrix.lane }}

          DOCKER_BUILDKIT=1 docker build \
            --secret id=github_actor,env=GITHUB_ACTOR \
            --secret id=github_token,env=GITHUB_TOKEN \
            -t honua-server:client-compat \
            .
          build_exit=$?
          echo "build_exit=${build_exit}" >> "$GITHUB_OUTPUT"
          # Don't fail the step here so the SBOM step below still runs and
          # the lane-run step can record the build failure in lane evidence.
          exit 0

      # Generate an SPDX SBOM for the client-compat image immediately after
      # the docker build so nightly client interop runs always publish a
      # bill of materials artifact (audit gate A -> A+).
      - name: Generate SBOM (SPDX JSON) for honua-server:client-compat
        if: steps.prebuild.outputs.build_exit == '0'
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: honua-server:client-compat
          format: spdx-json
          output-file: sbom-honua-server-client-compat-${{ matrix.lane }}.spdx.json
          artifact-name: sbom-honua-server-client-compat-${{ matrix.lane }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Run lane against pre-built image
        id: run
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          PREBUILD_EXIT: ${{ steps.prebuild.outputs.build_exit }}
        run: |
          set +e
          build_exit="${PREBUILD_EXIT:-1}"

          if [[ "$build_exit" -eq 0 ]]; then
            docker compose -f docker/client-compat/compose.yml \
              --profile ${{ matrix.lane }} \
              build seed ${{ matrix.lane }}
            build_exit=$?
          fi

          if [[ "$build_exit" -ne 0 ]]; then
            exit_code="$build_exit"
          else
            lane_log="docker/client-compat/output/${{ matrix.lane }}/lane.log"
            docker compose -f docker/client-compat/compose.yml \
              --profile ${{ matrix.lane }} \
              run --no-build --rm \
              ${{ matrix.lane }} 2>&1 | tee "$lane_log"
            exit_code=${PIPESTATUS[0]}
            if [[ "$exit_code" -eq 0 ]]; then
              rm -f "$lane_log"
            fi
          fi

          if [[ "$exit_code" -ne 0 ]]; then
            {
              echo "lane=${{ matrix.lane }}"
              echo "exit_code=${exit_code}"
              echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > docker/client-compat/output/${{ matrix.lane }}/lane-exit-code.txt
            docker compose -f docker/client-compat/compose.yml \
              --profile ${{ matrix.lane }} \
              logs --no-color --tail=200 \
              postgres seed honua ${{ matrix.lane }} \
              > docker/client-compat/output/${{ matrix.lane }}/compose.log 2>&1 || true
          fi

          docker compose -f docker/client-compat/compose.yml down --remove-orphans || true
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          # Don't fail this job — baseline-diff is the regression gate.
          exit 0

      - name: Upload lane evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          kind: evidence
          suffix: client-compat-${{ matrix.lane }}
          path: docker/client-compat/output/${{ matrix.lane }}
          tier: nightly

      - name: Annotate failed lane
        if: steps.run.outputs.exit_code != '0'
        run: |
          echo "::warning::Lane ${{ matrix.lane }} exited with code ${{ steps.run.outputs.exit_code }}"

  baseline-diff:
    name: Baseline diff and gap report
    needs: [prepare, matrix]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # We push the gap report back when it changes.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download all lane artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: artifacts
          pattern: '*-client-compat-*'
          merge-multiple: false

      - name: Stage current-run envelopes
        shell: bash
        run: |
          mkdir -p docker/client-compat/output
          shopt -s nullglob

          # If download-artifact returned nothing, the diff step will report
          # 373 missing envelopes with no upstream context. Surface that root
          # cause here so the failing diff job log is self-diagnosing.
          if [[ -z "$(ls -A artifacts 2>/dev/null)" ]]; then
            echo "::error::No artifacts downloaded — every lane job either failed before producing an artifact, or download-artifact filtered them all out."
            exit 0
          fi

          empty_lanes=()
          # Each lane artifact lands in its own subdir; flatten to lane name.
          for dir in artifacts/*/; do
              name="$(basename "$dir")"
              # Derive lane from artifact suffix (suffix=client-compat-<lane>).
              lane="${name##*client-compat-}"
              if [[ -z "$lane" || "$lane" == "$name" ]]; then continue; fi
              mkdir -p "docker/client-compat/output/$lane"
              cp -r "$dir"* "docker/client-compat/output/$lane/" 2>/dev/null || true

              cert_count=$(find "docker/client-compat/output/$lane" -maxdepth 4 -name '*.cert.json' 2>/dev/null | wc -l)
              echo "::group::lane=$lane staged ($cert_count cert envelope(s))"
              ls -1 "docker/client-compat/output/$lane/" 2>/dev/null || true
              echo "::endgroup::"

              if [[ "$cert_count" -eq 0 ]]; then
                  empty_lanes+=("$lane")
                  echo "::warning title=Empty lane::lane '$lane' produced no .cert.json envelopes; the upstream lane job likely crashed before run.sh completed."
                  if [[ -f "docker/client-compat/output/$lane/lane-exit-code.txt" ]]; then
                      echo "::group::lane=$lane exit code"
                      cat "docker/client-compat/output/$lane/lane-exit-code.txt"
                      echo "::endgroup::"
                  fi
                  if [[ -f "docker/client-compat/output/$lane/compose.log" ]]; then
                      echo "::group::lane=$lane compose.log (tail 60)"
                      tail -n 60 "docker/client-compat/output/$lane/compose.log" 2>/dev/null || true
                      echo "::endgroup::"
                  fi
                  if [[ -f "docker/client-compat/output/$lane/lane.log" ]]; then
                      echo "::group::lane=$lane lane.log (tail 40)"
                      tail -n 40 "docker/client-compat/output/$lane/lane.log" 2>/dev/null || true
                      echo "::endgroup::"
                  fi
              fi
          done

          if (( ${#empty_lanes[@]} > 0 )); then
              echo "::error title=Empty lanes::${#empty_lanes[@]} lane(s) produced no envelopes: ${empty_lanes[*]}. See the per-lane groups above for compose/lane logs."
          fi

          find docker/client-compat/output -name '*.cert.json' -printf '%p\n' | sort

      - name: Compare against baselines and refresh gap report
        id: diff
        shell: bash
        env:
          CLIENT_LANES: ${{ needs.prepare.outputs.client_lanes }}
        run: |
          set +e
          # CLIENT_LANES carries the client_lane filter for the lanes that
          # actually ran; on a scheduled (full-matrix) run this equals every
          # client_lane in expected-pairs.json so the filter is a no-op.
          # On workflow_dispatch with a lane subset it scopes strict mode to
          # just the requested lanes — without it, diff-baselines.py would
          # treat every other baseline/expected-pair as a missing-envelope
          # failure.
          python3 scripts/client-compat/diff-baselines.py \
            --baselines tests/baselines/client-compat \
            --current docker/client-compat/output \
            --gap-report docs/gis/gap-report.md \
            --client-lanes "$CLIENT_LANES" \
            --strict
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit gap-report.md if changed
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/gis/gap-report.md; then
            echo "No gap-report changes."
            exit 0
          fi
          git add docs/gis/gap-report.md
          git commit -m "chore(client-compat): refresh nightly gap report

          Auto-generated by .github/workflows/client-interop-nightly.yml.
          Source baselines: tests/baselines/client-compat/."
          git push origin HEAD:trunk || \
            echo "::warning::Could not push gap-report; create a PR manually if needed."

      - name: Upload gap report
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          kind: evidence
          suffix: gap-report
          path: docs/gis/gap-report.md
          tier: nightly
          summary-file: docs/gis/gap-report.md

      - name: Fail on regressions
        if: steps.diff.outputs.exit_code != '0'
        run: |
          echo "::error::Client-interop matrix detected regressions; see docs/gis/gap-report.md"
          exit 1

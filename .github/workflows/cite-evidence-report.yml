name: CITE Evidence Report

# #2944: this workflow produces the only authoritative evidence behind the
# "952/952 across 11 CITE suites" claim in docs/cite-status.md, but it was
# workflow_dispatch-only — the per-suite cite-*-conformance.yml crons run
# weekly (Wed/Thu 06:00-07:30 UTC and the Mon/Tue/Fri/Sat legs) but never
# refresh this aggregate. Scheduled Friday 08:00 UTC, comfortably after the
# Wed/Thu legs. The "Assert CITE status freshness" step below is a secondary
# drift check: it fails the run (and, on schedule, opens/updates an issue) if
# docs/cite-status.md's "Last reviewed" date is more than 14 days old, so a
# regenerated-but-never-transcribed snapshot cannot silently go stale.
on:
  schedule:
    - cron: '0 8 * * 5' # Weekly Friday 08:00 UTC
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Publish the evidence bundle to GitHub Pages after the run'
        required: false
        type: boolean
        default: false
      server_image:
        description: 'Optional immutable candidate image (image@sha256:digest)'
        required: false
      source_sha:
        description: 'Full source SHA represented by server_image'
        required: false
      candidate_cut:
        description: 'RFC 3339 candidate cut timestamp'
        required: false
  workflow_call:
    inputs:
      publish_pages:
        required: false
        type: boolean
        default: false
      server_image:
        required: false
        type: string
      source_sha:
        required: false
        type: string
      candidate_cut:
        required: false
        type: string

permissions:
  contents: read
  packages: read
  actions: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: cite-evidence-report
  cancel-in-progress: false

jobs:
  evidence:
    name: Build CITE Evidence Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      actions: read
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for build cache
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify exact candidate image
        if: inputs.server_image != ''
        env:
          SERVER_IMAGE: ${{ inputs.server_image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SERVER_IMAGE" =~ ^ghcr\.io/honua-io/honua-server@sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::server_image must be the canonical lowercase immutable GHCR digest reference'; exit 1;
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::source_sha must be a full lowercase commit'; exit 1;
          }
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "$SERVER_IMAGE"
          docker tag "$SERVER_IMAGE" honua-server:latest
          revision="$(docker image inspect honua-server:latest --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$revision" == "$SOURCE_SHA" ]] || {
            echo '::error::candidate image revision label does not match source_sha'; exit 1;
          }
          docker image inspect honua-server:latest --format '{{json .RepoDigests}}' |
             jq -e --arg digest "${SERVER_IMAGE##*@}" 'any(.[]; endswith("@" + $digest))' >/dev/null || {
               echo '::error::pulled image inspection does not contain the requested digest'; exit 1;
             }

      - name: Build Honua Server image
        if: inputs.server_image == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: honua-server:latest
          build-args: |
            HONUA_GIT_SHA=${{ github.sha }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-jit-amd64
          cache-to: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-jit-amd64,mode=max
          # buildx defaults to attaching provenance/SBOM attestations, which
          # produce an OCI image index (manifest list). The docker exporter
          # used by `load: true` cannot export a manifest list, so the build
          # fails with "docker exporter does not currently support exporting
          # manifest lists". Disable inline attestations to keep a single-image
          # output that loads into the local daemon for the CITE run. The SPDX
          # SBOM is still captured by the anchore/sbom-action step below.
          provenance: false
          sbom: false

      # Bundle an SPDX SBOM into the CITE evidence package so the regulator-
      # facing report carries a reproducible component manifest.
      - name: Generate SBOM (SPDX JSON) for honua-server:latest
        uses: anchore/sbom-action@v0
        with:
          image: honua-server:latest
          format: spdx-json
          output-file: sbom-honua-server-cite-evidence.spdx.json
          artifact-name: sbom-honua-server-cite-evidence.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Install evidence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Run CITE suites
        id: run-cite
        env:
          HONUA_CITE_SKIP_BUILD: 'true'
          HONUA_CITE_SERVER_BUILD_MODE: ${{ inputs.server_image == '' && 'source-build' || 'prebuilt' }}
          HONUA_CITE_REQUESTED_SERVER_IMAGE: ${{ inputs.server_image }}
          HONUA_CITE_TESTED_GIT_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > cite-execution-started-at.txt
          exit_codes="$RUNNER_TEMP/cite-exit-codes.txt"
          : > "$exit_codes"

          run_suite() {
            local name="$1"
            local script="$2"
            local profile="$3"
            local exit_code=0

            echo "::group::$name"
            set +e
            "$script" --profile "$profile" --skip-build --verbose
            exit_code=$?
            set -e
            echo "::endgroup::"

            printf '%s=%s\n' "$name" "$exit_code" >> "$exit_codes"
          }

          run_suite "OGC API Features" ./scripts/conformance/cite/run-cite-tests.sh default
          run_suite "OGC API Tiles" ./scripts/conformance/cite/run-cite-tiles-tests.sh default
          run_suite "WFS 1.0" ./scripts/conformance/cite/run-cite-wfs10-tests.sh basic
          run_suite "WFS 1.1" ./scripts/conformance/cite/run-cite-wfs11-tests.sh basic
          run_suite "WFS 2.0" ./scripts/conformance/cite/run-cite-wfs20-tests.sh basic
          # WFS 2.0 transactional conformance classes (Transaction + LockFeature).
          # Writes to its own results dir so it coexists with the basic leg in the
          # evidence bundle instead of overwriting cite-wfs20-results. The env var
          # is exported (not an inline prefix) because run_suite is a bash function
          # and inline `VAR=x fn` does not export into a function's environment.
          export HONUA_CITE_WFS20_RESULTS_DIR=cite-wfs20-transactional-results
          run_suite "WFS 2.0 Transactional" ./scripts/conformance/cite/run-cite-wfs20-tests.sh transactional
          unset HONUA_CITE_WFS20_RESULTS_DIR
          run_suite "WMS 1.1.1" ./scripts/conformance/cite/run-cite-wms11-tests.sh default
          run_suite "WMS 1.3" ./scripts/conformance/cite/run-cite-wms-tests.sh default
          run_suite "WMTS 1.0" ./scripts/conformance/cite/run-cite-wmts-tests.sh default
          run_suite "WCS 2.0" ./scripts/conformance/cite/run-cite-wcs20-tests.sh core
          run_suite "WPS 2.0" ./scripts/conformance/cite/run-cite-wps20-tests.sh basic-async
          run_suite "GML 3.2" ./scripts/conformance/cite/run-cite-gml32-tests.sh applicable
          run_suite "GeoPackage 1.2" ./scripts/conformance/cite/run-cite-gpkg12-tests.sh applicable
          run_suite "KML 2.2" ./scripts/conformance/cite/run-cite-kml22-tests.sh applicable

          {
            echo 'exit_codes<<EOF'
            cat "$exit_codes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build static evidence bundle
        if: always()
        env:
          CITE_EVIDENCE_PUBLIC_BASE_URL: ${{ inputs.publish_pages && format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) || '' }}
          CITE_EVIDENCE_TESTED_GIT_SHA: ${{ inputs.source_sha || github.sha }}
          CITE_EVIDENCE_PRODUCER_GIT_SHA: ${{ github.sha }}
        run: |
          scripts/conformance/cite/build-cite-evidence.sh --output artifacts/cite-evidence
          cp cite-execution-started-at.txt artifacts/cite-evidence/execution-started-at.txt

      - name: Capture exact CITE suite versions
        if: always()
        run: >-
          python3 scripts/conformance/cite/capture_suite_provenance.py
          --output artifacts/cite-evidence/suite-provenance.json

      - name: Upload CITE evidence artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cite-conformance-evidence-${{ github.run_number }}
          path: artifacts/cite-evidence/
          retention-days: 90
          if-no-files-found: error

      - name: Append evidence summary
        if: always()
        run: |
          if [[ -f artifacts/cite-evidence/conformance-summary.md ]]; then
            cat artifacts/cite-evidence/conformance-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure GitHub Pages
        if: inputs.publish_pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: inputs.publish_pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/cite-evidence

      # Every failure branch must say WHICH condition tripped. The suite runners
      # interleave their own per-suite "Tests failed: 0" lines into this job's
      # log, so a bare non-zero exit here reads as "failed with zero failures".
      - name: Fail on conformance issues
        if: always()
        env:
          EXIT_CODES: ${{ steps.run-cite.outputs.exit_codes }}
        run: |
          set -euo pipefail

          codes="$RUNNER_TEMP/cite-exit-codes.txt"
          printf '%s\n' "$EXIT_CODES" | sed '/^$/d' > "$codes"
          if [[ ! -s "$codes" ]]; then
            echo "::error::CITE runners published no exit-code inventory; the suite step did not run to completion."
            exit 1
          fi
          malformed="$(grep -Ev '^[^=]+=[0-9]+$' "$codes" || true)"
          if [[ -n "$malformed" ]]; then
            echo "::error::CITE exit-code inventory has malformed entries: $(tr '\n' ' ' <<<"$malformed")"
            echo 'Full inventory:'
            cat "$codes"
            exit 1
          fi
          nonzero="$(grep -Ev '=0$' "$codes" || true)"
          if [[ -n "$nonzero" ]]; then
            echo "::error::CITE runner scripts exited non-zero: $(tr '\n' ' ' <<<"$nonzero")"
            echo 'Full inventory:'
            cat "$codes"
            exit 1
          fi

          summary=artifacts/cite-evidence/conformance-summary.json
          if [[ ! -f "$summary" ]]; then
            echo "::error::Every CITE runner exited 0 but $summary was not produced; conformance results are missing."
            exit 1
          fi
          # One jq pass emits the verdict, the totals, and exactly the suites
          # that fail the allPassed predicate in build-cite-evidence.sh. The
          # `blocking` filter is that predicate's exact negation, so the list
          # under the error can never come out empty.
          report="$RUNNER_TEMP/cite-verdict.txt"
          if ! jq -r '
                def blocking:
                  .status != "passed" or .totalTests == 0 or .passed != .totalTests
                  or .failed != 0 or .skipped != 0 or .cantTell != 0;
                "verdict=\(.totals.allPassed)",
                "totals=\(.totals.passed)/\(.totals.totalTests) tests across \(.totals.suites) suite(s); failed=\(.totals.failed) skipped=\(.totals.skipped) cantTell=\(.totals.cantTell)",
                (.suites[] | select(blocking)
                  | "  - \(.name): status=\(.status) total=\(.totalTests) passed=\(.passed) failed=\(.failed) skipped=\(.skipped) cantTell=\(.cantTell)")
              ' "$summary" > "$report"; then
            echo "::error::$summary is present but could not be read as a conformance summary."
            exit 1
          fi
          verdict="$(sed -n '1s/^verdict=//p' "$report")"
          totals="$(sed -n '2s/^totals=//p' "$report")"
          if [[ "$verdict" != true ]]; then
            echo "::error::CITE evidence reports at least one suite that is not fully passing ($totals)."
            if [[ "$(wc -l < "$report")" -gt 2 ]]; then
              echo 'Suites that block a clean report:'
              tail -n +3 "$report"
            else
              echo "No individual suite is blocking, so .totals.allPassed disagrees with .suites; inspect $summary."
            fi
            exit 1
          fi
          echo "All CITE suites passed: $totals."

      - name: Assert CITE status freshness
        if: always()
        run: scripts/ci/check-cite-status-freshness.sh docs/cite-status.md

      - name: Open/update issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'CITE Evidence Report: scheduled run failed or evidence is stale';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `## CITE Evidence Report Alert

            The weekly scheduled \`CITE Evidence Report\` run failed — either one or more CITE
            conformance suites regressed, or \`docs/cite-status.md\` has gone stale beyond the
            14-day freshness threshold (honua-server#2944).

            **Run**: ${runUrl}

            ## Acceptance Criteria

            - If a suite regressed: root-cause and fix the regression, then re-run this workflow.
            - If only the freshness check failed: refresh \`docs/cite-status.md\` from the latest
              passing evidence bundle and re-run this workflow to confirm it is fresh.

            This issue was created automatically by the CITE Evidence Report workflow.
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cite-evidence,automated'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Recurred: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cite-evidence', 'automated', 'high-priority']
              });
            }

  deploy-pages:
    name: Deploy CITE Evidence Pages
    needs: evidence
    if: inputs.publish_pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v5

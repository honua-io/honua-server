name: Review-first Evidence Ledger

on:
  workflow_dispatch:
  schedule:
    - cron: "31 13 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: review-first-evidence-ledger
  cancel-in-progress: true

jobs:
  audit:
    name: Audit immutable review-first observations
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted ledger policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - id: policy
        name: Bind the current review-first policy cohort
        run: |
          mkdir -p evidence
          node scripts/ci/review-first-evidence-ledger.js policy-digest \
            --root . \
            --policy-sha '${{ github.workflow_sha }}' \
            --github-output "${GITHUB_OUTPUT}"
          node scripts/ci/review-first-evidence-ledger.js retention-window \
            --policy .github/review-first-promotion.json \
            --output evidence/query-windows.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Validate review-first evidence fixtures
        run: scripts/ci/validate-review-first-dispatch.sh

      - name: Discover successful trusted Review Gate runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/run-query-pages evidence/run-query-batches \
            evidence/artifact-query-pages evidence/archives evidence/receipts
          tab="$(printf '\t')"
          maximum_run_pages="$(jq -er '.maximum_runs_per_partition / 100 | ceil' \
            evidence/query-windows.json)"
          [[ "${maximum_run_pages}" =~ ^[1-9][0-9]*$ ]] || exit 1
          jq -r '.partitions[] | [.index, .created_filter] | @tsv' \
            evidence/query-windows.json \
            | while IFS="${tab}" read -r partition created_filter; do
                [[ "${partition}" =~ ^[0-9]+$ ]] || exit 1
                partition_root="evidence/run-query-batches/${partition}"
                mkdir -p "${partition_root}"
                expected_total=''
                partition_complete=false
                page=1
                while (( page <= maximum_run_pages )); do
                  page_file="$(printf '%s/%03d.json' "${partition_root}" "${page}")"
                  gh api --method GET \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/review-gate.yml/runs" \
                    -f status=success \
                    -f "created=${created_filter}" \
                    -F per_page=100 \
                    -F page="${page}" \
                    > "${page_file}"
                  page_total="$(jq -er \
                    '.total_count | select(type == "number" and floor == . and . >= 0)' \
                    "${page_file}")"
                  page_count="$(jq -er '.workflow_runs | arrays | length' "${page_file}")"
                  [[ "${page_total}" =~ ^[0-9]+$ && "${page_count}" =~ ^[0-9]+$ ]] || exit 1
                  if (( page_total >= 1000 )); then
                    echo "workflow-run partition reached GitHub's search cap" >&2
                    exit 1
                  fi
                  if [[ -z "${expected_total}" ]]; then
                    expected_total="${page_total}"
                  elif [[ "${page_total}" != "${expected_total}" ]]; then
                    echo "workflow-run total changed during pagination" >&2
                    exit 1
                  fi
                  if (( page * 100 >= expected_total )); then
                    partition_complete=true
                    break
                  fi
                  if (( page_count != 100 )); then
                    echo "workflow-run partition ended before its declared total" >&2
                    exit 1
                  fi
                  page=$((page + 1))
                done
                if [[ "${partition_complete}" != true ]]; then
                  echo "workflow-run partition exceeded its bounded page budget" >&2
                  exit 1
                fi
                jq -s '.' "${partition_root}"/*.json \
                  > "evidence/run-query-pages/${partition}.json"
              done
          node scripts/ci/review-first-evidence-ledger.js combine-runs \
            --partitions evidence/query-windows.json \
            --pages evidence/run-query-pages \
            --output evidence/run-pages.json
          maximum_pages='${{ steps.policy.outputs.maximum_artifact_catalog_pages }}'
          [[ "${maximum_pages}" =~ ^[1-9][0-9]*$ ]] || exit 1
          expected_total=''
          catalog_complete=false
          page=1
          while (( page <= maximum_pages )); do
            page_file="$(printf 'evidence/artifact-query-pages/%03d.json' "${page}")"
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              -F per_page=100 \
              -F page="${page}" \
              > "${page_file}"
            page_total="$(jq -er '.total_count | select(type == "number" and floor == . and . >= 0)' \
              "${page_file}")"
            page_count="$(jq -er '.artifacts | arrays | length' "${page_file}")"
            [[ "${page_total}" =~ ^[0-9]+$ && "${page_count}" =~ ^[0-9]+$ ]] || exit 1
            if [[ -z "${expected_total}" ]]; then
              expected_total="${page_total}"
            elif [[ "${page_total}" != "${expected_total}" ]]; then
              echo "repository artifact total changed during pagination" >&2
              exit 1
            fi
            if (( page * 100 >= expected_total )); then
              catalog_complete=true
              break
            fi
            if (( page_count != 100 )); then
              echo "repository artifact catalog ended before its declared total" >&2
              exit 1
            fi
            page=$((page + 1))
          done
          if [[ "${catalog_complete}" != true ]]; then
            echo "repository artifact catalog exceeded the bounded page budget" >&2
            exit 1
          fi
          jq -s '.' evidence/artifact-query-pages/*.json > evidence/artifact-pages.json
          node scripts/ci/review-first-evidence-ledger.js discover \
            --runs evidence/run-pages.json \
            --catalog evidence/artifact-pages.json \
            --cutoff '${{ steps.policy.outputs.run_created_after }}' \
            --output evidence/index.json

      - name: Download only exact retained observation receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          maximum_downloads='${{ steps.policy.outputs.maximum_receipt_downloads }}'
          receipt_count="$(jq -er '.artifacts | arrays | length' evidence/index.json)"
          [[ "${maximum_downloads}" =~ ^[1-9][0-9]*$ && "${receipt_count}" =~ ^[0-9]+$ ]] || exit 1
          if (( receipt_count > maximum_downloads )); then
            echo "observation receipts exceeded the bounded download budget" >&2
            exit 1
          fi
          jq -r '.artifacts[].artifact_id' evidence/index.json \
            | while read -r artifact_id; do
                [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]] || exit 1
                gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                  > "evidence/archives/${artifact_id}.zip"
              done

      - name: Extract bounded observation receipts
        run: |
          node scripts/ci/review-first-evidence-ledger.js extract \
            --index evidence/index.json \
            --archives evidence/archives \
            --receipts evidence/receipts \
            --output evidence/extraction.json

      - id: ledger
        name: Replay production decisions and compute readiness
        continue-on-error: true
        run: |
          set +e
          node scripts/ci/review-first-evidence-ledger.js summarize \
            --index evidence/index.json \
            --extraction evidence/extraction.json \
            --receipts evidence/receipts \
            --policy .github/review-first-promotion.json \
            --policy-digest '${{ steps.policy.outputs.measurement_policy_digest }}' \
            --output evidence/ledger.json \
            --markdown evidence/ledger.md
          ledger_status=$?
          set -e
          if [[ -f evidence/ledger.md ]]; then
            cat evidence/ledger.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${ledger_status}"

      - name: Retain the report-only ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-first-evidence-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/run-pages.json
            evidence/query-windows.json
            evidence/run-query-pages
            evidence/run-query-batches
            evidence/artifact-pages.json
            evidence/artifact-query-pages
            evidence/index.json
            evidence/extraction.json
            evidence/ledger.json
            evidence/ledger.md
          retention-days: 30
          if-no-files-found: error

      - name: Fail closed on malformed trusted evidence
        if: steps.ledger.outcome != 'success'
        run: exit 1

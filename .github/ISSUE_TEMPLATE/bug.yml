name: Bug Report
description: Report a bug or regression with reproducible details
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please include enough detail for us to reproduce and fix the issue quickly.

  - type: textarea
    id: summary
    attributes:
      label: Problem Summary
      description: A concise summary of the bug.
    validations:
      required: true

  - type: textarea
    id: why-now
    attributes:
      label: Why This Matters Now
      description: What is the impact and urgency of this bug?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: |
        What must be true for this bug to be considered fixed?
        Use checkboxes for multiple criteria.
      placeholder: |
        - [ ] The endpoint returns 200 for valid requests
        - [ ] No regression in existing tests
    validations:
      required: true

  - type: dropdown
    id: affected-repos
    attributes:
      label: Affected Repo(s)
      description: Which repositories are affected?
      multiple: true
      options:
        - honua-server
        - honua-sdk-js
        - honua-sdk-dotnet
        - honua-admin
        - other
    validations:
      required: true

  - type: dropdown
    id: gate-tier-impact
    attributes:
      label: Gate Tier Impact
      description: Which CI tiers are affected by the fix? See docs/ci/gate-model.md.
      multiple: true
      options:
        - PR gates (build, test, governance)
        - Nightly gates (conformance, performance, security)
        - Release gates (packaging, publishing)
        - Deploy gates (promotion, post-apply)
        - None / unknown
    validations:
      required: true

  - type: dropdown
    id: release-deploy-impact
    attributes:
      label: Release/Deploy Impact
      description: Does the fix require special release or deployment handling?
      options:
        - None — standard merge-and-release
        - Requires coordinated release across repos
        - Requires database migration
        - Requires infrastructure changes
        - Requires hotfix / expedited release
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide runtime and client details so we can reproduce accurately.
      placeholder: |
        - Honua version/commit:
        - Deployment: (Docker, local, cloud)
        - OS:
        - Browser/client + version:
        - Database: (PostgreSQL/PostGIS version)
        - Any relevant config:
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Recordings
      description: Drag and drop screenshots, GIFs, or screen recordings here (or paste links).

  - type: textarea
    id: non-goals
    attributes:
      label: Non-Goals
      description: What is explicitly out of scope for this bug fix?

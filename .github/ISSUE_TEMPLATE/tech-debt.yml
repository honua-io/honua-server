name: Tech Debt
description: Technical debt or refactoring
labels: ["tech-debt"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be addressed?
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Justification
      description: Why is this important to address?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High - Blocking other work
        - Medium - Should address soon
        - Low - Address when convenient
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed Approach
      description: How should this be fixed?

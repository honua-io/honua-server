name: Feature Request
description: Propose a new feature or enhancement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing this. Focus on the problem and desired outcome so we can prioritize effectively.

  - type: textarea
    id: problem
    attributes:
      label: Problem Summary
      description: What is difficult, missing, or broken in your workflow today?
    validations:
      required: true

  - type: textarea
    id: why-now
    attributes:
      label: Why This Matters Now
      description: Why is this important to address at this point? What is the urgency or trigger?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: |
        What must be true for this feature to be considered complete?
        Use checkboxes for multiple criteria.
      placeholder: |
        - [ ] The new endpoint returns GeoJSON for valid requests
        - [ ] OpenAPI spec updated
        - [ ] Integration tests cover happy path and error cases
    validations:
      required: true

  - type: dropdown
    id: affected-repos
    attributes:
      label: Affected Repo(s)
      description: Which repositories need changes?
      multiple: true
      options:
        - honua-server
        - honua-sdk-js
        - honua-sdk-dotnet
        - honua-admin
        - other
    validations:
      required: true

  - type: dropdown
    id: gate-tier-impact
    attributes:
      label: Gate Tier Impact
      description: Which CI tiers will this feature affect? See docs/ci/gate-model.md.
      multiple: true
      options:
        - PR gates (build, test, governance)
        - Nightly gates (conformance, performance, security)
        - Release gates (packaging, publishing)
        - Deploy gates (promotion, post-apply)
        - None / unknown
    validations:
      required: true

  - type: dropdown
    id: release-deploy-impact
    attributes:
      label: Release/Deploy Impact
      description: Does this feature require special release or deployment handling?
      options:
        - None — standard merge-and-release
        - Requires coordinated release across repos
        - Requires database migration
        - Requires infrastructure changes
        - Requires environment variable or secret changes
    validations:
      required: true

  - type: textarea
    id: external-systems
    attributes:
      label: External Systems or Evidence Requirements
      description: Does this feature depend on or interact with external systems? What evidence is needed for validation?
      placeholder: |
        - OGC CITE conformance suite
        - External geocoding provider
        - Performance baseline comparison

  - type: textarea
    id: non-goals
    attributes:
      label: Non-Goals
      description: What is explicitly out of scope for this feature?
    validations:
      required: true

  - type: textarea
    id: follow-on-split
    attributes:
      label: Follow-on Split Guidance
      description: If this is too large for one issue, how should it be split?
      placeholder: |
        If this grows beyond a single PR, split along these lines:
        1. Core data model changes
        2. API endpoint implementation
        3. SDK client support

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this request?
      options:
        - P1 - Critical (blocking)
        - P2 - High
        - P3 - Medium
        - P4 - Low / nice to have
    validations:
      required: true

  - type: textarea
    id: proposed-approach
    attributes:
      label: Proposed Approach (optional)
      description: Share any ideas for implementation, API shape, or UX flow.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context (optional)
      description: Links, screenshots, logs, mockups, or references.

name: Feature / Feedback
description: Share product feedback, pain points, and feature requests
title: "feedback: "
labels: ["feedback", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing feedback. Focus on the problem and desired outcome so we can prioritize effectively.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult, missing, or broken in your workflow today?
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: What would success look like for you?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this request?
      options:
        - P1 - Critical (blocking)
        - P2 - High
        - P3 - Medium
        - P4 - Low / nice to have
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected and what is the impact if we do or do not implement this?
      placeholder: |
        - Impacted users:
        - Frequency:
        - Business/operational impact:
        - Workarounds:
    validations:
      required: true

  - type: textarea
    id: proposed-approach
    attributes:
      label: Proposed approach (optional)
      description: Share any ideas for implementation, API shape, or UX flow.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Links, screenshots, logs, mockups, or references.

# Codecov configuration for Honua Server
# Documentation: https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        base: auto
        branches:
          - trunk
        if_ci_failed: error

    patch:
      default:
        target: 70%
        threshold: 5%
        base: auto
        branches:
          - trunk
        if_ci_failed: error

  ignore:
    # Test projects
    - "tests/**/*"
    - "benchmarks/**/*"

    # Generated files
    - "**/*.Designer.cs"
    - "**/obj/**/*"
    - "**/bin/**/*"

    # Migrations and SQL scripts
    - "**/Migrations/**/*"
    - "**/*.sql"

    # Program entry points
    - "**/Program.cs"
    - "**/Startup.cs"

    # External dependencies
    - "**/Properties/AssemblyInfo.cs"
    - "**/*.g.cs"
    - "**/*.g.i.cs"

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes
  branches:
    - trunk

github_checks:
  annotations: true

flags:
  unit:
    paths:
      - tests/Honua.Core.Tests/
    carryforward: false

  integration:
    paths:
      - tests/Honua.Server.Tests/
      - tests/Honua.Postgres.Tests/
    carryforward: false

  architecture:
    paths:
      - tests/Honua.Architecture.Tests/
    carryforward: false

component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
      - type: patch
        target: 70%
  individual_components:
    - component_id: core
      name: Core Library
      paths:
        - src/Honua.Core/**/*

    - component_id: postgres
      name: PostgreSQL Implementation
      paths:
        - src/Honua.Postgres/**/*

    - component_id: server
      name: Web Server
      paths:
        - src/Honua.Server/**/*
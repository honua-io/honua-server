services:
  # PostgreSQL with PostGIS for development
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: honua_dev
      POSTGRES_USER: honua_user
      POSTGRES_PASSWORD: honua_password
      # Enable encryption at rest and security features
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --data-checksums"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      # Enable encryption and security features
      POSTGRESQL_CONF_ssl: "on"
      POSTGRESQL_CONF_password_encryption: "scram-sha-256"
      POSTGRESQL_CONF_log_connections: "on"
      POSTGRESQL_CONF_log_disconnections: "on"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honua_user -d honua_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Honua Server application
  honua:
    build:
      context: .
      args:
        HONUA_INCLUDE_STAC_OPS_DEMO: "true"
    ports:
      - "${HONUA_HTTP_PORT:-8080}:8080"
      - "${HONUA_GRPC_PORT:-8081}:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=honua_dev;Username=honua_user;Password=honua_password"
      ConnectionStrings__Redis: "${HONUA_REDIS_URL:-}"
      FileStorage__Provider: "${HONUA_STORAGE_PROVIDER:-Local}"
      FileStorage__AwsS3__BucketName: "${HONUA_S3_BUCKET:-}"
      FileStorage__AwsS3__Region: "${HONUA_S3_REGION:-us-east-1}"
      FileStorage__AwsS3__ServiceUrl: "${HONUA_S3_SERVICE_URL:-}"
      FileStorage__AwsS3__ForcePathStyle: "${HONUA_S3_FORCE_PATH_STYLE:-true}"
      FileStorage__AwsS3__AccessKeyId: "${HONUA_S3_ACCESS_KEY_ID:-}"
      FileStorage__AwsS3__SecretAccessKey: "${HONUA_S3_SECRET_ACCESS_KEY:-}"
      Security__ConnectionEncryption__MasterKey: "${HONUA_CONNECTION_ENCRYPTION_MASTER_KEY:-}"
      Security__ConnectionEncryption__Salt: "${HONUA_CONNECTION_ENCRYPTION_SALT:-}"
      Kestrel__Endpoints__Http__Url: "http://+:8080"
      Kestrel__Endpoints__Http__Protocols: "Http1"
      Kestrel__Endpoints__Grpc__Url: "http://+:8081"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # Security hardening
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Writable volumes for runtime data
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    volumes:
      - honua_logs:/tmp/honua-logs
      - honua_cache:/tmp/honua-cache
      - dotnet_diagnostics:/tmp/dotnet-diagnostics

  # Redis (optional)
  redis:
    image: redis:7-alpine
    profiles:
      - redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # MinIO (optional S3-compatible storage)
  minio:
    image: minio/minio:latest
    profiles:
      - minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  honua_logs:
  honua_cache:
  dotnet_diagnostics:
  redis_data:
  minio_data:

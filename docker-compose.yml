version: '3.8'

services:
  # PostgreSQL with PostGIS for development
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: honua_dev
      POSTGRES_USER: honua_user
      POSTGRES_PASSWORD: honua_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honua_user -d honua_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL with PostGIS for tests (opt-in)
  postgis-test:
    image: postgis/postgis:18-3.6
    profiles:
      - test
    environment:
      POSTGRES_DB: honua_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d honua_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Honua Server application
  honua:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=honua_dev;Username=honua_user;Password=honua_password"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # Security hardening
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Writable volumes for runtime data
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    volumes:
      - honua_logs:/tmp/honua-logs
      - honua_cache:/tmp/honua-cache
      - dotnet_diagnostics:/tmp/dotnet-diagnostics

volumes:
  postgres_data:
  postgres_test_data:
  honua_logs:
  honua_cache:
  dotnet_diagnostics:

# Development environment with PostgreSQL + PostGIS
services:
  # PostgreSQL with PostGIS extension
  postgres:
    image: postgis/postgis:16-3.4
    container_name: honua-postgres
    environment:
      POSTGRES_DB: honua_dev
      POSTGRES_USER: honua
      POSTGRES_PASSWORD: honua_dev_password
      # Enable PostGIS extensions
      POSTGRES_MULTIPLE_EXTENSIONS: postgis,postgis_topology,fuzzystrmatch,postgis_tiger_geocoder
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honua -d honua_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - honua-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: honua-redis
    profiles:
      - redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - honua-network

  # Honua Server image
  honua:
    image: ${HONUA_IMAGE:-honuaio/honua-server:latest}
    container_name: honua-server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Database connection
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=honua_dev;Username=honua;Password=honua_dev_password"
      # Redis connection (optional)
      ConnectionStrings__Redis: "${HONUA_REDIS_URL:-}"
      # S3-compatible storage (optional, use with MinIO profile)
      FileStorage__Provider: "${HONUA_STORAGE_PROVIDER:-Local}"
      FileStorage__AwsS3__BucketName: "${HONUA_S3_BUCKET:-honua-dev}"
      FileStorage__AwsS3__Region: "${HONUA_S3_REGION:-us-east-1}"
      FileStorage__AwsS3__ServiceUrl: "${HONUA_S3_SERVICE_URL:-http://minio:9000}"
      FileStorage__AwsS3__ForcePathStyle: "${HONUA_S3_FORCE_PATH_STYLE:-true}"
      FileStorage__AwsS3__AccessKeyId: "${HONUA_S3_ACCESS_KEY_ID:-minioadmin}"
      FileStorage__AwsS3__SecretAccessKey: "${HONUA_S3_SECRET_ACCESS_KEY:-minioadmin}"
      # Disable authentication for dev
      HONUA_DEV_AUTH: "true"
    ports:
      - "${HONUA_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - honua-network
    # Security hardening
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Writable volumes for runtime data
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    volumes:
      - honua_logs:/tmp/honua-logs
      - honua_cache:/tmp/honua-cache
      - dotnet_diagnostics:/tmp/dotnet-diagnostics

  # MinIO (optional S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: honua-minio
    profiles:
      - minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - honua-network

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: honua-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@honua.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - honua-network
    profiles:
      - admin

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  honua_logs:
  honua_cache:
  dotnet_diagnostics:
  minio_data:

networks:
  honua-network:
    driver: bridge

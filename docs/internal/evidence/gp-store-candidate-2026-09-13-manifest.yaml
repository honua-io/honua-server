# Platform manifest — the pinned, certified set of component versions for a platform release.
# A "Honua YYYY.N" release IS this file at a given tag. The release train writes/validates it;
# customers consume it to deploy/upgrade a coherent set.
#
# rc.1 snapshot: this is the candidate set frozen after the customer-demo release rescue, RE-PINNED
# to trunk on 2026-08-17 (honua-release#83) because the 2026-08-01 freeze had drifted up to 825
# commits behind on honua-server. Every source component below is pinned under the honua-release#102
# policy: the newest trunk commit whose own CI is green AND — for honua-server, whose artifact the
# train resolves as `image@digest` — which has a published, immutable multi-architecture AOT image,
# so the SHA the train certifies is exactly the artifact customers can deploy.
#
# WORKING-SNAPSHOT REFRESH 2026-08-27 (operator decision "refresh now"). THIS IS NOT THE RELEASE CUT.
# The 2026-08-21 freeze predated the truthful-identity / evidence-producer migrations (sdk-js#1521,
# sdk-python#213, sdk-dotnet#317, geospatial-grpc#91, geospatial-mcp#79+#80) and the honua-server
# harness-assignments file. Because evidence fragments are consumed only at PINNED revisions, a
# stale freeze mechanically reds the whole evidence-aggregation pipeline regardless of producer
# health. This refresh advances the working pins so aggregation can see the migrated producers.
#
# WHAT THIS REFRESH DELIBERATELY DOES NOT DO:
#   - It does NOT touch protocolCertification.ledger. The ledger rebind happens AFTER re-aggregation,
#     via tools/convergence_rebind.py's post-merge block (squash SHA -> honua-evidence aggregate.yml
#     -> then re-pin ledger.commit/requirementsSourceRevision/sha256). Binding a ledger here would
#     name bytes that do not exist yet.
#   - It does NOT advance any clientArtifacts.*.version or clientArtifacts.*.sourceSha. See the
#     clientArtifacts block for the per-artifact evidence.
#   - It does NOT re-read the honua-server derived values (contractVersions, dbSchema beyond the
#     migration-filename floor). Those were live-read against the 6b6d3b8 image; at this working
#     snapshot they are CARRIED FORWARD and explicitly marked un-re-verified. The release cut must
#     re-read them against the certified image rather than inherit this snapshot's values.
#
# PIN-POLICY DEVIATION DECLARED AT THIS REFRESH. The honua-release#102 policy is "newest trunk commit
# whose own CI is green". This refresh pins current trunk HEADs for the SDK/protocol components, so
# some of those are NOT green; every red lane is named at its component below rather than left
# implicit. honua-server does NOT deviate: it is pinned to the newest essentially-green imaged trunk
# sha (ac30266f) rather than the newest imaged one (4bd184a9), on the 2026-08-27 coordinator decision
# recorded in full at that component.
#
# honua-server re-pinned again on 2026-08-18, aa894e1 -> 6b6d3b8, to pick up honua-server
# #3347/#3349/#3352/#3353. At this re-pin the two policy conditions coincide with literal trunk HEAD,
# so there is NO pin-vs-HEAD gap to declare (the previous two pins had one). Every derived value on
# the honua-server entry — contract versions, admin major, dbSchema, both image digests — was
# RE-READ against this image rather than carried forward; see the evidence inline there.
#
# Conventions:
#   - version: the latest reachable release-tag semver if one exists; otherwise the literal
#     "pre-release" sentinel — the component is identified by its `sha`. Do not invent versions.
#   - sha: default-branch HEAD at snapshot time (branch noted where it isn't `trunk`).
#   - Source-declared (but un-released) versions from Chart.yaml/package.json are kept in comments
#     so signal isn't lost, but are NOT promoted to `version` until a release/tag exists.
#   - Experimental + disabled surfaces (ADR-0059) are held OUT of the certified `components` set and
#     listed under `experimental:` so rc.1's certified deploy set excludes them.

platformRelease: "2026.1-rc.2"         # calendar label; -rc.N until promoted
status: rc                             # draft | rc | released
snapshotDate: "2026-09-12"             # candidate re-pin: honua-sdk-dotnet 6ba49ec3, honua-sdk-python 40ecf731, geospatial-grpc 863b9b9e (honua-server, honua-sdk-js, geospatial-mcp unchanged)
snapshotKind: candidate-manifest-snapshot  # hand snapshot of trunk; replaced by train-generated manifest in Phase 2

# Producer-recorded dispatch identity. Release intake accepts candidates dispatched only from
# honua-server's protected default branch; tools/validate_platform.py --exact-candidate fails closed
# and names this ref when it is anything other than the literal `trunk`.
candidate:
  ref: "7ba422672e0c751843b17beb36e954a019cc19fb"
  refSource: "trunk"

# Pipeline-owned certification boundary. Dispatchers cannot replace the cut or ledger. `pending`
# deliberately blocks certification until honua-evidence publishes the exact-candidate ledger and
# this reviewed manifest pins its immutable commit and byte digest.
protocolCertification:
  # UTC timestamp of THIS working-snapshot refresh (2026-08-27 operator decision). The previous value
  # 2026-08-21T15:13:36Z was the completion time of honua-server release-bundle run 32496444220.
  # 2026-09-11 candidate re-pin (release#274): UTC time the re-pinned candidate set was frozen.
  candidateCutAt: "2026-09-11T19:47:41Z"
  # The source-test-host harness must certify the exact frozen honua-server candidate.
  # validate_platform.check_structure enforces byte-equality with components.honua-server.sha, so this
  # moves in lockstep with the server re-pin below and is not independently selectable.
  serverCertificationProducerSha: "7ba422672e0c751843b17beb36e954a019cc19fb"
  # NOT TOUCHED BY THIS REFRESH — DELIBERATELY STALE, AND SAID SO.
  # The ledger below is byte-frozen against the OLD candidate (e3ab87ce). Re-binding it requires
  # honua-evidence to re-aggregate at this PR's squash SHA first; the ordered procedure is
  # tools/convergence_rebind.py post_merge_commands(). Until that runs, the certification tier is
  # knowingly behind this manifest — that is the intended sequencing, not an oversight.
  ledger:
    status: bound
    repository: "honua-io/honua-evidence"
    commit: "c595f9d6c01e9e31aa46d460506950378f14ad85"
    requirementsSourceRevision: "47ec70604bb0db43b03f32dac1b114f1154bc2ca"
    path: "data/protocol-certification.v1.json"
    sha256: "sha256:a2c8ae757e1d8671f037873605985a0446d66d75e09936632ffa73148a2d58c7"

# Certified component set (experimental+disabled surfaces are excluded — see `experimental:` below).
components:
  honua-server:
    repository: "https://github.com/honua-io/honua-server"
    lifecycleStatus: GA
    version: "pre-release"             # no GitHub releases or tags; pinned by sha
    # PIN SELECTION POLICY (honua-release#102, applied by #109/#110): the newest trunk commit whose
    # own CI is GREEN **and** which has a published, immutable multi-arch AOT image. A sha with no
    # matching published image is not a usable pin — gate-artifact-consume, gate-security and
    # gate-upgrade all resolve `image@digest`, and the cloud tier mirrors that exact index into ECR.
    #
    # AT THIS RE-PIN THE TWO CONDITIONS COINCIDE WITH TRUNK HEAD — there is NO gap to declare, unlike
    # the previous two pins. 6b6d3b8 IS origin/trunk HEAD (2026-08-18T19:36:35Z), because the
    # nightly-container-build was dispatched against it right after it landed:
    #   $ git -C honua-server fetch origin && git rev-parse origin/trunk
    #   6b6d3b898f4abb6b34833d953b50d44f3d38c6c1
    #   $ gh api repos/honua-io/honua-server/actions/runs?head_sha=6b6d3b89... \
    #       -q '.workflow_runs[] | "\(.conclusion)\t\(.event)\t\(.name)"'
    #   success  workflow_dispatch  Nightly Container Build
    #   success  push               Trunk Sanity / Capability Matrix Aggregation / Notify honua-evidence
    #   success  dynamic            Code Quality: Push on trunk
    #   success  schedule           Merge Train [ordinary] (x4)
    #   skipped  issue_comment      Claude Review / Review Gate Attestation
    #
    # CI GREEN, verified on the pinned sha (the check the pin policy actually requires):
    #   $ gh api repos/honua-io/honua-server/commits/6b6d3b89.../check-runs?per_page=100 \
    #       -q '.check_runs[] | .conclusion' | sort | uniq -c
    #        21 success
    #         4 skipped
    #   (0 failure, 0 cancelled, 0 in-progress)
    #
    # HONEST CAVEAT ABOUT THE DEPTH OF THAT GREEN. honua-server's `ci.yml` shard suite runs on
    # pull_request and on the nightly schedule, NOT on push-to-trunk (ADR-0037), so a squash commit
    # that lands mid-day carries the trunk/push + container-publish lanes and not the ~470 shard
    # check-runs the previous pin (aa894e1) happened to inherit by being trunk HEAD when the nightly
    # fired. The PRs squashed into this range were therefore checked at their PR heads instead:
    #   $ for p in 3310 3347 3349 3352 3353; do
    #       h=$(gh api repos/honua-io/honua-server/pulls/$p -q .head.sha)
    #       gh api "repos/honua-io/honua-server/commits/$h/check-runs?per_page=100" \
    #         -q '.check_runs[] | select(.conclusion=="failure") | .name'; done
    #   Publish SHA-bound review attestation      (x2 per PR, all five PRs — and ONLY this lane)
    # That lane is honua-server's Review Gate attestation, which reds whenever no Codex/Claude
    # attesting reviewer is available; it runs no build or test and is already listed in
    # certification/governance-checks.yaml. Every product build/test/analysis lane on all five PR
    # heads is green.
    #
    # The range is FIVE commits, not the four that landed today — `git rev-list --count
    # aa894e1..6b6d3b8` = 5. honua-server#3310 landed after the last nightly-AOT publish and so was
    # never part of the aa894e1 pin:
    #   7b7889647  honua-server#3310  fix(publishing): persist package drafts (#3262, stacked #3264)
    #   43f9a13ca  honua-server#3347  fix(config): honour every Import:Limits key
    #   cc7165427  honua-server#3349  fix(capabilities): make the advertised-GA surface true
    #   9026a4101  honua-server#3352  migrate onto Geospatial.Grpc 0.2.0-alpha.1
    #   6b6d3b898  honua-server#3353  fix(telemetry): export the metric names alerts actually query
    # Two of them move something the certification tier reads, and both were chased down rather than
    # assumed:
    #   * #3310 is the ONLY commit in the range that touches src/Honua.Server/openapi.json
    #     (`git log aa894e1..6b6d3b8 -- src/Honua.Server/openapi.json` names it alone). The change is
    #     purely ADDITIVE — two new optional string properties, CollectionInfo.attribution and
    #     Link.hreflang — so contracts/baselines/2026.1/honua-server/openapi.json is re-extracted in
    #     this PR with those two additions and nothing removed. No SDK public-api.json moved.
    #   * #3349 changes an advertised CAPABILITY-ID set, not a contract version (see the
    #     contractVersions block below). The wire contract versions were re-read from this image and
    #     are unchanged.
    # ============================ 2026-08-27 WORKING-SNAPSHOT REFRESH ============================
    # e3ab87ce -> ac30266f. Everything in this block was resolved live on 2026-08-27, not carried over.
    #
    # PIN SELECTED FOR GREEN, NOT RECENCY — coordinator decision, 2026-08-27. This refresh first
    # proposed 4bd184a9 (2026-08-26, the NEWEST trunk sha with a published image) under a
    # "newest-with-an-image" rule. That was overridden in favour of the newest ESSENTIALLY GREEN
    # imaged sha, for a concrete reason rather than a stylistic one:
    #   * The evidence-pipeline purpose of this refresh is served IDENTICALLY by either sha. The file
    #     that motivated it, docs/gis/data/protocol-harness-assignments.v1.json, is not merely present
    #     at both — it is BYTE-IDENTICAL at both (blob d491adf1c51c, 11093 bytes at ac30266f and at
    #     4bd184a9). So recency buys nothing the pipeline can observe.
    #   * 4bd184a9 carried SIX real (non-governance) red lanes — .NET Foundation Tests, CI Gate,
    #     Test Suite Summary, CNG Conformance, Baseline diff and gap report, Validate normalization
    #     envelope — which would red gate_build_test fail-closed for zero corresponding benefit.
    # Choosing ac30266f therefore costs nothing and keeps the #102 "newest green trunk commit" policy
    # substantially intact, which the 4bd184a9 proposal would have broken.
    #
    # NOT TRUNK HEAD, AND NOT THE NEWEST IMAGE — both gaps declared rather than left to inference.
    # Trunk HEAD is 6aad1067 (2026-08-27T00:21:12Z, "train: merge #3494") and has NO published image
    # at all. ac30266f is 251 commits behind HEAD and is a clean ancestor of it:
    #   $ gh api repos/honua-io/honua-server/compare/ac30266f...6aad1067 -q .status
    #   ahead   (ahead_by=251, behind_by=0)
    #
    # WHY THE OLD PIN COULD NOT SIMPLY BE KEPT. e3ab87ce is NOT a trunk commit at all — it was built
    # by release-bundle.yml from the branch fix/2026.1-esri-defects and has 30 commits absent from
    # trunk (`compare/e3ab87ce...6aad1067` -> status=diverged, ahead=295, behind=30).
    #
    # IMAGE PROVENANCE — WHAT WAS AND WAS NOT PROVEN. Read this before treating the pin as attested.
    #   (a) The digest resolves to a real multi-arch index:
    #       $ docker buildx imagetools inspect ghcr.io/honua-io/honua-server:nightly-aot-ac30266
    #       MediaType: application/vnd.oci.image.index.v1+json
    #       Digest:    sha256:373aa1fdf1bd4153df9cb21e25e43dfc463c0e194fcac13b40a39c4bb390eb72
    #         linux/amd64 -> sha256:9aa0e5a6044a18015e0bf8bd9cfc9d74d22ff25f3dd15eff971669c7c7ff5012
    #         linux/arm64 -> sha256:f0104ea34172ac887208c910fdcf66ac7c266194a29f0628ebc45b0852fcd88e
    #         unknown/unknown x2 -> buildkit attestation manifests for the two children
    #   (b) The image is bound to THIS sha by its own config labels and by in-registry SLSA provenance
    #       (buildkit `provenance: true`, nightly-container-build.yml:198), not by tag convention:
    #       amd64 config label  org.opencontainers.image.revision = ac30266fbd1...
    #       SLSA externalParameters build-arg:HONUA_GIT_SHA = ac30266fbd1..., configSource Dockerfile.aot
    #   (c) THE FLOATING TAGS NO LONGER AGREE WITH THIS PIN, and that is expected for a deliberately
    #       non-newest sha. Only the date tag still resolves here; the rolling tags have moved on:
    #         :nightly-aot-20260823 -> sha256:373aa1fd...  (this pin)
    #         :nightly-aot          -> sha256:808b026d...  (4bd184a9, 2026-08-26)
    #       The pin therefore uses the IMMUTABLE per-sha tag and the digest, never a floating tag.
    #       An earlier revision of this block asserted "the floating tags agree" — true of the newest
    #       nightly only, and NOT true here; do not carry that claim forward.
    #   (d) HONEST GAP — `gh attestation verify` DOES NOT PASS FOR THIS IMAGE, and cannot:
    #       $ gh attestation verify oci://ghcr.io/honua-io/honua-server@sha256:373aa1fd... \
    #           --repo honua-io/honua-server
    #       HTTP 404 (no attestation registered for that subject digest)
    #       nightly-container-build.yml uses buildkit's in-registry attestations; it does NOT call
    #       actions/attest-build-provenance, so no Sigstore bundle reaches the GitHub attestations API.
    #       The ONLY honua-server image carrying a GitHub-API attestation is the outgoing rc-cert one:
    #       $ gh attestation verify oci://...@sha256:d7a45c87... --repo honua-io/honua-server  -> exit 0
    #         predicateType https://slsa.dev/provenance/v1
    #         buildSignerURI .../release-bundle.yml@refs/heads/fix/2026.1-esri-defects
    #         sourceRepositoryDigest e3ab87cebb7bf2d32c4e8cdb145f8d626b864d8e
    #       So NO trunk commit currently has a GitHub-attested image. Registry-level SLSA provenance is
    #       the strongest available binding for a nightly, and it is what (b) establishes. The release
    #       cut must publish through the attesting path before this becomes a certified pin.
    #
    # CI AT THIS PIN — GREEN OF EVERY PRODUCT LANE, with the one honest exception named:
    #   $ gh api --paginate .../commits/ac30266f.../check-runs -q '.check_runs[].conclusion' | sort | uniq -c
    #        420 success   217 skipped   118 failure   125 cancelled
    #   116 of the 118 failures are the governance/attestation lane that runs no build or test and is
    #   already listed in certification/governance-checks.yaml:
    #        116  Publish SHA-bound review attestation
    #   The remaining TWO are `Run Merge Train` — train plumbing, not a product build/test lane, but
    #   named here rather than folded into the excused count. ZERO product/conformance lanes fail at
    #   this sha, which is the property that motivated selecting it.
    #   (Cancelled: 115x the same attestation lane, 7x Prebuild repeated project / server, 3x
    #    Prebuild repeated project / geoservices.)
    # ==============================================================================================
    # FORWARD-MIGRATION REFRESH 2026-08-31: this immutable nightly is the newest published
    # multi-architecture AOT image and contains 107_AddRbacRoleTombstones.sql. The prior promoted
    # honua-2026.1 image is schema 106, so gate-upgrade must observe this exact 106 -> 107 edge.
    # ============================ 2026-09-11 CANDIDATE RE-PIN (release#274) ============================
    # 4ca8326 -> 7ba42267. The old pin could not certify: ci.yml never ran a full matrix on it, and
    # images older than server 679f637 crash at boot against the current Redis (gate_e2e/slice1,
    # exit 134, dry-run train 34636531439). 7ba42267 is the newest trunk sha carrying BOTH a
    # published multi-arch AOT image (scheduled Nightly Container Build run 34587617087, attested:
    # buildSignerURI nightly-container-build.yml@refs/heads/trunk, sourceRepositoryDigest 7ba42267)
    # AND a completed full ci.yml matrix (run 34582125299). Newer fully green shas (099bd98,
    # 4b37b2d) have no image; building one from a side branch would republish the floating and
    # dated nightly tags backwards, so they were not taken. 679f637 is an ancestor; 19 commits
    # separate this pin from trunk HEAD at re-pin time.
    # contractVersions below are CARRIED FORWARD and remain UNVERIFIED (release#282 item 4).
    sha: "7ba422672e0c751843b17beb36e954a019cc19fb"
    image: "ghcr.io/honua-io/honua-server:nightly-aot-7ba4226"   # immutable per-sha tag (NOT a floating tag)
    # index; children linux/amd64 sha256:08bc8e82…, linux/arm64 sha256:e4dda6fb…
    digest: "sha256:dd50cd81c057e37e73a6144572abdfc90d48de314d7625c54c4ef3b6eb65b0fd"
    # ARM64-ON-FARGATE EXCLUSION — CARRIED FORWARD, NOT RE-VERIFIED (honua-release#98).
    # The exclusion was established against the OLD pin (5cad074, index
    # sha256:7b3cffafebf481ca77d9576f7ee2d6d1a6e8e29a1752761763c4887e655467cd), whose ARM64 child
    # exited 139 before readiness on native Fargate. That finding has NOT been re-established against
    # this index's ARM64 child (sha256:f0104ea34172ac887208c910fdcf66ac7c266194a29f0628ebc45b0852fcd88e):
    # re-testing needs a live Fargate task, i.e. the cloud-parity tier, which cannot run today
    # (honua-release#79 / missing IAM OIDC-provider actions on the CI role). x86_64 is therefore
    # retained as the SAFE default — it is the architecture that was proven healthy — and the ARM64
    # question stays open in honua-release#98 rather than being silently resolved either way.
    awsEcsArchitecture: "x86_64"
    # GA target, qualification pending: Lambda x86_64 (aws-serverless).
    # 2026-09-06 ruling A: https://github.com/honua-io/honua-release/issues/282
    # Gate: live exact-digest deploy, serving smoke and teardown before candidate cut;
    # candidate-bound alias upgrade/rollback through the deploy backend before GA.
    # See compatibility-matrix.yaml and docs/2026.1-operating-envelope.md for limits.
    # Lambda requires a single-architecture image in same-region ECR. The cloud gate mirrors this
    # exact source manifest and verifies config/rootfs equality, recording ECR's own digest.
    # REFRESHED 2026-08-27. The outgoing pin borrowed the amd64 child of the main rc-cert index
    # because the release-bundle path builds no Lambda variant. The nightly path DOES, so this
    # returns to the per-arch Lambda tag discipline used by every pin before the rc-cert cut
    # (nightly-lambda-aot-<short7>-<arch>), now at x86_64 to match awsLambdaArchitecture:
    #   $ docker buildx imagetools inspect ghcr.io/honua-io/honua-server:nightly-lambda-aot-ac30266-amd64
    #   MediaType: application/vnd.oci.image.manifest.v1+json     <- single-arch, as Lambda requires
    #   Digest:    sha256:25c23ce39e5e8749d17e7636bdc0d9d655ac6f0a1bc529f418f7d704d65d827f
    # Bound to this sha and to the Lambda runtime shape by its own config, not by tag convention:
    #   architecture = amd64
    #   org.opencontainers.image.revision = ac30266fbd153363bebdbed13130accc8ab0c94a
    #   Entrypoint = ["/var/task/Honua.Server"]
    awsLambdaImage: "ghcr.io/honua-io/honua-server:nightly-lambda-aot-7ba4226-amd64"
    awsLambdaDigest: "sha256:6aa9b83d7fc96f48ebc821db2e8e0bfbd4b9bcca245150b38fc212a124d4056e"
    # ECR converts the OCI manifest to Docker schema 2 while preserving the exact config/rootfs, so
    # this digest is NOT derivable from GHCR and NOT reproducible with a stock registry (checked:
    # pushing the same image through registry:2 preserves sha256:7182e8b7…, whereas ECR turned that
    # same image into sha256:f1970f2a…). It is only knowable after a real mirror, which is why a
    # re-pin sets it to the documented `pending-ecr-mirror` sentinel and lets the cloud gate perform
    # one bootstrap round trip (honua-release#99).
    # PENDING FOR THIS PIN: release#282 item 4 requires a real candidate mirror. The cloud gate must mirror the exact GHCR
    # Lambda manifest into the release account and verify its config/rootfs before
    # recording ECR's registry-specific digest. Never carry a prior pin's value forward.
    awsLambdaEcrDigest: "pending-ecr-mirror"
    awsLambdaArchitecture: "x86_64"
    # release#282 item 4: all contract versions remain UNVERIFIED until re-read from the booted candidate.
    contractVersions:
      # !! CARRIED FORWARD AT THE 2026-08-27 REFRESH — NOT RE-READ AGAINST THE ac30266f IMAGE. !!
      # Every value in this block was live-read off a RUNNING 6b6d3b8 server (the transcripts below
      # are that read, and are retained as the provenance of the values, not as evidence about the
      # current pin). Reproducing it needs a booted image + postgres, which this working snapshot
      # does not do. 50 trunk commits separate 6b6d3b8 from ac30266f and any of them could have moved
      # an advertised contractVersion. Treat these as UNVERIFIED until the release cut re-reads them
      # against the certified image — the previous re-pin's own rule was "re-read, never carry
      # forward", and this refresh is knowingly not paying that cost.
      # admin/control-plane API is REAL and advertised at /api/v1/admin/capabilities
      # (src/Honua.Server/Features/Admin/AdminInfoEndpoints.cs: AdminApiMajor="v1", AdminApiMajorNumber=1).
      admin: v1
      # metadata surface advertised in the capabilities envelope as MetadataApiVersion
      # (MetadataV2Constants/MetadataV2Common.ApiVersion = "metadata.honua.io/v2alpha1";
      # MetadataSchemaVersion = "2.0.0-alpha.1").
      metadata: "metadata.honua.io/v2alpha1"   # schemaVersion 2.0.0-alpha.1
      # gRPC proto surface (proto package geospatial.v1; schema owned by geospatial-grpc). The
      # capability envelope lists the grpc/grpc-web/native-grpc transports without a contractVersion,
      # so this stays the proto-package major rather than a server-emitted rollup.
      grpc: v1
      # WIRED (honua-release#83, closes #32): the ADR-0058 registry surfaces
      # GeoServicesContract/OgcContract/StacContract .Version in the capability envelope, so these are
      # not v0 placeholders. Values below were READ FROM A RUNNING SERVER — THIS pin's image, run
      # locally against postgres via e2e/local-docker on 2026-08-18. They are NOT copied from source
      # constants and NOT carried forward from aa894e1; the whole read was repeated against this
      # image because honua-server#3349 landed in this range and does change the advertised surface:
      #   $ docker compose up -d   # HONUA_SERVER_IMAGE=ghcr.io/honua-io/honua-server@sha256:4fd2c1be…
      #   $ curl -s http://localhost:18080/api/v1/capabilities/manifest \
      #       | jq -c '.transports.items[] | select(.contractVersion) | {id, contractVersion}'
      #   {"id":"geoservices-rest","contractVersion":"1.0.0"}
      #   {"id":"ogc-http","contractVersion":"1.0.0"}
      #   {"id":"stac","contractVersion":"1.0.0"}
      #   $ curl -s http://localhost:18080/api/v1/capabilities/manifest | jq -c '.server'
      #   {"serverVersion":"1.0.0","apiVersion":"v1",
      #    "metadataApiVersion":"metadata.honua.io/v2alpha1","metadataSchemaVersion":"2.0.0-alpha.1",
      #    "deploymentEnvironment":"Development",
      #    "deploymentRevision":"6b6d3b898f4abb6b34833d953b50d44f3d38c6c1",
      #    "deploymentRevisionSource":"commit-sha",
      #    "serverRevision":"6b6d3b898f4abb6b34833d953b50d44f3d38c6c1"}
      # `deploymentRevision` proves the read came from exactly this pin. `admin: v1` was likewise
      # re-read live:

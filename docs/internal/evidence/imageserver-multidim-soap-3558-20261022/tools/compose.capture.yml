# Overlay for docker/client-compat/compose.yml (#3558 licensed capture).
# Publishes the fixture server on loopback only so ArcGIS Pro on the Windows
# host can reach it through tools/capture_proxy.py. PUBLIC_BASE_URL stays the
# in-network http://honua:5000 the seed publishers need; the proxy rewrites that
# origin in responses (--rewrite-origin). The fixture cannot be recreated in
# place: the client-compat seed creates raster tables outside the migration
# journal, so a restarted server refuses the database (SchemaExistsWithoutJournal).
services:
  honua:
    ports:
      - "127.0.0.1:${HONUA_3558_PORT:-18658}:5000"
    environment:
      HostValidation__AllowedHosts__2: 127.0.0.1

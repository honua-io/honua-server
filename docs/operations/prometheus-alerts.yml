# Prometheus alerting rules for Honua server production monitoring
# Place this in your prometheus configuration directory

groups:
  - name: honua.server.alerts
    rules:
      # Database Connection Pool Alerts
      - alert: HonuaDbPoolUtilizationHigh
        expr: honua_db_pool_utilization_ratio > 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Honua database connection pool utilization is high"
          description: "Database connection pool utilization is {{ $value | humanizePercentage }} for more than 5 minutes"
          runbook_url: "https://docs.honua.io/operations/runbook#database-connection-issues"

      - alert: HonuaDbPoolUtilizationCritical
        expr: honua_db_pool_utilization_ratio > 0.95
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Honua database connection pool nearly exhausted"
          description: "Database connection pool utilization is {{ $value | humanizePercentage }} - immediate action required"
          runbook_url: "https://docs.honua.io/operations/runbook#database-connection-issues"

      - alert: HonuaDbConnectionFailures
        expr: increase(honua_db_connection_acquisition_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Honua database connection acquisition failures detected"
          description: "{{ $value }} database connection failures in the last 5 minutes"
          runbook_url: "https://docs.honua.io/operations/runbook#database-connection-issues"

      # Cache Performance Alerts
      - alert: HonuaCacheHitRatioLow
        expr: honua_cache_hit_ratio < 0.8
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Honua cache hit ratio is low"
          description: "Cache hit ratio is {{ $value | humanizePercentage }} for more than 10 minutes"
          runbook_url: "https://docs.honua.io/operations/runbook#cache-performance-problems"

      - alert: HonuaCacheHitRatioCritical
        expr: honua_cache_hit_ratio < 0.5
        for: 5m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Honua cache hit ratio is critically low"
          description: "Cache hit ratio is {{ $value | humanizePercentage }} - performance severely impacted"
          runbook_url: "https://docs.honua.io/operations/runbook#cache-performance-problems"

      # Memory and Performance Alerts
      - alert: HonuaMemoryUsageHigh
        expr: honua_memory_usage_bytes > 1.5e9  # 1.5GB
        for: 10m
        labels:
          severity: warning
          component: memory
        annotations:
          summary: "Honua server memory usage is high"
          description: "Memory usage is {{ $value | humanizeBytes }} for more than 10 minutes"
          runbook_url: "https://docs.honua.io/operations/runbook#memory-and-gc-issues"

      - alert: HonuaMemoryUsageCritical
        expr: honua_memory_usage_bytes > 2e9  # 2GB
        for: 5m
        labels:
          severity: critical
          component: memory
        annotations:
          summary: "Honua server memory usage is critical"
          description: "Memory usage is {{ $value | humanizeBytes }} - potential OOM risk"
          runbook_url: "https://docs.honua.io/operations/runbook#memory-and-gc-issues"

      # Query Performance Alerts
      - alert: HonuaQueryLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(honua_query_duration_ms_bucket[5m])) by (le)) > 1000
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Honua query latency is high"
          description: "95th percentile query latency is {{ $value }}ms for more than 5 minutes"
          runbook_url: "https://docs.honua.io/operations/runbook#general-troubleshooting"

      - alert: HonuaQueryLatencyCritical
        expr: histogram_quantile(0.95, sum(rate(honua_query_duration_ms_bucket[5m])) by (le)) > 5000
        for: 2m
        labels:
          severity: critical
          component: performance
        annotations:
          summary: "Honua query latency is critical"
          description: "95th percentile query latency is {{ $value }}ms - severe performance degradation"
          runbook_url: "https://docs.honua.io/operations/runbook#general-troubleshooting"

      # Error Rate Alerts
      - alert: HonuaErrorRateHigh
        expr: rate(honua_errors_total[5m]) / rate(honua_queries_total[5m]) > 0.02
        for: 5m
        labels:
          severity: warning
          component: reliability
        annotations:
          summary: "Honua error rate is elevated"
          description: "Error rate is {{ $value | humanizePercentage }} for more than 5 minutes"
          runbook_url: "https://docs.honua.io/operations/runbook#general-troubleshooting"

      - alert: HonuaErrorRateCritical
        expr: rate(honua_errors_total[5m]) / rate(honua_queries_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          component: reliability
        annotations:
          summary: "Honua error rate is critical"
          description: "Error rate is {{ $value | humanizePercentage }} - immediate investigation required"
          runbook_url: "https://docs.honua.io/operations/runbook#general-troubleshooting"

      # Rate Limiting Alerts
      - alert: HonuaRateLimitViolationsHigh
        expr: increase(honua_rate_limit_violations_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          component: ratelimit
        annotations:
          summary: "High rate limiting violations detected"
          description: "{{ $value }} rate limit violations in the last 5 minutes"
          runbook_url: "https://docs.honua.io/operations/runbook#rate-limiting-violations"

      # File Upload Queue Alerts
      - alert: HonuaUploadQueueDepthHigh
        expr: honua_upload_queue_depth > 15
        for: 5m
        labels:
          severity: warning
          component: uploads
        annotations:
          summary: "Upload queue depth is high"
          description: "Upload queue depth is {{ $value }} for more than 5 minutes"
          runbook_url: "https://docs.honua.io/operations/runbook#file-upload-problems"

      - alert: HonuaUploadQueueFull
        expr: honua_upload_queue_depth >= 20  # Assuming max queue depth is 20
        for: 1m
        labels:
          severity: critical
          component: uploads
        annotations:
          summary: "Upload queue is full"
          description: "Upload queue is at maximum capacity - uploads will be rejected"
          runbook_url: "https://docs.honua.io/operations/runbook#file-upload-problems"

      # Service Health Alert
      - alert: HonuaServiceDown
        expr: up{job="honua-server"} == 0
        for: 1m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "Honua server is down"
          description: "Honua server instance {{ $labels.instance }} has been down for more than 1 minute"
          runbook_url: "https://docs.honua.io/operations/runbook#emergency-procedures"

      # Circuit Breaker Alerts (based on log analysis or custom metrics)
      - alert: HonuaCircuitBreakerOpen
        expr: increase(honua_circuit_breaker_state_changes_total{state="open"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: integration
        annotations:
          summary: "Circuit breaker opened for external service"
          description: "Circuit breaker for {{ $labels.service }} has opened - external integration degraded"
          runbook_url: "https://docs.honua.io/operations/runbook#circuit-breaker-incidents"

  # Redis-specific alerts (if using Redis for caching)
  - name: honua.redis.alerts
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis instance is down - cache functionality impacted"
          runbook_url: "https://docs.honua.io/operations/runbook#cache-performance-problems"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.honua.io/operations/runbook#cache-performance-problems"

      - alert: RedisLatencyHigh
        expr: redis_latency_percentiles_usec{quantile="0.99"} > 10000
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis latency is high"
          description: "99th percentile Redis latency is {{ $value }}μs"
          runbook_url: "https://docs.honua.io/operations/runbook#cache-performance-problems"
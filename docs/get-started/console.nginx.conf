# Console edge for the Compose quickstart: one HTTPS origin for the static Console
# bundle (/console/) and the serving API (everything else). Browser sign-in sessions,
# CSRF tokens and the OIDC callback need that shared HTTPS origin; plain HTTP is refused
# by the server. TLS ends here with a certificate the quickstart generated locally.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Cookies are per host: send 127.0.0.1 visitors to localhost, the registered callback host.
map $http_host $localhost_redirect {
    "~^127\.0\.0\.1(?<port>:[0-9]+)?$" "localhost$port";
    default "";
}

server {
    listen 8443 ssl;
    http2 on;
    server_tokens off;
    # Redirects stay relative: the container port is not the published one.
    absolute_redirect off;

    ssl_certificate /run/secrets/console_tls_certificate;
    ssl_certificate_key /run/secrets/console_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker's embedded DNS: re-resolve honua after the executor recreates it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $honua_upstream http://honua:8080;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    if ($localhost_redirect) {
        return 308 https://$localhost_redirect$request_uri;
    }

    location = / {
        return 302 /console/;
    }

    location = /console {
        return 301 /console/;
    }

    # Public deployment settings written by quickstart.py; never cached.
    location = /console/config.json {
        alias /etc/honua-console/config.json;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /console/index.html {
        root /srv;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # The stock MIME table has no .mjs/.cjs; browsers refuse modules sent as octet-stream.
    location ~ ^/console/.+\.(mjs|cjs)$ {
        root /srv;
        types { }
        default_type text/javascript;
        gzip_static on;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # Files with an extension are assets: a missing one is a 404, never the application page.
    location ~ ^/console/.+\.[A-Za-z0-9]+$ {
        root /srv;
        gzip_static on;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # Extensionless Console routes are application navigations.
    location /console/ {
        root /srv;
        try_files $uri /console/index.html;
    }

    location / {
        proxy_pass $honua_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Server-sent events and long uploads go straight through.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 0;
    }
}

# Container-local health probe; not published.
server {
    listen 127.0.0.1:8081;
    server_tokens off;
    root /srv;
    location = /healthz {
        default_type text/plain;
        try_files /console/index.html =503;
    }
}

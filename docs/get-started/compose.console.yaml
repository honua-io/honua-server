# Console is a static browser bundle (console/ in this package). The console service is
# an HTTPS edge that serves it at /console/ and forwards every other path to the serving
# API, so browser sign-in, CSRF and the OIDC callback share one origin.
services:
  honua:
    environment:
      Studio__EndUserAuthorization__Enabled: "true"
      # Trust the scheme and host only from the Console edge's fixed address.
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__ForwardLimit: "1"
      ForwardedHeaders__KnownProxies__0: ${HONUA_CONSOLE_EDGE_ADDRESS:-172.31.250.242}
      # Used when OIDC is enabled; register this exact URI with the identity provider.
      Oidc__AdminAuthCallbackUri: "https://localhost:${HONUA_CONSOLE_PORT:-18083}/admin/auth/callback"
    networks:
      default: {}
      # Both members have fixed addresses, so the server can never take the edge's.
      console-edge:
        ipv4_address: ${HONUA_CONSOLE_EDGE_SERVER_ADDRESS:-172.31.250.243}
  console:
    image: ${HONUA_CONSOLE_WEB_IMAGE:?The package image lock must include an immutable Console web image}
    profiles: [console]
    # Secret files are group-owned by gid 1001 (keyring-init); the web server runs as uid 101.
    group_add: ["1001"]
    ports:
      - "127.0.0.1:${HONUA_CONSOLE_PORT:-18083}:8443"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./console:/srv/console:ro
      - ./console.config.json:/etc/honua-console/config.json:ro
      - ./console.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [console_tls_certificate, console_tls_key]
    networks:
      console-edge:
        ipv4_address: ${HONUA_CONSOLE_EDGE_ADDRESS:-172.31.250.242}
    depends_on:
      honua:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:noexec,nosuid,size=20m

networks:
  # Only the Console edge and the serving API join this network.
  console-edge:
    ipam:
      config:
        - subnet: ${HONUA_CONSOLE_EDGE_SUBNET:-172.31.250.240/29}

secrets:
  console_tls_certificate:
    file: ./secrets/console_tls_certificate
  console_tls_key:
    file: ./secrets/console_tls_key

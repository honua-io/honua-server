# Console is a static bundle served by the serving API beneath /console/. Sharing the API
# origin keeps the server's session cookie and its /admin/auth/callback sign-in broker same-origin;
# there is no Console container. The package verified the bundle against its release digest.
services:
  honua:
    environment:
      Studio__EndUserAuthorization__Enabled: "true"
      Console__StaticRoot: /opt/honua/console
    volumes:
      - ./console:/opt/honua/console:ro

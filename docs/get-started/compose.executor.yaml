# Optional overlay for the quickstart Compose file. Copy it beside compose.yaml.
# The server service stays read-only and does not receive the Docker socket.
# The executor sidecar is the same server image and is the only service that mounts the socket.
# Compose merges sequences, so this file adds the socket volume to honua. An older Compose
# that replaces volumes instead of appending them must copy the honua volumes from compose.yaml
# into this file as well.
services:
  honua:
    environment:
      ControlPlane__ComposeExecutor__SocketPath: /run/honua-compose/executor.sock
      ControlPlane__ComposeExecutor__ReleaseImage: ${HONUA_RELEASE_IMAGE:?Set the immutable release digest}
      ControlPlane__PlatformRelease__ServingArtifactReference: ${HONUA_RELEASE_IMAGE:?Set the immutable release digest}
      ControlPlane__DeployTargets__0__TargetId: compose-local
      ControlPlane__DeployTargets__0__TargetKind: LocalCompose
      ControlPlane__DeployTargets__0__Backend: honua-compose
      ControlPlane__DeployTargets__0__Environment: local
      ControlPlane__DeployTargets__0__TargetName: honua
      ControlPlane__DeployTargets__0__RequiresApproval: "true"
      ControlPlane__DeployTargets__0__ArtifactReference: ${HONUA_RELEASE_IMAGE:?Set the immutable release digest}
    volumes:
      - compose-executor-socket:/run/honua-compose
  # A fresh named volume is root-owned. This one-shot command makes it writable by uid 1001
  # before the executor binds the socket. The Debian runtime image provides chown.
  compose-executor-init:
    image: ${HONUA_IMAGE:?Set the server image}
    user: "0:0"
    entrypoint: ["chown", "1001:1001", "/run/honua-compose"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - compose-executor-socket:/run/honua-compose
  compose-executor:
    image: ${HONUA_IMAGE:?Set the server image}
    user: "1001:1001"
    # Host docker group, so uid 1001 can use the mounted socket. `getent group docker` prints it.
    group_add:
      - "${DOCKER_GID:?Set the host docker group id}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      compose-executor-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:nosuid,size=100m
    environment:
      HONUA_COMPOSE_EXECUTOR: "true"
      ControlPlane__ComposeExecutor__SocketPath: /run/honua-compose/executor.sock
      ControlPlane__ComposeExecutor__ProjectDirectory: ${HONUA_COMPOSE_PROJECT_DIRECTORY:?Set the absolute host project directory}
      # docker compose ls names the project. The quickstart project name is the directory name.
      ControlPlane__ComposeExecutor__ProjectName: ${COMPOSE_PROJECT_NAME:?Set the Compose project name}
      ControlPlane__ComposeExecutor__ComposeFile: compose.yaml
      # Ordered files for later image changes. The override is appended after this list.
      ControlPlane__ComposeExecutor__ComposeFiles__0: compose.yaml
      ControlPlane__ComposeExecutor__ComposeFiles__1: compose.executor.yaml
      # Published prior images without a schema label require an operator-owned exact-image catalog.
      ControlPlane__ComposeExecutor__Revisions__0__Image: ${HONUA_PRIOR_IMAGE:?Set the immutable prior image}
      ControlPlane__ComposeExecutor__Revisions__0__MaxSchema: ${HONUA_PRIOR_MAX_SCHEMA:?Set the prior image shipped schema number}
      ControlPlane__ComposeExecutor__ServiceName: honua
      ControlPlane__ComposeExecutor__PostgresService: postgres
      ControlPlane__ComposeExecutor__DatabaseName: honua
      ControlPlane__ComposeExecutor__DatabaseUser: honua
      ControlPlane__ComposeExecutor__BackupDirectory: ${HONUA_COMPOSE_PROJECT_DIRECTORY:?Set the absolute host project directory}/backups
      ControlPlane__ComposeExecutor__HealthProbeUrl: http://honua:8080/healthz/ready
      # A route that returns a non-empty body proving the database is readable.
      ControlPlane__ComposeExecutor__CustomerProbeUrl: ${HONUA_COMPOSE_CUSTOMER_PROBE:?Set a customer readback URL}
      ControlPlane__ComposeExecutor__ReleaseImage: ${HONUA_RELEASE_IMAGE:?Set the immutable release digest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The published server image does not ship the Docker client. Mount the host binary.
      # It must run on the image's glibc. The honua service does not receive this mount.
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - ${DOCKER_COMPOSE_PLUGIN:?Set the host Compose plugin executable}:/usr/local/lib/docker/cli-plugins/docker-compose:ro
      # Identical host/container paths keep relative Compose bind mounts on the host project.
      - ${HONUA_COMPOSE_PROJECT_DIRECTORY:?Set the absolute host project directory}:${HONUA_COMPOSE_PROJECT_DIRECTORY:?Set the absolute host project directory}
      - compose-executor-socket:/run/honua-compose
volumes:
  compose-executor-socket:

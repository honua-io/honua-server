[pytest]
# Container-only certification lanes (geopandas_client, owslib_client,
# duckdb_client) are deliberately NOT listed here. `testpaths` applies only when
# pytest is invoked with no path argument, which is what the shared Python
# Integration Tests job does after installing requirements.txt. Those lanes
# cannot run there:
#
#   * duckdb_client/conftest.py imports `duckdb` at module scope, and that
#     package ships only in docker/client-compat/duckdb's own requirements, so
#     bare collection fails outright.
#   * all three hard-FAIL rather than skip when HONUA_*_BASE_URL is unset -- a
#     deliberate choice, because a certification lane that quietly declines to
#     run would publish an all-skip envelope that the baseline diff reads as
#     success.
#
# Each lane's runner passes its directory explicitly
# (docker/client-compat/<lane>/run.sh), so listing them here buys nothing and
# breaks every shared run.
testpaths = ogc_features feature_server gp_server image_server gdal_ogr stac_client pyqgis
            unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    integration: Integration tests requiring PostGIS and Honua server
    ogc: OGC API Features protocol tests
    featureserver: GeoServices REST/FeatureServer protocol tests
    gpserver: GeoServices REST/GPServer protocol tests
    imageserver: GeoServices REST/ImageServer protocol tests
    geometry: Geometry validation tests
    slow: Tests that take longer to execute
    smoke: Quick sanity check tests for PR builds
    gdal: GDAL/OGR interoperability tests (require gdal-bin)
    stac: STAC client compatibility tests using PySTAC and PySTAC-Client
    pyqgis: PyQGIS desktop client compatibility tests (require QGIS installation)
    geopandas_client: GeoPandas/pyogrio canonical analyst client lane (#3392)
    owslib_client: OWSLib canonical OGC client lane (#3392)
    duckdb_client: DuckDB Spatial canonical analyst client lane (#3392)
    cert: CERT-* certification case marker (argument: CERT-ID string)

# Async mode
asyncio_mode = auto

# Parallel execution settings
addopts = -v --tb=short

# Warning filters
filterwarnings =
    ignore:The @wait_container_is_ready decorator is deprecated.*:DeprecationWarning

# Timeout for long-running tests
timeout = 120

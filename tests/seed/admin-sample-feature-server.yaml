                  'updated_at', '2026-05-01T18:45:00Z'
              )
          ),
          (
              300101,
              3001,
              ST_Transform(
                  ST_SetSRID(
                      ST_GeomFromText('LINESTRING(-157.8583 21.3069, -157.8892 21.3189, -157.9225 21.3187)'),
                      4326),
                  3857),
              jsonb_build_object(
                  'objectid', 300101,
                  'name', 'Town to Airport Response Route',

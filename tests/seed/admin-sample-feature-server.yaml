              )
          ),
          (
              300003,
              3000,
              ST_SetSRID(ST_MakePoint(-157.7394, 21.3972), 4326),
              jsonb_build_object(
                  'objectid', 300003,
                  'name', 'Kailua Field Office',
                  'category', 'Field Office',
                  'status', 'online',
                  'priority', 3,
                  'owner', 'Customer Success',

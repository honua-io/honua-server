  - |
      SELECT setval(
          pg_get_serial_sequence('features', 'objectid'),
          (SELECT COALESCE(MAX(objectid), 0) FROM features)
      );

  - |
      SELECT setval(
          pg_get_serial_sequence('honua.layers', 'layer_id'),
          (SELECT COALESCE(MAX(layer_id), 0) FROM honua.layers)
      );

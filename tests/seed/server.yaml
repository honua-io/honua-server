version: 1
sql:
  - "CREATE SCHEMA IF NOT EXISTS honua;"
  - "CREATE SCHEMA IF NOT EXISTS honua_data;"
  - |
      CREATE TABLE IF NOT EXISTS honua.services (
          service_name VARCHAR(64) PRIMARY KEY,
          description TEXT NOT NULL DEFAULT '',
          srid INT NOT NULL DEFAULT 4326,
          supported_formats TEXT[] NOT NULL DEFAULT '{JSON,GeoJSON}',
          capabilities TEXT[] NOT NULL DEFAULT '{Query,Extract}',
          service_extent GEOMETRY,
          metadata JSONB,
          connection_id UUID,
          created_at TIMESTAMPTZ DEFAULT NOW(),
          updated_at TIMESTAMPTZ DEFAULT NOW()
      );
  - |
      CREATE TABLE IF NOT EXISTS honua.layers (
          layer_id SERIAL PRIMARY KEY,
          layer_name TEXT NOT NULL,
          description TEXT,
          table_schema TEXT NOT NULL DEFAULT current_schema(),
          table_name TEXT NOT NULL,
          primary_key_column TEXT NOT NULL DEFAULT 'objectid',
          geometry_column TEXT DEFAULT 'geometry',
          storage_srid INT,
          temporal_column TEXT,
          storage_options JSONB NOT NULL DEFAULT '{}'::jsonb,
          geometry_type TEXT NOT NULL,
          srid INT NOT NULL DEFAULT 4326,
          extent GEOMETRY(POLYGON, 4326),
          min_scale DOUBLE PRECISION,
          max_scale DOUBLE PRECISION,
          default_visibility BOOLEAN NOT NULL DEFAULT TRUE,
          enabled BOOLEAN NOT NULL DEFAULT TRUE,
          metadata JSONB,
          maplibre_style JSONB,
          geoservices_drawing_info JSONB,
          style_version INT DEFAULT 0,
          style_revised_at TIMESTAMPTZ,
          style_revised_by TEXT,
          style_change_summary TEXT,
          created_at TIMESTAMPTZ DEFAULT NOW(),
          CONSTRAINT layers_style_change_summary_length_check CHECK (style_change_summary IS NULL OR char_length(style_change_summary) <= 1000)
      );
  - "ALTER TABLE IF EXISTS honua.layers ADD COLUMN IF NOT EXISTS primary_key_column TEXT NOT NULL DEFAULT 'objectid';"
  - "ALTER TABLE IF EXISTS honua.layers ADD COLUMN IF NOT EXISTS geometry_column TEXT DEFAULT 'geometry';"
  - "ALTER TABLE IF EXISTS honua.layers ADD COLUMN IF NOT EXISTS storage_srid INT;"
  - "ALTER TABLE IF EXISTS honua.layers ADD COLUMN IF NOT EXISTS temporal_column TEXT;"
  - "ALTER TABLE IF EXISTS honua.layers ADD COLUMN IF NOT EXISTS storage_options JSONB NOT NULL DEFAULT '{}'::jsonb;"
  - "ALTER TABLE IF EXISTS honua.layers ADD COLUMN IF NOT EXISTS style_revised_at TIMESTAMPTZ;"
  - "ALTER TABLE IF EXISTS honua.layers ADD COLUMN IF NOT EXISTS style_revised_by TEXT;"
  - "ALTER TABLE IF EXISTS honua.layers ADD COLUMN IF NOT EXISTS style_change_summary TEXT;"
  - |
      CREATE TABLE IF NOT EXISTS honua.service_layers (
          service_name VARCHAR(64) NOT NULL REFERENCES honua.services(service_name) ON DELETE CASCADE,
          layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
          layer_order INT NOT NULL,
          PRIMARY KEY (service_name, layer_id),
          UNIQUE (service_name, layer_order)
      );
  - |
      CREATE TABLE IF NOT EXISTS honua.layer_fields (
          layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
          field_name VARCHAR(64) NOT NULL,
          field_type VARCHAR(32) NOT NULL,
          field_order INT NOT NULL,
          max_length INT,
          nullable BOOLEAN NOT NULL DEFAULT TRUE,
          default_value TEXT,
          description TEXT,
          domain JSONB,
          hidden BOOLEAN NOT NULL DEFAULT FALSE,
          PRIMARY KEY (layer_id, field_name)
      );
  - "ALTER TABLE IF EXISTS honua.layer_fields ADD COLUMN IF NOT EXISTS hidden BOOLEAN NOT NULL DEFAULT FALSE;"
  - |
      CREATE TABLE IF NOT EXISTS honua.analysis_content_items (
          item_id            TEXT        PRIMARY KEY,
          kind               TEXT        NOT NULL,
          name               TEXT        NOT NULL,
          title              TEXT        NULL,
          owner_id           TEXT        NULL,
          visibility         TEXT        NOT NULL DEFAULT 'organization',
          current_version    INT         NOT NULL,
          current_version_id TEXT        NOT NULL,
          lifecycle          TEXT        NOT NULL DEFAULT 'Active',
          created_at         TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          updated_at         TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          created_by         TEXT        NULL,
          CONSTRAINT analysis_content_items_kind CHECK (kind IN ('SavedQuery', 'AnalysisPackage')),
          CONSTRAINT analysis_content_items_lifecycle CHECK (lifecycle IN ('Active', 'Archived', 'Deleted')),
          CONSTRAINT analysis_content_items_version_positive CHECK (current_version > 0),
          CONSTRAINT analysis_content_items_name_not_empty CHECK (length(btrim(name)) > 0)
      );
  - "CREATE INDEX IF NOT EXISTS idx_analysis_content_items_kind_updated ON honua.analysis_content_items (kind, updated_at DESC, item_id);"
  - "CREATE INDEX IF NOT EXISTS idx_analysis_content_items_owner_updated ON honua.analysis_content_items (owner_id, updated_at DESC, item_id);"
  - |
      CREATE TABLE IF NOT EXISTS honua.analysis_content_versions (
          version_id    TEXT        PRIMARY KEY,
          item_id       TEXT        NOT NULL REFERENCES honua.analysis_content_items(item_id) ON DELETE CASCADE,
          version       INT         NOT NULL,
          kind          TEXT        NOT NULL,
          content_hash  TEXT        NOT NULL,
          created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          created_by    TEXT        NULL,
          version_body  JSONB       NOT NULL,
          CONSTRAINT analysis_content_versions_item_version UNIQUE (item_id, version),
          CONSTRAINT analysis_content_versions_kind CHECK (kind IN ('SavedQuery', 'AnalysisPackage')),
          CONSTRAINT analysis_content_versions_version_positive CHECK (version > 0)
      );
  - "CREATE INDEX IF NOT EXISTS idx_analysis_content_versions_item_created ON honua.analysis_content_versions (item_id, version DESC);"
  - "CREATE INDEX IF NOT EXISTS idx_analysis_content_versions_hash ON honua.analysis_content_versions (content_hash);"
  - |
      CREATE TABLE IF NOT EXISTS honua.analysis_result_artifacts (
          artifact_id       TEXT        PRIMARY KEY,
          result_package_id TEXT        NOT NULL,
          job_id            TEXT        NOT NULL,
          source_item_id    TEXT        NOT NULL,
          source_version    INT         NOT NULL,
          source_version_id TEXT        NOT NULL,
          kind              TEXT        NOT NULL,
          retention_state   TEXT        NOT NULL DEFAULT 'Retained',
          promotion_state   TEXT        NOT NULL DEFAULT 'None',
          created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          expires_at        TIMESTAMPTZ NULL,
          artifact_body     JSONB       NOT NULL,
          CONSTRAINT analysis_result_artifacts_source_version_positive CHECK (source_version > 0),
          CONSTRAINT analysis_result_artifacts_retention CHECK (retention_state IN ('Preview', 'Retained', 'Promoted', 'Expired')),
          CONSTRAINT analysis_result_artifacts_promotion CHECK (promotion_state IN ('None', 'Promoted'))
      );
  - "CREATE INDEX IF NOT EXISTS idx_analysis_result_artifacts_job_created ON honua.analysis_result_artifacts (job_id, created_at, artifact_id);"
  - "CREATE INDEX IF NOT EXISTS idx_analysis_result_artifacts_source ON honua.analysis_result_artifacts (source_item_id, source_version, artifact_id);"
  - "CREATE INDEX IF NOT EXISTS idx_analysis_result_artifacts_retention ON honua.analysis_result_artifacts (retention_state, expires_at);"
  - |
      CREATE TABLE IF NOT EXISTS honua.relationships (
          id SERIAL PRIMARY KEY,
          layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
          relationship_id INT NOT NULL,
          name TEXT NOT NULL,
          related_layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
          relationship_type TEXT NOT NULL,
          origin_foreign_key TEXT NOT NULL,
          destination_foreign_key TEXT NOT NULL,
          description TEXT,
          created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
          updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
          CONSTRAINT relationships_layer_relationship_unique UNIQUE(layer_id, relationship_id),
          CONSTRAINT relationships_valid_ids CHECK(layer_id >= 0 AND related_layer_id >= 0 AND relationship_id > 0),
          CONSTRAINT relationships_valid_fields CHECK(
              LENGTH(name) > 0 AND LENGTH(name) <= 128 AND
              LENGTH(relationship_type) > 0 AND LENGTH(relationship_type) <= 64 AND
              LENGTH(origin_foreign_key) > 0 AND LENGTH(origin_foreign_key) <= 128 AND
              LENGTH(destination_foreign_key) > 0 AND LENGTH(destination_foreign_key) <= 128
          ),
          CONSTRAINT relationships_valid_type CHECK(
              relationship_type IN ('esriRelRoleOrigin', 'esriRelRoleDestination', 'esriRelRoleAny')
          )
      );
  - |
      CREATE TABLE IF NOT EXISTS honua.raster_data (
          id BIGSERIAL PRIMARY KEY,
          layer_id INTEGER NOT NULL,
          name VARCHAR(255) NOT NULL,
          description TEXT,
          raster raster NOT NULL,
          acquisition_date TIMESTAMPTZ,
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          updated_at TIMESTAMPTZ,
          width INTEGER GENERATED ALWAYS AS (ST_Width(raster)) STORED,
          height INTEGER GENERATED ALWAYS AS (ST_Height(raster)) STORED,
          band_count INTEGER GENERATED ALWAYS AS (ST_NumBands(raster)) STORED,
          pixel_type VARCHAR(10) GENERATED ALWAYS AS (ST_BandPixelType(raster, 1)) STORED,
          srid INTEGER GENERATED ALWAYS AS (ST_SRID(raster)) STORED,
          CONSTRAINT raster_data_layer_id_fk FOREIGN KEY (layer_id) REFERENCES honua.layers(layer_id) ON DELETE CASCADE
      );
  - "CREATE INDEX IF NOT EXISTS idx_raster_data_layer_id ON honua.raster_data(layer_id);"
  - "CREATE INDEX IF NOT EXISTS idx_raster_data_layer_id_id ON honua.raster_data(layer_id, id);"
  - "CREATE INDEX IF NOT EXISTS idx_raster_data_acquisition_date ON honua.raster_data(acquisition_date);"
  - "CREATE INDEX IF NOT EXISTS idx_raster_data_layer_acquisition ON honua.raster_data(layer_id, acquisition_date DESC, created_at DESC, id DESC);"
  - "CREATE INDEX IF NOT EXISTS idx_raster_data_raster_gist ON honua.raster_data USING GIST (ST_ConvexHull(raster));"
  - "CREATE INDEX IF NOT EXISTS idx_raster_data_envelope ON honua.raster_data USING GIST (ST_Envelope(raster));"
  - |
      CREATE TABLE IF NOT EXISTS honua.raster_statistics (
          id BIGSERIAL PRIMARY KEY,
          raster_data_id BIGINT NOT NULL,
          band_number INTEGER NOT NULL,
          min_value DOUBLE PRECISION,
          max_value DOUBLE PRECISION,
          mean_value DOUBLE PRECISION,
          std_dev DOUBLE PRECISION,
          valid_pixel_count BIGINT,
          nodata_pixel_count BIGINT,
          computed_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          CONSTRAINT raster_statistics_raster_data_id_fk FOREIGN KEY (raster_data_id) REFERENCES honua.raster_data(id) ON DELETE CASCADE,
          CONSTRAINT raster_statistics_unique_band UNIQUE (raster_data_id, band_number)
      );
  - "CREATE INDEX IF NOT EXISTS idx_raster_statistics_raster_data_id ON honua.raster_statistics(raster_data_id);"
  - |
      CREATE TABLE IF NOT EXISTS honua.raster_tiles (
          id BIGSERIAL PRIMARY KEY,
          raster_data_id BIGINT NOT NULL,
          zoom_level INTEGER NOT NULL,
          tile_x INTEGER NOT NULL,
          tile_y INTEGER NOT NULL,
          tile_data BYTEA NOT NULL,
          content_type VARCHAR(50) NOT NULL DEFAULT 'image/png',
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          CONSTRAINT raster_tiles_raster_data_id_fk FOREIGN KEY (raster_data_id) REFERENCES honua.raster_data(id) ON DELETE CASCADE,
          CONSTRAINT raster_tiles_unique_tile UNIQUE (raster_data_id, zoom_level, tile_x, tile_y)
      );
  - "CREATE INDEX IF NOT EXISTS idx_raster_tiles_lookup ON honua.raster_tiles(raster_data_id, zoom_level, tile_x, tile_y);"
  - |
      CREATE TABLE IF NOT EXISTS honua.cloud_raster_catalog (
          id              BIGSERIAL PRIMARY KEY,
          layer_id        INTEGER NOT NULL,
          name            VARCHAR(255) NOT NULL,
          description     TEXT,
          provider        VARCHAR(50) NOT NULL,
          bucket          VARCHAR(255) NOT NULL,
          object_key      VARCHAR(1024) NOT NULL,
          width           INTEGER,
          height          INTEGER,
          band_count      INTEGER,
          pixel_type      VARCHAR(10),
          srid            INTEGER,
          compression     VARCHAR(50),
          tile_width      INTEGER,
          tile_height     INTEGER,
          overview_levels JSONB,
          extent_xmin     DOUBLE PRECISION,
          extent_ymin     DOUBLE PRECISION,
          extent_xmax     DOUBLE PRECISION,
          extent_ymax     DOUBLE PRECISION,
          ifd_cache       BYTEA,
          metadata_scanned_at TIMESTAMPTZ,
          created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          updated_at      TIMESTAMPTZ,
          CONSTRAINT fk_cloud_raster_layer FOREIGN KEY (layer_id)
              REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
          CONSTRAINT uq_cloud_raster_object UNIQUE (layer_id, provider, bucket, object_key)
      );
  - "CREATE INDEX IF NOT EXISTS idx_cloud_raster_layer ON honua.cloud_raster_catalog(layer_id);"
  - |
      CREATE OR REPLACE FUNCTION honua.update_cloud_raster_catalog_updated_at()
      RETURNS TRIGGER AS $$
      BEGIN
          NEW.updated_at = NOW();
          RETURN NEW;
      END;
      $$ LANGUAGE plpgsql;
  - "DROP TRIGGER IF EXISTS trg_cloud_raster_catalog_updated_at ON honua.cloud_raster_catalog;"
  - |
      CREATE TRIGGER trg_cloud_raster_catalog_updated_at
          BEFORE UPDATE ON honua.cloud_raster_catalog
          FOR EACH ROW
          EXECUTE FUNCTION honua.update_cloud_raster_catalog_updated_at();
  - |
      CREATE TABLE IF NOT EXISTS honua.multidim_coverage_catalog (
          id                  BIGSERIAL PRIMARY KEY,
          layer_id            INTEGER NOT NULL,
          name                VARCHAR(255) NOT NULL,
          description         TEXT,
          format              VARCHAR(50) NOT NULL,
          provider            VARCHAR(50) NOT NULL,
          bucket              VARCHAR(255) NOT NULL,
          object_key          VARCHAR(1024) NOT NULL,
          variables           JSONB NOT NULL DEFAULT '[]'::jsonb,
          metadata            JSONB,
          metadata_scanned_at TIMESTAMPTZ,
          created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          updated_at          TIMESTAMPTZ,
          CONSTRAINT fk_multidim_coverage_layer FOREIGN KEY (layer_id)
              REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
          CONSTRAINT uq_multidim_coverage_object UNIQUE (layer_id, provider, bucket, object_key),
          CONSTRAINT ck_multidim_coverage_format
              CHECK (format IN ('CloudOptimizedHdf5', 'NetCdf4'))
      );
  - "CREATE INDEX IF NOT EXISTS idx_multidim_coverage_layer ON honua.multidim_coverage_catalog(layer_id);"
  - |
      CREATE OR REPLACE FUNCTION honua.update_multidim_coverage_catalog_updated_at()
      RETURNS TRIGGER AS $$
      BEGIN
          NEW.updated_at = NOW();
          RETURN NEW;
      END;
      $$ LANGUAGE plpgsql;
  - "DROP TRIGGER IF EXISTS trg_multidim_coverage_catalog_updated_at ON honua.multidim_coverage_catalog;"
  - |
      CREATE TRIGGER trg_multidim_coverage_catalog_updated_at
          BEFORE UPDATE ON honua.multidim_coverage_catalog
          FOR EACH ROW
          EXECUTE FUNCTION honua.update_multidim_coverage_catalog_updated_at();
  - |
      CREATE TABLE IF NOT EXISTS honua.attachments (
          id BIGSERIAL PRIMARY KEY,
          feature_id BIGINT NOT NULL,
          layer_id INT NOT NULL,
          filename TEXT NOT NULL,
          content_type TEXT NOT NULL,
          size BIGINT NOT NULL CHECK (size >= 0),
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          storage_path TEXT NOT NULL,
          keywords TEXT
      );
  - "CREATE INDEX IF NOT EXISTS idx_attachments_feature_layer ON honua.attachments(layer_id, feature_id);"
  - "CREATE INDEX IF NOT EXISTS idx_attachments_created_at ON honua.attachments(created_at);"
  - "CREATE INDEX IF NOT EXISTS idx_attachments_layer_id ON honua.attachments(layer_id);"
  - |
      CREATE TABLE IF NOT EXISTS honua.feature_change_outbox (
          outbox_id        uuid        NOT NULL DEFAULT gen_random_uuid(),
          service_id       text        NOT NULL,
          layer_id         integer     NOT NULL,
          object_id        bigint      NOT NULL,
          operation        text        NOT NULL,
          protocol         text        NOT NULL,
          source_id        text,
          request_id       text        NOT NULL,
          event_id         text        NOT NULL,
          event_payload    jsonb       NOT NULL,
          status           text        NOT NULL DEFAULT 'pending',
          retry_count      integer     NOT NULL DEFAULT 0,
          last_error       text,
          created_at       timestamptz NOT NULL DEFAULT now(),
          claimed_at       timestamptz,
          claim_node_id    text,
          claim_expires_at timestamptz,
          dispatched_at    timestamptz,
          CONSTRAINT feature_change_outbox_pkey PRIMARY KEY (outbox_id),
          CONSTRAINT feature_change_outbox_status_chk CHECK (
              status IN ('pending', 'claimed', 'dispatched', 'failed', 'dead_lettered')
          )
      );
  - "CREATE INDEX IF NOT EXISTS ix_fco_dispatch ON honua.feature_change_outbox (created_at) WHERE status IN ('pending', 'failed');"
  - "CREATE INDEX IF NOT EXISTS ix_fco_claim_recovery ON honua.feature_change_outbox (claim_expires_at) WHERE status = 'claimed';"
  - "CREATE INDEX IF NOT EXISTS ix_fco_dead_lettered ON honua.feature_change_outbox (created_at) WHERE status = 'dead_lettered';"
  - |
      CREATE TABLE IF NOT EXISTS honua.data_connections (
          connection_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          name VARCHAR(64) NOT NULL UNIQUE,
          description TEXT,
          host VARCHAR(255) NOT NULL,
          port INT NOT NULL DEFAULT 5432,
          database_name VARCHAR(64) NOT NULL,
          provider_name TEXT NOT NULL DEFAULT 'postgis',
          username VARCHAR(64) NOT NULL,
          ssl_required BOOLEAN NOT NULL DEFAULT TRUE,
          ssl_mode VARCHAR(16) NOT NULL DEFAULT 'require',
          connection_string_encrypted BYTEA,
          encryption_key_version INT NOT NULL DEFAULT 1,
          secret_ref VARCHAR(255),
          secret_type VARCHAR(32),
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          created_by VARCHAR(64) NOT NULL DEFAULT 'system',
          is_active BOOLEAN NOT NULL DEFAULT TRUE,
          last_health_check TIMESTAMPTZ,
          health_status VARCHAR(16) DEFAULT 'unknown',
          CONSTRAINT chk_secret_or_encrypted CHECK (
              (connection_string_encrypted IS NOT NULL AND secret_ref IS NULL) OR
              (connection_string_encrypted IS NULL AND secret_ref IS NOT NULL)
          ),
          CONSTRAINT chk_ssl_mode CHECK (ssl_mode IN ('disable', 'allow', 'prefer', 'require', 'verify-ca', 'verify-full')),
          CONSTRAINT chk_health_status CHECK (health_status IN ('healthy', 'unhealthy', 'unknown'))
      );
  - "ALTER TABLE IF EXISTS honua.data_connections ADD COLUMN IF NOT EXISTS provider_name TEXT NOT NULL DEFAULT 'postgis';"
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_provider_name ON honua.data_connections(provider_name);"
  - |
      CREATE TABLE IF NOT EXISTS honua.encryption_keys (
          key_version INT PRIMARY KEY,
          key_hash BYTEA NOT NULL,
          algorithm VARCHAR(32) NOT NULL DEFAULT 'AES-256-GCM',
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          created_by VARCHAR(64) NOT NULL DEFAULT 'system',
          is_active BOOLEAN NOT NULL DEFAULT TRUE,
          retired_at TIMESTAMPTZ,
          CONSTRAINT chk_algorithm CHECK (algorithm IN ('AES-256-GCM'))
      );
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_name ON honua.data_connections(name);"
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_host ON honua.data_connections(host, port);"
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_active ON honua.data_connections(is_active) WHERE is_active = TRUE;"
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_secret_ref ON honua.data_connections(secret_ref) WHERE secret_ref IS NOT NULL;"
  - "CREATE INDEX IF NOT EXISTS idx_encryption_keys_active ON honua.encryption_keys(is_active, key_version) WHERE is_active = TRUE;"
  - |
      CREATE TABLE IF NOT EXISTS honua.scene_datasets (
          dataset_id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          id                    VARCHAR(64) NOT NULL,
          name                  VARCHAR(128) NOT NULL,
          description           TEXT,
          asset_root            TEXT NOT NULL,
          tileset_file_name     VARCHAR(64) NOT NULL DEFAULT 'tileset.json',
          dataset_type          VARCHAR(32) NOT NULL DEFAULT 'hosted_tiles',
          extent_xmin           DOUBLE PRECISION,
          extent_ymin           DOUBLE PRECISION,
          extent_xmax           DOUBLE PRECISION,
          extent_ymax           DOUBLE PRECISION,
          crs                   VARCHAR(32),
          cache_max_age_seconds INTEGER NOT NULL DEFAULT 3600,
          cache_no_store        BOOLEAN NOT NULL DEFAULT FALSE,
          edition_gate          VARCHAR(32),
          requires_auth         BOOLEAN NOT NULL DEFAULT FALSE,
          is_public             BOOLEAN NOT NULL DEFAULT TRUE,
          allowed_roles         TEXT[],
          status                VARCHAR(32) NOT NULL DEFAULT 'active',
          validation_message    TEXT,
          revision              INTEGER NOT NULL DEFAULT 1,
          created_at            TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          created_by            VARCHAR(255) NOT NULL,
          updated_at            TIMESTAMPTZ,
          CONSTRAINT scene_datasets_id_unique   UNIQUE (id),
          CONSTRAINT scene_datasets_name_unique UNIQUE (name),
          CONSTRAINT scene_datasets_extent_paired CHECK (
              (extent_xmin IS NULL AND extent_ymin IS NULL AND extent_xmax IS NULL AND extent_ymax IS NULL)
              OR (extent_xmin IS NOT NULL AND extent_ymin IS NOT NULL AND extent_xmax IS NOT NULL AND extent_ymax IS NOT NULL)
          ),
          CONSTRAINT scene_datasets_extent_bounds CHECK (
              extent_xmin IS NULL OR (
                  extent_xmin BETWEEN -180 AND 180
                  AND extent_xmax BETWEEN -180 AND 180
                  AND extent_ymin BETWEEN -90 AND 90
                  AND extent_ymax BETWEEN -90 AND 90
                  AND extent_xmin <= extent_xmax
                  AND extent_ymin <= extent_ymax
              )
          ),
          CONSTRAINT scene_datasets_cache_max_age_range CHECK (cache_max_age_seconds BETWEEN 0 AND 86400),
          CONSTRAINT scene_datasets_access_flags_consistent CHECK (is_public <> requires_auth)
      );
  - "CREATE INDEX IF NOT EXISTS idx_scene_datasets_status ON honua.scene_datasets(status);"
  - "CREATE INDEX IF NOT EXISTS idx_scene_datasets_created_at ON honua.scene_datasets(created_at);"
  - |

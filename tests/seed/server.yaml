      CREATE OR REPLACE FUNCTION honua.track_feature_changes()
      RETURNS TRIGGER AS $$
      DECLARE
          gen BIGINT;
          lid INT;
          oid BIGINT;
          op SMALLINT;
      BEGIN
          gen := nextval('honua.sync_generation');
          IF TG_OP = 'INSERT' THEN
              lid := NEW.layer_id;
              oid := NEW.objectid;
              op := 1;
          ELSIF TG_OP = 'UPDATE' THEN
              lid := NEW.layer_id;
              oid := NEW.objectid;
              op := 2;
          ELSIF TG_OP = 'DELETE' THEN
              lid := OLD.layer_id;
              oid := OLD.objectid;
              op := 3;
          END IF;
          INSERT INTO honua.feature_changes (generation, layer_id, objectid, operation)
          VALUES (gen, lid, oid, op);
          IF TG_OP = 'DELETE' THEN
              RETURN OLD;
          END IF;
          RETURN NEW;
      END;
      $$ LANGUAGE plpgsql;
  - "DROP TRIGGER IF EXISTS trigger_track_feature_changes ON features;"
  - "CREATE TRIGGER trigger_track_feature_changes AFTER INSERT OR UPDATE OR DELETE ON features FOR EACH ROW EXECUTE FUNCTION honua.track_feature_changes();"

  - |
      CREATE TABLE IF NOT EXISTS honua.metadata_indexes (
          resource_id TEXT PRIMARY KEY,
          kind TEXT NOT NULL,
          namespace TEXT NOT NULL,
          name TEXT NOT NULL,
          resource_version BIGINT NOT NULL,
          labels JSONB,

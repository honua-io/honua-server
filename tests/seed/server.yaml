      CREATE OR REPLACE FUNCTION honua.track_feature_changes()
      RETURNS TRIGGER AS $$
      DECLARE
          gen BIGINT;
          lid INT;
          oid BIGINT;
          op SMALLINT;
          ver TEXT;
          ver_uuid UUID;
      BEGIN
          gen := nextval('honua.sync_generation');
          IF TG_OP = 'INSERT' THEN
              lid := NEW.layer_id;
              oid := NEW.objectid;
              op := 1;
          ELSIF TG_OP = 'UPDATE' THEN
              lid := NEW.layer_id;
              oid := NEW.objectid;
              op := 2;
          ELSIF TG_OP = 'DELETE' THEN
              lid := OLD.layer_id;
              oid := OLD.objectid;
              op := 3;
          END IF;
          ver := current_setting('honua.gdb_version', true);
          IF ver IS NULL OR ver = '' THEN
              ver_uuid := NULL;
          ELSE
              ver_uuid := ver::UUID;
          END IF;
          INSERT INTO honua.feature_changes (generation, layer_id, objectid, operation, version_id)
          VALUES (gen, lid, oid, op, ver_uuid);
          IF TG_OP = 'DELETE' THEN
              RETURN OLD;
          END IF;
          RETURN NEW;
      END;
      $$ LANGUAGE plpgsql;

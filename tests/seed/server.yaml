              status IN ('pending', 'claimed', 'dispatched', 'failed', 'dead_lettered')
          )
      );
  - "CREATE INDEX IF NOT EXISTS ix_fco_dispatch ON honua.feature_change_outbox (created_at) WHERE status IN ('pending', 'failed');"
  - "CREATE INDEX IF NOT EXISTS ix_fco_claim_recovery ON honua.feature_change_outbox (claim_expires_at) WHERE status = 'claimed';"
  - "CREATE INDEX IF NOT EXISTS ix_fco_dead_lettered ON honua.feature_change_outbox (created_at) WHERE status = 'dead_lettered';"
  - |
      CREATE TABLE IF NOT EXISTS honua.data_connections (
          connection_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          name VARCHAR(64) NOT NULL UNIQUE,
          description TEXT,
          host VARCHAR(255) NOT NULL,
          port INT NOT NULL DEFAULT 5432,
          database_name VARCHAR(64) NOT NULL,
          provider_name TEXT NOT NULL DEFAULT 'postgis',
          username VARCHAR(64) NOT NULL,
          ssl_required BOOLEAN NOT NULL DEFAULT TRUE,
          ssl_mode VARCHAR(16) NOT NULL DEFAULT 'require',
          connection_string_encrypted BYTEA,
          encryption_key_version INT NOT NULL DEFAULT 1,
          secret_ref VARCHAR(255),
          secret_type VARCHAR(32),
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          created_by VARCHAR(64) NOT NULL DEFAULT 'system',
          is_active BOOLEAN NOT NULL DEFAULT TRUE,
          last_health_check TIMESTAMPTZ,
          health_status VARCHAR(16) DEFAULT 'unknown',
          CONSTRAINT chk_secret_or_encrypted CHECK (
              (connection_string_encrypted IS NOT NULL AND secret_ref IS NULL) OR
              (connection_string_encrypted IS NULL AND secret_ref IS NOT NULL)
          ),
          CONSTRAINT chk_ssl_mode CHECK (ssl_mode IN ('disable', 'allow', 'prefer', 'require', 'verify-ca', 'verify-full')),
          CONSTRAINT chk_health_status CHECK (health_status IN ('healthy', 'unhealthy', 'unknown'))
      );
  - "ALTER TABLE IF EXISTS honua.data_connections ADD COLUMN IF NOT EXISTS provider_name TEXT NOT NULL DEFAULT 'postgis';"
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_provider_name ON honua.data_connections(provider_name);"
  - |
      CREATE TABLE IF NOT EXISTS honua.encryption_keys (
          key_version INT PRIMARY KEY,
          key_hash BYTEA NOT NULL,
          algorithm VARCHAR(32) NOT NULL DEFAULT 'AES-256-GCM',
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          created_by VARCHAR(64) NOT NULL DEFAULT 'system',
          is_active BOOLEAN NOT NULL DEFAULT TRUE,
          retired_at TIMESTAMPTZ,
          CONSTRAINT chk_algorithm CHECK (algorithm IN ('AES-256-GCM'))
      );
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_name ON honua.data_connections(name);"
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_host ON honua.data_connections(host, port);"
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_active ON honua.data_connections(is_active) WHERE is_active = TRUE;"
  - "CREATE INDEX IF NOT EXISTS idx_data_connections_secret_ref ON honua.data_connections(secret_ref) WHERE secret_ref IS NOT NULL;"
  - "CREATE INDEX IF NOT EXISTS idx_encryption_keys_active ON honua.encryption_keys(is_active, key_version) WHERE is_active = TRUE;"
  - |
      CREATE TABLE IF NOT EXISTS honua.scene_datasets (
          dataset_id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          id                    VARCHAR(64) NOT NULL,
          name                  VARCHAR(128) NOT NULL,
          description           TEXT,
          asset_root            TEXT NOT NULL,
          tileset_file_name     VARCHAR(64) NOT NULL DEFAULT 'tileset.json',
          dataset_type          VARCHAR(32) NOT NULL DEFAULT 'hosted_tiles',
          extent_xmin           DOUBLE PRECISION,
          extent_ymin           DOUBLE PRECISION,
          extent_xmax           DOUBLE PRECISION,
          extent_ymax           DOUBLE PRECISION,
          crs                   VARCHAR(32),
          cache_max_age_seconds INTEGER NOT NULL DEFAULT 3600,
          cache_no_store        BOOLEAN NOT NULL DEFAULT FALSE,
          edition_gate          VARCHAR(32),
          requires_auth         BOOLEAN NOT NULL DEFAULT FALSE,
          is_public             BOOLEAN NOT NULL DEFAULT TRUE,
          allowed_roles         TEXT[],
          status                VARCHAR(32) NOT NULL DEFAULT 'active',
          validation_message    TEXT,
          revision              INTEGER NOT NULL DEFAULT 1,
          created_at            TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          created_by            VARCHAR(255) NOT NULL,
          updated_at            TIMESTAMPTZ,
          CONSTRAINT scene_datasets_id_unique   UNIQUE (id),
          CONSTRAINT scene_datasets_name_unique UNIQUE (name),
          CONSTRAINT scene_datasets_extent_paired CHECK (
              (extent_xmin IS NULL AND extent_ymin IS NULL AND extent_xmax IS NULL AND extent_ymax IS NULL)
              OR (extent_xmin IS NOT NULL AND extent_ymin IS NOT NULL AND extent_xmax IS NOT NULL AND extent_ymax IS NOT NULL)
          ),
          CONSTRAINT scene_datasets_extent_bounds CHECK (
              extent_xmin IS NULL OR (
                  extent_xmin BETWEEN -180 AND 180
                  AND extent_xmax BETWEEN -180 AND 180
                  AND extent_ymin BETWEEN -90 AND 90
                  AND extent_ymax BETWEEN -90 AND 90
                  AND extent_xmin <= extent_xmax
                  AND extent_ymin <= extent_ymax
              )
          ),
          CONSTRAINT scene_datasets_cache_max_age_range CHECK (cache_max_age_seconds BETWEEN 0 AND 86400),
          CONSTRAINT scene_datasets_access_flags_consistent CHECK (is_public <> requires_auth)
      );
  - "CREATE INDEX IF NOT EXISTS idx_scene_datasets_status ON honua.scene_datasets(status);"
  - "CREATE INDEX IF NOT EXISTS idx_scene_datasets_created_at ON honua.scene_datasets(created_at);"
  # v1 metadata-graph tables (metadata_resources, metadata_history, metadata_compiled,

version: 1
sql:
  - "CREATE SCHEMA IF NOT EXISTS honua;"
  - |
      CREATE TABLE IF NOT EXISTS honua.services (
          service_name VARCHAR(64) PRIMARY KEY,
          description TEXT NOT NULL DEFAULT '',
          srid INT NOT NULL DEFAULT 4326,
          max_record_count INT NOT NULL DEFAULT 1000,
          supported_formats TEXT[] NOT NULL DEFAULT '{JSON,GeoJSON}',
          capabilities TEXT[] NOT NULL DEFAULT '{Query,Extract}',
          service_extent GEOMETRY,
          created_at TIMESTAMPTZ DEFAULT NOW(),
          updated_at TIMESTAMPTZ DEFAULT NOW()
      );
  - |
      CREATE TABLE IF NOT EXISTS honua.layers (
          layer_id SERIAL PRIMARY KEY,
          layer_name TEXT NOT NULL,
          description TEXT,
          table_name TEXT NOT NULL,
          geometry_type TEXT NOT NULL,
          srid INT NOT NULL DEFAULT 4326,
          extent GEOMETRY(POLYGON, 4326),
          min_scale DOUBLE PRECISION,
          max_scale DOUBLE PRECISION,
          default_visibility BOOLEAN NOT NULL DEFAULT TRUE,
          created_at TIMESTAMPTZ DEFAULT NOW()
      );
  - |
      CREATE TABLE IF NOT EXISTS honua.service_layers (
          service_name VARCHAR(64) NOT NULL REFERENCES honua.services(service_name) ON DELETE CASCADE,
          layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
          layer_order INT NOT NULL,
          PRIMARY KEY (service_name, layer_id),
          UNIQUE (service_name, layer_order)
      );
  - |
      CREATE TABLE IF NOT EXISTS honua.layer_fields (
          layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
          field_name VARCHAR(64) NOT NULL,
          field_type VARCHAR(32) NOT NULL,
          field_order INT NOT NULL,
          max_length INT,
          nullable BOOLEAN NOT NULL DEFAULT TRUE,
          default_value TEXT,
          description TEXT,
          PRIMARY KEY (layer_id, field_name)
      );
  - |
      CREATE TABLE IF NOT EXISTS honua.relationships (
          layer_id INT NOT NULL REFERENCES honua.layers(layer_id) ON DELETE CASCADE,
          relationship_id INT NOT NULL,
          name TEXT NOT NULL,
          related_layer_id INT NOT NULL,
          relationship_type TEXT NOT NULL,
          origin_foreign_key TEXT NOT NULL,
          destination_foreign_key TEXT NOT NULL,
          description TEXT,
          PRIMARY KEY (layer_id, relationship_id)
      );
  - |
      CREATE TABLE IF NOT EXISTS honua.attachments (
          id BIGSERIAL PRIMARY KEY,
          feature_id BIGINT NOT NULL,
          layer_id INT NOT NULL,
          filename TEXT NOT NULL,
          content_type TEXT NOT NULL,
          size BIGINT NOT NULL CHECK (size >= 0),
          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          storage_path TEXT NOT NULL,
          keywords TEXT
      );
  - "CREATE INDEX IF NOT EXISTS idx_attachments_feature_layer ON honua.attachments(layer_id, feature_id);"
  - "CREATE INDEX IF NOT EXISTS idx_attachments_created_at ON honua.attachments(created_at);"
  - "CREATE INDEX IF NOT EXISTS idx_attachments_layer_id ON honua.attachments(layer_id);"
  - |
      CREATE OR REPLACE FUNCTION honua.create_import_table(table_name text)
      RETURNS void
      LANGUAGE plpgsql
      AS $$
      BEGIN
          IF table_name IS NULL OR length(trim(table_name)) = 0 THEN
              RAISE EXCEPTION 'Table name cannot be null or empty';
          END IF;

          IF length(table_name) > 63 THEN
              RAISE EXCEPTION 'Table name exceeds PostgreSQL identifier limit of 63 characters';
          END IF;

          IF table_name !~ '^[a-zA-Z][a-zA-Z0-9_]*$' THEN
              RAISE EXCEPTION 'Table name must start with a letter and contain only letters, digits, and underscores';
          END IF;

          EXECUTE format('DROP TABLE IF EXISTS %I', table_name);
          EXECUTE format(
              'CREATE TABLE %I (id SERIAL PRIMARY KEY, geometry GEOMETRY, properties JSONB, created_at TIMESTAMPTZ DEFAULT NOW())',
              table_name);
          EXECUTE format('CREATE INDEX IF NOT EXISTS %I ON %I USING GIST (geometry)', 'idx_' || table_name || '_geometry', table_name);
          EXECUTE format('CREATE INDEX IF NOT EXISTS %I ON %I USING GIN (properties)', 'idx_' || table_name || '_properties', table_name);
      END;
      $$;
  - |
      CREATE OR REPLACE FUNCTION honua.insert_import_feature(
          table_name text,
          wkb bytea,
          source_srid integer,
          target_srid integer,
          properties jsonb)
      RETURNS void
      LANGUAGE plpgsql
      AS $$
      BEGIN
          EXECUTE format(
              'INSERT INTO %I (geometry, properties) VALUES (ST_Transform(ST_GeomFromWKB($1, $2), $3), $4)',
              table_name)
          USING wkb, source_srid, target_srid, properties;
      END;
      $$;
  - |
      CREATE TABLE IF NOT EXISTS features (
          objectid BIGSERIAL PRIMARY KEY,
          layer_id INT NOT NULL,
          geometry GEOMETRY,
          attributes JSONB,
          created_at TIMESTAMPTZ DEFAULT NOW(),
          updated_at TIMESTAMPTZ DEFAULT NOW()
      );
  - "CREATE INDEX IF NOT EXISTS idx_features_layer_id ON features(layer_id);"
  - "CREATE INDEX IF NOT EXISTS idx_features_geometry ON features USING GIST(geometry);"
  - "CREATE INDEX IF NOT EXISTS idx_features_attributes ON features USING GIN(attributes);"
  - "DELETE FROM honua.relationships;"
  - "DELETE FROM honua.service_layers;"
  - "DELETE FROM honua.layer_fields;"
  - "DELETE FROM honua.layers;"
  - "DELETE FROM honua.services;"
  - "DELETE FROM features WHERE layer_id IN (0, 1, 2);"
